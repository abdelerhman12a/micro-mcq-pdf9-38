<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Practical: Leishmania &amp; Trypanosoma - MCQs</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f3f4f6;color:#111}
.w{max-width:680px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002;margin-bottom:12px}
.bar{height:8px;background:#ddd;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;width:0}
.tag{font-size:12px;color:#666;margin-bottom:6px}
.stem{font-size:18px;line-height:1.4;margin:6px 0 10px}
img.fig{max-width:100%;max-height:340px;display:block;margin:0 auto 10px;border-radius:6px}
button.o{display:block;width:100%;text-align:left;font-size:16px;padding:12px;margin:8px 0;border:2px solid #d1d5db;border-radius:10px;background:#fff}
button.o.ok{border-color:#16a34a;background:#dcfce7}button.o.no{border-color:#dc2626;background:#fee2e2}
.btn{font-size:16px;padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;margin:4px 4px 4px 0}
.btn.g{background:#6b7280}
.ex{background:#eff6ff;border-radius:8px;padding:10px;margin-top:10px;font-size:15px;line-height:1.4}
.src{font-size:12px;color:#555;margin-top:6px}
.top{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.rv{font-size:14px}.ro{padding:6px 8px;margin:3px 0;border-radius:6px;border:1px solid #e5e7eb}.ro.ok{background:#dcfce7;border-color:#16a34a}.ro.no{background:#fee2e2;border-color:#dc2626}button.o.sel{border-color:#2563eb;background:#dbeafe}.grid{display:flex;flex-wrap:wrap;gap:6px}.gi{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#e5e7eb;font-size:13px}.gi.done{background:#93c5fd}.gi.cur{outline:2px solid #111}.btn[disabled]{opacity:.4}button.o.sel.ok{border-color:#16a34a;background:#dcfce7}button.o.sel.no{border-color:#dc2626;background:#fee2e2}
.cg h1{font-size:20px;margin:8px 0}
.cg h2{font-size:17px;margin:18px 0 6px;background:#1e3a8a;color:#fff;padding:6px 8px;border-radius:6px}
.cg .n{background:#fff7ed;border:1px solid #fdba74;border-radius:6px;padding:8px;font-size:14px;margin:8px 0}
.cg .tw{overflow-x:auto;background:#fff;border-radius:6px;box-shadow:0 1px 2px #0002}
.cg table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.cg th{background:#e5e7eb;text-align:left;padding:6px;position:sticky;top:0}
.cg td{padding:6px;border-top:1px solid #e5e7eb;vertical-align:top}
.cg td:first-child{font-weight:600;background:#fefce8;width:26%}
.cg td:nth-child(3){background:#f0fdf4}
.cg a.b{display:inline-block;background:#2563eb;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none;margin:4px 0}
.cg pre{white-space:pre-wrap;background:#fff;padding:8px;border-radius:6px;font-size:12.5px;border:1px solid #e5e7eb}
.cg mark{background:#fde68a}
@media(max-width:760px){.cg table{min-width:0}.cg tr:first-child{display:none}.cg table, .cg tbody, .cg tr, .cg td{display:block;width:auto!important}.cg tr{border-top:6px solid #e5e7eb;padding:4px 0}.cg td{border-top:0;padding:3px 8px}.cg td:before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase}}
</style></head><body><div class="w" id="app"></div>
<script>
const IMG={};
const Q=[{"n": 1, "img": null, "kind": "mcq", "stem": "The larval stage of the following parasite moves in water and is ingested by Cyclops:", "opts": ["Dracunculus medinensis", "Schistosoma mansoni", "Heterophyes heterophyes", "Paragonimus wastermani"], "key": 0, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 2, "img": null, "kind": "mcq", "stem": "Muscle biopsy may be used in diagnosis of", "opts": ["Trichenella spiralis", "Onchocercous volvulus", "Hydatid cyst", "Sparganosis"], "key": 0, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 3, "img": null, "kind": "mcq", "stem": "Knott's technique is a method used in diagnosis of :", "opts": ["Malaria", "Filaria", "Schistosomiasis", "Leishmaniasis."], "key": 1, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 4, "img": null, "kind": "mcq", "stem": "Microfilaria in blood is used in diagnosis of all filarial infections EXCEPT :", "opts": ["Onchocerca volvulus.", "Brugia malayi", "Mansonella ozzardi", "Loa loa."], "key": 0, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 5, "img": null, "kind": "mcq", "stem": "Sowda (black disease) may occur in :", "opts": ["Loa loa", "Leishmania donovani", "flypanasoma cruzi", "Onchoceca volvulus"], "key": 3, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 6, "img": null, "kind": "mcq", "stem": "Mosquito bite may transmit infection with the following worm:", "opts": ["W. bancrofti", "Loa Loa", "medina worm", "Onchocerca volvulus"], "key": 0, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 7, "img": null, "kind": "mcq", "stem": "Chyluria may be present in infection with:", "opts": ["Mansonella ozzardi", "Brugia malayi", "Trichinella spiralis", "Wucheraria bancrofti"], "key": 3, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 8, "img": null, "kind": "mcq", "stem": "Nocturnal periodicity is a characteristic of the microfilariae of:", "opts": ["Onchocercous volvulus.", "Loa loa.", "Wucherera bancrofti.", "Mansonella ozzardi."], "key": 2, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 9, "img": null, "kind": "mcq", "stem": "The habitat of adult worms of Wuchereria bancrofti", "opts": ["Blood vessels.", "Lymphatic tissue.", "Intestinal tract.", "Subcutaneous tissue."], "key": 1, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 10, "img": null, "kind": "mcq", "stem": "Microfilaria of Wuchereria bancrofti is detected in blood film in case of", "opts": ["Tropical pulmonary eosinophilia.", "Acute filariasis", "Elephantiasis.", "All of the above."], "key": 2, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 11, "img": null, "kind": "mcq", "stem": "Immunodiagnostic methods play an important role in the diagnosis of bancroftian filariasis especially in", "opts": ["Chronic infection without microfilaria .", "Tropical pulmonary eosinophilia.", "Prepatent infection.", "All of the above."], "key": 3, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 12, "img": null, "kind": "mcq", "stem": "Tropical pulmonary eosinophilia is characterized by all the following except:", "opts": ["Microfilariae in blood.", "Asthmatic attack.", "Respond to DEC", "Hyper eosinophilia"], "key": 0, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 13, "img": null, "kind": "mcq", "stem": "Vector of Wuchereria bancrofti worm is:", "opts": ["Chrysops", "Culicoides.", "Simulium.", "Culex."], "key": 3, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 14, "img": null, "kind": "mcq", "stem": "Lymphatic of upper limb is the usual habitat of:", "opts": ["Wucheraria Bancrofti", "Brugia malayi", "Onchocerca volvulus"], "key": 1, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 15, "img": null, "kind": "mcq", "stem": "Tropical pulmonary eosinophilia may be found in:", "opts": ["P. malariae", "P. falciparum", "Visceral Leishmania", "W. bancrofti"], "key": 3, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}, {"n": 16, "img": null, "kind": "mcq", "stem": "One of the following is true about W.bancrofti:", "opts": ["There’s diurnal periodicity", "Filariform larva is the diagnostic stage", "DEC is the drug of choice", "It cause blindness"], "key": 2, "exp": "", "src": "All previous exam - Yousef Amr (nem3)"}];

const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='ABCDEF';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Tissue nematodes and filariae (Trichinella, Wuchereria, Loa loa, Onchocerca, Dracunculus) - Yousef Amr previous-exam questions</h2>
<p>${Q.length} exam questions from the file \"All previous exam - Yousef Amr\" (من أسئلة يوسف عمرو), Week 3 topics. Answers are the file's own printed answer key. Tap an answer in practice mode for instant feedback.</p>
<p><b>Practice mode (default):</b> instant feedback after each answer, then a score and \"Retry missed only\".</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,40),'practice')">Practice: 40 random</button>
<p><b>Exam mode (optional):</b> answers come only at the end with your score, a review and \"Retry missed only\".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<p style="margin-top:10px"><a href="index-weeks.html">Back to the all-weeks index</a></p>
</div>`}
function guide(){location.hash='#review';app.innerHTML=`<div class="card"><button class="btn g" onclick="home()">Back to menu</button><button class="btn" onclick="start(Q,'practice')">Start practice: all ${Q.length}</button></div>`+document.getElementById('cgSrc').innerHTML;window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Source: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Source: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
