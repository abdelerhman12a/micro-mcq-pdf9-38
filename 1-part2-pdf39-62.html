const IMG={};
const Q=[{"n": 1, "img": null, "kind": "definition", "stem": "The granules in Corynebacterium that take up methylene blue and give the beaded appearance are called:", "opts": ["Spores", "Capsular polysaccharide granules", "Volutin (metachromatic) granules", "Sulfur granules"], "key": 2, "exp": "Answer: Volutin (metachromatic) granules. Book trigger: \"concentrates mainly in the volutin (metachromatic) granules\".", "src": "PDF 39 (printed 32)"}, {"n": 2, "img": null, "kind": "except", "stem": "Regarding Corynebacterium diphtheriae morphology, all of the following are true EXCEPT:", "opts": ["Club-shaped Gram-positive bacilli", "Bacilli lie at acute angles (Chinese letter appearance)", "Albert stain demonstrates its metachromatic granules", "It forms spores that appear terminal and bulging"], "key": 3, "exp": "Answer: It forms spores that appear terminal and bulging. Book trigger: \"Gram-positive Club-shaped bacilli\". The book describes C. diphtheriae as a non-spore-forming Gram-positive bacillus; terminal bulging spores belong to C. tetani (PDF 51).", "src": "PDF 39 (printed 32)"}, {"n": 3, "img": null, "kind": "association", "stem": "Which of the following is a NON-spore-forming, AEROBIC Gram-positive bacillus in the book's classification?", "opts": ["Listeria", "Lactobacillus", "Propionobacterium", "Clostridium"], "key": 0, "exp": "Answer: Listeria. Book trigger: \"Aerobic ¶ Corynebacterium ¶ Listeria\".", "src": "PDF 39 (printed 32)"}, {"n": 4, "img": null, "kind": "definition", "stem": "Skin and upper respiratory tract commensal Corynebacteria that can infect immunocompromised hosts are called:", "opts": ["Anthracoids", "Diphtheroids", "Saprophytes", "Toxoids"], "key": 1, "exp": "Answer: Diphtheroids. Book trigger: \"Diphtheroids\".", "src": "PDF 39 (printed 32)"}, {"n": 5, "img": null, "kind": "double-clue", "stem": "Which Gram-positive bacillus is fastidious and grows on Loeffler's serum medium AND shows Chinese letter arrangement?", "opts": ["Corynebacterium diphtheriae", "Bacillus anthracis", "Listeria monocytogenes", "Clostridium perfringens"], "key": 0, "exp": "Answer: Corynebacterium diphtheriae. Book trigger: \"Loeffler’s serum medium\".", "src": "PDF 40 (printed 33)"}, {"n": 6, "img": null, "kind": "except", "stem": "Diphtheria toxin is characterized by all of the following EXCEPT:", "opts": ["It inhibits protein synthesis", "It is produced by all strains of C. diphtheriae", "Subunit B binds cellular receptors", "It is antigenic"], "key": 1, "exp": "Answer: It is produced by all strains of C. diphtheriae. Book trigger: \"Produced only by toxigenic strains\". The book says it is produced ONLY by toxigenic strains that acquired the tox gene by phage.", "src": "PDF 40 (printed 33)"}, {"n": 7, "img": null, "kind": "association", "stem": "The tox gene of C. diphtheriae is acquired by the bacterium through:", "opts": ["Plasmid conjugation", "Spore germination", "Capsule formation", "Lysogenization by a phage"], "key": 3, "exp": "Answer: Lysogenization by a phage. Book trigger: \"lysogenized and acquired the tox gene following phage infection\".", "src": "PDF 40 (printed 33)"}, {"n": 8, "img": null, "kind": "association", "stem": "In the diphtheria toxin, which subunit is responsible for binding to cellular receptors?", "opts": ["Subunit A", "Both subunits equally", "Subunit B", "Neither; it enters by phagocytosis"], "key": 2, "exp": "Answer: Subunit B. Book trigger: \"B for binding to cellular receptors and A for activity\".", "src": "PDF 40 (printed 33)"}, {"n": 9, "img": null, "kind": "definition", "stem": "A toxin treated with 0.3% formalin that loses toxicity but keeps antigenicity is called a:", "opts": ["Antitoxin", "Toxoid", "Superantigen", "Endotoxin"], "key": 1, "exp": "Answer: Toxoid. Book trigger: \"0.3% formalin\".", "src": "PDF 40 (printed 33)"}, {"n": 10, "img": null, "kind": "association", "stem": "The primary effect of diphtheria toxin on host cells is:", "opts": ["Increase in cAMP", "Blocking of glycine release", "Blocking of acetylcholine release", "Inhibition of protein synthesis"], "key": 3, "exp": "Answer: Inhibition of protein synthesis. Book trigger: \"It inhibits protein synthesis. This leads to cell necrosis\".", "src": "PDF 40 (printed 33)"}, {"n": 11, "img": null, "kind": "except", "stem": "Regarding the source and transmission of diphtheria, all of the following are true EXCEPT:", "opts": ["Only humans are the source", "Carriers can be throat or nasal", "Animals are the main reservoir", "Transmission is by respiratory droplets"], "key": 2, "exp": "Answer: Animals are the main reservoir. Book trigger: \"Only humans whether infected cases or carriers\". The book says the source is ONLY humans (cases or carriers).", "src": "PDF 41 (printed 34)"}, {"n": 12, "img": null, "kind": "sequence", "stem": "Which sequence describes local diphtheria pathogenesis in the throat in the book?", "opts": ["Local multiplication, inflammation and cell necrosis, fibrinous exudate, adherent pseudomembrane", "Pseudomembrane formation, then local multiplication, then toxemia, then necrosis", "Toxemia, then local multiplication, then fibrinous exudate, then bacteremia", "Bacteremia, then toxin diffusion, then pseudomembrane, then local multiplication"], "key": 0, "exp": "Answer: Local multiplication, inflammation and cell necrosis, fibrinous exudate, adherent pseudomembrane. Book trigger: \"Local multiplication of the organism results in inflammation and cell necrosis\".", "src": "PDF 41 (printed 34)"}, {"n": 13, "img": null, "kind": "double-clue", "stem": "Which membrane is a tough, adherent layer of fibrinous exudate plus necrotic cells that BLEEDS when removed?", "opts": ["Capsule of B. anthracis (polypeptide)", "Black eschar of cutaneous anthrax", "Colonic pseudomembrane covered with pus", "Diphtheria pseudomembrane"], "key": 3, "exp": "Answer: Diphtheria pseudomembrane. Book trigger: \"bleeds upon trying to remove it\". The colonic pseudomembrane of C. difficile is formed of pus and necrotic tissue and the book does not describe it as bleeding on removal.", "src": "PDF 41 (printed 34)"}, {"n": 14, "img": null, "kind": "except", "stem": "Regarding the systemic effect of diphtheria, all of the following are true EXCEPT:", "opts": ["The toxin diffuses to the blood causing toxemia", "The organism invades the blood causing bacteremia", "Cardiac cells are particularly affected", "Peripheral and cranial nerves are affected"], "key": 1, "exp": "Answer: The organism invades the blood causing bacteremia. Book trigger: \"NO bacteremia occurs\". The book states that the organism is NOT invasive and NO bacteremia occurs.", "src": "PDF 41 (printed 34)"}, {"n": 15, "img": null, "kind": "definition", "stem": "Besides paralysis from nerve involvement and heart failure from myocarditis, which complication is listed as a cause of death in diphtheria?", "opts": ["Perforation of the colon", "Intestinal hemorrhage", "Airway obstruction by the pseudomembrane", "Diaphragm spasm from glycine blockade"], "key": 2, "exp": "Answer: Airway obstruction by the pseudomembrane. Book trigger: \"Airway obstruction by pseudomembrane\". The book lists airway obstruction, paralysis from nerve affection, and heart failure from myocarditis.", "src": "PDF 41 (printed 34)"}, {"n": 16, "img": null, "kind": "clinical case", "stem": "A child has pharyngitis, low-grade fever, markedly enlarged cervical nodes and looks severely toxic. A membrane on the tonsils bleeds when removal is tried. Which organism does the book associate with this picture?", "opts": ["Corynebacterium diphtheriae", "Listeria monocytogenes", "Streptococcus pyogenes", "Bacillus cereus"], "key": 0, "exp": "Answer: Corynebacterium diphtheriae. Book trigger: \"Cervical lymph nodes are markedly enlarged (Bull neck appearance)\".", "src": "PDF 41 (printed 34)"}, {"n": 17, "img": null, "kind": "definition", "stem": "The marked cervical lymph node enlargement of diphtheria is called:", "opts": ["Bull neck", "Trismus", "Opisthotonus", "Floppy neck"], "key": 0, "exp": "Answer: Bull neck. Book trigger: \"Bull neck appearance\".", "src": "PDF 41 (printed 34)"}, {"n": 18, "img": null, "kind": "association", "stem": "The incubation period of diphtheria in the book is:", "opts": ["8-24 hours", "24-48 hours", "4-10 days", "2-5 days"], "key": 3, "exp": "Answer: 2-5 days. Book trigger: \"Incubation period: 2-5 days\".", "src": "PDF 41 (printed 34)"}, {"n": 19, "img": null, "kind": "except", "stem": "Regarding the diagnosis of diphtheria, all of the following are true EXCEPT:", "opts": ["The diagnosis is mainly clinical", "The specimen is a throat swab", "Treatment with antitoxin should wait for the lab result", "PCR can detect the tox gene directly"], "key": 2, "exp": "Answer: Treatment with antitoxin should wait for the lab result. Book trigger: \"without waiting for the lab diagnosis\". The book says antitoxin is given immediately to any suspected case WITHOUT waiting for the lab.", "src": "PDF 42 (printed 35)"}, {"n": 20, "img": null, "kind": "association", "stem": "Which media are used to culture C. diphtheriae in the book?", "opts": ["MacConkey and Sabouraud", "Loeffler serum and blood tellurite", "Thayer-Martin and chocolate agar", "Nutrient agar only"], "key": 1, "exp": "Answer: Loeffler serum and blood tellurite. Book trigger: \"Both Loeffler serum and blood tellurite media are used\".", "src": "PDF 42 (printed 35)"}, {"n": 21, "img": null, "kind": "except", "stem": "Toxigenicity tests for C. diphtheriae include all of the following EXCEPT:", "opts": ["Nagler's reaction", "Elek's test", "ELISA", "PCR for tox gene"], "key": 0, "exp": "Answer: Nagler's reaction. Book trigger: \"Elek’s test ¶ B-ELISA\". Nagler's reaction identifies C. perfringens alpha toxin (PDF 55).", "src": "PDF 42 (printed 35)"}, {"n": 22, "img": null, "kind": "double-clue", "stem": "Which test uses serum agar, a filter paper strip with antitoxin and precipitation lines at 45 degrees?", "opts": ["Nagler's reaction", "Elek's test", "Stormy clot reaction", "McFadyean reaction"], "key": 1, "exp": "Answer: Elek's test. Book trigger: \"precipitation lines at a 45° angle\".", "src": "PDF 43 (printed 36)"}, {"n": 23, "img": null, "kind": "association", "stem": "In Elek's test, what is the role of the well-known toxin-producing strain inoculated on the same plate?", "opts": ["Negative control", "Test strain", "Antitoxin source", "Positive control"], "key": 3, "exp": "Answer: Positive control. Book trigger: \"serve as a positive control\".", "src": "PDF 43 (printed 36)"}, {"n": 24, "img": null, "kind": "except", "stem": "Regarding antitoxin treatment of diphtheria, all of the following are true EXCEPT:", "opts": ["It is the cornerstone of treatment", "It is given IV or IM in high doses", "It neutralizes toxin already fixed inside the cells", "It may cause anaphylaxis because it is prepared in animals"], "key": 2, "exp": "Answer: It neutralizes toxin already fixed inside the cells. Book trigger: \"neutralize the free toxin before its attachment to human cells\". The book says it neutralizes FREE toxin before attachment.", "src": "PDF 43 (printed 36)"}, {"n": 25, "img": null, "kind": "association", "stem": "Which precaution does the book list before giving diphtheria antitoxin?", "opts": ["Blood culture and lumbar puncture", "Gram stain of the pseudomembrane", "Sensitivity test and corticosteroids and antihistamines", "Stopping all antibiotics"], "key": 2, "exp": "Answer: Sensitivity test and corticosteroids and antihistamines. Book trigger: \"performing a sensitivity test and injection of corticosteroids and antihistamines\".", "src": "PDF 43 (printed 36)"}, {"n": 26, "img": null, "kind": "association", "stem": "Which antibiotics does the book give in diphtheria to inhibit growth and decrease toxin production?", "opts": ["Ciprofloxacin or doxycycline", "Penicillin or erythromycin", "Ampicillin and gentamycin", "Vancomycin or metronidazole"], "key": 1, "exp": "Answer: Penicillin or erythromycin. Book trigger: \"Penicillin or erythromycin\".", "src": "PDF 43 (printed 36)"}, {"n": 27, "img": null, "kind": "double-clue", "stem": "Which diphtheria carriers' specimens are taken, and how do the lines of diagnosis compare with a case?", "opts": ["Stool only; different lines", "Blood culture only; same lines", "Skin swab; different lines", "Throat and nasal swabs; same lines as a case"], "key": 3, "exp": "Answer: Throat and nasal swabs; same lines as a case. Book trigger: \"Both throat and nasal swabs are obtained\".", "src": "PDF 43 (printed 36)"}, {"n": 28, "img": null, "kind": "association", "stem": "Which vaccine combination contains diphtheria toxoid together with tetanus toxoid and pertussis vaccine?", "opts": ["DTP", "DT", "Pa", "BCG"], "key": 0, "exp": "Answer: DTP. Book trigger: \"with tetanus toxoid and pertussis vaccine (DTP)\".", "src": "PDF 44 (printed 37)"}, {"n": 29, "img": null, "kind": "except", "stem": "Regarding diphtheria vaccination in the book, all of the following are true EXCEPT:", "opts": ["The toxoid is given IM", "Infants receive it at 2, 4, 6, and 18 months", "DTP (killed pertussis) is the preferred vaccine at school age", "A booster is given at school age"], "key": 2, "exp": "Answer: DTP (killed pertussis) is the preferred vaccine at school age. Book trigger: \"DT is only given at school age\". At school age the book gives DT only, because killed pertussis may cause encephalopathy at this age.", "src": "PDF 44 (printed 37)"}, {"n": 30, "img": null, "kind": "double-clue", "stem": "Why is DT, not DTP, given at school age, and which form of pertussis vaccine can be given safely?", "opts": ["Killed pertussis may cause encephalopathy; acellular (Pa)", "Diphtheria toxoid is unsafe; live attenuated", "Tetanus toxoid is unsafe; recombinant", "Pertussis is not a risk; any form"], "key": 0, "exp": "Answer: Killed pertussis may cause encephalopathy; acellular (Pa). Book trigger: \"may lead to encephalopathy at this age\".", "src": "PDF 44 (printed 37)"}, {"n": 31, "img": null, "kind": "association", "stem": "Close contacts of a diphtheria case receive which chemoprophylaxis in the book?", "opts": ["Ciprofloxacin plus antitoxin", "Erythromycin or long-acting penicillin plus a toxoid booster", "Vancomycin plus DT", "Metronidazole plus HTIG"], "key": 1, "exp": "Answer: Erythromycin or long-acting penicillin plus a toxoid booster. Book trigger: \"A course of erythromycin or an injection of long-acting penicillin\".", "src": "PDF 44 (printed 37)"}, {"n": 32, "img": null, "kind": "association", "stem": "Characteristic TUMBLING motility at 22-28 degrees C is shown by:", "opts": ["Corynebacterium diphtheriae", "Clostridium tetani", "Bacillus anthracis", "Listeria monocytogenes"], "key": 3, "exp": "Answer: Listeria monocytogenes. Book trigger: \"characteristic tumbling motility\".", "src": "PDF 44 (printed 37)"}, {"n": 33, "img": null, "kind": "double-clue", "stem": "Which Gram-positive bacillus resembles diphtheria bacilli, is motile at 22-28 degrees C AND grows at 4 degrees C?", "opts": ["Bacillus cereus", "Listeria monocytogenes", "Clostridium botulinum", "Bacillus anthracis"], "key": 1, "exp": "Answer: Listeria monocytogenes. Book trigger: \"fridge temperature 4°C\".", "src": "PDF 44 (printed 37)"}, {"n": 34, "img": null, "kind": "except", "stem": "Regarding the reservoirs and transmission of Listeria, all of the following are true EXCEPT:", "opts": ["Animals are the main reservoir", "It is found in soil and vegetables", "Humans are the only reservoir", "It contaminates dairy products and meat"], "key": 2, "exp": "Answer: Humans are the only reservoir. Book trigger: \"Animals are the main reservoir\". The book names animals, not humans, as the main reservoir.", "src": "PDF 44 (printed 37)"}, {"n": 35, "img": null, "kind": "definition", "stem": "An infection transmitted from animals to humans, such as listeriosis, is called:", "opts": ["Zoonotic", "Nosocomial", "Opportunistic", "Endogenous"], "key": 0, "exp": "Answer: Zoonotic. Book trigger: \"considered a zoonotic infection\".", "src": "PDF 45 (printed 38)"}, {"n": 36, "img": null, "kind": "association", "stem": "Within what time after ingesting contaminated dairy does Listeria gastroenteritis occur?", "opts": ["1-5 hours", "4-10 days", "2-5 days", "Within 48 hours"], "key": 3, "exp": "Answer: Within 48 hours. Book trigger: \"within 48 hours following ingestion\".", "src": "PDF 45 (printed 38)"}, {"n": 37, "img": null, "kind": "double-clue", "stem": "Which Gram-positive bacillus causes abortion or premature labor through placental infection AND neonatal meningitis?", "opts": ["Corynebacterium diphtheriae", "Clostridium difficile", "Bacillus anthracis", "Listeria monocytogenes"], "key": 3, "exp": "Answer: Listeria monocytogenes. Book trigger: \"abortion or premature labor due to placental infection\".", "src": "PDF 45 (printed 38)"}, {"n": 38, "img": null, "kind": "clinical case", "stem": "A pregnant woman who ate soft cheese develops fever and later premature labor. Her newborn has meningitis and septicemia. Which organism does the book link to this?", "opts": ["Listeria monocytogenes", "Clostridium perfringens", "Bacillus cereus", "Corynebacterium diphtheriae"], "key": 0, "exp": "Answer: Listeria monocytogenes. Book trigger: \"Infection in pregnant females may end in abortion or premature labor\".", "src": "PDF 45 (printed 38)"}, {"n": 39, "img": null, "kind": "clinical case", "stem": "An immunocompromised patient who ate contaminated dairy develops bacteremia and meningoencephalitis. The isolate shows tumbling motility. What is it?", "opts": ["Bacillus cereus", "Clostridium botulinum", "Listeria monocytogenes", "Corynebacterium diphtheriae"], "key": 2, "exp": "Answer: Listeria monocytogenes. Book trigger: \"bacteremia and meningoencephalitis\".", "src": "PDF 45 (printed 38)"}, {"n": 40, "img": null, "kind": "definition", "stem": "Keeping specimens at 4 degrees C for days to favor growth of Listeria over other bacteria is called:", "opts": ["Selective enrichment by heat", "Cold enhancement", "Anaerobic culture", "Lysogenization"], "key": 1, "exp": "Answer: Cold enhancement. Book trigger: \"Cold enhancement\".", "src": "PDF 45 (printed 38)"}, {"n": 41, "img": null, "kind": "except", "stem": "Regarding the diagnosis and treatment of listeriosis, all of the following are true EXCEPT:", "opts": ["Cold enhancement helps isolation", "A selective medium is used", "It produces a wide zone of alpha hemolysis on blood agar", "Ampicillin and gentamycin are used for treatment"], "key": 2, "exp": "Answer: It produces a wide zone of alpha hemolysis on blood agar. Book trigger: \"a narrow zone of β hemolysis\". The book says it produces a NARROW zone of beta hemolysis.", "src": "PDF 45 (printed 38)"}, {"n": 42, "img": null, "kind": "association", "stem": "Which drugs does the book use to treat Listeria infection?", "opts": ["Penicillin or erythromycin", "Ampicillin and gentamycin", "Ciprofloxacin", "Vancomycin"], "key": 1, "exp": "Answer: Ampicillin and gentamycin. Book trigger: \"Ampicillin and gentamycin are used for treatment\".", "src": "PDF 45 (printed 38)"}, {"n": 43, "img": null, "kind": "double-clue", "stem": "Which Gram-positive bacillus is spore-forming outside the host, capsulated inside the host, and shows large rectangular bacilli in chains?", "opts": ["Clostridium tetani", "Listeria monocytogenes", "Corynebacterium diphtheriae", "Bacillus anthracis"], "key": 3, "exp": "Answer: Bacillus anthracis. Book trigger: \"Large rectangular Gram-positive bacilli arranged in chains\".", "src": "PDF 46 (printed 39)"}, {"n": 44, "img": null, "kind": "except", "stem": "Regarding the spores of Bacillus anthracis, all of the following are true EXCEPT:", "opts": ["They are terminal and bulging", "They are stained with modified Z.N. stain", "They appear oval non-bulging", "They survive in dry soils for years"], "key": 0, "exp": "Answer: They are terminal and bulging. Book trigger: \"oval non-bulging\". The book says they are oval NON-bulging; the bulging terminal spore is C. tetani.", "src": "PDF 46 (printed 39)"}, {"n": 45, "img": null, "kind": "association", "stem": "The spores of B. anthracis are demonstrated by which stain?", "opts": ["Albert stain", "Modified Ziehl-Neelsen", "Polychrome methylene blue", "Gram stain only"], "key": 1, "exp": "Answer: Modified Ziehl-Neelsen. Book trigger: \"Spores are stained with modified Zeihl-Neelsen\".", "src": "PDF 46 (printed 39)"}, {"n": 46, "img": null, "kind": "definition", "stem": "The mauve-pink capsular halo around blue anthrax bacilli with polychrome methylene blue is called the:", "opts": ["McFadyean reaction", "Nagler's reaction", "Elek's test", "Stormy clot reaction"], "key": 0, "exp": "Answer: McFadyean reaction. Book trigger: \"McFadyean reaction\".", "src": "PDF 46 (printed 39)"}, {"n": 47, "img": null, "kind": "except", "stem": "Regarding the capsule of B. anthracis, all of the following are true EXCEPT:", "opts": ["It can be demonstrated by polychrome methylene blue", "It is seen when the organism is inside the host", "It is polysaccharide in composition", "It is antiphagocytic"], "key": 2, "exp": "Answer: It is polysaccharide in composition. Book trigger: \"The capsule is polypeptide in composition\". The book says the capsule is polypeptide in composition.", "src": "PDF 46 (printed 39)"}, {"n": 48, "img": null, "kind": "double-clue", "stem": "Which colony appearance is non-hemolytic on blood agar and called comet's tail or medusa head?", "opts": ["Clostridium perfringens", "Bacillus cereus", "Listeria monocytogenes", "Bacillus anthracis"], "key": 3, "exp": "Answer: Bacillus anthracis. Book trigger: \"Comet’s tail (medusa head) appearance\".", "src": "PDF 47 (printed 40)"}, {"n": 49, "img": null, "kind": "definition", "stem": "The three proteins of anthrax toxin are protective antigen, edema factor and:", "opts": ["Tetanospasmin", "Lecithinase", "Theta toxin", "Lethal factor"], "key": 3, "exp": "Answer: Lethal factor. Book trigger: \"protective antigen, edema factor, and lethal factor\".", "src": "PDF 47 (printed 40)"}, {"n": 50, "img": null, "kind": "association", "stem": "Which anthrax toxin component is the binding unit that lets the other two factors enter host cells?", "opts": ["Protective antigen", "Edema factor", "Lethal factor", "Capsule"], "key": 0, "exp": "Answer: Protective antigen. Book trigger: \"The protective antigen functions as the binding unit\".", "src": "PDF 47 (printed 40)"}, {"n": 51, "img": null, "kind": "association", "stem": "Edema toxin of B. anthracis is formed by protective antigen plus edema factor and acts as:", "opts": ["Proteolytic enzyme", "Lecithinase", "Adenylate cyclase", "Inhibitor of glycine release"], "key": 2, "exp": "Answer: Adenylate cyclase. Book trigger: \"adenylate cyclase activity causing massive cellular edema\".", "src": "PDF 47 (printed 40)"}, {"n": 52, "img": null, "kind": "association", "stem": "Lethal toxin of B. anthracis (protective antigen plus lethal factor) has which activity?", "opts": ["Adenylate cyclase activity", "Proteolytic activity", "ADP-ribosylation of elongation factor", "Hemolysis of red cells"], "key": 1, "exp": "Answer: Proteolytic activity. Book trigger: \"Lethal toxin: binding of protective antigen with lethal factor\".", "src": "PDF 47 (printed 40)"}, {"n": 53, "img": null, "kind": "except", "stem": "Regarding the anthrax toxin and capsule, all of the following are true EXCEPT:", "opts": ["Protective antigen induces protective antibodies", "Protective antigen is used in vaccination", "Both capsule and toxin are plasmid-mediated", "The toxin gene is chromosomal and the capsule gene is on a phage"], "key": 3, "exp": "Answer: The toxin gene is chromosomal and the capsule gene is on a phage. Book trigger: \"Both the capsule and the toxin are plasmid-mediated\". The book says both are plasmid-mediated.", "src": "PDF 47 (printed 40)"}, {"n": 54, "img": null, "kind": "double-clue", "stem": "Which antigen both induces protective antibodies (hence its name) AND is used in the human vaccine?", "opts": ["Protective antigen", "Edema factor", "Lethal factor", "Capsular polypeptide"], "key": 0, "exp": "Answer: Protective antigen. Book trigger: \"hence its name\".", "src": "PDF 47 (printed 40)"}, {"n": 55, "img": null, "kind": "except", "stem": "Regarding transmission of anthrax, all of the following are true EXCEPT:", "opts": ["Contact with infected animals or their products", "Inhalation of spore-laden dust", "Person-to-person spread is common", "Rarely, ingestion of contaminated meat"], "key": 2, "exp": "Answer: Person-to-person spread is common. Book trigger: \"No human-to-human transmission\". The book says there is NO human-to-human transmission.", "src": "PDF 48 (printed 41)"}, {"n": 56, "img": null, "kind": "clinical case", "stem": "A butcher develops a painless ulcer with a black eschar and massive edema on his forearm after handling hides. Which disease is this?", "opts": ["Tetanus", "Cutaneous anthrax (malignant pustule)", "Gas gangrene", "Diphtheria"], "key": 1, "exp": "Answer: Cutaneous anthrax (malignant pustule). Book trigger: \"painless necrotic ulcer with a black eschar surrounded by massive edema\".", "src": "PDF 48 (printed 41)"}, {"n": 57, "img": null, "kind": "clinical case", "stem": "A worker sorting wool develops rapidly fatal illness with hemorrhagic mediastinitis and septicemia. The most likely clinical form is:", "opts": ["Cutaneous anthrax", "Pulmonary (inhalational) anthrax", "Intestinal anthrax", "Pharyngeal diphtheria"], "key": 1, "exp": "Answer: Pulmonary (inhalational) anthrax. Book trigger: \"Wool sorter disease\".", "src": "PDF 48 (printed 41)"}, {"n": 58, "img": null, "kind": "definition", "stem": "Pulmonary or inhalational anthrax is also known as:", "opts": ["Malignant pustule", "Floppy infant syndrome", "Wool sorter disease", "Bull neck"], "key": 2, "exp": "Answer: Wool sorter disease. Book trigger: \"Wool sorter disease\".", "src": "PDF 48 (printed 41)"}, {"n": 59, "img": null, "kind": "double-clue", "stem": "Which form of anthrax is rare, rapidly fatal and associated with intestinal hemorrhage and septicemia?", "opts": ["Intestinal anthrax", "Cutaneous anthrax", "Inhalational anthrax", "Wound botulism"], "key": 0, "exp": "Answer: Intestinal anthrax. Book trigger: \"Rare form, rapidly fatal, associated with intestinal hemorrhage\".", "src": "PDF 48 (printed 41)"}, {"n": 60, "img": null, "kind": "association", "stem": "Who are the high-risk individuals for anthrax in the book?", "opts": ["Pregnant women", "Hospitalized patients on antibiotics", "Infants under 6 months", "Butchers and veterinarians"], "key": 3, "exp": "Answer: Butchers and veterinarians. Book trigger: \"butchers, veterinarians\".", "src": "PDF 48 (printed 41)"}, {"n": 61, "img": null, "kind": "association", "stem": "Which method gives rapid confirmed diagnosis of anthrax in the book?", "opts": ["Elek's test", "Nagler's reaction", "PCR", "Albert stain"], "key": 2, "exp": "Answer: PCR. Book trigger: \"PCR is used for rapid confirmed diagnosis\".", "src": "PDF 49 (printed 42)"}, {"n": 62, "img": null, "kind": "association", "stem": "What is the drug of choice for anthrax in the book?", "opts": ["Penicillin G", "Ciprofloxacin", "Vancomycin", "Ampicillin and gentamycin"], "key": 1, "exp": "Answer: Ciprofloxacin. Book trigger: \"Ciprofloxacin is the drug of choice\".", "src": "PDF 49 (printed 42)"}, {"n": 63, "img": null, "kind": "except", "stem": "Regarding anthrax prevention, all of the following are true EXCEPT:", "opts": ["Human vaccine contains purified protective antigen", "Animal vaccines use a live attenuated organism", "Postexposure prophylaxis uses ciprofloxacin or doxycycline", "Animal vaccines use a killed organism"], "key": 3, "exp": "Answer: Animal vaccines use a killed organism. Book trigger: \"with a live attenuated organism\". The book says the animal vaccine is a LIVE ATTENUATED organism.", "src": "PDF 49 (printed 42)"}, {"n": 64, "img": null, "kind": "association", "stem": "How are infected animal carcasses disposed of in the book?", "opts": ["Incinerated or buried deeply in lime pits", "Boiled and fed to livestock", "Washed with antibiotics", "Autoclaved only"], "key": 0, "exp": "Answer: Incinerated or buried deeply in lime pits. Book trigger: \"incinerated or burned by deep burial in lime pits\".", "src": "PDF 49 (printed 42)"}, {"n": 65, "img": null, "kind": "association", "stem": "Where must ALL laboratory procedures on suspected anthrax samples be performed?", "opts": ["On an open bench with gloves", "In an anaerobic jar only", "In a biosafety cabinet", "In a refrigerator at 4 degrees C"], "key": 2, "exp": "Answer: In a biosafety cabinet. Book trigger: \"performed in a biosafety cabinet\".", "src": "PDF 49 (printed 42)"}, {"n": 66, "img": null, "kind": "association", "stem": "Bacillus cereus is described in the book as which type of organism?", "opts": ["Saprophytic organism in soil and grains", "Obligate human commensal", "Obligate intracellular pathogen", "Anaerobe of the colon"], "key": 0, "exp": "Answer: Saprophytic organism in soil and grains. Book trigger: \"A saprophytic organism that is present in soil and grains\".", "src": "PDF 50 (printed 43)"}, {"n": 67, "img": null, "kind": "except", "stem": "Regarding the emetic type of B. cereus food poisoning, all of the following are true EXCEPT:", "opts": ["It is linked to reheated fried rice dishes", "It is caused by a heat-stable toxin", "The incubation period is 1-5 hours", "It is caused by a heat-labile enterotoxin"], "key": 3, "exp": "Answer: It is caused by a heat-labile enterotoxin. Book trigger: \"Heat-stable toxin\". The emetic type is caused by a heat-STABLE toxin; the heat-labile enterotoxin causes the diarrheal type.", "src": "PDF 50 (printed 43)"}, {"n": 68, "img": null, "kind": "double-clue", "stem": "Which B. cereus food poisoning is linked to improperly cooked meat dishes AND has an incubation period of 8-24 hours?", "opts": ["Emetic type of B. cereus food poisoning", "Diarrheal type of B. cereus food poisoning", "Botulism", "Tetanus"], "key": 1, "exp": "Answer: Diarrheal type of B. cereus food poisoning. Book trigger: \"Meat dishes\".", "src": "PDF 50 (printed 43)"}, {"n": 69, "img": null, "kind": "association", "stem": "The diarrheal type of B. cereus food poisoning works by:", "opts": ["Irritating the gastric mucosa", "Stimulating intestinal adenylate cyclase", "Blocking acetylcholine release", "Inhibiting protein synthesis"], "key": 1, "exp": "Answer: Stimulating intestinal adenylate cyclase. Book trigger: \"Stimulates intestinal adenylate\".", "src": "PDF 50 (printed 43)"}, {"n": 70, "img": null, "kind": "clinical case", "stem": "Several people develop nausea, vomiting and abdominal cramps 3 hours after eating reheated fried rice. The cause named by the book is:", "opts": ["Clostridium botulinum", "Listeria monocytogenes", "Bacillus cereus emetic type", "Clostridium difficile"], "key": 2, "exp": "Answer: Bacillus cereus emetic type. Book trigger: \"Fried rice dishes\".", "src": "PDF 50 (printed 43)"}, {"n": 71, "img": null, "kind": "except", "stem": "B. cereus can cause all of the following EXCEPT:", "opts": ["Pseudomembranous colitis", "Posttraumatic endophthalmitis", "Osteomyelitis in immunocompromised patients", "Emetic food poisoning"], "key": 0, "exp": "Answer: Pseudomembranous colitis. Book trigger: \"Posttraumatic endophthalmitis and meningitis\". Pseudomembranous colitis is caused by C. difficile.", "src": "PDF 50 (printed 43)"}, {"n": 72, "img": null, "kind": "association", "stem": "Which of the following is true of both types of B. cereus food poisoning in the book?", "opts": ["Treated with antitoxin", "Treated with vancomycin", "Cause bacteremia", "Self-limiting, needing water and electrolyte support"], "key": 3, "exp": "Answer: Self-limiting, needing water and electrolyte support. Book trigger: \"Self-limiting\".", "src": "PDF 50 (printed 43)"}, {"n": 73, "img": null, "kind": "except", "stem": "The genus Clostridium is characterized by all of the following EXCEPT:", "opts": ["Aerobic growth", "Gram-positive spore-forming bacilli", "Anaerobic", "Saprophytes in the environment or the gut"], "key": 0, "exp": "Answer: Aerobic growth. Book trigger: \"Gram-positive spore-forming bacilli\". The book says Clostridium is anaerobic.", "src": "PDF 51 (printed 44)"}, {"n": 74, "img": null, "kind": "association", "stem": "Which clostridial species is matched with pseudomembranous colitis?", "opts": ["C. tetani", "C. perfringens", "C. botulinum", "C. difficile"], "key": 3, "exp": "Answer: C. difficile. Book trigger: \"Pseudomembranou s colitis\".", "src": "PDF 51 (printed 44)"}, {"n": 75, "img": null, "kind": "association", "stem": "Which clostridial species is matched with gas gangrene?", "opts": ["C. tetani", "C. perfringens", "C. botulinum", "C. difficile"], "key": 1, "exp": "Answer: C. perfringens. Book trigger: \"Gas gangrene\".", "src": "PDF 51 (printed 44)"}, {"n": 76, "img": null, "kind": "association", "stem": "A terminal, rounded, bulging spore giving a drum-stick appearance is characteristic of:", "opts": ["Clostridium perfringens", "Bacillus anthracis", "Clostridium tetani", "Clostridium botulinum"], "key": 2, "exp": "Answer: Clostridium tetani. Book trigger: \"drum-stick appearance\".", "src": "PDF 51 (printed 44)"}, {"n": 77, "img": null, "kind": "except", "stem": "Regarding the culture of C. tetani, all of the following are true EXCEPT:", "opts": ["It is an aerobe that grows on nutrient agar", "It is a strict anaerobe", "It can grow on nutrient agar", "Colonies are beta-hemolytic on blood agar"], "key": 0, "exp": "Answer: It is an aerobe that grows on nutrient agar. Book trigger: \"Strict anaerobes\". The book says C. tetani is a STRICT anaerobe.", "src": "PDF 51 (printed 44)"}, {"n": 78, "img": null, "kind": "double-clue", "stem": "Which toxin is plasmid-mediated, protein in nature, formed of subunits A and B AND is called tetanospasmin?", "opts": ["Diphtheria toxin", "Botulinum toxin", "Tetanus toxin", "Alpha toxin"], "key": 2, "exp": "Answer: Tetanus toxin. Book trigger: \"Tetanus toxin (Tetanospasmin)\".", "src": "PDF 51 (printed 44)"}, {"n": 79, "img": null, "kind": "sequence", "stem": "What is the route of tetanus toxin in the book?", "opts": ["Ingested preformed toxin, then absorption, then block of acetylcholine at the neuromuscular junction", "Released in the gut, then blood spread, then inhibition of protein synthesis in the heart", "Inhaled spores, then bacteremia, then mediastinitis", "Released at the wound after spore germination, then retrograde axonal spread to the CNS, then blocks inhibitory transmitters at spinal synapses"], "key": 3, "exp": "Answer: Released at the wound after spore germination, then retrograde axonal spread to the CNS, then blocks inhibitory transmitters at spinal synapses. Book trigger: \"retrograde axonal spread\".", "src": "PDF 52 (printed 45)"}, {"n": 80, "img": null, "kind": "association", "stem": "Tetanospasmin acts on spinal synapses by inhibiting the release of:", "opts": ["Acetylcholine", "Glycine and GABA", "Dopamine and serotonin", "Noradrenaline"], "key": 1, "exp": "Answer: Glycine and GABA. Book trigger: \"glycine and gamma-aminobutyric acid (GABA)\".", "src": "PDF 52 (printed 45)"}, {"n": 81, "img": null, "kind": "double-clue", "stem": "Which toxin causes spastic paralysis by unopposing excitatory transmitters AND stays at the wound site without bacteremia?", "opts": ["Botulinum toxin", "Diphtheria toxin", "Tetanus toxin", "Anthrax lethal toxin"], "key": 2, "exp": "Answer: Tetanus toxin. Book trigger: \"NO BACTEREMIA\".", "src": "PDF 52 (printed 45)"}, {"n": 82, "img": null, "kind": "except", "stem": "Regarding tetanus immunity, all of the following are true EXCEPT:", "opts": ["The toxin has one antigenic type", "The toxin stimulates antitoxin antibodies", "Exposure to a minute amount of toxin gives insufficient antibodies", "Natural infection reliably protects against a second attack"], "key": 3, "exp": "Answer: Natural infection reliably protects against a second attack. Book trigger: \"usually insufficient to protect against a second attack\". The book says the antibodies are usually insufficient against a second attack.", "src": "PDF 52 (printed 45)"}, {"n": 83, "img": null, "kind": "association", "stem": "Which animal represents the main reservoir of C. tetani in the book?", "opts": ["Cattle", "Horses", "Cats", "Fish"], "key": 1, "exp": "Answer: Horses. Book trigger: \"Horses represent the main animal reservoir\".", "src": "PDF 52 (printed 45)"}, {"n": 84, "img": null, "kind": "association", "stem": "The mortality rate of tetanus reaches what figure in neonates in the book?", "opts": ["Up to 90%", "Up to 40%", "Up to 10%", "Less than 1%"], "key": 0, "exp": "Answer: Up to 90%. Book trigger: \"increases to 90% in neonates\".", "src": "PDF 52 (printed 45)"}, {"n": 85, "img": null, "kind": "clinical case", "stem": "A farmer steps on a rusty nail and later develops a locked jaw with painful spasms triggered by light. Which toxin target does the book describe?", "opts": ["Inhibitory neurons in the spinal cord", "Neuromuscular junction acetylcholine release", "Elongation factor 2", "Adenylate cyclase in the gut"], "key": 0, "exp": "Answer: Inhibitory neurons in the spinal cord. Book trigger: \"Spasm of masseter results in a locked jaw or trismus\".", "src": "PDF 53 (printed 46)"}, {"n": 86, "img": null, "kind": "clinical case", "stem": "A newborn whose umbilical cord was cut with a contaminated instrument shows spasms and an arched back. What is the disease?", "opts": ["Infant botulism", "Neonatal listeriosis", "Diphtheria", "Tetanus neonatorum"], "key": 3, "exp": "Answer: Tetanus neonatorum. Book trigger: \"This results in tetanus neonatorum\".", "src": "PDF 52 (printed 45)"}, {"n": 87, "img": null, "kind": "definition", "stem": "The arched back caused by spasm of back extensors in tetanus is called:", "opts": ["Trismus", "Opisthotonus", "Bull neck", "Floppy infant"], "key": 1, "exp": "Answer: Opisthotonus. Book trigger: \"opisthotonus and arched back\".", "src": "PDF 53 (printed 46)"}, {"n": 88, "img": null, "kind": "except", "stem": "Regarding the muscle effects of tetanus, all of the following are true EXCEPT:", "opts": ["Paralysis is spastic and descending", "It starts in the masseter", "Paralysis is flaccid and ascending", "Death occurs due to respiratory paralysis"], "key": 2, "exp": "Answer: Paralysis is flaccid and ascending. Book trigger: \"Spastic muscle paralysis that starts in the masseter\". The book says tetanus paralysis is SPASTIC and DESCENDING; flaccid paralysis is botulism.", "src": "PDF 53 (printed 46)"}, {"n": 89, "img": null, "kind": "except", "stem": "Regarding tetanus treatment, all of the following are true EXCEPT:", "opts": ["Antitoxin is given as early as possible", "Human tetanus immunoglobulin is preferred to avoid anaphylaxis", "Equine antitoxin is preferred over human immunoglobulin", "Large doses are given IM"], "key": 2, "exp": "Answer: Equine antitoxin is preferred over human immunoglobulin. Book trigger: \"Human tetanus immunoglobulins (HTIG) is preferred\". HTIG is preferred to horse-prepared antitoxin.", "src": "PDF 53 (printed 46)"}, {"n": 90, "img": null, "kind": "association", "stem": "Which antibiotics does the book give in tetanus to decrease toxin production?", "opts": ["Penicillin G or metronidazole", "Ampicillin and gentamycin", "Ciprofloxacin", "Erythromycin only"], "key": 0, "exp": "Answer: Penicillin G or metronidazole. Book trigger: \"penicillin G or metronidazole\".", "src": "PDF 54 (printed 47)"}, {"n": 91, "img": null, "kind": "association", "stem": "Tetanus vaccine is prepared by adding what to tetanus toxin?", "opts": ["Phenol", "Heat at 100 degrees C", "Hydrogen peroxide", "0.3% formalin"], "key": 3, "exp": "Answer: 0.3% formalin. Book trigger: \"adding 0.3% formalin to tetanus toxin\".", "src": "PDF 54 (printed 47)"}, {"n": 92, "img": null, "kind": "association", "stem": "Passive-active prophylaxis after injury in a susceptible person is given how?", "opts": ["Toxoid and HTIG mixed in one syringe", "Toxoid and HTIG IM at two different sites", "Antibiotics only", "HTIG IV only"], "key": 1, "exp": "Answer: Toxoid and HTIG IM at two different sites. Book trigger: \"at two different sites\".", "src": "PDF 54 (printed 47)"}, {"n": 93, "img": null, "kind": "clinical case", "stem": "An injured man was vaccinated 7 years ago. Per Table 1.5, what is given?", "opts": ["Antitetanic serum only", "Toxoid booster only", "Both serum and toxoid", "Nothing"], "key": 1, "exp": "Answer: Toxoid booster only. Book trigger: \"History of vaccination 5-10 years ago\".", "src": "PDF 54 (printed 47)"}, {"n": 94, "img": null, "kind": "clinical case", "stem": "An injured man last had tetanus vaccination more than 10 years ago. What does the book give?", "opts": ["Toxoid booster only", "Antitetanic serum only", "Antitetanic serum and toxoid booster", "Nothing"], "key": 2, "exp": "Answer: Antitetanic serum and toxoid booster. Book trigger: \"Vaccination > 10 years ago\".", "src": "PDF 54 (printed 47)"}, {"n": 95, "img": null, "kind": "clinical case", "stem": "An injured man was vaccinated 3 years ago. According to Table 1.5:", "opts": ["Toxoid booster only", "Antitetanic serum only", "Both serum and booster", "No serum and no booster are needed"], "key": 3, "exp": "Answer: No serum and no booster are needed. Book trigger: \"History of vaccination within 5 years\".", "src": "PDF 54 (printed 47)"}, {"n": 96, "img": null, "kind": "association", "stem": "Brick-shaped Gram-positive bacilli with non-bulging subterminal oval spores, non-motile and capsulated in host tissue, are:", "opts": ["Clostridium perfringens", "Clostridium tetani", "Bacillus anthracis", "Clostridium botulinum"], "key": 0, "exp": "Answer: Clostridium perfringens. Book trigger: \"Gram-positive brick-shape bacilli\".", "src": "PDF 55 (printed 48)"}, {"n": 97, "img": null, "kind": "except", "stem": "Regarding C. perfringens in the lab, all of the following are true EXCEPT:", "opts": ["It is anaerobic", "It is motile with peritrichous flagella", "It shows double zones of hemolysis on blood agar", "It is non-motile and capsulated in host tissue"], "key": 1, "exp": "Answer: It is motile with peritrichous flagella. Book trigger: \"Non-motile and capsulated in host tissue\". The book says it is NON-motile.", "src": "PDF 55 (printed 48)"}, {"n": 98, "img": null, "kind": "definition", "stem": "The identification test based on excess gas production from sugar fermentation by C. perfringens is the:", "opts": ["Stormy clot reaction", "Nagler's reaction", "Elek's test", "McFadyean reaction"], "key": 0, "exp": "Answer: Stormy clot reaction. Book trigger: \"stormy clot reaction\".", "src": "PDF 55 (printed 48)"}, {"n": 99, "img": null, "kind": "association", "stem": "Nagler's reaction identifies which C. perfringens product?", "opts": ["Theta toxin", "Hyaluronidase", "Alpha toxin (lecithinase)", "Enterotoxin"], "key": 2, "exp": "Answer: Alpha toxin (lecithinase). Book trigger: \"Nagler’s reaction\".", "src": "PDF 55 (printed 48)"}, {"n": 100, "img": null, "kind": "double-clue", "stem": "Which C. perfringens toxin is a lecithinase, is essential for pathogenesis AND is the basis of Nagler's reaction?", "opts": ["Theta toxin", "Enterotoxin", "Tetanospasmin", "Alpha toxin"], "key": 3, "exp": "Answer: Alpha toxin. Book trigger: \"Produces alpha toxin, a lecithinase\".", "src": "PDF 55 (printed 48)"}, {"n": 101, "img": null, "kind": "definition", "stem": "The most important toxin of C. perfringens, which dissolves cell membranes causing cell death and necrosis, is the:", "opts": ["Theta toxin", "Alpha toxin", "Lethal factor", "Toxin B"], "key": 1, "exp": "Answer: Alpha toxin. Book trigger: \"Alpha toxin: the most important\".", "src": "PDF 56 (printed 49)"}, {"n": 102, "img": null, "kind": "association", "stem": "Which C. perfringens toxin has hemolytic and necrotizing effects?", "opts": ["Alpha toxin", "Edema factor", "Theta toxin", "Toxin A"], "key": 2, "exp": "Answer: Theta toxin. Book trigger: \"Theta toxin: has a hemolytic and necrotizing effect\".", "src": "PDF 56 (printed 49)"}, {"n": 103, "img": null, "kind": "except", "stem": "According to the book's list, C. perfringens enzymes include all of the following EXCEPT:", "opts": ["Hyaluronidase", "DNase", "Collagenase", "Coagulase"], "key": 3, "exp": "Answer: Coagulase. Book trigger: \"hyaluronidase, DNase, collagenase, and protease\". Coagulase is not in the book's list for C. perfringens.", "src": "PDF 56 (printed 49)"}, {"n": 104, "img": null, "kind": "association", "stem": "Endogenous gas gangrene arises from:", "opts": ["Intestinal flora following intestinal injury", "Soil contamination of a wound", "Contaminated canned food", "Contaminated dairy products"], "key": 0, "exp": "Answer: Intestinal flora following intestinal injury. Book trigger: \"Endogenous from intestinal flora following intestinal injury\".", "src": "PDF 56 (printed 49)"}, {"n": 105, "img": null, "kind": "association", "stem": "Which mode of transmission introduces C. perfringens spores into the tissues in the book?", "opts": ["Massive trauma, e.g., car accidents or war injuries", "Ingestion of honey", "Droplet infection", "Contaminated dairy products"], "key": 0, "exp": "Answer: Massive trauma, e.g., car accidents or war injuries. Book trigger: \"Massive trauma e.g., car accidents or war injuries\".", "src": "PDF 56 (printed 49)"}, {"n": 106, "img": null, "kind": "sequence", "stem": "Which sequence of gas gangrene pathogenesis matches the book?", "opts": ["Toxin release, then spore germination, then ischemia, then gas formation", "Gas formation, then ischemia, then spore germination, then toxin release", "Tissue ischemia favors spore germination, vegetative forms release toxins and enzymes, sugar fermentation releases gas that presses on vessels causing more ischemia, enzymes spread the infection", "Spore germination, then gas formation, then blood supply increase, then enzyme release"], "key": 2, "exp": "Answer: Tissue ischemia favors spore germination, vegetative forms release toxins and enzymes, sugar fermentation releases gas that presses on vessels causing more ischemia, enzymes spread the infection. Book trigger: \"Tissue ischemia and cut of blood supply favor the germination of clostridia spores\".", "src": "PDF 56 (printed 49)"}, {"n": 107, "img": null, "kind": "except", "stem": "Regarding the pathogenesis of gas gangrene, all of the following are true EXCEPT:", "opts": ["Ischemia favors spore germination", "Gases press on blood vessels causing more ischemia", "Released enzymes help spread the infection", "The infection is usually monomicrobial with C. perfringens only"], "key": 3, "exp": "Answer: The infection is usually monomicrobial with C. perfringens only. Book trigger: \"Infection is usually polymicrobial\". The book says infection is usually POLYMICROBIAL.", "src": "PDF 56 (printed 49)"}, {"n": 108, "img": null, "kind": "association", "stem": "Tissues turn black in gas gangrene because:", "opts": ["Anthrax eschar forms", "Proteolytic clostridia decompose and digest the tissues", "Bacteremia deposits pigment", "Toxoid coats the tissue"], "key": 1, "exp": "Answer: Proteolytic clostridia decompose and digest the tissues. Book trigger: \"proteolytic clostridia start to decompose and digest the tissues turning their color into black\".", "src": "PDF 57 (printed 50)"}, {"n": 109, "img": null, "kind": "double-clue", "stem": "Which condition progresses as cellulitis with severe pain, then necrotizing fasciitis, then black foul-smelling tissue with crepitations?", "opts": ["Cutaneous anthrax", "Tetanus", "Gas gangrene", "Diphtheria"], "key": 2, "exp": "Answer: Gas gangrene. Book trigger: \"severe intolerable pain that progresses rapidly to necrotizing fasciitis\".", "src": "PDF 57 (printed 50)"}, {"n": 110, "img": null, "kind": "clinical case", "stem": "After a war injury, a patient has severe pain, black foul-smelling tissue with crepitations, hypotension and multiorgan failure. Which organism does the book link?", "opts": ["Clostridium perfringens", "Clostridium tetani", "Bacillus anthracis", "Clostridium botulinum"], "key": 0, "exp": "Answer: Clostridium perfringens. Book trigger: \"tissues are black, have a foul smell, and show crepitations\".", "src": "PDF 57 (printed 50)"}, {"n": 111, "img": null, "kind": "association", "stem": "What does the Gram stain of exudate from gas gangrene show regarding pus cells?", "opts": ["Bacilli with many polymorphonuclear cells", "Cocci in chains with many PMNs", "Only yeast cells", "Bacilli with NO polymorphonuclear cells"], "key": 3, "exp": "Answer: Bacilli with NO polymorphonuclear cells. Book trigger: \"with NO polymorphonuclear cells (PLNs)\".", "src": "PDF 57 (printed 50)"}, {"n": 112, "img": null, "kind": "association", "stem": "Why are PMNs absent in the Gram smear of gas gangrene exudate?", "opts": ["They migrate to the blood", "They are killed by microbial toxins", "They are removed by washing", "They are replaced by lymphocytes"], "key": 1, "exp": "Answer: They are killed by microbial toxins. Book trigger: \"PLNs are killed by microbial toxins\".", "src": "PDF 57 (printed 50)"}, {"n": 113, "img": null, "kind": "association", "stem": "From where should the specimen be taken in gas gangrene?", "opts": ["Exudates or dead tissue from the advancing margin of the lesion", "Blood only", "Throat swab", "Stool"], "key": 0, "exp": "Answer: Exudates or dead tissue from the advancing margin of the lesion. Book trigger: \"from the advancing margin of the lesion\".", "src": "PDF 57 (printed 50)"}, {"n": 114, "img": null, "kind": "association", "stem": "How is gas gangrene exudate cultivated in the book?", "opts": ["One MacConkey plate aerobically", "Two blood agar plates, one aerobic and one anaerobic", "Loeffler's serum only", "Blood tellurite only"], "key": 1, "exp": "Answer: Two blood agar plates, one aerobic and one anaerobic. Book trigger: \"two blood agar plates, one is incubated aerobically and the other anaerobically\".", "src": "PDF 57 (printed 50)"}, {"n": 115, "img": null, "kind": "except", "stem": "Regarding treatment of gas gangrene, all of the following are true EXCEPT:", "opts": ["Surgical debridement is mandatory, up to amputation", "Vancomycin is the drug of choice", "Anti-alpha toxin preparations are strongly effective", "Hyperbaric oxygen may detoxify the patient"], "key": 2, "exp": "Answer: Anti-alpha toxin preparations are strongly effective. Book trigger: \"Anti-alpha toxin preparations are of doubtful effect\". The book says they are of DOUBTFUL effect.", "src": "PDF 58 (printed 51)"}, {"n": 116, "img": null, "kind": "association", "stem": "Which drug is the drug of choice for gas gangrene in the book?", "opts": ["Ciprofloxacin", "Ampicillin", "Erythromycin", "Vancomycin"], "key": 3, "exp": "Answer: Vancomycin. Book trigger: \"vancomycin is the drug of choice\".", "src": "PDF 58 (printed 51)"}, {"n": 117, "img": null, "kind": "double-clue", "stem": "Which food poisoning follows reheated, improperly cooked meat, has an incubation of 8-24 hours and causes diarrhea and cramps WITHOUT fever?", "opts": ["Emetic B. cereus food poisoning", "Botulism", "Clostridium perfringens food poisoning", "Listeria gastroenteritis"], "key": 2, "exp": "Answer: Clostridium perfringens food poisoning. Book trigger: \"without fever\". Listeria gastroenteritis in the book includes fever.", "src": "PDF 58 (printed 51)"}, {"n": 118, "img": null, "kind": "except", "stem": "Regarding C. perfringens food poisoning, all of the following are true EXCEPT:", "opts": ["It is treated with antitoxin", "Some strains produce an enterotoxin in the small intestine", "The incubation period is 8-24 hours", "It is self-limiting"], "key": 0, "exp": "Answer: It is treated with antitoxin. Book trigger: \"The condition is self-limiting\". The book says only water and electrolyte adjustments are needed.", "src": "PDF 58 (printed 51)"}, {"n": 119, "img": null, "kind": "association", "stem": "Which Clostridium causes the fatal food poisoning termed botulism?", "opts": ["Clostridium difficile", "Clostridium botulinum", "Clostridium tetani", "Clostridium perfringens"], "key": 1, "exp": "Answer: Clostridium botulinum. Book trigger: \"termed “botulism”\".", "src": "PDF 58 (printed 51)"}, {"n": 120, "img": null, "kind": "except", "stem": "Regarding the source of C. botulinum, all of the following are true EXCEPT:", "opts": ["It lives as a saprophyte in water and soil", "It inhabits the intestines of domestic animals", "It contaminates vegetables and fish", "It lives only in the human colon"], "key": 3, "exp": "Answer: It lives only in the human colon. Book trigger: \"saprophyte in the environment\". The book says it is a saprophyte in water and soil and in domestic animals' intestines.", "src": "PDF 58 (printed 51)"}, {"n": 121, "img": null, "kind": "association", "stem": "Under which condition do C. botulinum spores germinate and release toxin in food?", "opts": ["Aerobic storage in a refrigerator", "Boiling for several minutes", "Exposure to light", "Strict anaerobic conditions in improperly sterilized food"], "key": 3, "exp": "Answer: Strict anaerobic conditions in improperly sterilized food. Book trigger: \"kept under strict anaerobic conditions\".", "src": "PDF 58 (printed 51)"}, {"n": 122, "img": null, "kind": "association", "stem": "Which food type is named in Egypt as a classic botulism source?", "opts": ["Fried rice", "Feseekh (salted fish)", "Soft cheese", "Rare steak"], "key": 1, "exp": "Answer: Feseekh (salted fish). Book trigger: \"Feseekh in Egypt\".", "src": "PDF 59 (printed 52)"}, {"n": 123, "img": null, "kind": "clinical case", "stem": "After eating home-canned green beans, a man develops diplopia, dysphagia and dysarthria with no fever. Which toxin action does the book describe?", "opts": ["Blocking glycine release in the spinal cord", "Inhibition of protein synthesis", "Inhibition of acetylcholine release at the neuromuscular junction", "Increase of intestinal cAMP"], "key": 2, "exp": "Answer: Inhibition of acetylcholine release at the neuromuscular junction. Book trigger: \"double vision (diplopia), difficulty swallowing (dysphagia)\".", "src": "PDF 59 (printed 52)"}, {"n": 124, "img": null, "kind": "association", "stem": "Infant botulism is linked in the book to ingestion of certain types of:", "opts": ["Honey in infants younger than 6 months", "Soft cheese", "Canned tuna", "Rice"], "key": 0, "exp": "Answer: Honey in infants younger than 6 months. Book trigger: \"honey in infants younger than 6 months\".", "src": "PDF 59 (printed 52)"}, {"n": 125, "img": null, "kind": "definition", "stem": "Botulism from contamination of a surgical wound or skin popping in drug addicts is called:", "opts": ["Infant botulism", "Wound botulism", "Classic botulism", "Tetanus neonatorum"], "key": 1, "exp": "Answer: Wound botulism. Book trigger: \"skin popping\".", "src": "PDF 59 (printed 52)"}, {"n": 126, "img": null, "kind": "association", "stem": "How many antigenic types does botulinum toxin have in the book?", "opts": ["1", "3", "10", "7 (A-G)"], "key": 3, "exp": "Answer: 7 (A-G). Book trigger: \"7 antigenic types A-G\".", "src": "PDF 59 (printed 52)"}, {"n": 127, "img": null, "kind": "except", "stem": "Regarding botulinum toxin, all of the following are true EXCEPT:", "opts": ["It is relatively heat-labile", "It is inactivated by boiling for several minutes", "It changes the odor and taste of food", "It is rapidly absorbed upon ingestion"], "key": 2, "exp": "Answer: It changes the odor and taste of food. Book trigger: \"does not change the odor or the taste of food\". The book says it does NOT change odor or taste.", "src": "PDF 59 (printed 52)"}, {"n": 128, "img": null, "kind": "double-clue", "stem": "Which neurotoxin inhibits acetylcholine release at the neuromuscular junction AND causes FLACCID paralysis starting in cranial nerve muscles?", "opts": ["Botulinum toxin", "Tetanus toxin", "Diphtheria toxin", "Anthrax lethal toxin"], "key": 0, "exp": "Answer: Botulinum toxin. Book trigger: \"This results in flaccid paralysis\".", "src": "PDF 59 (printed 52)"}, {"n": 129, "img": null, "kind": "association", "stem": "One microgram of botulinum toxin can kill an adult of what weight, according to the book?", "opts": ["40 kg", "60 kg", "90 kg", "10 kg"], "key": 1, "exp": "Answer: 60 kg. Book trigger: \"kill an adult weighing 60 Kg\".", "src": "PDF 59 (printed 52)"}, {"n": 130, "img": null, "kind": "sequence", "stem": "Which sequence of paralysis in botulism matches the book?", "opts": ["Respiratory muscles first, then limbs, then cranial nerve muscles", "Limb muscles first, then ascending to the face", "Masseter first, then back, then limbs", "Muscles supplied by cranial nerves, then descending to other muscles, then respiratory muscles"], "key": 3, "exp": "Answer: Muscles supplied by cranial nerves, then descending to other muscles, then respiratory muscles. Book trigger: \"starts in muscles supplied by cranial nerves and then descends\". The tetanus sequence also descends from the masseter, but tetanus is spastic and botulism is flaccid.", "src": "PDF 59 (printed 52)"}, {"n": 131, "img": null, "kind": "association", "stem": "The incubation period of botulism is:", "opts": ["2-5 days", "8-24 hours", "24-48 hours", "4-10 days"], "key": 2, "exp": "Answer: 24-48 hours. Book trigger: \"Incubation period: 24-48 hours\".", "src": "PDF 59 (printed 52)"}, {"n": 132, "img": null, "kind": "double-clue", "stem": "Which clinical picture is a floppy infant with no fever and no prominent diarrhea or vomiting?", "opts": ["Infant botulism", "Tetanus neonatorum", "Neonatal listeriosis", "Diphtheria"], "key": 0, "exp": "Answer: Infant botulism. Book trigger: \"floppy infant syndrome\".", "src": "PDF 60 (printed 53)"}, {"n": 133, "img": null, "kind": "association", "stem": "What must be done urgently in botulism before the lab diagnosis?", "opts": ["Surgical debridement", "Antibiotic chemoprophylaxis", "Respiratory support", "Vaccination"], "key": 2, "exp": "Answer: Respiratory support. Book trigger: \"Respiratory support is urgently needed before lab diagnosis\".", "src": "PDF 60 (printed 53)"}, {"n": 134, "img": null, "kind": "association", "stem": "Which test is used on serum, stool, vomitus and food remnants to detect botulinum toxin?", "opts": ["Elek's test", "ELISA", "Nagler's reaction", "Albert stain"], "key": 1, "exp": "Answer: ELISA. Book trigger: \"tested for botulinum toxin using ELISA\".", "src": "PDF 60 (printed 53)"}, {"n": 135, "img": null, "kind": "except", "stem": "Regarding botulism treatment, all of the following are true EXCEPT:", "opts": ["Antitoxins are given orally", "Respiratory support", "Antitoxins are given IV", "Antitoxins are best given within the first 12 hours"], "key": 0, "exp": "Answer: Antitoxins are given orally. Book trigger: \"Anti-toxins are given IV preferably within the first 12 hours\". The book says they are given IV.", "src": "PDF 60 (printed 53)"}, {"n": 136, "img": null, "kind": "association", "stem": "According to the book, a commercial preparation of botulinum exotoxin (Botox) is injected to treat:", "opts": ["Antibiotic-associated diarrhea", "Toxic megacolon", "Gas gangrene", "Spasmodic muscle disorders such as torticollis"], "key": 3, "exp": "Answer: Spasmodic muscle disorders such as torticollis. Book trigger: \"spasmodic muscle disorders\".", "src": "PDF 60 (printed 53)"}, {"n": 137, "img": null, "kind": "association", "stem": "Which clostridium is the most common cause of antibiotic-associated diarrhea in hospitalized patients?", "opts": ["Clostridium perfringens", "Clostridium tetani", "Clostridium difficile", "Clostridium botulinum"], "key": 2, "exp": "Answer: Clostridium difficile. Book trigger: \"most common cause of antibiotic-associated diarrhea\".", "src": "PDF 61 (printed 54)"}, {"n": 138, "img": null, "kind": "association", "stem": "What fraction of hospitalized patients carry C. difficile in the gut in the book?", "opts": ["3%", "30%", "60%", "90%"], "key": 1, "exp": "Answer: 30%. Book trigger: \"This ratio jumps to 30% in hospitalized patients\".", "src": "PDF 61 (printed 54)"}, {"n": 139, "img": null, "kind": "except", "stem": "Regarding the transmission of C. difficile, all of the following are true EXCEPT:", "opts": ["It is spread by hands of healthcare workers", "It is spread by contaminated surfaces", "It spreads by the fecal-oral route", "It is transmitted by the respiratory route"], "key": 3, "exp": "Answer: It is transmitted by the respiratory route. Book trigger: \"Transmission occurs by fecal-oral route\". The book says fecal-oral.", "src": "PDF 61 (printed 54)"}, {"n": 140, "img": null, "kind": "sequence", "stem": "In C. difficile infection, what is the order of events?", "opts": ["Prolonged broad-spectrum antibiotics, sensitive flora decrease, C. difficile multiplies and secretes toxins A and B, pseudomembranous colitis", "Toxins A and B release, then antibiotics, then flora decrease, then multiplication", "Colitis, then antibiotics, then toxins, then multiplication", "Flora increase, then toxin secretion, then antibiotics, then colitis"], "key": 0, "exp": "Answer: Prolonged broad-spectrum antibiotics, sensitive flora decrease, C. difficile multiplies and secretes toxins A and B, pseudomembranous colitis. Book trigger: \"sensitive members of the flora decrease in number\".", "src": "PDF 61 (printed 54)"}, {"n": 141, "img": null, "kind": "association", "stem": "Which C. difficile toxin is an enterotoxin causing watery diarrhea by fluid and electrolyte loss?", "opts": ["Toxin B", "Toxin A", "Alpha toxin", "Theta toxin"], "key": 1, "exp": "Answer: Toxin A. Book trigger: \"Toxin A: enterotoxin\".", "src": "PDF 61 (printed 54)"}, {"n": 142, "img": null, "kind": "association", "stem": "Which C. difficile toxin is a cytotoxin causing necrosis of the colonic mucosa?", "opts": ["Toxin B", "Toxin A", "Alpha toxin", "Tetanospasmin"], "key": 0, "exp": "Answer: Toxin B. Book trigger: \"Toxin B: cytotoxin\".", "src": "PDF 61 (printed 54)"}, {"n": 143, "img": null, "kind": "double-clue", "stem": "Which toxin causes mucosal necrosis and possibly BLOODY diarrhea, forming a pseudomembrane of pus and necrotic tissue?", "opts": ["C. difficile toxin A", "B. cereus heat-labile enterotoxin", "C. difficile toxin B", "C. perfringens enterotoxin"], "key": 2, "exp": "Answer: C. difficile toxin B. Book trigger: \"may result in bloody diarrhea\".", "src": "PDF 61 (printed 54)"}, {"n": 144, "img": null, "kind": "association", "stem": "Fatal pseudomembranous colitis can result from development of:", "opts": ["Myocarditis", "Diaphragm spasm", "Airway obstruction", "Toxic megacolon"], "key": 3, "exp": "Answer: Toxic megacolon. Book trigger: \"toxic megacolon\".", "src": "PDF 61 (printed 54)"}, {"n": 145, "img": null, "kind": "except", "stem": "Regarding C. difficile, all of the following are true EXCEPT:", "opts": ["It is part of the gut flora in about 3% of the population", "It is killed by broad-spectrum antibiotics", "It may be endogenous or exogenous", "It secretes exotoxins A and B"], "key": 1, "exp": "Answer: It is killed by broad-spectrum antibiotics. Book trigger: \"C. difficile can resist several antimicrobials\". The book says it can RESIST several antimicrobials.", "src": "PDF 61 (printed 54)"}, {"n": 146, "img": null, "kind": "clinical case", "stem": "A hospitalized patient develops watery diarrhea, fever and cramps 7 days after clindamycin. Colonoscopy shows a pseudomembrane. Most likely cause per the book:", "opts": ["Clostridium difficile", "Clostridium perfringens", "Bacillus cereus", "Listeria monocytogenes"], "key": 0, "exp": "Answer: Clostridium difficile. Book trigger: \"4 to 10 days following broad-spectrum antibiotic use\".", "src": "PDF 62 (printed 55)"}, {"n": 147, "img": null, "kind": "association", "stem": "Which antibiotics are most commonly involved in C. difficile disease?", "opts": ["Penicillin G and erythromycin", "Ciprofloxacin and doxycycline", "Vancomycin and metronidazole", "Clindamycin and second and third generation cephalosporins"], "key": 3, "exp": "Answer: Clindamycin and second and third generation cephalosporins. Book trigger: \"Clindamycin and others like second and third-generation cephalosporins\".", "src": "PDF 62 (printed 55)"}, {"n": 148, "img": null, "kind": "except", "stem": "Which is NOT a way the book uses to diagnose antibiotic-associated C. difficile diarrhea?", "opts": ["Detection of toxins in stool by ELISA", "Detection of toxin genes in stool by PCR", "Isolation of the organism from stool alone", "Differentiating it from transient diarrhea"], "key": 2, "exp": "Answer: Isolation of the organism from stool alone. Book trigger: \"isolating the organism from stools is insufficient for diagnosis\". The book says isolation alone is insufficient since it may be normal flora.", "src": "PDF 62 (printed 55)"}, {"n": 149, "img": null, "kind": "double-clue", "stem": "Which treatment step comes FIRST for C. difficile in the book AND which drugs follow?", "opts": ["Give antitoxin; ciprofloxacin", "Stop the causative antibiotic; metronidazole or vancomycin", "Surgical debridement; penicillin", "Respiratory support; erythromycin"], "key": 1, "exp": "Answer: Stop the causative antibiotic; metronidazole or vancomycin. Book trigger: \"Stop using the antibiotic/chemotherapeutic that causes the problem\".", "src": "PDF 62 (printed 55)"}, {"n": 150, "img": null, "kind": "association", "stem": "Which approach can restore gut microbiota balance in C. difficile disease?", "opts": ["Normal fecal microbiota transmission using enema", "Prolonged ciprofloxacin", "Hyperbaric oxygen", "Anti-alpha toxin"], "key": 0, "exp": "Answer: Normal fecal microbiota transmission using enema. Book trigger: \"Normal fecal microbiota transmission\".", "src": "PDF 62 (printed 55)"}, {"n": 151, "img": null, "kind": "clinical case", "stem": "An unvaccinated child with diphtheria develops heart failure. What does the book name as the cause?", "opts": ["Bacteremia seeding the valves", "Airway obstruction", "Hemorrhagic mediastinitis", "Myocarditis from the toxin"], "key": 3, "exp": "Answer: Myocarditis from the toxin. Book trigger: \"Heart failure as a result of myocarditis\".", "src": "PDF 41 (printed 34)"}, {"n": 152, "img": null, "kind": "clinical case", "stem": "A doctor strongly suspects diphtheria in a child with a bleeding throat membrane. What does the book say to do?", "opts": ["Wait for the culture result before treatment", "Give only the toxoid vaccine", "Give antitoxin immediately without waiting for the lab", "Give metronidazole and wait"], "key": 2, "exp": "Answer: Give antitoxin immediately without waiting for the lab. Book trigger: \"without waiting for the lab diagnosis\".", "src": "PDF 42 (printed 35)"}, {"n": 153, "img": null, "kind": "clinical case", "stem": "A throat isolate grows on blood tellurite medium as a Gram-positive bacillus. Which test confirms it makes diphtheria toxin?", "opts": ["Elek's test", "Nagler's reaction", "Stormy clot reaction", "McFadyean reaction"], "key": 0, "exp": "Answer: Elek's test. Book trigger: \"Toxigenicity tests: to confirm the ability to produce diphtheria toxin\".", "src": "PDF 42 (printed 35)"}, {"n": 154, "img": null, "kind": "clinical case", "stem": "In an Elek plate, precipitation lines form at 45 degrees between the test growth and the antitoxin strip. This means the isolate is:", "opts": ["A non-toxin producer", "A toxin producer", "A spore former", "Resistant to penicillin"], "key": 1, "exp": "Answer: A toxin producer. Book trigger: \"considered a positive test\".", "src": "PDF 43 (printed 36)"}, {"n": 155, "img": null, "kind": "clinical case", "stem": "A neonate dies after spasms from tetanus neonatorum. What is the fatal mechanism in the book?", "opts": ["Hemorrhagic mediastinitis", "Toxic megacolon", "Myocarditis", "Spasm and paralysis of the diaphragm"], "key": 3, "exp": "Answer: Spasm and paralysis of the diaphragm. Book trigger: \"spasm and paralysis of the diaphragm\".", "src": "PDF 52 (printed 45)"}, {"n": 156, "img": null, "kind": "clinical case", "stem": "A patient with tetanus needs antitoxin. Which preparation does the book prefer, and why?", "opts": ["Horse antitoxin, because it is cheaper", "Toxoid only, because it neutralizes toxin", "Human tetanus immunoglobulin, to avoid anaphylaxis", "Penicillin G, because it neutralizes toxin"], "key": 2, "exp": "Answer: Human tetanus immunoglobulin, to avoid anaphylaxis. Book trigger: \"preferred to that prepared in horses to avoid anaphylaxis\".", "src": "PDF 53 (printed 46)"}, {"n": 157, "img": null, "kind": "clinical case", "stem": "A pregnant woman asks why she gets a tetanus toxoid booster. The book's reason:", "opts": ["To prevent neonatal listeriosis", "To prevent tetanus neonatorum", "To treat her own wound infection", "To prevent botulism"], "key": 1, "exp": "Answer: To prevent tetanus neonatorum. Book trigger: \"Pregnant women to prevent tetanus neonatorum\".", "src": "PDF 54 (printed 47)"}, {"n": 158, "img": null, "kind": "clinical case", "stem": "A woman recovers from tetanus. Why does she still need vaccination?", "opts": ["She is now permanently immune", "The toxin has many antigenic types", "Natural infection leaves insufficient antibodies against a second attack", "The antitoxin damaged her immunity"], "key": 2, "exp": "Answer: Natural infection leaves insufficient antibodies against a second attack. Book trigger: \"usually insufficient to protect against a second attack\".", "src": "PDF 52 (printed 45)"}, {"n": 159, "img": null, "kind": "clinical case", "stem": "A veterinarian was exposed to anthrax spores. Which drugs does the book give as postexposure prophylaxis?", "opts": ["Penicillin G or erythromycin", "Vancomycin or metronidazole", "Ampicillin and gentamycin", "Ciprofloxacin or doxycycline"], "key": 3, "exp": "Answer: Ciprofloxacin or doxycycline. Book trigger: \"Ciprofloxacin or doxycycline can be used for postexposure prophylaxis\".", "src": "PDF 49 (printed 42)"}, {"n": 160, "img": null, "kind": "clinical case", "stem": "A deep leg wound shows Gram-positive bacilli with NO polymorphonuclear cells in the exudate. The culture shows double zones of hemolysis. Organism?", "opts": ["Clostridium perfringens", "Clostridium tetani", "Bacillus anthracis", "Listeria monocytogenes"], "key": 0, "exp": "Answer: Clostridium perfringens. Book trigger: \"double zones of hemolysis\".", "src": "PDF 55 (printed 48)"}, {"n": 161, "img": null, "kind": "clinical case", "stem": "A 4-month-old infant fed honey is floppy and afebrile. What does the book say to do urgently?", "opts": ["Surgical debridement", "Antitoxin IM in horses", "Respiratory support", "Chemoprophylaxis with erythromycin"], "key": 2, "exp": "Answer: Respiratory support. Book trigger: \"Respiratory support is urgently needed before lab diagnosis\".", "src": "PDF 60 (printed 53)"}, {"n": 162, "img": null, "kind": "clinical case", "stem": "Home-canned food is boiled for several minutes before eating. According to the book, what happens to botulinum toxin?", "opts": ["It becomes more toxic", "It is inactivated", "It is unaffected because it is heat-stable", "It converts to toxoid"], "key": 1, "exp": "Answer: It is inactivated. Book trigger: \"inactivated by boiling for several minutes\".", "src": "PDF 59 (printed 52)"}, {"n": 163, "img": null, "kind": "clinical case", "stem": "A patient on cephalosporins has watery diarrhea. Stool culture grows C. difficile. Why is this alone insufficient to diagnose the disease?", "opts": ["It may be normally present as flora without harm", "Stool culture cannot grow anaerobes", "The organism is only found in the blood", "Culture destroys the toxin"], " const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='abcd';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Infection and Immunity, PDF 39-62</h2>
<p>${Q.length} MCQs from the coursebook (Corynebacterium, Listeria, Bacillus, Clostridium). Mixed across all topics in random order. Each question keeps its book image where it has one. Answers follow the coursebook.</p>
<p><b>Practice mode (default):</b> after each answer you see right or wrong, the book answer and the explanation at once. Your score updates as you go. At the end you get the score, a review of the missed questions, and a button to retry only the missed ones.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>
<button class="btn" onclick="start(Q.filter(q=>q.img),'practice')">Practice: image questions</button>
<p><b>Exam mode</b> (optional, answers shown only at the end):</p>
<button class="btn g" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'exam')">Exam: 50 random</button>
</div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit'}</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else start(Q,'practice');
</script></body></html>
