const BANK={"title": "Clostridium - Lecture", "sourceLabel": "T 51-62", "dateLabel": "Sunday 8 Nov, 9:00 (3-B)", "indexUrl": "week2-infection-immunity.html", "indexLabel": "Back to Week 2 timetable", "extraLinks": ""};
const Q=[{"n": 1, "stem": "Which of the following is NOT a feature of the genus Clostridium?", "opts": ["Saprophytes in soil or the gut of animals", "Gram-positive spore-forming bacilli", "Anaerobic", "Aerobic"], "key": 3, "exp": "Trigger: \"Gram-positive spore-forming bacilli, Anaerobic, saprophytes\" are the genus characters.", "src": "Theory book PDF 51 (printed 44)", "cue": "genus characters", "ask": "Which of the following is NOT a feature of the genus Clostridium?", "distinguish": "Bacillus is aerobic; Clostridium is anaerobic."}, {"n": 2, "stem": "Match the four important species to their diseases: which pairing is WRONG?", "opts": ["C. botulinum - botulism", "C. perfringens - botulism", "C. tetani - tetanus", "C. difficile - pseudomembranous colitis"], "key": 1, "exp": "Trigger: Figure: tetani tetanus, perfringens gas gangrene, botulinum botulism, difficile pseudomembranous colitis.", "src": "Theory book PDF 51 (printed 44)", "cue": "species-disease", "ask": "Match the four important species to their diseases: which pairing is WRONG?", "distinguish": "Perfringens = gas gangrene (and food poisoning), not botulism."}, {"n": 3, "stem": "The characteristic \"drumstick\" appearance is due to", "opts": ["Capsule of C. difficile", "Subterminal oval spore of C. perfringens", "Central spore of C. botulinum", "Terminal rounded bulging spore of C. tetani"], "key": 3, "exp": "Trigger: \"terminal rounded bulging spore. Giving a characteristic drum-stick appearance\".", "src": "Theory book PDF 51 (printed 44)", "cue": "drum-stick", "ask": "The characteristic \"drumstick\" appearance is due to", "distinguish": "C. perfringens spores are non-bulging, subterminal, oval."}, {"n": 4, "stem": "On blood agar C. tetani colonies are", "opts": ["Beta-hemolytic due to hemolysin", "Double-zone hemolytic", "Non-hemolytic", "Alpha-hemolytic"], "key": 0, "exp": "Trigger: \"On blood agar, colonies are beta-hemolytic due to hemolysin production\".", "src": "Theory book PDF 51 (printed 44)", "cue": "tetani blood agar", "ask": "On blood agar C. tetani colonies are", "distinguish": "Double zone hemolysis is C. perfringens."}, {"n": 5, "stem": "C. tetani can grow on", "opts": ["Ordinary nutrient agar, strictly anaerobically", "Only on special enriched media", "Aerobically on MacConkey", "Only in tissue culture"], "key": 0, "exp": "Trigger: \"Strict anaerobes. Ordinary i.e., can grow on nutrient agar\".", "src": "Theory book PDF 51 (printed 44)", "cue": "tetani culture", "ask": "C. tetani can grow on", "distinguish": "It is anaerobic but not fastidious."}, {"n": 6, "stem": "Tetanus toxin (tetanospasmin) is", "opts": ["Plasmid-mediated lipid", "A phage-coded enzyme", "Plasmid-mediated protein of A and B subunits", "Chromosomal lipopolysaccharide"], "key": 2, "exp": "Trigger: \"plasmid-mediated, protein in nature, formed of two subunits A and B\". B binds receptors, A is active.", "src": "Theory book PDF 51 (printed 44)", "cue": "tetanospasmin structure", "ask": "Tetanus toxin (tetanospasmin) is", "distinguish": "B subunit binds; A subunit is the active part."}, {"n": 7, "stem": "The toxin reaches the CNS by", "opts": ["Retrograde axonal spread with NO bacteremia", "Lymphatic spread of bacilli", "Bacteremia to the brain", "Ingestion"], "key": 0, "exp": "Trigger: \"retrograde axonal spread... organism remains at the site of infection i.e., NO BACTEREMIA\".", "src": "Theory book PDF 52 (printed 45)", "cue": "retrograde axonal", "ask": "The toxin reaches the CNS by", "distinguish": "Organism stays local; toxin travels."}, {"n": 8, "stem": "Tetanospasmin acts by inhibiting release of", "opts": ["Dopamine", "Glycine and GABA", "Acetylcholine", "Noradrenaline"], "key": 1, "exp": "Trigger: \"inhibits the release of inhibitory neurotransmitters glycine and GABA\".", "src": "Theory book PDF 52 (printed 45)", "cue": "glycine GABA", "ask": "Tetanospasmin acts by inhibiting release of", "distinguish": "Botulinum inhibits acetylcholine (flaccid)."}, {"n": 9, "stem": "Tetanus produces which type of paralysis?", "opts": ["Flaccid", "Spastic with hyperreflexia", "Sensory only", "Ascending flaccid"], "key": 1, "exp": "Trigger: \"painful spastic muscle paralysis and hyperreflexia\".", "src": "Theory book PDF 52 (printed 45)", "cue": "spastic paralysis", "ask": "Tetanus produces which type of paralysis?", "distinguish": "Botulism is flaccid."}, {"n": 10, "stem": "Muscles are affected in tetanus in which order?", "opts": ["Respiratory muscles first", "Random", "Descending, starting at the masseter", "Ascending from the legs"], "key": 2, "exp": "Trigger: \"affected in a descending fashion, starting from the masseter\".", "src": "Theory book PDF 52 (printed 45)", "cue": "descending masseter", "ask": "Muscles are affected in tetanus in which order?", "distinguish": "Botulism also descends but is flaccid and starts in cranial-nerve muscles."}, {"n": 11, "stem": "Death in tetanus is due to", "opts": ["Hypotensive shock", "Renal failure", "Spasm and paralysis of the diaphragm", "Septicemia"], "key": 2, "exp": "Trigger: \"A fatal outcome occurs due to spasm and paralysis of the diaphragm\".", "src": "Theory book PDF 52 (printed 45)", "cue": "fatal outcome", "ask": "Death in tetanus is due to", "distinguish": "Gas gangrene dies of toxemia/multiorgan failure."}, {"n": 12, "stem": "Why is a second attack of tetanus possible after natural infection?", "opts": ["The organism hides in macrophages", "The toxin has many antigenic types", "Minute toxin amounts give insufficient protective antibodies", "Antibodies cross-react"], "key": 2, "exp": "Trigger: \"exposed to a minute amount... resulting Abs are usually insufficient to protect\".", "src": "Theory book PDF 52 (printed 45)", "cue": "second attack", "ask": "Why is a second attack of tetanus possible after natural infection?", "distinguish": "Toxin has ONE antigenic type."}, {"n": 13, "stem": "Mortality of tetanus in neonates is up to", "opts": ["10%", "40%", "90%", "60%"], "key": 2, "exp": "Trigger: \"up to 40% in adults and increases to 90% in neonates\".", "src": "Theory book PDF 52 (printed 45)", "cue": "mortality", "ask": "Mortality of tetanus in neonates is up to", "distinguish": "Adults 40%."}, {"n": 14, "stem": "The main animal reservoir of C. tetani is", "opts": ["Cattle", "Rats", "Horses", "Dogs"], "key": 2, "exp": "Trigger: \"Horses represent the main animal reservoir\".", "src": "Theory book PDF 52 (printed 45)", "cue": "reservoir", "ask": "The main animal reservoir of C. tetani is", "distinguish": "Spores in agricultural soil, excreted in stools of farm animals."}, {"n": 15, "stem": "Tetanus neonatorum results from", "opts": ["Breast milk", "Honey", "Transplacental spread", "Contaminated instruments cutting the umbilical cord"], "key": 3, "exp": "Trigger: \"Using contaminated instruments to cut the umbilical cord of newborns\".", "src": "Theory book PDF 52 (printed 45)", "cue": "umbilical cord", "ask": "Tetanus neonatorum results from", "distinguish": "Infant botulism is the honey one."}, {"n": 16, "stem": "Trismus (lock jaw) is due to spasm of the", "opts": ["Extensors of the back", "Flexors of the upper limb", "Masseter", "Diaphragm"], "key": 2, "exp": "Trigger: \"Spasm of masseter results in a locked jaw or trismus\".", "src": "Theory book PDF 53 (printed 46)", "cue": "trismus", "ask": "Trismus (lock jaw) is due to spasm of the", "distinguish": "Back extensors give opisthotonus."}, {"n": 17, "stem": "Opisthotonus (arched back) is due to spasm of", "opts": ["Intercostals", "Abdominal flexors", "Masseter", "Extensors of the back muscles"], "key": 3, "exp": "Trigger: \"Spasms of the extensors of back muscles result in opisthotonus\".", "src": "Theory book PDF 53 (printed 46)", "cue": "opisthotonus", "ask": "Opisthotonus (arched back) is due to spasm of", "distinguish": "Masseter = trismus."}, {"n": 18, "stem": "In a clinically suspected tetanus case in a neonate, the first step is", "opts": ["Give vaccine only", "Give antitoxin without waiting for the lab", "Gram stain the wound first", "Wait for culture confirmation"], "key": 1, "exp": "Trigger: \"prompt treatment with tetanus antitoxin is crucial... without waiting for laboratory diagnosis\".", "src": "Theory book PDF 53 (printed 46)", "cue": "clinical diagnosis", "ask": "In a clinically suspected tetanus case in a neonate, the first step is", "distinguish": "Lab diagnosis is for confirmation only."}, {"n": 19, "stem": "The antitoxin preferred for tetanus treatment is", "opts": ["Toxoid", "Human tetanus immunoglobulin (HTIG)", "Horse antitetanic serum", "Penicillin"], "key": 1, "exp": "Trigger: \"HTIG is preferred to that prepared in horses to avoid anaphylaxis\".", "src": "Theory book PDF 53 (printed 46)", "cue": "HTIG", "ask": "The antitoxin preferred for tetanus treatment is", "distinguish": "Horse serum risks anaphylaxis."}, {"n": 20, "stem": "Antitetanic serum should be given as early as possible because it", "opts": ["Neutralizes free toxin before fixation in tissues", "Kills the spores", "Stops wound infection", "Blocks germination"], "key": 0, "exp": "Trigger: \"neutralizes the free toxin before it is fixed in the tissues\".", "src": "Theory book PDF 53 (printed 46)", "cue": "early antitoxin", "ask": "Antitetanic serum should be given as early as possible because it", "distinguish": "Fixed toxin cannot be neutralized."}, {"n": 21, "stem": "Antibiotics in tetanus (penicillin G or metronidazole) are used to", "opts": ["Replace antitoxin", "Decrease multiplication and so toxin production", "Neutralize toxin", "Reverse paralysis"], "key": 1, "exp": "Trigger: \"helps decrease the multiplication of the organism hence toxin production\".", "src": "Theory book PDF 54 (printed 47)", "cue": "antibiotic role", "ask": "Antibiotics in tetanus (penicillin G or metronidazole) are used to", "distinguish": "They do not neutralize toxin."}, {"n": 22, "stem": "Tetanus toxoid is prepared by", "opts": ["Heat-killing bacilli", "Adding 0.3% formalin to the toxin", "Attenuating spores", "Using the capsule"], "key": 1, "exp": "Trigger: \"adding 0.3% formalin to tetanus toxin which detoxifies... but keeps its antigenicity\".", "src": "Theory book PDF 54 (printed 47)", "cue": "toxoid prep", "ask": "Tetanus toxoid is prepared by", "distinguish": "Detoxified but antigenic."}, {"n": 23, "stem": "Tetanus toxoid doses in infants are given at", "opts": ["Birth only", "2 months only", "9 and 12 months", "2, 4, 6 and 18 months with a school-entry booster"], "key": 3, "exp": "Trigger: \"given at 2, 4, 6, and 18 months to infants. A booster dose is given at school entry\".", "src": "Theory book PDF 54 (printed 47)", "cue": "vaccine schedule", "ask": "Tetanus toxoid doses in infants are given at", "distinguish": "Adult booster every 10 years."}, {"n": 24, "stem": "A person injured with vaccination more than 10 years ago should receive", "opts": ["Toxoid only", "Antitetanic serum AND toxoid booster", "Nothing", "Serum only"], "key": 1, "exp": "Trigger: Table 1.5: >10 years: Yes serum, Yes toxoid.", "src": "Theory book PDF 54 (printed 47)", "cue": "post-exposure table", "ask": "A person injured with vaccination more than 10 years ago should receive", "distinguish": "5-10 years: toxoid only; within 5 years: nothing."}, {"n": 25, "stem": "A person injured with the last vaccination 5-10 years ago should receive", "opts": ["Neither", "Toxoid booster only", "Both", "Antitetanic serum only"], "key": 1, "exp": "Trigger: Table 1.5: 5-10 years: no serum, toxoid yes.", "src": "Theory book PDF 54 (printed 47)", "cue": "post-exposure table", "ask": "A person injured with the last vaccination 5-10 years ago should receive", "distinguish": "Within 5 years neither is needed."}, {"n": 26, "stem": "In passive-active prophylaxis, the toxoid and HTIG are given", "opts": ["IV", "Orally", "IM at two different sites", "Mixed in one syringe"], "key": 2, "exp": "Trigger: \"given IM, however, at two different sites\".", "src": "Theory book PDF 54 (printed 47)", "cue": "passive-active", "ask": "In passive-active prophylaxis, the toxoid and HTIG are given", "distinguish": "Different sites avoid neutralization."}, {"n": 27, "stem": "Spores of C. perfringens are", "opts": ["Central", "Non-bulging, subterminal and oval", "Terminal and bulging", "Absent"], "key": 1, "exp": "Trigger: \"Spores are non-bulging, subterminal and oval\".", "src": "Theory book PDF 55 (printed 48)", "cue": "perfringens spores", "ask": "Spores of C. perfringens are", "distinguish": "Tetani spores terminal bulging."}, {"n": 28, "stem": "C. perfringens appears as", "opts": ["Gram-negative coccobacilli", "Gram-positive brick-shaped, non-motile, capsulated in tissue", "Branching filaments", "Curved motile bacilli"], "key": 1, "exp": "Trigger: \"brick-shape bacilli... Non-motile and capsulated in host tissue\".", "src": "Theory book PDF 55 (printed 48)", "cue": "perfringens morphology", "ask": "C. perfringens appears as", "distinguish": "Non-motile."}, {"n": 29, "stem": "Double zone of hemolysis on blood agar is typical of", "opts": ["C. perfringens", "C. tetani", "C. difficile", "C. botulinum"], "key": 0, "exp": "Trigger: \"Hemolytic on blood agar and produces double zones of hemolysis\".", "src": "Theory book PDF 55 (printed 48)", "cue": "double zone", "ask": "Double zone of hemolysis on blood agar is typical of", "distinguish": "Tetani gives single beta zone."}, {"n": 30, "stem": "The stormy clot reaction depends on", "opts": ["Hemolysin", "Excess gas from sugar fermentation", "Lecithinase", "Urease"], "key": 1, "exp": "Trigger: \"ferment sugars and produce excess gases. Basis of stormy clot reaction\".", "src": "Theory book PDF 55 (printed 48)", "cue": "stormy clot", "ask": "The stormy clot reaction depends on", "distinguish": "Lecithinase = Nagler."}, {"n": 31, "stem": "Nagler's reaction detects", "opts": ["Collagenase", "Hyaluronidase", "Theta toxin", "Alpha toxin (lecithinase)"], "key": 3, "exp": "Trigger: \"alpha toxin, a lecithinase... basis of Nagler's reaction\".", "src": "Theory book PDF 55 (printed 48)", "cue": "Nagler", "ask": "Nagler's reaction detects", "distinguish": "Alpha toxin is the most important virulence factor."}, {"n": 32, "stem": "The most important toxin of C. perfringens is", "opts": ["Toxin B", "Enterotoxin", "Theta toxin", "Alpha toxin dissolving cell membranes"], "key": 3, "exp": "Trigger: \"Alpha toxin: the most important, dissolves cell membranes causing cell death and necrosis\".", "src": "Theory book PDF 56 (printed 49)", "cue": "alpha toxin", "ask": "The most important toxin of C. perfringens is", "distinguish": "Theta is hemolytic and necrotizing."}, {"n": 33, "stem": "Gas gangrene infection is usually", "opts": ["Viral", "Fungal", "Polymicrobial", "Monomicrobial"], "key": 2, "exp": "Trigger: \"Infection is usually polymicrobial i.e., facultative anaerobes and anaerobic clostridia\".", "src": "Theory book PDF 56 (printed 49)", "cue": "polymicrobial", "ask": "Gas gangrene infection is usually", "distinguish": "Facultatives consume oxygen."}, {"n": 34, "stem": "What favors germination of clostridial spores in gas gangrene?", "opts": ["Neutrophil infiltration", "High oxygen tension", "Tissue ischemia and cut blood supply", "Cold exposure"], "key": 2, "exp": "Trigger: \"Tissue ischemia and cut of blood supply favor the germination\".", "src": "Theory book PDF 56 (printed 49)", "cue": "ischemia", "ask": "What favors germination of clostridial spores in gas gangrene?", "distinguish": "Gas pressure adds ischemia."}, {"n": 35, "stem": "Tissues turn black in gas gangrene because", "opts": ["Hemolysis only", "Proteolytic clostridia digest necrotic tissue", "Antibiotic effect", "Melanin deposition"], "key": 1, "exp": "Trigger: \"proteolytic clostridia start to decompose and digest the tissues turning their color into black\".", "src": "Theory book PDF 57 (printed 50)", "cue": "black tissue", "ask": "Tissues turn black in gas gangrene because", "distinguish": "Saccharolytic ones produce gas."}, {"n": 36, "stem": "Gram stain of the exudate in gas gangrene shows", "opts": ["Gram-negative rods", "Only PLNs", "The organism with NO polymorphonuclear cells", "Many PLNs with the organism"], "key": 2, "exp": "Trigger: \"organism with NO PLNs. PLNs are killed by microbial toxins\".", "src": "Theory book PDF 57 (printed 50)", "cue": "no PLNs", "ask": "Gram stain of the exudate in gas gangrene shows", "distinguish": "Pyogenic infections show PLNs."}, {"n": 37, "stem": "Specimen of choice in gas gangrene is", "opts": ["Urine", "Exudate or dead tissue from the advancing margin", "Stool", "Blood"], "key": 1, "exp": "Trigger: \"Exudates or dead tissue from the advancing margin of the lesion\".", "src": "Theory book PDF 57 (printed 50)", "cue": "specimen", "ask": "Specimen of choice in gas gangrene is", "distinguish": "Advancing margin."}, {"n": 38, "stem": "Cultivation for gas gangrene is done on", "opts": ["Two blood agar plates, aerobic and anaerobic", "TCBS", "LJ medium", "One MacConkey plate"], "key": 0, "exp": "Trigger: \"two blood agar plates, one aerobically and the other anaerobically\".", "src": "Theory book PDF 57 (printed 50)", "cue": "culture plates", "ask": "Cultivation for gas gangrene is done on", "distinguish": "Anaerobic growth only confirms clostridia."}, {"n": 39, "stem": "The mandatory treatment of gas gangrene is", "opts": ["Surgical debridement up to amputation", "Vaccine", "Antitoxin only", "Oral rehydration"], "key": 0, "exp": "Trigger: \"Very proper surgical debridement is mandatory\".", "src": "Theory book PDF 57 (printed 50)", "cue": "debridement", "ask": "The mandatory treatment of gas gangrene is", "distinguish": "Anti-alpha toxin is of doubtful effect."}, {"n": 40, "stem": "Drug of choice for gas gangrene is", "opts": ["Penicillin G", "Vancomycin", "Metronidazole", "Clindamycin"], "key": 1, "exp": "Trigger: \"vancomycin is the drug of choice. Alternatively, penicillin and metronidazole\".", "src": "Theory book PDF 58 (printed 51)", "cue": "DOC gangre const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
