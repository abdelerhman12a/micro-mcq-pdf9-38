const Q=[{"n": 1, "img": null, "kind": "key differentiator", "stem": "A patient with high IgE, eosinophilia, strongly positive filarial antigen and mottled chest shadows has no microfilariae in the blood. How does this differ from classic lymphatic filariasis?", "opts": ["Microfilariae are present at night, with elephantiasis", "Adults are absent, with chyluria and hydrocele", "Microfilariae are present by day, with lymphadenitis", "Microfilariae are absent from blood, and classical lymphatic features are lacking"], "key": 3, "exp": "Trigger words: \"absence of microfilariae in peripheral blood\"; \"Classical features of lymphatic filariasis are absent\".", "src": "PDF 344 (printed 336)"}, {"n": 2, "img": null, "kind": "treatment/protocol", "stem": "A patient has a negative film. Which tests detect antibody and antigen by ELISA, and which method detects parasite DNA?", "opts": ["Intradermal test detects antibody; PCR detects antigen", "Serological tests detect antibody and antigen; PCR detects DNA", "Knott's procedure detects antigen; PCR detects antibody", "Serological tests detect DNA; PCR detects antibody"], "key": 1, "exp": "Trigger words: \"Serological tests: antibody and antigen detection using ELISA\"; \"Polymerase chain reaction (PCR)\".", "src": "PDF 342 (printed 334)"}, {"n": 3, "img": null, "kind": "mechanism/rationale", "stem": "After years of repeated acute attacks, a patient develops lymphoedema. Which sequence leads to the chronic obstructive stage?", "opts": ["Fibrosis first, then granuloma, then acute inflammation", "Granuloma formation, lymphatic obstruction, then hyperplasia and fibrosis", "Venous thrombosis, then lymphatic hyperplasia, then oedema", "Microfilarial blockage of capillaries, then fibrosis, then granuloma"], "key": 1, "exp": "Trigger words: \"After years of acute infection and granuloma formation with obstruction of lymphatics these lead to lymphatic hyperplasia and fibrosis\".", "src": "PDF 341 (printed 333)"}, {"n": 4, "img": null, "kind": "treatment/protocol", "stem": "A patient in a field survey is injected intradermally with an antigen from dog filaria to look for delayed hypersensitivity. Which test is this and where is it used?", "opts": ["Intradermal test, used in epidemiological studies", "Serological test, used for antigen detection", "Knott's procedure, used on day blood", "Provocation test, used in individual diagnosis"], "key": 0, "exp": "Trigger words: \"Intradermal test: using Antigen extracted from dog Filaria to detect the delayed type hypersensitivity reaction in epidemiological studies\".", "src": "PDF 342 (printed 334)"}, {"n": 5, "img": null, "kind": "vignette: stage/host", "stem": "A thick film at 11 pm shows sheathed microfilariae with a tail free of nuclei; the noon film is negative. Which parasite is the likely cause, among W. bancrofti and Brugia malayi?", "opts": ["W. bancrofti, with two terminal tail nuclei", "Brugia malayi, with a day-only periodicity", "Brugia malayi, which has a nucleus-free tail", "W. bancrofti, with nocturnal periodicity and a nucleus-free tail"], "key": 3, "exp": "Trigger words: W. bancrofti \"tail is free of nuclei\" and nocturnal; Brugia: \"tail has 2 terminal nuclei\".", "src": "PDF 339 (printed 331)"}, {"n": 6, "img": null, "kind": "mechanism/rationale", "stem": "A man has varicosities, hydrocele and thickened scrotal skin years after the acute stage. Which statement describes the genital picture?", "opts": ["Testicular atrophy, from granulomas in the testis", "Hydrocele only, from sexual transmission", "Hydrocele with chronic epididymitis, from lymphatic obstruction", "Orchitis only, from direct invasion by adult worms"], "key": 2, "exp": "Trigger words: \"varicosities with hydrocele, chronic epididymitis (thickening of scrotal skin)\".", "src": "PDF 341 (printed 333)"}, {"n": 7, "img": null, "kind": "vignette: stage/host", "stem": "A patient with scrotal ultrasonography shows worms actively moving inside lymphatics. Which sign is this, and which stage is being seen?", "opts": ["Filarial dance sign, seen with the adult worms", "Chyluria sign, seen with the third-stage larvae", "Filarial dance sign, seen with the microfilariae", "Strawberry sign, seen with the adult worms"], "key": 0, "exp": "Trigger words: \"worms are seen actively moving inside lymphatics (filarial dance sign)\".", "src": "PDF 342 (printed 334)"}, {"n": 8, "img": null, "kind": "mechanism/rationale", "stem": "A man has orchitis and epididymitis, and a woman has breast and vulval lymphatic involvement, in the acute stage. What underlies this?", "opts": ["Obstruction of the lymphatics by granulomas", "Toxic products of living adult worms alone", "Rupture of lymphatics into the urinary passages", "Immunological reactions of the genital and breast lymphatics"], "key": 3, "exp": "Trigger words: \"Due to immunological reactions ... affection of lymphatics of genitalia and scrotum with picture of orchitis and epididymitis\".", "src": "PDF 341 (printed 333)"}, {"n": 9, "img": null, "kind": "treatment/protocol", "stem": "A man with a chronic hydrocele and elephantoid skin is planned for surgery. When is surgical excision performed?", "opts": ["During acute lymphangitis", "After a course of DEC", "Before any drug treatment", "Instead of drug therapy"], "key": 1, "exp": "Trigger words: \"surgical excision of chronic hydrocele or elephantoid skin after a course of DEC\".", "src": "PDF 343 (printed 335)"}, {"n": 10, "img": null, "kind": "key differentiator", "stem": "A patient has adults in the upper limb more than the lower limb and microfilariae with two terminal tail nuclei, unlike W. bancrofti. Which differences does the source give for this comparator?", "opts": ["Subcutaneous adults, kinky curves and no sheath", "Lower-limb adults, graceful curves and a nucleus-free tail", "Upper-limb adults, kinky curves and two terminal tail nuclei", "Serous-cavity adults, graceful curves and a nucleus-free tail"], "key": 2, "exp": "Trigger words: Brugia \"sheathed with kinky curves and the tail has 2 terminal nuclei\"; \"Adults live in lymphatics of upper limb more than lower limb\".", "src": "PDF 344 (printed 336)"}, {"n": 11, "img": null, "kind": "key differentiator", "stem": "Two adult worms are found in lymphatics: one about 4 cm long with a curved posterior end and two spicules, the other about 9 cm long with two sets of genitalia. What are they?", "opts": ["Both male W. bancrofti", "Female W. bancrofti and male W. bancrofti", "Male W. bancrofti and larviparous female W. bancrofti", "Both female, egg-laying W. bancrofti"], "key": 2, "exp": "Trigger words: \"Male: about 4cm long, has curved posterior end with 2 spicules. Female: about 9 cm long, has 2 sets of genitalia- larviparous\".", "src": "PDF 338 (printed 330)"}, {"n": 12, "img": null, "kind": "vignette: stage/host", "stem": "A patient from an endemic area has an elephantoid leg. Where do the adult worms causing the condition live, and where are the microfilariae found?", "opts": ["Adults in subcutaneous tissue; microfilariae in skin", "Adults in lymph vessels; microfilariae in the skin only", "Adults in lymph nodes and vessels; microfilariae in blood and lymph", "Adults in serous cavities; microfilariae in blood only"], "key": 2, "exp": "Trigger words: \"Adults live in lymph nodes and lymph vessels ... Microfilariae present in blood and lymph\".", "src": "PDF 338 (printed 330)"}, {"n": 13, "img": null, "kind": "mechanism/rationale", "stem": "A technologist asks why a day sample of a known infected patient shows no microfilariae, and a drug is given to find them. Which test does this, and how?", "opts": ["Knott's technique: formalin forces them into the blood", "Intradermal test: dog antigen brings them to the skin", "Provocation test: DEC forces microfilariae into daytime blood", "Ultrasonography: worms are drawn into the lymphatics"], "key": 2, "exp": "Trigger words: \"Provocation test: giving Diethylcarbamazine (DEC) which forces microfilariae to appear in peripheral blood during day time\".", "src": "PDF 342 (printed 334)"}, {"n": 14, "img": null, "kind": "treatment/protocol", "stem": "A patient with bancroftian filariasis is to be started on the drug of choice. Which drug, and what does it kill?", "opts": ["Diethylcarbamazine, which kills microfilariae and also adults", "Albendazole, which kills microfilariae only", "Ivermectin, which kills microfilariae and adults", "Diethylcarbamazine, which kills adults only"], "key": 0, "exp": "Trigger words: \"Diethylcarbamazine (Hetrazan): it's the drug of choice: microfilaricidal agent which is also capable of killing adults\".", "src": "PDF 343 (printed 335)"}, {"n": 15, "img": "340-002", "kind": "treatment/protocol", "stem": "A patient is infected with the parasite whose cycle is shown. Which drug of choice is directed at the stages found in his lymph vessels and blood, and what does it kill?", "opts": ["Albendazole, killing microfilariae only", "DEC, killing adults only", "Ivermectin, killing microfilariae and adults", "DEC, killing microfilariae and also adults"], "key": 3, "exp": "Trigger words: \"Diethylcarbamazine: it's the drug of choice: microfilaricidal agent which is also capable of killing adults\".", "src": "PDF 343 (printed 335), life-cycle figure"}, {"n": 16, "img": null, "kind": "vector/transmission", "stem": "Four mosquito genera are named as vectors for W. bancrofti. Which set is correct?", "opts": ["Culex, Glossina, Anopheles and Mansonia", "Culex, Aedes, Anopheles and Mansonia", "Culex, Aedes, Anopheles and Phlebotomus", "Aedes, Anopheles, Mansonia and Cyclops"], "key": 1, "exp": "Trigger words: \"Vector: Mosquitoes, Culex, Aedes, Anopheles and Mansonia\".", "src": "PDF 338 (printed 330)"}, {"n": 17, "img": null, "kind": "treatment/protocol", "stem": "A clinic in an endemic area relies on history and clinical presentation. Which features support the diagnosis before laboratory tests?", "opts": ["Bilateral lymph node enlargement and oedema of both limb n of breeding places\".", "src": "PDF 343 (printed 335)"}, {"n": 21, "img": null, "kind": "key differentiator", "stem": "A patient has adults in the lymphatics of the upper limb more than the lower limb, and elephantiasis restricted to below the knee or elbow. Which parasite, and which animals may be its reservoirs?", "opts": ["W. bancrofti; monkeys and cats", "Brugia malayi; monkeys and cats", "Brugia malayi; dogs and pigs", "W. bancrofti; man only"], "key": 1, "exp": "Trigger words: \"Adults live in lymphatics of upper limb more than lower limb. Elephantiasis is restricted to area below the knee or elbow\"; \"Monkeys and cats are reservoir hosts\".", "src": "PDF 344 (printed 336)"}, {"n": 22, "img": null, "kind": "vignette: stage/host", "stem": "A man from an endemic area has chyluria and hydrocele. His physician wants the diagnostic stage in a blood film. Which stage, and at what time is it found in peripheral blood?", "opts": ["Sheathed microfilaria, found between 10 pm and 2 am", "Microfilaria, found only during the day", "Adult male worm, found between 10 pm and 2 am", "Third-stage larva, found at noon"], "key": 0, "exp": "Trigger words: \"The diagnostic stage has loose sheath\"; \"appearing in peripheral blood vessels at night (10pm- 2am)\"; \"Giemsa stained thick blood film at night\".", "src": "PDF 339 (printed 331)"}, {"n": 23, "img": null, "kind": "treatment/protocol", "stem": "A child with tropical pulmonary eosinophilia improves rapidly and the eosinophil count falls. Which drug, and which stage does it act on?", "opts": ["DEC, acting on microfilariae", "Ivermectin, acting on adult worms", "DEC, acting on the third-stage larva", "Albendazole, acting on adult worms"], "key": 0, "exp": "Trigger words: \"responds to treatment with Diethylcarbamazine (DEC), which acts on microfilariae with rapid improvement\".", "src": "PDF 344 (printed 336)"}, {"n": 24, "img": null, "kind": "mechanism/rationale", "stem": "A patient has fever, headache, vomiting and chills hatics in urinary passages leads to appearance of lymph in urine giving it milky appearance\".", "src": "PDF 341 (printed 333)"}, {"n": 38, "img": null, "kind": "vector/transmission", "stem": "Which unique feature of larval development inside the arthropod distinguishes filarial transmission?", "opts": ["Larva grows in size without any increase in number", "Larva multiplies in number by binary fission", "Larva multiplies in number without growing", "Larva is passed to the next generation through vector eggs"], "key": 0, "exp": "Trigger words: \"Larva increases in size without increase in number (Cyclodevelopmental transmission)\".", "src": "PDF 337 (printed 329)"}, {"n": 39, "img": null, "kind": "key differentiator", "stem": "A patient has a nocturnal dry cough and wheeze. Which finding separates tropical pulmonary eosinophilia from classic lymphatic filariasis in the film and the chest X-ray?", "opts": ["No microfilariae in the blood, with mottled X-ray shadows", "Sheathed microfilariae by day, with mottled shadows", "Night microfilariae in the blood, with clear lungs", "Adult worms in the blood, with clear lungs"], "key": 0, "exp": "Trigger words: \"absence of microfilariae in peripheral blood and chest X-ray shows mottled shadows similar to miliary tuberculosis\".", "src": "PDF 344 (printed 336)"}, {"n": 40, "img": null, "kind": "mechanism/rationale", "stem": "A patient has massive eosinophilia (30-80%), hepatosplenomegaly and asthmatic wheezing, but none of the classical lymphatic features. What explains it?", "opts": ["Adult worms obstructing the lymphatics of the lungs", "Toxic products of dead adult worms in the liver", "A secondary bacterial infection of the lymph nodes", "Hypersensitivity to microfilarial antigens, with the microfilariae destroyed in tissues"], "key": 3, "exp": "Trigger words: \"Occult Filariasis ... hypersensitivity reaction to microfilarial antigens ... Massive eosinophilia (30-80%), hepato-splenomegaly\".", "src": "PDF 343 (printed 335)"}, {"n": 41, "img": null, "kind": "key differentiator", "stem": "Filarial worms are grouped by the site of the adults. Which pair has adults in the serous cavities, and which pair in the subcutaneous tissue?", "opts": ["Serous cavities: Loa loa, O. volvulus; subcutaneous: A. perstans, M. ozzardi", "Serous cavities: B. malayi, Loa loa; subcutaneous: W. bancrofti", "Serous cavities: A. perstans, M. ozzardi; subcutaneous: Loa loa, O. volvulus", "Serous cavities: W. bancrofti, B. malayi; subcutaneous: Loa loa"], "key": 2, "exp": "Trigger words: \"Adults in subcutaneous tissue as in Loa loa & Onchocerca volvulus. Adults in serous cavities as in Acanthochilonema perstans & Mansonella ozzardi\".", "src": "PDF 337 (printed 329)"}, {"n": 42, "img": null, "kind": "treatment/protocol", "stem": "A patient cannot take the drug of choice, and a drug that kills only adult worms is wanted. Another drug is microfilaricidal only. Which pair is correct?", "opts": ["Albendazole kills both stages; ivermectin kills adults", "Ivermectin kills both stages; albendazole kills neither", "Albendazole kills adults; ivermectin is only microfilaricidal", "Ivermectin kills adults; albendazole is only microfilaricidal"], "key": 2, "exp": "Trigger words: \"Albendazole: it kills adult worms. Ivermectin: it is only microfilaricidal\".", "src": "PDF 343 (printed 335)"}, {"n": 43, "img": null, "kind": "mechanism/rationale", "stem": "A man from an endemic area passes lymph-laden urine, and another has chylous ascites, chylothorax and chylous diarrhoea. What is the common mechanism behind these chronic complications?", "opts": ["Toxic products of dead adult worms in the acute stage", "Hypersensitivity to microfilarial antigens in tissues", "Direct invasion of the organs by microfilariae", "Obstructed, distended lymphatics that rupture into body spaces or tracts"], "key": 3, "exp": "Trigger words: \"Chyluria: rupture of distended lymphatics\"; \"Chylus ascites, chylothorax, chylus diarrhea and chylocele (t const app=document.getElementById('app');

const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Filariae: Wuchereria bancrofti</h2>

<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>
</div>`}

 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}

function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
