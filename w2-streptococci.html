lves DNA."}, {"n": 11, "stem": "The spreading factor of S. pyogenes is", "opts": ["Hyaluronidase", "Protein F", "Streptolysin O", "Streptodornase"], "key": 0, "exp": "Trigger: \"Hyaluronidase... termed 'spreading factor'\".", "src": "Theory book PDF 18 (printed 11)", "cue": "spreading factor", "ask": "The spreading factor of S. pyogenes is", "distinguish": "Dissolves hyaluronic acid."}, {"n": 12, "stem": "C5a peptidase", "opts": ["Acts as superantigen", "Destroys C5a and its chemotactic effect", "Lyses RBCs", "Binds fibronectin"], "key": 1, "exp": "Trigger: \"C5a peptidase that destroys C5a eliminating its chemotactic effect\".", "src": "Theory book PDF 18 (printed 11)", "cue": "C5a peptidase", "ask": "C5a peptidase", "distinguish": "Anti-inflammatory evasion."}, {"n": 13, "stem": "Streptococcal pyrogenic exotoxin A", "opts": ["Capsule", "Superantigen and erythrogenic toxin", "Hemolysin", "Protease"], "key": 1, "exp": "Trigger: \"Function as superantigens causing toxic shock syndrome... erythrogenic toxin... scarlet fever\".", "src": "Theory book PDF 18 (printed 11)", "cue": "SPE-A", "ask": "Streptococcal pyrogenic exotoxin A", "distinguish": "SPE-B is protease."}, {"n": 14, "stem": "Streptolysin O is", "opts": ["Responsible for blood agar hemolysis", "Non-antigenic, oxygen-stable", "Antigenic, oxygen-sensitive; ASO helps diagnosis", "A capsule"], "key": 2, "exp": "Trigger: \"Streptolysin O is antigenic... ASO... oxygen-sensitive\".", "src": "Theory book PDF 18 (printed 11)", "cue": "SLO", "ask": "Streptolysin O is", "distinguish": "Streptolysin S causes hemolysis on plates."}, {"n": 15, "stem": "Streptolysin S is", "opts": ["A superantigen", "Antigenic", "Oxygen-labile", "Non-antigenic and oxygen-stable"], "key": 3, "exp": "Trigger: \"Streptolysin S is not antigenic; oxygen-stable and is responsible for the hemolysis\".", "src": "Theory book PDF 18 (printed 11)", "cue": "SLS", "ask": "Streptolysin S is", "distinguish": "Opposite of SLO."}, {"n": 16, "stem": "Most c hogenesis is", "distinguish": "Antibodies to M protein."}, {"n": 26, "stem": "Lab tests for rheumatic fever", "opts": ["Anti-DNase B only", "Urine casts", "Elevated ASO, CRP and ESR", "Positive culture"], "key": 2, "exp": "Trigger: \"Elevated Anti-streptolysin O titer (ASO), C-reactive protein (CRP) and ESR\".", "src": "Theory book PDF 21 (printed 14)", "cue": "RF lab", "ask": "Lab tests for rheumatic fever", "distinguish": "Culture negative."}, {"n": 27, "stem": "AGN follows", "opts": ["Throat only", "Skin infection (less frequently pharyngitis) by nephritogenic strains", "UTI", "Wounds"], "key": 1, "exp": "Trigger: \"follows skin infection and less frequently pharyngitis... (nephritogenic strains)\".", "src": "Theory book PDF 22 (printed 15)", "cue": "AGN", "ask": "AGN follows", "distinguish": "Type III."}, {"n": 28, "stem": "AGN pathogenesis", "opts": ["Type IV", "Type I", "Type II", "Type III hypersensitivity with immune complex deposition"], "key": 3, "exp": "Trigger: \"type III hypersensitivity reaction with deposition of immune complexes in the glomeruli\".", "src": "Theory book PDF 22 (printed 15)", "cue": "AGN type", "ask": "AGN pathogenesis", "distinguish": "RF is type II."}, {"n": 29, "stem": "Urine in AGN shows", "opts": ["Smoky urine with RBC casts and mild proteinuria", "Bacteria", "Massive proteinuria", "Pus cells"], "key": 0, "exp": "Trigger: \"Smoky urine, haematuria with RBCS casts & mild proteinuria\".", "src": "Theory book PDF 22 (printed 15)", "cue": "urine", "ask": "Urine in AGN shows", "distinguish": "Culture negative."}, {"n": 30, "stem": "Evidence of preceding infection in AGN", "opts": ["Anti-streptolysin only", "Culture", "Gram stain", "Anti-DNase B, elevated ESR, CRP"], "key": 3, "exp": "Trigger: \"Elevated ESR, Positive CRP and Elevated Anti-DNase B\".", "src": "Theory book PDF 22 (printed 15)", "cue": "AGN evidence", "ask": "Evidence of preceding infection in AGN", "distinguish": "Culture negative."}, {"n": 31, "stem": "Which needs chem d in 10% CO2\".", "src": "Theory book PDF 24 (printed 17)", "cue": "CO2", "ask": "Pneumococcal growth is enhanced by", "distinguish": "Fastidious."}, {"n": 37, "stem": "Main virulence factor of pneumococcus is", "opts": ["M protein", "Protein F", "Streptokinase", "Polysaccharide capsule"], "key": 3, "exp": "Trigger: \"Polysaccharide capsule is the most important\".", "src": "Theory book PDF 24 (printed 17)", "cue": "capsule", "ask": "Main virulence factor of pneumococcus is", "distinguish": "More than 90 serotypes."}, {"n": 38, "stem": "Quellung reaction shows", "opts": ["Lysis", "Capsule swelling with specific antibody", "Zone of inhibition", "Arrowhead hemolysis"], "key": 1, "exp": "Trigger: \"the capsule swells upon reacting with its specific Abs\".", "src": "Theory book PDF 24 (printed 17)", "cue": "Quellung", "ask": "Quellung reaction shows", "distinguish": "Methylene blue."}, {"n": 39, "stem": "High-risk groups for pneumococcal infection", "opts": ["Athletes", "Splenectomy, smokers, alcoholics, diabetics, extremes of age, CHF", "Healthy young", "Pregnant only"], "key": 1, "exp": "Trigger: \"after splenectomy, heavy smokers, alcoholics, diabetics, extremes of age... congestive heart failure\".", "src": "Theory book PDF 25 (printed 18)", "cue": "risk", "ask": "High-risk groups for pneumococcal infection", "distinguish": "Spleen clears capsulated organisms."}, {"n": 40, "stem": "Pneumococcal pneumonia is associated with bacteremia in", "opts": ["50%", "100%", "1%", "15-25%"], "key": 3, "exp": "Trigger: \"associated with bacteremia in 15-25% of cases\".", "src": "Theory book PDF 25 (printed 18)", "cue": "bacteremia", "ask": "Pneumococcal pneumonia is associated with bacteremia in", "distinguish": "Meningitis, endocarditis."}, {"n": 41, "stem": "Non-invasive pneumococcal infections", "opts": ["Sepsis", "Otitis media, sinusitis, conjunctivitis", "Endocarditis", "Meningitis"], "key": 1, "exp": "Trigger: \"Non-invasive infections: otitis media, sinusitis, and conjunct ", "cue": "bile test", "ask": "Practical: bile solubility test uses", "distinguish": "Viridans no clearing."}, {"n": 56, "stem": "Practical: Quellung test uses", "opts": ["Bile", "Anticapsular antisera and methylene blue", "Optochin", "Latex"], "key": 1, "exp": "Trigger: \"known anticapsular antisera. A drop of methylene blue... capsule is sharply outlined and appears swollen\".", "src": "Practical book PDF 12 (printed 6)", "cue": "Quellung", "ask": "Practical: Quellung test uses", "distinguish": "Positive pneumococci."}, {"n": 57, "stem": "Practical: enterococci on MacConkey and CLED", "opts": ["No growth", "Colorless", "Magenta colonies on MacConkey, yellow on CLED (lactose fermenters)", "Black"], "key": 2, "exp": "Trigger: \"small dark-red magenta colonies on MacConkey... small yellow colonies on CLED\".", "src": "Practical book PDF 12 (printed 6)", "cue": "culture", "ask": "Practical: enterococci on MacConkey and CLED", "distinguish": "Lactose fermenters."}, {"n": 58, "stem": "Practical: Enterococcus species grow over", "opts": ["10-45 C", "Only 37 C", "45-60 C", "20-30 C"], "key": 0, "exp": "Trigger: \"grow over a wide temperature range, 10-45 ºC\".", "src": "Practical book PDF 12 (printed 6)", "cue": "temperature", "ask": "Practical: Enterococcus species grow over", "distinguish": "E. faecalis main species."}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
