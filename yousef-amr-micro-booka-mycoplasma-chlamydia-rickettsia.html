 bacteria without cell wall", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 985, "stem": "Why is cultivation of Mycoplasmas challenging?", "opts": ["They grow rapidly on standard media.", "They require a special medium enriched with cholesterol.", "They are easily identifiable in Gram stains.", "They have a short incubation period."], "key": 1, "exp": "كتاب النظري: They require serum-enriched medium containing cholesterol", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 986, "stem": "What is the typical incubation period for Mycoplasma pneumoniae on cell-free media?", "opts": ["24 hours.", "48 hours.", "1 week.", "Up to 3 weeks."], "key": 3, "exp": "كتاب النظري: Culture is difficult and requires prolonged incubation", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 987, "stem": "Which of the following is a nonspecific test for Mycoplasma infection?", "opts": ["PCR.", "EIA for IgM.", "Cold agglutinins test.", "Gram stain. 109"], "key": 2, "exp": "كتاب النظري: Nonspecific test: detection of cold agglutinins", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 990, "stem": "Which of the following statements is true about Mycoplasmas?", "opts": ["They have a rigid cell wall that defines their shape.", "They are the largest bacteria that can be grown on cell-free media.", "They are pleomorphic due to the lack of a cell wall.", "They are easily detected using standard microscopy."], "key": 2, "exp": "كتاب النظري: The lack of a cell wall renders these organisms variable in shape (pleomorphic)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 991, "stem": "Why are beta-lactam antibiotics ineffective against Mycoplasmas?", "opts": ["Mycoplasmas rapidly metabolize these antibiotics.", "Beta-lactam antibiotics target the cell wall, which Mycoplasmas lack.", "Mycoplasmas have efflux pumps that expel beta-lactam antibiotics.", "Mycoplasmas produce beta-lactamase enzymes."], "key": 1, "exp": "كتاب النظري: Resistant to antibiotics which inhibit cell wall synthesis (e.g. beta-lactam antibiotics)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 992, "stem": "What is the antibiotic that is ineffective against Mycoplasma pneumoniae infection?", "opts": ["Azithromycin.", "Doxycycline.", "Erythromycin.", "Penicillin."], "key": 3, "exp": "كتاب النظري: Beta-lactams inhibit cell wall synthesis, and mycoplasmas have no cell wall", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 993, "stem": "Cold agglutinin test is positive in:", "opts": ["Mycoplasma pneumoniae.", "Malaria.", "Typhoid.", "Leishmaniasis."], "key": 0, "exp": "كتاب النظري: Cold agglutinins are detected in Mycoplasma pneumoniae infection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 994, "stem": "Which of the following organisms is associated with the infection \"salpingitis\" and \"postpartum fever\"?", "opts": ["Mycoplasma pneumoniae.", "Mycoplasma genitalium.", "Mycoplasma hominis.", "Mycoplasma bovis."], "key": 2, "exp": "كتاب النظري: Genital mycoplasmas (M. hominis, M. genitalium, U. urealyticum): PID and post-abortal or postpartum fever; M. hominis is the species classically linked to postpartum fever", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 995, "stem": "What structural feature distinguishes Mycoplasma from other bacteria?", "opts": ["Presence of capsule.", "Lack of cell wall.", "Presence of flagella.", "Double membrane."], "key": 1, "exp": "كتاب النظري: Mycoplasmas are bacteria without cell wall", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 996, "stem": "What is the consequence of lacking a cell wall in Mycoplasma?", "opts": ["Resistance to protein synthesis inhibitors.", "Resistance to beta-lactam antibiotics.", "Enhanced Gram staining.", "Increased motility. 110"], "key": 1, "exp": "كتاب النظري: The lack of a cell wall renders them resistant to antibiotics which inhibit cell wall synthesis (beta-lactams)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 997, "stem": "How does the absence of a cell wall affect Gram staining of Mycoplasma?", "opts": ["Intensely stained.", "Bipolar stained.", "Unstainable.", "Uniformly stained."], "key": 2, "exp": "كتاب النظري: The lack of a cell wall renders them unstainable by the Gram stain", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 998, "stem": "What is the shape of Mycoplasma organisms?", "opts": ["Rod-shaped.", "Cocci.", "Spiral.", "Pleomorphic."], "key": 3, "exp": "كتاب النظري: Variable in shape (pleomorphic)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 999, "stem": "What surrounds the contents of Mycoplasma cells?", "opts": ["Cell wall.", "Capsule.", "Cell membrane.", "Outer membrane."], "key": 2, "exp": "كتاب النظري: Their contents are enveloped by a cell membrane", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 1000, "stem": "What unique component is found in the cell membrane of Mycoplasma?", "opts": ["Phospholipids.", "Sterol (cholesterol).", "Peptidoglycan.", "Lipopolysaccharide."], "key": 1, "exp": "كتاب النظري: They are the only bacteria that contain sterol (in the form of cholesterol) in the cell membrane", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 1001, "stem": "What is the size status of Mycoplasma compared to other bacteria?", "opts": ["Largest.", "Medium-sized.", "Smallest.", "Variable."], "key": 2, "exp": "كتاب النظري: They are the smallest bacteria that can be grown on cell-free media", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 1002, "stem": "On what type of media can Mycoplasma grow?", "opts": ["Blood agar.", "Chocolate agar.", "Cell-free medium with cholesterol.", "MacConkey agar."], "key": 2, "exp": "كتاب النظري: They require serum-enriched medium containing cholesterol", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 1003, "stem": "What is the appearance of Mycoplasma colonies under microscope?", "opts": ["Mucoid.", "Fried-egg.", "Bipolar.", "Swarming."], "key": 1, "exp": "كتاب النظري: Minute colonies with a characteristic fried-egg appearance", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 1004, "stem": "Which species causes atypical pneumonia?", "opts": ["M. hominis.", "M. genitalium.", "M. pneumoniae.", "Ureaplasma urealyticum."], "key": 2, "exp": "كتاب النظري: M. pneumoniae: atypical pneumonia", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1005, "stem": "What percentage of pneumonia cases is caused by M. pneumoniae?", "opts": ["5%.", "10%.", "20%.", "30%."], "key": 2, "exp": "كتاب النظري: Atypical pneumonia (20% of pneumonia cases)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1006, "stem": "Which is?", "opts": ["Highly reliable.", "Limited value.", "Diagnostic.", "Essential."], "key": 1, "exp": "كتاب النظري: Direct microscopical detection (smear) is of limited value", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1012, "stem": "How long does culture of M. pneumoniae typically take?", "opts": ["1–2 days.", "3–5 days.", "Up to 3 weeks.", "12 hours."], "key": 2, "exp": "كتاب النظري: Culture is difficult and requires prolonged incubation", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1013, "stem": "What method detects Mycoplasma antigens directly?", "opts": ["Gram stain.", "ELISA.", "Immunofluorescence.", "PCR."], "key": 2, "exp": "كتاب النظري: Direct detection of antigens by immunofluorescence using specific antisera", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1014, "stem": "What molecular method is used for Mycoplasma detection?", "opts": ["Southern blot.", "DNA probes or PCR.", "Western blot.", "Slide agglutination."], "key": 1, "exp": "كتاب النظري: Direct detection of nucleic acid by DNA probes or PCR", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1016, "stem": "What serological test is diagnostic for Mycoplasma infection?", "opts": ["Detection of IgA.", "Detection of IgM or fourfold rise in IgG.", "Detection of IgE.", "Detection of IgD."], "key": 1, "exp": "كتاب النظري: Detection of IgM or a fourfold rise in IgG antibody titer by ELISA is diagnostic", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 114 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 114}, {"n": 1017, "stem": "What nonspecific test is used in Mycoplasma diagnosis?", "opts": ["Widal test.", "Cold agglutinins.", "Coombs test.", "Mantoux test."], "key": 1, "exp": "كتاب ا ة من عندنا مش من الملف)", "sk": 1, "pg": 115}, {"n": 1027, "stem": "The following diseases are caused by Chlamydia trachomatis, EXCEPT:", "opts": ["Non gonococcal urethritis.", "Psittacosis.", "Trachoma.", "Lymphogranuloma venereum.", "Inclusion conjunctivitis."], "key": 1, "exp": "كتاب النظري: Psittacosis is caused by Chlamydophila psittaci, not C. trachomatis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 118 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 118}, {"n": 1028, "stem": "What transformation occurs once an EB is inside the host cell?", "opts": ["It forms a spore.", "It becomes a reticulate body (RB).", "It divides into two EBs.", "It is released immediately. 113"], "key": 1, "exp": "كتاب النظري: Inside the host cell the EB transforms into the reticulate body (replicating form)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 115 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 115}, {"n": 1029, "stem": "What method is used to stain intra-cytoplasmic inclusion bodies?", "opts": ["Gram stain.", "Giemsa stain.", "Crystal violet stain.", "Methylene blue stain."], "key": 1, "exp": "كتاب النظري: Intra-cytoplasmic inclusion bodies detected by Giemsa stain", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 117 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 117}, {"n": 1030, "stem": "Which species of Chlamydia is associated with genital tract infections?", "opts": ["Chlamydia trachomatis.", "Chlamydophila pneumoniae.", "Chlamydophila psittaci.", "Chlamydia psittaci."], "key": 0, "exp": "كتاب النظري: C. trachomatis causes genital tract infections (STD)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 116 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 116}, {"n": 1031, "stem": "Which serotype of Chlamydia trachomatis causes nongonococcal urethritis?", "opts": ["A-C.", "D-K.", "L1-L3.", "D-M."], "key": 1, "exp": "كتاب النظري: Nongonococcal urethritis is caused by serotypes D-K", "src": "كتاب النظري Infection & Im  <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>

 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
