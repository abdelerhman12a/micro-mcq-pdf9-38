</style></head><body><div class="w" id="app"></div><script>const Q=[{"n": 931, "stem": "M. tuberculosis can be isolated by culture on:", "opts": ["Blood agar.", "Loeffler's serum.", "Modified Thayer-Martin.", "Thiosulfate citrate bile salt sucrose (TCBS) agar.", "Lowenstein-Jensen medium."], "key": 4, "exp": "كتاب النظري: M. tuberculosis culture on Lowenstein-Jensen (egg-based, selective with malachite green)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 102 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 102}, {"n": 932, "stem": "As regards the diagnosis of tuberculosis, the following are correct, EXCEPT:", "opts": ["Three morning sputum samples should be examined.", "Tuberculin test may give false positive and false negative results.", "Detection of acid-fast bacilli in smears provides early presumptive diagnosis.", "Liquefaction of tenacious samples is required before culture.", "Growth on Lowenstein-Jensen medium appears after 48-72 hours."], "key": 4, "exp": "كتاب النظري: Colonies appear after about 2-8 weeks of incubation, not 48-72 hours", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 933, "stem": "Regarding tuberculin test:", "opts": ["It depends on immediate hypersensitivity.", "It depends on presence of sensitized Th2 cells.", "A wheal and flare is considered positive.", "People vaccinated with BCG give a negative result.", "It is read after 48-72 hours. 103"], "key": 4, "exp": "كتاب النظري: TST result is read after 48-72 h by palpating induration", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 106 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 106}, {"n": 934, "stem": "Treatment of tuberculous disease:", "opts": ["Is initiated with a single first line chemotherapeutic agent.", "Usually requires prolonged bed rest and surgery.", "Is continued until tuberculin test reverts to negative.", "Always results in negative sputum cultures and clinical cure within 3 weeks.", "Always necessitates the use of combined, prolonged drug therapy."], "key": 4, "exp": "كتاب النظري: Combination of 4 drugs or more for at least 6 months is essential", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 108 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 108}, {"n": 935, "stem": "BCG vaccine, used for the prevention of tuberculosis is:", "opts": ["Heat killed vaccine.", "Formalin inactivated vaccine.", "Living attenuated vaccine.", "Recombinant vaccine.", "Bacterial toxoid prepared from M. tuberculosis."], "key": 2, "exp": "كتاب النظري: BCG is a live attenuated vaccine prepared from M. bovis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 109 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 109}, {"n": 936, "stem": "Which of the following organisms cannot be grown on artificial media?", "opts": ["S. Pyogenes.", "S. Epidermidis.", "K. Pneumoniae.", "Salmonella Typhi.", "M. Leprae."], "key": 4, "exp": "كتاب النظري: M. leprae has not yet been successfully cultured in vitro", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 110 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 110}, {"n": 937, "stem": "Tuberculoid leprosy has the following features, EXCEPT:", "opts": ["Lepromin test is positive.", "The course of the disease is benign.", "Cell-mediated immunity is intact.", "Acid fast bacilli are few in tissue smears.", "Th2-type response is dominant."], "key": 4, "exp": "كتاب النظري: Tuberculoid leprosy: predominant CMI, Th1, lepromin positive, few AFB - Th2 is the lepromatous pole", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 111 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 111}, {"n": 938, "stem": "Mycobacterium tuberculosis is classified as:", "opts": ["Obligate anaerobe.", "Facultative anaerobe.", "Obligate aerobe.", "Microaerophilic."], "key": 2, "exp": "كتاب النظري: Mycobacteria are obligate aerobes", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 939, "stem": "Which medium is selective for the growth of M. tuberculosis?", "opts": ["MacConkey agar.", "Sabouraud agar.", "Lowenstein-Jensen medium.", "Blood agar."], "key": 2, "exp": "كتاب النظري: L-J medium rendered selective by malachite green", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 102 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 102}, {"n": 940, "stem": "What is the primary mode of transmission for Mycobacterium tuberculosis?", "opts": ["Fecal-oral route.", "Vector-borne transmission.", "Aerosol infection.", "Direct skin contact."], "key": 2, "exp": "كتاب النظري: Transmission by aerosol (airborne) inhalation of droplet nuclei", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 941, "stem": "Which component of the Mycobacterium cell wall is responsible for acidfastness?", "opts": ["Peptidoglycan.", "Mycolic acid.", "Lipopolysaccharide.", "Teichoic acid."], "key": 1, "exp": "كتاب النظري: The cell wall of mycobacteria is rich in lipids that render them acid-fast (the mycolic-acid lipid layer)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 942, "stem": "Which of the following is a non-tuberculous mycobacterium (NTM)?", "opts": ["M. leprae.", "M. bovis.", "M. avium.", "M. tuberculosis."], "key": 2, "exp": "كتاب النظري: Nontuberculous mycobacteria e.g. M. avium and M. fortuitum", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 102 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 102}, {"n": 943, "stem": "What is the incubation period for visible colonies of M. tuberculosis on solid media?", "opts": ["1-3 days.", "4-6 days.", "2-8 weeks.", "10-14 days. 104"], "key": 2, "exp": "كتاب النظري: Colonies appear after about 2-8 weeks of incubation at 37 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 944, "stem": "Which of the following factors contributes to the intracellular survival of M. tuberculosis within macrophages?", "opts": ["Exotoxin production.", "Inhibition of phagolysosome fusion.", "Flagella-mediated motility.", "Capsule formation."], "key": 1, "exp": "كتاب النظري: Bacilli survive intracellularly by inhibiting fusion of phagosomes and lysosomes", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 945, "stem": "Which medium is a broth used for the cultivation of mycobacteria?", "opts": ["Blood broth.", "Sabouraud broth.", "Middlebrook broth.", "Tryptic soy broth."], "key": 2, "exp": "كتاب النظري: Middlebrook broth is used as the base for fluid culture systems (BACTEC, MGIT)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 105 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 105}, {"n": 946, "stem": "Which of the following is a characteristic feature of Mycobacterium leprae?", "opts": ["Rapid growth on artificial media.", "Obligatory intracellular pathogen.", "Presence of flagella.", "Formation of biofilms."], "key": 1, "exp": "كتاب النظري: M. leprae occurs chiefly in bundles within infected cells and cannot be cultured in vitro (obligatory intracellular)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 110 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 110}, {"n": 947, "stem": "Which test measures the release of IFN-γ in response to specific M. tuberculosis antigens?", "opts": ["Tuberculin Skin Test (TST).", "PCR.", "QuantiFERON TB test.", "Ziehl-Neelsen test."], "key": 2, "exp": "كتاب النظري: QuantiFERON TB: measurement of IFN-gamma released from sensitized T-lymphocytes after exposure to ESAT-6/CFP-10", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 108 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 108}, {"n": 948, "stem": "Which of the following is a key feature of the Mycobacterium cell wall that contributes to its pathogenicity?", "opts": ["Capsule formation.", "High lipid content.", "Peptidoglycan thickness.", "Exotoxin production."], "key": 1, "exp": "كتاب النظري: The cell wall of mycobacteria is rich in lipids (acid-fastness)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 949, "stem": "Which of the following is NOT a first-line drug for tuberculosis treatment?", "opts": ["Isoniazid (INH).", "Rifampin.", "Pyrazinamide.", "Fluoroquinolones."], "key": 3, "exp": "كتاب النظري: Fluoroquinolones are second-line drugs, used only if resistance occurs", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 109 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 109}, {"n": 950, "stem": "Which acid is a major component of the mycobacterial cell wall?", "opts": ["Mycolic acid.", "Hyaluronic acid.", "Lactic acid.", "Palmitic acid."], "key": 0, "exp": "كتاب النظري: The mycobacterial cell wall is rich in lipids (mycolic acid) rendering it acid-fast", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 951, "stem": "Which of the following is NOT true about Mycobacterium tuberculosis?", "opts": ["It is an obligate aerobe.", "It is a spore-forming bacterium.", "It is an acid-fast bacillus.", "It has a waxy cell wall."], "key": 1, "exp": "كتاب النظري: M. tuberculosis is acid-fast, lipid-rich (waxy) wall, obligate aerobe - it does not form spores", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 952, "stem": "Which of the following is true about the Mantoux test?", "opts": ["It measures the level of serum antibodies.", "It detects a delayed hypersensitivity reaction.", "It is specific for M. tuberculosis infection.", "It requires a blood sample."], "key": 1, "exp": "كتاب النظري: TST detects delayed hypersensitivity response to previous exposure to tubercle bacilli", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 106 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 106}, {"n": 953, "stem": "Which of the following is a feature of lepromatous leprosy?", "opts": ["Single, well-demarcated skin lesion.", "Hypopigmented macules with loss of sensation.", "Numerous lesions with a high bacterial load.", "Strong immune response. 105"], "key": 2, "exp": "كتاب النظري: Lepromatous leprosy: nodular lesions, bacteraemia present, AFB abundant (multibacillary)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 111 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 111}, {"n": 954, "stem": "Which type of hypersensitivity reaction is involved in the Tuberculin Skin Test (TST)?", "opts": ["Type I.", "Type II.", "Type III.", "Type IV."], "key": 3, "exp": "كتاب النظري: TST detects a delayed hypersensitivity response (type IV)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 106 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 106}, {"n": 955, "stem": "Which method is used to detect latent TB infection?", "opts": ["Acid-fast staining.", "Culture on Lowenstein-Jensen medium.", "Interferon-gamma release assay (IGRA).", "Sputum microscopy."], "key": 2, "exp": "كتاب النظري: QuantiFERON TB (IFN-gamma release assay) for latent TB infection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 108 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 108}, {"n": 956, "stem": "What type of bacteria are Mycobacterium?", "opts": ["Gram-positive cocci.", "Gram-negative bacilli.", "Acid-fast bacilli.", "Spore-forming bacteria."], "key": 2, "exp": "كتاب النظري: Mycobacteria are acid-fast bacilli (Ziehl-Neelsen)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 957, "stem": "Which of the following is the hallmark of a positive Tuberculin Skin Test (TST)?", "opts": ["Induration at the injection site.", "Redness at the injection site.", "Pain at the injection site.", "Blistering at the injection site."], "key": 0, "exp": "كتاب النظري: The result is read by palpating for the presence of induration; the diameter of the induration (not erythema) is measured", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 106 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 106}, {"n": 958, "stem": "Which drug is specifically used to treat M. leprae infections?", "opts": ["Isoniazid (INH).", "Rifampin.", "Dapsone.", "Pyrazinamide."], "key": 2, "exp": "كتاب النظري: Leprosy treatment: dapsone + rifampicin (tuberculoid); + clofazimine (lepromatous)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 112 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 112}, {"n": 959, "stem": "Which of the following is an early clinical sign of tuberculoid leprosy?", "opts": ["Hypopigmented macules with anesthesia.", "Diffuse skin thickening.", "Nodular skin lesions.", "Severe muscle weakness."], "key": 0, "exp": "كتاب النظري: Tuberculoid leprosy: hypopigmented macular skin lesions with asymmetric nerve affection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 111 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 111}, {"n": 960, "stem": "Which of the following is the gold standard for diagnosing tuberculosis?", "opts": ["Sputum smear microscopy.", "Chest X-ray.", "Culture on Lowenstein-Jensen medium.", "Tuberculin Skin Test (TST)."], "key": 2, "exp": "كتاب النظري: Definitive laboratory diagnosis of TB depends on detection and isolation of M. tuberculosis (culture, e.g. L-J)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 105 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 105}, {"n": 961, "stem": "Which of the following statements about latent tuberculosis infection (LTBI) is, TRUE?", "opts": ["LTBI is highly contagious.", "LTBI shows symptoms similar to active TB.", "LTBI can progress to active TB disease if untreated.", "LTBI is diagnosed based on a positive chest X-ray."], "key": 2, "exp": "كتاب النظري: Under immunosuppression, latent TB can reactivate and progress to TB disease", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 104 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 104}, {"n": 962, "stem": "Which of the following is a characteristic feature of lepromatous leprosy?", "opts": ["Few, well-demarcated skin lesions.", "High bacterial load in skin lesions.", "Positive tuberculin skin test.", "Thickened peripheral nerves without skin lesions. 106"], "key": 1, "exp": "كتاب النظري: Lepromatous leprosy: AFB abundant (multibacillary leprosy)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 111 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 111}, {"n": 963, "stem": "What is the method used by Mycobacterium tuberculosis bacteria to avoid innate immunity?", "opts": ["Destruction of complement components.", "Interference with phagosome-lysosome fusion.", "Living in an immuno-rich tissue site.", "Presence of a polysaccharide capsule."], "key": 1, "exp": "كتاب النظري: Bacilli survive by inhibiting fusion of phagosomes and lysosomes", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 964, "stem": "What is the type of Mycobacterium tuberculosis according to Oxygen requirement?", "opts": ["Aerotolerant.", "Facultative anaerobe.", "Microaerophile.", "Obligate aerobe.", "Obligate anaerobe."], "key": 3, "exp": "كتاب النظري: Mycobacteria are obligate aerobes", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 101 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 101}, {"n": 965, "stem": "What is the main pathogenic mechanism involved in tuberculosis?", "opts": ["Toxin production by the mycobacteria.", "Specific cell adhesion sites.", "Cell-mediated hypersensitivity.", "Humoral immunity.", "Clogging of alveoli by large numbers of mycobacteria."], "key": 2, "exp": "كتاب النظري: Cell-mediated immune response is the main immune mechanism against mycobacteria, resulting in granuloma (tubercle) formation", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 966, "stem": "What is the most common route through which tuberculosis is acquired?", "opts": ["Gastrointestinal tract.", "Genital tract.", "Respiratory tract.", "Skin."], "key": 2, "exp": "كتاب النظري: Aerosol (airborne) infection by inhalation of droplet nuclei", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 967, "stem": "Strains of M. tuberculosis that are resistant to isoniazid and rifampicin are described as which of the following?", "opts": ["Dormant TB.", "Extensive drug resistant TB.", "Latent TB.", "Miliary TB.", "Multidrug resistant TB."], "key": 4, "exp": "كتاب النظري: MDR means resistance to both isoniazid and rifampin", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 109 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 109}, {"n": 968, "stem": "Why should anti-tuberculous drugs be in combination?", "opts": ["To allow short term treatment.", "To prevent complications of tuberculosis.", "To prevent emergence of resistance.", "To prevent spread of infection."], "key": 2, "exp": "كتاب النظري: Combination therapy is essential to prevent the emergence of drug-resistant mutants", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 108 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 108}, {"n": 969, "stem": "Concerning microscopic examination of a sputum specimen from a suspected tuberculous patient, what is name of the used stain?", "opts": ["Carbol fuchsin.", "Gram.", "Methylene blue.", "Ziehl-Neelsen."], "key": 3, "exp": "كتاب النظري: Smears from sputum are subjected to acid-fast staining: Ziehl-Neelsen", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 105 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 105}, {"n": 970, "stem": "Which of the given bacteria causes tuberculosis infection in animals and can be transmitted to human by consumption of milk and other animal products?", "opts": ["Mycobacterium ulcerans.", "Mycobacterium leprae.", "Mycobacterium bovis.", "Mycobacterium abscessus. 107"], "key": 2, "exp": "كتاب النظري: Ingestion of milk contaminated with M. bovis may cause intestinal infection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 103 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 103}, {"n": 971, "stem": "The following are true about leprosy:", "opts": ["Caused bv gram negative bacilli.", "Tuberculoid leprosy is the severe form.", "More bacilli are found 'in skin of patient with leprornatous type than tuberculoid type.", "Prevented by BCG Vaccine."], "key": 2, "exp": "كتاب النظري: Lepromatous leprosy has abundant AFB (multibacillary); tuberculoid has few (paucibacillary)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 111 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 111}, {"n": 972, "stem": "The clinical form of leprosy is depending on:", "opts": ["CMI of patient.", "Innate immunity of patient.", "Virulence factors of bacteria.", "Production of antibodies."], "key": 0, "exp": "كتاب النظري: The clinical form (tuberculoid vs lepromatous) depends on the patient's CMI (strong vs weak)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 111 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 111}, {"n": 973, "stem": "Leprosy is mainly diagnosed by:", "opts": ["Gram stain.", "Culture.", "ZN stain.", "Inoculation in guinea pig."], "key": 2, "exp": "كتاب النظري: Smears stained with modified Z-N show intracellular AFB in bunches; a positive smear is sufficient for diagnosis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 112 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 112}, {"n": 974, "stem": "Which treatment is most appropriate for leprosy therapy:", "opts": ["Dapsone, Rifampicin.", "INH, Rifampicin.", "SXT, streptomycin.", "Rifampicin, streptomycin.", "Penicillin, gentamycin."], "key <script>
const PAGE=window.__PAGE__;
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

<button class="btn g" onclick="start(shuffle(Q).slice(0,40),'practice')">Practice: 40 random</button>

function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;

 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}

 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}

 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
