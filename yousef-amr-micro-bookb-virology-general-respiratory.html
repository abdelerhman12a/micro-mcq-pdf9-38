?", "opts": ["Genome.", "Envelope.", "Capsid.", "Spikes."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 275, "stem": "What is the function of glycoprotein spikes in enveloped viruses?", "opts": ["Provide structural integrity.", "Attach to host cell receptors.", "Protect the nucleic acid.", "Enable viral assembly."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 276, "stem": "Which of the following viruses has a complex symmetry?", "opts": ["Poliovirus.", "Herpes simplex virus.", "Rabies virus.", "Bacteriophages."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 277, "stem": "What is the role of the viral capsid in non-enveloped viruses?", "opts": ["Mediate fusion with host cell membrane.", "Protect the viral genome and facilitate attachment to host cells.", "Encapsulate the viral enzymes.", "Provide the energy required for viral replication."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 278, "stem": "Which of the following is a characteristic of chronic viral infections?", "opts": ["Rapid viral replication and cell death.", "Persistent low-level replication with minimal symptoms.", "Complete clearance of the virus by the immune system.", "Infection limited to a specific tissue type."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 279, "stem": "What is the outcome of viral latency?", "opts": ["Immediate cell lysis.", "Persistent viral replication.", "Dormant virus within the host cell with potential reactivation.", "Virus elimination by the immune system."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 280, "stem": "Enveloped viruses mediate attachment to host cells by:", "opts": ["Capsid.", "Spikes.", "Genome.", "Capsule. 32"], "key": 1, "exp": "", "src": "المفتاح ا ": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1270, "stem": "What does antigenic shift result from?", "opts": ["Minor mutations in RNA.", "Gene reassortment.", "Environmental changes.", "Antibody response."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1271, "stem": "What is the main method for treating influenza within 1-2 days of disease onset?", "opts": ["Amantadine.", "Rimantadine.", "Oseltamivir.", "Zanamivir."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1272, "stem": "Which glycoprotein is involved in the release of viruses from infected cells?", "opts": ["Haemagglutinin (HA).", "Neuraminidase (NA).", "Nucleoprotein.", "Mucin."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1273, "stem": "What differentiates antigenic shift from antigenic drift in influenza viruses?", "opts": ["Shift involves minor changes, drift involves major changes.", "Shift involves major changes, drift involves minor changes.", "Drift occurs every 10 years, shift occurs every year.", "Drift is caused by gene reassortment, shift by mutation."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1274, "stem": "Which feature of influenza viruses facilitates gene reassortment?", "opts": ["Single RNA segment.", "Double-stranded RNA.", "Segmented RNA.", "Circular RNA. 147"], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1275, "stem": "How does antigenic shift contribute to pandemic outbreaks?", "opts": ["It causes minor changes in viral antigens.", "It results from gene reassortment, leading to new strains.", "It involves gradual mutations over many years.", "It is less severe compared to antigenic drift."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n" e of the following best characterizes the vaccine for measles?", "opts": ["Toxoid.", "Inactivated virus vaccine.", "Killed virus vaccine.", "Live attenuated virus vaccine.", "Recombinant viral vaccine."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1282, "stem": "Rubella infection can be prevented by:", "opts": ["A heat inactivated (killed) vaccine.", "A formalin inactivated toxoid.", "A recombinant vaccine.", "A split vaccine.", "A living attenuated vaccine."], "key": 4, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1283, "stem": "Which virus is associated with Koplik’s spots?", "opts": ["Mumps.", "Rubella.", "Measles.", "Coronavirus."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1284, "stem": "What is the common method of transmission for Mumps?", "opts": ["Waterborne.", "Foodborne.", "Droplets.", "Vector-borne."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1285, "stem": "Which virus can lead to congenital anomalies if contracted during pregnancy?", "opts": ["Measles.", "Mumps.", "Rubella.", "Coronavirus."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1286, "stem": "What is the incubation period for Rubella?", "opts": ["1-2 weeks.", "2-3 weeks.", "2-6 days.", "4-5 weeks."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1287, "stem": "What is the main method of diagnosing SARS and MERS?", "opts": ["Blood test.", "ELISA.", "PCR.", "X-ray."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1288, "stem": "Which of the following complications is associated with Mumps in postpubertal males?", "opts": ["Encephalitis.", "Orchitis.", "Pancreatitis.", "Meningitis."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1289, "stem": "Which viral disease can lead to Subacute Sclerosing Panencephalitis (SSPE) years after infection?", "opts": ["Mumps.", "Rubella.", "Measles.", "COVID-19."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1290, "stem": "Which virus is primarily responsible for bronchiolitis in infants?", "opts": ["Coronavirus.", "RSV.", "Measles.", "Mumps. 149"], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1291, "stem": "What is a characteristic sign of a Measles infection?", "opts": ["Parotid gland swelling.", "Posterior auricular lymphadenopathy.", "Maculopapular rash that starts at the head.", "Runny nose."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1292, "stem": "Which virus is associated with atypical pneumonia and has a mortality rate of about 10%?", "opts": ["MERS-COV.", "SARS-COV.", "RSV.", "Rubella."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1293, "stem": "What is the key method of preventing congenital rubella syndrome?", "opts": ["Administering antibiotics.", "Vaccination of prepubertal girls.", "Sterilization procedures.", "Administering antiviral drugs."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1294, "stem": "Which disease is characterized by painful swelling of one or both parotid glands?", "opts": ["Measles.", "Mumps.", "Rubella.", "COVID-19."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1295, "stem": "Which virus is known for causing severe complications in malnourished children?", "opts": ["Mumps.", "Rubella.", "Measles.", "RSV."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1296, "stem": "Which virus is responsible for MERS, first reported in Saudi Arabia <script>

 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;

 const wo=document.getElementById('wo').checked;
