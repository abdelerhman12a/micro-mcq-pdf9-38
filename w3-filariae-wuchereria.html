<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filariae: general characters and Wuchereria bancrofti - Lecture (para) - Week 3 timetable</title><style>

a.lnk{color:var(--blue)}

nd."}, {"n": 17, "stem": "Acute filariasis manifestations", "opts": ["Elephantiasis", "Lymphadenitis and lymphangitis with fever, orchitis and epididymitis in males", "Chyluria", "Hydrocele"], "key": 1, "exp": "Trigger: \"Inflammatory manifestations, lymphadenitis and lymphangitis... orchitis and epididymitis\".", "src": "Theory book PDF 340-341 (printed 332-333)", "cue": "acute", "ask": "Acute filariasis manifestations", "distinguish": "Eosinophilia."}, {"n": 18, "stem": "Elephantiasis takes to appear", "opts": ["50 years", "1 week", "1 month", "5-10 years"], "key": 3, "exp": "Trigger: \"Elephantiasis: takes about 5-10 years to appear\".", "src": "Theory book PDF 341 (printed 333)", "cue": "elephantiasis", "ask": "Elephantiasis takes to appear", "distinguish": "Chronic."}, {"n": 19, "stem": "Chyluria is", "opts": ["Protein", "Lymph in urine from rupture of lymphatics, milky", "Blood in urine", "Pus"], "key": 1, "exp": "Trigger: \"rupture of distended lymphatics in urinary passages leads to appearance of lymph in urine giving it milky appearance\".", "src": "Theory book PDF 341 (printed 333)", "cue": "chyluria", "ask": "Chyluria is", "distinguish": "Chronic stage."}, {"n": 20, "stem": "Chronic filariasis in males", "opts": ["Cryptorchidism", "Prostatitis", "Varicosities with hydrocele and chronic epididymitis", "Orchitis only"], "key": 2, "exp": "Trigger: \"varicosities with hydrocele, chronic epididymitis\".", "src": "Theory book PDF 341 (printed 333)", "cue": "male", "ask": "Chronic filariasis in males", "distinguish": "Scrotal skin."}, {"n": 21, "stem": "Best blood film for microfilariae", "opts": ["Day thick", "Giemsa thick film taken at night (10 pm to 2 am)", "Morning thin", "Unstained"], "key": 1, "exp": "Trigger: \"Giemsa stained thick blood film at night (10 pm to 2 am)\".", "src": "Theory book PDF 342 (printed 334)", "cue": "film", "ask": "Best blood film for microfilariae", "distinguish": "Periodicity."}, {"n": 22, "stem": "Provocation test uses", "opts": ["Albendazole", "Antihistamine", "Diethylcarbamazine to bring microfilariae to blood by day", "Ivermectin"], "key": 2, "exp": "Trigger: \"giving DEC which forces microfilariae to appear in peripheral blood during day time\".", "src": "Theory book PDF 342 (printed 334)", "cue": "provocation", "ask": "Provocation test uses", "distinguish": "Daytime sampling."}, {"n": 23, "stem": "Knott's concentration", "opts": ["Blood only", "1 ml blood with 9 ml 2% formalin, examine sediment", "Culture", "10 ml saline"], "key": 1, "exp": "Trigger: \"1 ml of anticoagulated patient's blood is added to a tube containing 9ml formalin (2%)\".", "src": "Theory book PDF 342 (printed 334)", "cue": "Knott", "ask": "Knott's concentration", "distinguish": "Giemsa after."}, {"n": 24, "stem": "Filarial dance sign", "opts": ["Worms moving in lymphatics on ultrasound", "MRI", "CT", "X-ray"], "key": 0, "exp": "Trigger: \"Ultrasonography: worms are seen actively moving inside lymphatics (filarial dance sign)\".", "src": "Theory book PDF 342 (printed 334)", "cue": "dance", "ask": "Filarial dance sign", "distinguish": "US."}, {"n": 25, "stem": "Intradermal test in filariasis", "opts": ["Tuberculin", "Casoni", "Dog filaria antigen, delayed hypersensitivity, epidemiological", "Bachman"], "key": 2, "exp": "Trigger: \"Antigen extracted from dog Filaria to detect the delayed type hypersensitivity\".", "src": "Theory book PDF 342 (printed 334)", "cue": "intradermal", "ask": "Intradermal test in filariasis", "distinguish": "Epidemiology."}, {"n": 26, "stem": "Drug of choice in W. bancrofti", "opts": ["Praziquantel", "Ivermectin", "Albendazole", "Diethylcarbamazine (microfilaricidal and kills adults)"], "key": 3, "exp": "Trigger: \"Diethylcarbamazine (Hetrazan): it's the drug of choice: microfilaricidal... also capable of killing adults\".", "src": "Theory book PDF 343 (printed 335)", "cue": "DEC", "ask": "Drug of choice in W. bancrofti", "distinguish": "Albendazole kills adults."}, {"n": 27, "stem": "Ivermectin in filariasis is", "opts": ["Both", "Neither", "Only microfilaricidal", "Adulticidal"], "key": 2, "exp": "Trigger: \"Ivermectin: it is only microfilaricidal\".", "src": "Theory book PDF 343 (printed 335)", "cue": "ivermectin", "ask": "Ivermectin in filariasis is", "distinguish": "Albendazole adults."}, {"n": 28, "stem": "Antihistamines and steroids are given after DEC because", "opts": ["Rapid parasite destruction causes allergic reaction", "Toxicity", "Fever only", "Bacterial infection"], "key": 0, "exp": "Trigger: \"allergic reaction due to DCE (due to rapid parasite destruction)\".", "src": "Theory book PDF 343 (printed 335)", "cue": "allergic", "ask": "Antihistamines and steroids are given after DEC because", "distinguish": "Symptomatic."}, {"n": 29, "stem": "Surgery for filariasis", "opts": ["Lymph node removal", "Excision of chronic hydrocele or elephantoid skin after DEC", "Never", "Before DEC"], "key": 1, "exp": "Trigger: \"surgical excision of chronic hydrocele or elephantoid skin after a course of DEC\".", "src": "Theory book PDF 343 (printed 335)", "cue": "surgery", "ask": "Surgery for filariasis", "distinguish": "After DEC."}, {"n": 30, "stem": "Mass treatment of filariasis", "opts": ["Praziquantel", "DEC and ivermectin", "Albendazole alone", "Metronidazole"], "key": 1, "exp": "Trigger: \"Mass treatment: DEC and Ivermectin\".", "src": "Theory book PDF 343 (printed 335)", "cue": "mass", "ask": "Mass treatment of filariasis", "distinguish": "Mosquito control."}, {"n": 31, "stem": "Occult filariasis is", "opts": ["Heavy microfilaremia", "Elephantiasis", "Hypersensitivity to microfilarial antigens with no microfilariae in blood and massive eosinophilia", "Chyluria"], "key": 2, "exp": "Trigger: \"Microfilariae are not found in blood... Massive eosinophilia (30-80%)\".", "src": "Theory book PDF 343 (printed 335)", "cue": "occult", "ask": "Occult filariasis is", "distinguish": "Classical features absent."}, {"n": 32, "stem": "Tropical pulmonary eosinophilia", "opts": ["Chyluria", "Hydrocele", "Skin nodules", "Nocturnal cough, asthma-like wheezing, high IgE, mottled X-ray like miliary TB"], "key": 3, "exp": "Trigger: \"dry nocturnal cough, dyspnea, and asthmatic wheezing... high level of serum IgE... mottled shadows similar to miliary tuberculosis\".", "src": "Theory book PDF 344 (printed 336)", "cue": "TPE", "ask": "Tropical pulmonary eosinophilia", "distinguish": "Responds to DEC."}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
