rus that requires a helper virus for replication?", "opts": ["Hepatitis A.", "Hepatitis B.", "Hepatitis C.", "Hepatitis D."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1236, "stem": "Which of the following is a marker of Hepatitis B virus infection indicating high infectivity?", "opts": ["HBsAg.", "HBeAg.", "HBcAb (IgG).", "HBsAb."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1237, "stem": "Which Hepatitis virus is primarily transmitted through contaminated food or water?", "opts": ["Hepatitis B.", "Hepatitis C.", "Hepatitis D.", "Hepatitis E."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1238, "stem": "Which of the following is NOT a typical feature of Hepatitis C virus infection?", "opts": ["High mortality rate in pregnant women.", "Chronic carriage rate more than 80%.", "High risk of hepatocellular carcinoma.", "Can be asymptomatic."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1239, "stem": "What is the role of HBV in the pathogenesis of Hepatitis D infection?", "opts": ["HBV provides the envelope protein for HDV.", "HBV destroys Hepatitis D virus.", "HBV inhibits replication of Hepatitis D virus.", "HBV has no interaction with Hepatitis D virus. 143"], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1240, "stem": "Which method is used to determine the need for therapy in Hepatitis C infections?", "opts": ["Detection of anti-HCV antibodies.", "Liver biopsy.", "Viral RNA PCR.", "Liver function tests."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1241, "stem": "What is the significance of detecting HBeAb in Hepatitis B virus infection?", "opts": ["Indicates high infectivity.", "Indicates the end of the acute phase.", "Indicates low infectivity.", "Indicates resolution of infection."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1242, "stem": "Which marker is used to assess the efficacy of Hepatitis C treatment?", "opts": ["Anti-HCV antibodies.", "HCV-RNA levels.", "Liver biopsy results.", "Liver function tests."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1243, "stem": "What is the main prevention strategy for Hepatitis C virus infection?", "opts": ["Vaccination.", "Screening of blood before transfusion.", "Avoiding contaminated food.", "Using Hepatitis C immunoglobulins."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}];

<script>
