const IMG={};
const Q=[{"n": 1, "img": null, "kind": "definition", "stem": "Bacteria that require 5% O2 and 10% CO2 for growth are called:", "opts": ["Obligate aerobic", "Microaerophilic", "Aerotolerant anaerobic", "Facultative anaerobic"], "key": 1, "exp": "Answer: Microaerophilic. Book trigger: \"microaerophilic (requiring 5% O2 and 10% CO2)\".", "src": "PDF 89 (printed 82)"}, {"n": 2, "img": null, "kind": "association", "stem": "Which foods are common sources of Campylobacter?", "opts": ["Home-canned vegetables", "Soft cheese only", "Reheated rice", "Poultry, raw milk and meat"], "key": 3, "exp": "Answer: Poultry, raw milk and meat. Book trigger: \"Common foods include poultry, raw milk, meat, fruits and vegetables\".", "src": "PDF 90 (printed 83)"}, {"n": 3, "img": null, "kind": "association", "stem": "Which CO2 concentration enhances H. influenzae growth?", "opts": ["10% CO2", "1% CO2", "5% CO2", "20% CO2"], "key": 2, "exp": "Answer: 5% CO2. Book trigger: \"Growth is enhanced by 5% CO2\".", "src": "PDF 98 (printed 91)"}, {"n": 4, "img": null, "kind": "association", "stem": "Which antibiotics are useful in cholera treatment?", "opts": ["Tetracycline or ciprofloxacin", "Vancomycin or metronidazole", "Streptomycin or gentamycin", "Penicillin G or ampicillin"], "key": 0, "exp": "Answer: Tetracycline or ciprofloxacin. Book trigger: \"Antibiotics such as tetracycline or ciprofloxacin are useful in treatment\".", "src": "PDF 88 (printed 81)"}, {"n": 5, "img": null, "kind": "association", "stem": "Which drugs are effective for chancroid?", "opts": ["Ceftriaxone and erythromycin", "Doxycycline and rifampin", "Penicillin G only", "Streptomycin only"], "key": 0, "exp": "Answer: Ceftriaxone and erythromycin. Book trigger: \"Treatment: Ceftriaxone and erythromycin are effective\".", "src": "PDF 100 (printed 93)"}, {"n": 6, "img": null, "kind": "except", "stem": "Regarding the virulence factors of Bordetella pertussis, all of the following are true EXCEPT:", "opts": ["Tracheal cytotoxin kills ciliated respiratory cells", "Pertussis toxin acts as an adhesin and as a toxin", "Filamentous haemagglutinin mediates attachment", "Adenyl cyclase toxin enhances leucocyte chemotaxis"], "key": 3, "exp": "Answer: Adenyl cyclase toxin enhances leucocyte chemotaxis. Book trigger: \"It impaires leucocyte chemotaxis\".", "src": "PDF 102 (printed 95)"}, {"n": 7, "img": null, "kind": "definition", "stem": "Growth of H. influenzae on blood agar around colonies of a hemolytic organism such as S. aureus is called:", "opts": ["Zone phenomenon", "Satellitism", "Pellicle formation", "Swarming"], "key": 1, "exp": "Answer: Satellitism. Book trigger: \"Satellatism: Growth of H. influenzae on blood agar around colonies of a\".", "src": "PDF 98 (printed 91)"}, {"n": 8, "img": null, "kind": "except", "stem": "Important Vibrio pathogens listed in the book include all of the following EXCEPT:", "opts": ["Vibrio vulnificus causing severe wound infection", "Vibrio parahaemolyticus causing seafood gastroenteritis", "Vibrio fetus causing septic abortion", "Vibrio cholerae causing cholera"], "key": 2, "exp": "Answer: Vibrio fetus causing septic abortion. Book trigger: \"Vibrio parahaemolyticus – seafood-associated gastroenteritis\".", "src": "PDF 83 (printed 76)"}, {"n": 9, "img": null, "kind": "except", "stem": "Regarding Legionella, all of the following are true EXCEPT:", "opts": ["It is grown on BCYE agar", "It replicates inside alveolar macrophages", "It is transmitted from person to person", "It is found in water sources"], "key": 2, "exp": "Answer: It is transmitted from person to person. Book trigger: \"there is no person-to-person transmission\".", "src": "PDF 107 (printed 100)"}, {"n": 10, "img": null, "kind": "clinical case", "stem": "A patient with cholera has several litres of fluid loss within hours. What is the main treatment?", "opts": ["Fluid and electrolyte replacement, orally or intravenously", "Antitoxin", "Penicillin G alone", "Streptomycin alone"], "key": 0, "exp": "Answer: Fluid and electrolyte replacement, orally or intravenously. Book trigger: \"Treatment of cholera consists essentially of replacing fluid\".", "src": "PDF 88 (printed 81)"}, {"n": 11, "img": null, "kind": "association", "stem": "Which flagellar arrangement characterizes Vibrio species?", "opts": ["Multiple sheathed monopolar flagellae", "No flagella with gliding motility", "Peritrichous flagella with swarming", "A single polar flagellum with darting motility"], "key": 3, "exp": "Answer: A single polar flagellum with darting motility. Book trigger: \"with a single polar flagellum producing darting motility\".", "src": "PDF 83 (printed 76)"}, {"n": 12, "img": null, "kind": "clinical case", "stem": "A boy with whooping cough is a school contact. Which vaccine is currently recommended with a booster after 10 years?", "opts": ["Hib vaccine", "Acellular vaccine combined as DTaP", "BCG", "Cholera B subunit vaccine"], "key": 1, "exp": "Answer: Acellular vaccine combined as DTaP. Book trigger: \"a booster is recommended after the age of 10 years\".", "src": "PDF 104 (printed 97)"}, {"n": 13, "img": null, "kind": "association", "stem": "The chronic carrier state in cholera is observed only with which biotype?", "opts": ["O139 only", "Non-O1 strains", "Classical", "El Tor"], "key": 3, "exp": "Answer: El Tor. Book trigger: \"Chronic carrier state observed only with El Tor\".", "src": "PDF 87 (printed 80)"}, {"n": 14, "img": null, "kind": "sequence", "stem": "Which sequence describes the stages of biopsy diagnosis of H. pylori?", "opts": ["Histology first, then endoscopy, then PCR only", "Culture first, then biopsy, then histology, then urease test", "Gastric biopsy by endoscopy, then histology, biopsy urease test or molecular tests, then culture", "Biopsy urease test first, then endoscopy, then culture"], "key": 2, "exp": "Answer: Gastric biopsy by endoscopy, then histology, biopsy urease test or molecular tests, then culture. Book trigger: \"Specimens: Gastric biopsies obtained by endoscopy\".", "src": "PDF 92 (printed 85)"}, {"n": 15, "img": null, "kind": "clinical case", "stem": "A stool culture shows yellow colonies on TCBS. Which sugar did the organism ferment?", "opts": ["Sucrose", "Lactose", "Mannite only", "Maltose only"], "key": 0, "exp": "Answer: Sucrose. Book trigger: \"V. cholerae produces yellow colonies on TCBS due to sucrose\".", "src": "PDF 84 (printed 77)"}, {"n": 16, "img": null, "kind": "clinical case", "stem": "Which is the correct answer for a patient with convalescent cholera shedding bacteria for 4-5 weeks?", "opts": ["Chronic carrier of classical biotype", "Convalescent carrier with the organism in the gall bladder", "Healthy contact", "Urinary carrier"], "key": 1, "exp": "Answer: Convalescent carrier with the organism in the gall bladder. Book trigger: \"convalescent carrier can harbor the organism in the gall bladder\".", "src": "PDF 87 (printed 80)"}, {"n": 17, "img": null, "kind": "double-clue", "stem": "Which organism has a polar flagellum, string-positive reaction and yellow colonies on TCBS?", "opts": ["Campylobacter jejuni", "Vibrio cholerae", "Pseudomonas aeruginosa", "Aeromonas species"], "key": 1, "exp": "Answer: Vibrio cholerae. Book trigger: \"String test positive\".", "src": "PDF 83 (printed 76)"}, {"n": 18, "img": null, "kind": "association", "stem": "Which environment favours the persistence of P. aeruginosa in hospitals?", "opts": ["Water with traces of nutrients, and resistance to disinfectants", "Dry surfaces and UV light", "High-salt media", "Cold storage at 4°C only"], "key": 0, "exp": "Answer: Water with traces of nutrients, and resistance to disinfectants. Book trigger: \"These factors favour its persistence in the hospital environment\".", "src": "PDF 94 (printed 87)"}, {"n": 19, "img": null, "kind": "definition", "stem": "Atmosphere of S-shaped, thermophilic Campylobacter growth at 42°C is described as:", "opts": ["Capnophilic only", "Obligately aerobic", "Microaerophilic", "Anaerobic"], "key": 2, "exp": "Answer: Microaerophilic. Book trigger: \"(thermophilic)\".", "src": "PDF 89 (printed 82)"}, {"n": 20, "img": null, "kind": "clinical case", "stem": "A 4-year-old has watery then bloody diarrhea and fever after eating poultry. A stool wet mount shows curved organisms with darting motility. Which antibiotic is of choice?", "opts": ["Rifampin", "Streptomycin", "Tetracycline", "Erythromycin"], "key": 3, "exp": "Answer: Erythromycin. Book trigger: \"Erythromycin is the antibiotic of choice\".", "src": "PDF 90 (printed 83)"}, {"n": 21, "img": null, "kind": "association", "stem": "Which V. cholerae serogroups cause epidemic cholera?", "opts": ["O1 and O139", "Only H-antigen types", "All non-O1/O139 serogroups", "O2 and O3"], "key": 0, "exp": "Answer: O1 and O139. Book trigger: \"serogroups O1 and O139 are the causative agents of epidemic cholera\".", "src": "PDF 85 (printed 78)"}, {"n": 22, "img": null, "kind": "except", "stem": "The diagnostic methods for H. pylori include all of the following EXCEPT:", "opts": ["Biopsy urease test", "Widal tube agglutination test", "Urea breath test", "Stool antigen detection by ELISA"], "key": 1, "exp": "Answer: Widal tube agglutination test. Book trigger: \"Urea breath test\".", "src": "PDF 92 (printed 85)"}, {"n": 23, "img": null, "kind": "clinical case", "stem": "A 3-year-old has epiglottitis after URTI. Which organism is the most likely cause per the book's list?", "opts": ["Pseudomonas aeruginosa", "Bordetella pertussis", "Haemophilus influenzae", "Brucella abortus"], "key": 2, "exp": "Answer: Haemophilus influenzae. Book trigger: \"Infections (mainly by non-capsulated strains) such as otitis media\".", "src": "PDF 98 (printed 91)"}, {"n": 24, "img": null, "kind": "association", "stem": "Which vaccine protects for about 2 years in Table 1.8?", "opts": ["Live-attenuated vaccine", "None of them", "Killed cholera vaccine", "Whole cell/B subunit vaccine"], "key": 3, "exp": "Answer: Whole cell/B subunit vaccine. Book trigger: \"Whole cell/B subunit\".", "src": "PDF 88 (printed 81)"}, {"n": 25, "img": null, "kind": "association", "stem": "Which commonly encountered effect causes false-negative STAT results in brucellosis, so serum dilutions up to 1:5120 are used?", "opts": ["The prozone effect", "The satellite effect", "The reagin effect", "The anergy effect"], "key": 0, "exp": "Answer: The prozone effect. Book trigger: \"The prozone effect\".", "src": "PDF 106 (printed 99)"}, {"n": 26, "img": null, "kind": "except", "stem": "Regarding Haemophilus influenzae, all of the following are true EXCEPT:", "opts": ["Its growth is enhanced by 5% CO2", "It is a pleomorphic Gram-negative bacillus", "Some strains have a polysaccharide capsule", "It needs only X factor (haemin) for growth"], "key": 3, "exp": "Answer: It needs only X factor (haemin) for growth. Book trigger: \"H. influenzae requires both X and V factors for growth\".", "src": "PDF 97 (printed 90)"}, {"n": 27, "img": null, "kind": "definition", "stem": "The Greek-derived term used for an acute mucopurulent conjunctivitis caused by H. aegyptius is:", "opts": ["Trachoma", "Chancroid", "Pink eye", "Pontiac fever"], "key": 2, "exp": "Answer: Pink eye. Book trigger: \"which is known as pink eye\".", "src": "PDF 100 (printed 93)"}, {"n": 28, "img": null, "kind": "except", "stem": "Regarding cholera toxin, all of the following are true EXCEPT:", "opts": ["It is composed of 5 B subunits and an A subunit", "The B subunit is enzymatically active and raises cAMP", "The A subunit activates adenylate cyclase", "The B subunits bind receptors on intestinal epithelial cells"], "key": 1, "exp": "Answer: The B subunit is enzymatically active and raises cAMP. Book trigger: \"The enzymatically active (A) subunit enters the cells\".", "src": "PDF 86 (printed 79)"}, {"n": 29, "img": null, "kind": "double-clue", "stem": "Which organism is grown on Skirrow's medium in a microaerophilic atmosphere at 42°C for 2 days?", "opts": ["Helicobacter pylori", "Campylobacter jejuni", "Vibrio cholerae", "Pseudomonas aeruginosa"], "key": 1, "exp": "Answer: Campylobacter jejuni. Book trigger: \"Cultures are incubated in microaerophilic atmosphere at 42°C\".", "src": "PDF 89 (printed 82)"}, {"n": 30, "img": null, "kind": "except", "stem": "H. influenzae infections by non-capsulated strains include all of the following EXCEPT:", "opts": ["Meningitis", "Otitis media", "Epiglottitis", "Sinusitis"], "key": 0, "exp": "Answer: Meningitis. Book trigger: \"Infections (mainly by non-capsulated strains) such as otitis media\".", "src": "PDF 98 (printed 91)"}, {"n": 31, "img": null, "kind": "association", "stem": "Which brucellosis titer is considered significant in STAT?", "opts": ["A single titer of 20", "A titer of 1:5120 only", "Any titer", "A single titer of 160 or a fourfold rise"], "key": 3, "exp": "Answer: A single titer of 160 or a fourfold rise. Book trigger: \"A single titer of 160 or a fourfold rise titer or greater is considered\".", "src": "PDF 106 (printed 99)"}, {"n": 32, "img": null, "kind": "association", "stem": "In which pertussis stage is the patient highly contagious with the organism isolated in large numbers?", "opts": ["Convalescent stage", "Incubation period only", "Catarrhal stage", "Paroxysmal stage"], "key": 2, "exp": "Answer: Catarrhal stage. Book trigger: \"Isolated in large Numbers\".", "src": "PDF 103 (printed 96)"}, {"n": 33, "img": null, "kind": "double-clue", "stem": "Which agent is faintly stained, motile, grown on BCYE agar and transmitted from water aerosol?", "opts": ["Bordetella", "Brucella", "Legionella pneumophila", "Coxiella"], "key": 2, "exp": "Answer: Legionella pneumophila. Book trigger: \"it can be grown on buffered charcoal yeast extract (bcye) agar\".", "src": "PDF 107 (printed 100)"}, {"n": 34, "img": null, "kind": "association", "stem": "P. aeruginosa respiratory infections occur especially in which patients?", "opts": ["Veterinarians", "Immunized children", "Poultry handlers", "Intubated patients and those with cystic fibrosis"], "key": 3, "exp": "Answer: Intubated patients and those with cystic fibrosis. Book trigger: \"especially in intubated patients or in those with cystic fibrosis\".", "src": "PDF 95 (printed 88)"}, {"n": 35, "img": null, "kind": "clinical case", "stem": "A patient with epigastric discomfort ingests radiolabeled urea and exhales labelled CO2. What does this show?", "opts": ["Brucella antibodies are present", "H. pylori urease is present", "V. cholerae toxin is present", "P. aeruginosa exotoxin is present"], "key": 1, "exp": "Answer: H. pylori urease is present. Book trigger: \"If the organism is present, urease will cleave the ingested urea\".", "src": "PDF 92 (printed 85)"}, {"n": 36, "img": null, "kind": "clinical case", "stem": "An unvaccinated 8-month-old has meningitis with Gram-negative coccobacilli in CSF. Which antigen is detected by latex agglutination?", "opts": ["Type b capsular antigen", "K1 antigen", "Vi antigen", "O157 antigen"], "key": 0, "exp": "Answer: Type b capsular antigen. Book trigger: \"Detection of type b capsular antigen in CSF by latex agglutination\".", "src": "PDF 99 (printed 92)"}, {"n": 37, "img": null, "kind": "definition", "stem": "The H. influenzae serotypes are divided by capsule into types:", "opts": ["A to M", "1 to 139", "a to f", "O1 to O139"], "key": 2, "exp": "Answer: a to f. Book trigger: \"divided into six serotypes a-f\".", "src": "PDF 98 (printed 91)"}, {"n": 38, "img": null, "kind": "double-clue", "stem": "Which organism is urease, oxidase and catalase positive and has multiple sheathed monopolar flagellae?", "opts": ["Campylobacter jejuni", "Helicobacter pylori", "Vibrio cholerae", "Pseudomonas aeruginosa"], "key": 1, "exp": "Answer: Helicobacter pylori. Book trigger: \"multiple sheathed monopolar flagellae\".", "src": "PDF 91 (printed 84)"}, {"n": 39, "img": null, "kind": "definition", "stem": "NAD is also called:", "opts": ["Factor X", "Factor K", "Factor A", "Factor V"], "key": 3, "exp": "Answer: Factor V. Book trigger: \"V factor (NAD)\".", "src": "PDF 97 (printed 90)"}, {"n": 40, "img": null, "kind": "clinical case", "stem": "After handling kittens and puppies a child has bloody diarrhea and fever. Which organism fits?", "opts": ["Campylobacter jejuni", "Helicobacter pylori", "Shigella sonnei", "Vibrio cholerae"], "key": 0, "exp": "Answer: Campylobacter jejuni. Book trigger: \"Exposure to sick kittens and puppies has also been associated\".", "src": "PDF 90 (printed 83)"}, {"n": 41, "img": null, "kind": "association", "stem": "What does the H. influenzae IgA protease help with?", "opts": ["Colonization of the upper respiratory tract mucosa", "Capsule synthesis", "Hemolysis of RBCs", "Spread to the meninges"], "key": 0, "exp": "Answer: Colonization of the upper respiratory tract mucosa. Book trigger: \"IgA protease helps colonization of the upper respiratory tract mucosa\".", "src": "PDF 98 (printed 91)"}, {"n": 42, "img": null, "kind": "clinical case", "stem": "An infant has repetitive cough with whoops ending in vomiting. Which stage is this?", "opts": ["Convalescent stage", "Catarrhal stage", "Incubation period", "Paroxysmal stage"], "key": 3, "exp": "Answer: Paroxysmal stage. Book trigger: \"Repetitive cough with whoops\".", "src": "PDF 102 (printed 95)"}, {"n": 43, "img": null, "kind": "clinical case", "stem": "A patient develops watery diarrhea after eating raw seafood. Which Vibrio is listed for seafood-associated gastroenteritis?", "opts": ["Vibrio cholerae", "Vibrio parahaemolyticus", "Vibrio fetus", "Campylobacter jejuni"], "key": 1, "exp": "Answer: Vibrio parahaemolyticus. Book trigger: \"Vibrio parahaemolyticus – seafood-associated gastroenteritis\".", "src": "PDF 83 (printed 76)"}, {"n": 44, "img": null, "kind": "double-clue", "stem": "Which organism shows satellitism around S. aureus colonies on blood agar?", "opts": ["Pseudomonas aeruginosa", "Bordetella pertussis", "Haemophilus influenzae", "Acinetobacter species"], "key": 2, "exp": "Answer: Haemophilus influenzae. Book trigger: \"Satellatism: Growth of H. influenzae on blood agar around colonies of a\".", "src": "PDF 98 (printed 91)"}, {"n": 45, "img": null, "kind": "clinical case", "stem": "During a cholera epidemic, how is a secondary case confirmed in the laboratory?", "opts": ["Urea breath test", "Wet mount of liquid stool showing motility stopped by specific antibody", "Widal tube agglutination test", "Dark-ground microscopy of urine"], "key": 1, "exp": "Answer: Wet mount of liquid stool showing motility stopped by specific antibody. Book trigger: \"motility which is stopped by specific antibody\".", "src": "PDF 88 (printed 81)"}, {"n": 46, "img": null, "kind": "double-clue", "stem": "Which organism is the causative agent of peptic ulcer and a type I carcinogen?", "opts": ["Pseudomonas aeruginosa", "Campylobacter jejuni", "Helicobacter pylori", "Vibrio cholerae"], "key": 2, "exp": "Answer: Helicobacter pylori. Book trigger: \"H. pylori is the most important Helicobacter species since it is the causative agent\".", "src": "PDF 91 (printed 84)"}, {"n": 47, "img": null, "kind": "association", "stem": "What does the string test differentiate?", "opts": ["Salmonella from Shigella", "Pseudomonas from Acinetobacter", "Vibrios from Campylobacter", "Vibrios (string-positive) from Aeromonas (string-negative)"], "key": 3, "exp": "Answer: Vibrios (string-positive) from Aeromonas (string-negative). Book trigger: \"The string test differentiates vibrios (string-positive) from Aeromonas\".", "src": "PDF 83 (printed 76)"}, {"n": 48, "img": null, "kind": "sequence", "stem": "Which sequence describes serum interpretation in brucellosis?", "opts": ["Wide dilution range to avoid prozone, STAT titer read, then confirm with ELISA", "Single narrow dilution, STAT titer read, prozone ignored", "Culture for 6-7 weeks first, then STAT, then ELISA", "ELISA first, then narrow dilutions, then read STAT"], "key": 0, "exp": "Answer: Wide dilution range to avoid prozone, STAT titer read, then confirm with ELISA. Book trigger: \"wide range of serum dilutions (up to 1:5120) should be done\".", "src": "PDF 106 (printed 99)"}, {"n": 49, "img": null, "kind": "clinical case", "stem": "A swimmer has external ear infection with greenish pus. Which organism fits?", "opts": ["Haemophilus ducreyi", "Brucella melitensis", "Campylobacter jejuni", "Pseudomonas aeruginosa"], "key": 3, "exp": "Answer: Pseudomonas aeruginosa. Book trigger: \"External ear infections: in swimmers (swimmer's ear)\".", "src": "PDF 95 (printed 88)"}, {"n": 50, "img": null, "kind": "definition", "stem": "The two distinguishing antigens of Brucella species, associated with its LPS, are:", "opts": ["O and H", "A and M", "K and Vi", "F1 and V"], "key": 1, "exp": "Answer: A and M. Book trigger: \"two distinguishing antigens (A and M)\".", "src": "PDF 104 (printed 97)"}, {"n": 51, "img": null, "kind": "association", "stem": "Why are flagellar (H) antigens useless for distinguishing V. cholerae strains?", "opts": ["They are shared with all vibrios", "They are plasmid-coded", "They are absent from El Tor", "They are only on classical strains"], "key": 0, "exp": "Answer: They are shared with all vibrios. Book trigger: \"The flagellar (H) antigens are shared with all vibrios\".", "src": "PDF 85 (printed 78)"}, {"n": 52, "img": null, "kind": "definition", "stem": "Haemin is also called:", "opts": ["Factor NAD", "Factor M", "Factor X", "Factor V"], "key": 2, "exp": "Answer: Factor X. Book trigger: \"X factor (haemin)\".", "src": "PDF 97 (printed 90)"}, {"n": 53, "img": null, "kind": "except", "stem": "Acinetobacter resembles P. aeruginosa in all of the following EXCEPT:", "opts": ["Being non-fermentative", "Being aerobic", "Being motile and oxidase positive", "Being a Gram-negative bacillus"], "key": 2, "exp": "Answer: Being motile and oxidase positive. Book trigger: \"Acinetobacter species are like P. aeruginosa in being non-fermentative\".", "src": "PDF 96 (printed 89)"}, {"n": 54, "img": null, "kind": "except", "stem": "The differences between classical and El Tor biotypes include all of the following EXCEPT:", "opts": ["Classical is susceptible to polymixin B", "Classical is sensitive to phage IV", "El Tor shows haemagglutination of chicken RBC", "Classical shows haemolysis of sheep RBC"], "key": 3, "exp": "Answer: Classical shows haemolysis of sheep RBC. Book trigger: \"Haemolysis of sheep RBC\".", "src": "PDF 85 (printed 78)"}, {"n": 55, "img": null, "kind": "except", "stem": "Regarding Campylobacter enteritis, all of the following are true EXCEPT:", "opts": ["It affects mainly elderly people", "Most infections are self-limited", "It affects mainly children under 5 years and young adults", "Incubation period is 2-5 days"], "key": 0, "exp": "Answer: It affects mainly elderly people. Book trigger: \"Campylobacter jejuni causes enteritis that affects mainly children under 5\".", "src": "PDF 89 (printed 82)"}, {"n": 56, "img": null, "kind": "except", "stem": "Regarding Pseudomonas aeruginosa, all of the following are true EXCEPT:", "opts": ["It resists disinfectants and persists in hospitals", "It ferments carbohydrates and is oxidase negative", "It is an aerobic motile Gram-negative bacillus", "It produces a diffusible green exopigment on nutrient agar"], "key": 1, "exp": "Answer: It ferments carbohydrates and is oxidase negative. Book trigger: \"It is carbohydrate non-fermenter\".", "src": "PDF 94 (printed 87)"}, {"n": 57, "img": null, "kind": "sequence", "stem": "Which order is correct for the laboratory diagnosis of a first cholera case?", "opts": ["TCBS first, then alkaline peptone water, yellow colonies, Widal test", "Stool in alkaline peptone water, subculture on TCBS, yellow colonies, slide agglutination with anti-O1/O139", "Skirrow's medium first, then TCBS, grey colonies, Elek test", "Alkaline peptone water first, then chocolate agar, yellow colonies, string test only"], "key": 1, "exp": "Answer: Stool in alkaline peptone water, subculture on TCBS, yellow colonies, slide agglutination with anti-O1/O139. Book trigger: \"Subcultures, from the surface pellicle, are done on TCBS\".", "src": "PDF 87 (printed 80)"}, {"n": 58, "img": null, "kind": "double-clue", "stem": "Which organism needs X factor (haemin) and V factor (NAD) for growth?", "opts": ["Pseudomonas aeruginosa", "Brucella abortus", "Bordetella pertussis", "Haemophilus influenzae"], "key": 3, "exp": "Answer: Haemophilus influenzae. Book trigger: \"H. influenzae requires both X and V factors for growth\".", "src": "PDF 97 (printed 90)"}, {"n": 59, "img": null, "kind": "association", "stem": "What is detected in the urea breath test?", "opts": ["Urease in stool", "Radiolabeled ammonia in urine", "Radiolabeled CO2 in the breath", "IgG in serum"], "key": 2, "exp": "Answer: Radiolabeled CO2 in the breath. Book trigger: \"releasing radiolabeled CO2 which can be detected in the breath\".", "src": "PDF 92 (printed 85)"}, {"n": 60, "img": null, "kind": "double-clue", "stem": "Which organism is a non-fermenter, oxidase positive, with a grape-like odour and bright green exopigment?", "opts": ["Pseudomonas aeruginosa", "Haemophilus influenzae", "Acinetobacter species", "Brucella abortus"], "key": 0, "exp": "Answer: Pseudomonas aeruginosa. Book trigger: \"grape-like (fruity) odour\".", "src": "PDF 94 (printed 87)"}, {"n": 61, "img": null, "kind": "except", "stem": "The virulence factors of P. aeruginosa include all of the following EXCEPT:", "opts": ["Biofilm", "Tetanospasmin", "Pili", "Exotoxin A"], "key": 1, "exp": "Answer: Tetanospasmin. Book trigger: \"Biofilm: allows the organism to live away from antibodies\".", "src": "PDF 95 (printed 88)"}, {"n": 62, "img": null, "kind": "association", "stem": "For how long is H. pylori incubated on selective medium?", "opts": ["6-8 h at 37°C", "24 h at 42°C", "3-6 days at 37°C", "2 days at 42°C"], "key": 2, "exp": "Answer: 3-6 days at 37°C. Book trigger: \"incubation at 37°C for 3-6 days\".", "src": "PDF 91 (printed 84)"}, {"n": 63, "img": null, "kind": "except", "stem": "The clinical outcomes of H. pylori infection include all of the following EXCEPT:", "opts": ["Duodenal or gastric ulcer", "Chronic gastritis", "Gastric carcinoma or lymphoma", "Pseudomembranous colitis"], "key": 3, "exp": "Answer: Pseudomembranous colitis. Book trigger: \"Chronic gastritis: It develops in colonized people\".", "src": "PDF 92 (printed 85)"}, {"n": 64, "img": null, "kind": "association", "stem": "Which group do vibrios fall into regarding oxygen and pH?", "opts": ["Facultative anaerobes that tolerate alkaline conditions and are destroyed by low pH", "Obligate aerobes killed by alkaline pH", "Strict anaerobes that tolerate acid", "Microaerophiles that need 42°C"], "key": 0, "exp": "Answer: Facultative anaerobes that tolerate alkaline conditions and are destroyed by low pH. Book trigger: \"Tolerant to alkaline conditions and destroyed by low pH\".", "src": "PDF 83 (printed 76)"}, {"n": 65, "img": null, "kind": "association", "stem": "Why is the blood culture technique for Brucella rarely done?", "opts": ["High laboratory infection risk, long incubation (6-7 weeks) and special growth requirements", "It is non-viable in blood", "It grows only on TCBS", "It needs 42°C"], "key": 0, "exp": "Answer: High laboratory infection risk, long incubation (6-7 weeks) and special growth requirements. Book trigger: \"The culture requires a long incubation (6-7 weeks)\".", "src": "PDF 106 (printed 99)"}, {"n": 66, "img": null, "kind": "sequence", "stem": "Which sequence describes cholera pathogenesis?", "opts": ["Water secretion, cAMP rises, adherence by fimbriae, multiplication, A subunit activates adenylate cyclase", "Toxin B subunits bind receptors, adherence by fimbriae, cAMP rises, A subunit activates adenylate cyclase, multiplication", "Multiplication, A subunit activates adenylate cyclase, adherence by fimbriae, B subunits bind receptors, cAMP rises", "Adherence by fimbriae, multiplication, toxin B subunits bind receptors, A subunit activates adenylate cyclase, cAMP rises, water secretion"], "key": 3, "exp": "Answer: Adherence by fimbriae, multiplication, toxin B subunits bind receptors, A subunit activates adenylate cyclase, cAMP rises, water secretion. Book trigger: \"adhere to its mucosa by fimbriae\".", "src": "PDF 86 (printed 79)"}, {"n": 67, "img": null, "kind": "except", "stem": "Regarding cholera, all of the following are true EXCEPT:", "opts": ["Convalescent carriers may shed for 4 to 5 weeks", "The chronic carrier state occurs with the classical biotype only", "Incubation period is 1-4 days", "Death may occur from hypovolaemic shock"], "key": 1, "exp": "Answer: The chronic carrier state occurs with the classical biotype only. Book trigger: \"Chronic carrier state observed only with El Tor\".", "src": "PDF 87 (printed 80)"}, {"n": 68, "img": null, "kind": "association", "stem": "How does the WHO classify H. pylori?", "opts": ["Non-carcinogen", "Type II carcinogen", "Type I carcinogen", "Possible teratogen"], "key": 2, "exp": "Answer: Type I carcinogen. Book trigger: \"H. pylori is now classed by the WHO as type I carcinogen\".", "src": "PDF 92 (printed 85)"}, {"n": 69, "img": null, "kind": "sequence", "stem": "Which order describes P. aeruginosa investigation from a wound?", "opts": ["Collect urine, Gram smear, serology, identify by Widal", "Collect pus, Gram smear showing bacilli among pus cells, culture, identify by pigment and biochemistry", "Collect CSF, latex agglutination, culture on charcoal agar", "Culture first, then Gram smear, then serology only"], "key": 1, "exp": "Answer: Collect pus, Gram smear showing bacilli among pus cells, culture, identify by pigment and biochemistry. Book trigger: \"Direct smear: Gram negative bacilli among pus cells\".", "src": "PDF 95 (printed 88)"}, {"n": 70, "img": null, "kind": "except", "stem": "The virulence factors of H. influenzae include all of the following EXCEPT:", "opts": ["Serotype b capsule", "IgA protease", "Polysaccharide capsule", "Exotoxin A"], "key": 3, "exp": "Answer: Exotoxin A. Book trigger: \"IgA protease helps colonization of the upper respiratory tract mucosa\".", "src": "PDF 98 (printed 91)"}, {"n": 71, "img": null, "kind": "clinical case", "stem": "An ICU patient has an outbreak pneumonia with a non-motile, oxidase-negative non-fermenter. Which organism is it?", "opts": ["Haemophilus influenzae", "Pseudomonas aeruginosa", "Acinetobacter species", "Legionella pneumophila"], "key": 2, "exp": "Answer: Acinetobacter species. Book trigger: \"opportunistic pathogens causing hospital-acquired infections, particularly in ICUs\".", "src": "PDF 96 (printed 89)"}, {"n": 72, "img": null, "kind": "except", "stem": "Regarding pertussis laboratory diagnosis, all of the following are true EXCEPT:", "opts": ["Serology is highly sensitive in the first week", "Culture is on charcoal blood agar", "PCR can detect the organism", "Specimens are per-nasal swabs or cough plates"], "key": 0, "exp": "Answer: Serology is highly sensitive in the first week. Book trigger: \"Serology: It is of little help as antibodies are undetectable until the third\".", "src": "PDF 103 (printed 96)"}, {"n": 73, "img": null, "kind": "clinical case", "stem": "A man has abrupt vomiting and massive rice-water stools with hypovolaemic shock. Which toxin mechanism explains the diarrhea?", "opts": ["Activation of adenylate cyclase with a rise in cAMP", "Blockade of glycine release", "Blockade of acetylcholine release", "Inhibition of protein synthesis"], "key": 0, "exp": "Answer: Activation of adenylate cyclase with a rise in cAMP. Book trigger: \"causing a rise in cAMP production\".", "src": "PDF 86 (printed 79)"}, {"n": 74, "img": null, "kind": "except", "stem": "Regarding Vibrio species, all of the following are true EXCEPT:", "opts": ["They are facultative anaerobes tolerant to alkaline conditions", "They are curved Gram-negative bacilli with darting motility", "They are oxidase-negative members of Enterobacteriaceae", "They ferment sugars without gas production"], "key": 2, "exp": "Answer: They are oxidase-negative members of Enterobacteriaceae. Book trigger: \"Oxidase-positive (therefore, not classified as Enterobacteriaceae)\".", "src": "PDF 83 (printed 76)"}, {"n": 75, "img": null, "kind": "except", "stem": "Regarding Campylobacter jejuni, all of the following are true EXCEPT:", "opts": ["It is oxidase positive", "It is strictly aerobic and is grown at 37°C for 1 day", "It has a single polar flagellum with darting motility", "It is a curved or S-shaped slender Gram-negative rod"], "key": 1, "exp": "Answer: It is strictly aerobic and is grown at 37°C for 1 day. Book trigger: \"Most Campylobacters are microaerophilic\".", "src": "PDF 89 (printed 82)"}, {"n": 76, "img": null, "kind": "double-clue", "stem": "Which organism is S-shaped, oxidase positive, grown at 42°C in microaerophilic atmosphere?", "opts": ["Vibrio cholerae", "Helicobacter pylori", "Haemophilus influenzae", "Campylobacter jejuni"], "key": 3, "exp": "Answer: Campylobacter jejuni. Book trigger: \"They are curved or S-shaped, slender, Gram-negative rods\".", "src": "PDF 89 (printed 82)"}, {"n": 77, "img": null, "kind": "association", "stem": "Which feature is positive in the El Tor biotype but negative in the classical biotype?", "opts": ["Susceptibility to polymixin B", "Positive oxidase test", "Haemolysis of sheep RBC", "Sensitivity to phage IV"], "key": 2, "exp": "Answer: Haemolysis of sheep RBC. Book trigger: \"Haemolysis of sheep RBC\".", "src": "PDF 85 (printed 78)"}, {"n": 78, "img": null, "kind": "clinical case", "stem": "A laboratory tests a colony in 0.5% sodium desoxycholate and sees DNA strings. Which genus is it?", "opts": ["Pseudomonas", "Vibrio, not Aeromonas", "Campylobacter", "Aeromonas"], "key": 1, "exp": "Answer: Vibrio, not Aeromonas. Book trigger: \"Within 60 seconds, the cells lyse, and DNA\".", "src": "PDF 83 (printed 76)"}, {"n": 79, "img": null, "kind": "association", "stem": "Which selective medium is blood agar made selective by antibiotics for Campylobacter?", "opts": ["TCBS agar", "Chocolate agar", "Charcoal blood agar", "Skirrow's medium"], "key": 3, "exp": "Answer: Skirrow's medium. Book trigger: \"Skirrow‘s medium which is blood agar that is rendered selective by addition of antibiotics\".", "src": "PDF 89 (printed 82)"}, {"n": 80, "img": null, "kind": "association", "stem": "Which host does B. abortus infect, causing abortion?", "opts": ["Cattle", "Pigs", "Sheep and goats", "Rodents"], "key": 0, "exp": "Answer: Cattle. Book trigger: \"B. abortus infects cattle causing abortion\".", "src": "PDF 104 (printed 97)"}, {"n": 81, "img": null, "kind": "clinical case", "stem": "A man with chronic gastritis and duodenal ulcer is H. pylori positive. Which regimen does the book give?", "opts": ["Doxycycline plus rifampin", "Amoxicillin plus clarithromycin plus a proton-pump inhibitor", "Erythromycin alone for 7 days", "Ciprofloxacin plus metronidazole alone"], "key": 1, "exp": "Answer: Amoxicillin plus clarithromycin plus a proton-pump inhibitor. Book trigger: \"amoxicillin plus clarithromycin plus a proton-\".", "src": "PDF 93 (printed 86)"}, {"n": 82, "img": null, "kind": "clinical case", "stem": "A cholera isolate is sensitive to phage IV and negative for VP reaction. Which biotype?", "opts": ["Non-O1", "O139", "El Tor", "Classical"], "key": 3, "exp": "Answer: Classical. Book trigger: \"sensitivity to phage iv sensitive resistant\".", "src": "PDF 85 (printed 78)"}, {"n": 83, "img": null, "kind": "association", "stem": "At which pH is alkaline peptone water used to grow V. cholerae?", "opts": ["pH 8.5", "pH 7.0", "pH 6.0", "pH 5.5"], "key": 0, "exp": "Answer: pH 8.5. Book trigger: \"Alkaline peptone water (pH 8.5)\".", "src": "PDF 84 (printed 77)"}, {"n": 84, "img": null, "kind": "except", "stem": "Brucellosis can be transmitted by all of the following EXCEPT:", "opts": ["Inhalation of infected aerosol", "Direct contact through skin abrasions", "Person-to-person droplets", "Unpasteurized milk"], "key": 2, "exp": "Answer: Person-to-person droplets. Book trigger: \"Inhalation of infected aerosol during handling of infected animals\".", "src": "PDF 105 (printed 98)"}, {"n": 85, "img": null, "kind": "double-clue", "stem": "Which organism causes chronic carriage only in the El Tor biotype and has rice-water stools?", "opts": ["Campylobacter jejuni", "Vibrio cholerae", "Shigella dysenteriae", "Salmonella Typhi"], "key": 1, "exp": "Answer: Vibrio cholerae. Book trigger: \"Chronic carrier state observed only with El Tor\".", "src": "PDF 87 (printed 80)"}, {"n": 86, "img": null, "kind": "clinical case", "stem": "A stool sample from a cholera case is put in alkaline peptone water. What is expected after 6-8 h?", "opts": ["A surface pellicle", "Yellow colonies", "Black colonies", "Fried-egg colonies"], "key": 0, "exp": "Answer: A surface pellicle. Book trigger: \"a surface pellicle is formed after an incubation of 6-8 h at 37\".", "src": "PDF 87 (printed 80)"}, {"n": 87, "img": null, "kind": "association", "stem": "Pseudomonas exotoxin A causes tissue necrosis by the same mechanism as:", "opts": ["Shiga toxin", "Tetanospasmin", "Cholera toxin", "Diphtheria exotoxin"], "key": 3, "exp": "Answer: Diphtheria exotoxin. Book trigger: \"same mechanism as diphtheria exotoxin\".", "src": "PDF 95 (printed 88)"}, {"n": 88, "img": null, "kind": "clinical case", "stem": "A shepherd has fever, sweating and an enlarged spleen; the lab warns of inhalation risk with cultures. Which organism?", "opts": ["Bordetella pertussis", "Legionella pneumophila", "Brucella melitensis", "Haemophilus ducreyi"], "key": 2, "exp": "Answer: Brucella melitensis. Book trigger: \"there is a high risk for laboratory personnel to acquire infection by inhalation\".", "src": "PDF 106 (printed 99)"}, {"n": 89, "img": null, "kind": "association", "stem": "Which enzyme helps H. pylori reach the stomach lining where the pH is neutral?", "opts": ["Lecithinase", "Coagulase", "Catalase", "Mucinase"], "key": 3, "exp": "Answer: Mucinase. Book trigger: \"Mucinase helps in penetration of mucous layer\".", "src": "PDF 91 (printed 84)"}, {"n": 90, "img": null, "kind": "association", "stem": "Which antibiotic is used topically for H. aegyptius conjunctivitis?", "opts": ["Tetracycline or chloramphenicol", "Streptomycin", "Vancomycin", "Rifampin"], "key": 0, "exp": "Answer: Tetracycline or chloramphenicol. Book trigger: \"Topical tetracycline and chloramphenicol are effective for treatment\".", "src": "PDF 100 (printed 93)"}, {"n": 91, "img": null, "kind": "double-clue", "stem": "Which organism is non-fermentative and oxidase positive, found in tap water and resistant to disinfectants?", "opts": ["Acinetobacter species", "Campylobacter jejuni", "Pseudomonas aeruginosa", "Vibrio cholerae"], "key": 2, "exp": "Answer: Pseudomonas aeruginosa. Book trigger: \"It can grow in water containing only traces of nutrients, e.g. tap water\".", "src": "PDF 94 (printed 87)"}, {"n": 92, "img": null, "kind": "sequence", "stem": "What is the order of the stages of classical pertussis?", "opts": ["Convalescent, catarrhal, paroxysmal", "Catarrhal, paroxysmal, convalescent", "Paroxysmal, catarrhal, convalescent", "Catarrhal, convalescent, paroxysmal"], "key": 1, "exp": "Answer: Catarrhal, paroxysmal, convalescent. Book trigger: \"catarrhal, paroxysmal and convalescent stages\".", "src": "PDF 102 (printed 95)"}, {"n": 93, "img": null, "kind": "association", "stem": "Which natural reservoir is listed for V. cholerae?", "opts": ["Cattle and sheep", "Poultry only", "Rodents and fleas", "Humans and the aquatic environment"], "key": 3, "exp": "Answer: Humans and the aquatic environment. Book trigger: \"The natural reservoir of the organism is humans and may also be the aquatic\".", "src": "PDF 86 (printed 79)"}, {"n": 94, "img": null, "kind": "clinical case", "stem": "A patient with brucellosis is treated with a combination for 6 weeks. Why?", "opts": ["Intracellular residence of the organisms", "Resistance to all beta-lactams", "Mucinase activity", "Presence of spores"], "key": 0, "exp": "Answer: Intracellular residence of the organisms. Book trigger: \"due to the intracellular residence of the organisms\".", "src": "PDF 107 (printed 100)"}, {"n": 95, "img": null, "kind": "except", "stem": "Complications of Campylobacter enteritis include all of the following EXCEPT:", "opts": ["Guillain-Barre syndrome", "Hemolytic uremic syndrome", "Reiter's disease", "Reactive arthritis"], "key": 1, "exp": "Answer: Hemolytic uremic syndrome. Book trigger: \"Campylobacter enteritis may be complicated by any of the following\".", "src": "PDF 90 (printed 83)"}, {"n": 96, "img": null, "kind": "association", "stem": "How is H. pylori thought to be transmitted?", "opts": ["Contaminated blood only", "Inhalation of aerosols from animals", "Person to person, faeco-oral or oral-oral", "Arthropod bite"], "key": 2, "exp": "Answer: Person to person, faeco-oral or oral-oral. Book trigger: \"Transmission of H. pylori is thought to be from person to person\".", "src": "PDF 91 (printed 84)"}, {"n": 97, "img": null, "kind": "association", "stem": "At what age is a pertussis booster recommended after DTaP?", "opts": ["At 2 years", "After the age of 10 years", "At birth", "At 6 months"], "key": 1, "exp": "Answer: After the age of 10 years. Book trigger: \"A booster is recommended after the age of 10 years\".", "src": "PDF 104 (printed 97)"}, {"n": 98, "img": null, "kind": "except", "stem": "Regarding V. cholerae biochemical reactions, all of the following are true EXCEPT:", "opts": ["It ferments sugars with production of gas", "It is indole positive", "It ferments glucose, maltose, mannite and sucrose", "It is oxidase positive"], "key": 0, "exp": "Answer: It ferments sugars with production of gas. Book trigger: \"Vibrio cholerae ferments glucose, maltose, mannite and sucrose without\".", "src": "PDF 84 (printed 77)"}, {"n": 99, "img": null, "kind": "double-clue", "stem": "Which organism is the commonest bacterial cause of pink eye and Brazilian purpuric fever?", "opts": ["Haemophilus influenzae type b", "Chlamydia trachomatis", "Haemophilus aegyptius", "Haemophilus ducreyi"], "key": 2, "exp": "Answer: Haemophilus aegyptius. Book trigger: \"H. aegyptius is the commonest bacterial cause of this condition\".", "src": "PDF 100 (printed 93)"}, {"n": 100, "img": null, "kind": "double-clue", "stem": "Which small encapsulated coccobacillus is a strict aerobe and forms mercury-droplet colonies on charcoal blood agar?", "opts": ["Campylobacter jejuni", "Haemophilus influenzae", "Brucella suis", "Bordetella pertussis"], "key": 3, "exp": "Answer: Bordetella pertussis. Book trigger: \"mercury-droplet appearance of colony\".", "src": "PDF 101 (printed 94)"}, {"n": 101, "img": null, "kind": "association", "stem": "What is the major virulence factor of Brucella?", "opts": ["Capsule", "Endotoxin (LPS)", "Pertussis toxin", "Exotoxin A"], "key": 1, "exp": "Answer: Endotoxin (LPS). Book trigger: \"Endotoxin (LPS) is the major virulence factor\".", "src": "PDF 105 (printed 98)"}, {"n": 102, "img": null, "kind": "association", "stem": "What does the biopsy urease test detect?", "opts": ["Growth on charcoal agar", "Radiolabeled CO2", "Fluorescence from NAD", "A pH indicator colour change from ammonia release"], "key": 3, "exp": "Answer: A pH indicator colour change from ammonia release. Book trigger: \"changes its colour upon release of ammonia\".", "src": "PDF 93 (printed 86)"}, {"n": 103, "img": null, "kind": "association", "stem": "Which complication of Campylobacter enteritis is attributed to antibodies cross-reacting with antigens on neurons?", "opts": ["Reactive arthritis", "Reiter's disease", "Guillain-Barre syndrome", "Rheumatic fever"], "key": 2, "exp": "Answer: Guillain-Barre syndrome. Book trigger: \"cross react with antigens on neurons\".", "src": "PDF 90 (printed 83)"}, {"n": 104, "img": null, "kind": "association", "stem": "V. cholerae O1 has three serotypes. Which list is correct?", "opts": ["Ogawa, Inaba and Hikojima", "Ogawa, El Tor and Inaba", "Classical, El Tor and Hikojima", "Classical, Inaba and O139"], "key": 0, "exp": "Answer: Ogawa, Inaba and Hikojima. Book trigger: \"Ogawa, Inaba and Hikojima\".", "src": "PDF 85 (printed 78)"}, {"n": 105, "img": null, "kind": "double-clue", "stem": "Which organism shows darting motility and yellow sucrose-fermenting colonies on TCBS?", "opts": ["Campylobacter jejuni", "Pseudomonas aeruginosa", "Helicobacter pylori", "Vibrio cholerae"], "key": 3, "exp": "Answer: Vibrio cholerae. Book trigger: \"Yellow (sucrose-fermenting) colonies on TCBS medium\".", "src": "PDF 87 (printed 80)"}, {"n": 106, "img": null, "kind": "clinical case", "stem": "A child has runny nose, malaise and fever with the organism isolated in large numbers. Which stage?", "opts": ["Catarrhal stage", "Convalescent stage", "Latent stage", "Paroxysmal stage"], "key": 0, "exp": "Answer: Catarrhal stage. Book trigger: \"Isolated in large Numbers\".", "src": "PDF 103 (printed 96)"}, {"n": 107, "img": null, "kind": "double-clue", "stem": "Which organism causes chancroid, a painful soft genital ulcer with inguinal lymphadenopathy?", "opts": ["Haemophilus aegyptius", "Treponema pallidum", "Haemophilus ducreyi", "Bordetella pertussis"], "key": 2, "exp": "Answer: Haemophilus ducreyi. Book trigger: \"Chancroid manifests as painful, soft genital ulcer\".", "src": "PDF 99 (printed 92)"}, {"n": 108, "img": null, "kind": "clinical case", "stem": "A patient has painful soft genital ulcer with lymphadenopathy. How does it differ from syphilitic chancre?", "opts": ["Chancroid is hard and painless", "Syphilitic chancre is painless and hard", "Both are painless", "Both are hard"], "key": 1, "exp": "Answer: Syphilitic chancre is painless and hard. Book trigger: \"syphilitic chancre is painless and hard\".", "src": "PDF 99 (printed 92)"}, {"n": 109, "img": null, "kind": "association", "stem": "Which antibiotics are of choice for H. influenzae infections?", "opts": ["Penicillin G and erythromycin", "Third generation cephalosporins (cefotaxime or ceftriaxone)", "Doxycycline and rifampin", "Streptomycin and gentamycin"], "key": 1, "exp": "Answer: Third generation cephalosporins (cefotaxime or ceftriaxone). Book trigger: \"Third generation cephalosporins (e.g., cefotaxime or ceftriaxone)\".", "src": "PDF 99 (printed 92)"}, {"n": 110, "img": null, "kind": "clinical case", "stem": "A veterinarian has undulant fever, sweating and splenomegaly. Which treatment does the book give?", "opts": ["Erythromycin for 7 days", "Single-dose ceftriaxone", "Penicillin G for 14 days", "Doxycycline plus rifampin for 6 weeks"], "key": 3, "exp": "Answer: Doxycycline plus rifampin for 6 weeks. Book trigger: \"Doxycyclines and rifampin are the combination of choice\".", "src": "PDF 107 (printed 100)"}, {"n": 111, "img": null, "kind": "definition", "stem": "A test in which a large colony is emulsified in 0.5% sodium desoxycholate, forming DNA strings within 60 seconds, is called the:", "opts": ["Oxidase test", "Urease test", "String test", "Quellung reaction"], "key": 2, "exp": "Answer: String test. Book trigger: \"0.5% sodium desoxycholate\".", "src": "PDF 83 (printed 76)"}, {"n": 112, "img": null, "kind": "association", "stem": "Which cells does Brucella survive and multiply in, giving granuloma formation?", "opts": ["Phagocytic cells", "Neurons only", "Hepatocytes only", "Erythrocytes"], "key": 0, "exp": "Answer: Phagocytic cells. Book trigger: \"it can survive and multiply within phagocytic cells\".", "src": "PDF 105 (printed 98)"}, {"n": 113, "img": null, "kind": "clinical case", "stem": "A cholera isolate is haemolytic for sheep RBC, agglutinates chicken RBC and is VP positive. Which biotype?", "opts": ["El Tor", "Classical", "O139 only", "Non-O1"], "key": 0, "exp": "Answer: El Tor. Book trigger: \"Haemolysis of sheep RBC\".", "src": "PDF 85 (printed 78)"}, {"n": 114, "img": null, "kind": "definition", "stem": "The three serogroup-level species of Brucella named after hosts include B. abortus, B. suis and:", "opts": ["B. canis typhi", "B. pestis", "B. tularensis", "B. melitensis"], "key": 3, "exp": "Answer: B. melitensis. Book trigger: \"B. melitensis infects sheep and goats\".", "src": "PDF 104 (printed 97)"}, {"n": 115, "img": null, "kind": "clinical case", "stem": "A child has gastroenteritis; stool wet mount shows curved organisms with rapid darting motility. Which organism?", "opts": ["Salmonella Typhi", "Campylobacter jejuni", "Vibrio cholerae", "Helicobacter pylori"], "key": 1, "exp": "Answer: Campylobacter jejuni. Book trigger: \"curved organisms with rapid darting motility\".", "src": "PDF 90 (printed 83)"}, {"n": 116, "img": null, "kind": "association", "stem": "Brazilian purpuric fever is characterized by:", "opts": ["Rice-water stools", "Tenesmus", "Purpura and shock", "Whoops and vomiting"], "key": 2, "exp": "Answer: Purpura and shock. Book trigger: \"It is characterized by purpura and shock\".", "src": "PDF 100 (printed 93)"}, {"n": 117, "img": null, "kind": "association", "stem": "The acellular pertussis vaccine is combined with diphtheria and tetanus toxoids as:", "opts": ["DTaP", "MMR", "BCG", "DTP only"], "key": 0, "exp": "Answer: DTaP. Book trigger: \"currently recommended for use combined with diphtheria\".", "src": "PDF 104 (printed 97)"}, {"n": 118, "img": null, "kind": "association", "stem": "Which complications are listed for brucellosis?", "opts": ["Hemolytic uremic syndrome", "Guillain-Barre syndrome and arthritis", "Osteomyelitis, endocarditis and meningitis", "Rheumatic fever"], "key": 2, "exp": "Answer: Osteomyelitis, endocarditis and meningitis. Book trigger: \"Complications include osteomyelitis, endocarditis and meningitis\".", "src": "PDF 105 (printed 98)"}, {"n": 119, "img": null, "kind": "association", "stem": "Which drug is used for chemoprophylaxis of unvaccinated contacts of Hib meningitis?", "opts": ["Erythromycin", "Ceftriaxone", "Tetracycline", "Rifampicin"], "key": 3, "exp": "Answer: Rifampicin. Book trigger: \"Rifampicin is used for chemoprophylaxis of unvaccinated close contacts\".", "src": "PDF 99 (printed 92)"}, {"n": 120, "img": null, "kind": "association", "stem": "Which drug is of choice for pertussis, with trimethoprim-sulfamethoxazole as alternative?", "opts": ["Ceftriaxone", "Erythromycin", "Doxycycline", "Streptomycin"], "key": 1, "exp": "Answer: Erythromycin. Book trigger: \"Erythromycin is the drug of choice. Trimethoprim-\".", "src": "PDF 103 (printed 96)"}, {"n": 121, "img": null, "kind": "clinical case", "stem": "A meningitis CSF shows gram-negative coccobacilli and type b antigen by latex. Which organism?", "opts": ["Legionella pneumophila", "Haemophilus influenzae type b", "Bordetella pertussis", "Brucella melitensis"], "key": 1, "exp": "Answer: Haemophilus influenzae type b. Book trigger: \"detection of type b capsular antigen in csf by latex agglutination\".", "src": "PDF 99 (printed 92)"}, {"n": 122, "img": null, "kind": "association", "stem": "Which H. pylori factor allows it to survive in the acidic stomach?", "opts": ["Urease producing an ammonium cloud", "Adhesins", "Mucinase", "Vacuolating cytotoxin VacA"], "key": 0, "exp": "Answer: Urease producing an ammonium cloud. Book trigger: \"ammonium cloud, which permits H. pylori to survive in an acidic environment\".", "src": "PDF 91 (printed 84)"}, {"n": 123, "img": null, "kind": "association", "stem": "On TSI, V. cholerae gives:", "opts": ["Black butt with H2S production", "Alkaline butt and alkaline slant, red", "Acidic butt and alkaline slant with cracking", "Acidic butt and acidic slant with no cracking of the agar"], "key": 3, "exp": "Answer: Acidic butt and acidic slant with no cracking of the agar. Book trigger: \"acidic (yellow) butt and acidic (yellow) slant with no cracking of the agar\".", "src": "PDF 85 (printed 78)"}, {"n": 124, "img": null, "kind": "definition", "stem": "The selective indicator medium on which V. cholerae forms yellow colonies by sucrose fermentation is:", "opts": ["Charcoal blood agar", "Chocolate agar", "TCBS agar", "Skirrow's medium"], "key": 2, "exp": "Answer: TCBS agar. Book trigger: \"Thiosulphate citrate bile sucrose (TCBS) agar (a selective indicator\".", "src": "PDF 84 (printed 77)"}, {"n": 125, "img": null, "kind": "clinical case", "stem": "A household contact of a pertussis case needs prophylaxis. Which drug?", "opts": ["Rifampicin", "Tetracycline", "Streptomycin", "Erythromycin"], "key": 3, "exp": "Answer: Erythromycin. Book trigger: \"Erythromycin may be used for household contacts\".", "src": "PDF 104 (printed 97)"}, {"n": 126, "img": null, "kind": "association", "stem": "Reiter's disease is characterized by which triad?", "opts": ["Arthritis, conjunctivitis and urethritis", "Fever, headache and rash", "Arthritis, myocarditis and neuritis", "Diarrhea, jaundice and renal failure"], "key": 0, "exp": "Answer: Arthritis, conjunctivitis and urethritis. Book trigger: \"characterized by the triad of arthritis, conjunctivitis and urethritis\".", "src": "PDF 90 (printed 83)"}, {"n": 127, "img": null, "kind": "definition", "stem": "The genus name of bacteria that require X and V factors, derived from Greek, means:", "opts": ["Cold-loving", "Blood-loving", "Water-loving", "Spore-forming"], "key": 1, "exp": "Answer: Blood-loving. Book trigger: \"derived from the Greek words meaning \"blood-loving\"\".", "src": "PDF 97 (printed 90)"}, {"n": 128, "img": null, "kind": "double-clue", "stem": "Which non-fermentative aerobic Gram-negative bacillus is non-motile and oxidase negative?", "opts": ["Bordetella pertussis", "Pseudomonas aeruginosa", "Acinetobacter species", "Haemophilus influenzae"], "key": 2, "exp": "Answer: Acinetobacter species. Book trigger: \"They differ from P. aeruginosa in being non-motile, and oxidase negative\".", "src": "PDF 96 (printed 89)"}, {"n": 129, "img": null, "kind": "association", "stem": "Which growth factor is liberated from lysed RBCs?", "opts": ["V factor (NAD)", "Cholesterol", "X factor (haemin)", "Factor M"], "key": 0, "exp": "Answer: V factor (NAD). Book trigger: \"V factor (NAD): is liberated from lysed RBCs\".", "src": "PDF 97 (printed 90)"}, {"n": 130, "img": null, "kind": "association", "stem": "The Hib vaccine is a capsular polysaccharide conjugated to which carrier?", "opts": ["A killed whole-cell carrier", "A carrier protein such as diphtheria toxoid", "A live attenuated carrier", "A lipid carrier"], "key": 1, "exp": "Answer: A carrier protein such as diphtheria toxoid. Book trigger: \"capsular polysaccharide conjugated to a carrier protein\".", "src": "PDF 99 (printed 92)"}, {"n": 131, "img": null, "kind": "clinical case", "stem": "A patient on treatment for H. pylori needs follow-up. Which noninvasive test is used for diagnosis and follow up?", "opts": ["Lepromin test", "Widal test", "Stool antigen detection by ELISA", "Quellung reaction"], "key": 2, "exp": "Answer: Stool antigen detection by ELISA. Book trigger: \"for diagnosis and follow up of treatment\".", "src": "PDF 92 (printed 85)"}, {"n": 132, "img": null, "kind": "sequence", "stem": "Which order is used for diagnosis of Campylobacter enteritis?", "opts": ["Serology, stool wet mount, culture on charcoal agar, string test", "Stool, TCBS culture, biochemical identification, wet mount", "Blood culture, Skirrow's at 37°C, wet mount, serology", "Stool, wet mount showing darting curved organisms, culture on Skirrow's medium at 42°C, biochemical identification"], "key": 3, "exp": "Answer: Stool, wet mount showing darting curved organisms, culture on Skirrow's medium at 42°C, biochemical identification. Book trigger: \"Presumptive diagnosis can be made by finding curved organisms\".", "src": "PDF 90 (printed 83)"}, {"n": 133, "img": null, "kind": "sequence", "stem": "Which order describes the steps of the string test?", "opts": ["Emulsify a large colony in 0.5% sodium desoxycholate, cells lyse within 60 seconds, lift loop to see DNA strings", "Emulsify in saline, wait 24 h, look for strings", "Heat the colony, add oxidase reagent, lift loop to see strings", "Lift loop first, emulsify in desoxycholate, cells lyse after 24 h"], "key": 0, "exp": "Answer: Emulsify a large colony in 0.5% sodium desoxycholate, cells lyse within 60 seconds, lift loop to see DNA strings. Book trigger: \"Within 60 seconds, the cells lyse\".", "src": "PDF 83 (printed 76)"}, {"n": 134, "img": null, "kind": "association", "stem": "Which V. cholerae strains cause sporadic cholera-like disease but not epidemics?", "opts": ["Serogroup O1", "Serogroup O139", "El Tor biotype", "Non O1/O139 serogroups"], "key": 3, "exp": "Answer: Non O1/O139 serogroups. Book trigger: \"Other serogroups (non O1/O139) are involved in sporadic forms\".", "src": "PDF 85 (printed 78)"}, {"n": 135, "img": null, "kind": "association", "stem": "Cholera toxin is composed of how many B subunits and how many A subunit?", "opts": ["1 B subunit and 5 A subunits", "3 B subunits and 3 A subunits", "5 B subunits and 1 A subunit", "2 B subunits and 2 A subunits"], "key": 2, "exp": "Answer: 5 B subunits and 1 A subunit. Book trigger: \"It is composed of 5 binding (B) subunits and an active (A) subunit\".", "src": "PDF 86 (printed 79)"}, {"n": 136, "img": null, "kind": "clinical case", "stem": "A butcher has weakness, sweating and enlarged spleen, and blood cultures are not done. Which test is most frequently used?", "opts": ["Widal test", "Standard tube agglutination test", "Elek test", "Dark-field microscopy"], "key": 1, "exp": "Answer: Standard tube agglutination test. Book trigger: \"Serologic diagnosis: It is the most frequently used diagnostic method\".", "src": "PDF 106 (printed 99)"}, {"n": 137, "img": null, "kind": "association", "stem": "Which factor of B. pertussis is a filamentous protein on the cell surface mediating attachment?", "opts": ["Filamentous haemagglutinin (FHA)", "Adenyl cyclase toxin", "Endotoxin", "Tracheal cytotoxin"], "key": 0, "exp": "Answer: Filamentous haemagglutinin (FHA). Book trigger: \"Filamentous haemagglutinin (FHA): It is a filamentous protein\".", "src": "PDF 101 (printed 94)"}, {"n": 138, "img": null, "kind": "except", "stem": "Regarding cholera vaccines, all of the following are true EXCEPT:", "opts": ["The whole cell/B subunit vaccine is oral", "The killed vaccine is given in 2 intramuscular doses a week apart", "The live-attenuated vaccine is a recombinant oral vaccine", "The killed vaccine gives lifelong protection"], "key": 3, "exp": "Answer: The killed vaccine gives lifelong protection. Book trigger: \"Confer limited (50%) protection and only for 6 months\".", "src": "PDF 88 (printed 81)"}, {"n": 139, "img": null, "kind": "clinical case", "stem": "A child has Guillain-Barre syndrome after bloody diarrhea. Which organism is suspected?", "opts": ["Helicobacter pylori", "Vibrio cholerae", "Campylobacter jejuni", "Salmonella Typhi"], "key": 2, "exp": "Answer: Campylobacter jejuni. Book trigger: \"Guillain-Barre syndrome: It is an acute paralytic disease\".", "src": "PDF 90 (printed 83)"}, {"n": 140, "img": null, "kind": "association", "stem": "Which test detects type b antigen in CSF for H. influenzae?", "opts": ["Widal test", "Latex agglutination or fluorescent antibody", "Cold agglutinin test", "Elek test"], "key": 1, "exp": "Answer: Latex agglutination or fluorescent antibody. Book trigger: \"Detection of type b capsular antigen in CSF by latex agglutination\".", "src": "PDF 99 (printed 92)"}, {"n": 141, "img": null, "kind": "clinical case", "stem": "A contact lens wearer has eye infection with a non-fermenting oxidase positive bacillus. Which organism is it?", "opts": ["Bordetella pertussis", "Acinetobacter baumannii", "Haemophilus aegyptius", "Pseudomonas aeruginosa"], "key": 3, "exp": "Answer: Pseudomonas aeruginosa. Book trigger: \"Eye infections: frequently associated with the use of contact lens\".", "src": "PDF 95 (printed 88)"}, {"n": 142, "img": null, "kind": "except", "stem": "Regarding Brucella, all of the following are true EXCEPT:", "opts": ["It is a strictly extracellular pathogen", "It is a facultative intracellular pathogen", "It is aerobic", "It is a short Gram-negative coccobacillus"], "key": 0, "exp": "Answer: It is a strictly extracellular pathogen. Book trigger: \"Facultative intracellular pathogens\".", "src": "PDF 104 (printed 97)"}, {"n": 143, "img": null, "kind": "double-clue", "stem": "Which organism causes folliculitis, swimmer's ear and wound infection in burns, with a green pigment?", "opts": ["Haemophilus influenzae", "Acinetobacter species", "Pseudomonas aeruginosa", "Brucella melitensis"], "key": 2, "exp": "Answer: Pseudomonas aeruginosa. Book trigger: \"Wound infections (especially burns)\".", "src": "PDF 95 (printed 88)"}, {"n": 144, "img": null, "kind": "definition", "stem": "A medium containing heat-lysed blood that provides V factor and extra X factor is:", "opts": ["Charcoal blood agar", "Chocolate agar", "TCBS agar", "Skirrow's medium"], "key": 1, "exp": "Answer: Chocolate agar. Book trigger: \"Chocolate agar (heat-lysed blood)\".", "src": "PDF 97 (printed 90)"}, {"n": 145, "img": null, "kind": "except", "stem": "Regarding Helicobacter pylori, all of the following are true EXCEPT:", "opts": ["It is oxidase, catalase and urease positive", "It has multiple sheathed monopolar flagellae", "Soil and water are its natural reservoirs", "It needs microaerophilic conditions and 3-6 days of incubation"], "key": 2, "exp": "Answer: Soil and water are its natural reservoirs. Book trigger: \"There appears to be no reservoir of H. pylori aside from the human stomach\".", "src": "PDF 91 (printed 84)"}, {"n": 146, "img": null, "kind": "clinical case", "stem": "In a non-endemic area, which enrichment medium is used for the stool of a first suspected cholera case?", "opts": ["Alkaline peptone water", "Selenite F broth", "Buffered charcoal yeast extract agar", "Skirrow's medium"], "key": 0, "exp": "Answer: Alkaline peptone water. Book trigger: \"Enrichment media such as alkaline peptone water\".", "src": "PDF 87 (printed 80)"}, {"n": 147, "img": null, "kind": "sequence", "stem": "Which sequence describes brucellosis pathogenesis after entry?", "opts": ["Blood, regional lymph nodes, granuloma, thoracic duct, reticuloendothelial system", "Regional lymph nodes, thoracic duct, blood (septicaemia), reticuloendothelial system, granuloma", "Thoracic duct, regional lymph nodes, reticuloendothelial system, blood, granuloma", "Granuloma, regional lymph nodes, blood, thoracic duct, reticuloendothelial system"], "key": 1, "exp": "Answer: Regional lymph nodes, thoracic duct, blood (septicaemia), reticuloendothelial system, granuloma. Book trigger: \"regional lymph nodes, the thoracic duct, and thus into the blood\".", "src": "PDF 105 (printed 98)"}, {"n": 148, "img": null, "kind": "definition", "stem": "Another name for brucellosis, referring to its fever pattern, is:", "opts": ["Rheumatic fever", "Trench fever", "Relapsing fever", "Undulant fever"], "key": 3, "exp": "Answer: Undulant fever. Book trigger: \"(Undulant Fever or Malta Fever)\".", "src": "PDF 104 (printed 97)"}, {"n": 149, "img": null, "kind": "double-clue", "stem": "Which organism has A and M antigens and causes undulant fever in butchers and veterinarians?", "opts": ["Campylobacter jejuni", "Bordetella pertussis", "Haemophilus ducreyi", "Brucella species"], "key": 3, "exp": "Answer: Brucella species. Book trigger: \"therefore, brucellosis is an occupational disease affecting mostly butchers\".", "src": "PDF 105 (printed 98)"}, {"n": 150, "img": null, "kind": "double-clue", "stem": "Which organism has filamentous haemagglutinin, pertussis toxin and tracheal cytotoxin?", "opts": ["Bordetella pertussis", "Haemophilus influenzae", "Brucella abortus", "Legionella pneumophila"], "key": 0, "exp": "Answer: Bordetella pertussis. Book trigger: \"Tracheal cytotoxin: It interferes with ciliary movement\".", "src": "PDF 102 (printed 95)"}, {"n": 151, "img": null, "kind": "clinical case", "stem": "A child has pink eye. Which topical treatment is effective?", "opts": ["Rifampin", "Tetracycline or chloramphenicol", "Erythromycin by mouth", "Streptomycin"], "key": 1, "exp": "Answer: Tetracycline or chloramphenicol. Book trigger: \"Topical tetracycline and chloramphenicol are effective for treatment\".", "src": "PDF 100 (printed 93)"}, {"n": 152, "img": null, "kind": "clinical case", "stem": "A fisherman has cholera-like disease. Why is the isolate not called Enterobacteriaceae?", "opts": ["It lacks flagella", "It is Gram-positive", "It is oxidase positive", "It ferments lactose"], "key": 2, "exp": "Answer: It is oxidase positive. Book trigger: \"Oxidase-positive (therefore, not classified as Enterobacteriaceae)\".", "src": "PDF 83 (printed 76)"}, {"n": 153, "img": null, "kind": "association", "stem": "Which is given for chemoprophylaxis to close contacts of cholera cases?", "opts": ["Tetracycline", "Rifampicin", "Penicillin G", "Erythromycin"], "key": 0, "exp": "Answer: Tetracycline. Book trigger: \"Tetracycline may be given to close contacts\".", "src": "PDF 88 (printed 81)"}, {"n": 154, "img": null, "kind": "association", "stem": "Which B. pertussis factor interferes with ciliary movement?", "opts": ["Pertussis toxin", "Tracheal cytotoxin", "Filamentous haemagglutinin", "Adenyl cyclase toxin"], "key": 1, "exp": "Answer: Tracheal cytotoxin. Book trigger: \"It interferes with ciliary movement and kills ciliated respiratory cells\".", "src": "PDF 102 (printed 95)"}, {"n": 155, "img": null, "kind": "except", "stem": "P. aeruginosa may cause all of the following EXCEPT:", "opts": ["Urinary tract infection", "Swimmer's ear", "Folliculitis", "Whooping cough"], "key": 3, "exp": "Answer: Whooping cough. Book trigger: \"External ear infections: in swimmers (swimmer's ear)\".", "src": "PDF 95 (printed 88)"}, {"n": 156, "img": null, "kind": "except", "stem": "The mechanisms of mucosal damage by H. pylori include all of the following EXCEPT:", "opts": ["Release of ammonia", "Production of vacuolating cytotoxin VacA", "Production of an enterotoxin that raises cAMP", "Recruitment and activation of inflammatory cells"], "key": 2, "exp": "Answer: Production of an enterotoxin that raises cAMP. Book trigger: \"Production of vacuolating cytotoxin (VacA)\".", "src": "PDF 92 (printed 85)"}, {"n": 157, "img": null, "kind": "association", "stem": "Which method is used for epidemiological typing of P. aeruginosa?", "opts": ["Lepromin test", "Widal test", "Quellung reaction", "Bacteriophage and pyocin typing"], "key": 3, "exp": "Answer: Bacteriophage and pyocin typing. Book trigger: \"Bacteriophage & pyocin typing is used for epidemiological purposes\".", "src": "PDF 96 (printed 89)"}, {"n": 158, "img": null, "kind": "association", "stem": "What is the incubation period of brucellosis?", "opts": ["1-2 days", "1-6 weeks", "1-4 days", "12 – 48 hours"], "key": 1, "exp": "Answer: 1-6 weeks. Book trigger: \"The incubation period of Brucella infections is 1-6 weeks\".", "src": "PDF 105 (printed 98)"}, {"n": 159, "img": null, "kind": "except", "stem": "Regarding V. cholerae culture, all of the following are true EXCEPT:", "opts": ["It forms yellow colonies on TCBS agar", "A surface pellicle forms after 6 to 8 h at 37°C", "It grows best under acidic conditions", "It grows on alkaline peptone water at pH 8.5"], "key": 2, "exp": "Answer: It grows best under acidic conditions. Book trigger: \"V. cholerae is a facultative anaerobe and grows best under alkaline\".", "src": "PDF 84 (printed 77)"}, {"n": 160, "img": null, "kind": "association", "stem": "Where is Acinetobacter found?", "opts": ["Soil, water and foods, and as skin commensal", "Only in dried bird faeces", "Only in the human stomach", "Only in rodent fleas"], "key": 0, "exp": "Answer: Soil, water and foods, and as skin commensal. Book trigger: \"They are free-living saprophytes found in soil, water and foods\".", "src": "PDF 96 (printed 89)"}, {"n": 161, "img": null, "kind": "sequence", "stem": "Which sequence describes how H. pylori colonizes and damages the stomach?", "opts": ["Mucosal damage by VacA, then adhesins bind cells, then urease protects from acid, then mucus penetration", "Urease protects from acid, corkscrew motility and mucinase cross the mucus, adhesins bind cells, then ammonia and VacA damage mucosa", "Adhesins bind cells, then urease protects from acid, then mucinase crosses the mucus, then motility, then VacA", "Corkscrew motility, then mucosal damage by ammonia, then urease protects from acid, then adhesins bind cells"], "key": 1, "exp": "Answer: Urease protects from acid, corkscrew motility and mucinase cross the mucus, adhesins bind cells, then ammonia and VacA damage mucosa. Book trigger: \"The corkscrew motility enables the organism to penetrate\".", "src": "PDF 91 (printed 84)"}, {"n": 162, "img": null, "kind": "association", "stem": "Which agar colour is shown by P. aeruginosa on TSI?", "opts": ["Yellow butt and yellow slant", "Black butt", "Red butt and red slant (alkaline)", "Yellow butt and red slant"], "key": 2, "exp": "Answer: Red butt and red slant (alkaline). Book trigger: \"TSI: It gives red (alkaline) butt and red (alkaline) slant\".", "src": "PDF 94 (printed 87)"}, {"n": 163, "img": null, "kind": "definition", "stem": "The painful soft genital ulcer caused by H. ducreyi is called:", "opts": ["Brazilian purpuric fever", "Lymphogranuloma venereum", "Syphilitic chancre", "Chancroid"], "key": 3, "exp": "Answer: Chancroid. Book trigger: \"H. ducreyi causes chancroid (soft sore)\".", "src": "PDF 99 (printed 92)"}, {"n": 164, "img": null, "kind": "association", "stem": "Where do brucellae localize in animals?", "opts": ["The placenta and mammary glands", "The lungs only", "The skin only", "The kidneys only"], "key": 0, "exp": "Answer: The placenta and mammary glands. Book trigger: \"Brucellae localize in the placenta and mammary glands of animals\".", "src": "PDF 105 (printed 98)"}, {"n": 165, "img": null, "kind": "clinical case", "stem": "A burn patient has greenish-blue pus with Gram-negative bacilli among pus cells in a serious infection. Which treatment is indicated?", "opts": ["Penicillin G alone", "Erythromycin alone", "Doxycycline plus rifampin", "An anti-pseudomonal beta-lactam plus an aminoglycoside"], "key": 3, "exp": "Answer: An anti-pseudomonal beta-lactam plus an aminoglycoside. Book trigger: \"Combined antibiotic treatment is usually indicated in serious infections\".", "src": "PDF 96 (printed 89)"}, {"n": 166, "img": null, "kind": "association", "stem": "What haemolysis does P. aeruginosa cause on blood agar?", "opts": ["Complete haemolysis", "Double zones of haemolysis", "No haemolysis", "Partial green haemolysis"], "key": 0, "exp": "Answer: Complete haemolysis. Book trigger: \"Blood agar: It causes complete haemolysis\".", "src": "PDF 94 (printed 87)"}, {"n": 167, "img": null, "kind": "association", "stem": "What is the only reservoir of H. pylori?", "opts": ["Soil", "The human stomach", "Poultry", "Water tanks"], "key": 1, "exp": "Answer: The human stomach. Book trigger: \"There appears to be no reservoir of H. pylori aside from the human stomach\".", "src": "PDF 91 (printed 84)"}, {"n": 168, "img": null, "kind": "double-clue", "stem": "Which organism is a facultative intracellular coccobacillus transmitted by unpasteurized milk?", "opts": ["Haemophilus influenzae", "Bordetella pertussis", "Brucella species", "Pseudomonas aeruginosa"], "key": 2, "exp": "Answer: Brucella species. Book trigger: \"Ingestion of contaminated unpasteurized milk or milk products\".", "src": "PDF 105 (printed 98)"}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='abcd';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Infection and Immunity, PDF 83-107</h2>
<p>${Q.length} MCQs from the coursebook (Corynebacterium, Listeria, Bacillus, Clostridium). Mixed across all topics in random order. Each question keeps its book image where it has one. Answers follow the coursebook.</p>
<p><b>Practice mode (default):</b> after each answer you see right or wrong, the book answer and the explanation at once. Your score updates as you go. At the end you get the score, a review of the missed questions, and a button to retry only the missed ones.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>
<button class="btn" onclick="start(Q.filter(q=>q.img),'practice')">Practice: image questions</button>
<p><b>Exam mode</b> (optional, answers shown only at the end):</p>
<button class="btn g" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'exam')">Exam: 50 random</button>
</div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit'}</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else start(Q,'practice');
</script></body></html>
