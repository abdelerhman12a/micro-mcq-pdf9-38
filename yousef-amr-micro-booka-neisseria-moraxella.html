m-stained smear alone not always reliable for diagnosing gonorrhea in women?", "opts": ["False positives due to normal flora.", "False negatives due to small numbers of gonococci.", "Both a and b.", "Neither a nor b."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 216, "stem": "What are the primary sites of N. gonorrhoeae infection in men & women, respectively?", "opts": ["Urethra in men, cervix in women.", "Urethra in both men and women.", "Urethra in men, vagina in women.", "Prostate in men, ovaries in women."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 217, "stem": "Which of the following contributes to the persistence and spread of gonorrhea in women?", "opts": ["Asymptomatic infections.", "Rapid symptom onset.", "Lack of antimicrobial resistance.", "Presence of pili. 26"], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 218, "stem": "Which medium is specifically designed to inhibit the growth of contaminants and support the growth of N. gonorrhoeae?", "opts": ["Modified Thayer-Martin (MTM) medium.", "Nutrient agar.", "Sabouraud agar.", "Blood agar."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 219, "stem": "What is the primary route of infection for N. meningitidis?", "opts": ["Sexual contact.", "Respiratory droplets.", "Fomites.", "Blood transfusion."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 220, "stem": "How does N. gonorrhoeae evade the host immune response?", "opts": ["By altering its pili proteins.", "By producing exotoxins.", "Through the production of spores.", "By developing a thick capsule."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 221, "stem": "Which laboratory test can distinguish N. gonorrhoeae from other Neisseria species?", "opts": ["Coagulase test.", "Oxidase test.", "Sugar fermentation test.", "Catalase test."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 222, "stem": "Which of the following conditions is a known complication of gonococcal infection in women?", "opts": ["Ovarian cancer.", "Pelvic inflammatory disease (PID).", "Urinary tract infection (UTI).", "Endocarditis."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 223, "stem": "Which Neisseria species has an enzyme that can cleave IgA, helping it to evade the host immune system?", "opts": ["N. gonorrhoeae.", "N. meningitides.", "Both a and b.", "N. lactamica."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 224, "stem": "Which Neisseria species is commonly associated with neonatal conjunctivitis?", "opts": ["N. lactamica.", "N. gonorrhoeae.", "N. meningitides.", "Moraxella catarrhalis."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 225, "stem": "How does N. meningitidis typically enter the central nervous system (CNS)?", "opts": ["Through the gastrointestinal tract.", "By invading peripheral nerves.", "Via the bloodstream.", "Through direct invasion from nearby infections."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 226, "stem": "Which of the following is a hallmark sign of disseminated gonococcal infection (DGI)?", "opts": ["Severe headache.", "Purulent arthritis.", "Maculopapular rash.", "Renal failure."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 227, "stem": "Which of the following antibiotics is most often used to treat gonococcal infections?", "opts": ["Amoxicillin.", "Doxycycline.", "Ceftriaxone.", "Erythromycin. 27"], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 228, "stem": "Which of the following is a common prophylactic treatment for close contacts of a patient with meningococcal meningitis?", "opts": ["Rifampin.", "Vancomycin.", "Cefuroxime.", "Tetracycline."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 229, "stem": "Which antibiotic is often used in combination therapy with ceftriaxone to treat gonorrhea?", "opts": ["Erythromycin.", "Azithromycin.", "Metronidazole.", "Amoxicillin."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 230, "stem": "What is the primary function of the polysaccharide capsule in N. meningitidis?", "opts": ["To facilitate nutrient absorption.", "To act as an endotoxin.", "To prevent phagocytosis.", "To aid in antibiotic resistance."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 231, "stem": "What is the primary role of the Thayer-Martin (TM) medium in culturing N. gonorrhoeae?", "opts": ["To enhance growth on blood agar.", "To selectively isolate N. gonorrhoeae from mixed microbial populations.", "To neutralize acidic byproducts.", "To provide nutrients for non-pathogenic Neisseria species."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 232, "stem": "Which method is most effective for preventing neonatal conjunctivitis caused by N. gonorrhoeae?", "opts": ["Routine cesarean delivery.", "Erythromycin eye ointment prophylaxis.", "Prenatal screening for sexually transmitted infections.", "Antenatal antibiotic therapy."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 233, "stem": "What is the key reason for the frequent recurrence of gonorrhea in individuals?", "opts": ["High mutation rate in gonococcal pili.", "Lack of natural immunity development.", "Ineffective treatment regimens.", "High rate of reinfection from untreated partners."], "key": 0, "exp": Micro Questions - Book A)"}, {"n": 239, "stem": "A 57-old man complains of fever, headache, confusion, aversion to light and neck rigidity. A presumptive diagnosis of bacterial meningitis is made. Antimicrobial therapy should be initiated after which one of the following occurrences?", "opts": ["Fever is reduced by antipyretic.", "Sample of blood and cerebrospinal fluid have been taken.", "A Gram stain has been performed.", "The results of the antibacterial drug susceptibility are available.", "Infecting organism(s) have been identified by microbiology laboratory."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 240, "stem": "An eight-year-old presented with fever, severe headache and stiff neck. There was also projectile vomiting and the child entered into a coma. The most important laboratory procedure in this case is which of the following?", "opts": ["Complete blood picture.", "Blood sugar determination.", "Urine analysis.", "Lumber puncture."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 241, "stem": "The source of N. meningitides is the nasopharynx of human carriers who exhibit no symptoms. The ability of this bacterium to colonize the respiratory mucosa is associated with its ability to synthesize which of the following?", "opts": ["Coagulase.", "Collagenase.", "Capsule.", "Lipases.", "Pili. 29"], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 242, "stem": "A 22-year-old female presents with a sudden onset of fever of 39 °C and a severe headache. Nuchal rigidity and papilledema are seen on physical examination. Gram stain of the cerebral spinal fluid showed Gram-negative diplococci. What is the drug of choice for treating the young woman in the above case?", "opts": ["Azithromycin.", "Aztreonam.", "Imipenem.", "Penicillin."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 243, "stem": "Virulence of Neisseria meningitides is due to:", "opts": ["Exotoxin production.", "DNAse production.", "Polysaccharide capsule.", "Fibrinolysin production."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 244, "stem": "The drug of choice for preventing epidemic cerebrospinal meningitis:", "opts": ["Penicillin.", "Tetracycline.", "Chloramphenicol.", "Rifampicin."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 245, "stem": "Neisseria species are positive for:", "opts": ["Coagulase.", "Oxidase.", "Indole.", "DNAse."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 246, "stem": "Neisseria meningitides carriers harbor the organism in the:", "opts": ["Skin.", "Blood.", "Stool.", "Nasopharynx."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 247, "stem": "Which is the best way to prevent meningococcal meningitis in individuals intimately exposed to the disease?", "opts": ["Vaccinate them against Neisseria meningitidis.", "Treat them with the antibiotic rifampicin.", "Culture their throat and hospitalize them for observation.", "Withdraw a sample of spinal fluid and begin antibacterial treatment if the cell count is high and the glucose is low."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 248, "stem": "An organism is found intracellular (within pus cells) as Gram-negative diplococci in a stained smear of urethral discharge. It is most likely:", "opts": ["Neisseria meningitides.", "Neisseria gonorrhoeae.", "Haemophilus ducreyi.", "Chlamydia trachomatis."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 249, "stem": "N. meningitidis is the causative agent of:", "opts": ["Gonorrhea.", "Ophthalmia neonatorum.", "Vulvo-vaginitis.", "Epidemic cerebro-spinal m
