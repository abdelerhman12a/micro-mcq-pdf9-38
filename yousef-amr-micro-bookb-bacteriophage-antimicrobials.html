 from the bacterial chromosome?", "opts": ["UV light.", "Lysis.", "Heat.", "Cold temperatures."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 108, "stem": "Phage which integrate its DNA into bacterial chromosome is called:", "opts": ["Temperate phage.", "Pathogenic phage.", "Virulent phage.", "Lytic phage."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 109, "stem": "Phages are an example of:", "opts": ["Viruses.", "Plants.", "Bacteria.", "Fungi."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 110, "stem": "Which of the following is the correct sequence of stages in the lytic cycle?", "opts": ["Adsorption → Penetration → Eclipse → Intracellular synthesis → Assembly → Release.", "Penetration → Adsorption → Assembly → Release → Eclipse.", "Eclipse → Intracellular synthesis → Adsorption → Penetration → Release.", "Intracellular synthesis → Eclipse → Adsorption → Release → Assembly."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 111, "stem": "What is specialized transduction?", "opts": ["Transfer of viral DNA into bacterial chromosomes.", "Transfer of bacterial genes along with the prophage DNA into another bacterium.", "Destruction of bacterial DNA by the phage.", "Assembly of phage components. 12"], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 112, "stem": "Which of the following is an outcome of the lysogenic cycle?", "opts": ["Phages are released in large numbers.", "The bacterial cell is lysed.", "The prophage is carried indefinitely in daughter cells.", "The bacterial DNA is destroyed."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 113, "stem": "Virulent phage cause bacterial cell lysis:", "opts": ["True.", "False."], "key": 0, "exp": "", "src": "المفتاح المطبو
