<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mycobacterium & Syphilis Serology - Practical - Week 4 MCQs</title><style>
:root{--blue:#1d4ed8;--ok:#15803d;--no:#b91c1c}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;margin:0;background:#eef2f7;color:#111}
.w{max-width:700px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001,0 1px 3px #0002;margin-bottom:12px}
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.hdr h2{margin:0 0 4px;font-size:20px}
.hdr .meta{font-size:13px;opacity:.92;line-height:1.5}
.badge{display:inline-block;background:#ffffff2e;border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 0 0}
.bar{height:8px;background:#d7dee9;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.stem{font-size:18px;line-height:1.45;margin:4px 0 12px;font-weight:600}
img.fig{max-width:100%;max-height:360px;display:block;margin:0 auto 12px;border-radius:8px;border:1px solid #e2e8f0}
button.o{display:block;width:100%;text-align:left;font-size:16px;line-height:1.4;padding:13px 14px;margin:8px 0;border:2px solid #d4dbe6;border-radius:12px;background:#fff;cursor:pointer}
button.o:active{transform:scale(.99)}
button.o.ok{border-color:var(--ok);background:#dcfce7}
button.o.no{border-color:var(--no);background:#fee2e2}
.btn{font-size:16px;padding:12px 18px;border:0;border-radius:12px;background:var(--blue);color:#fff;margin:4px 6px 4px 0;cursor:pointer}
.btn.g{background:#64748b}
.btn.o{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn[disabled]{opacity:.4}
.ex{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:12px;margin-top:12px;font-size:15px;line-height:1.5}
.ex .cue{margin-top:8px;background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:8px;font-size:14px}
.src{font-size:12px;color:#555;margin-top:8px}
.top{display:flex;justify-content:space-between;font-size:14px;margin:6px 2px;color:#334155}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.gi{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#e2e8f0;font-size:13px;cursor:pointer}
.gi.done{background:#93c5fd;color:#0f172a}
.gi.cur{outline:2px solid #0f172a}
.rv{font-size:14px}
.ro{padding:8px 10px;margin:4px 0;border-radius:8px;border:1px solid #e5e7eb}
.ro.ok{background:#dcfce7;border-color:var(--ok)}
.ro.no{background:#fee2e2;border-color:var(--no)}
table.cues{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.cues th{background:#1e3a8a;color:#fff;text-align:left;padding:9px 10px;position:sticky;top:0;font-size:13px}
.cues td{padding:9px 10px;border-top:1px solid #e5e7eb;vertical-align:top;line-height:1.45}
.cues td:first-child{font-weight:700;background:#fefce8}
.cues td.ans{background:#f0fdf4}
@media(max-width:640px){
 .cues thead{display:none}
 .cues table,.cues tbody,.cues tr,.cues td{display:block;width:100%;box-sizing:border-box}
 .cues tr{border:1px solid #dbe3ee;border-radius:12px;margin:10px 0;box-shadow:0 1px 3px #0001;overflow:hidden}
 .cues td{border-top:0;padding:7px 12px}
 .cues td:before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
}
.note{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
a.lnk{color:var(--blue)}

const Q=[{"n": 1, "stem": "By Ziehl-Neelsen stain, M. tuberculosis appears as", "opts": ["Blue rods against a pink background", "Dark brown spirals against yellow", "Acid-fast thin straight or slightly curved pink rods against a blue background", "Yellow-orange fluorescent rods against black"], "key": 2, "exp": "Trigger: \"it is acid fast thin straight or slightly curved rods that stained pink against blue background\".", "src": "PDF 37 (printed 31)", "cue": "ZN picture of TB", "ask": "By Ziehl-Neelsen stain, M. tuberculosis appears as", "distinguish": "The yellow-orange on black picture belongs to the fluorochrome stains, not ZN."}, {"n": 2, "stem": "By fluorochrome stains (auramine-O/rhodamine), M. tuberculosis appears as", "opts": ["Yellow-orange fluorescent rods in a black background", "Pink rods in a blue background", "Dark brown spirals in a yellow background", "Green fluorescent spirals"], "key": 0, "exp": "Trigger: \"fluorochrome stains (auramine-O/rhodamine) and appear as yellow-orange fluorescent rods in a black background\".", "src": "PDF 37 (printed 31)", "cue": "fluorochrome picture", "ask": "By fluorochrome stains (auramine-O/rhodamine), M. tuberculosis appears as", "distinguish": "Pink on blue is ZN; green fluorescent spirals describe the FTA-ABS picture of treponemes."}, {"n": 3, "stem": "Which cultural character correctly describes M. tuberculosis?", "opts": ["Does not grow because it is an obligate intracellular parasite", "Strictly aerobic slow grower, colonies after 2-8 weeks at 37C", "Microaerophilic, growth overnight", "Strictly anaerobic rapid grower"], "key": 1, "exp": "Trigger: \"Strictly aerobic, slow grower. Colonies typically appear after 2 to 8 weeks of incubation at 37C\".", "src": "PDF 37 (printed 31)", "cue": "TB culture characters", "ask": "Which cultural character correctly describes M. tuberculosis?", "distinguish": "The long 2-8 week generation time on solid media is why rapid systems were developed."}, {"n": 4, "stem": "On Lowenstein-Jensen medium, M. tuberculosis colonies are", "opts": ["Black and fuzzy", "Green-pigmented and mucoid", "Non-pigmented, rough, dry and buff/cream-colored", "Smooth, golden and hemolytic"], "key": 2, "exp": "Trigger: \"Colonies are non-pigmented, rough, dry, and buff/cream-colored\".", "src": "PDF 37 (printed 31)", "cue": "LJ colonies", "ask": "On Lowenstein-Jensen medium, M. tuberculosis colonies are", "distinguish": "LJ is the enriched egg-based selective medium; the rough buff colony is its classic picture."}, {"n": 5, "stem": "The image shows an egg-based slant with rough, dry, buff-colored colonies. The medium and organism are", "opts": ["Sabouraud agar with Candida colonies", "Blood agar with Streptococcus colonies", "Lowenstein-Jensen medium with M. tuberculosis colonies", "Middlebrook agar with Nocardia colonies"], "key": 2, "exp": "Trigger: the book figure pairs \"Colonies of M. tuberculosis on LJ\" with the slant image.", "src": "PDF 39 (printed 33), figure", "cue": "image: LJ slant", "ask": "The image shows an egg-based slant with rough, dry, buff-colored colonies. The medium and organism are", "distinguish": "The green egg-based slant with rough buff colonies is LJ; Sabouraud is the fungal medium.", "img": "practical-39-19"}, {"n": 6, "stem": "The MGIT/BACTEC automated liquid system detects mycobacterial growth", "opts": ["By coagulase production", "By colony counting after 8 weeks", "By India ink staining", "Fluorometrically within 10 to 14 days"], "key": 3, "exp": "Trigger: \"Mycobacteria Growth Indicator Tube (MGIT / BACTEC) detects growth fluorometrically within 10 to 14 days\".", "src": "PDF 37 (printed 31)", "cue": "MGIT detection", "ask": "The MGIT/BACTEC automated liquid system detects mycobacterial growth", "distinguish": "It shortens the 2-8 week solid-media wait to 10-14 days but is still slower than GeneXpert."}, {"n": 7, "stem": "In the NALC-NaOH method, the role of N-acetyl-L-cysteine (NALC) is", "opts": ["Digestion and mucolysis by breaking disulfide bonds in mucin", "Staining the bacilli", "Killing bacteria and fungi", "Neutralizing the mixture"], "key": 0, "exp": "Trigger: \"N-acetyl-L-cysteine (NALC) breaks disulfide bonds in mucin, liquefying the sample and releasing trapped bacilli\".", "src": "PDF 37 (printed 31)", "cue": "NALC role", "ask": "In the NALC-NaOH method, the role of N-acetyl-L-cysteine (NALC) is", "distinguish": "The killing step belongs to 2% NaOH; NALC liquefies."}, {"n": 8, "stem": "In the NALC-NaOH method, decontamination is achieved by", "opts": ["N-acetyl-L-cysteine", "2% sodium hydroxide which kills bacteria and fungi", "Buffer at pH 6.8", "Centrifugation"], "key": 1, "exp": "Trigger: \"Decontamination: Sodium hydroxide (2% NaOH) kills bacteria and fungi\".", "src": "PDF 37 (printed 31)", "cue": "NaOH decontamination", "ask": "In the NALC-NaOH method, decontamination is achieved by", "distinguish": "NALC digests mucin; NaOH decontaminates; the buffer neutralizes before centrifugation."}, {"n": 9, "stem": "After decontamination in the NALC-NaOH method, the mixture is", "opts": ["Filtered through a 0.22 micron filter", "Plated directly on blood agar", "Incubated at 42C overnight", "Neutralized with buffer (pH 6.8) then centrifuged to concentrate bacilli into a pellet"], "key": 3, "exp": "Trigger: \"The mixture is neutralized with buffer (pH 6.8), followed by centrifugation to concentrate bacilli into a pellet for smear preparation and culture inoculation\".", "src": "PDF 37 (printed 31)", "cue": "neutralization step", "ask": "After decontamination in the NALC-NaOH method, the mixture is", "distinguish": "The pellet is what goes to smear and culture."}, {"n": 10, "stem": "The GeneXpert MTB/RIF assay detects", "opts": ["Only latent TB infection", "Nocardia in sputum", "MTB complex DNA and rifampicin resistance mutations within 2 hours", "Antibodies against TB"], "key": 2, "exp": "Trigger: \"Identifies Mycobacterium tuberculosis complex (MTBC) DNA and detects mutations associated with Rifampicin resistance... within 2 hours\".", "src": "PDF 38 (printed 32)", "cue": "GeneXpert", "ask": "The GeneXpert MTB/RIF assay detects", "distinguish": "It is the WHO-endorsed frontline molecular tool, far faster than the 2-8 weeks of culture."}, {"n": 11, "stem": "The tuberculin (Mantoux) test principle is", "opts": ["Detection of mycobacterial DNA in skin", "Measurement of interferon gamma in blood", "Type IV (delayed-type) cell-mediated hypersensitivity to intradermal PPD", "Type I immediate hypersensitivity to tuberculin"], "key": 2, "exp": "Trigger: \"Measures Type IV (delayed-type) cell-mediated hypersensitivity to intradermal Purified Protein Derivative (PPD)\".", "src": "PDF 38 (printed 32)", "cue": "Mantoux principle", "ask": "The tuberculin (Mantoux) test principle is", "distinguish": "IFN-gamma measurement in blood describes the IGRA, not the skin test."}, {"n": 12, "stem": "In the Mantoux technique, the injection is", "opts": ["0.5 mL intramuscularly in the gluteus", "0.1 mL containing 5 TU intradermally on the volar aspect of the forearm", "A drop on the scarified forearm skin", "1 mL subcutaneously in the deltoid"], "key": 1, "exp": "Trigger: \"Intradermal injection of 0.1 mL containing 5 Tuberculin Units (TU) on the volar aspect of the forearm\".", "src": "PDF 38 (printed 32)", "cue": "Mantoux dose", "ask": "In the Mantoux technique, the injection is", "distinguish": "Dose, route and site are all specified; intradermal volar forearm is the key phrase."}, {"n": 13, "stem": "A Mantoux test is read by measuring", "opts": ["Fever after 24 hours", "Transverse diameter of induration after 48-72 hours", "Diameter of erythema after 20 minutes", "Pus formation after one week"], "key": 1, "exp": "Trigger: \"The transverse diameter of induration (palpable firm swelling, NOT erythema) is measured after 48-72 hours\".", "src": "PDF 38 (printed 32)", "cue": "Mantoux reading", "ask": "A Mantoux test is read by measuring", "distinguish": "Induration, not erythema, is what is measured."}, {"n": 14, "stem": "A Mantoux induration of 6 mm is considered positive in", "opts": ["Healthy individuals with no risk factors", "Patients with diabetes", "Healthcare workers", "HIV-infected patients, recent TB contacts or organ transplant recipients"], "key": 3, "exp": "Trigger: \">= 5 mm: Positive in HIV-infected patients, recent TB contacts, or organ transplant recipients\".", "src": "PDF 38 (printed 32)", "cue": "Mantoux 5 mm cutoff", "ask": "A Mantoux induration of 6 mm is considered positive in", "distinguish": "The 5 mm cutoff applies to the highest-risk group; healthcare workers and diabetics need 10 mm."}, {"n": 15, "stem": "A Mantoux induration of 12 mm is considered positive in", "opts": ["Only HIV-infected patients", "No one, it is always negative", "Only healthy individuals", "Healthcare workers, patients with diabetes or cancer, and individuals from endemic areas"], "key": 3, "exp": "Trigger: \">= 10 mm: Positive in healthcare workers, high-risk clinical conditions e.g. diabetes and cancer, or individuals from endemic areas\".", "src": "PDF 38 (printed 32)", "cue": "Mantoux 10 mm cutoff", "ask": "A Mantoux induration of 12 mm is considered positive in", "distinguish": "Healthy people without risk factors need 15 mm to call it positive."}, {"n": 16, "stem": "A major limitation of the tuberculin test is that it", "opts": ["Requires 8 weeks to read", "Cannot be done on the forearm", "Detects only rifampicin resistance", "Cross-reacts with prior BCG vaccination and non-tuberculous mycobacteria"], "key": 3, "exp": "Trigger: \"Limitation: Cross-reacts with prior BCG vaccination and non-tuberculous mycobacteria (NTM)\".", "src": "PDF 38 (printed 32)", "cue": "Mantoux limitation", "ask": "A major limitation of the tuberculin test is that it", "distinguish": "This cross-reaction is exactly the problem IGRAs were designed to avoid."}, {"n": 17, "stem": "The advantage of IGRAs (QuantiFERON-TB Gold, T-SPOT.TB) over the tuberculin test is", "opts": ["They are unaffected by prior BCG vaccination", "They measure induration on the skin", "They are cheaper and need no laboratory", "They detect rifampicin resistance"], "key": 0, "exp": "Trigger: \"Advantage: Unaffected by prior BCG vaccination\".", "src": "PDF 38 (printed 32)", "cue": "IGRA advantage", "ask": "The advantage of IGRAs (QuantiFERON-TB Gold, T-SPOT.TB) over the tuberculin test is", "distinguish": "IGRAs measure IFN-gamma from sensitized T cells against ESAT-6 and CFP-10, antigens absent from BCG."}, {"n": 18, "stem": "M. leprae on modified Ziehl-Neelsen stain appears as", "opts": ["Gram-positive cocci in clusters", "Acid-fast bacilli in bunches, intracellular", "Branching fungal hyphae", "Single extracellular acid-fast rods"], "key": 1, "exp": "Trigger: \"M. leprae appear as acid-fast bacilli in bunches intracellular\".", "src": "PDF 39 (printed 33)", "cue": "leprae picture", "ask": "M. leprae on modified Ziehl-Neelsen stain appears as", "distinguish": "The modified ZN uses 5% H2SO4 or 1% HCl in alcohol for decolorization, weaker than for TB."}, {"n": 19, "stem": "The image shows pink acid-fast bacilli packed in bunches inside cells. This appearance is characteristic of", "opts": ["Borrelia in a blood film", "M. leprae", "Candida pseudohyphae", "M. tuberculosis on LJ medium"], "key": 1, "exp": "Trigger: the book figure caption \"M. leprae appear as acid-fast bacilli in bunches intracellular\".", "src": "PDF 39 (printed 33), figure", "cue": "image: leprae bunches", "ask": "The image shows pink acid-fast bacilli packed in bunches inside cells. This appearance is characteristic of", "distinguish": "Intracellular bunches point to leprae; TB is described as parallel strands or clumps in a smear.", "img": "practical-39-22"}, {"n": 20, "stem": "Cultivation of M. leprae", "opts": ["Has not succeeded on any medium; mouse foot-pad injection induces a characteristic lesion", "Requires MGIT liquid culture", "Is routine on Lowenstein-Jensen in 2 weeks", "Grows on Sabouraud agar at 27C"], "key": 0, "exp": "Trigger: \"M. leprae has not been successfully cultivated on any medium. In vivo injection of material containing leprosy bacilli into the foot pads of mice induces a characteristic lesion\".", "src": "PDF 39 (printed 33)", "cue": "leprae culture", "ask": "Cultivation of M. leprae", "distinguish": "Like T. pallidum, it needs an in vivo animal model; no artificial medium works."}, {"n": 21, "stem": "The lepromin test is", "opts": ["An intradermal skin test similar to the tuberculin test", "A sputum culture", "A blood PCR for leprosy", "A urine antigen test"], "key": 0, "exp": "Trigger: \"Lepromin test is intra-dermal skin test used for diagnosis (similar to the tuberculin test)\".", "src": "PDF 39 (printed 33)", "cue": "lepromin test", "ask": "The lepromin test is", "distinguish": "It mirrors the Mantoux principle but for leprosy."}, {"n": 22, "stem": "Specimens for laboratory diagnosis of syphilis include", "opts": ["Stool and urine only", "Hair shafts", "Exudate from chancre, maculopapular rash or condylomata lata, and serum for serologic tests", "Only stored blood"], "key": 2, "exp": "Trigger: \"Exudate collected from the chancre, maculopapular rash or condylomata lata. Serum for serologic tests\".", "src": "PDF 40 (printed 34)", "cue": "syphilis specimens", "ask": "Specimens for laboratory diagnosis of syphilis include", "distinguish": "Lesion exudate for direct detection, serum for the serologic tests."}, {"n": 23, "stem": "In which stages is T. pallidum found in large numbers?", "opts": ["Congenital stage only", "Latent stage only", "Primary and secondary stages", "Tertiary stage only"], "key": 2, "exp": "Trigger: \"T. pallidum: found in large numbers in primary and secondary stages. T.pallidum is rarely present in tertiary stage\".", "src": "PDF 40 (printed 34)", "cue": "organism numbers by stage", "ask": "In which stages is T. pallidum found in large numbers?", "distinguish": "This is why direct detection works best in early lesions."}, {"n": 24, "stem": "The antigen used in non-specific treponemal tests is", "opts": ["Native T. pallidum antigen", "Sheep erythrocytes alone", "An alcoholic solution containing cardiolipin, lecithin and cholesterol", "Colored gelatin particles only"], "key": 2, "exp": "Trigger: \"Antigen used is an alcoholic solution containing cardiolipin, lecithin, and cholesterol\".", "src": "PDF 40 (printed 34)", "cue": "reagin antigen", "ask": "The antigen used in non-specific treponemal tests is", "distinguish": "Native or recombinant T. pallidum antigens belong to the specific tests."}, {"n": 25, "stem": "Non-specific treponemal tests are used as", "opts": ["Confirmatory tests", "Screening tests only, and positives must be confirmed by specific tests", "Tests of cure in congenital syphilis", "Blood-culture substitutes"], "key": 1, "exp": "Trigger: \"Used as screening test only. Limitations: False positive results. Therefore, positive non-specific tests should be confirmed by specific treponemal tests\".", "src": "PDF 40 (printed 34)", "cue": "reagin use", "ask": "Non-specific treponemal tests are used as", "distinguish": "Their false-positive rate is why confirmation is mandatory."}, {"n": 26, "stem": "Which of the following is a slide flocculation test read microscopically?", "opts": ["RPR", "TPPA", "TRUST", "VDRL"], "key": 3, "exp": "Trigger: \"Venereal Disease Research Laboratory (VDRL). A slide flocculation test. Read microscopically\".", "src": "PDF 40-41 (printed 34-35)", "cue": "VDRL reading", "ask": "Which of the following is a slide flocculation test read microscopically?", "distinguish": "RPR and TRUST are modified to allow macroscopic reading; VDRL still needs the microscope."}, {"n": 27, "stem": "In the RPR test, the cardiolipin antigen is modified with", "opts": ["Fluorescein-labelled antibodies", "Colored gelatin particles", "Choline chloride and charcoal particles to allow macroscopic reading", "Toluidine red pigment"], "key": 2, "exp": "Trigger: \"Cardiolipin antigen is modified with choline chloride + charcoal particles to allow macroscopic reading\".", "src": "PDF 41 (printed 35)", "cue": "RPR modification", "ask": "In the RPR test, the cardiolipin antigen is modified with", "distinguish": "Toluidine red is the TRUST modification; charcoal makes the RPR clumps visible to the naked eye."}, {"n": 28, "stem": "The image shows an RPR-CARBON kit with reagent bottles and a reaction card. The charcoal particles in this test serve to", "opts": ["Fix the treponemes on the slide", "Allow macroscopic reading of the flocculation", "Fluoresce under UV light", "Kill contaminating bacteria"], "key": 1, "exp": "Trigger: cardiolipin antigen modified with choline chloride + charcoal particles to allow macroscopic reading.", "src": "PDF 41 (printed 35), figure", "cue": "image: RPR kit", "ask": "The image shows an RPR-CARBON kit with reagent bottles and a reaction card. The charcoal particles in this test serve to", "distinguish": "The charcoal is a visual marker so the result can be read without a microscope.", "img": "practical-41-18"}, {"n": 29, "stem": "The image shows three card circles labelled non-reactive, weakly reactive and strongly reactive. This reading pattern belongs to", "opts": ["The western blot", "The RPR card test", "The India ink preparation", "The Mantoux test"], "key": 1, "exp": "Trigger: the RPR card is read macroscopically by the clumping pattern in the card circles.", "src": "PDF 41 (printed 35), figure", "cue": "image: RPR card", "ask": "The image shows three card circles labelled non-reactive, weakly reactive and strongly reactive. This reading pattern belongs to", "distinguish": "Macroscopic clumping on a card = RPR; VDRL flocculation is read microscopically.", "img": "practical-41-19"}, {"n": 30, "stem": "In the TRUST test, the cardiolipin antigen is modified with", "opts": ["Latex particles", "Gelatin particles", "Charcoal particles", "Toluidine red pigment"], "key": 3, "exp": "Trigger: \"Cardiolipin modified with toluidine red pigment. Macroscopic reading\".", "src": "PDF 41 (printed 35)", "cue": "TRUST modification", "ask": "In the TRUST test, the cardiolipin antigen is modified with", "distinguish": "RPR uses charcoal; TRUST uses the red dye, both for macroscopic reading."}, {"n": 31, "stem": "The image shows a TRUST kit with toluidine red antigen vial and a test card. TRUST belongs to which group of syphilis tests?", "opts": ["Culture methods", "Specific treponemal tests", "Non-specific (reagin) treponemal tests", "Molecular tests"], "key": 2, "exp": "Trigger: TRUST is listed under non-specific treponemal tests beside VDRL, RPR and ART.", "src": "PDF 40-41 (printed 34-35), figure", "cue": "image: TRUST", "ask": "The image shows a TRUST kit with toluidine red antigen vial and a test card. TRUST belongs to which group of syphilis tests?", "distinguish": "It detects reagin antibodies like the other cardiolipin tests, so it screens but does not confirm.", "img": "practical-41-20"}, {"n": 32, "stem": "The antigen used in specific treponemal tests is", "opts": ["Native or recombinant Treponema pallidum antigens", "PPD", "Sheep red cells without sensitization", "Cardiolipin, lecithin and cholesterol"], "key": 0, "exp": "Trigger: \"Antigen used is Native or recombinant Treponema pallidum antigens\".", "src": "PDF 41 (printed 35)", "cue": "specific test antigen", "ask": "The antigen used in specific treponemal tests is", "distinguish": "Cardiolipin is the reagin-test antigen; specific tests use the organism's own antigens."}, {"n": 33, "stem": "All of the following are specific treponemal tests EXCEPT", "opts": ["VDRL", "FTA-ABS", "TPPA", "MHA-TP"], "key": 0, "exp": "Trigger: specific types listed: MHA-TP, TPPA, FTA-ABS, enzyme immuno-assays, Western Blot.", "src": "PDF 41 (printed 35)", "cue": "specific test types", "ask": "All of the following are specific treponemal tests EXCEPT", "distinguish": "VDRL is a non-specific reagin screening test."}, {"n": 34, "stem": "The MHA-TP test is based on", "opts": ["Fluorescence of labelled antihuman antibody", "Passive hemagglutination of erythrocytes sensitized with T. pallidum antigen", "Agglutination of colored gelatin particles", "Flocculation of cardiolipin"], "key": 1, "exp": "Trigger: \"A passive hemagglutination assay based on hemagglutination of erythrocytes sensitized with T. pallidum antigen by antibodies found in the patient's serum or plasma\".", "src": "PDF 42 (printed 36)", "cue": "MHA-TP principle", "ask": "The MHA-TP test is based on", "distinguish": "TPPA replaces the red cells with gelatin particles; that is the key difference between them."}, {"n": 35, "stem": "The image shows a microtiter plate with red-cell settling patterns in the wells, including a titer row. This is the", "opts": ["GeneXpert cartridge", "Mantoux test", "TRUST test", "MHA-TP test"], "key": 3, "exp": "Trigger: \"This test is done in microtiter plates\" under the MHA-TP heading with the plate figure.", "src": "PDF 42 (printed 36), figure", "cue": "image: MHA-TP plate", "ask": "The image shows a microtiter plate with red-cell settling patterns in the wells, including a titer row. This is the", "distinguish": "A hemagglutination pattern in microtiter wells = MHA-TP; gelatin particles instead of RBCs would be TPPA.", "img": "practical-42-14"}, {"n": 36, "stem": "TPPA differs from MHA-TP in that the treponemal antigen is coated onto", "opts": ["Charcoal particles", "Killed whole treponemes on a slide", "Polystyrene latex only", "Colored gelatin particles rather than red blood cells"], "key": 3, "exp": "Trigger: \"Treponemal antigen is coated onto colored gelatin particles rather than red blood cells\".", "src": "PDF 42 (printed 36)", "cue": "TPPA principle", "ask": "TPPA differs from MHA-TP in that the treponemal antigen is coated onto", "distinguish": "Same agglutination idea as MHA-TP but the carrier particle differs."}, {"n": 37, "stem": "The image shows a microtiter plate with pink gelatin-particle patterns in the wells. This is the", "opts": ["Lepromin test", "VDRL test", "TPPA test", "Mantoux test"], "key": 2, "exp": "Trigger: the TPPA figure shows the colored gelatin particles agglutinating in microtiter wells.", "src": "PDF 42-43 (printed 36-37), figure", "cue": "image: TPPA plate", "ask": "The image shows a microtiter plate with pink gelatin-particle patterns in the wells. This is the", "distinguish": "Pink particle patterns = TPPA; red-cell patterns would be MHA-TP.", "img": "practical-42-16"}, {"n": 38, "stem": "In the FTA-ABS test", "opts": ["Gelatin particles carry the antigen", "The cardiolipin antigen is mixed with charcoal", "DNA is amplified in a cartridge", "Patient serum is layered on a slide coated with killed Treponema, then fluorescein-conjugated antihuman antibody is applied"], "key": 3, "exp": "Trigger: \"Patient's serum is layered on a slide previously coated with killed Treponema. Fluorescein-conjugated antihuman antibody reagent is then applied as a marker\".", "src": "PDF 43 (printed 37)", "cue": "FTA-ABS principle", "ask": "In the FTA-ABS test", "distinguish": "It is an indirect immunofluorescence test read under the fluorescent microscope."}, {"n": 39, "stem": "The image shows bright green fluorescent spiral organisms against a black background under a fluorescent microscope. This is the", "opts": ["Dark-ground microscopy", "Fontana stain", "FTA-ABS test", "ZN stain"], "key": 2, "exp": "Trigger: the FTA-ABS figure shows fluorescein-marked treponemes fluorescing under the fluorescent microscope.", "src": "PDF 43 (printed 37), figure", "cue": "image: FTA-ABS", "ask": "The image shows bright green fluorescent spiral organisms against a black background under a fluorescent microscope. This is the", "distinguish": "Green fluorescent spirals = FTA-ABS; dark-ground shows white helices without fluorescence, Fontana is brown on yellow.", "img": "practical-43-17"}, {"n": 40, "stem": "Regarding enzyme immuno-assays for syphilis", "opts": ["They detect only reagin antibodies", "IgM-specific ELISA is more sensitive than FTA-ABS specific IgM in diagnosis of congenital syphilis", "They are read on a card macroscopically", "They cannot distinguish IgG from IgM"], "key": 1, "exp": "Trigger: \"ELISA specific to IgM is more sensitive than FTA-ABS specific IgM in diagnosis of congenital syphilis\".", "src": "PDF 43 (printed 37)", "cue": "EIA congenital", "ask": "Regarding enzyme immuno-assays for syphilis", "distinguish": "ELISAs for IgG and IgM exist separately with excellent sensitivity and specificity."}, {"n": 41, "stem": "The Western blot for syphilis", "opts": ["Is a screening card test", "Detects IgG and IgM antibodies separately and is highly sensitive and specific", "Measures interferon gamma", "Detects reagin only"], "key": 1, "exp": "Trigger: \"Western blot is available for detecting lgG and IgM antibodies separately. It is highly sensitive and specific\".", "src": "PDF 44 (printed 38)", "cue": "western blot syphilis", "ask": "The Western blot for syphilis", "distinguish": "It is a specific treponemal confirmatory test, like in Lyme disease serology."}, {"n": 42, "stem": "The image shows a tiny helical organism seen as a bright spiral against a black field with a slow corkscrew movement described. The technique is", "opts": ["ZN stain", "Dark-ground microscopy", "Gram stain", "Fontana silver impregnation"], "key": 1, "exp": "Trigger: \"Dark-ground microscope shows tiny helically shaped organism with a characteristic slow corkscrew movement\".", "src": "PDF 44 (printed 38), figure", "cue": "image: dark-ground", "ask": "The image shows a tiny helical organism seen as a bright spiral against a black field with a slow corkscrew movement described. The technique is", "distinguish": "Bright helix on a black field without staining = dark-ground; Fontana would be brown on yellow.", "img": "practical-44-14"}, {"n": 43, "stem": "The image shows dark brown spiral organisms against a yellow background. The stain used is", "opts": ["Giemsa", "Gram", "Ziehl-Neelsen", "Fontana silver impregnation"], "key": 3, "exp": "Trigger: \"Silver impregnation (Fontana stain): appears dark brown against yellow background\".", "src": "PDF 44 (printed 38), figure", "cue": "image: Fontana", "ask": "The image shows dark brown spiral organisms against a yellow background. The stain used is", "distinguish": "Dark brown on yellow is the silver impregnation picture of T. pallidum in tissue.", "img": "practical-44-15"}];

const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">Back to Week 4 timetable</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">Back to Week 4 timetable</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
