const Q=[{"n": 1, "stem": "Vibrios are Gram-negative", "opts": ["Cocci in pairs", "Curved/comma, highly motile bacilli with a single polar flagellum", "Straight non-motile rods", "Spore formers"], "key": 1, "exp": "Trigger: \"Gram-negative, curved/comma-shaped, highly motile bacilli with a single polar flagellum producing darting motility\".", "src": "Theory book PDF 83 (printed 76)", "cue": "vibrio traits", "ask": "Vibrios are Gram-negative", "distinguish": "Darting motility."}, {"n": 2, "stem": "Which pairing is correct?", "opts": ["V. vulnificus - cholera", "V. parahaemolyticus - seafood gastroenteritis", "V. cholerae - wound infection", "V. cholerae - seafood gastroenteritis"], "key": 1, "exp": "Trigger: \"V. cholerae - cholera; V. parahaemolyticus - seafood gastroenteritis; V. vulnificus - severe wound infection/sepsis\".", "src": "Theory book PDF 83 (printed 76)", "cue": "Vibrio species", "ask": "Which pairing is correct?", "distinguish": "Cholera = V. cholerae."}, {"n": 3, "stem": "Vibrios are not classified as Enterobacteriaceae because they are", "opts": ["Gram positive", "Oxidase positive", "Non-motile", "Catalase negative"], "key": 1, "exp": "Trigger: \"Oxidase-positive (therefore, not classified as Enterobacteriaceae)\".", "src": "Theory book PDF 83 (printed 76)", "cue": "oxidase positive", "ask": "Vibrios are not classified as Enterobacteriaceae because they are", "distinguish": "Enterobacteriaceae are oxidase negative."}, {"n": 4, "stem": "The string test differentiates vibrios from", "opts": ["Shigella", "Salmonella", "Aeromonas", "Campylobacter"], "key": 2, "exp": "Trigger: \"The string test differentiates vibrios (string-positive) from Aeromonas (string negative)\".", "src": "Theory book PDF 83 (printed 76)", "cue": "string test", "ask": "The string test differentiates vibrios from", "distinguish": "Vibrios are positive."}, {"n": 5, "stem": "The string test uses", "opts": ["10% KOH", "0.5% sodium desoxycholate; DNA strings form within 60 seconds", "Concentrated H2SO4", "Hydrogen peroxide"], "key": 1, "exp": "Trigger: \"emulsifying a large colony in 0.5% sodium desoxycholate. Within 60 seconds... DNA strings up to 3 cm\".", "src": "Theory book PDF 83 (printed 76)", "cue": "string test method", "ask": "The string test uses", "distinguish": "Cells lyse and DNA strings form."}, {"n": 6, "stem": "Vibrios tolerate alkaline conditions and are destroyed by", "opts": ["Bile", "High pH", "Salt", "Low pH"], "key": 3, "exp": "Trigger: \"Tolerant to alkaline conditions and destroyed by low pH\".", "src": "Theory book PDF 83 (printed 76)", "cue": "alkaline", "ask": "Vibrios tolerate alkaline conditions and are destroyed by", "distinguish": "Alkaline peptone water pH 8.5."}, {"n": 7, "stem": "Alkaline peptone water culture of V. cholerae forms", "opts": ["A surface pellicle after 6-8 h", "No growth", "Turbidity throughout after 24 h", "A sediment only"], "key": 0, "exp": "Trigger: \"a surface pellicle... after an incubation of 6 to 8 h at 37 C\".", "src": "Theory book PDF 84 (printed 77)", "cue": "APW pellicle", "ask": "Alkaline peptone water culture of V. cholerae forms", "distinguish": "It is aerobic."}, {"n": 8, "stem": "On TCBS agar V. cholerae gives", "opts": ["Black colonies", "Blue colonies", "Yellow colonies due to sucrose fermentation", "Green colonies"], "key": 2, "exp": "Trigger: \"yellow colonies on TCBS due to sucrose fermentation\".", "src": "Theory book PDF 84 (printed 77)", "cue": "TCBS", "ask": "On TCBS agar V. cholerae gives", "distinguish": "Selective indicator medium."}, {"n": 9, "stem": "V. cholerae on TSI gives", "opts": ["Yellow butt, red slant", "Yellow butt and yellow slant with no cracking", "Cracking with gas", "Black butt"], "key": 1, "exp": "Trigger: \"acidic (yellow) butt and acidic (yellow) slant with no cracking of the agar\".", "src": "Theory book PDF 85 (printed 78)", "cue": "TSI Vibrio", "ask": "V. cholerae on TSI gives", "distinguish": "E. coli cracks the agar."}, {"n": 10, "stem": "V. cholerae biochemically is", "opts": ["Oxidase negative, indole positive", "Oxidase and indole positive", "Both negative", "Oxidase positive, indole negative"], "key": 1, "exp": "Trigger: \"oxidase-positive and indole-positive\".", "src": "Theory book PDF 85 (printed 78)", "cue": "oxidase indole", "ask": "V. cholerae biochemically is", "distinguish": "Ferments sugars without gas."}, {"n": 11, "stem": "Epidemic cholera is caused by serogroups", "opts": ["O1 and O139", "O2 and O3", "All serogroups", "O1 and O2"], "key": 0, "exp": "Trigger: \"serogroups O1 and O139 are the causative agents of epidemic cholera\".", "src": "Theory book PDF 85 (printed 78)", "cue": "O1 O139", "ask": "Epidemic cholera is caused by serogroups", "distinguish": "Non-O1/O139 cause sporadic disease."}, {"n": 12, "stem": "Serogroup O1 has serotypes", "opts": ["Classical, El Tor, Hikojima", "Ogawa and El Tor", "Ogawa, Inaba and Hikojima", "Inaba only"], "key": 2, "exp": "Trigger: \"The serogroup O1 has three distinct serotypes (Ogawa, Inaba and Hikojima)\".", "src": "Theory book PDF 85 (printed 78)", "cue": "O1 serotypes", "ask": "Serogroup O1 has serotypes", "distinguish": "Each may be classical or El Tor biotype."}, {"n": 13, "stem": "Flagellar H antigens of vibrios are", "opts": ["Specific for O1", "Specific for O139", "Absent", "Shared by all vibrios, so useless for typing"], "key": 3, "exp": "Trigger: \"flagellar (H) antigens are shared with all vibrios... no use in distinguishing strains\".", "src": "Theory book PDF 85 (printed 78)", "cue": "H antigen", "ask": "Flagellar H antigens of vibrios are", "distinguish": "O antigen types strains."}, {"n": 14, "stem": "El Tor differs from Classical by being", "opts": ["Phage IV sensitive", "Polymyxin sensitive", "Non-hemolytic, VP negative", "Hemolytic on sheep RBC, VP positive, polymyxin B resistant"], "key": 3, "exp": "Trigger: Table 1.7: El Tor haemolysis +, haemagglutination +, VP +, polymyxin resistant, phage IV resistant.", "src": "Theory book PDF 85 (printed 78)", "cue": "El Tor", "ask": "El Tor differs from Classical by being", "distinguish": "Classical is negative for all of these."}, {"n": 15, "stem": "Classical biotype is", "opts": ["Polymyxin B susceptible and phage IV sensitive", "Hemolytic", "Resistant to both", "VP positive"], "key": 0, "exp": "Trigger: Table 1.7: Classical negative haemolysis, haemagglutination, VP; susceptible to polymyxin B; sensitive to phage IV.", "src": "Theory book PDF 85 (printed 78)", "cue": "Classical", "ask": "Classical biotype is", "distinguish": "El Tor resists both."}, {"n": 16, "stem": "Cholera toxin has", "opts": ["2 subunits only", "7 subunits", "5 B subunits and 1 active A subunit", "1 B and 5 A"], "key": 2, "exp": "Trigger: \"composed of 5 binding (B) subunits and an active (A) subunit\".", "src": "Theory book PDF 86 (printed 79)", "cue": "toxin structure", "ask": "Cholera toxin has", "distinguish": "B binds, A activates adenylate cyclase."}, {"n": 17, "stem": "Cholera toxin raises", "opts": ["Calcium", "Chloride", "cAMP via adenylate cyclase activation", "cGMP"], "key": 2, "exp": "Trigger: \"activates the adenylate cyclase enzyme causing a rise in cAMP\".", "src": "Theory book PDF 86 (printed 79)", "cue": "cAMP", "ask": "Cholera toxin raises", "distinguish": "Massive electrolyte and water secretion."}, {"n": 18, "stem": "Cholera stools are", "opts": ["Rice-water watery diarrhea", "Black tarry", "Formed", "Bloody mucoid"], "key": 0, "exp": "Trigger: \"abrupt onset of vomiting and massive watery diarrhea (rice-water stools)\".", "src": "Theory book PDF 87 (printed 80)", "cue": "rice water", "ask": "Cholera stools are", "distinguish": "Death from hypovolaemic shock."}, {"n": 19, "stem": "The chronic carrier state in cholera is seen only with", "opts": ["O139", "Non-O1", "Classical", "El Tor"], "key": 3, "exp": "Trigger: \"Chronic carrier state observed only with El Tor\".", "src": "Theory book PDF 87 (printed 80)", "cue": "El Tor carrier", "ask": "The chronic carrier state in cholera is seen only with", "distinguish": "Convalescent carriers 4-5 weeks."}, {"n": 20, "stem": "Incubation of cholera is", "opts": ["1-4 days", "1 month", "1-2 weeks", "12-48 h"], "key": 0, "exp": "Trigger: \"Incubation period ranges from 1-4 days\".", "src": "Theory book PDF 87 (printed 80)", "cue": "incubation", "ask": "Incubation of cholera is", "distinguish": "Abrupt onset."}, {"n": 21, "stem": "Stool is inoculated directly for cholera into", "opts": ["Alkaline peptone water, then subcultured on TCBS", "Selenite broth", "Skirrow", "LJ"], "key": 0, "exp": "Trigger: \"inoculated directly on Enrichment media such as alkaline peptone water... subcultured on TCBS\".", "src": "Theory book PDF 87 (printed 80)", "cue": "cholera culture", "ask": "Stool is inoculated directly for cholera into", "distinguish": "Pellicle subculture."}, {"n": 22, "stem": "Confirmation of V. cholerae is by", "opts": ["Slide agglutination with anti-O1 and anti-O139 antisera", "Urease test", "Latex K1", "Widal"], "key": 0, "exp": "Trigger: \"Confirmation by slide agglutination with specific anti-O1 and anti-O139 antisera\".", "src": "Theory book PDF 87 (printed 80)", "cue": "confirmation", "ask": "Confirmation of V. cholerae is by", "distinguish": "Microscopy shows darting motility."}, {"n": 23, "stem": "During an epidemic, secondary cases are confirmed by", "opts": ["Full culture", "Wet mount of liquid stool where motility is stopped by specific antibody", "Blood culture", "Serology"], "key": 1, "exp": "Trigger: \"wet mount of liquid stool to detect characteristic motility which is stopped by specific antibody\".", "src": "Theory book PDF 87-88 (printed 80-81)", "cue": "epidemic wet mount", "ask": "During an epidemic, secondary cases are confirmed by", "distinguish": "First case needs full bacteriology."}, {"n": 24, "stem": "Treatment of cholera is essentially", "opts": ["Vaccination", "Surgery", "Antitoxin", "Fluid and electrolyte replacement (IV or oral)"], "key": 3, "exp": "Trigger: \"replacing fluid and electrolytes either intravenously or orally. Antibiotics such as tetracycline or ciprofloxacin useful\".", "src": "Theory book PDF 88 (printed 81)", "cue": "cholera treatment", "ask": "Treatment of cholera is essentially", "distinguish": "Antibiotics are adjunct."}, {"n": 25, "stem": "The killed cholera vaccine gives protection of", "opts": ["About 50% for 6 months", "None", "90% for 5 years", "Lifelong"], "key": 0, "exp": "Trigger: \"Confer limited (50%) protection and only for 6 months... 2 IM doses one week interval\".", "src": "Theory book PDF 88 (printed 81)", "cue": "killed vaccine", "ask": "The killed cholera vaccine gives protection of", "distinguish": "Table: 3-6 months."}, {"n": 26, "stem": "The whole cell/B subunit oral vaccine protects for", "opts": ["3-6 months", "1 month", "Lifelong", "2 years"], "key": 3, "exp": "Trigger: Table 1.8: Whole cell/B subunit oral, 2 years.", "src": "Theory book PDF 88 (printed 81)", "cue": "WC/B", "ask": "The whole cell/B subunit oral vaccine protects for", "distinguish": "Live attenuated: at least 6 months."}, {"n": 27, "stem": "Tetracycline chemoprophylaxis in cholera", "opts": ["Is for all travellers", "Prevents epidemics", "Is for close contacts but cannot stop an epidemic", "Is not used"], "key": 2, "exp": "Trigger: \"Tetracycline may be given to close contacts, but it cannot prevent the spread of an epidemic\".", "src": "Theory book PDF 88 (printed 81)", "cue": "chemoprophylaxis", "ask": "Tetracycline chemoprophylaxis in cholera", "distinguish": "Sanitation is key."}, {"n": 28, "stem": "Campylobacter is", "opts": ["Gram-positive", "Curved or S-shaped, microaerophilic, oxidase positive", "Straight aerobe", "Spore-forming"], "key": 1, "exp": "Trigger: \"curved or S-shaped, slender Gram-negative rods... microaerophilic (5% O2 and 10% CO2)... oxidase positive\".", "src": "Theory book PDF 89 (printed 82)", "cue": "Campylobacter", "ask": "Campylobacter is", "distinguish": "Single polar flagellum."}, {"n": 29, "stem": "Campylobacter grows at", "opts": ["25 C aerobically", "37 C anaerobically", "42 C (thermophilic) for 2 days in microaerophilic atmosphere", "55 C"], "key": 2, "exp": "Trigger: \"incubated in microaerophilic atmosphere at 42 C (thermophilic) for 2 days\".", "src": "Theory book PDF 89 (printed 82)", "cue": "42 C", "ask": "Campylobacter grows at", "distinguish": "H. pylori at 37 C for 3-6 days."}, {"n": 30, "stem": "Selective medium for C. jejuni is", "opts": ["TCBS", "XLD", "MacConkey", "Skirrow's medium (blood agar + antibiotics)"], "key": 3, "exp": "Trigger: \"Skirrow's medium which is blood agar that is rendered selective by addition of antibiotics\".", "src": "Theory book PDF 89 (printed 82)", "cue": "Skirrow", "ask": "Selective medium for C. jejuni is", "distinguish": "Also used for H. pylori."}, {"n": 31, "stem": "Campylobacter enteritis mainly affects", "opts": ["Pregnant women only", "Children under 5 years and young adults", "Elderly", "Infants under 1 month"], "key": 1, "exp": "Trigger: \"enteritis that affects mainly children under 5 years and young adults\".", "src": "Theory book PDF 89 (printed 82)", "cue": "age group", "ask": "Campylobacter enteritis mainly affects", "distinguish": "Poultry source."}, {"n": 32, "stem": "Common sources of Campylobacter include", "opts": ["Honey", "Poultry, raw milk, meat and sick kittens/puppies", "Stored blood", "Canned food"], "key": 1, "exp": "Trigger: \"poultry, raw milk, meat, fruits and vegetables. Exposure to sick kittens and puppies\".", "src": "Theory book PDF 90 (printed 83)", "cue": "sources", "ask": "Common sources of Campylobacter include", "distinguish": "Fecal-oral."}, {"n": 33, "stem": "Campylobacter enteritis incubation", "opts": ["12-48 hours", "2-5 days", "1-4 days", "1-2 weeks"], "key": 1, "exp": "Trigger: \"The incubation period is 2-5 days\".", "src": "Theory book PDF 90 (printed 83)", "cue": "incubation", "ask": "Campylobacter enteritis incubation", "distinguish": "Illness lasts 7-10 days."}, {"n": 34, "stem": "Campylobacter infection is complicated by", "opts": ["HUS", "Guillain-Barre syndrome, reactive arthritis, Reiter's disease", "Rheumatic fever", "Toxic megacolon"], "key": 1, "exp": "Trigger: \"Guillain-Barre syndrome, reactive arthritis, Reiter's disease\".", "src": "Theory book PDF 90 (printed 83)", "cue": "complications", "ask": "Campylobacter infection is complicated by", "distinguish": "GBS: cross-reacting antibodies."}, {"n": 35, "stem": "Reiter's disease triad is", "opts": ["Tenesmus, cramps, bloody stool", "Trismus, spasm, fever", "Fever, rash, lymphadenopathy", "Arthritis, conjunctivitis, urethritis"], "key": 3, "exp": "Trigger: \"Reiter's disease: triad of arthritis, conjunctivitis and urethritis\".", "src": "Theory book PDF 90 (printed 83)", "cue": "Reiter", "ask": "Reiter's disease triad is", "distinguish": "Complication of Campylobacter."}, {"n": 36, "stem": "Presumptive diagnosis of Campylobacter is", "opts": ["Curved organisms with darting motility in a stool wet mount", "Blood culture", "Widal", "Cholera red"], "key": 0, "exp": "Trigger: \"finding curved organisms with rapid darting motility in a wet mount of faeces\".", "src": "Theory book PDF 90 (printed 83)", "cue": "wet mount", "ask": "Presumptive diagnosis of Campylobacter is", "distinguish": "Culture on Skirrow."}, {"n": 37, "stem": "The antibiotic of choice for Campylobacter is", "opts": ["Ceftriaxone", "Streptomycin", "Penicillin", "Erythromycin"], "key": 3, "exp": "Trigger: \"Erythromycin is the antibiotic of choice\".", "src": "Theory book PDF 90 (printed 83)", "cue": "erythromycin", "ask": "The antibiotic of choice for Campylobacter is", "distinguish": "Fluids main therapy."}, {"n": 38, "stem": "H. pylori differs from Campylobacter by", "opts": ["No flagella", "Peritrichous flagella", "A single unsheathed polar flagellum", "Multiple sheathed monopolar flagella"], "key": 3, "exp": "Trigger: \"multiple sheathed monopolar flagellae while campylobacter has const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
