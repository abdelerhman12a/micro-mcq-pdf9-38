const Q=[{"n": 1, "img": null, "kind": "mechanism/rationale", "stem": "A wet granular necrotic ulcer with prominent borders is found in the perianal skin. What is its relation to bowel disease?", "opts": ["A bacillary dysentery lesion", "A fungal infection of the skin", "A complication of intestinal amoebiasis", "Acanthamoeba spread through abrasions"], "key": 2, "exp": "Trigger words: \"Cutaneous amoebiasis is a complication of intestinal amoebiasis ... wet granular necrotic ulcer with prominent borders\".", "src": "PDF 360 (printed 352)"}, {"n": 2, "img": null, "kind": "key differentiator", "stem": "A patient has up to 20 or more loose bloody evacuations a day, severe and rapid in onset. Which intestinal form is it, and how does it differ from the form with tenesmus and blood and mucus?", "opts": ["Fulminating colitis, far more frequent motions than acute dysentery", "Symptomatic non-dysenteric amoebiasis, with blood", "Acute dysentery, far more frequent motions than fulminating colitis", "Amoeboma, with a painful mass instead of loose stools"], "key": 0, "exp": "Trigger words: \"Fulminating amoebic colitis: Severe rapidly characterized by frequent evacuations up to (20 or more in one day)\".", "src": "PDF 358 (printed 350)"}, {"n": 3, "img": null, "kind": "mechanism/rationale", "stem": "A patient has hepatomegaly, liver pain and fever. The abscess centre is chocolate-coloured. What does it consist of?", "opts": ["Lymphocytes and fibrin", "Lysed hepatocytes, erythrocytes, bile and fat", "Caseous tissue and giant cells", "Pus cells and bacteria"], "key": 1, "exp": "Trigger words: \"chocolate-colored necrotic tissues, consisting of lysed hepatocytes, erythrocytes, bile, and fat\".", "src": "PDF 359 (printed 351)"}, {"n": 4, "img": null, "kind": "vignette: stage/host", "stem": "A contact lens wearer who sleeps with the lenses in has an eye infection. By how much does the source say the risk rises, and which routine habit does it advise to protect the eyes?", "opts": ["Up to 8 times greater risk; do not sleep in the lenses", "Up to 8 times greater risk; rinse lenses with tap water first", "Up to 4 times greater risk; clean lenses with saliva", "Up to 2 times greater risk; sleep only with a backup pair"], "key": 0, "exp": "Trigger words: \"Sleeping while wearing contact lenses has been shown to cause up to 8 times greater risk of an eye infection\".", "src": "PDF 368 (printed 360)"}, {"n": 5, "img": null, "kind": "key differentiator", "stem": "A lens wearer has the sensation of something in the eye, pain, redness, blurred vision, light sensitivity and excessive tearing. Which keratitis is this, and what may it cause?", "opts": ["Acanthamoeba keratitis; permanent vision loss or blindness", "Naegleria keratitis; transient visual haze", "Entamoeba keratitis; permanent skin scarring", "Acanthamoeba keratitis; progressive deafness"], "key": 0, "exp": "Trigger words: \"Symptoms of AK include: Sensation of something in the eye, eye pain, eye redness, blurred vision, sensitivity to light, excessive tearing\"; \"can cause permanent vision loss or blindness\".", "src": "PDF 367 (printed 359)"}, {"n": 6, "img": null, "kind": "mechanism/rationale", "stem": "A debilitated patient has Acanthamoeba GAE. What does the source say about treatment in such individuals?", "opts": ["Metronidazole cures the disease", "Amphotericin B cures the disease", "Propamidine with neomycin cures the disease", "No effective treatment in debilitating individuals"], "key": 3, "exp": "Trigger words: \"No effective treatment in debilitating individuals\".", "src": "PDF 366 (printed 358)"}, {"n": 7, "img": null, "kind": "treatment/protocol", "stem": "A patient has Acanthamoeba keratitis. How is the diagnosis usually made?", "opts": ["By serology in a field survey", "By CSF examination for trophozoites", "By stool examination for cysts", "By an eye specialist, using symptoms, amoeba growth from a scraping, or confocal microscopy"], "key": 3, "exp": "Trigger words: \"usually diagnosed by an eye specialist based on symptoms, growth of the ameba from a scraping of the eye, and/or ... confocal microscopy\".", "src": "PDF 368 (printed 360)"}, {"n": 8, "img": null, "kind": "key differentiator", "stem": "Two morphologically identical amoebae are found; one is pathogenic. How are they separated?", "opts": ["By iodine staining of the cyst", "By the string test", "By concentration of the stool", "By isoenzyme analysis, monoclonal antibodies or DNA technology"], "key": 3, "exp": "Trigger words: \"E. histolytica should be differentiated from E. dispar ... by isoenzyme analysis, monoclonal antibodies and DNA technology\".", "src": "PDF 361 (printed 353)"}, {"n": 9, "img": null, "kind": "vignette: stage/host", "stem": "A resident of a low socio-economic community has diarrhoea with tenesmus, blood and mucus. Which stage did he swallow, and which host is the only host?", "opts": ["Quadri-nucleated cyst; man, with no animal reservoir", "Flagellated form; man, with no animal reservoir", "Quadri-nucleated cyst; man, with dogs as reservoir", "Trophozoite; man, with the pig as reservoir"], "key": 0, "exp": "Trigger words: \"Infective stage: The quadri-nucleated cyst\"; \"Man is the only host ... no animal reservoirs\".", "src": "PDF 357 (printed 349)"}, {"n": 10, "img": null, "kind": "key differentiator", "stem": "Two free-living amoebae are compared: one has 3 stages including a flagellated form, the other has only 2. Which pairing is correct?", "opts": ["Acanthamoeba has 3 stages; Naegleria has 2", "Both have 3 stages", "Naegleria has 3 stages; Acanthamoeba has 2", "Both have 2 stages"], "key": 2, "exp": "Trigger words: \"N.fowleri has 3 stages\"; Acanthamoeba \"has only 2 stages: cysts and trophozoites\".", "src": "PDF 364 (printed 356)"}, {"n": 11, "img": null, "kind": "treatment/protocol", "stem": "A patient with an amoebic liver abscess is considered for needle aspiration or surgical drainage. When is it indicated?", "opts": ["Only in large abscesses with a high probability of rupture", "In every abscess before drug treatment", "Only in abscesses with positive stool cysts", "In all patients with hepatomegaly"], "key": 0, "exp": "Trigger words: \"Drainage of liver abscess ... is only indicated in large abscesses with a high probability of rupture\".", "src": "PDF 361 (printed 353)"}, {"n": 12, "img": null, "kind": "mechanism/rationale", "stem": "A patient with a liver abscess develops chest pain, cough and trophozoites in the sputum. How did the lung become involved?", "opts": ["Swallowing cysts that reached the bronchi", "Direct extension of the hepatic lesion across the diaphragm", "Spread through the bile duct", "Direct inhalation of cysts in the lower tract"], "key": 1, "exp": "Trigger words: \"Pulmonary infection usually results from direct extension of hepatic lesion across the diaphragm\".", "src": "PDF 360 (printed 352)"}, {"n": 13, "img": null, "kind": "mechanism/rationale", "stem": "A colon ulcer shows little or no inflammation between lesions, with raised edges. How is the early lesion described?", "opts": ["A sheet of mucosal necrosis from toxin", "A wet granular ulcer with prominent borders", "A small area of necrosis with raised edges", "A serpiginous ulcer with severe inflammation"], "key": 2, "exp": "Trigger words: \"The early lesion is a small area of necrosis or ulcer characterized by raised edges but little or no inflammation between the lesions\".", "src": "PDF 358 (printed 350)"}, {"n": 14, "img": null, "kind": "treatment/protocol", "stem": "A contact lens wearer with Acanthamoeba keratitis is treated. Which treatment is listed, and what follows if necessary?", "opts": ["Metronidazole; drainage", "Propamidine with neomycin; steroids", "Propamidine with neomycin; keratoplasty", "Amphotericin B; keratoplasty"], "key": 2, "exp": "Trigger words: \"Keratitis: Propamidine + neomycin, followed by Keratoplasty if necessary\".", "src": "PDF 366 (printed 358)"}, {"n": 15, "img": null, "kind": "key differentiator", "stem": "An eye specialist must confirm Acanthamoeba keratitis. Which findings does the source accept for diagnosis?", "opts": ["Symptoms, growth of the ameba from an eye scraping, confocal microscopy, or trophozoite/cyst in biopsy or culture", "Microfilariae in night blood and an ICT card test only", "Motile flagellates in a vaginal swab only", "Cysts in a formed stool and a liver ultrasound only"], "key": 0, "exp": "Trigger words: \"growth of the ameba from a scraping of the eye\"; \"confocal microscopy\"; \"trophozoite / cyst in biopsy specimens\".", "src": "PDF 368 (printed 360)"}, {"n": 16, "img": null, "kind": "treatment/protocol", "stem": "A contact lens wearer asks how to wash hands and how to store lenses safely. Which advice does the source give?", "opts": ["Wash hands with soap and dry well before handling lenses; remove lenses before swimming or showering", "Sleep in lenses; dry hands in air", "Rinse lenses with tap water; keep lenses in while showering", "Use saliva to clean; keep lenses in while swimming"], "key": 0, "exp": "Trigger words: \"Wash Your Hands ... Dry your hands well\"; \"Remove contact lenses before swimming and avoid showering in them\".", "src": "PDF 368 (printed 360)"}, {"n": 17, "img": null, "kind": "key differentiator", "stem": "A swimmer has meningoencephalitis, and a contact lens wearer has keratitis. Which amoeba causes each?", "opts": ["Naegleria fowleri; Acanthamoeba", "Naegleria fowleri; Entamoeba coli", "Entamoeba histolytica; Acanthamoeba", "Acanthamoeba; Naegleria fowleri"], "key": 0, "exp": "Trigger words: Naegleria \"swimming in fresh water ... primary amebic meningoencephalitis\"; Acanthamoeba \"severe keratitis ... contact lenses wearers\".", "src": "PDF 363 (printed 355)"}, {"n": 18, "img": null, "kind": "mechanism/rationale", "stem": "A patient has disturbed taste and smell and extensive brain destruction. Which route explains the smell and taste signs?", "opts": ["Cysts blocking the nasal passage", "Toxin damage to the optic nerve", "Immune complexes in the tongue", "Passage of the amoeba through the olfactory epithelium and nerve"], "key": 3, "exp": "Trigger words: \"olfactory epithelium, cribriform plate, olfactory nerve, brain\"; \"disturbance in taste & smell\".", "src": "PDF 364 (printed 356)"}, {"n": 19, "img": null, "kind": "treatment/protocol", "stem": "A cyst passer with no symptoms is to be treated. Which group of drugs and which examples?", "opts": ["Tissue drugs: metronidazole or tinidazole", "Propamidine with neomycin", "Luminal drugs: iodoquinol, diloxanide furoate or paromomycin", "Amphotericin B, intravenous"], "key": 2, "exp": "Trigger words: \"Asymptomatic cyst passers: luminal drugs ... iodoquinol, diloxanide furoate, or paromomycin\".", "src": "PDF 361 (printed 353)"}, {"n": 20, "img": null, "kind": "treatment/protocol", "stem": "Sigmoidoscopy of a dysentery patient shows characteristic lesions. What does it demonstrate, and what is taken from them?", "opts": ["Flask-shaped ulcers; a serum sample only", "Flask-shaped ulcers; an aspirate or biopsy", "Raised plaques; a sputum sample", "Serpiginous ulcers; a stool culture"], "key": 1, "exp": "Trigger words: \"Sigmoidoscopy to demonstrate characteristic lesions (flask shape ulcer) and take aspirate or biopsy from these lesions\".", "src": "PDF 360 (printed 352)"}, {"n": 21, "img": null, "kind": "key differentiator", "stem": "A patient has diarrhoea with abdominal colic, nausea and mucus but no blood. Which intestinal form is this, and which is the form with blood and tenesmus?", "opts": ["Acute dysentery; non-dysenteric", "Asymptomatic; fulminating colitis", "Fulminating colitis; amoeboma", "Symptomatic non-dysenteric; acute amoebic dysentery"], "key": 3, "exp": "Trigger words: \"Symptomatic non dysenteric amoebiasis ... mucous but no blood\"; \"Acute amoebic dysentery: tenesmus ... with blood and mucous\".", "src": "PDF 358 (printed 350)"}, {"n": 22, "img": null, "kind": "treatment/protocol", "stem": "A contact lens wearer sleeps in lenses and rinses them with tap water. Which two practices are listed as risks and how should lenses be cleaned?", "opts": ["Sleeping in lenses and tap water; clean with disinfecting solution, never water or saliva", "Eating raw vegetables; clean with tap water", "Contact with pigs; clean with saliva", "Swimming in a river; clean with homemade solutions"], "key": 0, "exp": "Trigger words: \"Don't Sleep in Your Contact Lenses\"; \"using tap water or homemade solutions\"; \"never water or saliva\".", "src": "PDF 368 (printed 360)"}, {"n": 23, "img": null, "kind": "treatment/protocol", "stem": "A patient has sudden fever, headache, vomiting, neck stiffness and disturbed taste and smell after swimming. Which drug is given, and which specimen shows the trophozoite?", "opts": ["Propamidine with neomycin; corneal scraping", "Amphotericin B, oral; sputum", "Amphotericin B, intravenous or intrathecal; CSF", "Metronidazole; stool"], "key": 2, "exp": "Trigger words: \"Finding trophozoite in CSF, or in the brain section\"; \"Amphotericin B IV or intrathecal\".", "src": "PDF 364 (printed 356)"}, {"n": 24, "img": "363-002", "kind": "vignette: stage/host", "stem": "The diagram shows an amoeba that transforms into a flagellate and a swimmer whose infective form enters through the nose. Which stage infects and which stage is not seen in brain tissue?", "opts": ["Cyst infects; trophozoites are not seen in brain tissue", "Trophozoite infects; flagellated forms are always seen in tissue", "Trophozoite infects; cysts are not seen in brain tissue", "Flagellated form infects; trophozoites are not seen"], "key": 2, "exp": "Trigger words: \"Infective stage: trophozoite (amoeboid form)\"; \"Cysts are not seen in brain tissues\".", "src": "PDF 363 (printed 355), figure"}, {"n": 25, "img": null, "kind": "treatment/protocol", "stem": "Which method gives a very sensitive but difficult stool diagnosis in amoebiasis, and which method uses monoclonal antib allowed with water"], "key": 1, "exp": "Trigger words: \"organisms contained in water or contact lens solution enter the eye through small scrapes\"; \"showering while wearing lenses\".", "src": "PDF 367 (printed 359)"}, {"n": 29, "img": null, "kind": "key differentiator", "stem": "E. coli is compared with E. histolytica. Which statement is correct?", "opts": ["E. coli causes liver abscess", "E. coli forms flask-shaped ulcers", "E. coli trophozoites invade the wall, pathogenic", "E. coli trophozoites stay in the lumen, non-pathogenic"], "key": 3, "exp": "Trigger words: E. coli \"Trophozoite is restricted to the intestinal lumen ... Non-pathogenic\".", "src": "PDF 362 (printed 354)"}, {"n": 30, "img": null, "kind": "vignette: stage/host", "stem": "A food handler with no symptoms passes cysts and infects customers. Which routes of infection does the source list that fit this scenario?", "opts": ["Pig excreta and swimming in fresh water", "Infected food handlers and swallowing cysts in contaminated food or water", "Mosquito bite and sexual contact", "Skin penetration and contact lens wear"], "key": 1, "exp": "Trigger words: \"Asymptomatic cases passing cysts in feces\"; \"Infected food handlers\"; \"swallowing the cyst in contaminated food or water\".", "src": "PDF 358 (printed 350)"}, {"n": 31, "img": null, "kind": "vector/transmission", "stem": "Where do Naegleria fowleri and Acanthamoeba live, respectively?", "opts": ["Naegleria: fresh water, soil, heated pools; Acanthamoeba: soil, water, lens solution, air conditioners", "Both live only in the pig intestine", "Both live in the human colon", "Naegleria: lens solution, air conditioners; Acanthamoeba: heated pools"], "key": 0, "exp": "Trigger words: Naegleria \"fresh water, soil, heated swimming pools, aquariums\"; Acanthamoeba \"soil, water, contact lens solution, air conditions, physiotherapy pools\".", "src": "PDF 362 (printed 354)"}, {"n": 32, "img": null, "kind": "treatment/protocol", "stem": "A patient with an u  const un=order.length-Object.keys(ans).length;

 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
