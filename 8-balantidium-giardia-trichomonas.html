const Q=[{"n": 1, "img": null, "kind": "mechanism/rationale", "stem": "A patient has periods of diarrhoea alternating with constipation, while another has passage of blood and mucus. Which forms of balantidiasis are these, respectively?", "opts": ["Acute, then chronic", "Chronic, then acute", "Asymptomatic, then chronic", "Both acute"], "key": 1, "exp": "Trigger words: \"Acute cases: dysentery with the passage of blood and mucous\"; \"Chronic cases: periods of diarrhea alternating with constipation\".", "src": "PDF 370 (printed 362)"}, {"n": 2, "img": null, "kind": "vignette: stage/host", "stem": "A woman with multiple sexual partners has a purulent, foul-smelling vaginal discharge and a strawberry-like cervix. Which stage is infective, and does a cyst stage exist?", "opts": ["The trophozoite; no cyst stage exists", "The trophozoite; a cyst stage exists", "The cyst; no trophozoite is found", "The cyst; a cyst stage exists"], "key": 0, "exp": "Trigger words: \"Infective stage: Trophozoite\"; \"Exit (diagnostic) stage: Trophozoite (no cyst stage)\"; \"strawberry-like appearance\".", "src": "PDF 374 (printed 366)"}, {"n": 3, "img": null, "kind": "vignette: stage/host", "stem": "A patient swallowed cysts and shows symptoms after an interval. What is the usual prepatent period, and which stage survives outside the host?", "opts": ["Two days; the trophozoite", "Two weeks; the trophozoite", "Two months; the cyst", "Two weeks; the cyst"], "key": 3, "exp": "Trigger words: \"The prepatent period is usually two weeks\"; \"The cyst ... the only form that can survive outside the human body\".", "src": "PDF 372 (printed 364)"}, {"n": 4, "img": "371-006", "kind": "vignette: stage/host", "stem": "The diagram shows a flagellate whose stage in a pictured source is swallowed, and trophozoites passed in stool that do not survive outside. Which stage is infective, and which is the only one surviving in the environment?", "opts": ["The cyst is infective and is the one that survives", "The cyst is infective but the trophozoite survives", "The trophozoite is infective and survives", "The trophozoite is infective but the cyst does not survive"], "key": 0, "exp": "Trigger words: \"Trophozoites are also passed in stool but they do not survive in the environment\"; \"the cyst ... only form that can survive outside the human body\".", "src": "PDF 371 (printed 363), life-cycle figure"}, {"n": 5, "img": null, "kind": "mechanism/rationale", "stem": "A technologist asks why three stool examinations are recommended in suspected giardiasis. What is the reason?", "opts": ["The trophozoites invade the mucosa", "Bile destroys the parasite in the stool", "The cysts die within hours", "The parasite is shed intermittently"], "key": 3, "exp": "Trigger words: \"Repeated stools examination for three times is recommended as the parasite is intermittently shed\".", "src": "PDF 373 (printed 365)"}, {"n": 6, "img": null, "kind": "mechanism/rationale", "stem": "A woman has vaginitis, and punctate haemorrhages of the cervix. What appearance results?", "opts": ["Elephantoid vulvar skin", "Flask-shaped ulcers of the vagina", "Chocolate-coloured necrosis of the cervix", "A strawberry-like cervix"], "key": 3, "exp": "Trigger words: \"punctate haemorrages of the cervix may result in strawberry -like appearance\".", "src": "PDF 375 (printed 367)"}, {"n": 7, "img": null, "kind": "vignette: stage/host", "stem": "A stool sample from a patient in Central and South America shows the largest protozoan parasite of man. Which stages may be diagnostic, and in which organ does it live?", "opts": ["Trophozoite only; the large intestine", "Cyst only; the small intestine", "Cyst or trophozoite; the duodenum and jejunum", "Cyst or trophozoite; the large intestine"], "key": 3, "exp": "Trigger words: \"largest protozoan human parasite\"; \"Diagnostic stage: Cyst or trophozoite\"; \"Habitat: Large intestine\".", "src": "PDF 369 (printed 361)"}, {"n": 8, "img": null, "kind": "treatment/protocol", "s
