const IMG={};
const Q=[{"n": 1, "img": null, "kind": "double-clue", "stem": "Which organism is a pale non-motile lactose non-fermenter that makes no H2S and no gas?", "opts": ["Salmonella species", "Escherichia coli", "Klebsiella pneumoniae", "Shigella species"], "key": 3, "exp": "Answer: Shigella species. Book trigger: \"Shigella is distinguished from Salmonella by 3 criteria\".", "src": "PDF 78 (printed 71)"}, {"n": 2, "img": null, "kind": "double-clue", "stem": "Which non-motile Gram-negative bacillus is a strict human pathogen and can cause disease after ingestion of about 100 organisms?", "opts": ["Shigella species", "Yersinia enterocolitica", "Escherichia coli ETEC", "Salmonella Typhi"], "key": 0, "exp": "Answer: Shigella species. Book trigger: \"Ingestion of few organisms (~ 100 organisms)\".", "src": "PDF 78 (printed 71)"}, {"n": 3, "img": null, "kind": "double-clue", "stem": "Which Salmonella has humans as the only reservoir and may carry the Vi antigen?", "opts": ["S. Enteritidis", "S. Choleraesuis", "S. Typhi", "S. Typhimurium"], "key": 2, "exp": "Answer: S. Typhi. Book trigger: \"Humans are the only reservoir, either patients or healthy carriers\".", "src": "PDF 72 (printed 65)"}, {"n": 4, "img": null, "kind": "association", "stem": "Which diarrheagenic E. coli type causes infantile watery diarrhea through tight adherence to the mucosa?", "opts": ["ETEC", "EPEC", "EHEC", "EIEC"], "key": 1, "exp": "Answer: EPEC. Book trigger: \"Tight adherence to intestinal mucosa\".", "src": "PDF 66 (printed 59)"}, {"n": 5, "img": null, "kind": "definition", "stem": "In the Widal test, the highest serum dilution that still gives agglutination is called the:", "opts": ["Reagin titer", "Prozone titer", "Cut-off index", "End titer"], "key": 3, "exp": "Answer: End titer. Book trigger: \"The highest dilution of the serum which gives agglutination is the end titer\".", "src": "PDF 74 (printed 67)"}, {"n": 6, "img": null, "kind": "association", "stem": "At which temperature are Y. pestis colonies read after 24 h incubation?", "opts": ["37°C", "25°C", "4°C", "42°C"], "key": 1, "exp": "Answer: 25°C. Book trigger: \"after 24 h incubation at 25°C\".", "src": "PDF 80 (printed 73)"}, {"n": 7, "img": null, "kind": "sequence", "stem": "How is a stool sample processed for Salmonella?", "opts": ["Selenite or tetrathionate broth overnight, then subculture on MacConkey or DCA, then identification", "Blood agar first, then tetrathionate broth, then Widal test", "MacConkey agar first, then selenite broth, then identification", "DCA agar first, then clot culture, then slide agglutination"], "key": 0, "exp": "Answer: Selenite or tetrathionate broth overnight, then subculture on MacConkey or DCA, then identification. Book trigger: \"inoculated first in selenite broth or tetrathionate\".", "src": "PDF 73 (printed 66)"}, {"n": 8, "img": null, "kind": "association", "stem": "Which incubation period belongs to Salmonella food poisoning?", "opts": ["1 – 5 hours", "1 – 4 days", "12 – 48 hours", "8 – 24 hours"], "key": 2, "exp": "Answer: 12 – 48 hours. Book trigger: \"Incubation period: 12 – 48 hours\".", "src": "PDF 76 (printed 69)"}, {"n": 9, "img": null, "kind": "definition", "stem": "A four-fold rise in titer in a second serum sample taken one week after the first is called:", "opts": ["A community titer", "A prozone titer", "An end titer", "A rising titer"], "key": 3, "exp": "Answer: A rising titer. Book trigger: \"For proper interpretation a rising titer is measured\".", "src": "PDF 74 (printed 67)"}, {"n": 10, "img": null, "kind": "sequence", "stem": "Which sequence of specimens is correct in the laboratory diagnosis of enteric fever?", "opts": ["Stool culture in week 1, then blood culture and bone marrow from week 2", "Widal test in week 1, then blood culture only from week 2", "Blood or bone marrow culture in week 1, then stool, urine and Widal from week 2", "Urine culture in week 1, then Widal test only from week 2"], "key": 2, "exp": "Answer: Blood or bone marrow culture in week 1, then stool, urine and Widal from week 2. Book trigger: \"During the first week of fever\".", "src": "PDF 73 (printed 66)"}, {"n": 11, "img": null, "kind": "clinical case", "stem": "A man got typhoid after eating raw shellfish. Which route of transmission explains this?", "opts": ["Respiratory droplets", "Faeco-oral route", "Flea bite", "Direct skin contact"], "key": 1, "exp": "Answer: Faeco-oral route. Book trigger: \"The infection is transmitted faeco-oral through contaminated food or drinks\".", "src": "PDF 72 (printed 65)"}, {"n": 12, "img": null, "kind": "definition", "stem": "In endemic areas, Widal titers of 1/80 or less due to repeated subclinical exposure are called the:", "opts": ["Community titer", "Cut-off titer", "End titer", "Rising titer"], "key": 0, "exp": "Answer: Community titer. Book trigger: \"(community titer)\".", "src": "PDF 74 (printed 67)"}, {"n": 13, "img": null, "kind": "definition", "stem": "A generalized infection of the reticuloendothelial system with bacteraemia and sustained fever is called:", "opts": ["Enteric fever", "Bacillary dysentery", "Septicaemic plague", "Salmonella gastroenteritis"], "key": 0, "exp": "Answer: Enteric fever. Book trigger: \"Enteric fever is a generalized infection of the reticuloendothelial system\".", "src": "PDF 71 (printed 64)"}, {"n": 14, "img": null, "kind": "double-clue", "stem": "Which toxin acts as an enterotoxin, a cytotoxin and a neurotoxin, and is like EHEC verotoxin?", "opts": ["Exotoxin A of Pseudomonas aeruginosa", "Pertussis toxin of Bordetella species", "Shiga toxin of S. dysenteriae type 1", "Heat-stable enterotoxin of ETEC strains"], "key": 2, "exp": "Answer: Shiga toxin of S. dysenteriae type 1. Book trigger: \"enterotoxin (watery diarrhea in early cases), cytotoxin\".", "src": "PDF 77 (printed 70)"}, {"n": 15, "img": null, "kind": "clinical case", "stem": "A patient has a flea bite and a Gram-negative coccobacillus with bipolar staining in the aspirate. Which drug is of choice?", "opts": ["Erythromycin", "Streptomycin", "Ampicillin", "Penicillin G"], "key": 1, "exp": "Answer: Streptomycin. Book trigger: \"Streptomycin (aminoglycosides) is the drug of choice\".", "src": "PDF 82 (printed 75)"}, {"n": 16, "img": null, "kind": "definition", "stem": "A Gram-negative coccobacillus with bipolar staining giving a \"closed safety pin\" appearance is:", "opts": ["Salmonella Typhi", "Shigella sonnei", "Klebsiella pneumoniae", "Yersinia pestis"], "key": 3, "exp": "Answer: Yersinia pestis. Book trigger: \"closed safety pin\".", "src": "PDF 80 (printed 73)"}, {"n": 17, "img": null, "kind": "sequence", "stem": "Which sequence describes shigellosis?", "opts": ["Ingestion of about 100 organisms, bloodstream invasion, small bloody mucoid stools, mucosal invasion of colon", "Mucosal invasion of terminal ileum and colon, ingestion of about 100 organisms, bloodstream invasion, spontaneous recovery", "Ingestion of about 100 organisms, mucosal invasion of terminal ileum and colon, small bloody mucoid stools, spontaneous recovery", "Small bloody mucoid stools, ingestion of about 100 organisms, mucosal invasion of colon, spontaneous recovery"], "key": 2, "exp": "Answer: Ingestion of about 100 organisms, mucosal invasion of terminal ileum and colon, small bloody mucoid stools, spontaneous recovery. Book trigger: \"The essential pathogenic process is invasion of mucosa\".", "src": "PDF 77 (printed 70)"}, {"n": 18, "img": null, "kind": "clinical case", "stem": "A man bitten by a flea develops pain and swelling of the lymph nodes draining the bite. Which form of plague is this?", "opts": ["Septicaemic plague", "Bubonic plague", "Yersiniosis", "Pneumonic plague"], "key": 1, "exp": "Answer: Bubonic plague. Book trigger: \"pain and swelling of the lymph nodes draining the site of the flea bite\".", "src": "PDF 80 (printed 73)"}, {"n": 19, "img": null, "kind": "clinical case", "stem": "A food handler is suspected to be a urinary carrier of S. Typhi. How is the carrier diagnosed?", "opts": ["Repeated urine cultures, since excretion is intermittent", "A single Widal test with a high H titer", "A single blood culture in the first week", "A single stool culture after a saline purge"], "key": 0, "exp": "Answer: Repeated urine cultures, since excretion is intermittent. Book trigger: \"Urinary carriers are diagnosed by isolating the organism from the urine\".", "src": "PDF 75 (printed 68)"}, {"n": 20, "img": null, "kind": "double-clue", "stem": "Which organism has bipolar staining and forms pinpoint colonies after 24 h at 25°C?", "opts": ["Klebsiella pneumoniae", "Yersinia enterocolitica", "Salmonella Typhi", "Yersinia pestis"], "key": 3, "exp": "Answer: Yersinia pestis. Book trigger: \"forming small pinpoint (lactose-nonfermenting) colonies after 24 h incubation at 25°C\".", "src": "PDF 80 (printed 73)"}, {"n": 21, "img": null, "kind": "clinical case", "stem": "A child has bloody diarrhea after eating an undercooked hamburger, then develops renal failure. Which E. coli type and complication fit?", "opts": ["EHEC with hemolytic uremic syndrome", "EPEC with infantile diarrhea", "EIEC with neonatal meningitis", "ETEC with traveler's diarrhea"], "key": 0, "exp": "Answer: EHEC with hemolytic uremic syndrome. Book trigger: \"Haemolytic\".", "src": "PDF 66 (printed 59)"}, {"n": 22, "img": null, "kind": "definition", "stem": "Painful straining to pass stools is called:", "opts": ["Steatorrhea", "Melena", "Tenesmus", "Dysphagia"], "key": 2, "exp": "Answer: Tenesmus. Book trigger: \"painful straining to pass stools (tenesmus)\".", "src": "PDF 78 (printed 71)"}, {"n": 23, "img": null, "kind": "sequence", "stem": "How is a stool sample processed for Shigella?", "opts": ["DCA agar first, then enrichment broth, then Quellung reaction", "Blood agar first, then tetrathionate broth, then Elek test", "MacConkey agar first, then selenite broth, then Widal test", "Enrichment broth, then MacConkey or DCA, then slide agglutination"], "key": 3, "exp": "Answer: Enrichment broth, then MacConkey or DCA, then slide agglutination. Book trigger: \"initially inoculated in enrichment broth\".", "src": "PDF 78 (printed 71)"}, {"n": 24, "img": null, "kind": "definition", "stem": "A tube agglutination test designed to detect anti-Salmonella antibody titer in the patient's serum is called:", "opts": ["Nagler's reaction", "Widal test", "Quellung reaction", "Elek's test"], "key": 1, "exp": "Answer: Widal test. Book trigger: \"a tube agglutination test designed to detect anti-salmonella antibodies\".", "src": "PDF 74 (printed 67)"}, {"n": 25, "img": null, "kind": "association", "stem": "What is the source of E. coli causing neonatal meningitis?", "opts": ["The baby's own colonic flora acquired later", "Contaminated milk formula", "Hospital staff hands", "The mother's birth canal"], "key": 3, "exp": "Answer: The mother's birth canal. Book trigger: \"The source of organism is mother's birth canal\".", "src": "PDF 65 (printed 58)"}, {"n": 26, "img": null, "kind": "definition", "stem": "The suffix K in the antigenic classification of E. coli refers to which antigen?", "opts": ["The capsular antigen", "The flagellar antigen", "The fimbrial adhesin antigen", "The somatic cell-wall LPS antigen"], "key": 0, "exp": "Answer: The capsular antigen. Book trigger: \"K (capsular) antigen in capsulated strains\".", "src": "PDF 65 (printed 58)"}, {"n": 27, "img": null, "kind": "except", "stem": "Regarding Y. enterocolitica, all of the following are true EXCEPT:", "opts": ["Disease may resemble acute appendicitis", "It is a rare cause of enterocolitis", "It cannot grow at refrigeration temperatures", "It is transmitted by food contaminated with animal excreta"], "key": 2, "exp": "Answer: It cannot grow at refrigeration temperatures. Book trigger: \"Y. enterocolitica can grow at refrigeration temperatures\".", "src": "PDF 82 (printed 75)"}, {"n": 28, "img": null, "kind": "sequence", "stem": "Which sequence describes the pathogenesis of typhoid fever?", "opts": ["Ingestion, primary bacteremia, Peyer's patch macrophages, gall bladder, secondary bacteremia, RES organs", "Ingestion, Peyer's patch macrophages, primary bacteremia, RES organs, secondary bacteremia, gall bladder", "Ingestion, secondary bacteremia, RES organs, Peyer's patch macrophages, primary bacteremia, gall bladder", "Ingestion, gall bladder, secondary bacteremia, Peyer's patch macrophages, primary bacteremia, RES organs"], "key": 1, "exp": "Answer: Ingestion, Peyer's patch macrophages, primary bacteremia, RES organs, secondary bacteremia, gall bladder. Book trigger: \"taken up by macrophages of the Peyer's patches where they replicate intracellularly\".", "src": "PDF 72 (printed 65)"}, {"n": 29, "img": null, "kind": "except", "stem": "Regarding Shigella biochemical reactions, all of the following are true EXCEPT:", "opts": ["It is H2S negative", "It produces gas on glucose fermentation", "It is urease negative", "S. sonnei is a late lactose fermenter"], "key": 1, "exp": "Answer: It produces gas on glucose fermentation. Book trigger: \"All Shigella are anaerogenic, do not produce gas\".", "src": "PDF 77 (printed 70)"}, {"n": 30, "img": null, "kind": "definition", "stem": "Lactose-fermenting Enterobacteriaceae that live as commensals in the intestine are termed:", "opts": ["Coliform bacilli", "Anthracoid bacilli", "Paracolon bacilli", "Enteric diphtheroids"], "key": 0, "exp": "Answer: Coliform bacilli. Book trigger: \"Termed \"coliform bacilli\"\".", "src": "PDF 64 (printed 57)"}, {"n": 31, "img": null, "kind": "association", "stem": "What is the most common infection caused by Klebsiella?", "opts": ["Neonatal sepsis", "Wound infection", "Pneumonia", "Urinary tract infection"], "key": 3, "exp": "Answer: Urinary tract infection. Book trigger: \"Urinary tract infection: It is the most common infection\".", "src": "PDF 68 (printed 61)"}, {"n": 32, "img": null, "kind": "except", "stem": "Escherichia coli may cause all of the following EXCEPT:", "opts": ["Neonatal meningitis", "Endotoxic shock", "Peptic ulcer", "Urinary tract infection"], "key": 2, "exp": "Answer: Peptic ulcer. Book trigger: \"Diseases caused by E. coli\".", "src": "PDF 65 (printed 58)"}, {"n": 33, "img": null, "kind": "double-clue", "stem": "Which Widal antibodies appear and disappear faster, and which is the only important one in past vaccinated persons?", "opts": ["O antibodies appear faster; anti-H is the important one", "O antibodies appear faster; anti-Vi is the important one", "Vi antibodies appear faster; anti-O is the important one", "H antibodies appear faster; anti-O is the important one"], "key": 0, "exp": "Answer: O antibodies appear faster; anti-H is the important one. Book trigger: \"O antibodies appear and disappear faster than H antibodies\".", "src": "PDF 74 (printed 67)"}, {"n": 34, "img": null, "kind": "except", "stem": "All of the following genera are lactose fermenters EXCEPT:", "opts": ["Klebsiella", "Citrobacter", "Proteus", "Escherichia"], "key": 2, "exp": "Answer: Proteus. Book trigger: \"include Proteus, Salmonella, Shigella\".", "src": "PDF 64 (printed 57)"}, {"n": 35, "img": null, "kind": "except", "stem": "Regarding the laboratory diagnosis of Y. pestis, all of the following are true EXCEPT:", "opts": ["The FA test detects the F1 antigen", "Wayson or Giemsa stain shows bipolar staining", "Lymph node aspirates are used in bubonic plague", "Cultures can be handled safely on an open bench"], "key": 3, "exp": "Answer: Cultures can be handled safely on an open bench. Book trigger: \"must be handled with caution inside biological safety cabinet\".", "src": "PDF 81 (printed 74)"}, {"n": 36, "img": null, "kind": "double-clue", "stem": "Which organism gives mucoid colonies on MacConkey and has the IMVC pattern --++?", "opts": ["Citrobacter species", "Klebsiella pneumoniae", "Salmonella Typhi", "Escherichia coli"], "key": 1, "exp": "Answer: Klebsiella pneumoniae. Book trigger: \"IMVC of K. pneumoniae is (- - + +)\".", "src": "PDF 68 (printed 61)"}, {"n": 37, "img": null, "kind": "association", "stem": "Which drugs are recommended for severe Shigella infection?", "opts": ["Penicillin G and erythromycin", "Vancomycin and metronidazole", "Streptomycin and gentamycin", "Ciprofloxacin and trimethoprim/sulfamethoxazole"], "key": 3, "exp": "Answer: Ciprofloxacin and trimethoprim/sulfamethoxazole. Book trigger: \"Antibiotics are recommended for treatment of severe Shigella infection\".", "src": "PDF 79 (printed 72)"}, {"n": 38, "img": null, "kind": "double-clue", "stem": "Which family is facultative anaerobic, oxidase negative, glucose-fermenting and nitrate-reducing?", "opts": ["Campylobacteraceae", "Vibrionaceae", "Enterobacteriaceae", "Pseudomonadaceae"], "key": 2, "exp": "Answer: Enterobacteriaceae. Book trigger: \"They reduce nitrate to nitrite\".", "src": "PDF 63 (printed 56)"}, {"n": 39, "img": null, "kind": "except", "stem": "The symptoms of enteric fever include all of the following EXCEPT:", "opts": ["Enlarged spleen", "Rice-water stools", "Constipation", "Rose spots on the abdomen"], "key": 1, "exp": "Answer: Rice-water stools. Book trigger: \"constipation, enlarged spleen and rose spots on the abdomen\".", "src": "PDF 73 (printed 66)"}, {"n": 40, "img": null, "kind": "double-clue", "stem": "Which Shigella is in serogroup A, with 13 serotypes, and produces Shiga toxin?", "opts": ["S. dysenteriae", "S. sonnei", "S. boydii", "S. flexneri"], "key": 0, "exp": "Answer: S. dysenteriae. Book trigger: \"Group A: S. dysenteriae (13 serotypes)\".", "src": "PDF 77 (printed 70)"}, {"n": 41, "img": null, "kind": "association", "stem": "Citrobacter differs from E. coli in being:", "opts": ["Citrate positive", "Non-motile", "A lactose non-fermenter", "Indole negative"], "key": 0, "exp": "Answer: Citrate positive. Book trigger: \"like E. coli except in being citrate positive\".", "src": "PDF 69 (printed 62)"}, {"n": 42, "img": null, "kind": "double-clue", "stem": "Which bacterium is one of the most virulent known, with 1-10 organisms causing disease, and is spread between rodents by the rat flea?", "opts": ["Shigella dysenteriae", "Salmonella Typhi", "Klebsiella pneumoniae", "Yersinia pestis"], "key": 3, "exp": "Answer: Yersinia pestis. Book trigger: \"1-10 organisms can cause disease\".", "src": "PDF 80 (printed 73)"}, {"n": 43, "img": null, "kind": "association", "stem": "Which Klebsiella species causes rhinoscleroma, a destructive granuloma of the nose and pharynx?", "opts": ["K. pneumoniae", "K. ozaenae", "K. rhinoscleromatis", "K. oxytoca"], "key": 2, "exp": "Answer: K. rhinoscleromatis. Book trigger: \"rhinoscleromatis is associated with rhinoscleroma\".", "src": "PDF 69 (printed 62)"}, {"n": 44, "img": null, "kind": "clinical case", "stem": "A woman has E. coli cystitis. What is the usual source of the organism?", "opts": ["Contaminated drinking water", "Her own colonic flora", "Her partner's skin", "Raw milk"], "key": 1, "exp": "Answer: Her own colonic flora. Book trigger: \"patient's own colonic flora\".", "src": "PDF 65 (printed 58)"}, {"n": 45, "img": null, "kind": "definition", "stem": "Diarrhea that begins watery and profuse, then becomes small-volume, bloody and mucoid, is called:", "opts": ["Enteric syndrome", "Rice-water syndrome", "Dysentery syndrome", "Choleraic syndrome"], "key": 2, "exp": "Answer: Dysentery syndrome. Book trigger: \"(dysentery syndrome)\".", "src": "PDF 78 (printed 71)"}, {"n": 46, "img": null, "kind": "double-clue", "stem": "Which three criteria distinguish Shigella from Salmonella?", "opts": ["Motile, H2S positive, gas producer", "Non-motile, no H2S, no gas from glucose", "Capsulated, no H2S, gas producer", "Non-motile, H2S positive, gas producer"], "key": 1, "exp": "Answer: Non-motile, no H2S, no gas from glucose. Book trigger: \"Shigella is distinguished from Salmonella by 3 criteria\".", "src": "PDF 78 (printed 71)"}, {"n": 47, "img": null, "kind": "except", "stem": "Regarding S. Typhi on TSI, all of the following are true EXCEPT:", "opts": ["The butt is acidic", "The slant is alkaline", "Black colour develops from H2S", "It produces abundant gas"], "key": 3, "exp": "Answer: It produces abundant gas. Book trigger: \"does not produce any gas\".", "src": "PDF 71 (printed 64)"}, {"n": 48, "img": null, "kind": "definition", "stem": "The disease caused by Y. enterocolitica and Y. pseudotuberculosis is called:", "opts": ["Yersiniosis", "Brucellosis", "Plague", "Shigellosis"], "key": 0, "exp": "Answer: Yersiniosis. Book trigger: \"Disease (yersiniosis)\".", "src": "PDF 82 (printed 75)"}, {"n": 49, "img": null, "kind": "double-clue", "stem": "Which organism shows swarming growth and is urease positive and motile?", "opts": ["Escherichia coli", "Proteus species", "Shigella species", "Klebsiella pneumoniae"], "key": 1, "exp": "Answer: Proteus species. Book trigger: \"Motile pleomorphic Gram-negative bacilli\".", "src": "PDF 79 (printed 72)"}, {"n": 50, "img": null, "kind": "except", "stem": "E. coli (IMVC ++--) is positive for all of the following EXCEPT:", "opts": ["Methyl red reaction", "Indole production", "Citrate utilization", "Lactose fermentation"], "key": 2, "exp": "Answer: Citrate utilization. Book trigger: \"and citrate negative\".", "src": "PDF 64 (printed 57)"}, {"n": 51, "img": null, "kind": "association", "stem": "What is the incubation period of shigellosis?", "opts": ["1-4 days", "12 – 48 hours", "1 – 2 weeks", "2-5 days"], "key": 0, "exp": "Answer: 1-4 days. Book trigger: \"Incubation period: 1-4 days\".", "src": "PDF 78 (printed 71)"}, {"n": 52, "img": null, "kind": "definition", "stem": "The Vi antigen of Salmonella Typhi is a:", "opts": ["Somatic LPS antigen", "Fimbrial adhesin antigen", "Flagellar protein antigen", "Capsular polysaccharide antigen"], "key": 3, "exp": "Answer: Capsular polysaccharide antigen. Book trigger: \"The Vi (capsular polysaccharide) antigen\".", "src": "PDF 71 (printed 64)"}, {"n": 53, "img": null, "kind": "sequence", "stem": "Which sequence best describes the colony identification steps for Salmonella from a subculture?", "opts": ["Colony morphology, microscopy and Gram stain, biochemical reactions, slide agglutination with antisera", "Slide agglutination, colony morphology, biochemical reactions, microscopy and Gram stain", "Microscopy and Gram stain, slide agglutination, colony morphology, biochemical reactions", "Biochemical reactions, slide agglutination, microscopy and Gram stain, colony morphology"], "key": 0, "exp": "Answer: Colony morphology, microscopy and Gram stain, biochemical reactions, slide agglutination with antisera. Book trigger: \"colonies are further identified by\".", "src": "PDF 73 (printed 66)"}, {"n": 54, "img": null, "kind": "except", "stem": "The genera Proteus, Providencia and Morganella share all of the following EXCEPT:", "opts": ["They are Gram-negative bacilli", "They are motile and pleomorphic", "They ferment lactose", "They are urease positive"], "key": 2, "exp": "Answer: They ferment lactose. Book trigger: \"Lactose non-fermenter (LNF)\".", "src": "PDF 79 (printed 72)"}, {"n": 55, "img": null, "kind": "except", "stem": "Regarding Salmonella culture, all of the following are true EXCEPT:", "opts": ["It forms pale colonies on MacConkey and DCA", "It ferments lactose giving rose-pink colonies on MacConkey", "H2S producers give black colonies on SS agar", "Almost all strains are motile"], "key": 1, "exp": "Answer: It ferments lactose giving rose-pink colonies on MacConkey. Book trigger: \"Salmonella grows as pale lactose non-fermenting colonies\".", "src": "PDF 70 (printed 63)"}, {"n": 56, "img": null, "kind": "association", "stem": "Enterobacter differs from Klebsiella in being:", "opts": ["Oxidase positive", "A lactose non-fermenter", "Non-capsulated", "Motile"], "key": 3, "exp": "Answer: Motile. Book trigger: \"like Klebsiella except in being motile\".", "src": "PDF 69 (printed 62)"}, {"n": 57, "img": null, "kind": "clinical case", "stem": "A child with fever, cramps, tenesmus and small bloody mucoid stools needs a test to separate bacillary from amoebic dysentery. Which is used?", "opts": ["Blood culture on bile salt broth", "Direct microscopy of fresh stool", "Urine culture on MacConkey agar", "Widal tube agglutination test"], "key": 1, "exp": "Answer: Direct microscopy of fresh stool. Book trigger: \"Direct microscopy is done to differentiate bacillary from amoebic dysentery\".", "src": "PDF 78 (printed 71)"}, {"n": 58, "img": null, "kind": "clinical case", "stem": "A neonate has Salmonella gastroenteritis. Are antibiotics indicated?", "opts": ["No, since it is always self-limited", "No, since blood culture is positive", "Yes, but only streptomycin", "Yes, because neonates are at risk of septicemia"], "key": 3, "exp": "Answer: Yes, because neonates are at risk of septicemia. Book trigger: \"Antibiotics are indicated only for neonates or persons with chronic diseases\".", "src": "PDF 76 (printed 69)"}, {"n": 59, "img": null, "kind": "association", "stem": "Which complications are listed for enteric fever?", "opts": ["Intestinal hemorrhage and perforation", "Myocarditis and neuritis", "Meningitis and osteomyelitis", "Hemolytic uremic syndrome and colitis"], "key": 0, "exp": "Answer: Intestinal hemorrhage and perforation. Book trigger: \"Complications: include intestinal hemorrhage and perforation\".", "src": "PDF 73 (printed 66)"}, {"n": 60, "img": null, "kind": "sequence", "stem": "Which sequence describes the spread of typhoid after the second bacteremia?", "opts": ["Faecal excretion, gall bladder, blood, return to Peyer's patches", "Gall bladder, blood, faecal excretion in the first week, return to intestine", "Blood, gall bladder, return to intestine in large numbers, faecal excretion in the second week", "Blood, faecal excretion, gall bladder, return to intestine in large numbers"], "key": 2, "exp": "Answer: Blood, gall bladder, return to intestine in large numbers, faecal excretion in the second week. Book trigger: \"From the gall bladder, salmonellae enter the intestine for a second time\".", "src": "PDF 72 (printed 65)"}, {"n": 61, "img": null, "kind": "clinical case", "stem": "A traveler has severe watery diarrhea after a trip abroad. Which E. coli type is responsible?", "opts": ["EIEC", "ETEC", "EHEC", "EPEC"], "key": 1, "exp": "Answer: ETEC. Book trigger: \"Traveler's diarrhea\".", "src": "PDF 66 (printed 59)"}, {"n": 62, "img": null, "kind": "clinical case", "stem": "A man has severe bacillary dysentery. Which antibiotics are recommended?", "opts": ["Vancomycin or metronidazole", "Penicillin G or erythromycin", "Ciprofloxacin or trimethoprim/sulfamethoxazole", "Streptomycin or doxycycline"], "key": 2, "exp": "Answer: Ciprofloxacin or trimethoprim/sulfamethoxazole. Book trigger: \"Antibiotics are recommended for treatment of severe Shigella infection\".", "src": "PDF 79 (printed 72)"}, {"n": 63, "img": null, "kind": "association", "stem": "Which diarrheagenic E. coli type causes persistent watery diarrhea in children through aggregative fimbria?", "opts": ["EIEC", "ETEC", "EHEC", "EaggEC"], "key": 3, "exp": "Answer: EaggEC. Book trigger: \"aggregative fimbria\".", "src": "PDF 66 (printed 59)"}, {"n": 64, "img": null, "kind": "clinical case", "stem": "A patient with recurrent UTI has alkaline urine and kidney stones. The isolate is a motile, swarming, urease-positive bacillus. Which organism is it?", "opts": ["Proteus mirabilis", "Klebsiella pneumoniae", "Escherichia coli", "Shigella flexneri"], "key": 0, "exp": "Answer: Proteus mirabilis. Book trigger: \"Urease hydrolyses the urea in urine to form ammonia\".", "src": "PDF 79 (printed 72)"}, {"n": 65, "img": null, "kind": "association", "stem": "Which drugs are used in chronic carriers of S. Typhi?", "opts": ["Ampicillin or ciprofloxacin", "Erythromycin or tetracycline", "Penicillin G only", "Streptomycin or doxycycline"], "key": 0, "exp": "Answer: Ampicillin or ciprofloxacin. Book trigger: \"Ampicillin or ciprofloxacin should be used in chronic carriers\".", "src": "PDF 75 (printed 68)"}, {"n": 66, "img": null, "kind": "except", "stem": "Regarding Enterobacteriaceae, all of the following are true EXCEPT:", "opts": ["They are facultative anaerobes", "They reduce nitrate to nitrite", "They all ferment glucose", "They are oxidase positive"], "key": 3, "exp": "Answer: They are oxidase positive. Book trigger: \"They are oxidase negative\".", "src": "PDF 63 (printed 56)"}, {"n": 67, "img": null, "kind": "association", "stem": "Which medium is superior to MacConkey and DCA for H2S-producing Salmonella, giving black colonies?", "opts": ["Chocolate agar", "Salmonella-Shigella (SS) agar", "Blood tellurite agar", "Skirrow's medium"], "key": 1, "exp": "Answer: Salmonella-Shigella (SS) agar. Book trigger: \"is superior to MacConkey and DCA media\".", "src": "PDF 70 (printed 63)"}, {"n": 68, "img": null, "kind": "except", "stem": "The typhoidal Salmonella species include all of the following EXCEPT:", "opts": ["S. Typhi", "S. Paratyphi A", "S. Enteritidis", "S. Paratyphi B"], "key": 2, "exp": "Answer: S. Enteritidis. Book trigger: \"Typhoidal species: Salmonella Typhi\".", "src": "PDF 71 (printed 64)"}, {"n": 69, "img": null, "kind": "association", "stem": "Which Salmonella species causes septicaemia with metastatic infections?", "opts": ["S. Paratyphi A", "S. Enteritidis", "S. Typhimurium", "S. Choleraesuis"], "key": 3, "exp": "Answer: S. Choleraesuis. Book trigger: \"S. Choleraesuis that causes septicaemia with metastatic\".", "src": "PDF 71 (printed 64)"}, {"n": 70, "img": null, "kind": "association", "stem": "Which uropathogenic E. coli factor interferes with phagocytosis and enhances the ability to cause pyelonephritis?", "opts": ["Haemolysins", "Fimbrial adhesins", "Capsular (K) antigens", "Shiga toxins"], "key": 2, "exp": "Answer: Capsular (K) antigens. Book trigger: \"interfere with phagocytosis, thereby enhancing\".", "src": "PDF 65 (printed 58)"}, {"n": 71, "img": null, "kind": "association", "stem": "What is the source of E. coli causing urinary tract infection?", "opts": ["The patient's own colonic flora", "Rodents", "The mother's birth canal", "Contaminated water"], "key": 0, "exp": "Answer: The patient's own colonic flora. Book trigger: \"patient's own colonic flora\".", "src": "PDF 65 (printed 58)"}, {"n": 72, "img": null, "kind": "double-clue", "stem": "Which organism gives rose-pink colonies on MacConkey and has the IMVC pattern ++--?", "opts": ["Citrobacter species", "Escherichia coli", "Proteus mirabilis", "Klebsiella pneumoniae"], "key": 1, "exp": "Answer: Escherichia coli. Book trigger: \"rose pink colonies due to lactose fermentation\".", "src": "PDF 64 (printed 57)"}, {"n": 73, "img": null, "kind": "association", "stem": "On triple sugar iron (TSI), E. coli gives:", "opts": ["Alkaline butt and alkaline slant with H2S", "Acidic butt and acidic slant with cracking of the agar", "Acidic butt and alkaline slant with no gas", "Black butt with an alkaline slant and no gas"], "key": 1, "exp": "Answer: Acidic butt and acidic slant with cracking of the agar. Book trigger: \"acidic (yellow) butt & acidic (yellow) slant with cracking of agar due to gas production\".", "src": "PDF 64 (printed 57)"}, {"n": 74, "img": null, "kind": "clinical case", "stem": "A laboratory worker handling a Yersinia culture develops fever, chills, cough and dyspnea. Which specimen is taken?", "opts": ["Stool", "Cerebrospinal fluid", "Lymph node aspirate", "Sputum"], "key": 3, "exp": "Answer: Sputum. Book trigger: \"sputum (pneumonic\".", "src": "PDF 81 (printed 74)"}, {"n": 75, "img": null, "kind": "clinical case", "stem": "In the second week of suspected typhoid, how is stool first processed?", "opts": ["Inoculated in selenite or tetrathionate broth overnight", "Inoculated on blood tellurite agar", "Plated directly on blood agar for 24 h", "Inoculated on Skirrow's medium at 42°C"], "key": 0, "exp": "Answer: Inoculated in selenite or tetrathionate broth overnight. Book trigger: \"inoculated first in selenite broth or tetrathionate\".", "src": "PDF 73 (printed 66)"}, {"n": 76, "img": null, "kind": "association", "stem": "What is the drug of choice for enteric fever according to the book?", "opts": ["Streptomycin or gentamycin", "Vancomycin or metronidazole", "Ciprofloxacin or ceftriaxone", "Penicillin G or erythromycin"], "key": 2, "exp": "Answer: Ciprofloxacin or ceftriaxone. Book trigger: \"The drug of choice is either fluoroquinolones\".", "src": "PDF 75 (printed 68)"}, {"n": 77, "img": null, "kind": "clinical case", "stem": "A previously vaccinated patient has high anti-O and anti-H titers. Which titer is the important one?", "opts": ["Anti-O titer", "Anti-H titer", "Anti-Vi titer", "Anti-K titer"], "key": 1, "exp": "Answer: Anti-H titer. Book trigger: \"high anti-H titer is the only\".", "src": "PDF 74 (printed 67)"}, {"n": 78, "img": null, "kind": "double-clue", "stem": "Which Shigella is a late lactose fermenter in serogroup D with one serotype?", "opts": ["S. sonnei", "S. dysenteriae", "S. flexneri", "S. boydii"], "key": 0, "exp": "Answer: S. sonnei. Book trigger: \"Group D: S. sonnei (1 serotype)\".", "src": "PDF 77 (printed 70)"}, {"n": 79, "img": null, "kind": "except", "stem": "Regarding the interpretation of Widal test, all of the following are true EXCEPT:", "opts": ["Testing in the first week may give false negatives", "False positives may occur in autoimmune diseases", "Titers of 1/80 or less are not significant in Egypt", "Early antibiotic treatment raises the antibody titer"], "key": 3, "exp": "Answer: Early antibiotic treatment raises the antibody titer. Book trigger: \"early antibiotic treatment lowers antibody titer\".", "src": "PDF 74 (printed 67)"}, {"n": 80, "img": null, "kind": "double-clue", "stem": "Which E. coli type is acquired from hamburger or raw milk, produces verotoxin and can cause hemolytic uremic syndrome?", "opts": ["EPEC", "EIEC", "EHEC", "ETEC"], "key": 2, "exp": "Answer: EHEC. Book trigger: \"Bovine\".", "src": "PDF 66 (printed 59)"}, {"n": 81, "img": null, "kind": "double-clue", "stem": "Which opportunistic Enterobacteriaceae member makes a red pigment used to test bacterial filters?", "opts": ["Enterobacter", "Citrobacter", "Serratia", "Proteus"], "key": 2, "exp": "Answer: Serratia. Book trigger: \"Serratia: Some strains produce red non-diffusible endo-pigment\".", "src": "PDF 69 (printed 62)"}, {"n": 82, "img": null, "kind": "clinical case", "stem": "A healthy adult has nausea, vomiting and severe diarrhea with mild fever for one day after eating undercooked eggs. Blood culture is negative. What is the main treatment?", "opts": ["Fluid and electrolyte replacement", "Ciprofloxacin for all patients", "Streptomycin", "Ceftriaxone for all patients"], "key": 0, "exp": "Answer: Fluid and electrolyte replacement. Book trigger: \"Fluid and electrolyte replacement may be needed\".", "src": "PDF 76 (printed 69)"}, {"n": 83, "img": null, "kind": "except", "stem": "The following Enterobacteriaceae are opportunistic pathogens EXCEPT:", "opts": ["Citrobacter", "Serratia", "Proteus", "Shigella"], "key": 3, "exp": "Answer: Shigella. Book trigger: \"Most Enterobacteriaceae as Escherichia, Klebsiella, Enterobacter, Citrobacter, Serratia & Proteus\".", "src": "PDF 63 (printed 56)"}, {"n": 84, "img": null, "kind": "association", "stem": "E. coli K1 is a common cause of which condition?", "opts": ["Traveler's diarrhea", "Neonatal meningitis", "Hemolytic uremic syndrome", "Acute pharyngitis"], "key": 1, "exp": "Answer: Neonatal meningitis. Book trigger: \"E. coli K1 is a common cause of neonatal meningitis\".", "src": "PDF 65 (printed 58)"}, {"n": 85, "img": null, "kind": "definition", "stem": "The somatic (O) antigens of Salmonella divide the genus into:", "opts": ["Serogroups", "Phage types", "Serotypes", "Biotypes"], "key": 0, "exp": "Answer: Serogroups. Book trigger: \"which divide Salmonella into serogroups\".", "src": "PDF 71 (printed 64)"}, {"n": 86, "img": null, "kind": "association", "stem": "Which diarrheagenic E. coli type produces verotoxin, most commonly serotype O157:H7?", "opts": ["EIEC", "EPEC", "ETEC", "EHEC"], "key": 3, "exp": "Answer: EHEC. Book trigger: \"O157:H7\".", "src": "PDF 66 (printed 59)"}, {"n": 87, "img": null, "kind": "definition", "stem": "Selenite and tetrathionate broths are classified as:", "opts": ["Differential agar media", "Enrichment media", "Transport media", "Selective indicator media"], "key": 1, "exp": "Answer: Enrichment media. Book trigger: \"(enrichment media)\".", "src": "PDF 70 (printed 63)"}, {"n": 88, "img": null, "kind": "association", "stem": "Which drug is the drug of choice for plague?", "opts": ["Ciprofloxacin", "Erythromycin", "Streptomycin", "Penicillin G"], "key": 2, "exp": "Answer: Streptomycin. Book trigger: \"Streptomycin (aminoglycosides) is the drug of choice\".", "src": "PDF 82 (printed 75)"}, {"n": 89, "img": null, "kind": "clinical case", "stem": "A woman with urinary stones and alkaline urine has Proteus in her urine. Which enzyme explains the high pH?", "opts": ["Coagulase producing fibrin", "Catalase producing oxygen", "Urease, producing ammonia from urea", "Oxidase producing nitrite"], "key": 2, "exp": "Answer: Urease, producing ammonia from urea. Book trigger: \"Urease hydrolyses the urea in urine to form ammonia which raises the pH\".", "src": "PDF 79 (printed 72)"}, {"n": 90, "img": null, "kind": "association", "stem": "What is the incubation period of enteric fever?", "opts": ["1 – 2 weeks", "12 – 48 hours", "1-4 days", "2-5 days"], "key": 0, "exp": "Answer: 1 – 2 weeks. Book trigger: \"Incubation period: 1 – 2 weeks\".", "src": "PDF 73 (printed 66)"}, {"n": 91, "img": null, "kind": "association", "stem": "Which diarrheagenic E. coli type causes traveler's diarrhea in adults?", "opts": ["EHEC", "ETEC", "EPEC", "EIEC"], "key": 1, "exp": "Answer: ETEC. Book trigger: \"Traveler's diarrhea\".", "src": "PDF 66 (printed 59)"}, {"n": 92, "img": null, "kind": "double-clue", "stem": "In an endemic area such as Egypt, which single-sample Widal result indicates recent infection?", "opts": ["Anti-Vi titer of 1/20 only", "O and H titers of 1/80 or less", "A twofold rise in H titer only", "O and H titers of 1/160 or more"], "key": 3, "exp": "Answer: O and H titers of 1/160 or more. Book trigger: \"high titer of O and H ≥ 1/160 is indicative of recent infection\".", "src": "PDF 74 (printed 67)"}, {"n": 93, "img": null, "kind": "association", "stem": "Which diarrheagenic E. coli type invades colon mucosa without toxin production?", "opts": ["EIEC", "ETEC", "EPEC", "EaggEC"], "key": 0, "exp": "Answer: EIEC. Book trigger: \"Invasion of colon mucosa, without toxin production\".", "src": "PDF 66 (printed 59)"}, {"n": 94, "img": null, "kind": "sequence", "stem": "How is an intestinal carrier of S. Typhi diagnosed?", "opts": ["Urine centrifugation first, then a saline purge, then stool culture", "An antibiotic course first, then a cholagogue, then stool culture", "A saline purge first, then a cholagogue, then stool culture", "A cholagogue, then a saline purge, then stool culture"], "key": 3, "exp": "Answer: A cholagogue, then a saline purge, then stool culture. Book trigger: \"given first a cholagogue to empty the gall bladder followed by saline\".", "src": "PDF 75 (printed 68)"}, {"n": 95, "img": null, "kind": "except", "stem": "Regarding Klebsiella, all of the following are true EXCEPT:", "opts": ["Its IMVC pattern is - - + +", "It forms mucoid colonies on MacConkey agar", "It is a motile organism with a thin capsule", "It is a capsulated Gram-negative bacillus"], "key": 2, "exp": "Answer: It is a motile organism with a thin capsule. Book trigger: \"Klebsiella organisms are non-motile capsulated\".", "src": "PDF 67 (printed 60)"}, {"n": 96, "img": null, "kind": "clinical case", "stem": "An immunocompetent adult has Salmonella gastroenteritis. Which statement about blood tests is correct?", "opts": ["Bone marrow culture is needed", "Blood culture and serology are of no value", "Widal test is the best test", "Blood culture is the best test"], "key": 1, "exp": "Answer: Blood culture and serology are of no value. Book trigger: \"Blood culture and serological tests are of no value\".", "src": "PDF 76 (printed 69)"}, {"n": 97, "img": null, "kind": "association", "stem": "What is the most important virulence factor of Klebsiella?", "opts": ["Pili", "The capsule", "Heat-stable toxin", "Exotoxin A"], "key": 1, "exp": "Answer: The capsule. Book trigger: \"The capsule is the most important virulence factor\".", "src": "PDF 68 (printed 61)"}, {"n": 98, "img": null, "kind": "association", "stem": "Klebsiella resistance to antibiotics is mediated mainly by:", "opts": ["Spore formation", "Loss of the capsule", "Lack of a cell wall", "Beta-lactamases, especially ESBL"], "key": 3, "exp": "Answer: Beta-lactamases, especially ESBL. Book trigger: \"Resistance is mediated by ß-lactamases (especially ESBL)\".", "src": "PDF 69 (printed 62)"}, {"n": 99, "img": null, "kind": "association", "stem": "Which Shigella species belongs to serogroup B?", "opts": ["S. sonnei", "S. dysenteriae", "S. flexneri", "S. boydii"], "key": 2, "exp": "Answer: S. flexneri. Book trigger: \"Group B: S. flexneri (8 serotypes)\".", "src": "PDF 77 (printed 70)"}, {"n": 100, "img": null, "kind": "except", "stem": "Regarding typhoid vaccines, all of the following are correct EXCEPT:", "opts": ["The Vi polysaccharide vaccine is given subcutaneously", "TAB vaccine contains S. Typhi, S. Paratyphi A and B", "The oral vaccine is a live avirulent mutant of S. Typhi", "TAB vaccine is no longer recommended because of side effects"], "key": 0, "exp": "Answer: The Vi polysaccharide vaccine is given subcutaneously. Book trigger: \"Vi capsular polysaccharide vaccine of S. Typhi: It is given intramuscularly\".", "src": "PDF 75 (printed 68)"}, {"n": 101, "img": null, "kind": "double-clue", "stem": "Which organism gives pale colonies on MacConkey and black colonies on SS agar from H2S?", "opts": ["Salmonella species", "Klebsiella pneumoniae", "Shigella species", "Escherichia coli"], "key": 0, "exp": "Answer: Salmonella species. Book trigger: \"is superior to MacConkey and DCA media in detecting H2S-producing Salmonella\".", "src": "PDF 70 (printed 63)"}, {"n": 102, "img": null, "kind": "except", "stem": "Regarding Shigella, all of the following are true EXCEPT:", "opts": ["It is a strict human pathogen", "It is H2S and urease negative", "It is a non-motile, non-capsulated Gram-negative bacillus", "It invades the bloodstream"], "key": 3, "exp": "Answer: It invades the bloodstream. Book trigger: \"The organism does not invade into the blood\".", "src": "PDF 77 (printed 70)"}, {"n": 103, "img": null, "kind": "except", "stem": "Proteus may cause all of the following infections EXCEPT:", "opts": ["Urinary tract infection", "Atrophic rhinitis", "Wound infections and abscesses", "Septicaemia and meningitis"], "key": 1, "exp": "Answer: Atrophic rhinitis. Book trigger: \"Wound infections and abscess formation\".", "src": "PDF 79 (printed 72)"}, {"n": 104, "img": null, "kind": "except", "stem": "The following are true about Salmonella antigens EXCEPT:", "opts": ["O antigens divide Salmonella into serogroups", "The Vi antigen may be present in some S. Typhi strains", "The H antigen is the somatic LPS antigen", "H antigens divide serogroups into serotypes"], "key": 2, "exp": "Answer: The H antigen is the somatic LPS antigen. Book trigger: \"The H (flagellar) antigens: which divide the serogroups into serotypes\".", "src": "PDF 71 (printed 64)"}, {"n": 105, "img": null, "kind": "sequence", "stem": "Which sequence describes the Widal tube test?", "opts": ["Read the end titer, serial serum dilutions, add O and H antigens, incubate, look for agglutination", "Serial serum dilutions, add O and H antigens, incubate, look for agglutination, read the end titer", "Add O and H antigens, serial serum dilutions, read the end titer, incubate, look for agglutination", "Incubate, serial serum dilutions, add O and H antigens, read the end titer, look for agglutination"], "key": 1, "exp": "Answer: Serial serum dilutions, add O and H antigens, incubate, look for agglutination, read the end titer. Book trigger: \"Serial dilutions of the patient’s serum\".", "src": "PDF 74 (printed 67)"}, {"n": 106, "img": null, "kind": "except", "stem": "Regarding enterohemorrhagic E. coli (EHEC), all of the following are true EXCEPT:", "opts": ["It is acquired from raw or undercooked meat", "It can cause hemolytic uremic syndrome in some patients", "It produces heat-labile and heat-stable enterotoxins", "It produces verotoxin (shiga-like toxin)"], "key": 2, "exp": "Answer: It produces heat-labile and heat-stable enterotoxins. Book trigger: \"Production of verotoxin\".", "src": "PDF 66 (printed 59)"}, {"n": 107, "img": null, "kind": "clinical case", "stem": "A patient has a destructive granuloma of the nose and pharynx. Which organism is associated?", "opts": ["Proteus vulgaris", "Klebsiella oxytoca", "Klebsiella ozaenae", "Klebsiella rhinoscleromatis"], "key": 3, "exp": "Answer: Klebsiella rhinoscleromatis. Book trigger: \"rhinoscleromatis is associated with rhinoscleroma\".", "src": "PDF 69 (printed 62)"}, {"n": 108, "img": null, "kind": "except", "stem": "Man can be accidentally infected with Y. pestis by all of the following ways EXCEPT:", "opts": ["Fecal-oral spread from contaminated water", "Respiratory droplets from pneumonic plague", "Aerosol while handling Yersinia cultures", "Bite of an infected flea"], "key": 0, "exp": "Answer: Fecal-oral spread from contaminated water. Book trigger: \"Man can be accidently infected by one of the following ways\".", "src": "PDF 80 (printed 73)"}, {"n": 109, "img": null, "kind": "sequence", "stem": "How is a urinary carrier of S. Typhi investigated in the laboratory?", "opts": ["Add cholagogue, centrifuge the urine, then culture on blood agar", "Centrifuge the urine, culture the deposit on MacConkey or DCA, then identify", "Identify the colonies first, then centrifuge the urine, then culture on DCA", "Culture the urine directly on selenite broth, then centrifuge, then identify"], "key": 1, "exp": "Answer: Centrifuge the urine, culture the deposit on MacConkey or DCA, then identify. Book trigger: \"urine is centrifuged. Deposit is cultured\".", "src": "PDF 73 (printed 66)"}, {"n": 110, "img": null, "kind": "clinical case", "stem": "A K. pneumoniae strain is isolated from a urinary tract infection. What is routinely required?", "opts": ["In vitro susceptibility testing", "Lepromin test", "Elek test", "Widal test"], "key": 0, "exp": "Answer: In vitro susceptibility testing. Book trigger: \"routine in vitro susceptibility testing is required\".", "src": "PDF 69 (printed 62)"}, {"n": 111, "img": null, "kind": "except", "stem": "Regarding Salmonella food poisoning, all of the following are true EXCEPT:", "opts": ["Incubation period is 12 – 48 hours", "It is self-limited, with recovery within one week", "Blood culture is the diagnostic test of choice", "The source of infection is animals or poultry"], "key": 2, "exp": "Answer: Blood culture is the diagnostic test of choice. Book trigger: \"Blood culture and serological tests are of no value\".", "src": "PDF 76 (printed 69)"}, {"n": 112, "img": null, "kind": "sequence", "stem": "Which sequence describes the infectious path of plague between rodents and man (bubonic form)?", "opts": ["Respiratory droplets, pain of draining lymph nodes, bite of the flea", "Lymph node swelling, rat flea bite, aerosol delivery, septicaemia", "Septicaemia, rat flea bite, lymph node swelling, aerosol delivery", "Rat flea bite, pain and swelling of draining lymph nodes, possible spread to the bloodstream"], "key": 3, "exp": "Answer: Rat flea bite, pain and swelling of draining lymph nodes, possible spread to the bloodstream. Book trigger: \"This results in bubonic plague which is characterized by pain and swelling\".", "src": "PDF 80 (printed 73)"}, {"n": 113, "img": null, "kind": "clinical case", "stem": "A neonate has meningitis. Which test can detect E. coli K1 antigen in CSF?", "opts": ["Elek test", "Widal test", "Nagler test", "Latex agglutination"], "key": 3, "exp": "Answer: Latex agglutination. Book trigger: \"detected in CSF in neonatal meningitis by latex agglutination\".", "src": "PDF 67 (printed 60)"}, {"n": 114, "img": null, "kind": "clinical case", "stem": "A child has dysentery-like bloody diarrhea from an E. coli that invades the colon mucosa without toxin. Which type is it?", "opts": ["ETEC", "EHEC", "EIEC", "EPEC"], "key": 2, "exp": "Answer: EIEC. Book trigger: \"Invasion of colon mucosa, without toxin production\".", "src": "PDF 66 (printed 59)"}, {"n": 115, "img": null, "kind": "clinical case", "stem": "A child ate refrigerated food and has abdominal pain mimicking acute appendicitis. Which organism is suspected?", "opts": ["Yersinia enterocolitica", "Shigella dysenteriae", "Salmonella Typhi", "Yersinia pestis"], "key": 0, "exp": "Answer: Yersinia enterocolitica. Book trigger: \"Disease (yersiniosis) can range from mild diarrhoea to what appears to be\".", "src": "PDF 82 (printed 75)"}, {"n": 116, "img": null, "kind": "clinical case", "stem": "A single serum from an Egyptian patient has O and H titers of 1/80. How is this read?", "opts": ["Diagnostic of carrier state", "Not significant, due to community titer", "Diagnostic of recent typhoid", "Proof of Salmonella food poisoning"], "key": 1, "exp": "Answer: Not significant, due to community titer. Book trigger: \"Titers ≤ 1/80 are not significant\".", "src": "PDF 74 (printed 67)"}, {"n": 117, "img": null, "kind": "clinical case", "stem": "A 20-year-old in Egypt has fever for 5 days, headache, constipation, splenomegaly and rose spots. Which specimen is best in the first week?", "opts": ["Blood culture", "Widal test serum", "Urine culture", "Stool culture"], "key": 0, "exp": "Answer: Blood culture. Book trigger: \"Blood culture: 5 – 10 ml blood\".", "src": "PDF 73 (printed 66)"}, {"n": 118, "img": null, "kind": "clinical case", "stem": "A neonate with sepsis has a non-motile, capsulated, lactose-fermenting Gram-negative bacillus with mucoid colonies. Which organism is it?", "opts": ["Proteus mirabilis", "Klebsiella pneumoniae", "Escherichia coli", "Salmonella Typhi"], "key": 1, "exp": "Answer: Klebsiella pneumoniae. Book trigger: \"non-motile capsulated Gram-negative bacilli\".", "src": "PDF 67 (printed 60)"}, {"n": 119, "img": null, "kind": "definition", "stem": "The red non-diffusible endo-pigment of some Serratia strains is used to test:", "opts": ["The temperature of autoclaves", "The potency of disinfectants", "The efficiency of bacterial filters", "The chlorination of water"], "key": 2, "exp": "Answer: The efficiency of bacterial filters. Book trigger: \"used for testing efficiency of bacterial filters\".", "src": "PDF 69 (printed 62)"}, {"n": 120, "img": null, "kind": "double-clue", "stem": "Which triad characterizes bacillary dysentery?", "opts": ["Fever, rose spots, splenomegaly and constipation without diarrhea", "Vomiting, rice-water stools and hypovolemic shock with dehydration", "Abdominal pain, jaundice, renal failure and meningismus without stools", "Abdominal cramps, tenesmus and frequent small-volume bloody mucoid stools"], "key": 3, "exp": "Answer: Abdominal cramps, tenesmus and frequent small-volume bloody mucoid stools. Book trigger: \"painful straining to pass stools (tenesmus)\".", "src": "PDF 78 (printed 71)"}, {"n": 121, "img": null, "kind": "definition", "stem": "A zoonotic disease that primarily affects rodents, which act as its reservoirs, is:", "opts": ["Klebsiella pneumonia", "Shigellosis", "Plague", "Typhoid fever"], "key": 2, "exp": "Answer: Plague. Book trigger: \"Plague is a zoonotic disease primarily affecting rodents\".", "src": "PDF 80 (printed 73)"}, {"n": 122, "img": null, "kind": "association", "stem": "Which Klebsiella species is associated with atrophic rhinitis const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='abcd';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Infection and Immunity, PDF 63-82</h2>
<p>${Q.length} MCQs from the coursebook (Corynebacterium, Listeria, Bacillus, Clostridium). Mixed across all topics in random order. Each question keeps its book image where it has one. Answers follow the coursebook.</p>
<p><b>Practice mode (default):</b> after each answer you see right or wrong, the book answer and the explanation at once. Your score updates as you go. At the end you get the score, a review of the missed questions, and a button to retry only the missed ones.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>
<button class="btn" onclick="start(Q.filter(q=>q.img),'practice')">Practice: image questions</button>
<p><b>Exam mode</b> (optional, answers shown only at the end):</p>
<button class="btn g" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'exam')">Exam: 50 random</button>
</div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit'}</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else start(Q,'practice');
</script></body></html>
