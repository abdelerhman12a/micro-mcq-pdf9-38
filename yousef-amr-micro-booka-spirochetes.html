heoretical - صفحة 130 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 130}, {"n": 1117, "stem": "Regarding Vincent’ angina all the following statements are correct, EXCEPT:", "opts": ["It is an infection of the pharynx.", "It is caused by oral spirochaetes and fusiform bacilli.", "It is characterized by the formation of a pseudomembrane.", "It may occur following viral infections e.g. HSV.", "The causative organism(s) cannot be stained by Gram stain."], "key": 4, "exp": "كتاب النظري: Borrelia vincenti is easily stained by ordinary methods and is Gram-negative (it appears in Gram-stained smears with fusiform bacilli)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 129 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 129}, {"n": 1118, "stem": "What is the characteristic motility of spirochaetes due to?", "opts": ["Axial filaments.", "Cilia.", "Pseudopodia.", "Flagella."], "key": 0, "exp": "كتاب النظري: Corkscrew motility is due to axial filaments (endoflagella)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 121 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 121}, {"n": 1119, "stem": "What is the drug of choice for the treatment of syphilis?", "opts": ["Tetracycline.", "Penicillin.", "Erythromycin.", "Chloramphenicol."], "key": 1, "exp": "كتاب النظري: Penicillin is the treatment of choice for syphilis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1120, "stem": "Which of the following species causes Lyme disease?", "opts": ["B. recurrentis.", "B. burgdorferi.", "B. hermsii.", "L. interrogans."], "key": 1, "exp": "كتاب النظري: Lyme disease is caused by Borrelia burgdorferi", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 128 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 128}, {"n": 1121, "stem": "Which form of syphilis is characterized by painless genital or oral ulcers?", "opts": ["Secondary.", "Tertiary.", "Latent.", "Primary."], "key": 3, "exp": "كتاب النظري: Primary syphilis: hard painless chancre, genital or oral", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 122 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 122}, {"n": 1122, "stem": "Which of the following transmits Borrelia recurrentis?", "opts": ["Fleas.", "Human body louse.", "Mosquitoes.", "Ticks. 123"], "key": 1, "exp": "كتاب النظري: Epidemic relapsing fever (B. recurrentis) is transmitted by lice", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 127 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 127}, {"n": 1124, "stem": "What are non-treponemal antibodies also known as?", "opts": ["Agglutinins.", "Reagin.", "Immunoglobulins.", "Antitoxins."], "key": 1, "exp": "كتاب النظري: Non-treponemal tests detect Reagin, a mixture of non-specific host antibodies against lipoidal antigens", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 124 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 124}, {"n": 1125, "stem": "What is the main symptom of Stage 1 Lyme disease?", "opts": ["Gumma formation.", "Erythema migrans.", "Jaundice.", "Fever."], "key": 1, "exp": "كتاب النظري: Lyme disease 1st stage: erythema chronicum migrans at the site of the bite", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 128 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 128}, {"n": 1127, "stem": "What is Vincent's angina?", "opts": ["Syphilis of the throat.", "Fusospirochaetal infection of the pharynx.", "Relapsing fever.", "Lyme disease stage."], "key": 1, "exp": "كتاب النظري: Vincent's angina is caused by Borr. vincenti (spirochete) with Fusobacterium fusiform - a fusospirochaetal pharyngeal infection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 129 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 129}, {"n": 1128, "stem": "What causes the relapses in relapsing fever?", "opts": ["Resistance to antibiotics.", "Antigenic variation in Borrelia species.", "Host immune response suppression.", "Coinfection with other bacteria."], "key": 1, "exp": "كتاب النظري: Relapses occur due to antigenic variations in Borrelia spp.", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 126 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 126}, {"n": 1129, "stem": "Which test detects non-treponemal antibodies for syphilis?", "opts": ["FTA.", "TPHA.", "EIA.", "VDRL."], "key": 3, "exp": "كتاب النظري: VDRL detects non-treponemal (reagin) antibodies", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1131, "stem": "How is congenital syphilis diagnosed in newborns?", "opts": ["Dark-field microscopy.", "Detection of treponemal IgM antibodies.", "Urine culture.", "Rapid plasma reagin (RPR) test."], "key": 1, "exp": "كتاب النظري: Congenital syphilis: detection of treponemal IgM antibodies in the newborn's serum by EIA", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1132, "stem": "Which of the following is NOT true about non-treponemal tests?", "opts": ["They are inexpensive.", "They are used for screening.", "They are highly specific.", "They may give false positives."], "key": 2, "exp": "كتاب النظري: Non-treponemal tests may give false-positive results, so they are not highly specific", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1133, "stem": "Which species is transmitted by ticks and causes Lyme disease?", "opts": ["B. recurrentis.", "B. hermsii.", "B. burgdorferi.", "T. pallidum. 124"], "key": 2, "exp": "كتاب النظري: B. burgdorferi is transmitted by tick bite and causes Lyme disease", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 128 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 128}, {"n": 1134, "stem": "What is a key difference between non-treponemal and treponemal tests?", "opts": ["Non-treponemal tests detect specific antibodies.", "Treponemal tests are used for screening.", "Treponemal tests remain reactive for life.", "Non-treponemal tests are expensive."], "key": 2, "exp": "كتاب النظري: Specific treponemal tests remain positive for life even after effective treatment", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1135, "stem": "What condition is also known as Weil's disease?", "opts": ["Lyme disease.", "Leptospirosis.", "Relapsing fever.", "Tertiary syphilis."], "key": 1, "exp": "كتاب النظري: Leptospirosis is also called Weil's disease (infectious jaundice)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 130 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 130}, {"n": 1136, "stem": "What is the primary mode of transmission of Leptospira interrogans?", "opts": ["Aerosol.", "Contaminated water.", "Tick bite.", "Direct contact with an infected person."], "key": 1, "exp": "كتاب النظري: Transmission: contact with animal urine in water; the organism penetrates mucous membranes or skin breaks", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 130 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 130}, {"n": 1137, "stem": "What stage of syphilis is characterized by neurological manifestations?", "opts": ["Primary.", "Secondary.", "Latent.", "Tertiary."], "key": 3, "exp": "كتاب النظري: Tertiary syphilis: gummas, cardiovascular syphilis and neurosyphilis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 123 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 123}, {"n": 1138, "stem": "Which test is NOT specific for syphilis but can be used to detect it?", "opts": ["EIA.", "FTA-ABS.", "VDRL.", "TPHA."], "key": 2, "exp": "كتاب النظري: VDRL is a non-specific (non-treponemal) test", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1139, "stem": "Which organism is known to cause endemic relapsing fever?", "opts": ["B. burgdorferi.", "B. hermsii.", "T. pallidum.", "L. interrogans."], "key": 1, "exp": "كتاب النظري: Endemic relapsing fever is caused by other Borrelia species (e.g. B. duttoni group, which includes B. hermsii)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 127 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 127}, {"n": 1140, "stem": "Why can't treponemal tests be used to determine the response to treatment in syphilis?", "opts": ["They are non-specific tests.", "They are too expensive.", "They remain reactive for life even after effective treatment.", "They are not sensitive enough."], "key": 2, "exp": "كتاب النظري: Treponemal tests remain positive for life even after effective treatment, so they cannot follow treatment response", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1141, "stem": "Which condition is also known as \"infectious jaundice\"?", "opts": ["Syphilis.", "Leptospirosis.", "Lyme disease.", "Relapsing fever."], "key": 1, "exp": "كتاب النظري: Leptospirosis (Weil's disease) is also known as infectious jaundice", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 130 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 130}, {"n": 1142, "stem": "Why are non-treponemal tests like VDRL and RPR unsuitable for confirming syphilis?", "opts": ["They are non-specific and may give false positives.", "They are expensive.", "They are too slow to perform.", "They remain positive for life. 125"], "key": 0, "exp": "كتاب النظري: Non-treponemal tests may give false-positive results, so positives must be confirmed by specific treponemal tests", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 125 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 125}, {"n": 1143, "stem": "What is the hallmark of late Lyme disease?", "opts": ["Arthritis.", "Chancre.", "Weil’s disease.", "Vincent’s angina."], "key": 0, "exp": "كتاب النظري: Lyme disease 3rd stage: arthralgias and migrating arthritis lasting months or years", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 128 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 128}, {"n": 1144, "stem": "What stage of syphilis is characterized by the presence of gummas?", "opts": ["Primary syphilis.", "Secondary syphilis.", "Latent syphilis.", "Tertiary syphilis."], "key": 3, "exp": "كتاب النظري: Tertiary syphilis: gummas (syphilitic granulomas) in skin and bone", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 123 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 123}, {"n": 1145, "stem": "Which statement is INCORRECT for Pathogenic spirochetes?", "opts": ["Stain well with Gram Stain.", "Stain with Fontana Stain.", "Fail to grow on Artificial culture media.", "Its Motility is Demonstrated by Dark Field microscope."], "key": 0, "exp": "كتاب النظري: T. pallidum is not stained with Gram stain; it is visualized by silver impregnation (Fontana), immunofluorescence or dark-field", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 121 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 121}, {"n": 1146, "stem": "Of which following one is NOT TRUE of Syphilis:", "opts": ["Caused by Treponema.", "Pallidum.", "Congenital disease.", "The disease occurs due to exotoxin production."], "key": 3, "exp": "كتاب النظري: Syphilis pathogenesis is local multiplication and spread of spirochetes; no exotoxin is produced", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 122 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 122}];

 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
