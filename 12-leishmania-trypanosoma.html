const Q=[{"n": 1, "img": null, "kind": "mcq", "stem": "The two genera of pathogenic haemoflagellates are:", "opts": ["Plasmodium and Toxoplasma", "Trypanosoma and Leishmania", "Giardia and Trichomonas", "Entamoeba and Balantidium"], "key": 1, "exp": "Trigger: \"There are two genera of pathogenic Haemoflagellates: Trypanosoma and Leishmania.\"", "src": "printed 368"}, {"n": 2, "img": null, "kind": "mcq", "stem": "A parasite inhabiting the reticuloendothelial system cells of the skin causes cutaneous leishmaniasis; if it inhabits the internal viscera it causes:", "opts": ["Diffuse cutaneous leishmaniasis", "Mucocutaneous leishmaniasis", "Visceral leishmaniasis", "Leishmania recidivans"], "key": 2, "exp": "Trigger: \"(a) Skin -> Cutaneous leishmaniasis. (b) Skin & mucous membranes -> Mucocutaneous leishmaniasis. (c) Internal viscera -> Visceral leishmaniasis.\"", "src": "printed 368"}, {"n": 3, "img": "sandfly", "kind": "mcq", "stem": "Leishmania is transmitted to man, the definitive host, through the bite of:", "opts": ["The sand fly, a yellow small fly", "The reduviid bug", "The tsetse fly", "The female Anopheles mosquito"], "key": 0, "exp": "Trigger: \"this parasite is transmitted to man (definitive host) through bite of 'Sand fly'; a yellow small fly.\"", "src": "printed 368"}, {"n": 4, "img": null, "kind": "mcq", "stem": "Which statement about the amastigote (Leishmania body) is correct?", "opts": ["It has a long free flagellum", "It is the only form present in human tissue, inside RES cells, and is the diagnostic stage of all types", "It is the infective stage in the sand fly gut", "It is extracellular in blood"], "key": 1, "exp": "Trigger: \"Site: it is the only form that is present in human tissue (inside RES cells) i.e. intracellular form. It is the diagnostic stage of all types of Leishmania.\"", "src": "printed 369"}, {"n": 5, "img": null, "kind": "mcq", "stem": "The promastigote form of Leishmania is found in:", "opts": ["Human skin nodules only", "The salivary glands of Anopheles", "The gut of the sand fly and in culture media, as the extracellular infective stage", "Human RES cells"], "key": 2, "exp": "Trigger: \"Site: Presents in the gut of Sand fly & culture media (extracellular form). It is the infective stage of all types of Leishmania.\"", "src": "printed 369"}, {"n": 6, "img": "leish-amastigote", "kind": "mcq", "stem": "In this figure of the two morphological forms, the form WITHOUT a free flagellum (kinetoplast + axoneme stopping at the surface) is the:", "opts": ["Epimastigote form", "Amastigote form", "Trypomastigote form", "Promastigote form"], "key": 1, "exp": "Trigger: \"a kinetoplast anteriorly from which arise an axoneme that stops at the surface with no free flagellum\" = amastigote.", "src": "printed 369"}, {"n": 7, "img": "leish-promastigote", "kind": "mcq", "stem": "In this figure, the fusiform form with a free flagellum, 14 micrometres long, is:", "opts": ["The epimastigote", "The metacyclic trypomastigote", "The amastigote - diagnostic stage", "The promastigote - infective stage"], "key": 3, "exp": "Trigger: \"Promastigote form: Size 14u. Shape: Fusiform with a central nucleus & a kinetoplast anteriorly from which arise free flagellum... infective stage.\"", "src": "printed 369"}, {"n": 8, "img": null, "kind": "mcq", "stem": "A sand fly takes a blood meal from a patient with kala azar. Inside the fly, the ingested parasites transform and multiply in the midgut, then migrate to the salivary glands. The form ingested and the form injected into the next human are, respectively:", "opts": ["Amastigote ingested; metacyclic trypomastigote injected", "Trypomastigote ingested; amastigote injected", "Amastigote ingested; promastigote injected", "Promastigote ingested; amastigote injected"], "key": 2, "exp": "Trigger: \"the amastigote which infects the sandfly during its blood meal... transform back into promastigotes in the fly midgut... migrate into the salivary gland of the fly.\"", "src": "printed 371-372"}, {"n": 9, "img": null, "kind": "mcq", "stem": "Which list contains ONLY Old World Leishmania species?", "opts": ["L. braziliensis and L. mexicana", "L. tropica and L. braziliensis", "L. tropica, L. major, L. aethiopica, L. donovani, L. infantum", "L. donovani and L. mexicana"], "key": 2, "exp": "Trigger: Classification table: Old World (Africa, Asia, Europe) = tropica, major, aethiopica, donovani, infantum; New World (Americas) = braziliensis, mexicana.", "src": "printed 371"}, {"n": 10, "img": null, "kind": "mcq", "stem": "New World leishmaniasis in the Americas is transmitted by which sand fly genus?", "opts": ["Triatoma", "Phlebotomus", "Glossina", "Lutzomyia"], "key": 3, "exp": "Trigger: \"(a) Old World type: 'Phlebotomus'... (b) New World type: 'Lutzomyia' (transmits New World Leishmania).\"", "src": "printed 371"}, {"n": 11, "img": null, "kind": "mcq", "stem": "Cutaneous leishmaniasis is caused by:", "opts": ["L. braziliensis and L. mexicana", "L. tropica, L. major and L. aethiopica", "L. donovani only", "L. donovani and L. infantum"], "key": 1, "exp": "Trigger: \"(1) Cutaneous leishmaniasis (CL): Caused by Leishmania tropica; L. major & L. aethiopica.\"", "src": "printed 372"}, {"n": 12, "img": null, "kind": "mcq", "stem": "A farmer from an endemic area has a nodule on his hand at a bite site that ulcerated then healed spontaneously leaving a scar. The lesion sequence is:", "opts": ["Nodule, ulcer, scar (oriental sore)", "Nodule, eschar, stricture", "Chancre, rash, gumma", "Papule, lymphadenopathy, scar"], "key": 0, "exp": "Trigger: \"Localized forms 'Oriental sore': nodule at the site of bite (on face or hand) that becomes ulcerated; then heals spontaneously leaving scar. (Nodule, ulcers, scar).\"", "src": "printed 372"}, {"n": 13, "img": null, "kind": "mcq", "stem": "Two patients have oriental sores. Lesion 1 is single, small, slightly inflamed, slowly developing and covered by a crust. Lesion 2 is multiple in a localized area, large, markedly inflamed and rapidly developing, without a crust. The causative species are, respectively:", "opts": ["L. aethiopica and L. donovani", "L. braziliensis and L. mexicana", "L. tropica (dry) and L. major (wet)", "L. major (wet) and L. tropica (dry)"], "key": 2, "exp": "Trigger: \"Dry lesion: (covered by a crust) - Caused by Leishmania tropica... Wet lesion: (not covered by a crust) - Caused by Leishmania major.\"", "src": "printed 373"}, {"n": 14, "img": null, "kind": "mcq", "stem": "Both dry (L. tropica) and wet (L. major) cutaneous lesions are followed by:", "opts": ["Lifelong recurrent parasitaemia", "Solid permanent immunity", "Visceral spread", "Post-kala-azar dermal leishmaniasis"], "key": 1, "exp": "Trigger: dry lesion \"slowly developing lesion followed by solid permanent immunity\"; wet lesion \"rapidly developing lesion followed by solid permanent immunity.\"", "src": "printed 373"}, {"n": 15, "img": "cl-face", "kind": "mcq", "stem": "This lesion photo (crusted ulcer on the face) best fits which form of cutaneous leishmaniasis?", "opts": ["Mucocutaneous leishmaniasis (espundia)", "Localized oriental sore (old world cutaneous leishmaniasis)", "Post-kala-azar dermal leishmaniasis", "Diffuse cutaneous leishmaniasis"], "key": 1, "exp": "Trigger: Fig \"Old world cutaneous leishmania\": nodule at bite site on face or hand that ulcerates then heals with a scar.", "src": "printed 373"}, {"n": 16, "img": null, "kind": "mcq", "stem": "In diffuse forms of cutaneous leishmaniasis, the nodules:", "opts": ["Heal spontaneously in one week", "Are confined to mucous membranes", "Start at the face then spread all over the body but don't ulcerate", "Ulcerate rapidly at the bite site"], "key": 2, "exp": "Trigger: \"Diffuse forms - Lesion: nodules start at the face then spread all over the body but don't ulcerate.\"", "src": "printed 373"}, {"n": 17, "img": "dcl", "kind": "mcq", "stem": "An immunosuppressed patient develops non-ulcerating nodules starting on the face and spreading over the body. Smears show the nodules full of amastigotes while the intradermal test is negative. The diagnosis is:", "opts": ["Leishmania recidivans", "Diffuse cutaneous leishmaniasis (DCL) due to L. aethiopica", "Espundia", "Oriental sore due to L. tropica"], "key": 1, "exp": "Trigger: \"DCL - Caused by Leishmania aethiopica in immunosuppression... Nodules are full of amastigotes; while intradermal test is negative (due to immunosuppression).\"", "src": "printed 374"}, {"n": 18, "img": "lr", "kind": "mcq", "stem": "A patient whose L. tropica sore healed months ago now develops small nodules at the edge of the old scar that spread over the body. The nodules are free of amastigotes and the intradermal test is strongly positive. The mechanism is:", "opts": ["Reinfection by a New World species", "Transformation of the parasite to a dermatotropic form", "Rapid parasite multiplication due to immunosuppression", "Hypersensitivity to the remnants of Leishmania tropica antigens in skin (Leishmania recidivans)"], "key": 3, "exp": "Trigger: \"LR - recurrent form... after healing of Leishmania tropica infection in hypersensitive persons... Hypersensitivity to the remnants of Leishmania tropica antigens in skin... Nodules are free of amastigotes; while intradermal test is strong positive.\"", "src": "printed 374"}, {"n": 19, "img": null, "kind": "mcq", "stem": "Which pair correctly contrasts DCL and Leishmania recidivans?", "opts": ["Both occur in hypersensitive patients", "DCL: negative smear, positive test; LR: positive smear, negative test", "DCL: nodules full of amastigotes with negative intradermal test; LR: nodules free of amastigotes with strong positive test", "Both have amastigote-filled nodules"], "key": 2, "exp": "Trigger: DCL \"full of amastigotes... intradermal test is negative\"; LR \"free of amastigotes... intradermal test is strong positive\". NB: \"Both DCL & LR are rare & very difficult to cure.\"", "src": "printed 374"}, {"n": 20, "img": "espundia", "kind": "mcq", "stem": "A patient with long-standing untreated cutaneous leishmaniasis develops destructive ulcers of the nose, lips, pharynx and larynx with regional lymphadenopathy. The causative species are:", "opts": ["L. donovani and L. infantum", "L. braziliensis and L. mexicana (espundia)", "L. aethiopica", "L. tropica and L. major"], "key": 1, "exp": "Trigger: \"Mucocutaneous leishmaniasis (Espundia) Caused by Leishmania braziliensis & L. mexicana... destructive ulcer -> destruction of lips & nose.\"", "src": "printed 375"}, {"n": 21, "img": null, "kind": "mcq", "stem": "Kala azar (Dum Dum fever, black fever) is caused by:", "opts": ["L. braziliensis and L. mexicana", "L. tropica and L. major", "L. donovani and L. infantum", "L. aethiopica"], "key": 2, "exp": "Trigger: \"Visceral Leishmaniasis. (Kala azar - Dum Dum fever - Black fever) - Caused by Leishmania donovani & L. infantum. The disease is fatal if untreated.\"", "src": "printed 376"}, {"n": 22, "img": null, "kind": "mcq", "stem": "The dark discoloration of the skin of the face and hands in visceral leishmaniasis explains the name:", "opts": ["Kala azar (black fever)", "Chagoma", "Oriental sore", "Espundia"], "key": 0, "exp": "Trigger: \"Dark discoloration of skin of face & hands (hence name kala azar or black fever).\"", "src": "printed 376"}, {"n": 23, "img": null, "kind": "mcq", "stem": "In visceral leishmaniasis, hepatosplenomegaly and lymphadenopathy result from:", "opts": ["Shiga-like toxin effect", "Microvascular vasculitis of endothelium", "Destruction of autonomic intramural neurons", "Hyperplasia and dysfunction of the RES of internal viscera"], "key": 3, "exp": "Trigger: \"Hyperplasia & dysfunction of RES of internal viscera -> enlargement of RES organs & immunosuppression. Hepatosplenomegaly & lymphadenopathy.\"", "src": "printed 376"}, {"n": 24, "img": null, "kind": "mcq", "stem": "Ascites and bleeding tendency in kala azar are due to:", "opts": ["Renal failure", "Bone marrow atrophy", "Liver dysfunction", "Hypersensitivity"], "key": 2, "exp": "Trigger: \"Ascites (albumin) & bleeding tendency (prothrombin) due to liver dysfunction.\"", "src": "printed 376"}, {"n": 25, "img": null, "kind": "mcq", "stem": "The anaemia, leucopenia and thrombocytopenia of kala azar are explained by:", "opts": ["DIC with consumption", "Autoimmune haemolysis", "Hyperplasia of RES cells of bone marrow leading to atrophy of haemopoietic cells", "Iron sequestration in the spleen"], "key": 2, "exp": "Trigger: \"Anaemia, leucopenia & thrombocytopenia (due to Hyperplasia of RES cells of bone marrow -> atrophy of haemopoietic cells).\"", "src": "printed 376"}, {"n": 26, "img": null, "kind": "mcq", "stem": "Dysentery in visceral leishmaniasis occurs because of:", "opts": ["Immunosuppression and recurrent infections", "Shiga toxin production", "Hypersensitivity to skin antigens", "Direct invasion of colonic mucosa"], "key": 0, "exp": "Trigger: \"Dysentery (due to immunosuppression & recurrent infections).\"", "src": "printed 376"}, {"n": 27, "img": null, "kind": "mcq", "stem": "After inadequate treatment of kala azar, a patient develops disseminated skin nodules because:", "opts": ["The parasite changes its nature to dermatotropic and migrates from internal viscera to the skin", "Of hypersensitivity to remnant antigens", "Amastigotes encyst in muscle", "The sand fly bit the patient again"], "key": 0, "exp": "Trigger: \"Post-kala azar dermal leishmaniasis: Inadequate treatment of kala azar -> change the nature of parasite to be dermatotropic; so, migrates from internal viscera to skin -> disseminated skin nodules.\"", "src": "printed 376"}, {"n": 28, "img": null, "kind": "mcq", "stem": "In cutaneous leishmaniasis the intradermal (Montenegro) test is positive early because:", "opts": ["CMI is permanently suppressed", "Cell mediated immunity is stimulated early, while the humoral response is weak and late", "The test detects circulating antigen", "Antibodies appear within hours"], "key": 1, "exp": "Trigger: \"In Cutaneous Leishmaniasis: Cell mediated immunity is stimulated early; so, intradermal test (Montenegro test) is positive early in the disease; while humoral response is very weak & late.\"", "src": "printed 377"}, {"n": 29, "img": null, "kind": "mcq", "stem": "In visceral leishmaniasis, antibodies (IgM and IgG) are positive early while the intradermal test is negative; the test becomes positive months after cure because:", "opts": ["Amastigotes migrate to the skin", "Humoral immunity converts to autoimmunity", "Death of the parasite allows recovery of cell mediated immunity", "The antigen load increases after treatment"], "key": 2, "exp": "Trigger: \"intradermal test is negative & becomes positive months after treatment (death of parasite -> recovery of cell mediated immunity -> positive intradermal test).\"", "src": "printed 377"}, {"n": 30, "img": null, "kind": "mcq", "stem": "The best samples for direct parasite detection in visceral leishmaniasis are from:", "opts": ["Bone marrow, lymph nodes or blood", "Urine", "Stool", "Skin scrapings from the face"], "key": 0, "exp": "Trigger: \"Samples in VL: from bone marrow, L.Ns or blood.\"", "src": "printed 377"}, {"n": 31, "img": null, "kind": "mcq", "stem": "A Giemsa- or Leishman-stained bone marrow smear from a suspected kala azar patient shows small oval bodies with nucleus and kinetoplast inside macrophages. These are:", "opts": ["Promastigotes", "Morula cells", "Trypomastigotes", "Amastigotes (Leishmania bodies) - the diagnostic stage"], "key": 3, "exp": "Trigger: \"Stained by Giemsa or Leishman: to detect amastigotes inside macrophages.\"", "src": "printed 377"}, {"n": 32, "img": null, "kind": "mcq", "stem": "To demonstrate promastigotes in the laboratory, the sample is cultured on:", "opts": ["DCA agar", "Selenite broth", "NNN medium (rabbit blood agar)", "MacConkey agar"], "key": 2, "exp": "Trigger: \"Cultured on NNN medium (Rabbit blood agar): to detect promastigotes.\"", "src": "printed 377"}, {"n": 33, "img": null, "kind": "mcq", "stem": "Animal inoculation in suspected leishmaniasis uses hamsters in order to:", "opts": ["Perform xenodiagnosis", "Differentiate old from new world species", "Produce the vaccine", "Increase the number of parasites"], "key": 3, "exp": "Trigger: \"Animal inoculation (in hamsters): to increase the number of parasites.\"", "src": "printed 377"}, {"n": 34, "img": null, "kind": "mcq", "stem": "The Montenegro (Leishmanin) intradermal test uses which antigen, and when is it read?", "opts": ["Dead amastigotes; read after 20 minutes", "Soluble exotoxin; read immediately", "Dead or live-attenuated promastigotes; read after 2 days (delayed hypersensitivity)", "Live trypomastigotes; read after 4 weeks"], "key": 2, "exp": "Trigger: \"Antigen used: dead or live - attenuated promastigotes. It is a delayed hypersensitivity reaction (read after 2 days).\"", "src": "printed 377"}, {"n": 35, "img": null, "kind": "mcq", "stem": "The drug used for ALL types of leishmaniasis is:", "opts": ["Benzonidazole", "Metronidazole", "Pentamidine", "Pentostam I.M. or I.V."], "key": 3, "exp": "Trigger: \"Treatment: 1-Pentostam I.M. or I.V.: For all types of Leishmaniasis.\"", "src": "printed 378"}, {"n": 36, "img": null, "kind": "mcq", "stem": "Control of leishmaniasis includes destruction of stray dogs because they are:", "opts": ["The definitive hosts", "Reservoir hosts for mucocutaneous leishmaniasis", "Mechanical carriers of sand flies", "Vectors of visceral leishmaniasis"], "key": 1, "exp": "Trigger: \"3- Destruction of stray dogs (reservoir hosts for MCL).\"", "src": "printed 378"}, {"n": 37, "img": null, "kind": "mcq", "stem": "T. brucei gambiense and T. brucei rhodesiense differ in that:", "opts": ["Both are zoonoses of East Africa", "Gambiense is zoonotic and acute; rhodesiense is chronic", "Gambiense occurs in the Americas", "Gambiense causes chronic infection in West & Central Africa with man as the only host; rhodesiense causes acute illness in East & South Africa as a zoonosis"], "key": 3, "exp": "Trigger: \"1- T. brucei gambiense: West & Central Africa, causes chronic infection, man is the only host. 2- T. brucei rhodesiense: East & South Africa, causes acute illness, zoonotic disease.\"", "src": "printed 378"}, {"n": 38, "img": "tsetse", "kind": "mcq", "stem": "The vector of African trypanosomiasis is:", "opts": ["The sand fly", "The reduviid bug", "The Anopheles mosquito", "The Glossina (tsetse) fly"], "key": 3, "exp": "Trigger: \"Vector: Glossina fly (tse tse fly).\"", "src": "printed 378"}, {"n": 39, "img": "tbrucei-smear", "kind": "mcq", "stem": "This blood film shows the infective stage inoculated by the tsetse fly. That stage is the:", "opts": ["Promastigote", "Epimastigote", "Amastigote", "Metacyclic trypomastigote"], "key": 3, "exp": "Trigger: \"Infective stage: Metacyclic trypomastigotes.\" Habitat: blood, lymphatics, brain.", "src": "printed 379"}, {"n": 40, "img": null, "kind": "mcq", "stem": "Routes of transmission of African trypanosomiasis include all of the following EXCEPT:", "opts": ["Contamination of the bite wound by vector faeces", "Accidental laboratory infection", "Bite of infected Glossina", "Transplacental transmission"], "key": 0, "exp": "Trigger: \"Transmission: Bite of infected Glossina species. Transplacental transmission. Direct mechanical transmission. Accidental laboratory infection.\" Faecal contamination of the wound is T. cruzi (posterior station).", "src": "printed 379"}, {"n": 41, "img": "chancre", "kind": "mcq", "stem": "A patient returning from East Africa has a painless indurated nodule at a bite site, intermittent fever, pruritus, urticaria and anemia. This early (blood) stage lesion is called:", "opts": ["A chancre", "An oriental sore", "An eschar", "A chagoma"], "key": 0, "exp": "Trigger: \"Early stage: Chancre (painless, indurated nodule). Intermittent fever, pruritus, urticaria, anemia.\"", "src": "printed 380"}, {"n": 42, "img": "winterbottom", "kind": "mcq", "stem": "Enlarged, painless, mobile posterior cervical lymph nodes (Winterbottom's sign) are characteristic of:", "opts": ["T. b. rhodesiense", "T. b. gambiense", "L. donovani", "T. cruzi"], "key": 1, "exp": "Trigger: \"in T. b. gambiense: Cervical (Winter buttom's sign): enlarged, painless, mobile post. Cervical LN.\"", "src": "printed 380"}, {"n": 43, "img": null, "kind": "mcq", "stem": "In T. b. rhodesiense infection, the generalized symmetrical lymphadenopathy involves which groups?", "opts": ["Posterior cervical", "Periauricular", "Axillary and inguinal", "Mesenteric"], "key": 2, "exp": "Trigger: \"in T. b. rhodesiense: Axillary and inguinal\" (contrast gambiense: cervical, Winterbottom's sign).", "src": "printed 380"}, {"n": 44, "img": null, "kind": "mcq", "stem": "All of the following belong to the late CNS stage of sleeping sickness EXCEPT:", "opts": ["Rose spots on the abdomen", "Behavioral changes, depression and psychosis", "Persistent headache, anorexia and weight loss", "Tremors, speech disorders and ataxia"], "key": 0, "exp": "Trigger: late stage list: headache, anorexia, weight loss, seizures (children), tremors, speech disorders, ataxia, rigidity, hemiparesis, behavioral changes, Kerandel sign, stupor and coma. Rose spots = typhoid.", "src": "printed 381"}, {"n": 45, "img": null, "kind": "mcq", "stem": "Kerandel sign in African trypanosomiasis is:", "opts": ["Delayed pain on compression of soft tissue", "Enlarged posterior cervical nodes", "Unilateral periorbital edema", "A painless skin nodule"], "key": 0, "exp": "Trigger: \"Kerandel sign (delayed pain on compression on soft tissue).\"", "src": "printed 381"}, {"n": 46, "img": null, "kind": "mcq", "stem": "In the late stage of sleeping sickness, hemiparesis has a slower onset in which type?", "opts": ["Neither type", "The West African (gambiense) type", "Both types equally", "The East African (rhodesiense) type"], "key": 1, "exp": "Trigger: \"hemiparesis (slower onset in west type).\"", "src": "printed 381"}, {"n": 47, "img": null, "kind": "mcq", "stem": "CSF findings diagnostic of late-stage African trypanosomiasis include all of the following EXCEPT:", "opts": ["Presence of Morula cells", "WBC count below 5 cells/mm3", "IgM more than 4 times the normal value", "Increased total proteins"], "key": 1, "exp": "Trigger: \"CSF analysis: WBC count > 5 cells/mm. IgM > 4 times normal value. Increased total proteins. Presence of Morula cells.\"", "src": "printed 381"}, {"n": 48, "img": null, "kind": "mcq", "stem": "Direct diagnosis of African trypanosomiasis uses fresh preparations from all of the following EXCEPT:", "opts": ["CSF and chancre aspirate", "Bone marrow and lymph node aspirate", "Stool", "Blood"], "key": 2, "exp": "Trigger: \"Fresh preparations (blood, CSF, chancre, bone marrow, L.N. aspirate).\"", "src": "printed 381"}, {"n": 49, "img": null, "kind": "mcq", "stem": "Which immunodiagnostic technique is used for African trypanosomiasis?", "opts": ["Frei", "Montenegro", "Widal", "CATT"], "key": 3, "exp": "Trigger: \"Immunodiagnostic techniques as: CATT, IHAT, IFAT, ELISA.\"", "src": "printed 381-382"}, {"n": 50, "img": null, "kind": "mcq", "stem": "A patient with sleeping sickness has CNS involvement. The correct treatment is:", "opts": ["Melarsoprol I.V", "Pentamidine I.V", "Suramin", "Pentostam"], "key": 0, "exp": "Trigger: \"Treatment: In acute stage: Pentamidine I.V; CNS involvement: Melarsoprol I.V.\"", "src": "printed 382"}, {"n": 51, "img": null, "kind": "mcq", "stem": "Chemoprophylaxis of African trypanosomiasis is:", "opts": ["Pentamidine for T. gambiense and Suramin for T. rhodesiense", "Suramin for gambiense and pentamidine for rhodesiense", "Benzonidazole for both", "Melarsoprol for both"], "key": 0, "exp": "Trigger: \"Chemoprophylaxis: T. gambiense: Pentamidine; T. rhodesiense: Suramin.\"", "src": "printed 382"}, {"n": 52, "img": null, "kind": "mcq", "stem": "T. cruzi (Chagas' disease) is found in:", "opts": ["East and South Africa", "Central and South America", "West and Central Africa", "Southern Europe"], "key": 1, "exp": "Trigger: \"Trypanosoma cruzi American Trypanosome, Chagas' Disease. Geographical distribution: Central and South America.\"", "src": "printed 383"}, {"n": 53, "img": null, "kind": "mcq", "stem": "Chagas' disease is a zoonosis whose reservoir hosts include all of the following EXCEPT:", "opts": ["Wild animals and armadillos", "Rodents", "Stray dogs only, with no wild reservoirs", "Domestic animals, cats, dogs and pigs"], "key": 2, "exp": "Trigger: \"Reservoir hosts: Domestic animals, cats, dogs, pigs, wild animals, Armadillos and rodents. So, it is a zoonotic disease.\"", "src": "printed 383"}, {"n": 54, "img": "triatoma", "kind": "mcq", "stem": "This vector (a winged bug that attacks the face, called the kissing bug) transmits:", "opts": ["Leishmania braziliensis", "Rickettsia", "T. brucei gambiense", "T. cruzi"], "key": 3, "exp": "Trigger: \"Insect vector: Reduviid bug Triatoma megista (winged bug), kissing bug because it attacks face.\"", "src": "printed 383"}, {"n": 55, "img": "tcruzi-trypo", "kind": "mcq", "stem": "In man, the bloodstream form of T. cruzi is:", "opts": ["A promastigote", "A pleomorphic dividing form", "An intracellular amastigote", "A monomorphic C- or S-shaped trypomastigote, about 20u, extracellular and non-dividing"], "key": 3, "exp": "Trigger: \"Trypomastigote form (one shape only monomorphic). Present in blood only (extracellular). C or S shaped about 20 u in length... Non-dividing form.\"", "src": "printed 384"}, {"n": 56, "img": null, "kind": "mcq", "stem": "The actively dividing form of T. cruzi in human tissues is:", "opts": ["The epimastigote", "The bloodstream trypomastigote", "The metacyclic form", "The amastigote (leishmanoid) form, dividing by simple binary fission in RES and heart muscle"], "key": 3, "exp": "Trigger: \"Amastigote form Leishmanoid form (intracellular). Present in tissues (RES- heart muscle). Actively dividing by simple binary fission.\"", "src": "printed 384"}, {"n": 57, "img": null, "kind": "mcq", "stem": "Human infection with T. cruzi occurs mainly when:", "opts": ["Glossina injects trypomastigotes", "Metacyclic forms in the stool of Triatoma megista contaminate the bite wound (posterior station)", "The bug injects metacyclic forms with its saliva", "Sand flies regurgitate promastigotes"], "key": 1, "exp": "Trigger: \"Contamination of bite wound by metacyclic forms in stool of Triatoma megista. This infection is called posterior station... usually defecates during biting.\"", "src": "printed 384-385"}, {"n": 58, "img": null, "kind": "mcq", "stem": "Routes of T. cruzi transmission include all of the following EXCEPT:", "opts": ["Organ transplant", "Blood transfusion", "Congenital (intrauterine) infection", "Bite of the tsetse fly"], "key": 3, "exp": "Trigger: routes = vector faecal contamination, blood transfusion, congenital, accidental laboratory, organ transplant.", "src": "printed 385"}, {"n": 59, "img": null, "kind": "mcq", "stem": "T. cruzi is described as an opportunistic parasite because it:", "opts": ["Requires a co-infection with Leishmania", "Only infects children", "Can produce severe fatal disease in immunosuppressed patients", "Cannot infect healthy people"], "key": 2, "exp": "Trigger: \"Trypanosoma cruzi is an opportunistic parasite as it can produce severe fatal disease in immunosuppressed patients.\"", "src": "printed 385"}, {"n": 60, "img": "tcruzi-lifecycle", "kind": "mcq", "stem": "Inside the Triatoma vector, ingested trypomastigotes transform first into which form in the midgut?", "opts": ["Promastigotes", "Amastigotes", "Epimastigotes", "Metacyclic trypomastigotes"], "key": 2, "exp": "Trigger: \"The ingested trypomastigotes transform into epimastigotes in the vector's midgut... pass to hindgut where they are differentiated into infective metacyclic trypomastigotes.\"", "src": "printed 385"}, {"n": 61, "img": null, "kind": "mcq", "stem": "A key difference between T. cruzi and African trypanosomes is that bloodstream trypomastigotes of T. cruzi:", "opts": ["Are the infective stage for man", "Multiply rapidly in blood", "Are intracellular", "Do not replicate in the blood"], "key": 3, "exp": "Trigger: \"The blood stream trypomastigotes do not replicate (different from the African trypanosomes).\"", "src": "printed 386"}, {"n": 62, "img": null, "kind": "mcq", "stem": "Mega-intestine and heart aneurysms in chronic Chagas' disease result from:", "opts": ["Hypersensitivity to remnant antigens", "Intracellular amastigotes destroying the intramural neurons of the autonomic nervous system", "RES hyperplasia of the viscera", "Direct bloodstream trypomastigote invasion"], "key": 1, "exp": "Trigger: \"Clinical manifestations can result from the intracellular amastigotes which destroy the intramural neurons of the autonomic nervous system in the intestine and heart, leading to mega-intestine and heart aneurysms.\"", "src": "printed 386"}, {"n": 63, "img": null, "kind": "mcq", "stem": "A child in South America develops a local skin nodule at an inoculation site after a bug bite. When the inoculation site is the conjunctiva, the picture of unilateral periorbital edema, conjunctivitis and periauricular lymphadenitis is called:", "opts": ["Montenegro sign", "Kerandel sign", "Romana's sign", "Winterbottom's sign"], "key": 2, "exp": "Trigger: \"a local skin nodule called a Chagoma... When the inoculation site is the conjunctival mucous membranes... unilateral periorbital edema, conjunctivitis, and periauricular lymphadenitis. This picture is called Romana's sign.\"", "src": "printed 387"}, {"n": 64, "img": null, "kind": "mcq", "stem": "The most serious manifestation of chronic Chagas' disease is:", "opts": ["Dementia", "Megacolon", "Cardiomyopathy", "Megaesophagus"], "key": 2, "exp": "Trigger: \"damage to the heart muscle (cardiomyopathy, the most serious manifestation), and sometimes dilation of the digestive tract (megacolon and mega esophagus).\"", "src": "printed 387"}, {"n": 65, "img": null, "kind": "mcq", "stem": "In Chagas' disease, direct diagnostic methods are the mainstay in the ACUTE stage because:", "opts": ["Parasites are present in blood, whereas in chronic disease blood parasites are very scanty", "Xenodiagnosis works only acutely", "The chronic stage has no symptoms", "Antibodies are absent in chronic disease"], "key": 0, "exp": "Trigger: \"In acute Chagas' disease, we depend mainly on direct methods. In chronic Chagas' disease we depend mainly on indirect methods as the parasite in blood is very scanty.\"", "src": "printed 387"}, {"n": 66, "img": null, "kind": "mcq", "stem": "Xenodiagnosis for Chagas' disease means:", "opts": ["Culturing blood on NNN medium", "Inoculating hamsters to increase parasite numbers", "Detecting Morula cells in CSF", "Feeding uninfected winged bugs on the patient's blood and examining their gut contents for parasites 4 weeks later"], "key": 3, "exp": "Trigger: \"Xenodiagnosis where uninfected winged bugs are fed on the patient's blood, and their gut contents examined for parasites 4 weeks later.\"", "src": "printed 388"}, {"n": 67, "img": null, "kind": "mcq", "stem": "Indirect methods of diagnosis of chronic Chagas' disease include all of the following EXCEPT:", "opts": ["Indirect hemagglutination", "Direct microscopic examination of anticoagulated blood", "Immunoblot technique and PCR", "Complement fixation"], "key": 1, "exp": "Trigger: \"Indirect methods of diagnosis: 1- Indirect hemagglutination 2- Complement fixation. 3- Immunoblot technique to detect antibodies. 4- PCR.\"", "src": "printed 388"}, {"n": 68, "img": null, "kind": "mcq", "stem": "The drugs of choice for Chagas' disease, most effective in the early acute stage, are:", "opts": ["Pentamidine or suramin", "Pentostam", "Benzonidazole or nifurtimox", "Melarsoprol"], "key": 2, "exp": "Trigger: \"The drugs of choice are benzonidazole or nifurtimox. In the late chronic stages... treatment focuses on managing the symptoms.\"", "src": "printed 388"}, {"n": 69, "img": null, "kind": "mcq", "stem": "An HIV patient in Brazil develops severe fatal myocarditis with C- or S-shaped non-dividing forms in blood and dividing amastigotes in heart muscle. The parasite is opportunistic, transmitted by the kissing bug. The dividing tissue stage is the:", "opts": ["Amastigote", "Epimastigote", "Trypomastigote", "Metacyclic form"], "key": 0, "exp": "Trigger: T. cruzi is opportunistic in immunosuppressed; \"Amastigote form... Present in tissues (RES- heart muscle). Actively dividing by simple binary fission.\"", "src": "printed 384-385"}, {"n": 70, "img": null, "kind": "mcq", "stem": "Which pairing of disease, vector, and infective route is correct?", "opts": ["Chagas' disease - Triatoma - faecal contamination of the bite wound", "Sleeping sickness - Glossina - faecal contamination of the wound", "Kala azar - Phlebotomus - transplacental only", "Cutaneous leishmaniasis - Lutzomyia - amastigote injection"], "key": 0, "exp": "Trigger: T. cruzi \"posterior station\" via Triatoma faeces; T. brucei via Glossina bite; Leishmania via sand fly injection of promastigotes.", "src": "printed 371-385"}, {"n": 71, "img": null, "kind": "mcq", "stem": "Which form is shared as a diagnostic intracellular stage inside macrophages/RES cells in BOTH leishmaniasis and Chagas' disease?", "opts": ["Promastigote", "Epimastigote", "Amastigote", "Metacyclic trypomastigote"], "key": 2, "exp": "Trigger: Leishmania amastigote = diagnostic stage inside RES cells; T. cruzi amastigote (leishmanoid) in tissues (RES - heart muscle).", "src": "printed 369-384"}, {"n": 72, "img": "leish-lifecycle", "kind": "mcq", "stem": "Which figure shows the life cycle in which promastigotes are injected into man by the sand fly and transform into amastigotes inside RES cells?", "opts": ["The T. cruzi life cycle", "The Plasmodium life cycle", "The T. brucei life cycle", "The Leishmania life cycle"], "key": 3, "exp": "Trigger: Fig \"Leishmania life cycle\" + text: sandflies transmit promastigotes, which invade RES cells and transform into amastigotes.", "src": "printed 370"}, {"n": 73, "img": "sandfly", "kind": "mcq", "stem": "The vector shown is a yellow small fly whose bite transmits promastigotes into human skin. It is the vector of:", "opts": ["Chagas' disease", "Leishmaniasis", "Sleeping sickness", "Malaria"], "key": 1, "exp": "Trigger: sand fly photo; \"transmitted to man (definitive host) through bite of 'Sand fly'; a yellow small fly.\"", "src": "printed 368-371"}, {"n": 74, "img": "tbrucei-lifecycle", "kind": "mcq", "stem": "In the T. brucei life cycle figure, man acquires infection when the tsetse fly:", "opts": ["Injects metacyclic trypomastigotes while taking a blood meal", "Deposits faeces containing metacyclic forms on the wound", "Lays eggs on the skin", "Transmits amastigotes into RES cells"], "key": 0, "exp": "Trigger: \"Infective stage: Metacyclic trypomastigotes. Transmission: Bite of infected Glossina species.\"", "src": "printed 379-380"}, {"n": 75, "img": null, "kind": "mcq", "stem": "A tourist in West Africa develops chronic sleeping sickness over months. Compared with the East African form, his illness is expected to be:", "opts": ["Acute and zoonotic", "Associated with Romaña's sign", "Chronic, with man as the only host, and slower-onset hemiparesis", "Treated with benzonidazole"], "key": 2, "exp": "Trigger: gambiense = West & Central Africa, chronic, man only host; \"hemiparesis (slower onset in west type)\".", "src": "printed 378-381"}]
const app=document.getElementById('app');
