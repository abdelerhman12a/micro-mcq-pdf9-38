const Q=[{"n": 1, "stem": "Which feature is NOT shared by all Enterobacteriaceae?", "opts": ["Facultative anaerobes", "Lactose fermentation", "Oxidase negative", "Ferment glucose"], "key": 1, "exp": "Trigger: \"facultative anaerobes, oxidase negative, all ferment glucose, reduce nitrate to nitrite\"; lactose fermentation is variable.", "src": "Theory book PDF 63 (printed 56)", "cue": "general features", "ask": "Which feature is NOT shared by all Enterobacteriaceae?", "distinguish": "Lactose fermentation is the differentiating character, not a shared one."}, {"n": 2, "stem": "Enterobacteriaceae reduce nitrate to", "opts": ["Nitrogen gas", "Nitrite", "Ammonia", "Nitrate is not reduced"], "key": 1, "exp": "Trigger: \"They reduce nitrate to nitrite\".", "src": "Theory book PDF 63 (printed 56)", "cue": "nitrate", "ask": "Enterobacteriaceae reduce nitrate to", "distinguish": "Fourth shared feature with glucose fermentation."}, {"n": 3, "stem": "Which group are the opportunistic pathogens?", "opts": ["Escherichia, Klebsiella, Enterobacter, Citrobacter, Serratia, Proteus", "Vibrio only", "Salmonella, Shigella, Yersinia", "Campylobacter"], "key": 0, "exp": "Trigger: \"Most Enterobacteriaceae as Escherichia, Klebsiella, Enterobacter, Citrobacter, Serratia & Proteus. Commensals\".", "src": "Theory book PDF 63 (printed 56)", "cue": "opportunistic genera", "ask": "Which group are the opportunistic pathogens?", "distinguish": "Pathogenic genera: Salmonella, Shigella, Yersinia, some E. coli."}, {"n": 4, "stem": "The truly pathogenic Enterobacteriaceae genera are", "opts": ["Klebsiella and Proteus", "Salmonella, Shigella, Yersinia and certain E. coli strains", "Enterobacter only", "Citrobacter and Serratia"], "key": 1, "exp": "Trigger: \"The pathogenic genera: Salmonella, Shigella & Yersinia, & certain strains of E. coli\".", "src": "Theory book PDF 63 (printed 56)", "cue": "pathogenic genera", "ask": "The truly pathogenic Enterobacteriaceae genera are", "distinguish": "They primarily cause intestinal and systemic disease."}, {"n": 5, "stem": "Lactose fermenters (coliforms) include", "opts": ["Proteus, Salmonella, Shigella, Yersinia", "Vibrio and Yersinia", "Escherichia, Klebsiella, Citrobacter, Enterobacter, Serratia", "Salmonella and Shigella"], "key": 2, "exp": "Trigger: \"LF: Escherichia, Klebsiella, Citrobacter, Enterobacter, and Serratia\".", "src": "Theory book PDF 63 (printed 56)", "cue": "lactose fermenters", "ask": "Lactose fermenters (coliforms) include", "distinguish": "LNF: Proteus, Salmonella, Shigella, Yersinia."}, {"n": 6, "stem": "Lactose NON-fermenters include", "opts": ["Escherichia and Klebsiella", "Proteus, Salmonella, Shigella, Yersinia", "Citrobacter and Enterobacter", "Serratia"], "key": 1, "exp": "Trigger: \"The lactose non-fermenters: Proteus, Salmonella, Shigella and Yersinia\".", "src": "Theory book PDF 64 (printed 57)", "cue": "LNF genera", "ask": "Lactose NON-fermenters include", "distinguish": "Coliforms = lactose fermenters."}, {"n": 7, "stem": "The term \"coliform bacilli\" refers to", "opts": ["Vibrios", "Spore-forming bacilli", "Lactose non-fermenters", "Lactose-fermenting commensal intestinal bacilli"], "key": 3, "exp": "Trigger: \"Termed coliform bacilli, live as commensals in the intestine\".", "src": "Theory book PDF 64 (printed 57)", "cue": "coliform", "ask": "The term \"coliform bacilli\" refers to", "distinguish": "They cause disease if they change habitat."}, {"n": 8, "stem": "The most predominant facultative anaerobe in the human large intestine is", "opts": ["Klebsiella", "E. coli", "Bacteroides", "Salmonella"], "key": 1, "exp": "Trigger: \"E. coli is the most predominant facultative anaerobe in the large intestine of man\".", "src": "Theory book PDF 64 (printed 57)", "cue": "predominant flora", "ask": "The most predominant facultative anaerobe in the human large intestine is", "distinguish": "Bacteroides is anaerobic."}, {"n": 9, "stem": "E. coli on MacConkey agar gives", "opts": ["Black colonies" ue": "K1 meningitis", "ask": "The common cause of neonatal meningitis is E. coli", "distinguish": "K1 antigen is detected in CSF by latex agglutination."}, {"n": 19, "stem": "The source of E. coli causing UTI is", "opts": ["Contaminated water", "Sexual partner", "Raw milk", "The patient's own colonic flora"], "key": 3, "exp": "Trigger: \"patient's own colonic flora that colonizes uro-genital area\".", "src": "Theory book PDF 65 (printed 58)", "cue": "UTI source", "ask": "The source of E. coli causing UTI is", "distinguish": "Endogenous infection."}, {"n": 20, "stem": "Which E. coli type causes severe watery diarrhea in infants and travellers' diarrhea?", "opts": ["EPEC", "EIEC", "EHEC", "ETEC"], "key": 3, "exp": "Trigger: Table 1.6: ETEC severe watery diarrhea in infants, traveller's diarrhea in adults.", "src": "Theory book PDF 66 (printed 59)", "cue": "ETEC", "ask": "Which E. coli type causes severe watery diarrhea in infants and travellers' diarrhea?", "distinguish": "EPEC = infantile watery diarrhea by tight adherence."}, {"n": 21, "stem": "Which E. coli causes bloody diarrhea with HUS complication?", "opts": ["EHEC (O157:H7)", "ETEC", "EPEC", "EaggEC"], "key": 0, "exp": "Trigger: Table 1.6: EHEC verotoxin, hemorrhagic colitis, haemolytic uraemic syndrome.", "src": "Theory book PDF 66 (printed 59)", "cue": "EHEC HUS", "ask": "Which E. coli causes bloody diarrhea with HUS complication?", "distinguish": "EIEC is also bloody but without toxin."}, {"n": 22, "stem": "Most common serotype of EHEC is", "opts": ["O1", "O139", "O157:H7", "K1"], "key": 2, "exp": "Trigger: \"most commonly by E. coli serotype O157:H7\".", "src": "Theory book PDF 66 (printed 59)", "cue": "O157:H7", "ask": "Most common serotype of EHEC is", "distinguish": "Source bovine fecal contamination."}, {"n": 23, "stem": "Sources of EHEC infection include", "opts": ["Raw or undercooked meat, unpasteurized milk, raw vegetables", "Canned fish", "Reheated rice", "Honey"], "key": 0, "exp": "Trigger: \"Bovine fecal contamination of raw/undercooked meat (hamburger), unpasteurized milk, raw vegetables\".", "src": "Theory book PDF 66 (printed 59)", "cue": "EHEC sources", "ask": "Sources of EHEC infection include", "distinguish": "Bovine fecal contamination."}, {"n": 24, "stem": "EIEC causes", "opts": ["Dysentery-like bloody diarrhea by invading colonic mucosa without toxin", "Persistent watery diarrhea in children", "Watery diarrhea by tight adherence", "Traveller's diarrhea"], "key": 0, "exp": "Trigger: Table 1.6: EIEC invasion of colon mucosa, without toxin production, bloody diarrhea.", "src": "Theory book PDF 66 (printed 59)", "cue": "EIEC", "ask": "EIEC causes", "distinguish": "Invasion without toxin."}, {"n": 25, "stem": "EPEC pathogenesis is", "opts": ["Verotoxin", "Invasion", "Tight adherence to intestinal mucosa interfering with water absorption", "LT and ST toxin"], "key": 2, "exp": "Trigger: Table 1.6: EPEC tight adherence... watery diarrhea in infants.", "src": "Theory book PDF 66 (printed 59)", "cue": "EPEC", "ask": "EPEC pathogenesis is", "distinguish": "Infantile diarrhea."}, {"n": 26, "stem": "Enteroaggregative E. coli (EaggEC) cause", "opts": ["Bloody diarrhea", "Dysentery", "Haemolytic uraemic syndrome", "Persistent watery diarrhea in children by aggregative fimbriae and enterotoxin"], "key": 3, "exp": "Trigger: Table 1.6: EaggEC aggregative fimbria + enterotoxin, persistent watery diarrhea in children.", "src": "Theory book PDF 66 (printed 59)", "cue": "EaggEC", "ask": "Enteroaggregative E. coli (EaggEC) cause", "distinguish": "Persistent."}, {"n": 27, "stem": "Which test detects K1 antigen in neonatal meningitis?", "opts": ["ELISA on stool", "Urease test", "Widal", "Latex agglutination on CSF"], "key": 3, "exp": "Trigger: \"E. coli K1 antigen is detected in CSF by latex agglutination\".", "src": "Theory book PDF 67 (printed 60)", "cue": "K1 detection", "ask": "Which test detects K1 antigen in neonatal meningitis?", "distinguish": "Gram stain useful only in sterile specimens like CSF."}, {"n": 28, "stem": "Why must E. coli from stool of diarrheic patients be further tested?", "opts": ["It is always EHEC", "It is part of normal flora", "It is not lactose fermenting", "It cannot be cultured"], "key": 1, "exp": "Trigger: \"Because E. coli is part of the normal intestinal flora, strains from faeces... should be tested\".", "src": "Theory book PDF 67 (printed 60)", "cue": "stool E. coli", "ask": "Why must E. coli from stool of diarrheic patients be further tested?", "distinguish": "Slide agglutination, ELISA, DNA probe/PCR, tissue culture."}, {"n": 29, "stem": "ELISA on stool E. coli is used to test for toxin production by", "opts": ["ETEC and EHEC", "All except EHEC", "EIEC only", "EPEC and EaggEC"], "key": 0, "exp": "Trigger: \"ELISA: to test for toxin production (ETEC, EHEC)\".", "src": "Theory book PDF 67 (printed 60)", "cue": "ELISA E. coli", "ask": "ELISA on stool E. coli is used to test for toxin production by", "distinguish": "Slide agglutination is for EPEC, EHEC."}, {"n": 30, "stem": "Tissue culture in E. coli diagnosis detects", "opts": ["Only toxins", "Vi antigen", "Toxin production, invasiveness (EIEC) or adherence (EPEC, EaggEC)", "Only antigens"], "key": 2, "exp": "Trigger: \"Tissue culture: toxin production (ETEC, EHEC), invasiveness (EIEC) or adherence (EPEC, EaggEC)\".", "src": "Theory book PDF 67 (printed 60)", "cue": "tissue culture", "ask": "Tissue culture in E. coli diagnosis detects", "distinguish": "One test, three properties."}, {"n": 31, "stem": "Therapy of extra-intestinal E. coli infection should be guided by", "opts": ["Vaccination", "Empirical penicillin", "Antitoxin", "In vitro susceptibility testing because of ESBL"], "key": 3, "exp": "Trigger: \"guided by in vitro susceptibility testing... widespread resistant strains especially ESBL\".", "src": "Theory book PDF 67 (printed 60)", "cue": "ESBL", "ask": "Therapy of extra-intestinal E. coli infection should be guided by", "distinguish": "  what percentage of healthy people carry Klebsiella in the respiratory tract?", "distinguish": "Prone to pneumonia if defence is lowered."}, {"n": 37, "stem": "Klebsiella ozaenae is associated with", "opts": ["Atrophic rhinitis", "UTI", "Pneumonia", "Rhinoscleroma"], "key": 0, "exp": "Trigger: \"Klebsiella ozaenae is associated with atrophic rhinitis\".", "src": "Theory book PDF 69 (printed 62)", "cue": "K. ozaenae", "ask": "Klebsiella ozaenae is associated with", "distinguish": "Rhinoscleromatis = rhinoscleroma."}, {"n": 38, "stem": "Klebsiella rhinoscleromatis causes", "opts": ["Lobar pneumonia", "Rhinoscleroma, a destructive granuloma of nose and pharynx", "Atrophic rhinitis", "Neonatal meningitis"], "key": 1, "exp": "Trigger: \"rhinoscleroma, a destructive granuloma of the nose and pharynx\".", "src": "Theory book PDF 69 (printed 62)", "cue": "rhinoscleroma", "ask": "Klebsiella rhinoscleromatis causes", "distinguish": "Ozaenae is atrophic rhinitis."}, {"n": 39, "stem": "Citrobacter differs from E. coli by being", "opts": ["Lactose non-fermenting", "Motile", "Indole negative", "Citrate positive"], "key": 3, "exp": "Trigger: \"Citrobacter: like E. coli except in being citrate positive\".", "src": "Theory book PDF 69 (printed 62)", "cue": "Citrobacter", "ask": "Citrobacter differs from E. coli by being", "distinguish": "Enterobacter differs from Klebsiella by being motile."}, {"n": 40, "stem": "Enterobacter differs from Klebsiella by being", "opts": ["Citrate negative", "Capsulated", "Non-lactose fermenter", "Motile"], "key": 3, "exp": "Trigger: \"Enterobacter: like Klebsiella except in being motile\".", "src": "Theory book PDF 69 (printed 62)", "cue": "Enterobacter", "ask": "Enterobacter differs from Klebsiella by being", "distinguish": "Klebsiella is non-motile."}, {"n": 41, "stem": "Serratia strains produce", "opts": ["Green exopigment", "Black pigment", "Red non-diffusible endo-pigment used to test bacterial filters", "Yellow diffusible pigment"], "key": 2, "ex <button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
