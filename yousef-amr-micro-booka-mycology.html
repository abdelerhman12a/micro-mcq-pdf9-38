 asexually."], "key": 1, "exp": "كتاب النظري: Dimorphic character shown by double culture at 27 C and 37 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 138 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 138}, {"n": 1232, "stem": "What is the method of reproduction for yeast cells?", "opts": ["Binary fission.", "Budding.", "Spore formation.", "Sexual reproduction only."], "key": 1, "exp": "كتاب النظري: Yeasts are unicellular fungi that reproduce by budding", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 139 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 139}, {"n": 1233, "stem": "Which feature is characteristic of mold growth?", "opts": ["Single-cell growth.", "Growth by budding.", "Long filaments (hyphae) forming a mass (mycelium).", "Formation of pseudohyphae."], "key": 2, "exp": "كتاب النظري: Molds: a network of fungal hyphae or filaments (mycelium)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 142 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 142}, {"n": 1234, "stem": "Which of the following statements is true about mycotoxicosis?", "opts": ["It is caused by fungal infections in the body.", "It is caused by consuming food contaminated with fungal toxins.", "It is an allergic reaction to fungal spores.", "It is a response to fungal antigens detected in the bloodstream."], "key": 1, "exp": "كتاب النظري: Mycotoxicosis: exotoxins formed by the fungus in the medium, e.g. aflatoxin of A. flavus grown on seeds", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 136 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 136}, {"n": 1236, "stem": "Dimorphic fungi grow as molds at:", "opts": ["37°C (body temperature).", "0°C (freezing).", "Room temperature.", "Elevated pressure environments. 135"], "key": 2, "exp": "كتاب النظري: Dimorphic fungi grow as molds at 27 C (room temperature) and yeasts at 37 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 139 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 139}, {"n": 1237, "stem": "Which morphological form of fungi reproduces by budding?", "opts": ["Molds.", "Mycelium.", "Yeasts.", "Dermatophytes."], "key": 2, "exp": "كتاب النظري: Yeasts are unicellular fungi that reproduce by budding", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 139 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 139}, {"n": 1239, "stem": "There are thousands of species of fungi and most of them are saprophytes, which of the following represent one of its morphological classification?", "opts": ["Cutaneous mycoses.", "Subcutaneous mycoses.", "Systemic (endemic) mycoses.", "Dimorphic mycoses."], "key": 3, "exp": "كتاب النظري: Dimorphic fungi have two forms (morphological distinction): mold in soil/culture, yeast in host", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 138 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 138}, {"n": 1241, "stem": "Each of the following statements concerning fungi is correct, EXCEPT:", "opts": ["Yeasts are fungi that reproduce by budding.", "Molds are fungi that have elongated filaments called hyphae.", "Dimorphic fungi exist as yeasts at 25°C and as molds at 37°C.", "Both yeasts and molds have a cell wall made of Chitin."], "key": 2, "exp": "كتاب النظري: Dimorphic fungi exist as molds at 27 C and yeasts at 37 C - the option reverses the temperatures", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 139 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 139}, {"n": 1243, "stem": "Fungi that infect the immunocompromised are classified as:", "opts": ["True pathogens.", "Opportunistic pathogens.", "Commensal pathogens.", "Auto-pathogens."], "key": 1, "exp": "كتاب النظري: Opportunistic mycoses: cause disease in immunocompromised patient", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 136 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 136}, {"n": 1245, "stem": "Which of the following is a fungal toxin that may cause chronic liver damage and cancer?", "opts": ["Cholesterol.", "Aflatoxin.", "Chitin.", "Peptidoglycan. 136"], "key": 1, "exp": "كتاب النظري: A. flavus: source of aflatoxin causing liver necrosis and cancer", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 143 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 143}, {"n": 1246, "stem": "Which of the following fungi is associated with an increased risk of liver cancer due to aflatoxin exposure?", "opts": ["Cryptococcus.", "Aspergillus.", "Candida.", "Dermatophytes."], "key": 1, "exp": "كتاب النظري: A. flavus: source of aflatoxin causing liver necrosis and cancer", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 143 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 143}, {"n": 1248, "stem": "The only prokaryotic that have sterol in cell membrane is:", "opts": ["Mycoplasma.", "Gram positive bacteria.", "Rickettsia.", "Chlamydia.", "Gram negative bacteria."], "key": 0, "exp": "كتاب النظري: Mycoplasmas are the only bacteria that contain sterol (in the form of cholesterol) in the cell membrane", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 113 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 113}, {"n": 1250, "stem": "Which medium would be recommended for culturing a CSF specimen for fungi:", "opts": ["Loeffler’s serum medium.", "Blood agar.", "Modified Thayer-Martin medium.", "Sabouraud's dextrose agar.", "Lowenstein-Jensen medium."], "key": 3, "exp": "كتاب النظري: Culture of fungi on Sabouraud Dextrose Agar (SDA)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 141 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 141}, {"n": 1251, "stem": "All of the following is correct about Candida albicans, EXCEPT:", "opts": ["It causes oral thrush.", "It is a yeast fungus that replicates by budding.", "It produces germ tube in serum at 37°C after 2 hours.", "It produces chlamydospores on corn meal agar.", "It produces septate hyphae at 22°C."], "key": 4, "exp": "كتاب النظري: Candida: oval Gram-positive budding yeast with pseudohyphae; germ tube in serum; chlamydospores on corn meal agar", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 140 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 140}, {"n": 1252, "stem": "Cryptococcus neoformans has the following properties, EXCEPT:", "opts": ["The organism is present in the soil contaminated with excreta of birds.", "Infection occurs by inhalation resulting in cryptococcal pneumonia.", "The organism has a thick capsule surrounding the budding yeast cell.", "Secreted aflatoxin is hepatotoxic and carcinogenic.", "In cases of meningitis, capsular antigen can be detected in CSF."], "key": 3, "exp": "كتاب النظري: Cryptococcus: soil with bird excreta, inhaled, encapsulated yeast, capsular antigen in CSF - aflatoxin is from Aspergillus flavus", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 141 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 141}, {"n": 1253, "stem": "Which of the following organisms is a common normal flora in the oral cavity, vagina, and intestines?", "opts": ["Aspergillus fumigatus.", "Candida albicans.", "Actinomadura madurae.", "Nocardia brasiliensis. 137"], "key": 1, "exp": "كتاب النظري: Candida is a member of the normal flora", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 140 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 140}, {"n": 1254, "stem": "Which organism is involved in causing athlete’s foot (Tinea pedis)?", "opts": ["Candida albicans.", "Aspergillus fumigatus.", "Cryptococcus neoformans.", "Dermatophytes."], "key": 3, "exp": "كتاب النظري: Tinea Pedis (athlete's foot) is a dermatophyte infection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 137 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 137}, {"n": 1255, "stem": "What is the selective medium used to culture Candida albicans?", "opts": ["Blood agar.", "MacConkey agar.", "Sabouraud’s Dextrose agar (SDA).", "Chocolate agar."], "key": 2, "exp": "كتاب النظري: Candida culture on SDA", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 141 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 141}, {"n": 1256, "stem": "What type of infections are caused by Dermatophytes?", "opts": ["Mycetoma.", "Tinea/Ringworm infections.", "Candidiasis.", "Aspergillosis."], "key": 1, "exp": "كتاب النظري: Dermatophyte infection is known as ringworm or tinea", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 137 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 137}, {"n": 1257, "stem": "Which stain is used to detect Cryptococcus neoformans in a CSF smear?", "opts": ["Gram stain.", "India ink stain.", "Ziehl-Neelsen stain.", "Silver stain."], "key": 1, "exp": "كتاب النظري: Cryptococcus in CSF mounted in India ink: encapsulated budding yeasts with large gelatinous capsule", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 142 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 142}, {"n": 1258, "stem": "What is the causative agent of Tinea barbae?", "opts": ["Cryptococcus neoformans.", "Pneumocystis jiroveci.", "Dermatophytes.", "Aspergillus flavus."], "key": 2, "exp": "كتاب النظري: Tinea (including tinea barbae) is caused by dermatophytes; tinea acquires a second name by anatomical site", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 137 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 137}, {"n": 1259, "stem": "Which of the following describes the granules in Actinomycotic mycetoma?", "opts": ["Black and white.", "Yellow (sulfur).", "Thick hyphae and spores.", "Creamy white."], "key": 1, "exp": "كتاب النظري: Actinomycotic mycetoma granules: mainly yellow, white, red - never black", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 130 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 130}, {"n": 1260, "stem": "Which test differentiates Candida albicans from other Candida species?", "opts": ["India ink stain.", "Formation of germ tubes in serum.", "Growth on Sabouraud’s Dextrose agar.", "Silver staining."], "key": 1, "exp": "كتاب النظري: Candida albicans identified by germ tube <div id="cgSrc" style="display:none"><div class="cg"><h1>Topics and theory-book pages</h1><div class="tw"><table><tr><th>Topic</th><th>Questions</th><th>Theory printed pages used</th></tr><tr data-l='Topic'><td>Mycology</td><td data-l='Questions'>35 (+25 unverified)</td><td data-l='Pages'>printed pages 113, 130, 136, 137, 138, 139, 140, 141, 142, 143, 172</td></tr></table></div><div class="n">Answers marked "الإجابة من عندنا مش من الملف" are keyed from the theory book page shown, not from a printed key.</div></div></div>
<script>
const PAGE=window.__PAGE__;
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;

function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>${PAGE.title}</h2>

function show(){

 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}

function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
