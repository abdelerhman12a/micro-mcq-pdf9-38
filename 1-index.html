g.cc/Mx8fBPJp/fig26.jpg", "kind": "linked theory", "stem": "Treatment of gonorrhea per the book:", "opts": ["Ceftriaxone, single IM injection to both partners", "Penicillin for 14 days to the infected male partner", "Rifampin to the household contacts of the patient", "Vancomycin by intravenous drip to the patient"], "key": 0, "exp": "Coursebook statement.", "src": "A single intramuscular injection is given to both partners - PDF 33 (printed 25)"}, {"n": 297, "img": "https://i.postimg.cc/Mx8fBPJp/fig26.jpg", "kind": "linked theory", "stem": "Prevention of gonorrhea:", "opts": ["Polysaccharide vaccine against the capsule of the organism", "Conjugate vaccine with a protein carrier at birth", "Oral rifampin to the household contacts of the case", "Condoms/safe sex, treating infected cases, eye prophylaxis"], "key": 3, "exp": "Full statement: Condoms/safe sex, treating infected cases, eye prophylaxis; no licensed vaccine.", "src": "No licensed vaccine has been produced till now; Use of condoms and safe sex practices - PDF 33 (printed 25)"}, {"n": 298, "img": "https://i.postimg.cc/Mx8fBPJp/fig26.jpg", "kind": "short case", "stem": "A 3-day-old has purulent conjunctivitis; the mother had untreated gonorrhea. Specimen and risk if untreated?", "opts": ["Blood; arthritis", "Conjunctival swab", "CSF; deafness", "Urine; stenosis"], "key": 1, "exp": "Full statement: Conjunctival swab; keratitis and blindness.", "src": "Ophthalmia neonatorum: conjunctival swabs; can end in blindness - PDF 32 (printed 24)"}, {"n": 299, "img": "https://i.postimg.cc/Mx8fBPJp/fig26.jpg", "kind": "short case", "stem": "A maternity unit applies a prophylactic eye preparation to every newborn against gonococcal conjunctivitis. The book names:", "opts": ["Erythromycin eye ointment or drops", "Ceftriaxone eye drops given to the mother", "Oral rifampin to the neonate", "Polysaccharide vaccine drops"], "key": 0, "exp": "Erythromycin eye prophylaxis for neonates.", "src": "application of erythromycin eye ointment or eye drops to neonates; Ophthalmia neonatorum (Neonatal conjunctivitis) - PDF 31 (printed 23), PDF 33 (printed 25)"}, {"n": 300, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "from the image", "stem": "This (labelled) technique collects CSF by lumbar puncture. In meningococcal meningitis the CSF is:", "opts": ["Clear and low-pressure", "Bloody", "Under tension and turbid", "Normal"], "key": 2, "exp": "High cell count over 20 000/mm3, mainly PMNL; low glucose; high protein.", "src": "It is under tension and appears turbid - PDF 35 (printed 27)"}, {"n": 301, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "linked theory", "stem": "CSF cell count in meningococcal meningitis compared with the normal:", "opts": ["> 20 000/mm3 vs 2-5 cells/mm3, mainly pus cells", "2-5 cells/mm3 vs > 20 000/mm3, mainly pus cells", "Normal count of 2-5 cells/mm3, mainly lymphocytes", "> 20 000/mm3 vs 2-5 cells/mm3, mainly lymphocytes"], "key": 0, "exp": "", "src": "High cellular count > 20 000/mm3 - PDF 35 (printed 27)"}, {"n": 302, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "linked theory", "stem": "CSF glucose and protein in meningitis:", "opts": ["High glucose, low protein", "Low glucose, high protein", "Normal both", "High both"], "key": 1, "exp": "", "src": "Low glucose and high protein levels - PDF 35 (printed 27)"}, {"n": 303, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "linked theory", "stem": "Direct examination of CSF: Gram smear of the deposit after centrifugation shows:", "opts": ["Gram-positive diplococci with halos around cells", "Gram-positive cocci in clusters inside pus cells", "Gram-negative diplococci inside and outside pus cells", "Gram-negative rods inside and outside pus cells"], "key": 2, "exp": "The book says this picture is diagnostic and empirical antibiotics must be started immediately.", "src": "Demonstrates Gram-negative diplococci inside and outside pus cells; They appear intracellular (inside pus cells) and extracellular - PDF 32 (printed 24), PDF 33 (printed 25)"}, {"n": 304, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "linked theory", "stem": "Which test detects capsular polysaccharide of meningococci in CSF?", "opts": ["Quellung reaction", "Catalase", "Coagulase", "Latex agglutination"], "key": 3, "exp": "", "src": "A latex agglutination test can detect the capsular polysaccharide of meningococci - PDF 36 (printed 28)"}, {"n": 305, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "linked theory", "stem": "Cultivation for meningitis: CSF/blood are cultured on:", "opts": ["MSA at 37 C aerobically", "Chocolate agar at 37 C aerobically", "Bile esculin agar at 37 C", "Nutrient agar at 37 C"], "key": 1, "exp": "Subculture on chocolate agar. Full statement: Chocolate agar at 37 C aerobically; blood is also processed for blood culture.", "src": "Chocolate agar is used, incubated at 37 - PDF 36 (printed 28)"}, {"n": 306, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "short case", "stem": "A pilgrim has sudden headache, photophobia, neck rigidity, fever. CSF is turbid with PMNL, low glucose, Gram-negative diplococci. Most likely organism?", "opts": ["S. pneumoniae", "N. gonorrhoeae", "Moraxella catarrhalis", "N. meningitidis"], "key": 3, "exp": "Treat as a medical emergency; the Gram picture is diagnostic.", "src": "Demonstrates Gram-negative diplococci inside and outside pus cells; Vaccines are given to high-risk groups - PDF 32 (printed 24), PDF 37 (printed 29)"}, {"n": 307, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "linked theory", "stem": "A patient is suspected of meningitis. Which specimens are collected?", "opts": ["CSF by lumbar puncture and blood", "Throat swab from the pharynx", "Stool sample from the rectum", "Urine sample from midstream"], "key": 0, "exp": "", "src": "Cerebrospinal fluid (CSF) is withdrawn by lumbar puncture and blood; Cerebrospinal fluid (CSF) is withdrawn by lumbar puncture and blood - PDF 35 (printed 27)"}, {"n": 308, "img": "https://i.postimg.cc/DfBzkcZ2/fig27.jpg", "kind": "short case", "stem": "A young man has sudden fever and neck rigidity; the CSF is turbid and under tension. The book gives the CSF cell count as:", "opts": ["2-5 cells/mm3, mainly lymphocytes", "50-100 cells/mm3, mainly lymphocytes", "> 20 000/mm3, mainly pus cells", "Normal count with high glucose"], "key": 2, "exp": "CSF is under tension and turbid with a very high pus cell count.", "src": "High cellular count > 20 000/mm3 - PDF 35 (printed 27)"}, {"n": 309, "img": null, "kind": "text only", "stem": "Meningococci differ from gonococci in morphology by being:", "opts": ["Gram-positive", "Rod-shaped", "Capsulated", "Non-oxidase"], "key": 2, "exp": "Both appear inside and outside pus cells; meningococci utilize glucose and maltose.", "src": "however, are capsulated; glucose and maltose - PDF 33 (printed 25)"}, {"n": 310, "img": null, "kind": "text only", "stem": "The most important virulence factor of N. meningitidis is:", "opts": ["Pili for adhesion", "Polysaccharide capsule", "Porins in the outer membrane", "IgA1 protease on the surface"], "key": 1, "exp": "Antiphagocytic, enables blood invasion; 13 serogroups; the most important are A, B, C, Y and W135.", "src": "Polysaccharide capsule:; 13 serogroups - PDF 33 (printed 25), PDF 34 (printed 26)"}, {"n": 311, "img": null, "kind": "text only", "stem": "Serogroup responsible for epidemics mainly in Africa:", "opts": ["B", "C", "Y", "A"], "key": 3, "exp": "A rapidly transmissible; B, C, Y, W135 cause sporadic cases.", "src": "Serogroup A is rapidly transmissible - PDF 34 (printed 26)"}, {"n": 312, "img": null, "kind": "text only", "stem": "Meningococcal source and spread:", "opts": ["Infected cases and carriers", "Animals and ingestion of food", "Insect bites in epidemics", "Sexual contact between partners"], "key": 0, "exp": "Full statement: Infected cases and carriers; droplet infection; strict human infection.", "src": "Infected cases and carriers are the source of infection; Transmission occurs by droplet infection - PDF 34 (printed 26)"}, {"n": 313, "img": null, "kind": "text only", "stem": "Healthy meningococcal carriers are normally:", "opts": ["0.1% of the population", "50% of the population", "3-30% (up to 80% during epidemics)", "100% of the population during epidemics"], "key": 2, "exp": "Nasopharyngeal colonization.", "src": "3-30% of the population are healthy carriers - PDF 34 (printed 26)"}, {"n": 314, "img": null, "kind": "text only", "stem": "The sequence of meningococcal meningitis is:", "opts": ["Nasopharyngeal colonization, bacteremia, meningeal infection", "Gut colonization, toxemia, then meningeal infection", "Skin abscess, pneumonia, then meningeal infection", "Urethritis, bacteremia, then meningeal infection"], "key": 0, "exp": "Rapidly fatal infection.", "src": "Bacteremia ends in infection of the meninges - PDF 34 (printed 26)"}, {"n": 315, "img": null, "kind": "text only", "stem": "Meningococcemia is associated with:", "opts": ["Hemolysis, jaundice, anemia and splenomegaly with fever", "Pus in the urethra, dysuria and a morning drop", "Pharyngeal exudate, tonsil enlargement and a skin rash", "Endotoxic shock, purpura, disseminated coagulopathy"], "key": 3, "exp": "", "src": "Septicemia (meningococcemia) can ensue - PDF 35 (printed 27)"}, {"n": 316, "img": null, "kind": "text only", "stem": "Clinical picture of meningitis:", "opts": ["Dysuria, urethral discharge, fever and lower abdominal pain", "Sudden severe headache, photophobia, neck and back rigidity, projectile vomiting, high fever", "Honey-coloured crusts around the mouth with blisters and fever", "Smoky urine, facial edema, hypertension and mild proteinuria"], "key": 1, "exp": "Meningococcemia: high fever, shock, skin rash, multiorgan failure.", "src": "sudden severe headache, photophobia - PDF 35 (printed 27)"}, {"n": 317, "img": null, "kind": "text only", "stem": "Sequelae in survivors usually include:", "opts": ["Complete recovery without any neurological deficit", "Permanent neurological disability, e.g. blindness or deafness", "Valve damage and heart murmurs in survivors", "Infertility and tubal obstruction in females"], "key": 1, "exp": "", "src": "Recovered patients usually have permanent neurological disability - PDF 35 (printed 27)"}, {"n": 318, "img": null, "kind": "text only", "stem": "For carriers the specimen and medium are:", "opts": ["Nasopharyngeal swab on MTM", "CSF on chocolate agar", "Blood on chocolate agar", "Urine on MSA"], "key": 0, "exp": "Commensal Neisseria must be differentiated by biochemical reactions. Full statement: Nasopharyngeal swab on MTM (not chocolate agar).", "src": "Chocolate agar is NOT used; MTM medium is more appropriate - PDF 36 (printed 28)"}, {"n": 319, "img": null, "kind": "text only", "stem": "The meningitis case is treated as:", "opts": ["Elective, with admission to hospital after tests are done", "Delayed until the culture and susceptibility results are out", "A medical emergency: empiric antibiotics immediately", "Treated with a vaccine given at presentation to the patient"], "key": 2, "exp": "The book lists IV third-generation cephalosporin; amoxicillin added for immunocompromised.", "src": "The condition is MEDICAL EMERGENCY - PDF 37 (printed 29)"}, {"n": 320, "img": null, "kind": "text only", "stem": "Chemoprophylaxis for meningococcal contacts in the book:", "opts": ["IV ceftriaxone for the household contacts and healthcare workers", "Oral penicillin for the lab personnel during outbreaks", "A vaccine dose for the household contacts of the case", "Oral rifampin for household contacts, HCWs and lab personnel"], "key": 3, "exp": "During outbreaks. Full statement: Oral rifampin (good concentration in saliva) for household contacts, HCWs and lab personnel.", "src": "Oral rifampin is given as it achieves a good concentration in saliva - PDF 37 (printed 29)"}, {"n": 321, "img": null, "kind": "text only", "stem": "The meningococcal polysaccharide vaccine (MPV4) contains:", "opts": ["Capsular polysaccharides of A, C, Y and W135", "Capsular polysaccharide of groups B and C", "Outer membrane proteins of group B", "Toxoid of the meningococcal endotoxin"], "key": 0, "exp": "MCV4 is conjugated with a protein carrier and can be used in infants &lt; 2 years.", "src": "Quadrivalent vaccine contains the capsular polysaccharide - PDF 37 (printed 29)"}, {"n": 322, "img": null, "kind": "text only", "stem": "Why is the group B capsule not used in vaccines?", "opts": ["It is too toxic for human use", "It simulates human sialic acid and is non-immunogenic", "It is heat-labile and destroyed on storage", "It belongs to a different species"], "key": 1, "exp": "Group B outer membrane protein vaccines licensed since 2015.", "src": "simulates human sialic acid - PDF 37 (printed 29)"}, {"n": 323, "img": null, "kind": "text only", "stem": "Infection-prevention measure for health workers dealing with meningitis:", "opts": ["Contact isolation", "Airborne N95", "Droplet precautions", "No measure"], "key": 2, "exp": "Vaccines given to high-risk groups: military, school children, pilgrims. Full statement: Droplet precautions (surgical masks).", "src": "Droplet-based transmission precautions - PDF 37 (printed 29)"}, {"n": 324, "img": null, "kind": "short case", "stem": "A child with meningococcal septicemia has purpura, shock and bleeding. Which mechanism does the book list?", "opts": ["Exfoliative toxin on the skin", "Superantigen TSST-1 on T cells", "Type III hypersensitivity in glomeruli", "Endotoxic shock with disseminated coagulopathy"], "key": 3, "exp": "", "src": "associated with endotoxic shock, purpura, disseminated coagulopathy - PDF 35 (printed 27)"}, {"n": 325, "img": null, "kind": "text only", "stem": "A healthcare worker who treated a meningitis patient asks for prophylaxis. According to the book:", "opts": ["Ceftriaxone IV", "Oral rifampin", "No measure", "Penicillin vaccine"], "key": 1, "exp": "Full statement: Oral rifampin (and droplet precautions).", "src": "Given to household contacts, healthcare workers - PDF 37 (printed 29)"}, {"n": 326, "img": null, "kind": "text only", "stem": "A smear of CSF from an unvaccinated pilgrim shows Gram-negative diplococci. What does the book say about the capsule-based vaccines?", "opts": ["MPV4 covers serogroups B, C and Y", "No capsular vaccines exist for meningococci", "MCV4 is licensed for adults, not infants", "MPV4 covers serogroups A, C, Y and W135"], "key": 3, "exp": "MPV4 (polysaccharide), MCV4 (conjugate). Full statement: MPV4 covers serogroups A, C, Y and W135; group B is not capsule-based.", "src": "Polysaccharide vaccine (Meningococcal Polysaccharide Vaccine MPV4) - PDF 37 (printed 29)"}, {"n": 327, "img": null, "kind": "text only", "stem": "A military recruit is given a meningococcal vaccine that is conjugated to a carrier protein. Which does the book call it?", "opts": ["MPV4 polysaccharide vaccine, not for infants under 2 years", "Group B outer membrane protein vaccine, licensed 2015", "Protein conjugate vaccine, usable in infants under 2 years", "Live attenuated vaccine given orally to recruits"], "key": 2, "exp": "Full statement: Protein conjugate vaccine (MCV4), usable in infants under 2 years.", "src": "Protein conjugate vaccine (Meningococcal Conjugate Vaccine MCV4) - PDF 37 (printed 29)"}, {"n": 328, "img": null, "kind": "text only", "stem": "Meningococcal pili, lipooligosaccharide, outer membrane proteins and IgA1 protease are respectively:", "opts": ["Adhesion, endotoxin, adhesion, IgA1 degradation", "Endotoxin, adhesion, IgA1 degradation, adhesion", "Adhesion, adhesion, endotoxin, capsule", "Capsule, pili, endotoxin, adhesion"], "key": 0, "exp": "", "src": "Pili: mediate adhesion to epithelial cells; IgA1 protease: degrades IgA1 present in mucosal secretions, therefore - PDF 30 (printed 22), PDF 34 (printed 26)"}, {"n": 329, "img": null, "kind": "text only", "stem": "A health worker needs to know which meningococcal serogroups cause sporadic cases.", "opts": ["Serogroup A", "B, C, Y and W135", "Serogroup W135", "Serogroups D and E"], "key": 1, "exp": "Serogroup A causes epidemics.", "src": "Other serogroups e.g., B, C, Y, and W135 cause sporadic cases - PDF 34 (printed 26)"}, {"n": 330, "img": null, "kind": "text only", "stem": "During an epidemic a nasopharyngeal swab shows high carriage. What does the book give as the maximum carrier rate?", "opts": ["Up to about 80%", "Up to 5%", "Up to 15%", "Up to 100%"], "key": 0, "exp": "Normal 3-30%.", "src": "However, during epidemics, the rate may shoot up to 80% - PDF 34 (printed 26)"}, {"n": 331, "img": null, "kind": "text only", "stem": "A blood culture is positive in suspected meningococcemia. What is the next step in the book?", "opts": ["Subculture on MSA", "Subculture on bile esculin", "Subculture on chocolate agar", "No subculture"], "key": 2, "exp": "Identification: Gram stain, biochemical reactions, immunofluorescence.", "src": "Subculture is done on chocolate agar - PDF 36 (printed 28)"}, {"n": 332, "img": null, "kind": "text only", "stem": "A child in an outbreak has suspected meningitis. Which antibiotic route/class does the book list?", "opts": ["Oral penicillin", "Topical ointment", "Single oral dose of rifampin", "IV third-generation cephalosporin"], "key": 3, "exp": "The book adds amoxicillin for immunocompromised individuals. Full statement: IV third-generation cephalosporin (ceftriaxone or cefotaxime).", "src": "IV injection of a 3rd generation cephalosporin - PDF 37 (printed 29)"}, {"n": 333, "img": null, "kind": "linked theory", "stem": "How many serogroups of N. meningitidis does the book describe according to chemical composition of the capsule?", "opts": ["5", "23", "13", "80"], "key": 2, "exp": "The book then names A, B, C, Y and W135 as the most important groups.", "src": "classified into 13 serogroups; The most important groups are A, B, C, Y, and W135 - PDF 34 (printed 26)"}, {"n": 334, "img": null, "kind": "linked theory", "stem": "Which technique can help identify meningococci in a specimen using specific antibodies?", "opts": ["Catalase test", "Immunofluorescent stain", "Optochin susceptibility", "Bile solubility"], "key": 1, "exp": "The book lists Gram stain appearance, biochemical reactions and an immunofluorescent stain containing specific antibodies.", "src": "Immunofluorescent stain containing specific Abs can be used - PDF 36 (printed 28)"}, {"n": 335, "img": null, "kind": "short case", "stem": "A student in a dormitory has meningococcal meningitis. How does the book describe the source and spread?", "opts": ["Infected cases and carriers; droplet infection", "Contaminated food and water; ingestion", "Insect bite; vector spread", "Blood transfusion; parenteral spread"], "key": 0, "exp": "The organism is a strict human pathogen spread by respiratory droplets.", "src": "Infected cases and carriers are the source of infection; Transmission occurs by droplet infection - PDF 34 (printed 26)"}, {"n": 336, "img": null, "kind": "short case", "stem": "A carrier survey swabs the nasopharynx of contacts. Which medium does the book prefer for these swabs?", "opts": ["Chocolate agar without antibiotics", "Blood agar without antibiotics", "MacConkey agar", "MTM medium"], "key": 3, "exp": "The nasopharyngeal flora contaminates chocolate agar, so MTM is more appropriate.", "src": "Chocolate agar is NOT used; MTM medium is more appropriate - PDF 36 (printed 28)"}, {"n": 337, "img": null, "kind": "short case", "stem": "A traveler to the African meningitis belt has an epidemic meningitis. According to the book, the serogroup mainly responsible there is:", "opts": ["Group B", "Group D", "Group E", "Group A"], "key": 3, "exp": "Group A is the epidemic type in Africa.", "src": "Serogroup A is rapidly transmissible - PDF 34 (printed 26)"}, {"n": 338, "img": null, "kind": "short case", "stem": "A woman has no symptoms but her partner has urethritis from gonococci. The book says she is likely to be:", "opts": ["Symptomatic, with copious pus discharge", "Asymptomatic, with possible extension to the upper genital tract", "Immune to reinfection, with no extension", "Cured spontaneously, with no later sequalae"], "key": 1, "exp": "Most females with chronic gonorrhea are asymptomatic but infection may extend upward.", "src": "most cases become asymptomatic - PDF 31 (printed 23)"}, {"n": 339, "img": null, "kind": "text only", "stem": "Neisseria gonorrhoeae uses glucose and produces:", "opts": ["Acid only", "Acid and gas", "Alkali", "No product"], "key": 0, "exp": "It is oxidase-positive and aerobic with growth enhanced by 10% CO2.", "src": "Utilizes glucose with the production of acid only - PDF 30 (printed 22)"}, {"n": 340, "img": null, "kind": "text only", "stem": "The opacity protein of N. gonorrhoeae:", "opts": ["Inhibits phagosome-lysosome fusion", "Degrades IgA1", "Helps adherence to epithelial cells", "Is the capsule"], "key": 2, "exp": "The porins inhibit phagosome-lysosome fusion.", "src": "Opacity protein: helps adherence to epithelial cells - PDF 30 (printed 22)"}, {"n": 341, "img": null, "kind": "text only", "stem": "The adult vagina resists gonococci because of:", "opts": ["A thick layer of mucus protecting the cervix and vagina", "IgA1 protease secreted by the vaginal flora cells", "Acidic pH and protective microflora, particularly Lactobacilli", "The high temperature of the genital tract mucosa"], "key": 2, "exp": "Vulvovaginitis occurs in young female children due to sexual abuse.", "src": "the vagina is resistant to gonococci due to its acidic pH - PDF 30 (printed 22)"}, {"n": 342, "img": null, "kind": "text only", "stem": "The gonococcus is described as:", "opts": ["A strict human disease", "A zoonotic disease", "A free-living organism", "A plant pathogen"], "key": 0, "exp": "It is transmitted by the sexual route.", "src": "A strict human disease, transmitted from human to human - PDF 30 (printed 22)"}, {"n": 343, "img": null, "kind": "text only", "stem": "Acute gonorrhea in females presents as:", "opts": ["Scanty morning drop at the urethral opening and dysuria", "Cervicitis and urethritis with dysuria, discharge and pelvic pain", "Keratitis that may end in corneal blindness", "Arthritis and endocarditis with fever and rash"], "key": 1, "exp": "Chronic female cases are mostly asymptomatic.", "src": "Females: cervicitis and urethritis associated with dysuria, vaginal discharge, and lower abdominal pain - PDF 31 (printed 23)"}, {"n": 344, "img": null, "kind": "text only", "stem": "Extension of gonorrhea in females can reach the:", "opts": ["Epididymis and prostate", "Cornea and conjunctiva", "Meninges and brain", "Rectum, endometrium and salpinx"], "key": 3, "exp": "In males it extends to the epididymis and prostate.", "src": "Females: to the rectum, endometrium, and salpinx - PDF 31 (printed 23)"}, {"n": 345, "img": null, "kind": "text only", "stem": "Ophthalmia neonatorum is described as:", "opts": ["Chronic conjunctivitis in school children after dust", "Allergic conjunctivitis in neonates after birth", "Trachoma with scarring in older children", "Acute pyogenic conjunctivitis in neonates born to mothers with gonorrhea"], "key": 3, "exp": "It can extend to the cornea as keratitis and end in blindness.", "src": "Acute pyogenic conjunctivitis occurs in neonates born to mothers having gonorrhea - PDF 32 (printed 24)"}, {"n": 346, "img": null, "kind": "text only", "stem": "The specimen from a woman with suspected gonorrhea is:", "opts": ["Vaginal swabs", "Blood for culture", "Endocervical swabs", "Urine for culture"], "key": 2, "exp": "Vaginal swabs are not preferred due to the interfering vaginal flora.", "src": "Females: endocervical swabs (vaginal swabs are NOT preferred - PDF 32 (printed 24)"}, {"n": 347, "img": null, "kind": "text only", "stem": "In invasive disseminated gonococcal infections the specimens are:", "opts": ["Blood and synovial fluid in arthritis", "Conjunctival swab from the eye", "Urethral discharge or morning drop", "Endocervical swab from the cervix"], "key": 0, "exp": "Conjunctival swabs are for ophthalmia neonatorum.", "src": "Invasive disseminated infections: blood, synovial fluid in arthritis - PDF 32 (printed 24)"}, {"n": 348, "img": null, "kind": "text only", "stem": "Is a licensed gonococcal vaccine available per the book?", "opts": ["Yes, a polysaccharide vaccine is available now", "No licensed vaccine has been produced till now", "Yes, a conjugate vaccine is available now", "Yes, an outer membrane protein vaccine exists"], "key": 1, "exp": "Prevention depends on condoms, treating cases and eye prophylaxis.", "src": "No licensed vaccine has been produced till now - PDF 33 (printed 25)"}, {"n": 349, "img": null, "kind": "text only", "stem": "N. meningitidis utilizes which sugars with acid production?", "opts": ["Glucose", "Lactose and sucrose", "Glucose and maltose", "Maltose"], "key": 2, "exp": "Gonococci use glucose only.", "src": "it can utilizes glucose and maltose with the production of acid only - PDF 33 (printed 25)"}, {"n": 350, "img": null, "kind": "text only", "stem": "The meningococcal capsule is:", "opts": ["Non-antigenic like the hyaluronic acid capsule", "Antiphagocytic, enables blood invasion and is antigenic", "A toxin that causes shock and purpura", "An enzyme that digests IgA1 in secretions"], "key": 1, "exp": "Infection results in production of specific antibodies.", "src": "Antiphagocytic and enables invasion of blood - PDF 33 (printed 25)"}, {"n": 351, "img": null, "kind": "text only", "stem": "Meningococci appear in patient specimens:", "opts": ["Outside pus cells, in the fluid", "Inside pus cells, in vacuoles", "In long chains between the cells", "Inside and outside pus cells"], "key": 3, "exp": "They are capsulated Gram-negative diplococci.", "src": "They appear intracellular (inside pus cells) and extracellular in patients - PDF 33 (printed 25)"}, {"n": 352, "img": null, "kind": "tex hout waiting for the results of culture - PDF 36 (printed 28)"}, {"n": 372, "img": null, "kind": "short case", "stem": "In the book's lab diagnosis of meningitis (meningococcal section), a turbid CSF under tension with more than 20 000 cells/mm3 shows glucose and protein that are:", "opts": ["High glucose and low protein", "Low glucose and high protein", "Normal glucose and normal protein", "Low glucose and low protein"], "key": 1, "exp": "The cells are above 20 000/mm3.", "src": "Low glucose and high protein levels - PDF 35 (printed 27)"}, {"n": 373, "img": null, "kind": "text only", "stem": "According to the book, the most important meningococcal serogroups are:", "opts": ["A, B, C, D and E", "A, C, X, Y and Z", "A, B, C, Y and W135", "B, C, E, W135 and Y2"], "key": 2, "exp": "Serogroup A causes epidemics; the other important groups cause sporadic cases.", "src": "The most important groups are A, B, C, Y, and W135 - PDF 34 (printed 26)"}, {"n": 374, "img": null, "kind": "short case", "stem": "A student has sudden headache, neck rigidity and high fever; blood cultures grow meningococci. How does the book describe the cerebrospinal meningitis that follows bacteremia?", "opts": ["A rapidly fatal infection", "A self-limited infection of the meninges", "A slowly progressive infection over months", "A mild infection that heals without treatment"], "key": 0, "exp": "Bacteremia ends in infection of the meninges covering the brain and the spinal cord.", "src": "cerebrospinal meningitis which is a rapidly fatal infection - PDF 34 (printed 26)"}, {"n": 375, "img": null, "kind": "text only", "stem": "Besides meningitis and meningococcemia, which other manifestations does the book list for meningococcal infection?", "opts": ["Keratitis and urethritis", "Pharyngitis and otitis media", "Osteomyelitis and cellulitis", "Arthritis and endocarditis"], "key": 3, "exp": "They appear after the organism invades the blood.", "src": "Arthritis, endocarditis, etc. - PDF 35 (printed 27)"}, const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='abcd';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Infection and Immunity, PDF 9-38</h2>
<p>${Q.length} MCQs from the coursebook (Staphylococcus, Streptococcus, Enterococcus, Neisseria, Moraxella). Mixed across all topics in random order. Each question keeps its book image where it has one. Answers follow the coursebook.</p>
<p><b>Exam mode:</b> pick answers, move freely, skip and come back, then Submit to see the score, answers and explanations.</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<button class="btn" onclick="start(shuffle(Q).slice(0,50),'exam')">Exam: 50 random</button>
<button class="btn" onclick="start(Q.filter(q=>q.img),'exam')">Exam: image questions</button>
<p><b>Practice mode</b> (instant feedback after each answer):</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all</button></div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>Question ${i+1} / ${order.length}</span><span>Answered ${n}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${q.img}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">Submit</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show()}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Submit anyway?'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${wrong.length} wrong or unanswered.</p>
 <button class="btn" onclick="start(Q,'exam')">New exam</button><button class="btn g" onclick="start(wrong.map(k=>order[k]),'exam')">Redo wrong</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show wrong only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${q.img}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
home();
</script></body></html>
