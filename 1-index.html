 by a change in the penicillin-binding protein; Antimicrobial resistance in staphylococci could be - PDF 14 (printed 6)"}, {"n": 43, "img": null, "kind": "text only", "stem": "Penicillin resistance in about 90% of S. aureus is due to:", "opts": ["Acquisition of the mecA gene", "Plasmid-mediated penicillinase", "Alteration of the ribosome", "Efflux of the drug from the cell"], "key": 1, "exp": "Penicillinase-resistant penicillins were introduced to overcome it. Full statement: Plasmid-mediated penicillinase (beta-lactamase).", "src": "Occurs in about 90% of S. aureus - PDF 14 (printed 6)"}, {"n": 44, "img": null, "kind": "text only", "stem": "According to the book, the most important prevention measure in staphylococcal infection is:", "opts": ["Vaccination of healthcare workers", "Mass antibiotic prophylaxis in wards", "Hand hygiene and infection-control guidelines", "Routine mouthwash for patients"], "key": 2, "exp": "No vaccines are available yet.", "src": "The most important is hand hygiene - PDF 14 (printed 6)"}, {"n": 45, "img": null, "kind": "text only", "stem": "The book's measures for nasal carriers among healthcare workers are:", "opts": ["Systemic vancomycin given for several weeks", "Isolation of the carrier until nasal cultures clear", "Reassurance and no measure for carriers", "Mupirocin ointment or moving them to lower-risk areas"], "key": 3, "exp": "High-risk areas: neonatal nurseries, ICUs.", "src": "Nasal carriers among healthcare workers are either treated with mupirocin - PDF 14 (printed 6)"}, {"n": 46, "img": null, "kind": "text only", "stem": "S. epidermidis is mainly associated with infection of:", "opts": ["Pharyngitis in young children and adults", "Prosthetic implants such as artificial joints", "Gastroenteritis in hospitalized adults", "Meningitis in young children and adults"], "key": 1, "exp": "Normal skin flora; can infect prosthetic implants.", "src": "can cause infections of prosthetic implants - PDF 14 (printed 6)"}, {"n": 47, "img": null, "kind": "text only", "stem": "Biofilm formation by S. epidermidis protects it from:", "opts": ["Phage lysis and bacterial viruses", "Heat and drying in the environment", "Body defenses and antibiotics", "Bile salts in the intestine"], "key": 2, "exp": "Glycocalyx enables adherence to catheters; biofilm makes treatment difficult.", "src": "Biofilm formation; This protects the organism from body defenses and antibiotics - PDF 15 (printed 7)"}, {"n": 48, "img": null, "kind": "text only", "stem": "Which is NOT a reason for difficult treatment of S. epidermidis?", "opts": ["It has a vaccine-resistant capsule", "Multidrug resistance", "Protection inside biofilms", "Sequestration within prostheses"], "key": 0, "exp": "Reasons given: multidrug resistance, penicillinase, methicillin resistance, biofilm, sequestered within prostheses.", "src": "Treatment is difficult due to; Multidrug resistance, penicillinase production, and methicillin resistance - PDF 15 (printed 7)"}, {"n": 49, "img": null, "kind": "text only", "stem": "S. saprophyticus is second after E. coli as a cause of:", "opts": ["Endocarditis in elderly patients", "Pneumonia in alcoholics", "Meningitis in neonates", "UTI in sexually active young females"], "key": 3, "exp": "Honeymoon cystitis; endogenous; community-acquired.", "src": "Considered second after Escherichia coli - PDF 15 (printed 7)"}, {"n": 50, "img": null, "kind": "text only", "stem": "Resistance to novobiocin differentiates:", "opts": ["S. aureus from S. epidermidis", "S. aureus from streptococci", "S. saprophyticus from S. epidermidis", "Staphylococci from enterococci"], "key": 2, "exp": "Midstream urine is cultured.", "src": "Resistance to novobiocin differentiates it from S. epidermidis - PDF 15 (printed 7)"}, {"n": 51, "img": null, "kind": "text only", "stem": "Compared with S. saprophyticus, S. epidermidis infection is almost always:", "opts": ["Hospital-acquired", "Community-acquired", "Food-borne", "Sexually transmitted"], "key": 0, "ex , "key": 0, "exp": "Toxic shock syndrome: toxemia but no bacteremia. Full statement: Toxemia from a superantigen (TSST-1).", "src": "Represented by skin rash, fever, hypotension - PDF 12 (printed 4)"}, {"n": 56, "img": null, "kind": "short case", "stem": "A nurse carrying S. aureus in the nose works in a neonatal nursery. Which measure does the book list?", "opts": ["Vaccination of the nurse against S. aureus", "Oral vancomycin given for several weeks", "Mupirocin ointment or move to a lower-risk area", "Carriage is harmless so no measure is needed"], "key": 2, "exp": "No vaccines are available; hand hygiene is the most important measure.", "src": "moved from high-risk areas such as neonatal nurseries - PDF 14 (printed 6)"}, {"n": 57, "img": null, "kind": "text only", "stem": "Which of these is listed under the pyogenic infections of S. aureus?", "opts": ["Food poisoning", "Staphylococcal pneumonia", "Toxic shock syndrome", "Scalded skin syndrome"], "key": 1, "exp": "Pyogenic: localized, invasive, and staphylococcal pneumonia. The other three are toxin-mediated.", "src": "Staphylococcal pneumonia - PDF 11 (printed 3)"}, {"n": 58, "img": null, "kind": "text only", "stem": "The specimen sent for a staphylococcal infection is chosen according to:", "opts": ["The patient's age", "The season", "The antibiotic planned", "The site of infection"], "key": 3, "exp": "E.g. pus from abscess, wound discharge, urine, sputum, CSF, blood in invasive infection.", "src": "According to the site of infection; pus from abscess, wound discharge, urine, sputum, CSF - PDF 12 (printed 4)"}, {"n": 59, "img": null, "kind": "text only", "stem": "The coursebook states that vaccines against staphylococcal infection are:", "opts": ["Routinely given in infancy", "Given to healthcare workers", "Not available yet", "Available as a toxoid"], "key": 2, "exp": "No vaccines are available yet.", "src": "No vaccines are available yet - PDF 14 (printed 6)"}, {"n": 60, "img": null, "kind": "text only", "stem": "Targeted antibiotic therapy according to susceptibility testing is needed to:", "opts": ["Decrease antimicrobial resistance", "Avoid the need for surgical drainage", "Raise the toxin production in tissues", "Replace Gram staining of the specimen"], "key": 0, "exp": "Book: it decreases antimicrobial resistance; pus must still be surgically evacuated.", "src": "Targeted antibiotic therapy according to susceptibility testing - PDF 13 (printed 5)"}, {"n": 61, "img": null, "kind": "text only", "stem": "Identification of growth after culture uses colony morphology, Gram-stain morphology and:", "opts": ["Biochemical reactions", "Serum sodium", "Skin tests", "Complement fixation"], "key": 0, "exp": "E.g. catalase, coagulase and DNase.", "src": "Colony morphology, Microscopic morphology after Gram stain - PDF 12 (printed 4)"}, {"n": 62, "img": null, "kind": "short case", "stem": "A baby has skin blisters and peeling. Golden-yellow colonies grow on nutrient agar from the lesions. How does the toxin damage the skin?", "opts": ["Superantigen activation of many T cells and macrophages", "Protease action splitting desmosomes between epithelial cells", "Lysis of red blood cells by alpha hemolysin", "Binding of IgG to the cell surface by protein A"], "key": 1, "exp": "Exfoliative toxins are proteases acting on desmosomes of skin epithelial cells.", "src": "Toxins are proteases that destroy the desmosomes - PDF 12 (printed 4)"}, {"n": 63, "img": null, "kind": "short case", "stem": "A man has a painful localized collection of pus in the thigh with fever. The book's principle for the pus collection is:", "opts": ["Topical mupirocin on the skin", "A vaccine against S. aureus", "It has to be surgically evacuated", "Waiting for the pus to be absorbed"], "key": 2, "exp": "Abscess management in the book includes surgical evacuation of pus.", "src": "has to be surgically evacuated - PDF 13 (printed 5)"}, {"n": 64, "img": null, "kind": "short case", "stem": "A lab report shows Gram-positive cocci in clusters, catalase-positive, coagulase-positive, DNase-positive, beta-hemolytic on blood agar. The organism is:", "opts": ["S. epidermidis", "S. saprophyticus", "S. pyogenes", "S. aureus"], "key": 3, "exp": "These features identify S. aureus in the book.", "src": "the most pathogenic species - PDF 9 (printed 1)"}, {"n": 65, "img": null, "kind": "short case", "stem": "A patient with an S. aureus skin abscess later develops endocarditis and osteomyelitis. How does the book classify these?", "opts": ["Invasive infections spreading through the blood", "Localized pyogenic infections of the skin", "Toxin-mediated syndromes without bacteremia", "Food poisoning syndromes from enterotoxins"], "key": 0, "exp": "Invasive infections spread via the blood.", "src": "Invasive: the organism spreads via the blood - PDF 11 (printed 3)"}, {"n": 66, "img": null, "kind": "short case", "stem": "A ward isolate of S. aureus is resistant to methicillin. The book attributes this to:", "opts": ["Acquisition of a plasmid-mediated penicillinase enzyme", "Production of a thick polysaccharide capsule", "Release of TSST-1 as a superantigen", "Acquisition of mecA, changing the penicillin-binding protein"], "key": 3, "exp": "MRSA results from mecA, not penicillinase.", "src": "Mediated by a change in the penicillin-binding protein; Antimicrobial resistance in staphylococci could be - PDF 14 (printed 6)"}, {"n": 67, "img": null, "kind": "short case", "stem": "A hospital infection-control team investigates MRSA spreading between wards. The book's most important measure is:", "opts": ["Vaccination of staff against S. aureus", "Hand hygiene and infection-control guidelines", "Mass antibiotic prophylaxis for the patients", "Routine mouthwash for the patients"], "key": 1, "exp": "Hand hygiene and infection-control guidelines are given first for prevention.", "src": "The most important is hand hygiene - PDF 14 (printed 6)"}, {"n": 68, "img": null, "kind": "text only", "stem": "Which feature of the genus Staphylococcus is listed in the book about growth media?", "opts": ["Needs chocolate agar or enriched media", "Needs blood and CO2 to start growth", "Grows on simple ordinary media in the lab", "Grows on selective media in the lab"], "key": 2, "exp": "The genus is ordinary: it grows on simple media.", "src": "can grow on simple ordinary media in the lab - PDF 9 (printed 1)"}, {"n": 69, "img": null, "kind": "text only", "stem": "According to the book, Protein A inhibits:", "opts": ["Toxin release and spore formation", "Capsule synthesis and motility", "DNA replication and protein synthesis", "Complement activation and phagocytosis"], "key": 3, "exp": "Protein A binds IgG at the complement-binding site, so complement activation and phagocytosis are inhibited.", "src": "inhibiting complement activation and phagocytosis - PDF 10 (printed 2)"}, {"n": 70, "img": null, "kind": "text only", "stem": "The book lists staphylococcal enterotoxins as causing:", "opts": ["Food poisoning", "Scalded skin syndrome", "Toxic shock syndrome", "Hemolysis of red cells"], "key": 0, "exp": "Enterotoxins cause food poisoning; TSST-1 causes toxic shock; epidermolytic toxins cause scalded skin.", "src": "Enterotoxins: cause food poisoning - PDF 10 (printed 2)"}, {"n": 71, "img": null, "kind": "text only", "stem": "How is food contaminated in staphylococcal food poisoning, according to the book?", "opts": ["By flies carrying the organism from the stool to the food", "By the hands or nasal shedding of carriers during food processing", "By fecal contamination of the irrigation water of vegetables", "By cross-contamination from raw poultry meat in the kitchen"], "key": 1, "exp": "The source is the carrier handling the food.", "src": "Food is contaminated by the hands or nasal shedding of carriers during food processing - PDF 11 (printed 3)"}, {"n": 72, "img": null, "kind": "text only", "stem": "Staphylococcal food poisoning is described in the book as:", "opts": ["Fatal in most cases", "Needing surgical drainage", "Self-limited", "Needing vancomycin by vein"], "key": 2, "exp": "The condition is self-limited; enterotoxins are superantigens causing vomiting and watery diarrhea.", "src": "The condition is self-limited - PDF 11 (printed 3)"}, {"n": 73, "img": null, "kind": "text only", "stem": "In TSS, TSST-1 acts as a superantigen that stimulates:", "opts": ["B cells to produce large amounts of IgM", "Neutrophils to release lysosomal enzymes", "Complement to lyse the organism in blood", "An excess number of T cells and macrophages releasing cytokines"], "key": 3, "exp": "The cytokine release into the blood causes the shock picture.", "src": "stimulating an excess number of T cells and macrophages - PDF 11 (printed 3)"}, {"n": 74, "img": null, "kind": "text only", "stem": "According to the book, the main source of S. aureus infection is:", "opts": ["Carriers or infected patients", "Contaminated drinking water", "Insect vectors", "Soil"], "key": 0, "exp": "Hands of healthcare workers are an important route to hospitalized patients.", "src": "Carriers or infected patients constitute the main source of infection - PDF 11 (printed 3)"}, {"n": 75, "img": null, "kind": "text only", "stem": "Which drugs does the book list as penicillinase-resistant penicillins?", "opts": ["Ceftriaxone, cefotaxime and cefixime", "Erythromycin and azithromycin", "Methicillin, nafcillin and cloxacillin", "Linezolid and streptogramins"], "key": 2, "exp": "They were introduced to overcome penicillinase-mediated resistance.", "src": "Penicillinase-resistant penicillins were introduced to overcome this problem - PDF 14 (printed 6)"}, {"n": 76, "img": null, "kind": "text only", "stem": "According to the book, MRSA shows resistance to:", "opts": ["Vancomycin and linezolid", "All beta-lactam antimicrobials", "Streptogramins and vancomycin", "Linezolid and streptogramins"], "key": 1, "exp": "The book states resistance to all beta-lactams; its drug of choice for MRSA is vancomycin.", "src": "Confers resistance to all beta-lactam antimicrobials - PDF 14 (printed 6)"}, {"n": 77, "img": null, "kind": "text only", "stem": "According to the book, the drug of choice for VRSA is:", "opts": ["Vancomycin or teicoplanin", "Methicillin or cloxacillin", "Penicillin G or ampicillin", "Linezolid or streptogramins"], "key": 3, "exp": "The book gives vancomycin for MRSA and linezolid or streptogramins for VRSA.", "src": "The drug of choice is linezolid or streptogramins - PDF 14 (printed 6)"}, {"n": 78, "img": null, "kind": "text only", "stem": "Which measure does the book list for healthcare workers caring for patients with MRSA?", "opts": ["Droplet precautions", "Contact precautions", "Airborne isolation", "Hand washing with no precautions"], "key": 1, "exp": "Workers commit to contact precautions for infected or colonized patients.", "src": "commit to contact precautions - PDF 14 (printed 6)"}, {"n": 79, "img": null, "kind": "text only", "stem": "Typing methods named in the book for S. aureus are:", "opts": ["Optochin typing and bile typing", "Catalase typing and oxidase typing", "Molecular typing and phage typing", "Latex typing and Quellung typing"], "key": 2, "exp": "Typing is identification at the strain level and helps trace the source.", "src": "molecular and phage typing - PDF 13 (printed 5)"}, {"n": 80, "img": null, "kind": "text only", "stem": "The glycocalyx of S. epidermidis enables:", "opts": ["Adherence to prosthetic devices such as catheters", "Fermentation of mannitol in the medium", "Production of coagulase in plasma", "Lysis of red cells on blood agar"], "key": 0, "exp": "After binding to the device, multilayered growth forms a biofilm.", "src": "a polysaccharide material that enables adherence to prosthetic devices such as catheters - PDF 15 (printed 7)"}, {"n": 81, "img": null, "kind": "text only", "stem": "After S. epidermidis binds a prosthetic device, a biofilm forms by:", "opts": ["Multilayered growth", "Spore formation", "Toxin release into the blood", "Capsule loss"], "key": 0, "exp": "The biofilm protects the organism from body defenses and antibiotics.", "src": "multilayered growth occurs forming a biofilm - PDF 15 (printed 7)"}, {"n": 82, "img": null, "kind": "text only", "stem": "S. epidermidis is normally found on:", "opts": ["The urinary bladder", "The cerebrospinal fluid", "Human skin and mucous membranes", "The heart valves"], "key": 2, "exp": "It is normal flora but can infect prosthetic implants.", "src": "normal human flora on human skin and mucous membranes - PDF 14 (printed 6)"}, {"n": 83, "img": null, "kind": "text only", "stem": "The infection by S. saprophyticus is described in the book as:", "opts": ["Exogenous from contaminated food", "Endogenous", "Airborne from a carrier", "Transmitted by insects"], "key": 1, "exp": "It is an opportunistic pathogen that could be skin or genitourinary flora.", "src": "honeymoon cystitis). Infection is endogenous - PDF 15 (printed 7)"}, {"n": 84, "img": null, "kind": "text only", "stem": "The specimen for S. saprophyticus diagnosis is:", "opts": ["A throat swab from the patient", "A sputum sample from the patient", "A blood culture from the patient", "A midstream urine specimen"], "key": 3, "exp": "Resistance to novobiocin differentiates it from S. epidermidis.", "src": "A midstream urine specimen is obtained from the patient and cultivated - PDF 15 (printed 7)"}, {"n": 85, "img": null, "kind": "text only", "stem": "The book says S. saprophyticus is sensitive to:", "opts": ["Vancomycin and linezolid by injection", "Sulfamethoxazole-trimethoprim and quinolones", "Methicillin, nafcillin and cloxacillin", "Penicillin G, ampicillin and amoxicillin"], "key": 1, "exp": "These are drugs commonly used to treat urinary tract infections.", "src": "sulfamethoxazole-trimethoprim and quinolones - PDF 15 (printed 7)"}, {"n": 86, "img": null, "kind": "short case", "stem": "A woman has honeymoon cystitis and a midstream urine culture grows a novobiocin-resistant coagulase-negative staphylococcus. Which drugs does the book say it responds to?", "opts": ["Sulfamethoxazole-trimethoprim or quinolones", "Vancomycin or linezolid by injection", "Methicillin, nafcillin or cloxacillin", "Ceftriaxone, cefotaxime or cefixime"], "key": 0, "exp": "The book lists these as the usual urinary tract infection drugs.", "src": "sulfamethoxazole-trimethoprim and quinolones - PDF 15 (printed 7)"}, {"n": 87, "img": null, "kind": "short case", "stem": "A food handler with a nasal S. aureus carrier state prepares pastry for a party; guests vomit 3 hours later. Which statement is correct?", "opts": ["The organism survives boiling and the toxin is destroyed", "Heating forms a new toxin from the organism", "Both organism and toxin survive pasteurization", "The heated food is cooked but the enterotoxins persist as heat-stable"], "key": 3, "exp": "The organism is destroyed by heating, but the toxins resist boiling for 30 min.", "src": "the toxins persist as they are heat-stable and resist boiling for 30 min - PDF 11 (printed 3)"}, {"n": 88, "img": null, "kind": "short case", "stem": "A hospitalized patient with a staphylococcal wound infection is positive for methicillin resistance. According to the book, the drug of choice is:", "opts": ["Cloxacillin", "Nafcillin", "Vancomycin", "Penicillin G"], "key": 2, "exp": "MRSA is resistant to all beta-lactams.", "src": "Confers resistance to all beta-lactam antimicrobials - PDF 14 (printed 6)"}, {"n": 89, "img": null, "kind": "short case", "stem": "A patient with a central venous catheter has a coagulase-negative staphylococcus in blood cultures. Which property of the organism explains the catheter infection?", "opts": ["Preformed heat-stable enterotoxin", "Protein A binding to IgG", "Epidermolytic toxin", "Glycocalyx forming a biofilm on the device"], "key": 3, "exp": "S. epidermidis is skin flora that adheres to prosthetic devices.", "src": "a polysaccharide material that enables adherence to prosthetic devices such as catheters - PDF 15 (printed 7)"}, {"n": 90, "img": "https://i.postimg.cc/k5zxcd0K/fig10.jpg", "kind": "from the image", "stem": "These Gram-stained cocci are arranged in:", "opts": ["Clusters, Gram-positive (purple)", "Chains, Gram-positive", "Pairs, Gram-negative (pink)", "Tetrads, Gram-negative (pink)"], "key": 1, "exp": "Streptococci: Gram-positive cocci in chains or pairs. Full statement: Chains, Gram-positive (purple).", "src": "Gram-positive cocci arranged in chains or pairs - PDF 16 (printed 8)"}, {"n": 91, "img": "https://i.postimg.cc/k5zxcd0K/fig10.jpg", "kind": "linked theory", "stem": "Which feature separates the genus Streptococcus from Staphylococcus in the coursebook?", "opts": ["Catalase-positive", "Arranged in clusters", "Catalase-negative", "Grows on simple ordinary media"], "key": 2, "exp": "Streptococcus: catalase-negative; staphylococci are catalase-positive.", "src": "Catalase-negative. - PDF 16 (printed 8)"}, {"n": 92, "img": "https://i.postimg.cc/k5zxcd0K/fig10.jpg", "kind": "linked theory", "stem": "Streptococci are called fastidious because they:", "opts": ["Need an enriched medium such as blood agar", "Grow well on simple nutrient agar", "Need 5-6.5% NaCl to grow", "Grow without oxygen"], "key": 0, "exp": "Fastidious = need enriched medium to grow in vitro.", "src": "Fastidious i.e., need enriched medium - PDF 16 (printed 8)"}, {"n": 93, "img": "https://i.postimg.cc/k5zxcd0K/fig10.jpg", "kind": "linked theory", "stem": "Lancefield classification of beta-hemolytic streptococci is based on:", "opts": ["The capsule polysaccharide", "M protein", "A cell-wall carbohydrate", "Hemolysin type"], "key": 2, "exp": "Serogroups given capital letters (A-U); antibodies to C antigen identify them. Full statement: A cell-wall carbohydrate (C antigen).", "src": "named C antigen; serogroups given capital letters - PDF 17 (printed 9)"}, {"n": 94, "img": "https://i.postimg.cc/k5zxcd0K/fig10.jpg", "kind": "linked theory", "stem": "Genotypic classification of streptococci is done using:", "opts": ["DNA-DNA hybridization and 16S rRNA sequencing", "Latex agglutination with group antisera", "Optochin susceptibility of colonies", "Bile solubility of colonies"], "key": 0, "exp": "Book: genotypic classification.", "src": "DNA-DNA hybridization and 16S rRNA sequencing - PDF 17 (printed 9)"}, {"n": 95, "img": "https://i.postimg.cc/MWKdz6tg/fig11.jpg", "kind": "from the image", "stem": "The three plates are labelled beta, alpha and gamma hemolysis. Which description matches ALPHA hemolysis in the book?", "opts": ["Complete hemolysis with wide clear zones caused by streptolysins", "No effect on red cells, with unchanged medium around colonies", "Clearing of the medium by lysis of cells due to catalase", "Greenish growth/partial hemolysis due to H2O2 oxidizing hemoglobin to biliverdin"], "key": 3, "exp": "Labelled image. Alpha: S. pneumoniae and viridans streptococci.", "src": "produces greenish growth on blood agar, or partial hemolysis - PDF 16 (printed 8)"}, {"n": 96, "img": "https://i.postimg.cc/MWKdz6tg/fig11.jpg", "kind": "linked theory", "stem": "Beta-hemolytic streptococci produce:", "opts": ["Greenish partial hemolysis (e.g. S. pneumoniae)", "Complete hemolysis with clear zones", "No hemolysis (e.g. S. bovis)", "A brown halo"], "key": 1, "exp": "Beta = complete hemolysis. Full statement: Complete hemolysis with clear zones (e.g. S. pyogenes, S. agalactiae).", "src": "produce complete hemolysis with clear zones; Classification of the genus Streptococcus - PDF 16 (printed 8)"}, {"n": 97, "img": "https://i.postimg.cc/MWKdz6tg/fig11.jpg", "kind": "linked theory", "stem": "A non-hemolytic (gamma) streptococcus such as S. bovis:", "opts": ["Produces biliverdin", "Shows clear zones", "Has no effect on RBCs", "Shows a green halo"], "key": 2, "exp": "Gamma: neither complete nor partial hemolysis.", "src": "do not produce complete nor partial hemolysis - PDF 16 (printed 8)"}, {"n": 98, "img": "https://i.postimg.cc/2mBTkX oody diarrhea with abdominal cramps", "Neck rigidity with photophobia and fever"], "key": 1, "exp": "Edema due to proteinuria. Full statement: Hypertension and edema of the face (periorbital) and ankles.", "src": "include hypertension, oedema of the face - PDF 22 (printed 14)"}, {"n": 151, "img": "https://i.postimg.cc/VLfbX6Sy/fig21.jpg", "kind": "short case", "stem": "A child with sore throat 2 weeks ago now has smoky urine and facial puffiness. ASO/anti-DNase B are elevated and urine culture is negative. Most likely?", "opts": ["Rheumatic fever after pharyngitis", "Scarlet fever after pharyngitis", "Impetigo of the face", "Acute glomerulonephritis"], "key": 3, "exp": "Type III hypersensitivity; immune complexes in glomeruli.", "src": "Smoky urine, haematuria with RBCS casts - PDF 22 (printed 14)"}, {"n": 152, "img": "https://i.postimg.cc/VLfbX6Sy/fig21.jpg", "kind": "from the image", "stem": "In Table 1.2, the streptococcal strain type for RF is:", "opts": ["Rheumatogenic", "Nephritogenic", "Erythrogenic", "Encapsulated"], "key": 0, "exp": "AGN is nephritogenic.", "src": "Streptococcal type Rheumatogenic Nephritogenic - PDF 22 (printed 14)"}, {"n": 153, "img": "https://i.postimg.cc/VLfbX6Sy/fig21.jpg", "kind": "from the image", "stem": "In Table 1.2, reactivation:", "opts": ["Occurs in RF after repeated streptococcal infection and not in AGN", "Occurs in AGN after repeated skin infection and not in RF", "Occurs in both diseases after repeated infection", "Occurs in neither disease"], "key": 0, "exp": "RF attacks recur with repeated infections.", "src": "Occurs following repeated streptococcal infection Does not occur - PDF 22 (printed 14)"}, {"n": 154, "img": "https://i.postimg.cc/VLfbX6Sy/fig21.jpg", "kind": "from the image", "stem": "In Table 1.2, which disease has the worse sequelae?", "opts": ["AGN, as repeated attacks cause more kidney damage", "RF, as repeated attacks cause more valvular damage", "Both diseases have equal sequelae", "Neither disease has sequ apsule - PDF 18 (printed 10)"}, {"n": 168, "img": null, "kind": "text only", "stem": "Streptolysin O is:", "opts": ["Non-antigenic and oxygen-stable", "Antigenic but oxygen-sensitive", "Responsible for hemolysis on blood agar", "A protease"], "key": 1, "exp": "Streptolysin S is oxygen-stable, non-antigenic, and causes the hemolysis seen on blood agar. Full statement: Antigenic (anti-streptolysin O antibodies help diagnosis) but oxygen-sensitive.", "src": "Streptolysin O is antigenic; Streptolysin S is not antigenic - PDF 18 (printed 10)"}, {"n": 169, "img": null, "kind": "text only", "stem": "Streptococcal pyrogenic exotoxin B causes:", "opts": ["Scarlet fever rash", "Toxic shock by superantigen action", "Hemolysis on blood agar", "Tissue dissolving"], "key": 3, "exp": "SPE-B is a protease: 'flesh-eating bacteria'. Full statement: Tissue dissolving (necrotizing fasciitis).", "src": "Streptococcal pyrogenic exotoxins B - PDF 18 (printed 10)"}, {"n": 170, "img": null, "kind": "text only", "stem": "Necrotizing fasciitis affects the skin and underlying tissue down to:", "opts": ["The muscles and the bones", "The bone and the periosteum", "The deep fascia but not the muscles", "The epidermis and the dermis"], "key": 2, "exp": "Massive tissue destruction with septicemia.", "src": "till the deep fascia but not the muscles - PDF 20 (printed 12)"}, {"n": 171, "img": null, "kind": "text only", "stem": "Compared with staphylococcal TSS, blood culture in streptococcal TSS is usually:", "opts": ["Positive", "Negative", "Sterile", "Positive for staphylococcal TSS"], "key": 0, "exp": "Book: in contrast to staphylococcal TSS.", "src": "blood culture is usually positive in streptococcal TSS; blood culture is usually positive in streptococcal TSS - PDF 20 (printed 12)"}, {"n": 172, "img": null, "kind": "text only", "stem": "Which is an INVASIVE (bacteremic) GAS infection in the book?", "opts": ["Impetigo", "Puerperal sepsis", "Tonsillitis", "Erysipelas"], "key": 1, "exp": "Invasive: ations may occur following the recovery - PDF 21 (printed 13)"}, {"n": 177, "img": null, "kind": "text only", "stem": "Besides valvular cardiac disease, the book says rheumatic fever commonly involves:", "opts": ["Joints, skin and the nervous system", "Kidney, liver and the lungs", "Eye, ear and the nasal sinuses", "Bone marrow and the spleen"], "key": 0, "exp": "Joint, cutaneous and neurologic involvement; the book gives the mnemonic J(heart)NES for the major criteria.", "src": "joint, cutaneous, and neurologic involvement is common - PDF 21 (printed 13)"}, {"n": 178, "img": null, "kind": "text only", "stem": "Per the coursebook, the organism of GAS is susceptible to penicillin; for penicillin-hypersensitive patients it lists:", "opts": ["Vancomycin as the first choice", "Ceftriaxone by injection", "Erythromycin or azithromycin", "Rifampin by mouth"], "key": 2, "exp": "Coursebook statement.", "src": "Patients hypersensitive to penicillin are given erythromycin - PDF 21 (printed 13)"}, {"n": 179, "img": null, "kind": "text only", "stem": "Rheumatic fever prevention in the book includes:", "opts": ["A vaccine against M protein given to school children", "Surgical drainage of the throat and tonsillectomy", "Antitoxin given early to children with scarlet fever", "Early treatment of pharyngitis and long-acting penicillin prophylaxis"], "key": 3, "exp": "", "src": "Prevention by the early diagnosis and treatment of streptococcal pharyngitis - PDF 21 (printed 13)"}, {"n": 180, "img": null, "kind": "text only", "stem": "Which statement about the pneumococcus is correct?", "opts": ["It is a strict pathogen absent from healthy people and causes disease", "It colonizes the oropharynx of 5-50% of healthy people and most infections are endogenous", "It is transmitted mainly by the sexual route and contaminated hands", "It is spread by contaminated hands in hospitals and is exogenous"], "key": 1, "exp": "Exogenous infection by respiratory droplets.", "src": "The organism colonizes the oropharynx of 5-50%; In most cases, infection is endogenous - PDF 25 (printed 17)"}, {"n": 181, "img": null, "kind": "text only", "stem": "Which group is at high risk of pneumococcal infection?", "opts": ["Healthy teenagers and young adults with no chronic illness or smoking", "Neonates born to mothers colonized with group B streptococci or Neisseria", "Splenectomy, smokers, alcoholics, diabetics, extremes of age, congestive heart failure", "Sexually active young adults, travelers, sex workers and soldiers"], "key": 2, "exp": "The spleen defends against capsulated organisms in the blood.", "src": "after splenectomy, heavy smokers, alcoholics - PDF 25 (printed 17)"}, {"n": 182, "img": null, "kind": "text only", "stem": "Pneumococcal pneumonia is associated with bacteremia in:", "opts": ["1-2% of cases", "15-25% of cases", "50-60% of cases", "Over 90% of cases"], "key": 1, "exp": "Invasive: meningitis, endocarditis. Non-invasive: otitis media, sinusitis, conjunctivitis.", "src": "associated with bacteremia in 15-25% of cases - PDF 25 (printed 17)"}, {"n": 183, "img": null, "kind": "text only", "stem": "Which are NON-invasive pneumococcal infections?", "opts": ["Meningitis, endocarditis, septicemia", "Bacteremic pneumonia, peritonitis, arthritis", "Septicemia, meningitis, empyema", "Otitis media, sinusitis, conjunctivitis"], "key": 3, "exp": "", "src": "Non-invasive infections: otitis media - PDF 25 (printed 17)"}, {"n": 184, "img": null, "kind": "text only", "stem": "A Gram smear for pneumococcal diagnosis is prepared from:", "opts": ["Specimens other than blood", "Specimens of blood for culture", "Stool specimens from the patient", "Urine specimens from the patient"], "key": 0, "exp": "Specimen: sputum, blood or CSF; detect capsule by latex agglutination or Quellung; incubate in 10% CO2.", "src": "Gram-stained smear prepared from specimens other than blood - PDF 25 (printed 17)"}, {"n": 185, "img": null, "kind": "text only", "stem": "The pneumococcal polysaccharide vaccine (23 serotypes) is:", "opts": ["Not lifelong in immunity and not given under 2 years", "Given at 2, 4, 6 and 12-15 months of age", "Immunogenic in infants under 2 years", "A conjugate vaccine with a protein carrier"], "key": 0, "exp": "Given to high-risk individuals such as splenectomy patients. Full statement: Not lifelong in immunity (T-independent) and not given under 2 years.", "src": "Immunity is NOT lifelong; NOT given under 2 years of age - PDF 26 (printed 18), PDF 27 (printed 19)"}, {"n": 186, "img": null, "kind": "text only", "stem": "The pneumococcal conjugate vaccine (13 serotypes) is:", "opts": ["Not for infants", "Usable in infants, usually in 4 doses", "A single dose at 5 years", "Given to splenectomy patients"], "key": 1, "exp": "Polysaccharide conjugated to a protein carrier. Full statement: Usable in infants, usually in 4 doses (2, 4, 6, 12-15 months).", "src": "Can be used in infants; Usually given in 4 doses - PDF 27 (printed 19)"}, {"n": 187, "img": null, "kind": "text only", "stem": "Viridans streptococci cause dental caries by:", "opts": ["Releasing streptolysin O that dissolves the tooth enamel directly", "Producing exfoliative toxin that peels the gum surface", "Invading the blood and the dental pulp, forming abscesses", "Forming glycocalyx that adheres to enamel and progresses to biofilm"], "key": 3, "exp": "They are also involved in subacute bacterial endocarditis.", "src": "Dental caries as they form glycocalyx - PDF 27 (printed 19)"}, {"n": 188, "img": null, "kind": "text only", "stem": "Subacute bacterial endocarditis in the book follows:", "opts": ["Skin abscess in patients with healthy valves and no bacteremia", "Throat infection in children with normal hearts and no murmurs", "Dental manipulations causing bacteremia in damaged or prosthetic valves", "Urinary infection in females with normal valves and cystitis"], "key": 2, "exp": "Treatment starts before the susceptibility test result.", "src": "Dental manipulations such ooth extraction. Blood culture grows alpha-hemolytic streptococci. Most likely diagnosis in the book?", "opts": ["Subacute bacterial endocarditis by viridans streptococci", "Pneumococcal meningitis in an adult with fever", "Group B neonatal sepsis in a newborn baby", "Scarlet fever in a child with a throat infection"], "key": 0, "exp": "Dental manipulation causes bacteremia.", "src": "Subacute bacterial endocarditis (SBE) - PDF 27 (printed 19)"}, {"n": 194, "img": null, "kind": "short case", "stem": "A hospitalized patient has UTI; culture shows catalase-negative cocci that grow at 45 C, in 6.5% NaCl and black on bile esculin agar. Organism?", "opts": ["S. pyogenes", "Enterococcus", "S. pneumoniae", "Viridans streptococci"], "key": 1, "exp": "", "src": "Tolerate higher temperature; Hydrolyze the carbohydrate esculin - PDF 28 (printed 20)"}, {"n": 195, "img": null, "kind": "short case", "stem": "A patient has a deep-spreading streptococcal infection with massive tissue destruction down to the deep fascia, sparing muscle, and septicemia. The strain releases SPE-B. Diagnosis?", "opts": ["Erysipelas of the skin", "Impetigo of the epidermis", "Necrotizing fasciitis", "Scarlet fever with rash"], "key": 2, "exp": "SPE-B is a protease. Full statement: Necrotizing fasciitis ('flesh-eating bacteria').", "src": "It is associated with massive tissue destruction; It is caused by strains releasing SPE-B (protease) - PDF 20 (printed 12)"}, {"n": 196, "img": null, "kind": "linked theory", "stem": "A patient with a streptococcal infection has fever and a new murmur; the infection can involve healthy or diseased valves. Which invasive GAS diagnosis?", "opts": ["Impetigo", "Erysipelas", "Scarlet fever", "Acute endocarditis"], "key": 3, "exp": "Life-threatening infection of the endocardium.", "src": "Acute endocarditis: life-threatening infection of the endocardium; It can affect healthy and diseased valves - PDF 20 (printed 12)"}, {"n": 197, "img": null, "kind": "linked theory", "stem": "A woman develops sepsis from an infected endometrium after abortion. The book classes this GAS infection as:", "opts": ["Invasive", "Localized pyogenic", "Poststreptococcal", "Toxin-mediated disease"], "key": 0, "exp": "Invasive infections are associated with bacteremia. Full statement: Invasive (puerperal sepsis).", "src": "Invasive infections (associated with bacteremia) - PDF 20 (printed 12)"}, {"n": 198, "img": null, "kind": "linked theory", "stem": "Specimens for GAS diagnosis depend on the site: which set is listed?", "opts": ["CSF, stool and urine samples from the patient", "Sputum and bronchial washings from the lower tract", "Throat swab, wound discharge, pus, or blood for blood culture", "Urethral discharge and endocervical swabs from the patient"], "key": 2, "exp": "Blood agar incubated aerobically at 37 C.", "src": "tonsillar or pharyngeal (throat) swab, wound discharge, pus OR blood for blood culture; tonsillar or pharyngeal (throat) swab - PDF 20 (printed 12)"}, {"n": 199, "img": null, "kind": "linked theory", "stem": "In RF/AGN workup, evidence of a preceding streptococcal infection in AGN includes:", "opts": ["Positive urine culture for the organism in the kidney", "Elevated ESR, positive CRP and elevated anti-DNase B", "Negative ASO and normal ESR with low CRP", "Elevated bile solubility of colonies on culture"], "key": 1, "exp": "", "src": "Elevated ESR, Positive CRP - PDF 22 (printed 14)"}, {"n": 200, "img": null, "kind": "linked theory", "stem": "A patient with valvular heart disease has an endocarditis that may destroy the valve. What does the book say about treatment timing?", "opts": ["Wait for the susceptibility result before starting", "Give a vaccine first and then antibiotics", "Do surgery before giving any antibiotics", "Start treatment promptly, before the susceptibility result"], "key": 3, "exp": "Life-threatening condition that may end in valve destruction.", "src": "Prompt treatment in SBE is necessary and starts before the result; This is a life-threatening condition that may end in valve destruction - PDF 27 (printed 19)"}, {"n": 201, "img": null, "kind": "text only", "stem": "Which S. pyogenes surface component helps adherence to mucosal surfaces?", "opts": ["M protein", "Hyaluronic acid capsule", "Streptokinase", "Lipoteichoic acid"], "key": 3, "exp": "Per the book: lipoteichoic acid helps adherence to mucosal surfaces, protein F helps adherence to fibronectin in tissues.", "src": "Lipoteichoic acid: helps adherence to mucosal surfaces - PDF 17 (printed 9)"}, {"n": 202, "img": null, "kind": "text only", "stem": "Protein F of S. pyogenes helps the organism to:", "opts": ["Dissolve fibrin in blood clots", "Resist phagocytosis", "Adhere to fibronectin in tissues", "Lyse red blood cells"], "key": 2, "exp": "Fibronectin-binding protein (protein F) mediates adherence to fibronectin in tissues.", "src": "helps adherence to fibronectin in tissues - PDF 18 (printed 10)"}, {"n": 203, "img": null, "kind": "text only", "stem": "Antibodies raised against the M protein of S. pyogenes can be used to:", "opts": ["Detect the Lancefield group", "Identify the different serotypes", "Differentiate beta from alpha hemolysis", "Detect streptokinase activity"], "key": 1, "exp": "M protein is antigenic; its antibodies identify serotypes (more than 80 are known).", "src": "These Abs can be used to identify different serotypes - PDF 17 (printed 9)"}, {"n": 204, "img": null, "kind": "text only", "stem": "Which is listed under localized pyogenic infections caused by S. pyogenes besides tonsillitis and impetigo?", "opts": ["Surgical wound infection", "Erysipelas", "Cellulitis", "Necrotizing fasciitis"], "key": 0, "exp": "Erysipelas, cellulitis and necrotizing fasciitis are diffuse or deep infections in the book's classification.", "src": "Surgical wound infection - PDF 11 (printed 3)"}, {"n": 205, "img": null, "kind": "short case", "stem": "A man has fever and rapidly spreading painful skin necrosis; the surgeon finds destruction down to the fascia and the patient becomes septicemic. The strain releases SPE-B. The book's popular name for this condition is:", "opts": ["Honey-crust disease", "Flesh-eating bacteria", "Scalded skin syndrome", "Rheumatic chorea"], "key": 1, "exp": "The book: SPE-B (protease) strains are termed flesh-eating bacteria; the condition is associated with septicemia and endangers the patient's life.", "src": "The condition is associated with septicemia and endangers the patient; These strains are termed - PDF 20 (printed 12)"}, {"n": 206, "img": null, "kind": "short case", "stem": "A schoolchild has pharyngitis, then 2 weeks later joint pain, a new murmur and abnormal movements. The book explains the mechanism as:", "opts": ["Direct invasion of the joints by the organism", "Superantigen action of SPE-A", "Type II hypersensitivity with molecular mimicry to M protein", "Type III hypersensitivity with immune complexes in the glomeruli"], "key": 2, "exp": "Antibodies to M protein cross-react with self-antigens in rheumatic fever.", "src": "Molecular Mimicry; Acute rheumatic fever (RF) Pathogenesis - PDF 21 (printed 13)"}, {"n": 207, "img": null, "kind": "short case", "stem": "A throat swab grows beta-hemolytic, catalase-negative cocci in chains. To which Lancefield group does S. pyogenes belong?", "opts": ["Group B", "Group C", "Group D", "Group A"], "key": 3, "exp": "S. pyogenes is group A, S. agalactiae is group B.", "src": "Group A Beta-Hemolytic Streptococci - PDF 17 (printed 9)"}, {"n": 208, "img": null, "kind": "short case", "stem": "A patient has intra-abdominal sepsis and a wound infection. Culture grows catalase-negative cocci tolerating bile salts and 6.5% NaCl. The most likely organism group is:", "opts": ["Enterococci", "Staphylococci", "Viridans streptococci", "Pneumococci"], "key": 0, "exp": "Enterococci tolerate bile salts and high salt and cause intra-abdominal infections.", "src": "Intraabdominal and pelvic sepsis following surgery - PDF 28 (printed 20)"}, {"n": 209, "img": null, "kind": "short case", "stem": "A child with a history of rheumatic fever is started on injections of a long-acting drug. The book calls this:", "opts": ["Antitoxin therapy against the toxin", "Surgical drainage of the joints", "Long-acting penicillin prophylaxis against recurrence", "Vaccination with M protein of the strain"], "key": 2, "exp": "Rheumatic fever prevention includes early pharyngitis treatment and long-acting penicillin prophylaxis.", "src": "Prevention by the early diagnosis and treatment of streptococcal pharyngitis - PDF 21 (printed 13)"}, {"n": 210, "img": null, "kind": "short case", "stem": "A patient has toxic shock syndrome and the blood culture grows S. pyogenes. Compared with staphylococcal TSS, the blood culture is:", "opts": ["Usually positive", "Usually negative", "Sterile", "Positive after antibiotic therapy"], "key": 0, "exp": "In contrast to staphylococcal TSS, blood culture is usually positive in streptococcal TSS.", "src": "blood culture is usually positive in streptococcal TSS; blood culture is usually positive in streptococcal TSS - PDF 20 (printed 12)"}, {"n": 211, "img": null, "kind": "text only", "stem": "Beta hemolytic streptococci are further classified by Lancefield into groups using:", "opts": ["The M protein of the cell wall", "The capsule polysaccharide of the cell", "The teichoic acid of the membrane", "The C antigen carbohydrate in the cell wall"], "key": 3, "exp": "Serogroups are given capital letters A to U.", "src": "a certain carbohydrate antigen in their cell walls named C antigen - PDF 17 (printed 9)"}, {"n": 212, "img": null, "kind": "text only", "stem": "The Lancefield serogroups are given letters from:", "opts": ["A to F", "A to U", "A to Z", "A to H"], "key": 1, "exp": "Antibodies to C antigen identify the groups in the lab.", "src": "given capital letters (A- U) - PDF 17 (printed 9)"}, {"n": 213, "img": null, "kind": "text only", "stem": "S. pyogenes is described in the book as:", "opts": ["An obligate anaerobe that is bacitracin-resistant", "An aerobe that is catalase-positive", "A facultative anaerobe that is bacitracin-sensitive", "A capnophile that needs 10% CO2"], "key": 2, "exp": "It is beta-hemolytic and catalase-negative.", "src": "Facultative anaerobe, Beta hemolytic on blood agar - PDF 17 (printed 9)"}, {"n": 214, "img": null, "kind": "text only", "stem": "The M protein of S. pyogenes is:", "opts": ["Fibrinolytic and DNA-dissolving", "An endotoxin and a protease", "A spreading factor and a lipase", "Antiphagocytic and antigenic"], "key": 3, "exp": "More than 80 serotypes have been identified.", "src": "More than 80 serotypes have been identified - PDF 17 (printed 9)"}, {"n": 215, "img": null, "kind": "text only", "stem": "Streptodornase of S. pyogenes:", "opts": ["Dissolves fibrin in blood clots", "Dissolves DNA and helps spread infection", "Destroys C5a at the site", "Dissolves hyaluronic acid"], "key": 1, "exp": "Streptokinase dissolves fibrin; hyaluronidase dissolves hyaluronic acid.", "src": "Streptodornase: dissolves DNA and helps spread infection - PDF 18 (printed 10)"}, {"n": 216, "img": null, "kind": "text only", "stem": "Why is hyaluronidase called the spreading factor?", "opts": ["It dissolves hyaluronic acid in connective tissue", "It dissolves fibrin in the blood clots of vessels", "It destroys the chemotactic C5a peptide", "It dissolves DNA in the pus of abscesses"], "key": 0, "exp": "This helps spread the infection.", "src": "dissolves hyaluronic acid in connective tissue and helps spread the infection therefore termed - PDF 18 (printed 10)"}, {"n": 217, "img": null, "kind": "text only", "stem": "C5a peptidase of S. pyogenes:", "opts": ["Dissolves fibrin in blood clots", "Destroys C5a and removes its chemotactic effect", "Dissolves DNA and helps the spread", "Lyses red cells on blood agar plates"], "key": 1, "exp": "Chemotaxis of phagocytes is lost.", "src": "C5a peptidase that destroys C5a eliminating its chemotactic effect - PDF 18 (printed 10)"}, {"n": 218, "img": null, "kind": "text only", "stem": "Streptokinase was used until recently to:", "opts": ["Treat scalded skin syndrome in neonates", "Prevent rheumatic fever after pharyngitis", "Dissolve coronary clots in acute myocardial infarction", "Treat streptococcal pharyngitis in children"], "key": 2, "exp": "It dissolves fibrin in blood clots.", "src": "to dissolve coronary blood clots formed in acute myocardial infarction - PDF 18 (printed 10)"}, {"n": 219, "img": null, "kind": "text only", "stem": "Streptolysin S is:", "opts": ["Antigenic, oxygen-sensitive and the basis of the ASO test", "An erythrogenic toxin that causes the skin rash", "A protease causing massive tissue destruction", "Non-antigenic, oxygen-stable and the cause of hemolysis on blood agar"], "key": 3, "exp": "Streptolysin O is the antigenic oxygen-sensitive one.", "src": "Streptolysin S is not antigenic; responsible for the hemolysis seen on blood agar plates - PDF 18 (printed 10)"}, {"n": 220, "img": null, "kind": "text only", "stem": "Infection by S. pyogenes is usually:", "opts": ["Exogenous", "Endogenous from the colon", "Congenital", "Caused by a vector"], "key": 0, "exp": "It is transmitted by contact or respiratory droplets.", "src": "Infection is usually exogenous - PDF 19 (printed 11)"}, {"n": 221, "img": null, "kind": "text only", "stem": "The most common infection caused by S. pyogenes is:", "opts": ["Impetigo of the skin", "Erysipelas of the face", "Acute follicular tonsillitis", "Puerperal sepsis"], "key": 2, "exp": "It is a pyogenic painful infection of the pharynx.", "src": "the most common infection caused by S. pyogenes - PDF 19 (printed 11)"}, {"n": 222, "img": null, "kind": "text only", "stem": "In scarlet fever, the blood culture is usually:", "opts": ["Positive, as there is bacteremia", "Positive in children with sore throat", "Positive in neonates and the elderly", "Negative, as there is toxemia but no bacteremia"], "key": 3, "exp": "The rash is caused by erythrogenic toxin-producing strains.", "src": "there is toxemia, however, there is NO bacteremia - PDF 19 (printed 11)"}, {"n": 223, "img": null, "kind": "text only", "stem": "Erysipelas differs from impetigo because it is:", "opts": ["Limited to the epidermis with honey-colored crusts", "Deeper, with edema, redness and a rapidly advancing margin", "A toxin disease with a sandpaper rash", "A deep fascial infection that spares the skin"], "key": 1, "exp": "Its margins are well-defined.", "src": "a skin infection (deeper than impetigo) - PDF 19 (printed 11)"}, {"n": 224, "img": null, "kind": "text only", "stem": "Puerperal sepsis is defined in the book as:", "opts": ["Infection of the endometrium after delivery or abortion", "Infection of the endocardium after valve surgery", "Infection of the deep fascia after trauma", "Infection of the tonsils after a sore throat"], "key": 0, "exp": "It is an invasive infection with bacteremia.", "src": "infection of the endometrium after delivery or abortion - PDF 20 (printed 12)"}, {"n": 225, "img": null, "kind": "text only", "stem": "Which toxin is blamed for the 'flesh-eating' strains?", "opts": ["SPE-A, a superantigen", "Streptolysin O", "SPE-B, a protease", "Streptokinase"], "key": 2, "exp": "Necrotizing fasciitis is associated with massive tissue destruction.", "src": "It is caused by strains releasing SPE-B - PDF 20 (printed 12)"}, {"n": 226, "img": null, "kind": "text only", "stem": "How is S. pyogenes cultivated according to the book?", "opts": ["Chocolate agar with 10% CO2 for a week", "Blood agar incubated aerobically at 37 C overnight", "Mannitol salt agar at 45 C anaerobically", "Bile esculin agar at 37 C overnight"], "key": 1, "exp": "The identification then relies on hemolysis, Gram stain, catalase and bacitracin.", "src": "Blood agar is inoculated and incubated aerobically at 37°C overnight - PDF 20 (printed 12)"}, {"n": 227, "img": null, "kind": "text only", "stem": "The book gives the mnemonic J-heart-NES for:", "opts": ["The tests for AGN", "The toxins of S. pyogenes", "The prevention of scarlet fever", "The major criteria of rheumatic fever"], "key": 3, "exp": "Joint, cutaneous and neurologic involvement are common besides valvular disease.", "src": "J♥NES (major criteria) - PDF 21 (printed 13)"}, {"n": 228, "img": null, "kind": "text only", "stem": "AGN follows which type of infection in the book?", "opts": ["Skin infection, and less frequently pharyngitis", "Pharyngitis, and less frequently skin infection", "Urinary tract infection", "Infective endocarditis"], "key": 0, "exp": "It is caused by nephritogenic strains of S. pyogenes.", "src": "follows skin infection and less frequently pharyngitis - PDF 22 (printed 14)"}, {"n": 229, "img": null, "kind": "text only", "stem": "The oedema of AGN is attributed in the book to:", "opts": ["Proteinuria", "Heart failure", "Bacteremia", "Superantigen action"], "key": 0, "exp": "Oedema affects the face (especially periorbital) and ankles.", "src": "(due to proteinuria) - PDF 22 (printed 14)"}, {"n": 230, "img": null, "kind": "text only", "stem": "Urine examination in AGN shows:", "opts": ["Pus cells and bacteria seen with a positive urine culture", "Glucose and ketones in urine with no blood cells present", "Heavy proteinuria with fatty casts and no red cells", "Smoky urine, hematuria with RBC casts and mild proteinuria"], "key": 3, "exp": "The urine culture is negative.", "src": "Smoky urine, haematuria with RBCS casts & mild proteinuria - PDF 22 (printed 14)"}, {"n": 231, "img": null, "kind": "text only", "stem": "The word 'nephritogenic' in the book refers to:", "opts": ["The strains that cause rheumatic fever", "The toxin of scarlet fever", "The strains of S. pyogenes that cause AGN", "The capsule of S. pneumoniae"], "key": 2, "exp": "Rheumatogenic strains cause RF.", "src": "(nephritogenic strains) - PDF 22 (printed 14)"}, {"n": 232, "img": null, "kind": "short case", "stem": "A child with impetigo develops smoky urine, facial puffiness and hypertension 2 weeks later. The book classes the strain as:", "opts": ["Rheumatogenic", "Nephritogenic", "Erythrogenic", "Capsulated"], "key": 1, "exp": "AGN follows skin infection and, less often, pharyngitis.", "src": "follows skin infection and less frequently pharyngitis; (nephritogenic strains) - PDF 22 (printed 14)"}, {"n": 233, "img": null, "kind": "text only", "stem": "The book describes GBS infection in adults as causing:", "opts": ["Bacteremia, endocarditis and pneumonia in cancer or diabetic patients", "Impetigo and erysipelas in healthy adults and children", "Pharyngitis and scarlet fever in school children", "Dental caries and SBE in young adults with caries"], "key": 0, "exp": "In neonates it causes meningitis, pneumonia and septicemia.", "src": "In adults, it causes bacteremia and severe infections - PDF 23 (printed 15)"}, {"n": 234, "img": null, "kind": "text only", "stem": "The pneumococcal capsule is antigenic, which means:", "opts": ["It is not recognized by the immune system", "Specific antibodies are produced upon infection", "It is similar to human connective tissue", "It does not help blood dissemination"], "key": 1, "exp": "It is antiphagocytic and helps invasion.", "src": "Antigenic and specific Abs are produced upon infection - PDF 24 (printed 16)"}, {"n": 235, "img": null, "kind": "text only", "stem": "How many pneumococcal serotypes have been identified according to the book?", "opts": ["More than 80", "More than 23", "More than 13", "More than 90"], "key": 3, "exp": "The serotypes depend on the chemical composition of the capsule.", "src": "More than 90 serotypes have been identified - PDF 24 (printed 16)"}, {"n": 236, "img": null, "kind": "text only", "stem": "After the pneumococcus is transmitted, the book says it may:", "opts": ["Cause pneumonia in healthy colonized people", "Be cleared from the pharynx within days", "Colonize the pharynx as normal flora or cause infection", "Invade the body through the skin"], "key": 2, "exp": "Infection develops in high-risk populations.", "src": "may colonize the pharynx and behave as normal flora or infection develops - PDF 25 (printed 17)"}, {"n": 237, "img": null, "kind": "text only", "stem": "The book lists treatment of pneumococcal infection as:", "opts": ["Penicillin G by mouth for pneumonia", "Ceftriaxone or a quinolone such as levofloxacin", "Erythromycin or azithromycin by mouth", "Metronidazole with gentamicin by injection"], "key": 1, "exp": "Vancomycin is used for penicillin-resistant pneumococci.", "src": "Third-generation cephalosporins e.g., ceftriaxone or a quinolone as levofloxacin - PDF 26 (printed 18)"}, {"n": 238, "img": null, "kind": "text only", "stem": "Vancomycin is used in pneumococcal infection when:", "opts": ["The patient is under 2 years", "The patient has a splenectomy", "The organism is penicillin-resistant", "The capsule is absent"], "key": 2, "exp": "The first-line drugs are ceftriaxone or a quinolone.", "src": "Vancomycin is used with penicillin-resistant pneumococci - PDF 26 (printed 18)"}, {"n": 239, "img": null, "kind": "text only", "stem": "The pneumococcal polysaccharide vaccine is given to:", "opts": ["High-risk individuals such as those with splenectomy", "Newborns in the first weeks of life, routinely", "Healthy teenagers before entering school", "Pregnant women during the third trimester"], "key": 0, "exp": "It contains the capsule of 23 serotypes.", "src": "Given to high-risk individuals e.g., those with splenectomy - PDF 26 (printed 18)"}, {"n": 240, "img": null, "kind": "text only", "stem": "Immunity after the pneumococcal polysaccharide vaccine is not lifelong because:", "opts": ["The capsule changes its antigens yearly", "The vaccine is a live attenuated organism", "The vaccine covers just 13 serotypes", "Memory cells do not develop (T-independent antigen)"], "key": 3, "exp": "It is also not given under 2 years because of an improper B cell response.", "src": "Immunity is NOT lifelong due to lack of memory cell development - PDF 26 (printed 18)"}, {"n": 241, "img": null, "kind": "text only", "stem": "The pneumococcal conjugate vaccine doses are usually given at:", "opts": ["2, 4, 6 and 12-15 months", "At birth, one dose", "At 1, 3 and 9 months", "At 5 years, one dose"], "key": 0, "exp": "It covers 13 serotypes conjugated to a protein carrier.", "src": "Usually given in 4 doses (at ages of 2, 4, 6, and 12-15 months) - PDF 27 (printed 19)"}, {"n": 242, "img": null, "kind": "text only", "stem": "The circulating organisms in SBE adhere to the valve with the help of:", "opts": ["Streptolysin O", "M protein", "Glycocalyx formation", "Capsule of hyaluronic acid"], "key": 2, "exp": "The condition is life-threatening and may end in valve destruction.", "src": "helped by glycocalyx formation - PDF 27 (printed 19)"}, {"n": 243, "img": null, "kind": "text only", "stem": "SBE is described in the book as:", "opts": ["Self-limited, healing with no valve damage", "Life-threatening, possibly ending in valve destruction", "A mild skin infection with a spreading rash", "A non-invasive infection limited to the mouth"], "key": 1, "exp": "Treatment starts before the susceptibility result.", "src": "This is a life-threatening condition that may end in valve destruction - PDF 27 (printed 19)"}, {"n": 244, "img": null, "kind": "text only", "stem": "According to the coursebook, chemoprophylaxis for patients with valvular heart disease before tooth extraction is:", "opts": ["Oral penicillin given for 14 days after", "Oral rifampin given for 2 days before", "Vancomycin given by vein for a week", "One large dose of ampicillin or amoxicillin"], "key": 3, "exp": "It is also given before tonsillectomy.", "src": "one large dose of ampicillin or amoxicillin - PDF 28 (printed 20)"}, {"n": 245, "img": null, "kind": "text only", "stem": "Enterococci are described in the book as arranged in:", "opts": ["Clusters", "Pairs with flattened sides", "Short chains", "Long chains with halos"], "key": 2, "exp": "They are usually non-hemolytic and catalase-negative.", "src": "Gram-positive cocci arranged in short chains - PDF 28 (printed 20)"}, {"n": 246, "img": null, "kind": "text only", "stem": "Enterococci were first classified as group D streptococci because they:", "opts": ["Have the group D Lancefield antigen in their cell wall", "Have the group A antigen in the cell wall", "Have the group B antigen in the cell wall", "Have the M protein in the cell wall"], "key": 0, "exp": "DNA studies later separated them into the Enterococcus genus.", "src": "Have group D Lancefield antigen in their cell wall - PDF 28 (printed 20)"}, {"n": 247, "img": null, "kind": "short case", "stem": "A hospitalized patient on a surgical ward develops pelvic sepsis after surgery and a wound infection. The culture grows catalase-negative cocci in short chains. The book calls this organism an important cause of:", "opts": ["Community-acquired pharyngitis", "Hospital-acquired infections", "Dental caries", "Neonatal impetigo"], "key": 1, "exp": "Enterococci cause UTI, intra-abdominal and pelvic sepsis, wound infection, endocarditis and neonatal infections.", "src": "making it one of the important organisms in hospital- acquired infections - PDF 28 (printed 20)"}, {"n": 248, "img": null, "kind": "short case", "stem": "A neonate has sepsis from a catalase-negative coccus that grows black on bile esculin. Which enterococcal property does this match?", "opts": ["Fermentation of mannitol on salt agar", "Production of coagulase in rabbit plasma", "Optochin sensitivity on blood agar", "Hydrolysis of esculin in the presence of bile"], "key": 3, "exp": "Enterococci can also cause neonatal meningitis and septicemia.", "src": "Hydrolyze the carbohydrate esculin in the presence of bile - PDF 28 (printed 20)"}, {"n": 249, "img": null, "kind": "short case", "stem": "A man with congestive heart failure has pneumonia and an alpha-hemolytic isolate from sputum. Which treatment does the book list?", "opts": ["Penicillin by mouth for 14 days", "Rifampin for the household contacts", "Ceftriaxone or a quinolone such as levofloxacin", "Erythromycin eye ointment for the newborn"], "key": 2, "exp": "Vancomycin is added for penicillin-resistant strains.", "src": "Third-generation cephalosporins e.g., ceftriaxone or a quinolone as levofloxacin - PDF 26 (printed 18)"}, {"n": 250, "img": null, "kind": "short case", "stem": "A woman with a prosthetic valve will have a tonsillectomy. Per the book, she needs:", "opts": ["Rifampin by mouth for a week after the procedure", "A pneumococcal conjugate vaccine at the visit before it", "No prophylaxis because the procedure is not bacteremic", "One large dose of ampicillin or amoxicillin before the procedure"], "key": 3, "exp": "Any procedure that can cause bacteremia counts.", "src": "one large dose of ampicillin or amoxicillin - PDF 28 (printed 20)"}, {"n": 251, "img": null, "kind": "short case", "stem": "A 70-year-old diabetic with a splenectomy is recommended a vaccine. Which does the book recommend, and why is the effect time-limited?", "opts": ["Polysaccharide vaccine; no memory cells develop", "Conjugate vaccine; B cells fail to respond", "Live vaccine; the capsule mutates yearly", "Toxoid vaccine; the toxin degrades slowly"], "key": 0, "exp": "Polysaccharide antigens are T-independent.", "src": "Given to high-risk individuals e.g., those with splenectomy; Immunity is NOT lifelong due to lack of memory cell development - PDF 26 (printed 18)"}, {"n": 252, "img": null, "kind": "text only", "stem": "Cellulitis differs from erysipelas in that its margins are:", "opts": ["Well defined, as it is superficial", "Poorly defined, as the infection is deeper", "Raised with honey-colored crusts", "Bilateral on both sides of the body"], "key": 1, "exp": "Erysipelas has well-defined margins.", "src": "As the level of infection is deep, the margins of the affected area are poorly defined - PDF 19 (printed 11)"}, {"n": 253,
