<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramyxoviruses and Pneumoviruses - Lecture - Week 5 timetable</title><style>
:root{--blue:#1d4ed8;--ok:#15803d;--no:#b91c1c}

.cues td:first-child{font-weight:700;background:#fefce8}
.cues td.ans{background:#f0fdf4}
@media(max-width:640px){
 .cues thead{display:none}
 .cues table,.cues tbody,.cues tr,.cues td{display:block;width:100%;box-sizing:border-box}
 .cues tr{border:1px solid #dbe3ee;border-radius:12px;margin:10px 0;box-shadow:0 1px 3px #0001;overflow:hidden}
 .cues td{border-top:0;padding:7px 12px}
 .cues td:before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
}

a.lnk{color:var(--blue)}
</style></head><body><div class="w" id="app"></div><script>

key": 0,"exp": "Trigger: \"Croup (laryngotracheobronchitis) The most serious manifestation\".","src": "Theory book PDF 165 (printed 158)","cue": "croup","ask": "Most serious parainfluenza illness in children","distinguish": "Adults: cold."},{"n": 7,"stem": "Measles virus hosts and types","opts": ["Zoonotic","Many types","Animals","Single antigenic type, humans only"],"key": 3,"exp": "Trigger: \"Occurs as a single antigenic type. Humans are the only natural host\".","src": "Theory book PDF 165 (printed 158)","cue": "measles","ask": "Measles virus hosts and types","distinguish": "Contagious."},{"n": 8,"stem": "Measles incubation period","opts": ["1-3 days","1 month","8-12 days","3 weeks"],"key": 2,"exp": "Trigger: \"Incubation period: 8-12 days\".","src": "Theory book PDF 166 (printed 159)","cue": "IP","ask": "Measles incubation period","distinguish": "Prodrome 2-4 days."},{"n": 9,"stem": "Measles prodromal phase","opts": ["Arthritis","Parotitis","Rash","Fever, cough, coryza, conjunctivitis, Koplik spots, lymphopenia"],"key": 3,"exp": "Trigger: \"fever, cough, coryza (runny nose), conjunctivitis, Koplik's spots... lymphopenia\".","src": "Theory book PDF 166 (printed 159)","cue": "prodrome","ask": "Measles prodromal phase","distinguish": "Eruptive 5-8 days."},{"n": 10,"stem": "Koplik's spots","opts": ["Skin rash","Tonsils","Eye","White spots on bright red buccal mucosa"],"key": 3,"exp": "Trigger: \"Koplik's spots (white spots on the bright red buccal mucosa)\".","src": "Theory book PDF 166 (printed 159)","cue": "Koplik","ask": "Koplik's spots","distinguish": "Measles."},{"n": 11,"stem": "Measles rash","opts": ["Vesicular","Petechial","Maculopapular from head to chest, trunk and limbs","Starts feet"],"key": 2,"exp": "Trigger: \"maculopapular skin rash that begins at the head and spreads to the chest, trunk and down to the limbs\".","src": "Theory book PDF 166 (printed 159)","cue": "rash","ask": "Measles rash","distinguish": "Lifelong immunity."},{"n": 12,"stem": "Measles complications","opts": ["Arthritis","Orchitis","Bronchopneumonia, otitis media, rare encephalitis","Deafness"],"key": 2,"exp": "Trigger: \"Bronchopneumonia and otitis media... Encephalitis (rare)\".","src": "Theory book PDF 167 (printed 160)","cue": "complications","ask": "Measles complications","distinguish": "Symptomatic care."},{"n": 13,"stem": "MMR vaccine","opts": ["Killed","Single dose only","Trivalent live attenuated, subcutaneous at 12-15 months, booster before school","Oral"],"key": 2,"exp": "Trigger: \"trivalent live attenuated vaccine against mumps, measles and rubella... 12 to 15 months... booster dose before school entry\".","src": "Theory book PDF 167 (printed 160)","cue": "MMR","ask": "MMR vaccine","distinguish": "4-6 years."},{"n": 14,"stem": "Mumps is characterized by","opts": ["Non-suppurative parotid swelling, one antigenic type","Pneumonia","Suppurative","Rash"],"key": 0,"exp": "Trigger: \"non-suppurative enlargement of one or both parotid salivary glands. one antigenic type\".","src": "Theory book PDF 167 (printed 160)","cue": "mumps","ask": "Mumps is characterized by","distinguish": "Humans only."},{"n": 15,"stem": "Mumps spreads to","opts": ["Salivary glands, testis, pancreas, kidney, thyroid","Lungs","Only parotid","Heart"],"key": 0,"exp": "Trigger: \"salivary glands and other organ systems (testis, pancreas, kidney, thyroid...)\".","src": "Theory book PDF 167 (printed 160)","cue": "spread","ask": "Mumps spreads to","distinguish": "Viremia."},{"n": 16,"stem": "Mumps incubation","opts": ["14-25 days, average 18","1 week","2 months","3 days"],"key": 0,"exp": "Trigger: \"Incubation period: 14 to 25 days, average 18 days\".","src": "Theory book PDF 168 (printed 161)","cue": "IP","ask": "Mumps incubation","distinguish": "Shed in saliva."},{"n": 17,"stem": "Mumps complications","opts": ["Rash","Pneumonia","Hepatitis","Epididymo-orchitis in 20-50% of post-pubertal males, aseptic meningitis, deafness"],"key": 3,"exp": "Trigger: \"Epididymoorchitis... 20%-50%... Aseptic meningitis. Deafness\".","src": "Theory book PDF 168 (printed 161)","cue": "complications","ask": "Mumps complications","distinguish": "Bilateral testicular swelling."},{"n": 18,"stem": "Mumps diagnosis","opts": ["X-ray","Biopsy","Clinical; IgM or rising IgG by ELISA; IFA","Culture only"],"key": 2,"exp": "Trigger: \"Typical symptoms... Detection of IgM or a rising titer of IgG by ELISA\".","src": "Theory book PDF 168 (printed 161)","cue": "diagnosis","ask": "Mumps diagnosis","distinguish": "Culture research."},{"n": 19,"stem": "Pneumoviruses infect","opts": ["Gut","Animals","Superficial respiratory epithelium with no animal reservoir","Systemic"],"key": 2,"exp": "Trigger: \"infection takes place in the superficial epithelial cells... do not have animal reservoirs\".","src": "Theory book PDF 169 (printed 162)","cue": "pneumo","ask": "Pneumoviruses infect","distinguish": "RSV, hMPV."},{"n": 20,"stem": "RSV is the leading cause of","opts": ["Diarrhea","Bronchiolitis and pneumonia in infants under one year","Otitis","Meningitis"],"key": 1,"exp": "Trigger: \"leading cause of lower respiratory tract infections (bronchiolitis and pneumonia) in infants under one year\".","src": "Theory book PDF 169 (printed 162)","cue": "RSV","ask": "RSV is the leading cause of","distinguish": "Syncytia."},{"n": 21,"stem": "RSV name comes from","opts": ["Discoverer","Shape","Place","Syncytia: multinucleated cells from fusion in culture"],"key": 3,"exp": "Trigger: \"syncytia-multinucleated cells formed by fusion of the cell membranes\".","src": "Theory book PDF 169 (printed 162)","cue": "syncytia","ask": "RSV name comes from","distinguish": "Droplets."},{"n": 22,"stem": "RSV incubation and season","opts": ["2 weeks; summer","2-3 days; winter and early spring","6 months","1 day"],"key": 1,"exp": "Trigger: \"Incubation period is 2-3 days. Epidemics occur in winter and early spring\".","src": "Theory book PDF 169 (printed 162)","cue": "IP","ask": "RSV incubation and season","distinguish": "Tropics rainy season."},{"n": 23,"stem": "RSV diagnosis","opts": ["Stool","Blood culture","Skin test","Antigen in nasopharyngeal aspirate by IF/ELISA/IC, PCR, isolation"],"key": 3,"exp": "Trigger: \"Detection of viral antigens in nasopharyngeal aspirate by IF, ELISA and rapid immunochromatographic assays\".","src": "Theory book PDF 170 (printed 163)","cue": "diagnosis","ask": "RSV diagnosis","distinguish": "PCR."},{"n": 24,"stem": "RSV treatment","opts": ["Supportive; ribavirin for severe infection","Oseltamivir","Acyclovir","Antibiotics"],"key": 0,"exp": "Trigger: \"Is usually supportive... Ribavirin, a potent inhibitor... for severe infection\".","src": "Theory book PDF 170 (printed 163)","cue": "treatment","ask": "RSV treatment","distinguish": "Oxygen."},{"n": 25,"stem": "RSV prevention","opts": ["None","Live vaccine","Toxoid","Monoclonal antibody; Abrysvo to pregnant women weeks 32-36 and adults 60-74"],"key": 3,"exp": "Trigger: \"monoclonal antibody... Recombinant protein vaccine (Abrysvo)... weeks 32-36... Adults ages 60-74\".","src": "Theory book PDF 170 (printed 163)","cue": "prevention","ask": "RSV prevention","distinguish": "Maternal antibodies."},{"n": 26,"stem": "hMPV","opts": ["Adults only","First cause","Has vaccine","Second cause of LRTI in infants; peak 6-12 months; no antiviral"],"key": 3,"exp": "Trigger: \"second major cause of lower respiratory tract infection... peak age... between 6 and 12 months\".","src": "Theory book PDF 171 (printed 164)","cue": "hMPV","ask": "hMPV","distinguish": "RSV <6 months."},{"stem": "Pneumoviridae family","opts": ["Was a subfamily within Paramyxoviridae, reclassified as a separate family in 2016","DNA viruses","Always zoonotic","Non-enveloped"],"key": 0,"exp": "Trigger: \"Pneumoviridae formerly was a subfamily within the family Paramyxoviridae, but was reclassified as a separate family in 2016\".","src": "Theory book PDF 164 (printed 157)","cue": "2016","ask": "Pneumoviridae family","distinguish": "Respiratory route.","n": 27},{"stem": "Measles pathogenesis","opts": ["Droplet and airborne; oropharynx to regional lymph nodes, primary viremia, reticulo-endothelial replication, secondary viremia","Fecal-oral to gut","Direct skin invasion","Mosquito bite to liver"],"key": 0,"exp": "Trigger: \"enters via the oropharynx and spreads through the respiratory tract to the regional lymph nodes... primary viremia... reticulo-endothelial system... secondary viremia\".","src": "Theory book PDF 166 (printed 159)","cue": "pathogenesis","ask": "Measles pathogenesis","distinguish": "Koplik spots prodrome.","n": 28},{"stem": "Duration of measles disease","opts": ["2-3 days","7-11 days (prodrome 2-4 days, eruptive 5-8 days)","One month","24 hours"],"key": 1,"exp": "Trigger: \"disease lasts for 7 to 11 days; prodromal phase of 2-4 days followed by an eruptive phase of 5 to 8 days\".","src": "Theory book PDF 166 (printed 159)","cue": "duration","ask": "Duration of measles disease","distinguish": "IP 8-12 days.","n": 29},{"stem": "Immunity after measles infection","opts": ["Lifelong","Lasts one year","No immunity","10 years"],"key": 0,"exp": "Trigger: \"Infection produces a lifelong immunity\".","src": "Theory book PDF 166 (printed 159)","cue": "measles immunity","ask": "Immunity after measles infection","distinguish": "MMR live vaccine.","n": 30},{"stem": "Measles laboratory diagnosis","opts": ["Increased antibody titer by complement fixation, HI or neutralization test","Blood film","Stool culture","Skin test"],"key": 0,"exp": "Trigger: \"Detection of increased antibody titer by complement fixation (CF), hemagglutination inhibition (HI) or neutralization test\".","src": "Theory book PDF 167 (printed 160)","cue": "measles dx","ask": "Measles laboratory diagnosis","distinguish": "Typical symptoms usually sufficient.","n": 31},{"stem": "Measles treatment","opts": ["Ribavirin","Acyclovir","No specific antiviral therapy, only symptomatic treatment","Antibiotics"],"key": 2,"exp": "Trigger: \"No specific antiviral therapy, only symptomatic treatment\".","src": "Theory book PDF 167 (printed 160)","cue": "measles Rx","ask": "Measles treatment","distinguish": "MMR prevention.","n": 32},{"stem": "Mumps is primarily a disease of","opts": ["Childhood (95% occur under 15 years)","Elderly","Neonates only","Adults only"],"key": 0,"exp": "Trigger: \"Primary childhood disease (95% occur under 15 years of age)\".","src": "Theory book PDF 167 (printed 160)","cue": "mumps age","ask": "Mumps is primarily a disease of","distinguish": "Orchitis post-pubertal.","n": 33},{"stem": "Mumps prodromal period","opts": ["Myalgia, anorexia, malaise and low grade fever followed by rapid parotid enlargement","Rash then fever","Convulsions","Jaundice"],"key": 0,"exp": "Trigger: \"prodromal period of myalgia, anorexia, malaise and low grade fever is followed by rapid enlargement of parotid glands\".","src": "Theory book PDF 168 (printed 161)","cue": "mumps prodrome","ask": "Mumps prodromal period","distinguish": "Duct orifices red.","n": 34},{"stem": "Mumps virus is shed in saliva","opts": ["From 2 days before to 9 days after onset of salivary gland swelling","Only before symptoms","For one month","Only in urine"],"key": 0,"exp": "Trigger: \"virus is shed in the saliva from about 2 days before to 9 days after the onset of salivary gland swelling\".","src": "Theory book PDF 168 (printed 161)","cue": "shedding","ask": "Mumps virus is shed in saliva","distinguish": "Incubation 14-25 days.","n": 35},{"stem": "Prevention of hMPV infection","opts": ["Live vaccine","Monoclonal antibody","No specific prevention, only respiratory hygiene","Antibiotics"],"key": 2,"exp": "Trigger: \"No specific prevention, only respiratory hygiene\".","src": "Theory book PDF 171 (printed 164)","cue": "hMPV prevention","ask": "Prevention of hMPV infection","distinguish": "Symptomatic treatment.","n": 36}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
