<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rubella and Poxviruses - Flipped class - Week 5 timetable</title><style>
:root{--blue:#1d4ed8;--ok:#15803d;--no:#b91c1c}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;margin:0;background:#eef2f7;color:#111}
.w{max-width:700px;margin:0 auto;padding:12px}

button.o:active{transform:scale(.99)}
button.o.ok{border-color:var(--ok);background:#dcfce7}
button.o.no{border-color:var(--no);background:#fee2e2}
.btn{font-size:16px;padding:12px 18px;border:0;border-radius:12px;background:var(--blue);color:#fff;margin:4px 6px 4px 0;cursor:pointer}
.btn.g{background:#64748b}

.btn[disabled]{opacity:.4}

.gi.done{background:#93c5fd;color:#0f172a}
.gi.cur{outline:2px solid #0f172a}
.rv{font-size:14px}

.ro.ok{background:#dcfce7;border-color:var(--ok)}
.ro.no{background:#fee2e2;border-color:var(--no)}
table.cues{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.cues th{background:#1e3a8a;color:#fff;text-align:left;padding:9px 10px;position:sticky;top:0;font-size:13px}
.cues td{padding:9px 10px;border-top:1px solid #e5e7eb;vertical-align:top;line-height:1.45}
.cues td:first-child{font-weight:700;background:#fefce8}
.cues td.ans{background:#f0fdf4}
@media(max-width:640px){
 .cues thead{display:none}
 .cues table,.cues tbody,.cues tr,.cues td{display:block;width:100%;box-sizing:border-box}
 .cues tr{border:1px solid #dbe3ee;border-radius:12px;margin:10px 0;box-shadow:0 1px 3px #0001;overflow:hidden}
 .cues td{border-top:0;padding:7px 12px}
 .cues td:before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
}
.note{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
a.lnk{color:var(--blue)}
</style></head><body><div class="w" id="app"></div><script>

Posterior auricular lymphadenopathy is characteristic\".", "src": "Theory book PDF 172 (printed 165)", "cue": "nodes", "ask": "Characteristic sign of rubella", "distinguish": "Rash 3 days."}, {"n": 7, "stem": "Rubella in adult women", "opts": ["Pneumonia", "Orchitis", "Meningitis", "Polyarthritis by immune complexes"], "key": 3, "exp": "Trigger: \"especially in females, polyarthritis caused by immune complexes often occurs\".", "src": "Theory book PDF 172 (printed 165)", "cue": "arthritis", "ask": "Rubella in adult women", "distinguish": "Adults."}, {"n": 8, "stem": "Rubella is most significant as", "opts": ["A teratogen (congenital rubella syndrome)", "Childhood rash", "Pneumonia", "Meningitis"], "key": 0, "exp": "Trigger: \"significance of rubella virus is not as a cause of mild childhood disease but as a teratogen\".", "src": "Theory book PDF 173 (printed 166)", "cue": "teratogen", "ask": "Rubella is most significant as", "distinguish": "CRS."}, {"n": 9, "stem": "CRS risk is highest", "opts": ["Any equal", "Postnatal", "Third trimester", "First trimester, especially first month"], "key": 3, "exp": "Trigger: \"non-immune pregnant woman is infected during the first trimester, especially the first month\".", "src": "Theory book PDF 173 (printed 166)", "cue": "trimester", "ask": "CRS risk is highest", "distinguish": "Viremia."}, {"n": 10, "stem": "CRS malformations", "opts": ["Heart (PDA), eyes (cataract), brain (deafness, mental retardation)", "Skin only", "Liver", "Lung"], "key": 0, "exp": "Trigger: \"heart (e.g., patent ductus arteriosus), the eyes (e.g., cataracts), and the brain (e.g., deafness and mental retardation)\".", "src": "Theory book PDF 173 (printed 166)", "cue": "malformations", "ask": "CRS malformations", "distinguish": "Triad."}, {"n": 11, "stem": "Progressive rubella panencephalitis", "opts": ["Infants", "Rare, teens, associated with congenital rubella, death within 8 years", "Acute", "Common"], "key": 1, "exp": "Trigger: \"extremely rare condition. It usually develops in the teens with death within 8 years\".", "src": "Theory book PDF 173 (printed 166)", "cue": "PRP", "ask": "Progressive rubella panencephalitis", "distinguish": "Slow."}, {"n": 12, "stem": "Rubella diagnosis", "opts": ["Serologic: IgM by ELISA or HI", "Stool", "Culture", "Biopsy"], "key": 0, "exp": "Trigger: \"diagnosis of rubella is mainly serologic. Detection of IgM anti-rubella antibodies\".", "src": "Theory book PDF 173 (printed 166)", "cue": "diagnosis", "ask": "Rubella diagnosis", "distinguish": "Pregnancy."}, {"n": 13, "stem": "Rubella IgG immunity titer", "opts": ["1:1", "1:8 or greater", "1:1000", "1:2"], "key": 1, "exp": "Trigger: \"1:8 or greater titer of IgG indicates immunity\".", "src": "Theory book PDF 173 (printed 166)", "cue": "IgG", "ask": "Rubella IgG immunity titer", "distinguish": "Protects fetus."}, {"n": 14, "stem": "CRS diagnosis", "opts": ["Culture", "Biopsy", "Skin test", "Prenatal PCR on amniotic fluid; postnatal IgM"], "key": 3, "exp": "Trigger: \"Prenatally by amniocentesis and detection of rubella genome by PCR. Postnatally by detection of IgM\".", "src": "Theory book PDF 173 (printed 166)", "cue": "CRS dx", "ask": "CRS diagnosis", "distinguish": "No antiviral."}, {"n": 15, "stem": "Rubella vaccine", "opts": ["Single", "Toxoid", "Killed", "Live attenuated, 12-18 months with second dose at 4-6 years"], "key": 3, "exp": "Trigger: \"live attenuated vaccine, recommended for all 12-18-month-old children. A second dose... 4th or 6th year\".", "src": "Theory book PDF 174 (printed 167)", "cue": "vaccine", "ask": "Rubella vaccine", "distinguish": "MMR/MMRV."}, {"n": 16, "stem": "Single rubella vaccine is for", "opts": ["Non-pregnant unimmunized young adult women", "Infants", "Pregnant women", "Men only"], "key": 0, "exp": "Trigger: \"single vaccine is recommended for unimmunized young adult women if they are not pregnant\".", "src": "Theory book PDF 174 (printed 167)", "cue": "women", "ask": "Single rubella vaccine is for", "distinguish": "Live vaccine."}, {"n": 17, "stem": "Poxviruses are different from other DNA viruses in", "opts": ["Icosahedral", "Naked", "Brick shape, cytoplasmic replication with own RNA polymerase, visible by light microscope", "Nuclear replication"], "key": 2, "exp": "Trigger: \"Being brick-shaped... Replicating in cytoplasm as they contain their own DNA-dependent RNA polymerase... seen by light microscope\".", "src": "Theory book PDF 210 (printed 203)", "cue": "poxviruses", "ask": "Poxviruses are different from other DNA viruses in", "distinguish": "Largest viruses."}, {"n": 18, "stem": "Human poxviruses", "opts": ["Herpes", "Polio", "Adeno", "Smallpox, vaccinia, monkeypox, cowpox, molluscum contagiosum"], "key": 3, "exp": "Trigger: \"smallpox, vaccinia, monkeypox, cowpox and molluscum contagiosum viruses\".", "src": "Theory book PDF 210 (printed 203)", "cue": "members", "ask": "Human poxviruses", "distinguish": "Share nucleoprotein antigen."}, {"n": 19, "stem": "Smallpox eradication year", "opts": ["1990", "1980", "2000", "1950"], "key": 1, "exp": "Trigger: \"declared eradicated from the world (in 1980)\".", "src": "Theory book PDF 210 (printed 203)", "cue": "eradicated", "ask": "Smallpox eradication year", "distinguish": "Bioterror concern."}, {"n": 20, "stem": "Smallpox rash evolution", "opts": ["No scar", "Vesicles only", "Starts trunk", "Macules, papules, vesicles, pustules, crusts, leaving scars; starts on face"], "key": 3, "exp": "Trigger: \"begins on the face... macules, papules, vesicles, pustules and finally crusts in 2-6 weeks leaving a scarred area\".", "src": "Theory book PDF 211 (printed 204)", "cue": "rash", "ask": "Smallpox rash evolution", "distinguish": "Centrifugal."}, {"n": 21, "stem": "Smallpox lab finding", "opts": ["Councilman", "Guarnieri intracytoplasmic inclusion bodies", "Negri", "Owl's eye"], "key": 1, "exp": "Trigger: \"intracytoplasmic inclusion bodies (Guarnieri bodies)\".", "src": "Theory book PDF 211 (printed 204)", "cue": "Guarnieri", "ask": "Smallpox lab finding", "distinguish": "Skin scrapings."}, {"n": 22, "stem": "Smallpox vaccine", "opts": ["mRNA", "Toxoid", "Live attenuated vaccinia, routine use stopped after eradication", "Killed"], "key": 2, "exp": "Trigger: \"contains live attenuated vaccinia virus. Routine vaccination is no longer recommended\".", "src": "Theory book PDF 211 (printed 204)", "cue": "vaccine", "ask": "Smallpox vaccine", "distinguish": "Immunity 10 years."}, {"n": 23, "stem": "Mpox virus", "opts": ["Herpes", "RNA", "Enveloped dsDNA Orthopoxvirus, zoonotic", "Naked"], "key": 2, "exp": "Trigger: \"enveloped double-stranded DNA virus of the Orthopoxvirus genus... zoonotic disease\".", "src": "Theory book PDF 212 (printed 205)", "cue": "mpox", "ask": "Mpox virus", "distinguish": "Squirrels, monkeys."}, {"n": 24, "stem": "Mpox transmission", "opts": ["Respiratory droplets, direct/indirect contact, percutaneous, perinatal", "Mosquito", "Food", "Water"], "key": 0, "exp": "Trigger: \"Respiratory droplets. Direct or indirect contact. Percutaneous... During pregnancy or birth\".", "src": "Theory book PDF 212 (printed 205)", "cue": "transmission", "ask": "Mpox transmission", "distinguish": "Tattoo."}, {"n": 25, "stem": "Mpox rash", "opts": ["No crust", "No palms", "Trunk only", "Starts on face, spreads including palms and soles; flat sore to blister to crust"], "key": 3, "exp": "Trigger: \"extending to the palms of the hands and soles of the feet... flat sore... blister... crust\".", "src": "Theory book PDF 212-213 (printed 205-206)", "cue": "rash", "ask": "Mpox rash", "distinguish": "Lymph nodes swollen."}, {"n": 26, "stem": "Mpox vaccines", "opts": ["Toxoid", "Killed", "MVA-BN (2 doses 4 weeks apart) and LC16m8 (single dose, scarification, safe in children)", "Live replicating"], "key": 2, "exp": "Trigger: \"MVA-BN: Two doses, four weeks apart... LC16m8: Single dose... skin scarification. Safe in children\".", "src": "Theory book PDF 214 (printed 207)", "cue": "vaccines", "ask": "Mpox vaccines", "distinguish": "WHO."}, {"n": 27, "stem": "Mpox post-exposure vaccine", "opts": ["Within 1 month", "After symptoms", "Within 4 days (max 14 days if no symptoms)", "Never"], "key": 2, "exp": "Trigger: \"Should be given less than 4 days after exposure. Maximally, within 14 days\".", "src": "Theory book PDF 214 (printed 207)", "cue": "PEP", "ask": "Mpox post-exposure vaccine", "distinguish": "High-risk groups pre-exposure."}, {"n": 28, "stem": "Molluscum contagiosum", "opts": ["Cancer", "Pink wart-like papules, close contact, clinical diagnosis, no vaccine", "Rash with fever", "Ulcer"], "key": 1, "exp": "Trigger: \"small pink papular wart-like benign tumors... Diagnosis is clinically... no vaccine\".", "src": "Theory book PDF 214-215 (printed 207-208)", "cue": "MCV", "ask": "Molluscum contagiosum", "distinguish": "Children, immunocompromised."}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
