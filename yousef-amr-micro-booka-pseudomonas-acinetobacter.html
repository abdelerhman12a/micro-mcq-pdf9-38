te.", "Parasite.", "Symbiont."], "key": 1, "exp": "كتاب النظري: They are free-living saprophytes found in soil, water and foods", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 89 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 89}, {"n": 818, "stem": "What is the recommended approach before treating Acinetobacter infections?", "opts": ["Empirical treatment only.", "Antibiotic susceptibility testing.", "Surgical intervention.", "Immunotherapy. 8. Miscellaneous Fastidious Gram-Negative Bacilli"], "key": 1, "exp": "كتاب النظري: Antibiotic-resistant strains are common, so susceptibility testing guides treatment", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 89 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 89}];
