mulae reach the liver for maturation and pairing through the","opts": ["Portal vein directly from the skin","Lymphatics only","Right side of the heart, lung, left side of the heart then systemic circulation","Inferior mesenteric veins directly"],"key": 2,"exp": "Trigger: \"carried by venous circulation to the right side of the heart, lung, left side of the heart, systemic circulation, hepatoportal circulation (liver)\".","src": "Theory book PDF 290 (printed 282)","cue": "migration","ask": "Schistosomulae reach the liver for maturation and pairing through the","distinguish": "Lung comes before the left heart."},{"n": 11,"stem": "Eggs of S. haematobium appear in urine about","opts": ["6 months after infection","8 weeks after infection","2 years after infection","1 week after infection"],"key": 1,"exp": "Trigger: \"females deposit eggs which appear in urine about 8 weeks after infection\".","src": "Theory book PDF 290 (printed 282)","cue": "prepatent period","ask": "Eggs of S. haematobium appear in urine about","distinguish": "Katayama is about 6 weeks."},{"n": 12,"stem": "The male carries the female in the","opts": ["Gynaecophoric canal","Vitelline duct","Caecal lumen","Ootype"],"key": 0,"exp": "Trigger: \"Male worm carries its female in the gynaecophoric canal\".","src": "Theory book PDF 290 (printed 282)","cue": "couple","ask": "The male carries the female in the","distinguish": "The canal belongs to the male."},{"n": 13,"stem": "Eggs that do not escape in urine become","opts": ["Trapped in the walls of the urogenital organs causing lesions","Carried back to the snail","Digested by the worm","Passed in stool"],"key": 0,"exp": "Trigger: \"Other eggs become trapped (arrested) in the walls of urogenital organs causing pathological lesions\".","src": "Theory book PDF 290 (printed 282)","cue": "egg fate","ask": "Eggs that do not escape in urine become","distinguish": "Ectopic eggs may embolize to lung and CNS."},{"n": 14,"stem": "Most pathological lesions of urinary schistosomiasis result from","opts": ["Snail antigens","Adult worm feeding","Egg deposition in tissues","Cercarial penetration"],"key": 2,"exp": "Trigger: \"Most of the pathological lesions in urinary schistosomiasis result from egg deposition in tissues\".","src": "Theory book PDF 291 (printed 283)","cue": "pathogenesis","ask": "Most pathological lesions of urinary schistosomiasis result from","distinguish": "Soluble egg antigens diffuse out."},{"n": 15,"stem": "Soluble egg antigens diffuse out of the egg shell through","opts": ["Micropores","The terminal spine","The miracidium cilia","The shell operculum"],"key": 0,"exp": "Trigger: \"Soluble egg antigens (SEA) that diffuse out through the egg shell micropores\".","src": "Theory book PDF 291 (printed 283)","cue": "SEA","ask": "Soluble egg antigens diffuse out of the egg shell through","distinguish": "Micropores in the shell."},{"n": 16,"stem": "Granuloma around the schistosome egg is a manifestation of","opts": ["Immediate anaphylaxis","Delayed hypersensitivity through cell-mediated immunity","Complement lysis","Antibody-dependent cytotoxicity"],"key": 1,"exp": "Trigger: \"it is a manifestation of delayed hypersensitivity through cell-mediated immune response\".","src": "Theory book PDF 291 (printed 283)","cue": "granuloma","ask": "Granuloma around the schistosome egg is a manifestation of","distinguish": "Cell-mediated, not immediate."},{"n": 17,"stem": "The first granuloma around the egg is formed of","opts": ["Giant cells only","Red blood cells","Fibroblasts only","Eosinophils, monocytes, lymphocytes, neutrophils and plasma cells"],"key": 3,"exp": "Trigger: \"First granuloma is formed of Schistosoma egg surrounded by cellular aggregates of eosinophils, monocytes, lymphocytes, neutrophils, and plasma cells\".","src": "Theory book PDF 291 (printed 283)","cue": "granuloma cells","ask": "The first granuloma around the egg is formed of","distinguish": "Fibroblasts come later and cause fibrosis."},{"n": 18,"stem": "The three successive stages of the disease are","opts": ["Inflammation, granuloma formation, fibrosis","Fibrosis, granuloma, inflammation","Granuloma, inflammation, necrosis","Necrosis, fibrosis, calcification"],"key": 0,"exp": "Trigger: \"So, the disease passes into 3 stages: (1) Inflammation (2) Granuloma formation (3) Fibrosis\".","src": "Theory book PDF 291 (printed 283)","cue": "disease stages","ask": "The three successive stages of the disease are","distinguish": "Inflammation comes first."},{"n": 19,"stem": "Nodules and polyps in the bladder develop when","opts": ["A carcinoma arises","Multiple granulomas coalesce together","The mucosa atrophies","Eggs calcify in the submucosa"],"key": 1,"exp": "Trigger: \"Nodules and polyps: develop when multiple granulomas coalesce together\".","src": "Theory book PDF 292 (printed 284)","cue": "nodules","ask": "Nodules and polyps in the bladder develop when","distinguish": "Sandy patches are the calcified fibrous lesion."},{"n": 20,"stem": "Sandy patches develop when the submucosa is densely thickened by","opts": ["Fibrous tissue containing large numbers of calcified eggs","Coalesced granulomas","Uric acid crystals","Fresh miracidia"],"key": 0,"exp": "Trigger: \"Sandy patches: develop when the submucosa becomes densely thickened by fibrous tissue containing large numbers of calcified eggs\".","src": "Theory book PDF 292 (printed 284)","cue": "sandy patches","ask": "Sandy patches develop when the submucosa is densely thickened by","distinguish": "The mucosa becomes atrophic with a granular dirty yellowish appearance."},{"n": 21,"stem": "The bladder cancer associated with chronic urinary schistosomiasis is","opts": ["Adenocarcinoma","Transitional cell carcinoma only","Squamous cell carcinoma","Sarcoma"],"key": 2,"exp": "Trigger: \"late in the disease, squamous cell carcinoma may result\".","src": "Theory book PDF 292 (printed 284)","cue": "bladder cancer","ask": "The bladder cancer associated with chronic urinary schistosomiasis is","distinguish": "Hyperplasia and metaplasia are precancerous."},{"n": 22,"stem": "Early haematuria in urinary schistosomiasis is due to","opts": ["Ulceration of nodules and polyps","Disruption of bladder mucosa by eggs with terminal spines","Glomerulonephritis","Bladder carcinoma"],"key": 1,"exp": "Trigger: \"Early in the disease: due to disruption of bladder mucosa by S. hematobium eggs (with terminal spines)\".","src": "Theory book PDF 292 (printed 284)","cue": "haematuria","ask": "Early haematuria in urinary schistosomiasis is due to","distinguish": "Late haematuria comes from ulceration of lesions."},{"n": 23,"stem": "Late haematuria in urinary schistosomiasis is due to","opts": ["Immune complex deposition","Egg spines cutting the mucosa","Ulceration of bladder mucosal lesions (nodules, polyps, sandy patches, carcinoma)","Cercarial dermatitis"],"key": 2,"exp": "Trigger: \"Late in the disease: due to ulceration of bladder mucosal lesions (nodules, polyps, sandy patches or carcinoma)\".","src": "Theory book PDF 292 (printed 284)","cue": "late haematuria","ask": "Late haematuria in urinary schistosomiasis is due to","distinguish": "Early haematuria is from egg spines."},{"n": 24,"stem": "Schistosomula and adult worms escape immunity by","opts": ["Hiding inside red cells","Adsorbing host antigens on their surface","Secreting antibodies","Killing eosinophils"],"key": 1,"exp": "Trigger: \"Schistosomula and adult worms adsorb host antigens on their surface. The host immune system considers them not foreign\".","src": "Theory book PDF 293 (printed 285)","cue": "immune evasion","ask": "Schistosomula and adult worms escape immunity by","distinguish": "They look like host tissue."},{"n": 25,"stem": "Concomitant immunity in schistosomiasis means","opts": ["Loss of immunity after cure","Immunity only against the snail","Immunity to all stages including adults","Protection against cercarial reinfection while adult worms of the primary infection are unaffected"],"key": 3,"exp": "Trigger: \"It is a protective immunity against cercarial reinfection but adult worms of primary infection are unaffected\".","src": "Theory book PDF 293 (printed 285)","cue": "concomitant immunity","ask": "Concomitant immunity in schistosomiasis means","distinguish": "Adults survive their own immunity."},{"n": 26,"stem": "Cercarial dermatitis (swimmer's itch) is caused by","opts": ["Eggs in the dermis","Human schistosomula migrating","Cercariae of non-human schistosomes that die in the skin","Adult worms in the bladder"],"key": 2,"exp": "Trigger: \"Local dermatitis due to skin penetration by cercariae of non-human schistosomes... they die in the skin cause intense immune response\".","src": "Theory book PDF 293 (printed 285)","cue": "cercarial dermatitis","ask": "Cercarial dermatitis (swimmer's itch) is caused by","distinguish": "It lasts 7-10 days."},{"n": 27,"stem": "During the stage of migration the lungs show","opts": ["Emphysema","Verminous pneumonitis and haemorrhage with cough, sputum and haemoptysis","Hydatid cysts","Caseating granulomas"],"key": 1,"exp": "Trigger: \"Lungs: Verminous pneumonitis (small patches of inflammation) and hemorrhage, with cough, sputum, and hemoptysis\".","src": "Theory book PDF 293 (printed 285)","cue": "migration lungs","ask": "During the stage of migration the lungs show","distinguish": "Circulating schistosomules cause it."},{"n": 28,"stem": "Acute schistosomiasis (Katayama syndrome) occurs about","opts": ["2 days after infection","1 year after infection","8 weeks after infection","6 weeks after the initial infection"],"key": 3,"exp": "Trigger: \"may occur about 6 weeks after the initial infection, coinciding with egg deposition\".","src": "Theory book PDF 294 (printed 286)","cue": "Katayama","ask": "Acute schistosomiasis (Katayama syndrome) occurs about","distinguish": "Eggs appear in urine at 8 weeks."},{"n": 29,"stem": "Katayama syndrome is especially associated with","opts": ["Non-human schistosomes","S. haematobium only","S. intercalatum","S. mansoni and S. japonicum"],"key": 3,"exp": "Trigger: \"especially by S. mansoni and S. japonicum\".","src": "Theory book PDF 294 (printed 286)","cue": "Katayama species","ask": "Katayama syndrome is especially associated with","distinguish": "Its mechanism is immune complexes against egg antigens."},{"n": 30,"stem": "The cardinal complaint of chronic urinary schistosomiasis is","opts": ["Haematemesis","Painless jaundice","Chronic diarrhoea","Recurrent painless terminal haematuria"],"key": 3,"exp": "Trigger: \"Recurrent painless terminal haematuria is the cardinal complaint\".","src": "Theory book PDF 294 (printed 286)","cue": "cardinal symptom","ask": "The cardinal complaint of chronic urinary schistosomiasis is","distinguish": "Dysuria, frequency and suprapubic pain also occur."},{"n": 31,"stem": "Late urinary schistosomiasis is mainly","opts": ["Allergic","Necrotic","Inflammatory","Fibrotic, with fibrosis of bladder and ureters causing obstructive uropathy"],"key": 3,"exp": "Trigger: \"Late manifestations: mainly fibrotic. Fibrosis of the urinary bladder and ureters cause obstructive uropathy\".","src": "Theory book PDF 294 (printed 286)","cue": "late disease","ask": "Late urinary schistosomiasis is mainly","distinguish": "Early disease is mainly inflammatory."},{"n": 32,"stem": "Bilharzial cor pulmonale is","opts": ["Left ventricular failure","Right-sided heart disease secondary to chronic lung schistosomiasis","Coronary disease","Pericarditis"],"key": 1,"exp": "Trigger: \"Lung schistosomiasis (Bilharzial cor pulmonale): right-sided heart disease secondary to chronic lung disease\".","src": "Theory book PDF 295 (printed 287)","cue": "cor pulmonale","ask": "Bilharzial cor pulmonale is","distinguish": "Repeated embolism of ova into pulmonary arterioles."},{"n": 33,"stem": "Bilharzial cor pulmonale is caused mainly by","opts": ["S. intercalatum","S. haematobium","S. mansoni","S. japonicum"],"key": 1,"exp": "Trigger: \"S. haematobium (mainly), const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
