const Q=[{"n": 1, "img": null, "kind": "clinical case", "stem": "A 25-year-old nurse is asymptomatic. Her TST induration is 11 mm and sputum smears and cultures are negative. Which diagnosis?", "opts": ["Latent TB infection", "Falsely positive test with no meaning", "Leprosy", "Pulmonary TB disease"], "key": 0, "exp": "Answer: latent TB infection. Book: 10 mm or more is positive in healthcare workers; latent infection has negative smears and cultures, no symptoms, and is not a case of TB.", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 2, "img": null, "kind": "association", "stem": "Leprosy has how many basic forms?", "opts": ["Four forms of equal frequency", "One form only in all patients", "Three forms of equal frequency", "Two, with intermediate forms"], "key": 3, "exp": "Answer: tuberculoid and lepromatous with many intermediates.", "src": "PDF 118 (printed 111)"}, {"n": 3, "img": null, "kind": "clinical case", "stem": "A patient on TB treatment for 3 weeks asks about infectivity. What does the book say?", "opts": ["Sputum becomes non-infectious within 2-3 weeks", "Infectious for 1 year", "Never infectious", "Infectious only if smear negative"], "key": 0, "exp": "Answer: within 2-3 weeks on combination therapy.", "src": "PDF 115 (printed 108)"}, {"n": 4, "img": null, "kind": "definition", "stem": "Which statement about reservoirs is correct?", "opts": ["Armadillos are the reservoir of M. tuberculosis", "Cows are the only reservoir of M. bovis", "Humans are the only reservoir of M. tuberculosis", "Tap water is the reservoir of M. tuberculosis"], "key": 2, "exp": "Answer: humans only for M. tuberculosis, whereas both cows and humans are reservoirs for M. bovis.", "src": "PDF 109 (printed 102)"}, {"n": 5, "img": "117-099", "kind": "definition", "stem": "Why is the modified Z-N method used for the organism in this section?", "opts": ["It is fully acid-fast like M. tuberculosis", "It grows well in broth culture", "It is less acid-fast than M. tuberculosis", "It is Gram-positive, not acid-fast"], "key": 2, "exp": "Answer: M. leprae is less acid-fast than M. tuberculosis.", "src": "PDF 117 (printed 110)"}, {"n": 6, "img": "114-095", "kind": "association", "stem": "Which technique is shown, and where is the injection given?", "opts": ["Intravenous antigen in the antecubital vein", "Intramuscular tuberculin in the gluteal region", "Intradermal PPD injection in the anterior forearm", "Subcutaneous BCG injection in the deltoid"], "key": 2, "exp": "Answer: intradermal PPD in the anterior aspect of the forearm. Book trigger: \"0.1 ml of PPD containing 5 tuberculin units (TU) is injected intradermally in the skin of the anterior aspect of the forearm\".", "src": "PDF 113 (printed 106), Fig 1.74"}, {"n": 7, "img": null, "kind": "association", "stem": "Which lesions are typical of tuberculoid leprosy?", "opts": ["Collapsed nose", "Few hypopigmented macular skin lesions", "Many nodular lesions on the face", "Cutaneous gummas"], "key": 1, "exp": "Answer: hypopigmented macular lesions (few lesions).", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 8, "img": null, "kind": "association", "stem": "Which specimens are named for open pulmonary TB?", "opts": ["Blood only", "CSF only", "Sputum and bronchoalveolar lavage", "Stool and urine only"], "key": 2, "exp": "Answer: sputum, bronchoalveolar lavage, etc.", "src": "PDF 112 (printed 105)"}, {"n": 9, "img": "117-099", "kind": "association", "stem": "Acid-fast bacilli in bundles inside infected cells are shown. Which organism and which method?", "opts": ["Nocardia, Giemsa stain", "Mycobacterium leprae, modified Ziehl-Neelsen", "Mycobacterium tuberculosis, Gram stain", "Mycobacterium bovis, auramine only"], "key": 1, "exp": "Answer: M. leprae with the modified Z-N method. Book: \"acid fast bacilli occurs chiefly in bundles within the infected cells ... less acid-fast than M. tuberculosis\".", "src": "PDF 117 (printed 110), Fig 1.76"}, {"n": 10, "img": "117-099", "kind": "association", "stem": "A slit-skin smear is stained as in this picture. What does a positive smear mean for diagnosis?", "opts": ["It is only a screening result needing culture", "It proves only the tuberculoid form", "A positive smear is sufficient for diagnosis", "It must be confirmed by lepromin"], "key": 2, "exp": "Answer: a positive smear is sufficient for diagnosis. Book: \"Smears stained with modified Z-N method show intracellular AFB in bunches. A positive smear is sufficient for diagnosis\".", "src": "PDF 119 (printed 112)"}, {"n": 11, "img": null, "kind": "association", "stem": "Treatment of lepromatous leprosy is:", "opts": ["Dapsone + rifampicin + clofazimine", "Dapsone + rifampicin only", "Isoniazid + rifampin", "Penicillin G"], "key": 0, "exp": "Answer: 3 drugs for LL (2 drugs for TL).", "src": "PDF 119 (printed 112), Table 1.13"}, {"n": 12, "img": null, "kind": "association", "stem": "What is centrifugation used for in sputum processing?", "opts": ["To release the tubercle bacilli", "To kill contaminant bacteria", "To neutralise the NaOH used", "To concentrate the specimen for smear and culture"], "key": 3, "exp": "Answer: concentration; the deposit is used for direct smear and culture.", "src": "PDF 112 (printed 105)"}, {"n": 13, "img": "110-093", "kind": "definition", "stem": "What makes the medium in this picture selective, and what is its base?", "opts": ["Crystal violet; blood agar base", "Malachite green dye; egg-based medium", "Bile salts; agar base", "Antibiotics; enriched broth base"], "key": 1, "exp": "Answer: malachite green in an egg-based medium (Lowenstein-Jensen). Middlebrook's medium is the one made selective with antibiotics.", "src": "PDF 109 (printed 102)"}, {"n": 14, "img": "110-093", "kind": "association", "stem": "Which medium and which organism's colonies are shown on the right?", "opts": ["MacConkey: Mycoplasma", "Lowenstein-Jensen: M. tuberculosis", "Blood agar: Legionella", "Middlebrook agar: M. leprae"], "key": 1, "exp": "Answer: M. tuberculosis colonies on egg-based L-J medium, appearing after about 2-8 weeks at 37 C (Fig 1.71).", "src": "PDF 110 (printed 103), Fig 1.71"}, {"n": 15, "img": null, "kind": "association", "stem": "The QuantiFERON TB test is performed on which specimen?", "opts": ["Skin biopsy", "CSF", "Sputum", "Whole blood"], "key": 3, "exp": "Answer: whole-blood IFN-gamma release assay.", "src": "PDF 115 (printed 108)"}, {"n": 16, "img": null, "kind": "clinical case", "stem": "A patient stops TB drugs repeatedly and relapses. Which strategy does WHO recommend?", "opts": ["BCG booster", "Single drug", "DOTS", "Lepromin test"], "key": 2, "exp": "Answer: DOTS, directly observed therapy short course.", "src": "PDF 115 (printed 108)"}, {"n": 17, "img": null, "kind": "association", "stem": "When does the sputum of a treated TB patient become non-infectious?", "opts": ["After 1 year", "Within 24 hours", "Within 2-3 weeks", "After 6 months"], "key": 2, "exp": "Answer: within 2-3 weeks of treatment.", "src": "PDF 115 (printed 108)"}, {"n": 18, "img": null, "kind": "association", "stem": "Transmission of leprosy requires:", "opts": ["A tick or insect bite", "Prolonged, close contact with patients", "A single brief exposure", "Contaminated food or water"], "key": 1, "exp": "Answer: prolonged and close contact; the exact mode is not certain.", "src": "PDF 117 (printed 110)"}, {"n": 19, "img": null, "kind": "clinical case", "stem": "A patient has nodular lesions, nasal collapse, abundant AFB and negative lepromin. Which treatment?", "opts": ["Dapsone and rifampicin", "Isoniazid only", "Penicillin G", "Dapsone, rifampicin and clofazimine"], "key": 3, "exp": "Answer: LL is treated with 3 drugs.", "src": "PDF 119 (printed 112)"}, {"n": 20, "img": null, "kind": "association", "stem": "Which course describes tuberculoid leprosy?", "opts": ["Benign, non-progressive", "Always bacteremic", "Malignant, progressive", "Rapidly fatal"], "key": 0, "exp": "Answer: tuberculoid is benign non-progressive; lepromatous is malignant progressive.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 21, "img": "117-100", "kind": "association", "stem": "This animal's footpads are used to grow which organism in vivo?", "opts": ["Mycobacterium leprae", "Mycobacterium tuberculosis", "Mycobacterium bovis", "Mycobacterium avium"], "key": 0, "exp": "Answer: M. leprae. Book trigger: \"injection of material containing lepra bacilli into the footpads of mice\" (Fig 1.77b).", "src": "PDF 117 (printed 110), Fig 1.77b"}, {"n": 22, "img": "113-094", "kind": "definition", "stem": "What is the major advantage of the fluid culture system shown (MGIT) over solid media?", "opts": ["It detects rifampicin resistance in 2 hours", "It is selective by malachite green", "It needs no sputum decontamination", "Growth is detected in 4 to 14 days"], "key": 3, "exp": "Answer: detection in 4 to 14 days. Book trigger: \"they allow detection of growth in 4 to 14 days\" (solid media take 2-8 weeks).", "src": "PDF 113 (printed 106), Fig 1.73"}, {"n": 23, "img": null, "kind": "association", "stem": "The lepromin test is useful for:", "opts": ["Treatment choice only", "Diagnosis, not prognosis", "Culture", "Prognosis, not diagnosis"], "key": 3, "exp": "Answer: of no diagnostic but of prognostic value.", "src": "PDF 119 (printed 112)"}, {"n": 24, "img": null, "kind": "clinical case", "stem": "A patient's isolate is resistant to isoniazid, rifampin and a fluoroquinolone plus one more drug. Which term?", "opts": ["Latent TB", "Drug-sensitive TB", "Extensively drug-resistant TB", "Multidrug-resistant TB"], "key": 2, "exp": "Answer: XDR-TB.", "src": "PDF 116 (printed 109)"}, {"n": 25, "img": "114-096", "kind": "clinical case", "stem": "An HIV-infected patient shows a 6 mm induration like the picture. How is it interpreted?", "opts": ["Negative", "Invalid before 4 weeks", "Positive only after BCG", "Positive"], "key": 3, "exp": "Answer: positive. Book: 5 mm or more is positive in HIV-infected patients, recent TB contacts or organ transplant recipients. Even then it cannot separate latent infection from active disease.", "src": "PDF 114 (printed 107)"}, {"n": 26, "img": null, "kind": "association", "stem": "An example of an NTM complex named in the book is:", "opts": ["Mycobacterium leprae complex", "Mycobacterium tuberculosis complex", "Mycobacterium avium-intracellulare complex (MAC)", "Mycobacterium bovis complex"], "key": 2, "exp": "Answer: MAC.", "src": "PDF 116 (printed 109)"}, {"n": 27, "img": null, "kind": "definition", "stem": "M. tuberculosis is called a facultative intracellular pathogen because:", "opts": ["It multiplies both inside and outside cells", "It lacks a cell wall", "It grows only anaerobically", "It multiplies only inside cells"], "key": 0, "exp": "Answer: its capacity to multiply both inside and outside cells.", "src": "PDF 110 (printed 103)"}, {"n": 28, "img": null, "kind": "association", "stem": "Where does M. leprae survive and replicate?", "opts": ["Only free in the blood plasma", "Only in skeletal muscle cells", "Inside macrophages and nerve cells", "Only outside cells in tissue"], "key": 2, "exp": "Answer: within macrophages, nerve cells and other host cells.", "src": "PDF 118 (printed 111)"}, {"n": 29, "img": null, "kind": "definition", "stem": "XDR-TB means:", "opts": ["Resistance to all first-line drugs only", "MDR plus pyrazinamide resistance only", "Resistance to isoniazid alone only", "MDR plus a fluoroquinolone and another drug"], "key": 3, "exp": "Answer: MDR plus a fluoroquinolone and at least one additional drug.", "src": "PDF 116 (printed 109)"}, {"n": 30, "img": null, "kind": "association", "stem": "MDR-TB is resistance to:", "opts": ["Isoniazid only", "Rifampin only", "Both isoniazid and rifampin", "Ethambutol and streptomycin"], "key": 2, "exp": "Answer: isoniazid and rifampin.", "src": "PDF 116 (printed 109)"}, {"n": 31, "img": null, "kind": "except", "stem": "Regarding lepromatous leprosy, all of the following are true EXCEPT:", "opts": ["Th1 response predominates", "Bacteraemia is present", "Lepromin test is negative", "Nodular skin lesions occur"], "key": 0, "exp": "Answer: Th2 predominates in LL; Th1 predominates in TL.", "src": "PDF 119 (printed 112), Table 1.13"}, {"n": 32, "img": null, "kind": "association", "stem": "Which nerve involvement is seen in lepromatous leprosy?", "opts": ["No nerve involvement at all", "Asymmetric nerve involvement", "Only motor nerve involvement", "Symmetric, marked sensory loss"], "key": 3, "exp": "Answer: symmetric with marked sensory loss due to extensive nerve damage.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 33, "img": "109-092", "kind": "association", "stem": "Bacilli appear orange-yellow on a black background under UV light. Which method is this?", "opts": ["Fluorochrome staining with auramine-rhodamine", "Ziehl-Neelsen under the light microscope", "Dark-field microscopy of a wet film", "Gram staining under oil immersion"], "key": 0, "exp": "Answer: auramine-rhodamine fluorochrome stain. Book trigger: \"Under the UV microscope, AFB fluoresces orange yellow in a black background\".", "src": "PDF 112 (printed 105)"}, {"n": 34, "img": null, "kind": "clinical case", "stem": "A cancer patient has a 7 mm induration. How is it read by the book's cut-offs?", "opts": ["Positive: any induration is positive", "Not positive: 10 mm is needed in cancer", "Positive: 5 mm is enough in cancer", "Invalid: erythema was not measured"], "key": 1, "exp": "Answer: not positive by cut-off. Book: 10 mm or more is positive in high-risk conditions such as diabetes and cancer; 5 mm applies to HIV, recent contacts and transplant recipients. Anergy can also give false negatives.", "src": "PDF 114 (printed 107)"}, {"n": 35, "img": "115-097", "kind": "association", "stem": "What is released by the patient's cells in the test shown in this diagram, and how is it read?", "opts": ["Tuberculin, measured by induration", "IgG, measured by agglutination", "IL-4, measured by PCR", "IFN-gamma from sensitized T cells"], "key": 3, "exp": "Answer: IFN-gamma released from sensitized T-lymphocytes after exposure to specific M. tuberculosis antigens (QuantiFERON TB).", "src": "PDF 115 (printed 108), Fig 1.75"}, {"n": 36, "img": null, "kind": "definition", "stem": "Why are the skin and superficial nerves preferentially affected?", "opts": ["The bacilli grow best at about 30 C", "They are carried by lymph only", "They need high oxygen", "They grow only at 42 C"], "key": 0, "exp": "Answer: optimum growth at low temperature (about 30 C).", "src": "PDF 118 (printed 111)"}, {"n": 37, "img": null, "kind": "clinical case", "stem": "An HIV-infected man with 3 months of cough and night sweats has a negative tuberculin test. What is the most likely reason?", "opts": ["Recent BCG vaccination", "Anergy from a weakened immune system", "NTM cross-reaction", "Reading after 48 hours"], "key": 1, "exp": "Answer: anergy (false negative). Book lists severe TB disease, HIV infection and cancer as causes.", "src": "PDF 114 (printed 107)"}, {"n": 38, "img": null, "kind": "except", "stem": "Which of the following belongs to the Mycobacterium tuberculosis complex?", "opts": ["Mycobacterium fortuitum", "Mycobacterium avium", "Mycobacterium africanum", "Mycobacterium leprae"], "key": 2, "exp": "Answer: M. africanum. Book: the complex includes M. tuberculosis, M. bovis, M. africanum and M. microti.", "src": "PDF 109 (printed 102)"}, {"n": 39, "img": null, "kind": "clinical case", "stem": "A contact has a positive QuantiFERON, no symptoms and negative sputum smear and culture. Which statement fits?", "opts": ["Infectious and a case of TB", "Falsely positive due to BCG", "Not infectious and not a case of TB", "Active TB needing isolation"], "key": 2, "exp": "Answer: latent TB infection: not infectious, not a case of TB (case definition).", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 40, "img": null, "kind": "association", "stem": "The CDC considers QuantiFERON to be:", "opts": ["A test of no value in latent TB", "A replacement for sputum culture", "A test for treatment response", "An acceptable alternative for the TST"], "key": 3, "exp": "Answer: an acceptable alternative for the TST.", "src": "PDF 115 (printed 108)"}, {"n": 41, "img": null, "kind": "clinical case", "stem": "After NALC liquefaction, NaOH decontamination and centrifugation, the deposit is used for which tests?", "opts": ["Tuberculin and QuantiFERON", "Lepromin and slit-skin smear", "Direct smear and culture", "Serology and chest X-ray"], "key": 2, "exp": "Answer: the deposit is used for direct smear and culture.", "src": "PDF 112 (printed 105)"}, {"n": 42, "img": null, "kind": "association", "stem": "Within how long after initial contact do infected people become tuberculin and QuantiFERON positive?", "opts": ["4-6 weeks", "6-12 months", "2-3 days", "24-48 hours"], "key": 0, "exp": "Answer: 4-6 weeks (seroconversion).", "src": "PDF 111 (printed 104)"}, {"n": 43, "img": null, "kind": "association", "stem": "NTM are widespread in the environment. Which source is named?", "opts": ["Armadillo meat and tissue", "Raw milk from infected cows", "Sputum of infected patients", "Tap water and dialysis unit water"], "key": 3, "exp": "Answer: tap water, water of haemodialysis units and drinking-water distribution systems.", "src": "PDF 116 (printed 109)"}, {"n": 44, "img": "115-097", "kind": "clinical case", "stem": "A BCG-vaccinated student has a positive TST. In the diagram's test, why is the result NOT affected by the vaccine?", "opts": ["It uses live bacilli", "It measures antibodies instead of T cells", "It is read after 5 years", "The antigens used are not present in BCG strains"], "key": 3, "exp": "Answer: ESAT-6 and CFP-10 are not present in NTM or BCG vaccine strains. Book: \"The result is not affected by prior BCG vaccination\".", "src": "PDF 115 (printed 108)"}, {"n": 45, "img": null, "kind": "association", "stem": "What share of primary infections progresses to TB disease?", "opts": ["About 90%", "About 1%", "About 50%", "About 10%"], "key": 3, "exp": "Answer: about 10% (90% become latent).", "src": "PDF 111 (printed 104)"}, {"n": 46, "img": "117-101", "kind": "association", "stem": "Which statement is true about the culture of the organism that is grown in this animal?", "opts": ["It grows on blood agar overnight", "It grows on LJ medium in 2-8 weeks", "It grows in MGIT in 4-14 days", "It cannot be cultured in vitro"], "key": 3, "exp": "Answer: it cannot be cultured in vitro. Book: \"M. leprae has not yet been successfully cultured in vitro. In vivo: ... mice footpads or ... nine-banded armadillo\".", "src": "PDF 117 (printed 110), Fig 1.77a"}, {"n": 47, "img": null, "kind": "association", "stem": "Besides airborne droplet nuclei, M. tuberculosis disease can follow which route in the book?", "opts": ["Ingestion of milk contaminated with M. bovis", "Fecal-oral spread from raw vegetables", "Tick bite", "Sexual contact"], "key": 0, "exp": "Answer: ingestion of milk contaminated with M. bovis, causing intestinal infection.", "src": "PDF 110 (printed 103)"}, {"n": 48, "img": null, "kind": "association", "stem": "Which cause of a false-negative TST is a weakened immune system?", "opts": ["BCG vaccination", "NTM cross-reaction", "Anergy", "Recent infection"], "key": 2, "exp": "Answer: anergy: inability to react due to weakened immunity (severe TB, HIV, cancer).", "src": "PDF 114 (printed 107)"}, {"n": 49, "img": null, "kind": "association", "stem": "The temperature and time for visible M. tuberculosis colonies on solid media are:", "opts": ["42 C for 2 days", "25 C for 24 hours", "30 C for 6 weeks", "37 C for about 2-8 weeks"], "key": 3, "exp": "Answer: about 2-8 weeks at 37 C (slow growth, per the book).", "src": "PDF 110 (printed 103)"}, {"n": 50, "img": null, "kind": "association", "stem": "Specimens used in leprosy diagnosis include:", "opts": ["Stool samples only", "Urine samples only", "Sputum and CSF samples", "Slit-skin smear, biopsy or nasal scraping"], "key": 3, "exp": "Answer: slit-skin smears, skin biopsy, or scrapings from the nasal mucosa.", "src": "PDF 119 (printed 112)"}, {"n": 51, "img": null, "kind": "association", "stem": "Which fluid systems use Middlebrook broth as the base?", "opts": ["BACTEC AFB and MGIT", "MGIT and QuantiFERON", "TST and BACTEC", "BACTEC and Widal"], "key": 0, "exp": "Answer: BACTEC AFB system and MGIT.", "src": "PDF 112 (printed 105)"}, {"n": 52, "img": null, "kind": "association", "stem": "Treatment of tuberculoid leprosy uses:", "opts": ["Rifampin only", "Isoniazid only", "2 drugs: dapsone and rifampicin", "3 drugs including clofazimine"], "key": 2, "exp": "Answer: dapsone + rifampicin (2 drugs).", "src": "PDF 119 (printed 112)"}, {"n": 53, "img": null, "kind": "association", "stem": "Another name for members of the M. tuberculosis complex is:", "opts": ["Atypical mycobacteria", "Mycobacteria other than tuberculosis", "Environmental mycobacteria", "Tubercle bacilli"], "key": 3, "exp": "Answer: tubercle bacilli. NTM are also called mycobacteria other than tuberculosis (MOTT).", "src": "PDF 109 (printed 102)"}, {"n": 54, "img": null, "kind": "except", "stem": "Regarding BCG, all of the following are true EXCEPT:", "opts": ["It is given intradermally in the left deltoid", "It is prepared from M. bovis", "It is a killed vaccine made from M. tuberculosis", "It is a live attenuated vaccine"], "key": 2, "exp": "Answer: BCG is live attenuated from M. bovis, not a killed M. tuberculosis vaccine.", "src": "PDF 116 (printed 109)"}, {"n": 55, "img": null, "kind": "clinical case", "stem": "A haemodialysis unit has patients with infection due to mycobacteria found in the water supply. Which group?", "opts": ["Nontuberculous mycobacteria", "M. leprae", "Tuberculosis complex", "Legionella"], "key": 0, "exp": "Answer: NTM, recovered from haemodialysis unit water and tap water.", "src": "PDF 116 (printed 109)"}, {"n": 56, "img": "113-094", "kind": "association", "stem": "Tubes glow under UV light in this system once mycobacteria multiply. What causes the signal?", "opts": ["Release of 14C-labelled CO2 from palmitate", "Oxygen depletion sensed by a fluorescence sensor", "Acid production that changes a pH dye", "Production of H2S from thiosulphate"], "key": 1, "exp": "Answer: oxygen depletion. Book trigger: MGIT \"bacterial growth will result in oxygen depletion ... a fluorescence sensor that fluoresces upon exposure to UV light\".", "src": "PDF 113 (printed 106), Fig 1.73"}, {"n": 57, "img": null, "kind": "clinical case", "stem": "A child drinks unpasteurized milk and has abdominal TB. Which organism?", "opts": ["Mycobacterium bovis", "Mycobacterium leprae", "Legionella", "Mycobacterium avium"], "key": 0, "exp": "Answer: M. bovis, from ingestion of contaminated milk.", "src": "PDF 110 (printed 103)"}, {"n": 58, "img": null, "kind": "association", "stem": "Prognosis of lepromatous leprosy is:", "opts": ["Always good with BCG", "Bad", "Spontaneous cure", "Good"], "key": 1, "exp": "Answer: bad (tuberculoid: good).", "src": "PDF 119 (printed 112), Table 1.13"}, {"n": 59, "img": null, "kind": "association", "stem": "Which is a first-line anti-TB drug?", "opts": ["Cycloserine", "Ethionamide", "Kanamycin", "Pyrazinamide"], "key": 3, "exp": "Answer: pyrazinamide. First-line: isoniazid, rifampin, pyrazinamide, ethambutol, streptomycin.", "src": "PDF 116 (printed 109)"}, {"n": 60, "img": null, "kind": "sequence", "stem": "Order for sputum processing: (1) decontamination (2) liquefaction (3) centrifugation (4) smear and culture of deposit.", "opts": ["2, 1, 3, 4", "3, 2, 1, 4", "2, 3, 1, 4", "1, 2, 3, 4"], "key": 0, "exp": "Answer: 2, 1, 3, 4 (NALC, 4% NaOH, centrifuge, then smear/culture).", "src": "PDF 112 (printed 105)"}, {"n": 61, "img": null, "kind": "association", "stem": "Why is a combination of 4 or more drugs essential in TB therapy?", "opts": ["To avoid infection with NTM species", "To reduce toxicity and prevent resistant mutants", "To shorten the course to 2 weeks", "To prevent BCG vaccine reactions"], "key": 1, "exp": "Answer: reduce toxicity and prevent emergence of drug-resistant mutants; therapy lasts at least 6 months.", "src": "PDF 115 (printed 108)"}, {"n": 62, "img": null, "kind": "association", "stem": "Bacteraemia is:", "opts": ["Present in TL, absent in LL", "Present in both forms", "Present in LL, absent in TL", "Absent in both forms"], "key": 2, "exp": "Answer: present in LL, absent in TL.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 63, "img": null, "kind": "definition", "stem": "Pulmonary TB disease differs from latent infection because only disease is:", "opts": ["Associated with M. tuberculosis", "Tuberculin positive", "Infectious and a case of TB", "QuantiFERON positive"], "key": 2, "exp": "Answer: only disease is often infectious and a case of TB (both are tuberculin/QuantiFERON positive with M. tuberculosis present).", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 64, "img": null, "kind": "definition", "stem": "DOTS is recommended by WHO because of:", "opts": ["Patients' non-compliance", "Resistance to NTM", "Lack of BCG", "Drug toxicity only"], "key": 0, "exp": "Answer: DOTS (directly observed therapy short course) addresses non-compliance.", "src": "PDF 115 (printed 108)"}, {"n": 65, "img": "114-096", "kind": "association", "stem": "A reader measures this reaction with a ruler 48-72 hours after the injection. Which part is measured?", "opts": ["The vesicle at the injection point", "The whole red area including the margin", "The erythema, not the induration", "The induration, not the erythema"], "key": 3, "exp": "Answer: induration. Book trigger: \"The diameter of the induration (NOT the erythema) is measured in millimeters\".", "src": "PDF 114 (printed 107), Fig 1.74"}, {"n": 66, "img": "110-093", "kind": "except", "stem": "This tube culture shows growth of M. tuberculosis. All of the following statements about its culture are true EXCEPT:", "opts": ["Colonies appear after about 2-8 weeks at 37 C", "Lowenstein-Jensen medium is egg-based", "Malachite green makes the medium selective", "Visible colonies appear within 24 hours"], "key": 3, "exp": "Answer: visible colonies within 24 hours is false. The organism has a slow rate of growth; colonies appear after about 2-8 weeks.", "src": "PDF 110 (printed 103), Fig 1.71"}, {"n": 67, "img": "114-096", "kind": "except", "stem": "Regarding the skin test being read here, all of the following are true EXCEPT:", "opts": ["It is read after 48-72 hours", "A positive result proves active tuberculosis", "A positive result does not distinguish latent from active disease", "It detects delayed hypersensitivity"], "key": 1, "exp": "Answer: a positive test cannot distinguish latent infection from active disease. Book: \"a positive TST indicates previous infection by the organism but not necessarily active disease\".", "src": "PDF 113 (printed 106)"}, {"n": 68, "img": null, "kind": "clinical case", "stem": "A traveller has a positive QuantiFERON and no symptoms. Which result separates latent infection from disease?", "opts": ["Lepromin test result", "Tuberculin test result", "Sputum smear and culture", "QuantiFERON result"], "key": 2, "exp": "Answer: sputum smear and culture (negative in latent infection, positive in disease). Tuberculin and QuantiFERON are positive in both (Table 1.11).", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 69, "img": null, "kind": "association", "stem": "Leprosy infection may be transmitted by:", "opts": ["An insect vector only", "Skin lesion contact or aerosol", "The faeco-oral route", "Sexual contact only"], "key": 1, "exp": "Answer: contact with skin lesions or aerosol inhalation.", "src": "PDF 118 (printed 111)"}, {"n": 70, "img": null, "kind": "association", "stem": "A 5 mm induration is positive for which group?", "opts": ["Healthcare workers only", "Anyone vaccinated at birth", "Recent TB contacts", "Healthy adults with no risk factors"], "key": 2, "exp": "Answer: 5 mm in HIV-infected, recent contacts, organ transplant recipients.", "src": "PDF 114 (printed 107)"}, {"n": 71, "img": null, "kind": "double-clue", "stem": "Which organism forms colonies on L-J medium after 2-8 weeks and persists dormant in granulomas?", "opts": ["Mycobacterium leprae", "Mycobacterium tuberculosis", "Legionella pneumophila", "Nocardia"], "key": 1, "exp": "Answer: M. tuberculosis (colonies after about 2-8 weeks; survives in small numbers in granulomas in latent infection).", "src": "PDF 110 (printed 103)"}, {"n": 72, "img": null, "kind": "clinical case", "stem": "A healthy man from an endemic area has a 12 mm induration. Which cut-off applies?", "opts": ["15 mm applies, so negative", "No cut-off applies to him", "10 mm applies, so positive", "5 mm applies, so negative"], "key": 2, "exp": "Answer: 10 mm or more is positive in individuals from endemic areas, so 12 mm is positive.", "src": "PDF 114 (printed 107)"}, {"n": 73, "img": null, "kind": "association", "stem": "Which agent liquefies sputum for TB processing?", "opts": ["Malachite green", "N-acetyl-L-cysteine (NALC)", "Sodium desoxycholate", "4% NaOH"], "key": 1, "exp": "Answer: NALC liquefies and releases the tubercle bacilli; 4% NaOH decontaminates.", "src": "PDF 112 (printed 105)"}, {"n": 74, "img": null, "kind": "definition", "stem": "Middlebrook's medium differs from L-J medium in that it is:", "opts": ["A bile salt selective agar", "Egg-based; malachite green selective", "A charcoal blood agar medium", "Enriched; antibiotics make it selective"], "key": 3, "exp": "Answer: Middlebrook's medium is an enriched medium that can be rendered selective by addition of antibiotics; it may be broth or agar.", "src": "PDF 109 (printed 102)"}, {"n": 75, "img": null, "kind": "except", "stem": "False-negative tuberculin reactions can be due to all EXCEPT:", "opts": ["Infection with nontuberculous mycobacteria", "Recent TB infection within 4-6 weeks", "Anergy", "HIV infection"], "key": 0, "exp": "Answer: NTM infection causes FALSE-POSITIVE reactions (cross-reaction).", "src": "PDF 114 (printed 107)"}, {"n": 76, "img": null, "kind": "clinical case", "stem": "A patient with persistent cough and a smear where bacilli glow orange-yellow under UV. Which stain?", "opts": ["Auramine-rhodamine", "Gram", "Giemsa", "Ziehl-Neelsen"], "key": 0, "exp": "Answer: auramine-rhodamine fluorochrome.", "src": "PDF 112 (printed 105)"}, {"n": 77, "img": null, "kind": "clinical case", "stem": "A healthcare worker has a 10 mm induration and no symptoms. How is it read?", "opts": ["Positive", "Negative", "Invalid", "Active TB for sure"], "key": 0, "exp": "Answer: positive in healthcare workers at 10 mm or more. It does not prove active disease.", "src": "PDF 114 (printed 107)"}, {"n": 78, "img": null, "kind": "except", "stem": "Which of these is NOT a feature of the QuantiFERON TB test in the book?", "opts": ["It is costly", "It needs a single blood specimen", "It is affected by prior BCG vaccination", "It has no reader bias"], "key": 2, "exp": "Answer: the result is NOT affected by prior BCG vaccination (an advantage). It is costly and blood must be tested within 12 hours.", "src": "PDF 115 (printed 108)"}, {"n": 79, "img": null, "kind": "association", "stem": "After how long is the tuberculin test read?", "opts": ["4-6 weeks", "48-72 hours", "7 days", "6-12 hours"], "key": 1, "exp": "Answer: 48-72 hours by palpation for induration.", "src": "PDF 113 (printed 106)"}, {"n": 80, "img": null, "kind": "clinical case", "stem": "A baby is born into a TB-endemic area. Which prevention does the book describe?", "opts": ["The lepromin skin test", "Rifampin for 6 months", "BCG, intradermal in left deltoid", "Isoniazid for 2 weeks"], "key": 2, "exp": "Answer: BCG, a live attenuated vaccine, given to newborns.", "src": "PDF 116 (printed 109)"}, {"n": 81, "img": "114-096", "kind": "clinical case", "stem": "A healthy person with no TB risk factors has a 12 mm induration like the one shown. How is it read?", "opts": ["Positive, because 10 mm or more is positive in everyone", "Negative, because 15 mm or more is needed in this group", "Invalid, because the test must be read at 24 hours", "Positive, because any induration is positive"], "key": 1, "exp": "Answer: negative. Book: 15 mm or more is positive in healthy individuals with no known TB risk factors (5 mm for HIV, contacts, transplant; 10 mm for health workers, diabetes, cancer, endemic areas).", "src": "PDF 114 (printed 107)"}, {"n": 82, "img": null, "kind": "definition", "stem": "A positive tuberculin test indicates:", "opts": ["Active disease only", "Previous infection, not always active disease", "Current bacteremia with TB", "Immunity from BCG only"], "key": 1, "exp": "Answer: previous infection by the organism but not necessarily active disease.", "src": "PDF 113 (printed 106)"}, {"n": 83, "img": null, "kind": "except", "stem": "False-positive tuberculin reactions are caused by all EXCEPT:", "opts": ["Anergy", "NTM infection", "BCG vaccination", "Cross-reaction with M. tuberculosis antigens"], "key": 0, "exp": "Answer: anergy gives false negatives.", "src": "PDF 114 (printed 107)"}, {"n": 84, "img": null, "kind": "definition", "stem": "Compared with TST, QuantiFERON is more specific for latent TB because:", "opts": ["It measures antibodies to the bacillus", "Its antigens are absent from NTM and BCG", "It uses a larger dose of PPD", "It is read by measuring induration"], "key": 1, "exp": "Answer: ESAT-6 and CFP-10 are not present in NTM or BCG vaccine strains.", "src": "PDF 115 (printed 108)"}, {"n": 85, "img": null, "kind": "definition", "stem": "What does the definitive laboratory diagnosis of tuberculosis depend on?", "opts": ["Antibody detection in serum", "A chest X-ray film", "Isolation of M. tuberculosis from specimens", "A positive tuberculin test"], "key": 2, "exp": "Answer: detection and isolation of M. tuberculosis from clinical specimens.", "src": "PDF 112 (printed 105)"}, {"n": 86, "img": null, "kind": "association", "stem": "AFB in lesions are:", "opts": ["Abundant in both forms", "Few in TL, abundant in LL", "Few in both forms", "Abundant in TL, few in LL"], "key": 1, "exp": "Answer: few in TL, abundant in LL.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 87, "img": null, "kind": "association", "stem": "What is the purpose of 4% NaOH in sputum processing?", "opts": ["To kill contaminants", "To stain the bacilli", "To concentrate the specimen", "To liquefy mucus"], "key": 0, "exp": "Answer: decontamination by 4% NaOH to kill contaminants.", "src": "PDF 112 (printed 105)"}, {"n": 88, "img": null, "kind": "association", "stem": "Which solid media are used to culture mycobacteria?", "opts": ["Lowenstein-Jensen and Middlebrook agar", "Chocolate and Thayer-Martin", "TCBS and Skirrow", "MacConkey and blood agar"], "key": 0, "exp": "Answer: L-J and Middlebrook's agar.", "src": "PDF 112 (printed 105)"}, {"n": 89, "img": null, "kind": "clinical case", "stem": "A patient on high-dose steroids develops cough and night sweats. Chest imaging shows an apical lesion. Which process is most likely?", "opts": ["Primary infection from milk", "Reactivation of latent TB", "Latent TB with no disease", "BCG infection"], "key": 1, "exp": "Answer: reactivation. Book: immunosuppression may reactivate latent TB; the apex is the commonest site.", "src": "PDF 111 (printed 104)"}, {"n": 90, "img": null, "kind": "association", "stem": "In Table 1.11, which feature is the same in latent infection and pulmonary TB disease?", "opts": ["Infectiousness", "Symptoms", "Positive sputum smears", "Positive tuberculin or QuantiFERON"], "key": 3, "exp": "Answer: both are tuberculin/QuantiFERON positive (and M. tuberculosis is present in both).", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 91, "img": "109-092", "kind": "association", "stem": "Which microscope is needed to read the smear shown in this image?", "opts": ["Electron microscope only", "Fluorescence (UV) microscope", "Light microscope with Gram stain", "Dark-field microscope"], "key": 1, "exp": "Answer: UV (fluorescence) microscope. Book: auramine-rhodamine AFB \"fluoresces orange yellow in a black background\" under the UV microscope; Z-N is read under the light microscope.", "src": "PDF 109 (printed 102), Fig 1.69b"}, {"n": 92, "img": null, "kind": "association", "stem": "Which immune response is the main defence against mycobacteria?", "opts": ["Antibody-mediated immunity", "IgE response", "Complement alone", "Cell-mediated immunity"], "key": 3, "exp": "Answer: cell-mediated immune response, starting about 4-6 weeks after infection and forming granulomas (tubercles).", "src": "PDF 110 (printed 103)"}, {"n": 93, "img": null, "kind": "association", "stem": "When are QuantiFERON results read?", "opts": ["After 24 hours", "After 4-6 weeks", "After 2-8 weeks", "After 48-72 hours"], "key": 0, "exp": "Answer: results are read after 24 hours only.", "src": "PDF 115 (printed 108)"}, {"n": 94, "img": null, "kind": "association", "stem": "Where do M. leprae bacilli chiefly occur in the infected tissue?", "opts": ["In bundles within the infected cells", "In spores in the nucleus", "In clusters outside cells", "Free in the plasma"], "key": 0, "exp": "Answer: chiefly in bundles within infected cells.", "src": "PDF 117 (printed 110)"}, {"n": 95, "img": null, "kind": "definition", "stem": "MOTT stands for:", "opts": ["Multi-organism tubercle toxin", "Mycobacteria other than tuberculosis", "Mycobacterial outer tubercle test", "Mycobacteria of tuberculosis type"], "key": 1, "exp": "Answer: mycobacteria other than tuberculosis, a synonym of NTM.", "src": "PDF 116 (printed 109)"}, {"n": 96, "img": null, "kind": "definition", "stem": "Second-line drugs are used when:", "opts": ["The patient is a newborn", "First-line drugs are expensive", "Resistance occurs during first-line therapy", "The patient has latent TB"], "key": 2, "exp": "Answer: only if resistance occurs during administration of first-line drugs.", "src": "PDF 116 (printed 109)"}, {"n": 97, "img": "115-097", "kind": "association", "stem": "Which antigens does the diagram's TB antigen represent in the book?", "opts": ["PPD and BCG", "Vi antigen and O antigen", "ESAT-6 and CFP-10", "Lipoarabinomannan and cord factor"], "key": 2, "exp": "Answer: ESAT-6 and CFP-10, which are absent from NTM and BCG vaccine strains.", "src": "PDF 115 (printed 108)"}, {"n": 98, "img": null, "kind": "except", "stem": "Regarding GeneXpert MTB/RIF, all are true EXCEPT:", "opts": ["It requires culture for 6 weeks before testing", "It detects mutations linked to rifampicin resistance", "It detects M. tuberculosis DNA", "It works directly on raw clinical specimens"], "key": 0, "exp": "Answer: it needs no prior culture; it gives same-day results from raw specimens.", "src": "PDF 112 (printed 105)"}, {"n": 99, "img": null, "kind": "clinical case", "stem": "A patient has numerous nodular lesions, symmetric sensory loss and abundant AFB. Which immune pattern?", "opts": ["Strong CMI and strong antibodies", "Strong CMI with weak antibodies (Th1)", "No antibodies and no CMI", "Weak CMI with strong antibody response (Th2)"], "key": 3, "exp": "Answer: lepromatous leprosy: predominant AMI, weak CMI, strong antibody, Th2.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 100, "img": null, "kind": "association", "stem": "What allows the remaining bacilli to multiply inside macrophages?", "opts": ["Inhibition of phagosome-lysosome fusion", "Production of a capsule against complement", "Neutralization of IgA", "Destruction of the phagolysosome by a toxin"], "key": 0, "exp": "Answer: inhibiting fusion of phagosomes and lysosomes.", "src": "PDF 110 (printed 103)"}, {"n": 101, "img": null, "kind": "clinical case", "stem": "A man exposed to TB 2 weeks ago has a negative tuberculin test. Why might it be falsely negative?", "opts": ["It takes 4-6 weeks to turn positive", "Tuberculin only works after 6 months", "The patient must have had BCG vaccine", "The test must be read after 24 hours"], "key": 0, "exp": "Answer: recent TB infection; the test needs 4-6 weeks to become positive.", "src": "PDF 114 (printed 107)"}, {"n": 102, "img": null, "kind": "association", "stem": "A BCG vaccination can keep the TST positive for up to:", "opts": ["6 weeks", "1 week", "6 months", "5 years"], "key": 3, "exp": "Answer: up to 5 years.", "src": "PDF 114 (printed 107)"}, {"n": 103, "img": "114-095", "kind": "association", "stem": "A nurse gives the test in this photo. What dose is used?", "opts": ["0.1 ml containing 5 TU of PPD", "0.1 ml containing 50 TU of PPD", "0.5 ml containing 1 TU of PPD", "1 ml containing 5 TU of PPD"], "key": 0, "exp": "Answer: 0.1 ml PPD with 5 tuberculin units, intradermally.", "src": "PDF 113 (printed 106)"}, {"n": 104, "img": null, "kind": "except", "stem": "Which is NOT a listed symptom of tuberculosis disease?", "opts": ["Rash on the palms and soles", "Persistent cough", "Night sweats", "Bloody sputum"], "key": 0, "exp": "Answer: palm and sole rash. Listed: malaise, fatigue, night sweats, fever, persistent cough, maybe bloody sputum.", "src": "PDF 111 (printed 104)"}, {"n": 105, "img": null, "kind": "definition", "stem": "Leprosy is also called:", "opts": ["Pott's disease", "Hansen's disease", "Lyme disease", "Weil's disease"], "key": 1, "exp": "Answer: Hansen's disease, a chronic infectious disease.", "src": "PDF 117 (printed 110)"}, {"n": 106, "img": "113-094", "kind": "association", "stem": "The fluorescing tubes shown are read in a fluid culture system. Which base medium do these systems use?", "opts": ["Lowenstein-Jensen medium", "Middlebrook broth", "Thiosulphate citrate bile sucrose agar", "Blood agar"], "key": 1, "exp": "Answer: Middlebrook broth. Book trigger: \"Middlebrook broth is used as the base for the following systems\" (BACTEC and MGIT).", "src": "PDF 112 (printed 105)"}, {"n": 107, "img": null, "kind": "except", "stem": "Features of M. leprae include all EXCEPT:", "opts": ["It grows on Lowenstein-Jensen medium in 2-8 weeks", "It occurs in bundles within infected cells", "It grows best at about 30 C", "It is less acid-fast than M. tuberculosis"], "key": 0, "exp": "Answer: M. leprae has not been cultured in vitro; L-J growth in 2-8 weeks is M. tuberculosis.", "src": "PDF 117 (printed 110)"}, {"n": 108, "img": null, "kind": "association", "stem": "A TST of 10 mm is positive in which person?", "opts": ["A healthcare worker", "A newborn only", "A healthy person without risk factors", "A person with no exposure"], "key": 0, "exp": "Answer: 10 mm is positive in healthcare workers, diabetes, cancer, and people from endemic areas.", "src": "PDF 114 (printed 107)"}, {"n": 109, "img": null, "kind": "definition", "stem": "Why may leprosy disease appear years after contact?", "opts": ["Rapid growth of the bacillus", "High infectivity of the bacillus", "Low infectivity and slow growth", "Toxin production by the bacillus"], "key": 2, "exp": "Answer: low infectivity of M. leprae and long generation time (slow growth).", "src": "PDF 118 (printed 111)"}, {"n": 110, "img": null, "kind": "association", "stem": "Which row separates latent TB infection from pulmonary TB disease in Table 1.11?", "opts": ["Tuberculin test", "Presence of M. tuberculosis", "Sputum smears and cultures", "QuantiFERON test"], "key": 2, "exp": "Answer: sputum smears and cultures are negative in latent TB and positive in disease. Tuberculin/QuantiFERON are positive in both, and M. tuberculosis is present in both.", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 111, "img": null, "kind": "association", "stem": "Which immune profile fits lepromatous leprosy?", "opts": ["Strong CMI, weak antibodies, Th1", "Weak CMI, strong antibody response, Th2", "No immune response of any type", "Strong CMI and Th2"], "key": 1, "exp": "Answer: lepromatous: weak CMI, predominant AMI, strong antibody response, Th2.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 112, "img": null, "kind": "association", "stem": "Reactivation of latent TB is favoured by:", "opts": ["BCG revaccination", "Pasteurized milk", "Immunosuppression", "Recent tuberculin testing"], "key": 2, "exp": "Answer: immunosuppression or disturbance of the host-parasite balance. The most common site is the apex of the lung.", "src": "PDF 111 (printed 104)"}, {"n": 113, "img": null, "kind": "except", "stem": "Tuberculosis may affect other systems EXCEPT which of these listed in the book?", "opts": ["Lymphadenitis", "Meningitis", "Renal infection", "Peripheral facial nerve palsy"], "key": 3, "exp": "Answer: facial nerve palsy is not listed. Book lists tuberculous meningitis, lymphadenitis, renal and intestinal TB.", "src": "PDF 111 (printed 104)"}, {"n": 114, "img": null, "kind": "association", "stem": "On Ziehl-Neelsen staining, M. tuberculosis is described as:", "opts": ["Slender acid-fast bacilli, pink on a blue background", "Curved bacilli, green on a yellow background", "Pleomorphic cocci, blue on a red background", "Thick Gram-positive bacilli, purple on a pink background"], "key": 0, "exp": "Answer: slender acid-fast bacilli that appear pink on a blue background.", "src": "PDF 109 (printed 102)"}, {"n": 115, "img": null, "kind": "clinical case", "stem": "A man with fever, weight loss, cough and positive sputum smear. Which statement is correct?", "opts": ["Latent TB infection only", "Not infectious", "Often infectious, a case of TB", "Not a case of TB"], "key": 2, "exp": "Answer: pulmonary TB disease: cough, fever, weight loss; often infectious; a case of TB.", "src": "PDF 111 (printed 104), Table 1.11"}, {"n": 116, "img": null, "kind": "double-clue", "stem": "Which organism forms intracellular bundles, is less acid-fast, cannot be cultured in vitro and grows in armadillos?", "opts": ["Mycobacterium avium", "Mycobacterium microti", "Mycobacterium bovis", "Mycobacterium leprae"], "key": 3, "exp": "Answer: M. leprae (modified Z-N, mouse footpads, nine-banded armadillo).", "src": "PDF 117 (printed 110)"}, {"n": 117, "img": null, "kind": "definition", "stem": "Latent TB infection is a state in which:", "opts": ["Bacilli multiply freely in the sputum", "Bacilli survive dormant in granulomas", "Bacilli live only in the blood", "Bacilli are completely eradicated"], "key": 1, "exp": "Answer: balanced host-parasite relationship with dormant bacilli in the granuloma.", "src": "PDF 110 (printed 103)"}, {"n": 118, "img": null, "kind": "definition", "stem": "BCG vaccine is prepared from:", "opts": ["M. avium by freeze drying", "M. bovis, attenuated by repeated subcultures", "M. tuberculosis killed by heat", "M. leprae attenuated in armadillos"], "key": 1, "exp": "Answer: live attenuated vaccine from M. bovis, repeated subcultures.", "src": "PDF 116 (printed 109)"}, {"n": 119, "img": null, "kind": "definition", "stem": "How does the BACTEC AFB system detect growth?", "opts": ["Oxygen depletion and fluorescence", "Latex agglutination", "14C-labelled CO2 released from palmitate", "Color change of pH indicator"], "key": 2, "exp": "Answer: 14C-CO2 from breakdown of radio-labelled palmitate. MGIT uses oxygen depletion.", "src": "PDF 113 (printed 106)"}, {"n": 120, "img": null, "kind": "association", "stem": "BCG is routinely given to newborns:", "opts": ["Intramuscularly in the buttock", "Intradermally in the left deltoid region", "Orally", "Subcutaneously in the thigh"], "key": 1, "exp": "Answer: intradermally in the left deltoid.", "src": "PDF 116 (printed 109)"}, {"n": 121, "img": null, "kind": "clinical case", "stem": "A patient with loss of sensation in hands, few pale patches and positive lepromin test. Which form?", "opts": ["Latent TB", "Lepromatous leprosy", "Tuberculoid leprosy", "MAC infection"], "key": 2, "exp": "Answer: tuberculoid leprosy (positive lepromin, good prognosis).", "src": "PDF 118 (printed 111)"}, {"n": 122, "img": null, "kind": "sequence", "stem": "Natural history order: (1) latent infection (2) immunosuppression (3) reactivation at the apex (4) pulmonary TB disease.", "opts": ["1, 3, 2, 4", "1, 2, 3, 4", "3, 1, 2, 4", "2, 1, 3, 4"], "key": 1, "exp": "Answer: latent infection, then immunosuppression disturbs the balance, then reactivation (commonly at the apex) with TB disease.", "src": "PDF 111 (printed 104)"}, {"n": 123, "img": "109-091", "kind": "definition", "stem": "In the ZN smear shown, what do the pink-red rods have in common?", "opts": ["They are acid-fast bacilli that resisted decolourization", "They are Gram-negative bacilli that lost the crystal violet", "They are spores stained by the counterstain", "They are capsulated bacilli stained by the dye"], "key": 0, "exp": "Answer: acid-fast bacilli. Book: acid-fast organisms \"firmly retain the dye used and resist decolourization even by acidic solutions\"; M. tuberculosis appears pink on a blue background with Z-N.", "src": "PDF 109 (printed 102), Fig 1.69a"}, {"n": 124, "img": null, "kind": "double-clue", "stem": "Which test uses whole blood, is read after 24 hours and relies on ESAT-6 and CFP-10?", "opts": ["GeneXpert MTB/RIF", "QuantiFERON TB", "Lepromin test", "Tuberculin skin test"], "key": 1, "exp": "Answer: QuantiFERON TB (IFN-gamma release assay).", "src": "PDF 115 (printed 108)"}, {"n": 125, "img": "114-095", "kind": "definition", "stem": "The test being given here detects which type of immune response?", "opts": ["Immediate IgE hypersensitivity", "Immune complex deposition", "Antibody-mediated lysis", "Delayed hypersensitivity"], "key": 3, "exp": "Answer: delayed hypersensitivity. Book trigger: \"detects delayed hypersensitivity response to previous exposure of the host to tubercle bacilli\".", "src": "PDF 113 (printed 106)"}, {"n": 126, "img": null, "kind": "association", "stem": "Which immune profile fits tuberculoid leprosy?", "opts": ["Weak CMI, strong antibodies, Th2", "Weak CMI and Th1", "Strong antibodies and Th2", "Strong CMI, weak antibodies, Th1"], "key": 3, "exp": "Answer: tuberculoid: predominant CMI, strong; antibody weak; Th1.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 127, "img": null, "kind": "sequence", "stem": "Put the early events in order: (1) uptake by alveolar macrophages (2) droplet nuclei reach terminal alveoli (3) cell-mediated response and granuloma (4) latent dormant bacilli.", "opts": ["2, 3, 1, 4", "1, 2, 3, 4", "1, 3, 2, 4", "2, 1, 3, 4"], "key": 3, "exp": "Answer: 2, 1, 3, 4. Book: nuclei reach alveoli, macrophages engulf them, CMI starts at 4-6 weeks and forms the granuloma, survivors stay dormant (latent TB).", "src": "PDF 110 (printed 103)"}, {"n": 128, "img": null, "kind": "association", "stem": "Which species is NOT a nontuberculous mycobacterium in the book's examples?", "opts": ["Mycobacterium avium", "Mycobacterium avium-intracellulare complex", "Mycobacterium microti", "Mycobacterium fortuitum"], "key": 2, "exp": "Answer: M. microti belongs to the tuberculosis complex. NTM examples: M. avium and M. fortuitum (also MAC).", "src": "PDF 109 (printed 102)"}, {"n": 129, "img": "115-097", "kind": "except", "stem": "All of the following are advantages of the test shown EXCEPT:", "opts": ["There is no reader bias", "It is cheap and the blood can wait for days", "It needs a single blood specimen", "The patient need not return for a reading"], "key": 1, "exp": "Answer: it is costly and the blood must be tested within 12 hours (these are the disadvantages).", "src": "PDF 115 (printed 108)"}, {"n": 130, "img": "109-091", "kind": "association", "stem": "Which stain produced the appearance in this smear of sputum from a patient with suspected TB?", "opts": ["Gram stain", "Ziehl-Neelsen stain", "Auramine-rhodamine stain", "Giemsa stain"], "key": 1, "exp": "Answer: Ziehl-Neelsen. Book trigger: \"AFB appears pink in a blue background\" (Fig 1.69a).", "src": "PDF 109 (printed 102), Fig 1.69a"}, {"n": 131, "img": null, "kind": "association", "stem": "The BACTEC medium contains which sole carbon source?", "opts": ["Radio-labelled palmitate", "Radio-labelled glucose", "Egg yolk", "Malachite green"], "key": 0, "exp": "Answer: radio-labelled palmitate; growth liberates 14C-labelled CO2.", "src": "PDF 113 (printed 106)"}, {"n": 132, "img": null, "kind": "definition", "stem": "Leprosy diagnosis is essentially:", "opts": ["Cultural", "Serological only", "Radiological", "Clinical, with lab confirmation"], "key": 3, "exp": "Answer: essentially clinical; lab diagnosis for confirmation.", "src": "PDF 119 (printed 112)"}, {"n": 133, "img": null, "kind": "clinical case", "stem": "A patient has few hypopigmented macules and asymmetric nerve involvement. Which immune response predominates?", "opts": ["No immune response", "Complement deficiency", "Strong antibody response (Th2)", "Strong cell-mediated immunity (Th1)"], "key": 3, "exp": "Answer: tuberculoid leprosy: predominant, strong CMI, weak antibodies, Th1.", "src": "PDF 118 (printed 111), Table 1.13"}, {"n": 134, "img": null, "kind": "association", "stem": "Lepromin test result in tuberculoid leprosy is:", "opts": ["Not interpretable", "Weakly positive only", "Negative", "Positive"], "key": 3, "exp": "Answer: positive in tuberculoid, negative in lepromatous.", "src": "PDF 119 (printed 112)"}, {"n": 135, "img": null, "kind": "clinical case", "stem": "A lab receives sputum from a suspected TB case and wants a result the same day, including rifampicin resistance. Which method?", "opts": ["Lowenstein-Jensen culture", "GeneXpert MTB/RIF PCR", "Tuberculin skin test", "MGIT culture"], "key": 1, "exp": "Answer: GeneXpert MTB/RIF PCR: same-day detection of DNA and rifampicin resistance mutations directly from raw specimens.", "src": "PDF 112 (printed 105)"}, {"n": 136, "img": "117-101", "kind": "clinical case", "stem": "A lab needs to propagate leprosy bacilli. Which option does the book give?", "opts": ["BACTEC fluid medium", "Mouse footpads or armadillos", "Lowenstein-Jensen slopes", "Middlebrook agar at 37 C"], "key": 1, "exp": "Answer: mouse footpads or nine-banded armadillos.", "src": "PDF 117 (printed 110)"}, {"n": 137, "img": null, "kind": "sequence", "stem": "Arrange TB culture and detection methods from fastest to slowest result: (1) L-J solid medium (2) MGIT (3) GeneXpert MTB/RIF.", "opts": ["3, 1, 2", "3, 2, 1", "2, 3, 1", "1, 2, 3"], "key": 1, "exp": "Answer: GeneXpert same day, MGIT 4-14 days, L-J 2-8 weeks.", "src": "PDF 112 (printed 105)"}, {"n": 138, "img": null, "kind": "clinical case", "stem": "A child vaccinated with BCG 3 years ago has a positive tuberculin test. Which explanation fits?", "opts": ["BCG false positive, lasting up to 5 years", "Proof of active TB disease", "Cross-reaction with M. leprae", "False negative from anergy"], "key": 0, "exp": "Answer: BCG vaccination can leave the TST positive for up to 5 years.", "src": "PDF 114 (printed 107)"}, {"n": 139, "img": null, "kind": "association", "stem": "Which of these is a second-line drug?", "opts": ["Isoniazid", "Streptomycin", "Para-aminosalicylic acid", "Ethambutol"], "key": 2, "exp": "Answer: para-aminosalicylic acid. Second-line: fluoroquinolones, PAS, ethionamide, cycloserine, capreomycin, kanamycin, amikacin, rifabutin.", "src": "PDF 116 (printed 109)"}, {"n": 140, "img": null, "kind": "association", "stem": "The members of the M. tuberculosis complex can cause tuberculosis in:", "opts": ["Humans only", "Birds only", "Cattle only", "Humans and animals"], "key": 3, "exp": "Answer: man and animals. Humans are the only reservoir for M. tuberculosis itself.", "src": "PDF 109 (printed 102)"}];

const L='abcd';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Mycobacteria: TB &amp; Leprosy</h2>
<p>${Q.length} MCQs from the coursebook section on Mycobacterium, TB and leprosy (printed pages 102-112), with the book figures. Mixed topics in random order. Each question tags its type. Answers follow the coursebook.</p>
<p><b>Exam mode (default):</b> answer all questions, answers and explanations come only at the end with your score, a review and "Retry missed only".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<button class="btn" onclick="start(shuffle(Q).slice(0,50),'exam')">Exam: 50 random</button>
<p><b>Practice mode (optional):</b> instant feedback after each answer.</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>
</div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#practice')start(Q,'practice');else start(Q,'exam');
</script></body></html>
