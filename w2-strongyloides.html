<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strongyloides stercoralis - SGS (para) - Week 2 timetable</title><style>
:root{--blue:#1d4ed8;--ok:#15803d;--no:#b91c1c}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;margin:0;background:#eef2f7;color:#111}
.w{max-width:700px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001,0 1px 3px #0002;margin-bottom:12px}
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.hdr h2{margin:0 0 4px;font-size:20px}
.hdr .meta{font-size:13px;opacity:.92;line-height:1.5}
.badge{display:inline-block;background:#ffffff2e;border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 0 0}
.bar{height:8px;background:#d7dee9;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.stem{font-size:18px;line-height:1.45;margin:4px 0 12px;font-weight:600}
img.fig{max-width:100%;max-height:360px;display:block;margin:0 auto 12px;border-radius:8px;border:1px solid #e2e8f0}
button.o{display:block;width:100%;text-align:left;font-size:16px;line-height:1.4;padding:13px 14px;margin:8px 0;border:2px solid #d4dbe6;border-radius:12px;background:#fff;cursor:pointer}
button.o:active{transform:scale(.99)}
button.o.ok{border-color:var(--ok);background:#dcfce7}
button.o.no{border-color:var(--no);background:#fee2e2}
.btn{font-size:16px;padding:12px 18px;border:0;border-radius:12px;background:var(--blue);color:#fff;margin:4px 6px 4px 0;cursor:pointer}
.btn.g{background:#64748b}
.btn.o{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn[disabled]{opacity:.4}
.ex{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:12px;margin-top:12px;font-size:15px;line-height:1.5}
.ex .cue{margin-top:8px;background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:8px;font-size:14px}
.src{font-size:12px;color:#555;margin-top:8px}
.top{display:flex;justify-content:space-between;font-size:14px;margin:6px 2px;color:#334155}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.gi{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#e2e8f0;font-size:13px;cursor:pointer}
.gi.done{background:#93c5fd;color:#0f172a}
.gi.cur{outline:2px solid #0f172a}
.rv{font-size:14px}
.ro{padding:8px 10px;margin:4px 0;border-radius:8px;border:1px solid #e5e7eb}
.ro.ok{background:#dcfce7;border-color:var(--ok)}
.ro.no{background:#fee2e2;border-color:var(--no)}
table.cues{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.cues th{background:#1e3a8a;color:#fff;text-align:left;padding:9px 10px;position:sticky;top:0;font-size:13px}
.cues td{padding:9px 10px;border-top:1px solid #e5e7eb;vertical-align:top;line-height:1.45}
.cues td:first-child{font-weight:700;background:#fefce8}
.cues td.ans{background:#f0fdf4}
@media(max-width:640px){
 .cues thead{display:none}
 .cues table,.cues tbody,.cues tr,.cues td{display:block;width:100%;box-sizing:border-box}
 .cues tr{border:1px solid #dbe3ee;border-radius:12px;margin:10px 0;box-shadow:0 1px 3px #0001;overflow:hidden}
 .cues td{border-top:0;padding:7px 12px}
 .cues td:before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
}
.note{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
a.lnk{color:var(--blue)}
</style></head><body><div class="w" id="app"></div><script>
const IMG={};
const BANK={"title": "Strongyloides stercoralis - SGS (para)", "sourceLabel": "T 318-322 + Practical 78", "dateLabel": "Monday 9 Nov, 12:15 (Para p5 SGS)", "indexUrl": "week2-infection-immunity.html", "indexLabel": "Back to Week 2 timetable", "extraLinks": ""};
const Q=[{"n": 1, "stem": "Strongyloides stercoralis habitat is", "opts": ["Liver", "Duodenum and jejunum (parasitic males and females)", "Colon", "Caecum"], "key": 1, "exp": "Trigger: \"parasitic males and females live in the small intestine (duodenum and jejunum)\".", "src": "Theory book PDF 318 (printed 310)", "cue": "habitat", "ask": "Strongyloides stercoralis habitat is", "distinguish": "Dwarf threadworm."}, {"n": 2, "stem": "The diagnostic stage of Strongyloides is", "opts": ["Filariform larvae", "Cysts", "Eggs in stool", "Rhabditiform larvae"], "key": 3, "exp": "Trigger: \"Diagnostic stage: The rhabditiform larvae\".", "src": "Theory book PDF 318 (printed 310)", "cue": "diagnostic", "ask": "The diagnostic stage of Strongyloides is", "distinguish": "Eggs hatch in the gut."}, {"n": 3, "stem": "The infective stage of Strongyloides is", "opts": ["Filariform larvae", "Rhabditiform larvae", "Free-living adults", "Eggs"], "key": 0, "exp": "Trigger: \"The infective stage: Filariform larvae\".", "src": "Theory book PDF 319 (printed 311)", "cue": "infective", "ask": "The infective stage of Strongyloides is", "distinguish": "Penetrate skin of hands and feet."}, {"n": 4, "stem": "Reservoir hosts of Strongyloides include", "opts": ["Cattle", "Dogs and chimpanzees", "Fish", "Pigs"], "key": 1, "exp": "Trigger: \"RH: Dogs and Chimpanzees\".", "src": "Theory book PDF 319 (printed 311)", "cue": "reservoir", "ask": "Reservoir hosts of Strongyloides include", "distinguish": "Strains like man's."}, {"n": 5, "stem": "External autoinfection means larvae", "opts": ["Are inhaled", "Are swallowed", "Penetrate the perianal skin", "Penetrate the gut wall"], "key": 2, "exp": "Trigger: \"External autoinfection: these larvae come out and penetrate the perianal skin\".", "src": "Theory book PDF 319 (printed 311)", "cue": "external autoinfection", "ask": "External autoinfection means larvae", "distinguish": "Internal: through intestinal mucosa."}, {"n": 6, "stem": "Internal autoinfection occurs when", "opts": ["Rhabditiform larvae change into filariform in the lumen and penetrate the mucosa", "Larvae are inhaled", "Larvae penetrate the skin", "Eggs are swallowed"], "key": 0, "exp": "Trigger: \"If the rhabditiform larvae change into filariform larvae in the lumen... penetrate the intestinal mucosa\".", "src": "Theory book PDF 319 (printed 311)", "cue": "internal autoinfection", "ask": "Internal autoinfection occurs when", "distinguish": "Hyperinfection."}, {"n": 7, "stem": "Free-living cycle occurs when", "opts": ["Host immune", "Environmental conditions are favorable; rhabditiform molt to free-living adults in 2 days", "Conditions are unfavorable", "Only in water"], "key": 1, "exp": "Trigger: \"If favorable, the rhabditiform larvae molt in two days to free-living males and females\".", "src": "Theory book PDF 320 (printed 312)", "cue": "free-living cycle", "ask": "Free-living cycle occurs when", "distinguish": "Parasitic cycle in unfavorable conditions."}, {"n": 8, "stem": "The parasitic cycle occurs when", "opts": ["Conditions are unfavorable, so rhabditiform molt to filariform in 2-3 days", "Only in lungs", "Only in blood", "Conditions are favorable"], "key": 0, "exp": "Trigger: \"unfavorable... rhabditiform larvae grow and molt in 2-3 days to filariform larvae that infect man\".", "src": "Theory book PDF 320 (printed 312)", "cue": "parasitic cycle", "ask": "The parasitic cycle occurs when", "distinguish": "Two cycles."}, {"n": 9, "stem": "Strongyloidiasis in immunosuppressed patients is", "opts": ["Self-limited", "An opportunistic helminthic infection with hyperinfection", "Non-pathogenic", "Always asymptomatic"], "key": 1, "exp": "Trigger: \"considered an opportunistic helminthic infection due to the extensive invasion by the adult worms\".", "src": "Theory book PDF 320 (printed 312)", "cue": "opportunistic", "ask": "Strongyloidiasis in immunosuppressed patients is", "distinguish": "Steroid therapy."}, {"n": 10, "stem": "Adults may be found in bronchial epithelium and sputum when", "opts": ["Never", "Filariform larvae reaching the lung develop to adults (immunosuppression)", "Cercariae migrate", "Eggs reach the lung"], "key": 1, "exp": "Trigger: \"filariform larvae reaching the lung may stay... develop to adults. Worms, eggs and rhabditiform larvae in sputum\".", "src": "Theory book PDF 320 (printed 312)", "cue": "adults in lung", "ask": "Adults may be found in bronchial epithelium and sputum when", "distinguish": "Rare."}, {"n": 11, "stem": "Creeping eruption in the invasion stage is due to", "opts": ["Eggs", "Adult metabolites", "Toxins in blood", "Secretory products of penetrating filariform larvae"], "key": 3, "exp": "Trigger: \"skin irritation and creeping eruption... due to the secretory products of penetrating filariform larvae\".", "src": "Theory book PDF 320 (printed 312)", "cue": "invasion", "ask": "Creeping eruption in the invasion stage is due to", "distinguish": "Dermatitis."}, {"n": 12, "stem": "Migration phase of strongyloidiasis includes", "opts": ["Fever, cough, hemoptysis, leukocytosis, eosinophilia", "Obstructive jaundice", "Anemia only", "Dysentery"], "key": 0, "exp": "Trigger: \"fever, cough, expectoration, hemoptysis, leukocytosis, and eosinophilia\".", "src": "Theory book PDF 320 (printed 312)", "cue": "migration", "ask": "Migration phase of strongyloidiasis includes", "distinguish": "Petechial hemorrhage."}, {"n": 13, "stem": "Cochin-China diarrhea is", "opts": ["Watery diarrhea only", "Bloody diarrhea", "Diarrhea alternating with constipation in the intestinal phase", "Rice-water diarrhea"], "key": 2, "exp": "Trigger: \"diarrhea (cochin-china diarrhea) alternating with constipation\".", "src": "Theory book PDF 321 (printed 313)", "cue": "cochin china", "ask": "Cochin-China diarrhea is", "distinguish": "Duodenitis epigastric pain."}, {"n": 14, "stem": "Larva currens (racing larvae) is", "opts": ["Pulmonary lesion", "Massive perianal penetration causing linear urticarial lesions on thigh and trunk", "Intestinal ulcer", "Ground itch"], "key": 1, "exp": "Trigger: \"massive penetration of the perianal skin... linear urticarial lesions... larva currens\".", "src": "Theory book PDF 321 (printed 313)", "cue": "larva currens", "ask": "Larva currens (racing larvae) is", "distinguish": "Immunosuppressed."}, {"n": 15, "stem": "Chronic skin lesions resemble", "opts": ["Psoriasis", "Cutaneous larva migrans", "Scabies", "Urticaria"], "key": 1, "exp": "Trigger: \"linear tortuous urticarial lesions resembling cutaneous larva migrans (CLM)\".", "src": "Theory book PDF 321 (printed 313)", "cue": "CLM-like", "ask": "Chronic skin lesions resemble", "distinguish": "Thighs, back, trunk."}, {"n": 16, "stem": "In disseminated strongyloidiasis larvae may invade", "opts": ["Only skin", "Bone", "Brain, intestine, lymph glands, liver, rarely myocardium", "Only lungs"], "key": 2, "exp": "Trigger: \"may invade the brain, intestine, lymph glands, liver, and rarely the myocardium\".", "src": "Theory book PDF 321 (printed 313)", "cue": "dissemination", "ask": "In disseminated strongyloidiasis larvae may invade", "distinguish": "Via circulation."}, {"n": 17, "stem": "Diagnosis is by finding", "opts": ["Eggs in stool", "Adult worms", "Cysts", "Rhabditiform larvae in stool or sputum"], "key": 3, "exp": "Trigger: \"Rhabditiform larvae in stools (diagnostic) or the sputum by direct simple smear\".", "src": "Theory book PDF 321 (printed 313)", "cue": "diagnosis", "ask": "Diagnosis is by finding", "distinguish": "Baermann increases detection."}, {"n": 18, "stem": "Baermann's technique is used to", "opts": ["Detect pinworm", "Increase detection of larvae", "Detect cysts", "Count eggs"], "key": 1, "exp": "Trigger: \"Baermann's technique increase the chance of detection of larvae\".", "src": "Theory book PDF 321 (printed 313)", "cue": "Baermann", "ask": "Baermann's technique is used to", "distinguish": "Also stool culture."}, {"n": 19, "stem": "Serological tests for Strongyloides include", "opts": ["IHAT and ELISA", "VDRL", "Weil-Felix", "Widal"], "key": 0, "exp": "Trigger: \"Serological tests as IHAT and ELISA\".", "src": "Theory book PDF 321 (printed 313)", "cue": "serology", "ask": "Serological tests for Strongyloides include", "distinguish": "Eosinophilia in blood."}, {"n": 20, "stem": "Treatment of Strongyloides is", "opts": ["Mebendazole", "Thiabendazole 25 mg/kg twice daily for 2-3 days (5-7 days if disseminated)", "Praziquantel", "Albendazole single dose"], "key": 1, "exp": "Trigger: \"Thiabendazole: 25 mg/kg twice daily for 2-3 days. 5-7 days for disseminated\".", "src": "Theory book PDF 322 (printed 314)", "cue": "DOC", "ask": "Treatment of Strongyloides is", "distinguish": "Disseminated needs longer."}, {"n": 21, "stem": "Prevention of Strongyloides includes", "opts": ["Shoes, no barefoot walking, sanitary disposal of feces, mass treatment", "Cooking fish", "Mosquito control", "Boiling bed linen only"], "key": 0, "exp": "Trigger: \"wearing shoes... abstinence from walking barefooted... sanitary disposal... mass treatment\".", "src": "Theory book PDF 322 (printed 314)", "cue": "prevention", "ask": "Prevention of Strongyloides includes", "distinguish": "Feces stored before use as fertilizer."}, {"n": 22, "stem": "Practical: Parasitic female Strongyloides measures", "opts": ["3-5 cm", "2.2 mm x 30-75 micron with cylindrical esophagus", "10-14 mm", "20-35 cm"], "key": 1, "exp": "Trigger: \"Parasitic female: 2.2 mm x 30-75 micron. Cylindrical esophagus extends to anterior third or two fifths\".", "src": "Practical book PDF 78 (printed 71)", "cue": "parasitic female", "ask": "Practical: Parasitic female Strongyloides measures", "distinguish": "Vulva at junction of middle and posterior thirds."}, {"n": 23, "stem": "Practical: Strongyloides filariform larva is", "opts": ["Sheathed with pointed tail", "Esophagus quarter of body", "Unsheathed with a notched tail, esophagus half of body", "Rhabditiform"], "key": 2, "exp": "Trigger: \"measures 600-700 micron. Cylindrical esophagus occupies half of the body. No sheath. Tail is notched\".", "src": "Practical book PDF 78 (printed 71)", "cue": "filariform", "ask": "Practical: Strongyloides filariform larva is", "distinguish": "Hookworm sheathed, pointed."}, {"n": 24, "stem": "Practical: The rhabditiform larva esophagus is", "opts": ["Double-bulbed", "Cellular", "Club-shaped", "Anterior cylindrical and posterior pyriform with isthmus"], "key": 3, "exp": "Trigger: \"Rhabditiform esophagus (anterior cylindrical and posterior pyriform part, separated by an isthmus)\".", "src": "Practical book PDF 68 (printed 61)", "cue": "rhabditiform", "ask": "Practical: The rhabditiform larva esophagus is", "distinguish": "Filariform esophagus is cylindrical."}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
