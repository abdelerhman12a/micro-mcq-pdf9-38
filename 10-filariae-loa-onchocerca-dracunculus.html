const Q=[{"img": null, "kind": "vignette: stage/host", "stem": "A man back from Central West Africa describes a worm passing across the white of his eye, and his midday blood film shows microfilariae. The bite that started this infection came from which vector?", "opts": ["Chrysops (big blood-sucking fly)", "Culex mosquito", "Simulium (black fly)", "Cyclops (water flea)"], "key": 0, "exp": "Trigger words: \"Intermediate host (Vector): Chrysops (big blood sucking fly)\". Simulium transmits Onchocerca; Cyclops is swallowed in Dracunculus.", "src": "PDF 345 (printed 337)", "n": 1}, {"img": null, "kind": "key differentiator", "stem": "Three microfilariae are compared. Which set belongs to Loa loa?", "opts": ["Unsheathed, tail with 2 terminal nuclei, nocturnal periodicity", "Sheathed, tail free of nuclei, nocturnal periodicity", "250 x 8 um, unsheathed, tail free of nuclei, never in blood", "250 x 8 um, tight sheath, kinky curves, tail end full of nuclei, diurnal periodicity"], "key": 3, "exp": "Trigger words: \"Microfilaria: 250 x 8 um with tight sheath and kinky curves. Tail end is full of nuclei. It has diurnal periodicity.\"", "src": "PDF 345 (printed 337)", "n": 2}, {"img": null, "kind": "vignette: stage/host", "stem": "A lab receives blood from a suspected loaiasis patient. To catch the microfilariae at their peak, when should the sample be drawn?", "opts": ["Timing does not matter", "During daytime", "At midnight", "After a fatty meal"], "key": 1, "exp": "Trigger words: \"Identification of microfilariae in blood samples taken during daytime\" - diurnal periodicity. (W. bancrofti is the nocturnal one.)", "src": "PDF 346 (printed 338)", "n": 3}, {"img": null, "kind": "mechanism/rationale", "stem": "A transient, painless, non-pitting hard swelling the size of a hen's egg appears on a patient's wrist and vanishes days later. What is the mechanism of this Calabar swelling?", "opts": ["Allergic host reaction to worm antigens when the worm stays in one spot for a short time", "Secondary bacterial infection of the worm track", "Microfilariae dying inside the skin and releasing collagenase", "Adult worm mechanically blocking a lymphatic vessel"], "key": 0, "exp": "Trigger words: \"These transient subcutaneous swellings result from allergic host reaction to the worm antigens when they remain in one spot for a short time.\"", "src": "PDF 346 (printed 338)", "n": 4}, {"img": null, "kind": "key differentiator", "stem": "Where are Calabar swellings mostly observed, and how do they feel?", "opts": ["Over bony prominences; fixed and tender", "On hands, wrists, forearms and ankles; painless, non-pitting, hard", "On the trunk; pitting and tender", "On the face and scalp; soft and fluctuant"], "key": 1, "exp": "Trigger words: \"mostly observed on hands, wrists, forearms and ankles as painless, non pitting hard swellings reaching hen's egg size\". Onchocerca nodules sit over bony prominences but are non-tender granulomas.", "src": "PDF 346 (printed 338)", "n": 5}, {"img": null, "kind": "mechanism/rationale", "stem": "An adult Loa loa is seen crossing under the conjunctiva from one eye to the other. The eye complaint this produces is:", "opts": ["Chorioretinitis", "Permanent corneal opacification", "Sclerosing keratitis", "Transient conjunctivitis"], "key": 3, "exp": "Trigger words: \"This may cause transient conjunctivitis.\" Sclerosing keratitis and chorioretinitis belong to Onchocerca.", "src": "PDF 346 (printed 338)", "n": 6}, {"img": null, "kind": "key differentiator", "stem": "The adult Loa loa cuticle differs from W. bancrofti by being:", "opts": ["Covered with irregular tubercles except at the head and tail", "Covered with transverse striations", "Segmented", "Smooth throughout"], "key": 0, "exp": "Trigger words: \"the cuticle is covered with irregular tubercles except at the head and tail.\"", "src": "PDF 345 (printed 337)", "n": 7}, {"img": null, "kind": "association match", "stem": "Match the Loa loa adult measurements: male / female.", "opts": ["Male 4 cm with two spicules; female 9 cm", "Male 3.5 cm x 0.35 mm with unequal spicules; female 4 cm x 0.5 mm with vulva 2.5 mm from the anterior end", "Male about 3 cm, dies after fertilization; female 100 cm", "Male 3 cm; female 50 cm"], "key": 1, "exp": "Trigger words: \"Male: 3.5 cm x 0.35 mm with unequal spicules. Female: 4 cm x 0.5 mm with vulva situated at 2.5mm from anterior end.\" (50 cm = Onchocerca female; 100 cm = Dracunculus female.)", "src": "PDF 345 (printed 337)", "n": 8}, {"img": null, "kind": "vignette: stage/host", "stem": "For Loa loa, the stage infective to man and the stage used for diagnosis are:", "opts": ["Filariform larva inside Cyclops; comma-shaped rhabditiform larva", "Microfilaria; adult worm in nodules", "3rd stage larva; microfilaria in skin snip", "Infective 3rd stage filariform larva; microfilaria in blood"], "key": 3, "exp": "Trigger words: \"Infective stage: Infective 3rd stage filariform larva. Diagnostic stage: Microfilaria in blood.\" (Skin snip = Onchocerca; Cyclops larva = Dracunculus.)", "src": "PDF 345 (printed 337)", "n": 9}, {"img": null, "kind": "EXCEPT / false fact", "stem": "All of the following are true of loaiasis EXCEPT:", "opts": ["Pruritus is common while the adult creeps under the skin", "It always runs a mild course and never threatens life", "Fatigue and arthralgia may be present", "Serious CNS, renal and cardiac complications may occur"], "key": 1, "exp": "Trigger words: \"Manifestations vary from asymptomatic or mild to life-threatening.\"", "src": "PDF 346 (printed 338)", "n": 10}, {"img": null, "kind": "treatment/protocol", "stem": "Drug treatment of loaiasis follows W. bancrofti (DEC and ivermectin), but the source adds which precaution?", "opts": ["Give it on an empty stomach", "Give DEC as a weekly 300 mg dose for life", "Avoid ivermectin entirely", "Add steroids and antihistamines to avoid allergic reactions"], "key": 3, "exp": "Trigger words: \"DEC and Ivermectin as in W. bancrofti with steroids and antihistamines to avoid allergic reactions.\"", "src": "PDF 347 (printed 339)", "n": 11}, {"img": null, "kind": "treatment/protocol", "stem": "A traveler is going to a Loa loa endemic area. The prophylaxis given in the source is:", "opts": ["Single dose ivermectin 150 ug/kg", "Albendazole monthly", "Daily doxycycline", "Weekly dose of 300 mg DEC"], "key": 3, "exp": "Trigger words: \"Prophylaxis of travelers to endemic areas by weekly dose of 300 mg DEC.\"", "src": "PDF 347 (printed 339)", "n": 12}, {"img": null, "kind": "diagnosis", "stem": "Which test does the source call a SURE diagnostic test for microfilaraemia in loaiasis?", "opts": ["Mazzotti test", "PCR assay", "Eosinophil count", "Immunodiagnosis"], "key": 1, "exp": "Trigger words: \"PCR assay is a sure diagnostic test for microfilaraemia.\" Eosinophilia is only suggestive; immunodiagnosis cross-reacts.", "src": "PDF 346 (printed 338)", "n": 13}, {"img": null, "kind": "mechanism/rationale", "stem": "Why is immunodiagnosis of limited value in loaiasis?", "opts": ["It detects only eggs", "The antigen disappears during the day", "Microfilariae never reach blood", "Cross reaction with other filarial species"], "key": 3, "exp": "Trigger words: \"Immunodiagnosis is of limited value due to cross reaction with other filarial species.\"", "src": "PDF 346 (printed 338)", "n": 14}, {"img": null, "kind": "treatment/protocol", "stem": "Besides chemotherapy, which mechanical treatment does the source list for Loa loa?", "opts": ["Surgical removal of adults from under the conjunctiva", "Corneo-scleral punch", "Excision of subcutaneous nodules", "Rolling the worm on a stick"], "key": 0, "exp": "Trigger words: \"Surgical removal of adults from under the conjunctiva.\" (Stick-rolling = Dracunculus; nodule excision = Onchocerca.)", "src": "PDF 347 (printed 339)", "n": 15}, {"img": null, "kind": "distribution", "stem": "The geographical distribution of Loa loa is:", "opts": ["Central and West Africa", "Central America", "East and south Asia", "Yemen and Sudan only"], "key": 0, "exp": "Trigger words: \"Geographical distribution: Central and West Africa.\"", "src": "PDF 345 (printed 337)", "n": 16}, {"img": null, "kind": "vector/transmission", "stem": "Inside Chrysops, the ingested microfilariae of Loa loa:", "opts": ["Migrate to the thoracic muscles then the hemocoel", "Encyst in the flight muscles and wait", "Develop into infective larvae and migrate to the mouth parts, exactly as in W. bancrofti", "Multiply by binary fission in the gut"], "key": 2, "exp": "Trigger words: \"they develop into infective larvae and migrate to mouth parts exactly as what happens in case of W. bancrofti.\"", "src": "PDF 346 (printed 338)", "n": 17}, {"img": null, "kind": "prevention", "stem": "Prevention and control of loaiasis includes all EXCEPT:", "opts": ["Insecticides at the breeding places", "Repellents to reduce bites", "Mass treatment of patients", "Boiling drinking water"], "key": 3, "exp": "Trigger words: \"Vector control by use of insecticides at the breeding places and repellents ... Mass treatment of patients ... Prophylaxis of travelers.\" Boiling water belongs to Dracunculus control.", "src": "PDF 347 (printed 339)", "n": 18}, {"img": null, "kind": "vignette: stage/host", "stem": "A man from a village beside a fast-flowing river in Sudan is losing vision, and a bloodless skin snip shows microfilariae. The fly that infected him breeds only:", "opts": ["In sewage water", "In step-wells", "On the edges of rapidly flowing rivers and water streams", "In stagnant ponds"], "key": 2, "exp": "Trigger words: \"Black flies that transmit disease can breed only on the edges of rapidly flowing rivers & water streams.\"", "src": "PDF 347 (printed 339)", "n": 19}, {"img": "fig-fly", "kind": "image question", "stem": "The fly shown is the vector of which parasite?", "opts": ["Wuchereria bancrofti", "Dracunculus medinensis", "Onchocerca volvulus", "Loa loa"], "key": 2, "exp": "Trigger words: the figure sits under \"Onchocerca volvulus ... Intermediate host (Vector): Blood sucking fly, Simulium (Black fly).\"", "src": "PDF 348 (printed 340)", "n": 20}, {"img": null, "kind": "vignette: stage/host", "stem": "For Onchocerca volvulus, the infective stage and diagnostic stage are:", "opts": ["3rd stage filariform larva; microfilaria in skin (non-periodic)", "Microfilaria in skin; adult in nodules", "Filariform larva inside Cyclops; rhabditiform larva", "3rd stage filariform larva; microfilaria in night blood"], "key": 0, "exp": "Trigger words: \"Infective stage: 3rd stage filariform larva ... Diagnostic stage: Microfilaria in Skin (non-periodic).\"", "src": "PDF 348 (printed 340)", "n": 21}, {"img": null, "kind": "key differentiator", "stem": "Which microfilaria is unsheathed, has a rounded anterior and tapering posterior end, a tail free of nuclei, and does NOT appear in blood?", "opts": ["Onchocerca volvulus", "Loa loa", "Wuchereria bancrofti", "Brugia malayi"], "key": 0, "exp": "Trigger words: \"250x8 um, Unsheathed, Rounded anter. tapering post, Tail free of nuclei, Does not appear in blood.\"", "src": "PDF 348 (printed 340)", "n": 22}, {"img": null, "kind": "association match", "stem": "Match adult sizes: female / male of Onchocerca volvulus.", "opts": ["100 cm / 3 cm", "50 cm / 3 cm", "4 cm / 3.5 cm", "9 cm / 4 cm"], "key": 1, "exp": "Trigger words: \"Female : 50 Cm. Male : 3 Cm.\"", "src": "PDF 348 (printed 340)", "n": 23}, {"img": null, "kind": "mechanism/rationale", "stem": "Why is transmission of onchocerciasis usually restricted to communities near rivers?", "opts": ["Cyclops lives in river water", "The vector black fly can breed only on the edges of rapidly flowing rivers and streams", "People bathe in rivers", "The microfilariae need water to mature"], "key": 1, "exp": "Trigger words: \"Black flies that transmit disease can breed only on the edges of rapidly flowing rivers & water streams; so, disease transmission usually occurs at these regions.\"", "src": "PDF 347 (printed 339)", "n": 24}, {"img": null, "kind": "life cycle", "stem": "In the life cycle of Onchocerca volvulus, after the infective larvae enter the bite wound they:", "opts": ["Remain larvae for 14 years", "Moult twice and become adult in 12 months", "Moult once and become adult in 1 month", "Become adults within 2 weeks"], "key": 1, "exp": "Trigger words: \"Larvae moult twice, become adult in 12 months.\"", "src": "PDF 348 (printed 340)", "n": 25}, {"img": null, "kind": "life cycle", "stem": "Adult Onchocerca worms are found coiled and encapsulated by fibrous tissue in subcutaneous nodules. The female can keep producing microfilariae for up to:", "opts": ["12 months", "40 years", "14 years", "5 years"], "key": 2, "exp": "Trigger words: \"Female worms live for long times - up to 14 years.\"", "src": "PDF 349 (printed 341)", "n": 26}, {"img": "fig-oncho", "kind": "image question", "stem": "In this Onchocerca volvulus life-cycle figure, the symbol marking the stage that infects man corresponds to:", "opts": ["Adults coiled in the subcutaneous nodule", "Unsheathed microfilariae in the skin", "L1 larvae inside the blackfly thoracic muscles", "L3 larvae entering the bite wound while the blackfly feeds"], "key": 3, "exp": "Trigger words: the figure marks \"Infective Stage\" at L3 larvae entering the bite wound; text: \"Infective stage : 3rd stage filariform larva.\"", "src": "PDF 349 (printed 341)", "n": 27}, {"img": null, "kind": "vector/transmission", "stem": "Inside the black fly, Onchocerca microfilariae reach the next human by migrating:", "opts": ["From midgut to thoracic muscles, develop to 3rd stage larvae, then through the hemocoel to the proboscis", "Directly from gut to salivary glands without development", "From gut to ovaries for transovarial transmission", "From midgut to mouthparts in 24 hours without moulting"], "key": 0, "exp": "Trigger words: \"migrate from midgut to the thoracic muscles ... develops into first-stage larvae then into third stage infective filariform larvae ... migrate through the hemocoel to the fly's proboscis.\"", "src": "PDF 349 (printed 341)", "n": 28}, {"img": null, "kind": "mechanism/rationale", "stem": "The tissue damage of onchocerciasis is mainly an immune response against:", "opts": ["Living adult worms", "The bite of Simulium", "Dead microfilaria in skin and eye", "Eggs deposited in lymphatics"], "key": 2, "exp": "Trigger words: \"Immune response to dead microfilaria in skin & eye. Immediate hypersensitivity; cytotoxicity; immune complex deposition & autoantibody formation.\"", "src": "PDF 350 (printed 342)", "n": 29}, {"img": null, "kind": "mechanism/rationale", "stem": "The parasite factor that destroys elastic fibers of skin and eye in onchocerciasis is:", "opts": ["Hyaluronidase from adults", "Collagenase released by dead microfilaria", "Toxic vasodilators from the female", "Bacterial superinfection"], "key": 1, "exp": "Trigger words: \"Dead microfilaria release collagenase that leads to destruction of elastic fibers of skin & eye.\"", "src": "PDF 350 (printed 342)", "n": 30}, {"img": null, "kind": "key differentiator", "stem": "Match each chronic Onchocerca skin change to its description: lizard skin / leopard skin / elephant skin.", "opts": ["Lizard: thickening from severe pruritus and 2ry infection; leopard: depigmented patches with scattered normally pigmented spots; elephant: wrinkled skin with hair loss from epidermal atrophy and elastic fiber destruction", "Lizard: depigmented patches; leopard: thickening; elephant: hyperpigmentation of one limb", "Lizard: ulcers; leopard: scales; elephant: papules", "Lizard: wrinkling; leopard: vesicles; elephant: nodules"], "key": 0, "exp": "Trigger words: \"a- Lizard skin: sever pruritus & 2ry infection leading to thickening of skin. b- Leopard skin: depigmented patches ... c- Elephant skin: atrophy of epidermis & destruction of elastic fibers lead to wrinkled skin with hair loss.\"", "src": "PDF 350 (printed 342)", "n": 31}, {"img": null, "kind": "vignette: diagnosis", "stem": "A young adult in Yemen presents with a severe allergic dermatosis confined to ONE lower limb: hyperpigmented, hyperkeratotic skin with enlarged painful regional lymph nodes. This is:", "opts": ["Calabar swelling", "Lizard skin", "Leopard skin", "Sowda (black disease)"], "key": 3, "exp": "Trigger words: \"d- Sowda (black disease): Sever allergic response affecting one lower limb. Common in Yemen & Sudan. Common in young adults. hyperpigmented hyperkeratotic skin & enlarged painful regional LN.\"", "src": "PDF 351 (printed 343)", "n": 32}, {"img": null, "kind": "key differentiator", "stem": "An onchocercoma (skin nodule) is best described as:", "opts": ["A tender, red, fluctuant abscess", "A diffuse non-pitting swelling of the forearm", "An ulcer with an emerging worm", "A subcutaneous granuloma around adult worms: round or oval, firm, mobile, NOT tender, 5-50 mm, often against bony prominences (forehead, iliac crest, elbow)"], "key": 3, "exp": "Trigger words: \"Nodules are SC granulomas around adult worms. Common sites: against bony prominences (forehead, iliac crest, elbow). Shape round or oval, firm, mobile and not tender. 5-50 mm.\"", "src": "PDF 351 (printed 343)", "n": 33}, {"img": null, "kind": "vignette: eye lesion", "stem": "Early in onchocerciasis, slit-lamp shows spots of inflammatory exudate around dead microfilariae in the cornea. This lesion is reversible and called:", "opts": ["Punctate keratitis", "Chorioretinitis", "Sclerosing keratitis", "Iridocyclitis"], "key": 0, "exp": "Trigger words: \"Punctuate keratitis: spots of inflammatory exudates around dead microfilaria (early in disease - reversible).\"", "src": "PDF 351 (printed 343)", "n": 34}, {"img": null, "kind": "mechanism/rationale", "stem": "Blindness in onchocerciasis follows which corneal sequence?", "opts": ["Punctate keratitis heals without trace", "Acute iridocyclitis scars the lens capsule", "Sclerosing keratitis: fibrovascular streaks grow from the periphery of the cornea to the center, become confluent and opacify the cornea", "Retinal detachment from vitreous hemorrhage"], "key": 2, "exp": "Trigger words: \"Sclerosing keratitis: streaks of fibrovascular tissue start from periphery of cornea to the center then become confluent leading to opacification of cornea and blindness.\"", "src": "PDF 351 (printed 343)", "n": 35}, {"img": null, "kind": "EXCEPT / false fact", "stem": "Eye lesions in onchocerciasis are attributed to all of the following EXCEPT:", "opts": ["Migration of microfilaria from nodules on the face and scalp", "Allergic reaction to toxins secreted by living or dead worms", "Iridocyclitis, chorioretinitis and retinal atrophy", "Direct invasion of the optic nerve by adult worms"], "key": 3, "exp": "Trigger words: \"Eye lesions are due to: Allergic reaction to toxins secreted by living or dead worms. Migration of microfilaria from nodules on the face and scalp.\"", "src": "PDF 351 (printed 343)", "n": 36}, {"img": null, "kind": "diagnosis", "stem": "The classic sampling method for Onchocerca microfilariae is:", "opts": ["Stool concentration", "Bloodless skin snip", "Urine sediment", "Night blood film"], "key": 1, "exp": "Trigger words: \"Identification of microfilaria in bloodless skin snip.\" (It does not appear in blood.)", "src": "PDF 352 (printed 344)", "n": 37}, {"img": null, "kind": "diagnosis", "stem": "Adult Onchocerca worms in nodules can be detected by all EXCEPT:", "opts": ["Ultrasonography", "Plain X-ray", "Examination of nodules after surgical removal", "Aspiration of nodules"], "key": 1, "exp": "Trigger words: \"Detection of adult worms in the nodules: Examination of nodules after surgical removal. Aspiration of nodules. Ultrasonography.\" Plain X-ray is for calcified Dracunculus.", "src": "PDF 352 (printed 344)", "n": 38}, {"img": null, "kind": "diagnosis", "stem": "The Mazzotti test uses which drug and produces which result in positive onchocerciasis?", "opts": ["300 mg D
