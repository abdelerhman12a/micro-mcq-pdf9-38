he serogroups into serotypes\".", "src": "Theory book PDF 71 (printed 64)", "cue": "H antigen", "ask": "The H antigen of Salmonella divides serogroups into", "distinguish": "Vi is capsular in some Typhi strains."}, {"n": 11, "stem": "The Vi antigen is", "opts": ["Flagellar", "Capsular polysaccharide in some S. Typhi strains", "Somatic", "Pilus"], "key": 1, "exp": "Trigger: \"Vi (capsular polysaccharide) antigen present in some strains of S. Typhi\".", "src": "Theory book PDF 71 (printed 64)", "cue": "Vi antigen", "ask": "The Vi antigen is", "distinguish": "Anti-Vi titer high in carriers."}, {"n": 12, "stem": "Typhoidal Salmonella include", "opts": ["S. Dublin only", "S. Choleraesuis", "S. Typhi and S. Paratyphi A, B, C", "S. Enteritidis and S. Typhimurium"], "key": 2, "exp": "Trigger: \"Typhoidal: S. Typhi, S. Paratyphi A, B and C\".", "src": "Theory book PDF 71 (printed 64)", "cue": "typhoidal", "ask": "Typhoidal Salmonella include", "distinguish": "Non-typhoidal: Enteritidis, Typhimurium, Choleraesuis."}, {"n": 13, "stem": "Which non-typhoidal Salmonella causes septicemia with metastatic infections?", "opts": ["S. Typhimurium", "S. Paratyphi A", "S. Choleraesuis", "S. Enteritidis"], "key": 2, "exp": "Trigger: \"S. Choleraesuis that causes septicaemia with metastatic infections\".", "src": "Theory book PDF 71 (printed 64)", "cue": "Choleraesuis", "ask": "Which non-typhoidal Salmonella causes septicemia with metastatic infections?", "distinguish": "Enteritidis and Typhimurium cause enterocolitis."}, {"n": 14, "stem": "Enteric fever is", "opts": ["A localized colon infection", "A generalized infection of the reticuloendothelial system with bacteraemia and sustained fever", "A zoonosis of rodents", "A toxin-mediated diarrhea"], "key": 1, "exp": "Trigger: \"generalized infection of the RES and intestinal lymphoid tissue accompanied by bacteraemia and sustained fever\".", "src": "Theory book PDF 71 (printed 64)", "cue": "enteric fever", "ask": "Enteric fever is", "disti llosis."}, {"n": 24, "stem": "Complications of typhoid include", "opts": ["Hemolytic uremic syndrome", "Guillain-Barre", "Intestinal hemorrhage and perforation", "Toxic megacolon"], "key": 2, "exp": "Trigger: \"Complications: intestinal hemorrhage and perforation\".", "src": "Theory book PDF 73 (printed 66)", "cue": "complications", "ask": "Complications of typhoid include", "distinguish": "HUS belongs to EHEC."}, {"n": 25, "stem": "Best specimen in the first week of typhoid is", "opts": ["Blood culture (bone marrow is always positive)", "Urine culture", "Stool culture", "Widal only"], "key": 0, "exp": "Trigger: \"First week: blood culture; bone marrow cultures always positive; clot culture\".", "src": "Theory book PDF 73 (printed 66)", "cue": "week 1 specimen", "ask": "Best specimen in the first week of typhoid is", "distinguish": "Stool from week 2."}, {"n": 26, "stem": "Blood culture bottle for typhoid contains", "opts": ["50-100 ml bile salt broth with 5-10 ml blood", "1 ml blood only", "Selenite broth", "Peptone water"], "key": 0, "exp": "Trigger: \"5-10 ml blood added to 50-100 ml blood culture bottle with bile salt broth at 37 C\".", "src": "Theory book PDF 73 (printed 66)", "cue": "bile broth", "ask": "Blood culture bottle for typhoid contains", "distinguish": "Bile aids growth."}, {"n": 27, "stem": "Which culture is ALWAYS positive in the first week of typhoid?", "opts": ["Stool culture", "Bone marrow culture", "Urine culture", "Blood culture"], "key": 1, "exp": "Trigger: \"Bone marrow cultures: always positive\".", "src": "Theory book PDF 73 (printed 66)", "cue": "bone marrow", "ask": "Which culture is ALWAYS positive in the first week of typhoid?", "distinguish": "Clot culture: serum separated for serology."}, {"n": 28, "stem": "Stool culture for Salmonella is first inoculated in", "opts": ["TCBS", "Directly on blood agar", "Skirrow", "Selenite or tetrathionate broth overnight"], "key": 3, "exp": "Trigger: \"stool sample is inoculated first in selenite broth or tetrathionate broth overnight. Then subcultured on MacConkey or DCA\".", "src": "Theory book PDF 73 (printed 66)", "cue": "stool culture", "ask": "Stool culture for Salmonella is first inoculated in", "distinguish": "Excretion is intermittent; repeat."}, {"n": 29, "stem": "Serologic diagnosis of enteric fever is by", "opts": ["Paul-Bunnell", "Widal test", "Weil-Felix", "VDRL"], "key": 1, "exp": "Trigger: \"Serologic diagnosis: Widal test and ELISA, immunoblot\".", "src": "Theory book PDF 73 (printed 66)", "cue": "serology", "ask": "Serologic diagnosis of enteric fever is by", "distinguish": "Widal is a tube agglutination test."}, {"n": 30, "stem": "The Widal test end titer is", "opts": ["The dilution with no reaction", "The mean of all tubes", "The lowest dilution", "The highest serum dilution giving agglutination"], "key": 3, "exp": "Trigger: \"The highest dilution of the serum which gives agglutination is the end titer\".", "src": "Theory book PDF 74 (printed 67)", "cue": "end titer", "ask": "The Widal test end titer is", "distinguish": "Dilutions 1/20, 1/40, 1/80, 1/160."}, {"n": 31, "stem": "For proper Widal interpretation one needs", "opts": ["A single titer of 1/20", "A 4-fold rise in a second serum a week later", "Only H titer", "A negative O titer"], "key": 1, "exp": "Trigger: \"a 4-fold rise of titer in second serum samples collected one week after the first\".", "src": "Theory book PDF 74 (printed 67)", "cue": "rising titer", "ask": "For proper Widal interpretation one needs", "distinguish": "Paired sera."}, {"n": 32, "stem": "In Egypt (endemic), a single Widal titer indicating recent infection is", "opts": [">= 1/20", "Any H titer", "<= 1/80", "O and H >= 1/160"], "key": 3, "exp": "Trigger: \"in endemic areas e.g. Egypt, high titer of O and H >= 1/160 is indicative of recent infection. Titers <= 1/80 not significant\".", "src": "Theory book PDF 74 (printed 67)", "cue": "1/160", "ask": "In Egypt (endemic), a single Widal titer indicating recent infe const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
