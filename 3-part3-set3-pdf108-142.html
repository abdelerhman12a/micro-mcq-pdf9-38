": 3, "exp": "Answer: Pseudomembrane formation. Book trigger: \"which may progress to salpingitis and pelvic inflammatory disease (pid)\".", "src": "PDF 123 (printed 116)"}, {"n": 10, "img": null, "kind": "double-clue", "stem": "Which soil organism is weakly acid-fast, affects immunocompromised patients and is often misdiagnosed as tuberculosis?", "opts": ["Actinomyces israelii", "Nocardia asteroides", "Mycobacterium leprae", "Mycobacterium tuberculosis"], "key": 1, "exp": "Answer: Nocardia asteroides. Book trigger: \"frequently misdiagnosed as tuberculosis as it is weak acid fast\".", "src": "PDF 140 (printed 133)"}, {"n": 11, "img": null, "kind": "association", "stem": "Which granule colours occur in actinomycotic mycetoma?", "opts": ["Yellow, white and red, never black", "Black and white, never red", "Black only, never white", "Green and blue, never yellow"], "key": 0, "exp": "Answer: Yellow, white and red, never black. Book trigger: \"mainly yellow, white, red - never black\".", "src": "PDF 141 (printed 134)"}, {"n": 12, "img": null, "kind": "clinical case", "stem": "A neonate has conjunctivitis from Chlamydia trachomatis serotype D-K acquired at birth. Which drug is recommended?", "opts": ["Ceftriaxone", "Tetracycline", "Erythromycin", "Penicillin G"], "key": 2, "exp": "Answer: Erythromycin. Book trigger: \"Erythromycin is recommended for neonates and pregnant women\".", "src": "PDF 124 (printed 117)"}, {"n": 13, "img": null, "kind": "association", "stem": "What is the cause of relapses in relapsing fever?", "opts": ["Reinfection by a new louse bite", "Toxin release by the organism", "Spore formation by Borrelia", "Antigenic variation of Borrelia"], "key": 3, "exp": "Answer: Antigenic variation of Borrelia. Book trigger: \"relapses occur due to antigenic variations in borrelia\".", "src": "PDF 133 (printed 126)"}, {"n": 14, "img": null, "kind": "association", "stem": "When is Leptospira found in urine?", "opts": ["From the second week onward", "Never during the ys false positive", "Negative"], "key": 1, "exp": "Answer: Positive. Book trigger: \"≥ 10 mm: is considered positive in healthcare workers\".", "src": "PDF 114 (printed 107)"}, {"n": 20, "img": null, "kind": "double-clue", "stem": "Which spirochete has a hooked end, causes infectious jaundice, and spreads by animal urine in water?", "opts": ["Leptospira icterohaemorrhagiae", "Borrelia burgdorferi", "Treponema pallidum", "Borrelia recurrentis"], "key": 0, "exp": "Answer: Leptospira icterohaemorrhagiae. Book trigger: \"Contact with animal urine in water\".", "src": "PDF 137 (printed 130)"}, {"n": 21, "img": null, "kind": "definition", "stem": "Reticulate bodies of Chlamydia are:", "opts": ["Small, extracellular, metabolically inert, the infectious form", "Larger, extracellular, metabolically inert, the dormant form", "Spore-like, resistant to heat, found in dried bird faeces", "Larger, intracellular, metabolically active, the replicating form"], "key": 3, "exp": "Answer: Larger, intracellular, metabolically active, the replicating form. Book trigger: \"larger, intracellular, metabolically active particles\".", "src": "PDF 122 (printed 115)"}, {"n": 22, "img": null, "kind": "except", "stem": "Members of the M. tuberculosis complex include all of the following EXCEPT:", "opts": ["M. microti", "M. leprae", "M. bovis", "M. africanum"], "key": 1, "exp": "Answer: M. leprae. Book trigger: \"m. bovis, m. africanum and m. microti\".", "src": "PDF 109 (printed 102)"}, {"n": 23, "img": null, "kind": "association", "stem": "Which cytokine is measured in QuantiFERON TB?", "opts": ["IL-4", "IL-2", "IFN-gamma", "TNF-alpha"], "key": 2, "exp": "Answer: IFN-gamma. Book trigger: \"measurement of the amount of ifn- γ released\".", "src": "PDF 115 (printed 108)"}, {"n": 24, "img": null, "kind": "association", "stem": "What is the treatment of actinomycosis?", "opts": ["Surgical drainage and penicillin G for 6-12 months", "Trimethoprim-sulfamethoxazole for 6 months", "Antifungal therapy for 6 months", "Doxycycline for 3 days"], "key": 0, "exp": "Answer: Surgical drainage and penicillin G for 6-12 months. Book trigger: \"penicillin g (6-12 months)\".", "src": "PDF 139 (printed 132)"}, {"n": 25, "img": null, "kind": "sequence", "stem": "Which order describes rickettsial pathology?", "opts": ["Thrombosis, multiplication, rash, necrosis", "DIC, rash, vasculitis, multiplication", "Intracellular multiplication, endothelial necrosis, vasculitis and thrombosis, rash and DIC", "Rash, necrosis, multiplication, DIC"], "key": 2, "exp": "Answer: Intracellular multiplication, endothelial necrosis, vasculitis and thrombosis, rash and DIC. Book trigger: \"intracellular multiplication → endothelial cell necrosis\".", "src": "PDF 126 (printed 119)"}, {"n": 26, "img": null, "kind": "association", "stem": "How does AFB appear with auramine-rhodamine staining?", "opts": ["Pink bacilli on a blue background", "Orange-yellow fluorescence on a black background", "Blue bacilli on a pink background", "Dark brown bacilli on a yellow background"], "key": 1, "exp": "Answer: Orange-yellow fluorescence on a black background. Book trigger: \"afb fluoresces orange yellow in a black background\".", "src": "PDF 109 (printed 102)"}, {"n": 27, "img": null, "kind": "association", "stem": "Which antibiotic is recommended for neonates and pregnant women with chlamydia?", "opts": ["Erythromycin", "Ceftriaxone", "Penicillin G", "Tetracycline"], "key": 0, "exp": "Answer: Erythromycin. Book trigger: \"erythromycin is recommended for neonates and pregnant women\".", "src": "PDF 124 (printed 117)"}, {"n": 28, "img": null, "kind": "association", "stem": "Which species causes Weil's disease?", "opts": ["Leptospira interrogans only", "Treponema pallidum", "Borrelia recurrentis", "Leptospira icterohaemorrhagiae"], "key": 3, "exp": "Answer: Leptospira icterohaemorrhagiae. Book trigger: \"causative organism: leptospira icterohaemorrhagiae\".", "src": "PDF 137 (printed 130)"}, {"n": 29, "img": null, "ki condary, primary", "Secondary, primary, latent, tertiary", "Primary, secondary, latent, tertiary"], "key": 3, "exp": "Answer: Primary, secondary, latent, tertiary. Book trigger: \"the disease passes through three stages\".", "src": "PDF 129 (printed 122)"}, {"n": 35, "img": null, "kind": "clinical case", "stem": "A diabetic has slowly progressive foot swelling with few sinuses and black grains. Which treatment?", "opts": ["Trimethoprim-sulfamethoxazole alone", "Surgical debridement and antifungal therapy", "Tetracycline alone", "Penicillin alone for 6-12 months"], "key": 1, "exp": "Answer: Surgical debridement and antifungal therapy. Book trigger: \"antifungal therapy \"fluconazole\" for eumycotic mycetoma\".", "src": "PDF 142 (printed 135)"}, {"n": 36, "img": null, "kind": "clinical case", "stem": "A child in a hot, dry area has chronic keratoconjunctivitis with scarring. Which diagnosis?", "opts": ["Inclusion conjunctivitis", "Pink eye", "Trachoma", "Chancroid"], "key": 2, "exp": "Answer: Trachoma. Book trigger: \"trachoma manifests as chronic keratoconjunctivitis with scarring which may lead to blindness\".", "src": "PDF 123 (printed 116)"}, {"n": 37, "img": null, "kind": "clinical case", "stem": "A newborn from a syphilitic mother has saddle nose. Which transmission is this?", "opts": ["Direct contact", "Blood transfusion", "Sexual", "Transplacental"], "key": 3, "exp": "Answer: Transplacental. Book trigger: \"transplacental infection from a syphilitic mother\".", "src": "PDF 129 (printed 122)"}, {"n": 38, "img": null, "kind": "clinical case", "stem": "A person has a positive TST, negative sputum smears and no symptoms. Which diagnosis?", "opts": ["Pulmonary TB disease", "Latent TB infection", "NTM disease", "Leprosy"], "key": 1, "exp": "Answer: Latent TB infection. Book trigger: \"not a case of tb\".", "src": "PDF 111 (printed 104)"}, {"n": 39, "img": null, "kind": "except", "stem": "Regarding Chlamydia, all of the following are true EXCEPT:", "opts": ["They are stained by Giemsa stain but not by Gram stain", "They have a biphasic life cycle with two forms", "They are sensitive to beta-lactams because of typical peptidoglycan", "They are obligate intracellular bacteria that grow in tissue culture"], "key": 2, "exp": "Answer: They are sensitive to beta-lactams because of typical peptidoglycan. Book trigger: \"Chlamydiae are not sensitive to ß-lactam antibiotics\".", "src": "PDF 124 (printed 117)"}, {"n": 40, "img": null, "kind": "association", "stem": "Which fungus is a cause of eumycotic mycetoma?", "opts": ["Madurella", "Nocardia brasiliensis", "Actinomadura", "Streptomyces"], "key": 0, "exp": "Answer: Madurella. Book trigger: \"fungi: madurella\".", "src": "PDF 141 (printed 134)"}, {"n": 41, "img": null, "kind": "clinical case", "stem": "A man has a painless hard genital ulcer 3 weeks after exposure. Which direct test is best?", "opts": ["Gram stain of exudate from the chancre base", "Dark-field microscopy of exudate from the chancre", "Culture of exudate on Lowenstein-Jensen medium", "Culture of exudate from the chancre on blood agar"], "key": 1, "exp": "Answer: Dark-field microscopy of exudate from the chancre. Book trigger: \"Direct detection of organism in lesion\".", "src": "PDF 129 (printed 122)"}, {"n": 42, "img": null, "kind": "association", "stem": "How do mycoplasma colonies look?", "opts": ["Molar tooth-like colonies visible to the naked eye", "Black colonies on tellurite agar after two days", "Fried-egg appearance, visible only microscopically", "Yellow colonies on TCBS agar after one day"], "key": 2, "exp": "Answer: Fried-egg appearance, visible only microscopically. Book trigger: \"fried-egg\".", "src": "PDF 120 (printed 113)"}, {"n": 43, "img": null, "kind": "double-clue", "stem": "Which organism is arthropod-borne, endothelial-cell invading and treated with tetracycline?", "opts": ["Rickettsia", "Coxiella", "Chlamydia", "Mycoplasma"], "key": 0, "exp": "Answer: Rickettsia. Book trigger: \"proliferates within vascular endothelial cells of small blood vessels\".", "src": "PDF 126 (printed 119)"}, {"n": 44, "img": null, "kind": "association", "stem": "What does chronic Q fever present as?", "opts": ["Hepatitis", "Meningitis", "Pneumonia", "Subacute infective endocarditis"], "key": 3, "exp": "Answer: Subacute infective endocarditis. Book trigger: \"chronic q fever: presented by subacute infective endocarditis\".", "src": "PDF 127 (printed 120)"}, {"n": 45, "img": null, "kind": "sequence", "stem": "Which order describes TB pathogenesis?", "opts": ["Engulfment, granuloma, inhalation, CMI", "Granuloma, CMI, inhalation, engulfment", "Inhalation of droplet nuclei, engulfment by alveolar macrophages, CMI at 4-6 weeks, granuloma", "CMI, granuloma, engulfment, inhalation"], "key": 2, "exp": "Answer: Inhalation of droplet nuclei, engulfment by alveolar macrophages, CMI at 4-6 weeks, granuloma. Book trigger: \"cell-mediated immune response, which is the main immune mechanism against mycobacteria, is initiated\".", "src": "PDF 110 (printed 103)"}, {"n": 46, "img": null, "kind": "clinical case", "stem": "A patient vaccinated with BCG 2 years ago has a positive tuberculin test. Which test is specific for latent TB and not affected by BCG?", "opts": ["QuantiFERON TB", "Frei skin test", "Repeat tuberculin test", "Lepromin test"], "key": 0, "exp": "Answer: QuantiFERON TB. Book trigger: \"The result is not affected by prior BCG vaccination\".", "src": "PDF 115 (printed 108)"}, {"n": 47, "img": null, "kind": "association", "stem": "What share of infected people develop latent TB infection?", "opts": ["50%", "About 90%", "10%", "30%"], "key": 1, "exp": "Answer: About 90%. Book trigger: \"this occurs in about 90% of the infected people\".", "src": "PDF 111 (printed 104)"}, {"n": 48, "img": null, "kind": "association", "stem": "Which chlamydial serotypes cause trachoma?", "opts": ["D to K", "L1 to L3", "None of them", "A, B and C"], "key": 3, "exp": "Answer: A, B and C. Book trigger: \"it is "fried-egg\".", "src": "PDF 120 (printed 113)"}, {"n": 54, "img": null, "kind": "association", "stem": "What is the minimum duration of the combination TB therapy?", "opts": ["3 days", "At least 6 months", "1 month", "2 weeks"], "key": 1, "exp": "Answer: At least 6 months. Book trigger: \"for at least 6 months\".", "src": "PDF 115 (printed 108)"}, {"n": 55, "img": null, "kind": "clinical case", "stem": "A TB patient develops resistance during first-line therapy. Which group of drugs is used?", "opts": ["BCG vaccine given again intradermally", "Dapsone and clofazimine as for leprosy", "First-line drugs only, at a higher dose", "Second-line drugs such as fluoroquinolones"], "key": 3, "exp": "Answer: Second-line drugs such as fluoroquinolones. Book trigger: \"these drugs are only used if resistance occurs during administration of first-line drugs\".", "src": "PDF 116 (printed 109)"}, {"n": 56, "img": null, "kind": "definition", "stem": "XDR-TB means MDR plus resistance to:", "opts": ["Streptomycin only, with no other drug", "Pyrazinamide and cycloserine together", "A fluoroquinolone and at least one additional drug", "Ethambutol only, with no other drug"], "key": 2, "exp": "Answer: A fluoroquinolone and at least one additional drug. Book trigger: \"mdr plus resistance to fluoroquinolone and at least one additional drug\".", "src": "PDF 116 (printed 109)"}, {"n": 57, "img": null, "kind": "except", "stem": "All of the following characters apply to the genus Mycobacterium EXCEPT:", "opts": ["They are obligate aerobes", "Their cell wall is rich in lipids", "They are fast-growing facultative anaerobes", "They are stained by Ziehl-Neelsen or fluorochrome methods"], "key": 2, "exp": "Answer: They are fast-growing facultative anaerobes. Book trigger: \"Obligate aerobes\".", "src": "PDF 108 (printed 101)"}, {"n": 58, "img": null, "kind": "clinical case", "stem": "A BCG-vaccinated healthcare worker needs latent TB testing. Which test is more specific?", "opts": ["Tuberculin skin Legionella pneumophila", "Mycoplasma pneumoniae", "Chlamydophila psittaci", "Coxiella burnetii"], "key": 1, "exp": "Answer: Mycoplasma pneumoniae. Book trigger: \"a titer of 1:128 of cold agglutinins is indicative of recent infection\".", "src": "PDF 121 (printed 114)"}, {"n": 123, "img": null, "kind": "sequence", "stem": "What is the order of the stages of untreated syphilis?", "opts": ["Primary, latent, secondary, tertiary", "Latent, primary, secondary, tertiary", "Primary, secondary, latent, tertiary", "Secondary, primary, latent, tertiary"], "key": 2, "exp": "Answer: Primary, secondary, latent, tertiary. Book trigger: \"The disease passes through three stages\".", "src": "PDF 129 (printed 122)"}, {"n": 124, "img": null, "kind": "association", "stem": "On which medium does Nocardia grow in 1-2 weeks?", "opts": ["Skirrow", "TCBS", "Charcoal blood agar", "L-J medium"], "key": 3, "exp": "Answer: L-J medium. Book trigger: \"nocardia grow rapidly on l-j\".", "src": "PDF 140 (printed 133)"}, {"n": 125, "img": null, "kind": "association", "stem": "What is the colony appearance of Actinomyces?", "opts": ["Molar tooth-like", "Ground-glass appearance", "Medusa-head appearance", "Fried-egg appearance"], "key": 0, "exp": "Answer: Molar tooth-like. Book trigger: \"molar tooth-like\".", "src": "PDF 139 (printed 132)"}, {"n": 126, "img": null, "kind": "association", "stem": "What is the most common site of TB reactivation?", "opts": ["The base of the lung", "The kidney", "The liver", "The apex of the lung"], "key": 3, "exp": "Answer: The apex of the lung. Book trigger: \"the most common site of reactivation is the apex of the lung\".", "src": "PDF 111 (printed 104)"}, {"n": 127, "img": null, "kind": "association", "stem": "What is the treatment of Lyme disease?", "opts": ["Streptomycin alone for 14 days by injection", "Erythromycin alone for 5 days by mouth", "Doxycycline, amoxicillin or cefuroxime for 14-21 days", "Penicillin G alone for 6 months by injection"], "key": 2, "exp": "Answer: Doxycycline, amoxicillin or cefuroxime for 14-21 days. Book trigger: \"doxycycline, amoxicillin, or cefuroxime for 14-21 days\".", "src": "PDF 135 (printed 128)"}, {"n": 128, "img": null, "kind": "definition", "stem": "NTM are:", "opts": ["Fungus-like bacteria that form branching filaments", "Mycobacteria that are not members of the M. tuberculosis complex", "Bacteria that lack a cell wall and contain sterols", "Mycobacteria that cause only leprosy in humans"], "key": 1, "exp": "Answer: Mycobacteria that are not members of the M. tuberculosis complex. Book trigger: \"mycobacteria other than tuberculosis\".", "src": "PDF 116 (printed 109)"}, {"n": 129, "img": null, "kind": "association", "stem": "Which tests are used for Lyme serology screening and confirmation?", "opts": ["Widal for screening and ELISA for confirmation", "STAT for screening and PCR for confirmation", "ELISA for screening and Western blot for confirmation", "VDRL for screening and FTA for confirmation"], "key": 2, "exp": "Answer: ELISA for screening and Western blot for confirmation. Book trigger: \"detection of antibodies in serum or csf by elisa\".", "src": "PDF 135 (printed 128)"}, {"n": 130, "img": null, "kind": "clinical case", "stem": "A hotel's cooling tank is suspected in an outbreak. Which prevention is recommended?", "opts": ["Vaccination of the staff with a killed vaccine", "Decontamination by high temperature and hyperchlorination", "Delousing campaigns and insect repellents", "Pasteurization of the water at 60°C for 15 minutes"], "key": 1, "exp": "Answer: Decontamination by high temperature and hyperchlorination. Book trigger: \"routine decontamination of water tanks by high temperature and hyperchlorination\".", "src": "PDF 108 (printed 101)"}, {"n": 131, "img": null, "kind": "association", "stem": "How are eumycotic mycetomas cultured?", "opts": ["On TCBS agar incubated overnight at 37°C", "On blood agar incubated anaerobically at 37°C", "On L-J medium incubated for 2-8 weeks", "On Sabouraud's dextrose agar at room temperature"], "key": 3, "exp": "Answer: On Sabouraud's dextrose agar at room temperature. Book trigger: \"on sabourauds dextrose agar at room temperature\".", "src": "PDF 141 (printed 134)"}, {"n": 132, "img": null, "kind": "association", "stem": "Which stain visualizes Chlamydia?", "opts": ["Giemsa", "Fontana", "Ziehl-Neelsen", "Gram"], "key": 0, "exp": "Answer: Giemsa. Book trigger: \"the organism can readily be stained by giemsa stain\".", "src": "PDF 122 (printed 115)"}, {"n": 133, "img": null, "kind": "except", "stem": "Features of acute Q fever include all of the following EXCEPT:", "opts": ["Hepatitis", "Atypical pneumonia", "Skin rash", "Influenza-like symptoms"], "key": 2, "exp": "Answer: Skin rash. Book trigger: \"atypical pneumonia with hepatitis and no rash\".", "src": "PDF 127 (printed 120)"}, {"n": 134, "img": null, "kind": "clinical case", "stem": "A woman with a positive VDRL has no symptoms. How should it be handled?", "opts": ["Confirm with a specific treponemal test", "Repeat the tuberculin test", "Treat as leprosy", "Ignore it, as it is always false"], "key": 0, "exp": "Answer: Confirm with a specific treponemal test. Book trigger: \"therefore, positive non-specific tests should be confirmed by specific treponemal tests\".", "src": "PDF 132 (printed 125)"}, {"n": 135, "img": null, "kind": "association", "stem": "For how long may the tuberculin test stay positive after BCG?", "opts": ["6 months only", "1 week", "For life always", "Up to 5 years"], "key": 3, "exp": "Answer: Up to 5 years. Book trigger: \"remains positive for up to 5 years\".", "src": "PDF 114 (printed 107)"}, {"n": 136, "img": null, "kind": "sequence", "stem": "Which order describes TB sputum processing?", "opts": ["Smear, centrifugation, NALC, NaOH", "Liquefaction with NALC, decontamination with NaOH, centrifugation, smear and culture", "Centrifugation, NaOH, NALC, culture", "NaOH, culture, NALC, smear"], "key": 1, "exp": "Answer: Liquefaction with NALC, decontamination with NaOH, centrifugation, smear and culture. Book trigger: \"liquefaction of sputum with n-acetyle-l-cysteine (nalc)\".", "src": "PDF 112 (printed 105)"}, {"n": 137, "img": null, "kind": "association", "stem": "What target cells do rickettsiae proliferate in?", "opts": ["Hepatocytes of the liver parenchyma", "Vascular endothelial cells of small vessels", "Erythrocytes circulating in the blood", "Neurons of the central nervous system"], "key": 1, "exp": "Answer: Vascular endothelial cells of small vessels. Book trigger: \"proliferates within vascular endothelial cells of small blood vessels\".", "src": "PDF 126 (printed 119)"}, {"n": 138, "img": null, "kind": "association", "stem": "Which T-cell response predominates in lepromatous leprosy?", "opts": ["CD8 only", "Th1", "Th17", "Th2"], "key": 3, "exp": "Answer: Th2. Book trigger: \"t cell weak th1 strong th2\".", "src": "PDF 119 (printed 112)"}, {"n": 139, "img": null, "kind": "except", "stem": "Regarding leptospirosis, all of the following are true EXCEPT:", "opts": ["It is transmitted by tick bite", "Organisms are excreted in urine from the second week", "It is a zoonosis", "It may cause jaundice"], "key": 0, "exp": "Answer: It is transmitted by tick bite. Book trigger: \"contact with animal urine in water\".", "src": "PDF 137 (printed 130)"}, {"n": 140, "img": null, "kind": "association", "stem": "Which fluid culture system uses radiolabelled palmitate?", "opts": ["L-J medium", "MGIT", "BACTEC AFB system", "Skirrow's medium"], "key": 2, "exp": "Answer: BACTEC AFB system. Book trigger: \"bactec medium contains radio-labelled palmitate as the sole carbon source\".", "src": "PDF 113 (printed 106)"}, {"n": 141, "img": null, "kind": "association", "stem": "What percentage of untreated syphilis progresses to tertiary?", "opts": ["90%", "30%", "3%", "60%"], "key": 1, "exp": "Answer: 30%. Book trigger: \"tertiary (30% of untreated, years later)\".", "src": "PDF 130 (printed 123)"}, {"n": 142, "img": null, "kind": "except", "stem": "Second-line anti-TB drugs include all of the following EXCEPT:", "opts": ["Amikacin", "Cycloserine", "Capreomycin", "Pyrazinamide"], "key": 3, "exp": "Answer: Pyrazinamide. Book trigger: \"second-line drugs: fluoroquinolones, para-aminosalicylic acid, ethionamide, cycloserine\".", "src": "PDF 116 (printed 109)"}, {"n": 143, "img": null, "kind": "except", "stem": "Latent TB infection is characterized by all of the following EXCEPT:", "opts": ["No symptoms", "Not infectious", "Positive sputum smears and cultures", "Positive tuberculin or QuantiFERON test"], "key": 2, "exp": "Answer: Positive sputum smears and cultures. Book trigger: \"Sputum smears and cultures\".", "src": "PDF 111 (printed 104)"}, {"n": 144, "img": null, "kind": "sequence", "stem": "Which order describes Chlamydia life cycle?", "opts": ["Infectious elementary body enters cell, becomes reticulate body which replicates, then reorganizes to elementary bodies", "Reticulate body infects and remains inert", "Reticulate body enters cell, becomes elementary body, then replicates outside", "Elementary body replicates outside the cell and is infectious"], "key": 0, "exp": "Answer: Infectious elementary body enters cell, becomes reticulate body which replicates, then reorganizes to elementary bodies. Book trigger: \"they represent the infectious form\".", "src": "PDF 122 (printed 115)"}, {"n": 145, "img": null, "kind": "double-clue", "stem": "Which organism has slow corkscrew motility, is silver stained and not cultured on artificial media?", "opts": ["Treponema pallidum", "Mycoplasma", "Leptospira", "Borrelia"], "key": 0, "exp": "Answer: Treponema pallidum. Book trigger: \"t. pallidum are not cultured on artificial media or in tissue culture\".", "src": "PDF 128 (printed 121)"}, {"n": 146, "img": null, "kind": "double-clue", "stem": "Which spirochete causes syphilis, cannot be cultured on artificial media, and grows in rabbit testicles?", "opts": ["Leptospira icterohaemorrhagiae", "Borrelia burgdorferi", "Actinomyces israelii", "Treponema pallidum"], "key": 3, "exp": "Answer: Treponema pallidum. Book trigger: \"In vivo: It can be cultivated in rabbit testicles\".", "src": "PDF 129 (printed 122)"}, {"n": 147, "img": null, "kind": "definition", "stem": "IgM antibodies that agglutinate red cells at 4°C but not at 37°C are called:", "opts": ["Anti-Vi antibodies", "Cold agglutinins", "Blocking antibodies", "Reagin"], "key": 1, "exp": "Answer: Cold agglutinins. Book trigger: \"cold agglutinins, which are IgM antibodies\".", "src": "PDF 121 (printed 114)"}, {"n": 148, "img": null, "kind": "clinical case", "stem": "A woman with a neglected IUD has abdominal abscess draining sulphur granules. Which organism?", "opts": ["Madurella mycetomatis", "Treponema pallidum", "Actinomyces israelii", "Nocardia asteroides"], "key": 2, "exp": "Answer: Actinomyces israelii. Book trigger: \"neglected intrauterine device\".", "src": "PDF 138 (printed 131)"}, {"n": 149, "img": null, "kind": "clinical case", "stem": "A lab technician sees AFB in bundles within infected cells in a slit-skin smear. Which stain was used?", "opts": ["Gram", "Fontana", "Giemsa only", "Modified Ziehl-Neelsen"], "key": 3, "exp": "Answer: Modified Ziehl-Neelsen. Book trigger: \"smears stained with modified z-n method show intracellular afb in bunches\".", "src": "PDF 119 (printed 112)"}, {"n": 150, "img": null, "kind": "definition", "stem": "Lump jaw is the name of:", "opts": ["Cervicofacial actinomycosis", "Mycetoma", "Thoracic actinomycosis", "Vincent's angina"], "key": 0, "exp": "Answer: Cervicofacial actinomycosis. Book trigger: \"cervicofacial (lump jaw)\".", "src": "PDF 138 (printed 131)"}, {"n": 151, "img": null, "kind": "double-clue", "stem": "Which organism is obligate aerobic, slow growing, acid-fast and grown on L-J medium?", "opts": ["Legionella", "Mycobacterium leprae", "Mycobacterium tuberculosis", "Nocardia"], "key": 2, "exp": "Answer: Mycobacterium tuberculosis. Book trigger: \"slow rate of growth\".", "src": "PDF 108 (printed 101)"}, {"n": 152, "img": null, "kind": "association", "stem": "In how many days do fluid systems detect mycobacterial growth?", "opts": ["1 to 2 days", "4 to 14 days", "6 to 7 weeks", "2 to 8 weeks"], "key": 1, "exp": "Answer: 4 to 14 days. Book trigger: \"allow detection of growth in 4 to 14 days\".", "src": "PDF 113 (printed 106)"}, {"n": 153, "img": null, "kind": "clinical case", "stem": "A sewage worker has fever, jaundice, renal failure and meningitis. Which organism?", "opts": ["Brucella", "Rickettsia", "Borrelia", "Leptospira"], "key": 3, "exp": "Answer: Leptospira. Book trigger: \"contact with animal urine in water\".", "src": "PDF 137 (printed 130)"}, {"n": 154, "img": null, "kind": "association", "stem": "What is the classic triad of rickettsial disease?", "opts": ["Arthritis, conjunctivitis and urethritis together", "High persistent fever, severe headache and skin rash", "Fever, jaundice and renal failure with meningitis", "Cough, whoops and vomiting after each paroxysm"], "key": 1, "exp": "Answer: High persistent fever, severe headache and skin rash. Book trigger: \"high persistent fever, severe headache, and characteristic skin rash\".", "src": "PDF 126 (printed 119)"}, {"n": 155, "img": null, "kind": "association", "stem": "Which rapid same-day test detects M. tuberculosis DNA and mutations associated with rifampicin resistance?", "opts": ["QuantiFERON TB", "MGIT fluorescence tube", "GeneXpert MTB/RIF", "BACTEC radiolabelled palmitate"], "key": 2, "exp": "Answer: GeneXpert MTB/RIF. Book trigger: \"GeneXpert MTB/RIF\".", "src": "PDF 112 (printed 105)"}, {"n": 156, "img": null, "kind": "definition", "stem": "MDR-TB is defined as resistance to:", "opts": ["Isoniazid and rifampin", "Pyrazinamide and ethambutol", "Isoniazid and ethambutol", "Rifampin and streptomycin"], "key": 0, "exp": "Answer: Isoniazid and rifampin. Book trigger: \"resistance of m. tuberculosis to both isoniazid and rifampin\".", "src": "PDF 116 (printed 109)"}, {"n": 157, "img": null, "kind": "clinical case", "stem": "A farmer is bitten by a tick and develops an annular rash with central clearing. Which organism?", "opts": ["Leptospira", "Rickettsia", "Borrelia recurrentis", "Borrelia burgdorferi"], "key": 3, "exp": "Answer: Borrelia burgdorferi. Book trigger: \"annular skin lesion at site of bite with an erythematous leading edge\".", "src": "PDF 135 (printed 128)"}, {"n": 158, "img": null, "kind": "clinical case", "stem": "A healthy person at a hotel has flu-like illness without pneumonia after water exposure. Which?", "opts": ["Q fever", "Pontiac fever", "Psittacosis", "Legionnaire's disease"], "key": 1, "exp": "Answer: Pontiac fever. Book trigger: \"healthy individuals develop flu-like illness (pontiac fever)\".", "src": "PDF 108 (printed 101)"}, {"n": 159, "img": null, "kind": "clinical case", "stem": "An immunocompromised patient in a hospital has pneumonia from water aerosols. Which organism?", "opts": ["Legionella pneumophila", "Chlamydophila psittaci", "Coxiella burnetii", "Mycoplasma pneumoniae"], "key": 0, "exp": "Answer: Legionella pneumophila. Book trigger: \"immunosuppressed patients develop pneumonia (legionnaire's disease)\".", "src": "PDF 108 (printed 101)"}, {"n": 160, "img": null, "kind": "association", "stem": "Which organism is cultured in nine-banded armadillos or mouse footpads?", "opts": ["Treponema pallidum", "Chlamydia trachomatis", "Mycobacterium leprae", "Mycobacterium tuberculosis"], "key": 2, "exp": "Answer: Mycobacterium leprae. Book trigger: \"inoculation of the nine-banded armadillo\".", "src": "PDF 117 (printed 110)"}, {"n": 161, "img": null, "kind": "association", "stem": "Which actinomycete causes actinomycosis?", "opts": ["Streptomyces somaliensis", "Actinomyces israelii", "Actinomadura madurae", "Nocardia asteroides"], "key": 1, "exp": "Answer: Actinomyces israelii. Book trigger: \"actinomyces israelii\".", "src": "PDF 138 (printed 131)"}, {"n": 162, "img": null, "kind": "association", "stem": "How does MGIT detect growth?", "opts": ["Colour change of a urea indicator on ammonia release", "Release of 14C-labelled CO2 detected by a counter", "Haemolysis of red cells on a blood agar plate", "Oxygen depletion detected by a fluorescence sensor"], "key": 3, "exp": "Answer: Oxygen depletion detected by a fluorescence sensor. Book trigger: \"bacterial growth will result in oxygen depletion\".", "src": "PDF 113 (printed 106)"}, {"n": 163, "img": null, "kind": "association", "stem": "What is the vector for epidemic relapsing fever?", "opts": ["Ticks", "Fleas", "Lice", "Mites"], "key": 2, "exp": "Answer: Lice. Book trigger: \"vector lice ticks\".", "src": "PDF 134 (printed 127)"}, {"n": 164, "img": null, "kind": "definition", "stem": "Mycobacteria that firmly retain the dye and resist decolourization even by acidic solutions are termed:", "opts": ["Acid-fast", "Gram-variable", "Alcohol-sensitive", "Metachromatic"], "key": 0, "exp": "Answer: Acid-fast. Book trigger: \"they are termed \"acid-fast\"\".", "src": "PDF 108 (printed 101)"}, {"n": 165, "img": null, "kind": "clinical case", "stem": "A healthcare worker has no symptoms and a tuberculin induration of 11 mm. How is the test read?", "opts": ["Negative, since 15 mm is required in everyone", "Negative, since only the erythema was measured", "Positive only if the sputum smear is also positive", "Positive, since 10 mm or more is positive in healthcare workers"], "key": 3, "exp": "Answer: Positive, since 10 mm or more is positive in healthcare workers. Book trigger: \"≥ 10 mm: is considered positive in healthcare workers\".", "src": "PDF 114 (printed 107)"}, {"n": 166, "img": null, "kind": "association", "stem": "When is the tuberculin test read?", "opts": ["After 48-72 h", "After 4-6 weeks", "After 6 h", "After 7 days"], "key": 0, "exp": "Answer: After 48-72 h. Book trigger: \"the result is read after 48-72 h by palpating for the presence of induration\".", "src": "PDF 113 (printed 106)"}, {"n": 167, "img": null, "kind": "association", "stem": "How is relapsing fever diagnosed in the afebrile stage?", "opts": ["Examination of a Giemsa-stained blood film", "Culture of the patient's urine on blood agar", "Injection of the patient's blood into white mice", "Skin biopsy of the rash with silver stain"], "key": 2, "exp": "Answer: Injection of the patient's blood into white mice. Book trigger: \"injecting white mice intraperitoneally with the patient's blood\".", "src": "PDF 134 (printed 127)"}, {"n": 168, "img": null, "kind": "association", "stem": "How is Legionella prevented?", "opts": ["Vaccination of poultry and cattle with a live vaccine", "Decontamination of water tanks by high temperature and hyperchlorination", "Delousing campaigns and insect repellents", "Pasteurization of milk and its products"], "key": 1, "exp": "Answer: Decontamination of water tanks by high temperature and hyperchlorination. Book trigger: \"routine decontamination of water tanks by high temperature and hyperchlorination\".", "src": "PDF 108 (printed 101)"}, {"n": 169, "img": null, "kind": "association", "stem": "Which false negative reaction of TST occurs due to weakened immunity?", "opts": ["Cross-reaction with NTM", "BCG vaccination", "Anergy", "Prozone"], "key": 2, "exp": "Answer: Anergy. Book trigger: \"anergy: the inability to react due to weakened immune system\".", "src": "PDF 114 (printed 107)"}, {"n": 170, "img": null, "kind": "association", "stem": "Which drugs treat tuberculoid leprosy?", "opts": ["Penicillin and streptomycin", "Isoniazid only", "Dapsone, rifampicin and clofazimine", "Dapsone plus rifampicin"], "key": 3, "exp": "Answer: Dapsone plus rifampicin. Book trigger: \"2 drugs (dapsone + rifampicin)\".", "src": "PDF 119 (printed 112)"}, {"n": 171, "img": null, "kind": "association", "stem": "Which drugs are of choice for all mycoplasmas?", "opts": ["Streptomycin and gentamycin", "Erythromycin and tetracycline", "Rifampin and isoniazid", "Penicillin and ampicillin"], "key": 1, "exp": "Answer: Erythromycin and tetracycline. Book trigger: \"erythromycin and tetracycline are the drugs of choice for all mycoplasmas\".", "src": "PDF 121 (printed 114)"}, {"n": 172, "img": null, "kind": "clinical case", "stem": "A patient with tuberculous meningitis is being treated. Which minimum drug combination principle applies?", "opts": ["Four or more drugs for at least 6 months", "BCG vaccination repeated every 6 months", "Two drugs given daily for 1 month", "One drug given daily for 2 weeks"], "key": 0, "exp": "Answer: Four or more drugs for at least 6 months. Book trigger: \"combination of 4 drugs or more is essential\".", "src": "PDF 115 (printed 108)"}, {"n": 173, "img": null, "kind": "association", "stem": "Why are the skin and superficial nerves affected in leprosy?", "opts": ["The bacilli grow only at 42°C in the deep organs", "The bacilli grow best at low temperature (about 30°C)", "The bacilli need high CO2 tension in tissues", "The bacilli need blood-rich tissues to survive"], "key": 1, "exp": "Answer: The bacilli grow best at low temperature (about 30°C). Book trigger: \"leprosy bacilli grow best at low temperature (optimally 30\".", "src": "PDF 118 (printed 111)"}, {"n": 174, "img": null, "kind": "clinical case", "stem": "A soldier has painful ulcerated gums with pseudomembrane. Which organisms?", "opts": ["Borrelia vincenti with fusiform bacilli", "Corynebacterium diphtheriae with spores", "Leptospira with Borrelia burgdorferi", "Treponema pallidum with Leptospira"], "key": 0, "exp": "Answer: Borrelia vincenti with fusiform bacilli. Book trigger: \"inflamed gum margins and ulcer with pseudomembrane\".", "src": "PDF 136 (printed 129)"}, {"n": 175, "img": null, "kind": "except", "stem": "Features of secondary syphilis include all of the following EXCEPT:", "opts": ["Maculopapular rash including palms and soles", "Condylomata lata", "Mucous patches in the mouth", "Gummas in skin and bone"], "key": 3, ", "kind": "association", "stem": "This animal is used for in vivo cultivation of which organism?", "opts": ["Mycobacterium tuberculosis", "Mycobacterium leprae", "Mycobacterium bovis", "Nocardia asteroides"], "key": 1, "exp": "Answer: Mycobacterium leprae. Book trigger: \"M. leprae has not yet been successfully cultured in vitro. In vivo: injection ... into the footpads of mice or inoculation of the nine-banded armadillo\".", "src": "PDF 117 (printed 110), Fig 1.77a"}, {"n": 251, "img": "120-103", "kind": "association", "stem": "Which organism produces colonies like these on serum-enriched medium?", "opts": ["Nocardia", "Legionella", "Mycoplasma", "Chlamydia"], "key": 2, "exp": "Answer: Mycoplasma. Book trigger: \"mycoplasmas produce minute colonies which have a characteristic fried-egg appearance\"; they lack a cell wall and contain sterol in the membrane.", "src": "PDF 120 (printed 113), Fig 1.79"}, {"n": 252, "img": "122-104", "kind": "association", "stem": "In the chlamydial life cycle diagram, which form is the infectious extracellular particle and which is the replicating intracellular form?", "opts": ["EB replicating; RB metabolically inert", "RB infectious; EB replicating", "Both are infectious and extracellular", "EB infectious; RB replicating"], "key": 3, "exp": "Answer: EB infectious, RB replicating. Book trigger: \"Elementary bodies (EBs): small, extracellular, metabolically inert ... infectious form. Reticulate bodies (RBs): larger, intracellular, metabolically active ... replicating form\".", "src": "PDF 122 (printed 115), Fig 1.80"}, {"n": 253, "img": "128-107", "kind": "association", "stem": "In this diagram, which genus has many narrow regular coils?", "opts": ["Leptospira", "Treponema", "Borrelia", "Mycoplasma"], "key": 1, "exp": "Answer: Treponema. Book trigger: \"Thin spiral bacteria with many narrow regular coils and pointed ends ... not stained with Gram stain\"; Borrelia have wide few coils.", "src": "PDF 128 (printed 121), Fig 6.83"}, {"n": , Fig 1.86"}, {"n": 258, "img": "134-117", "kind": "association", "stem": "Which Borrelia is transmitted by the vector shown?", "opts": ["Borrelia duttoni (tick)", "Borrelia vincenti (louse)", "Borrelia burgdorferi (tick)", "Borrelia recurrentis (louse)"], "key": 3, "exp": "Answer: Borrelia recurrentis. Book Table 1.19: epidemic relapsing fever, B. recurrentis, vector lice, crushing the louse into bite wounds. Endemic fever (B. duttoni) and Lyme disease are tick-borne.", "src": "PDF 134 (printed 127), Table 1.19"}, {"n": 259, "img": "135-121", "kind": "clinical case", "stem": "This skin lesion appeared at the site of a tick bite. Which organism?", "opts": ["Borrelia recurrentis", "Treponema pallidum", "Leptospira interrogans", "Borrelia burgdorferi"], "key": 3, "exp": "Answer: Borrelia burgdorferi (Lyme disease). Book trigger: \"erythema chronicum migrans (ECM) is annular skin lesion at site of bite with an erythematous leading edge and central clearing\".", "src": "PDF 135 (printed 128), Fig 1.87"}, {"n": 260, "img": "136-122", "kind": "double-clue", "stem": "A Gram film from a gingival ulcer with pseudomembrane shows many long fusiform bacilli together with spirochaetes with wide irregular coils. Which pair?", "opts": ["Fusobacterium with Borrelia vincenti", "Leptospira with Mycoplasma", "Treponema pallidum alone", "Actinomyces with Nocardia"], "key": 0, "exp": "Answer: Fusobacterium fusiform with Borrelia vincenti (trench mouth, Vincent's angina). Penicillin is the drug of choice.", "src": "PDF 136 (printed 129), Fig 1.88"}, {"n": 261, "img": "139-123", "kind": "association", "stem": "A crushed sulphur granule shows Gram-positive branching bacilli. Which treatment does the book give?", "opts": ["A single dose of ceftriaxone", "Surgical drainage plus penicillin G for 6-12 months", "Doxycycline for 14-21 days", "Trimethoprim-sulfamethoxazole only"], "key": 1, "exp": "Answer: surgical drainage plus penicillin G (6-12 months); clindamycin or erythromycin if penicillin-allergic. Book trigger: \"pus containing sulphur granules ... Gram positive branching bacteria\" (actinomycosis).", "src": "PDF 139 (printed 132), Fig 1.90a"}, {"n": 262, "img": "139-124", "kind": "association", "stem": "What is the name of this colony appearance on anaerobic culture of sulphur-granule pus?", "opts": ["Mercury-droplet colonies", "Bipolar-staining colonies", "Fried-egg colonies", "Molar tooth-like colonies"], "key": 3, "exp": "Answer: molar tooth-like colonies (Actinomyces). Fried-egg is Mycoplasma; mercury-droplet is Bordetella pertussis.", "src": "PDF 139 (printed 132), Fig 1.90b"}, {"n": 263, "img": "140-129", "kind": "clinical case", "stem": "An immunosuppressed patient inhales soil-borne bacteria and gets a TB-like lung disease. The organism is weakly acid-fast. Which drug does the book give?", "opts": ["Doxycycline for 14-21 days", "Trimethoprim and sulfamethoxazole", "Fluconazole", "Penicillin G for 6-12 months"], "key": 1, "exp": "Answer: trimethoprim-sulfamethoxazole (Nocardia). Book trigger: \"Inhalation of air-born bacteria from soil ... frequently misdiagnosed as tuberculosis as it is weak acid fast\".", "src": "PDF 140 (printed 133), Fig 1.91"}, {"n": 264, "img": "142-130", "kind": "clinical case", "stem": "This is Madura foot (mycetoma). Crushed granules show fungal mycelium (eumycotic). Which treatment does the book give?", "opts": ["Surgical debridement plus antifungal therapy (fluconazole)", "Trimethoprim-sulfamethoxazole only", "Penicillin or sulpha", "Surgical drainage plus penicillin G for 6-12 months"], "key": 0, "exp": "Answer: surgical debridement plus antifungal therapy such as fluconazole. Penicillin or sulpha is for actinomycotic mycetoma.", "src": "PDF 142 (printed 135), Fig 1.91"}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='abcd';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>Infection and Immunity, PDF 108-142</h2>
<p>${Q.length} MCQs from the coursebook, PDF pages 108-142. Mixed topics in random order. Each question tags its type (EXCEPT, definition, association, sequence, double-clue, clinical case). Includes 21 figure questions with the book images. Answers follow the coursebook.</p>
<p><b>Exam mode (default):</b> answer all questions, answers and explanations come only at the end with your score, a review and "Retry missed only".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<button class="btn" onclick="start(shuffle(Q).slice(0,50),'exam')">Exam: 50 random</button>
<p><b>Practice mode (optional):</b> instant feedback after each answer.</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>
</div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#practice')start(Q,'practice');else start(Q,'exam');
</script></body></html>
