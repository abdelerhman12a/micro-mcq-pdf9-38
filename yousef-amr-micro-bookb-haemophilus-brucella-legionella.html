y X factor.", "Requirement for only V factor.", "Requirement for both X and V factors.", "Growth in the absence of both X and V factors."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1030, "stem": "How does the polysaccharide capsule of H. influenzae contribute to its virulence?", "opts": ["It assists in bacterial motility.", "It prevents phagocytosis by host immune cells.", "It enhances the bacterium's ability to adhere to surfaces.", "It increases the bacterium's resistance to antibiotics."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1031, "stem": "What is the primary method of transmission for H. influenzae?", "opts": ["Fecal-oral route.", "Respiratory droplets.", "Blood transfusion.", "Direct skin contact."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1032, "stem": "Why is the incidence of H. Influenzae infections particularly high in children between 6 months and 6 years?", "opts": ["Due to increased exposure in school settings.", "Because maternal antibodies decline and the child's immune system is still developing.", "Due to genetic predisposition in this age group.", "Because of dietary deficiencies in this age group. 119 Bordetella"], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1033, "stem": "Diagnosis of whooping cough cannot be done by:", "opts": ["Direct gram stain.", "Nucleic acid detection.", "Direct fluorescent antibody test.", "Culture on Bordet-Gengou medium.", "Culture on charcoal blood agar."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1034, "stem": "DTaP is a vaccine developed from a combination of:", "opts": ["Diphtheria toxoid, tetanus toxoid and killed pertussis cells.", "Tetanus toxoid, killed diphtheria bacilli and pertussis toxoid.", "Diphtheria toxoid, killed C/. Tetani and pert Brucellae cannot grow on ordinary media."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1054, "stem": "The following methods can be used for the diagnosis of brucellosis, EXCEPT:", "opts": ["Blood culture.", "Standard tube agglutination test (STAT) for total antibody (IgG + IgM).", "Widal test.", "Brucellin test.", "ELISA for IgG or IgM."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1055, "stem": "Regarding the standard tube agglutination test (STAT) for diagnosis of brucellosis, all the following statements are true, EXCEPT:", "opts": ["A prozone effect is commonly encountered.", "A wide range of serum dilutions should be done.", "It detects antibodies to Brucella abortus only.", "Blocking antibodies may give false negative results.", "A titer of 160 or more is diagnostic for brucellosis."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1056, "stem": "Fever of unknown origin in a farmer who raises goats would most likely be caused by:", "opts": ["S. Aureus.", "Clostridium difficile.", "Brucella melitensis.", "Mycobacterium tuberculosis."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1057, "stem": "Which species of Brucella infects cattle?", "opts": ["B. suis.", "B. melitensis.", "B. abortus.", "B. bronchiseptica. 122"], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1058, "stem": "The major virulence factor of Brucella is:", "opts": ["Exotoxin.", "Endotoxin.", "Capsule.", "Pili."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1059, "stem": "Which of the following complications is NOT associated with brucellosis?", "opts": ["Osteomyelitis.", "Endocarditis.", "Pneumonia.", "Meningitis."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1060, "stem": "What is the preferred treatment for brucellosis?", "opts": ["Amoxicillin and clavulanic acid.", "Doxycycline and rifampin.", "Ciprofloxacin and metronidazole.", "Penicillin and streptomycin."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1061, "stem": "What is a characteristic symptom of brucellosis?", "opts": ["Continuous high fever.", "Intermittent undulant fever.", "Sudden high fever.", "Rash."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1062, "stem": "What is the reason behind false-negative results in the STAT for brucellosis?", "opts": ["Low antigen concentration.", "Prozone effect and blocking antibodies.", "Contaminated samples.", "Incorrect specimen collection."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1063, "stem": "In brucellosis, the organism is most commonly found in:", "opts": ["Bloodstream only.", "Respiratory tract.", "Reticulo-endothelial system.", "Nervous system."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1064, "stem": "Why is isolation of Brucella from blood cultures rarely done?", "opts": ["Low yield and high cost.", "High risk to personnel and long incubation time.", "Requires fresh samples.", "No need for blood culture."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1065, "stem": "How is brucellosis primarily prevented in humans?", "opts": ["Vaccination of humans.", "Pasteurization of milk and control of animal infections.", "Isolation of infected individuals.", "Use of insect repellents."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1066, "stem": "The Coombs test is recommended in cases of negative STAT results because:", "opts": ["It is cheaper.", "It is more accurate.", "It detects incomplete antibodies.", "It is less invasive."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1067, "stem": "The granuloma formation in brucellosis is primarily due to which type of immune response?", "opts": ["Humoral immunity.", "Cell-mediated immunity (CMI).", "Complement activation.", "Autoimmune response. 123"], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1068, "stem": "What is the most common clinical manifestation of acute brucellosis?", "opts": ["Persistent cough.", "Intermittent fever.", "Skin rash.", "Nausea and vomiting."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1069, "stem": "Brucellosis is often referred to as \"undulant fever\" due to its:", "opts": ["Continuous high fever.", "Rapid onset of fever.", "Wave-like fever pattern.", "Fever accompanied by a rash."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1070, "stem": "Which species of Brucella is known to infect pigs?", "opts": ["B. melitensis.", "B. abortus.", "B. suis.", "B. canis."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1071, "stem": "The \"prozone effect\" in serologic testing for brucellosis can lead to:", "opts": ["False positive results.", "False negative results.", "Increased antibody titer.", "Reduced antigenicity."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1072, "stem": "Which type of cells does Brucella primarily infect to evade the immune response?", "opts": ["Epithelial cells.", "Macrophages.", "T cells.", "B cells."], "key": 1, "exp": "كتاب النظري: Brucella: facultative intracellular parasite, survives and multiplies within phagocytic cells", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 99 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 99}, {"n": 1073, "stem": "What is the consequence of delayed diagnosis of brucellosis?", "opts": ["Spontaneous recovery.", "Development of severe complications such as endocarditis.", "Rapid resolution of symptoms.", "Reduction in transmission risk."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1074, "stem": "Which diagnostic test is most frequently used to confirm brucellosis?", "opts": ["Skin prick test.", "Tuberculin test.", "STAT.", "MRI."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1075, "stem": "Legionnaire's disease is a form of:", "opts": ["Food poisoning.", "Atypical bacterial pneumonia.", "Neonatal infection.", "Sexually transmitted disease.", "Meningitis."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1076, "stem": "Rapid diagnosis of Legionnaire's disease can be provided by antigen detection in:", "opts": ["Blood.", "Serum.", "Stools.", "Urine.", "CSF. 124"], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1077, "stem": "Which of the following diseases is associated with L. pneumophila?", "opts": ["Pontiac fever.", "Typhoid fever.", "Dengue fever.", "Scarlet fever."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1078, "stem": "Where is L. pneumophila commonly found?", "opts": ["Soil.", "Human skin.", "Water sources.", "Air."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1079, "stem": "Which method of transmission is associated with Legionella?", "opts": ["Direct contact with contaminated water.", "Inhalation of contaminated water aerosols.", "Ingestion of contaminated food.", "Person-to-person transmission."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1080, "stem": "Which of the following statements about L. pneumophila is, CORRECT?", "opts": ["It is a non-motile bacterium.", "It is a facultative intracellular pathogen.", "It is an obligate anaerobe.", "It does not require special culture media."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1081, "stem": "How is L. pneumophila most likely to spread in a hospital setting?", "opts": ["Through patient-to-patient contact.", "Via contaminated medical instruments.", "Through air-conditioning systems.", "By contaminated food."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1082, "stem": "Which disease is more likely to develop in immunosuppressed patients infected with L. pneumophila?", "opts": ["Pontiac fever.", "Legionnaire’s disease.", "Acute gastroenteritis.", "Toxic shock syndrome."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1083, "stem": "Which clinical presentation is associated with L. pneumophila in healthy individuals?", "opts": ["Meningitis.", "Flu-like illness.", "Severe pneumonia.", "Sepsis."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1084, "stem": "Which statement about the prevention of L. pneumophila infection is, CORRECT?", "opts": ["Antibiotic prophylaxis is recommended.", "Vaccination is available and effective.", "Routine decontamination of water tanks by high temperature and hyperchlorination is recommended.", "Avoidance of public water sources is sufficient."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B)"}, {"n": 1085, "stem": "What is a distinguishing feature of Pontiac fever caused by L. pneumophila?", "opts": ["It involves severe respiratory symptoms.", "It is a mild flu-like illness without pneumonia.", "It is always fatal.", "It requires intensive antibiotic therapy. 125"], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book B) <div id="cgSrc" style="display:none"><div class="cg"><h1>Topics and theory-book pages</h1><div class="tw"><table><tr><th>Topic</th><th>Questions</th><th>Key source</th></tr><tr data-l='Topic'><td>Haemophilus, Brucella, Legionella</td><td data-l='Questions'>75 (+0 unverified)</td><td data-l='Pages'>printed file key; theory printed pages 99</td></tr></table></div><div class="n">Answers marked "الإجابة من عندنا مش من الملف" are keyed from the theory book page shown, not from the printed key.</div></div></div>
<script>
const PAGE=window.__PAGE__;
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='ABCDEFGH';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>${PAGE.title}</h2>
<p>${PAGE.intro}</p>
<p>${Q.length} questions${U.length?` + <b>${U.length} unverified</b> (listed at the bottom, not in the quiz)`:''}. Tap an answer in practice mode for instant feedback. Questions answered from the theory book are marked <span class="sk">الإجابة من عندنا مش من الملف</span> with the book page; the rest come from the file's printed key.</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,40),'practice')">Practice: 40 random</button>
<p><b>Exam mode:</b> answers only at the end, with score, review and "Retry missed only".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
${U.length?`<p style="margin-top:8px"><button class="btn g" onclick="unv()">Unverified questions (مش متأكدين منها): ${U.length}</button></p>`:''}
<p style="margin-top:8px"><button class="btn g" onclick="guide()">Topic & page table (جدول المراجعة)</button></p>
<p style="margin-top:6px"><a href="index-weeks.html">Back to the all-weeks index</a></p>
</div>`}
function unv(){app.innerHTML=`<div class="card"><h2>Unverified (مش متأكدين منها)</h2><p>These questions are NOT in the theory book, so we did not invent answers for them. Check them with your doctor or lecture notes.</p></div>`+U.map(q=>`<div class="card uv"><b>${q.stem}</b>${q.opts.map((o,k)=>`<div>${L[k]}) ${o}</div>`).join('')}<div class="src">Why unverified: ${q.reason}</div></div>`).join('')+`<div class="card"><button class="btn g" onclick="home()">Back</button></div>`}
function guide(){location.hash='#review';app.innerHTML=`<div class="card"><button class="btn g" onclick="home()">Back to menu</button><button class="btn" onclick="start(Q,'practice')">Start practice: all ${Q.length}</button></div>`+document.getElementById('cgSrc').innerHTML;window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function badge(q){return q.sk?`<div class="sk">الإجابة من عندنا مش من الملف (كتاب النظري ص ${q.pg})</div>`:''}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${badge(q)}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
