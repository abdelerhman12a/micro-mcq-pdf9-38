</style></head><body><div class="w" id="app"></div><script>const Q=[{"n": 1270, "stem": "Sabin polio vaccine can be considered superior to Salk vaccine in all of the following aspects, EXCEPT:", "opts": ["Ease of administration.", "Safety.", "Ability of virus to pass through stools and be transmitted to non-immunized children.", "Ability of conferring local intestinal immunity.", "Ability to prevent all stages of the infection."], "key": 1, "exp": "كتاب النظري: Sabin (OPV) limitations: loss of potency, interference, rare reversion to wild type, contraindicated in pregnancy/immunosuppressed - Salk is the safer one", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1271, "stem": "Repeated infections of common cold could be explained by all of the following, EXCEPT:", "opts": ["Multiple antigenic types.", "Nature of infection is superficial.", "Serum antibodies play no significant role.", "Rhinoviruses are slow viruses.", "Immunity is mainly superficial by IgA."], "key": 3, "exp": "كتاب النظري: Repeated rhinovirus attacks are due to multiple antigenic types and the superficial nature of the disease", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 149 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 149}, {"n": 1272, "stem": "Which of the following is the most common cause of infantile gastroenteritis?", "opts": ["Rotavirus.", "Adenovirus.", "Norwalk virus.", "Poliovirus.", "Hepatitis A virus."], "key": 0, "exp": "كتاب النظري: Rotavirus is the most common cause of severe diarrhea among infants and young children", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}, {"n": 1273, "stem": "How are Enteroviruses primarily transmitted?", "opts": ["Airborne.", "Fecal-oral.", "Blood.", "Direct contact."], "key": 1, "exp": "كتاب النظري: Enteroviruses: infection through the oral route; poliovirus transmission is fecal-oral", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 144 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 144}, {"n": 1274, "stem": "Which of the following is NOT a type of Enterovirus?", "opts": ["Poliovirus.", "Coxsackievirus.", "Echovirus.", "Influenza virus."], "key": 3, "exp": "كتاب النظري: Enteroviruses include polioviruses, coxsackie viruses, echoviruses - influenza is an orthomyxovirus", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 144 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 144}, {"n": 1276, "stem": "Which type of poliovirus vaccine is administered orally?", "opts": ["Salk vaccine.", "Sabin vaccine.", "Both.", "None."], "key": 1, "exp": "كتاب النظري: Sabin (OPV) is given orally at 2-4-6 months of age", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 146 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 146}, {"n": 1277, "stem": "Which of the following viruses is associated with myocarditis?", "opts": ["Coxsackievirus A.", "Coxsackievirus B.", "Echovirus.", "Rhinovirus."], "key": 1, "exp": "كتاب النظري: Coxsackie B: myocarditis or pericarditis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 148 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 148}, {"n": 1278, "stem": "What type of immune response does the Salk vaccine primarily provide?", "opts": ["IgA.", "IgG.", "IgM and IgG.", "IgA, IgM, and IgG. 140"], "key": 2, "exp": "كتاب النظري: Salk (IPV) stimulates the production of IgG and IgM only", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1279, "stem": "Which virus replicates better at 33°C and is the commonest cause of the common cold?", "opts": ["Norovirus.", "Rotavirus.", "Rhinovirus.", "Echovirus."], "key": 2, "exp": "كتاب النظري: Rhinovirus proliferates at 33-35 C, primarily in the nose; commonest cause of common cold", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 149 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 149}, {"n": 1280, "stem": "What is a potential disadvantage of the Sabin vaccine?", "opts": ["Requires refrigeration.", "Provides IgG immunity only.", "Causes secondary bacterial infection.", "May revert to the wild type."], "key": 3, "exp": "كتاب النظري: Sabin limitation: reversion of the attenuated viruses to the wild type (rare)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1281, "stem": "Which virus is the most common cause of gastroenteritis in infants and young children?", "opts": ["Norovirus.", "Rotavirus.", "Coxsackievirus.", "Rhinovirus."], "key": 1, "exp": "كتاب النظري: Rotavirus is the most common cause of severe diarrhea among infants and young children", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}, {"n": 1282, "stem": "What is the primary mechanism of action for the Sabin vaccine?", "opts": ["Provides IgG and IgM only.", "Provides IgA, IgM, and IgG.", "Prevents local infection only.", "Safe in immunocompromised patients."], "key": 1, "exp": "كتاب النظري: Sabin stimulates both local mucosal (IgA) and systemic (IgG and IgM) immunity", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1283, "stem": "Why does the Rhinovirus not cause gastrointestinal infections?", "opts": ["It is destroyed by stomach acid.", "It replicates only in the CNS.", "It lacks the necessary receptors.", "It is inactivated at higher temperatures."], "key": 0, "exp": "كتاب النظري: Rhinoviruses infect through the respiratory route and are acid sensitive", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 144 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 144}, {"n": 1285, "stem": "What feature is unique to Reoviruses when viewed under an electron microscope?", "opts": ["Bullet-like appearance.", "Wheel-like appearance.", "Spherical shape.", "Helical structure."], "key": 1, "exp": "كتاب النظري: Rotavirus: wheel-like appearance under the electron microscope", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}, {"n": 1286, "stem": "Why might the Sabin vaccine be contraindicated in pregnant women?", "opts": ["It is live attenuated and can revert to a wild type.", "It requires refrigeration.", "It provides only systemic immunity.", "It is an inactivated vaccine."], "key": 0, "exp": "كتاب النظري: Sabin is live attenuated with rare reversion to wild type; contraindicated for pregnant women", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1287, "stem": "Which of the following statements is true about the Salk vaccine?", "opts": ["It provides local immunity by generating IgA antibodies.", "It does not require refrigeration.", "It is contraindicated in immunosuppressed patients.", "It is safe for use in pregnant women."], "key": 3, "exp": "كتاب النظري: Salk (IPV) is recommended for pregnant women and immunosuppressed individuals", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1288, "stem": "Which serotype of rotavirus vaccine contains genes from five human serotypes?", "opts": ["Inactivated vaccine.", "Live attenuated vaccine containing a single serotype.", "Live vaccine containing five serotypes.", "Recombinant DNA vaccine. 141"], "key": 2, "exp": "كتاب النظري: Rotateq: live reassortant, pentavalent vaccine", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 151 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 151}, {"n": 1290, "stem": "Why might the Sabin vaccine be considered advantageous over the Salk vaccine?", "opts": ["It is easier to administer orally.", "It is inactivated and poses no risk of infection.", "It spreads immunity through the community via stool excretion.", "It does not require refrigeration."], "key": 2, "exp": "كتاب النظري: Sabin gives herd immunity as the attenuated virus multiplies in the intestine, is excreted in stool and reaches others", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1292, "stem": "Which factor contributes to the high rate of repeated Rhinovirus infections in humans?", "opts": ["Low genetic diversity.", "Multiple antigenic types and superficial nature of infection.", "High effectiveness of vaccines.", "Long-lasting immunity after initial infection."], "key": 1, "exp": "كتاب النظري: Repeated rhinovirus attacks are due to multiple antigenic types and the superficial nature of the disease", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 149 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 149}, {"n": 1293, "stem": "What is the major limitation of the Salk vaccine in preventing poliovirus transmission?", "opts": ["It does not require refrigeration.", "It does not provide local immunity (IgA) in the gut.", "It may revert to the wild type.", "It is contraindicated in immunosuppressed patients."], "key": 1, "exp": "كتاب النظري: Salk only prevents paralytic poliomyelitis but does not prevent the intestinal infection (no local IgA)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1295, "stem": "Which virus is primarily known for causing \"flaccid paralysis\"?", "opts": ["Rhinovirus.", "Echovirus.", "Poliovirus.", "Norovirus."], "key": 2, "exp": "كتاب النظري: Poliovirus replicates in motor neurons causing their destruction, leading to temporary or permanent (flaccid) paralysis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 145 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 145}, {"n": 1296, "stem": "A 3-month-old infant is brought to a clinic in a region where wild poliovirus was recently eradicated. The public health plan is to use the Sabin Oral Polio Vaccine (OPV). Which of the following findings in the infant would be the most significant contraindication to administering the vaccine at this visit?", "opts": ["Mild low-grade fever (38.0°", ".", "History of spitting up after feeds.", "Active diarrhea for the past 24 hours.", "Presence of a mild diaper rash. 142"], "key": 3, "exp": "كتاب النظري: Diarrhea is a contraindication for (Sabin) vaccination", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1297, "stem": "A research team is investigating a new method to stabilize the Sabin vaccine to reduce logistical challenges in tropical countries. Which major limitation of the vaccine are they most directly trying to address?", "opts": ["Its potential for reversion to neurovirulent strains.", "Its contraindication in pregnant women.", "Its requirement for storage and transport at 4°C.", "Its interference with other enterovirus infections."], "key": 2, "exp": "كتاب النظري: Sabin limitation: loss of potency if transported and stored at temperatures higher than 4 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1298, "stem": "A 25-year-old man presents with sudden onset of severe chest pain, worse on inspiration, and a fever. PCR testing of a pericardial fluid sample is positive for an enterovirus. Which of the following pathogens is most likely responsible for this clinical presentation?", "opts": ["Coxsackie A virus.", "Echovirus.", "Sabin poliovirus revertant.", "Coxsackie B virus."], "key": 3, "exp": "كتاب النظري: Coxsackie B: pleurodynia (Bornholm disease), myocarditis or pericarditis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 148 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 148}, {"n": 1299, "stem": "A 4-year-old child develops a febrile illness with vesicles and ulcers on the oral mucosa, palms, and soles. Which of the following is the most likely cause and the appropriate diagnostic approach?", "opts": ["Coxsackie A virus; diagnosis primarily by serological tests like ELISA.", "Echovirus; diagnosis primarily by viral culture in suckling mice.", "Coxsackie B virus; diagnosis primarily by throat swab for PCR.", "Vaccine-derived poliovirus; diagnosis primarily by stool culture."], "key": 0, "exp": "كتاب النظري: Coxsackie A: hand, foot and mouth disease; diagnosis by serological tests such as ELISA", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 148 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 148}, {"n": 1300, "stem": "The successful induction of intestinal immunity by the Sabin OPV can be prevented by which of the following mechanisms?", "opts": ["Inactivation of the vaccine virus by stomach acid.", "Simultaneous infection of the gut with other enteroviruses.", "Rapid clearance of the virus by the circulatory system.", "Pre-existing antibodies from maternal passive immunity. 143 2. (Rotaviruses)"], "key": 1, "exp": "كتاب النظري: Interference: vaccine infection may not take place if the intestine is already infected with other enteroviruses", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 147 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 147}, {"n": 1301, "stem": "A 9-month-old infant is brought to the emergency department in January with a 2-day history of profuse watery diarrhea and vomiting. The child appears significantly dehydrated. Stool antigen testing is positive. Which of the following is the most likely causative agent?", "opts": ["Norwalk virus.", "Rotavirus A.", "Enteric adenovirus.", "Astrovirus."], "key": 1, "exp": "كتاب النظري: Rotavirus is the most common cause of severe diarrhea among infants and young children; species A causes more than 90% of infections", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}, {"n": 1302, "stem": "The Rotarix vaccine is correctly described by which of the following statements?", "opts": ["It is a pentavalent, live reassortant vaccine given in three 2ml doses.", "It is a monovalent, live attenuated vaccine given in two 1ml doses within the first six months of life.", "It is an inactivated vaccine administered intramuscularly at 2, 4, & 6 months of age.", "It is a bivalent vaccine effective against Rotavirus A and B, given orally in two doses."], "key": 1, "exp": "كتاب النظري: Rotarix: live attenuated, monovalent, given orally in 2 doses of 1ml each in the first 6 months of life", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 151 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 151}, {"n": 1305, "stem": "Which diagnostic method would be most specific for confirming a current rotavirus infection in a hospitalized child by detecting the virus itself in a stool sample?", "opts": ["Detection of a rising antibody titer using ELISA.", "Detection of viral nucleic acid by RT-PCR.", "Observation of leukocytes in the stool via microscopy.", "A positive stool culture on standard bacteriological media."], "key": 1, "exp": "كتاب النظري: Rotavirus diagnosis: detection of viral nucleic acid by RT-PCR", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 151 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 151}, {"n": 1306, "stem": "A 7-month-old infant is due for their next set of vaccinations. The infant has a history of severe combined immunodeficiency (SCID). Based on the nature of the available vaccines, which rotavirus vaccine should be absolutely contraindicated for this infant?", "opts": ["Both Rotarix and RotaTeq are contraindicated.", "Only Rotarix is contraindicated.", "Only RotaTeq is contraindicated.", "Neither vaccine is contraindicated; both are safe. 144"], "key": 0, "exp": "كتاب النظري: Both Rotarix (live attenuated) and Rotateq (live reassortant) are live vaccines, so both are contraindicated in severe immunodeficiency", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 151 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 151}, {"n": 1308, "stem": "A 4-year-old child previously healthy and fully vaccinated (including the complete rotavirus vaccine series) presents with mild, self-limiting diarrhea. Stool sample analysis reveals a non-enveloped virus with a single-stranded, positivesense RNA genome. Which of the following is the LEAST likely causative agent?", "opts": ["Norwalk virus.", "Astrovirus.", "Rotavirus.", "The clinical information is insufficient to determine."], "key": 2, "exp": "كتاب النظري: Rotavirus is a double-stranded segmented RNA virus, not a +ssRNA virus, and the child is fully vaccinated - least likely", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}, {"n": 1309, "stem": "The characteristic \"wheel-like appearance\" of rotavirus when viewed under an electron microscope is primarily due to its unique:", "opts": ["Single-stranded RNA genome.", "Non-enveloped structure.", "Icosahedral double-layered capsid.", "Segmented nature."], "key": 2, "exp": "كتاب النظري: Icosahedral double-layered capsid gives the wheel-like appearance under EM", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}, {"n": 1310, "stem": "In the context of rotavirus pathogenesis, what is the primary reason that subsequent infections after the first one are typically less severe?", "opts": ["The virus mutates to a less virulent form in subsequent infections.", "The virus primarily infects adults who have stronger immune systems.", "Immunity develops after the first infection.", "The fecal-oral route of transmission becomes less efficient."], "key": 2, "exp": "كتاب النظري: With each infection immunity develops, and subsequent infections are less severe", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 150 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 150}];

function home(){app.innerHTML=`<div class="card"><h2>${PAGE.title}</h2>
<p>${PAGE.intro}</p>
<p>${Q.length} questions${U.length?` + <b>${U.length} unverified</b> (listed at the bottom, not in the quiz)`:''}. Tap an answer in practice mode for instant feedback. Questions answered from the theory book are marked <span class="sk">الإجابة من عندنا مش من الملف</span> with the book page; the rest come from the file's printed key.</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,40),'practice')">Practice: 40 random</button>
<p><b>Exam mode:</b> answers only at the end, with score, review and "Retry missed only".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
${U.length?`<p style="margin-top:8px"><button class="btn g" onclick="unv()">Unverified questions (مش متأكدين منها): ${U.length}</button></p>`:''}
<p style="margin-top:8px"><button class="btn g" onclick="guide()">Topic & page table (جدول المراجعة)</button></p>
<p style="margin-top:6px"><a href="index-weeks.html">Back to the all-weeks index</a></p>
</div>`}
function unv(){app.innerHTML=`<div class="card"><h2>Unverified (مش متأكدين منها)</h2><p>These questions are NOT in the theory book, so we did not invent answers for them. Check them with your doctor or lecture notes.</p></div>`+U.map(q=>`<div class="card uv"><b>${q.stem}</b>${q.opts.map((o,k)=>`<div>${L[k]}) ${o}</div>`).join('')}<div class="src">Why unverified: ${q.reason}</div></div>`).join('')+`<div class="card"><button class="btn g" onclick="home()">Back</button></div>`}
function guide(){location.hash='#review';app.innerHTML=`<div class="card"><button class="btn g" onclick="home()">Back to menu</button><button class="btn" onclick="start(Q,'practice')">Start practice: all ${Q.length}</button></div>`+document.getElementById('cgSrc').innerHTML;window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function badge(q){return q.sk?`<div class="sk">الإجابة من عندنا مش من الملف (كتاب النظري ص ${q.pg})</div>`:''}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${badge(q)}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
