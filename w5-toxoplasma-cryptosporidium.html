ry climates", "High altitudes", "Polar regions"], "key": 0, "exp": "Trigger: \"Infection is often highest in areas... hot, humid climates and lower altitudes, because the oocysts survive better\".", "src": "Theory book PDF 409 (printed 401)", "cue": "climate", "ask": "Toxoplasma infection is highest in", "distinguish": "Oocyst survival."}, {"n": 37, "stem": "Infective stage of Toxoplasma to intermediate hosts", "opts": ["Only oocysts", "All life forms are infectious", "Only tachyzoites", "Only cysts"], "key": 1, "exp": "Trigger: \"Infective stage: all life forms are infectious to intermediate host\".", "src": "Theory book PDF 410 (printed 402)", "cue": "infective", "ask": "Infective stage of Toxoplasma", "distinguish": "Diagnostic = cysts."}, {"n": 38, "stem": "In the cat intestine, Toxoplasma trophozoites undergo", "opts": ["Binary fission only", "Schizogony and gametogony forming micro and macrogametocytes", "Sporulation", "Encystation"], "key": 1, "exp": "Trigger: \"penetrate the sub-mucosal epithelial cells where they undergo several schizogony and gametogony... micro- (male) and macro- (female) gametocytes\".", "src": "Theory book PDF 410 (printed 402)", "cue": "cat cycle", "ask": "Toxoplasma in cat intestine", "distinguish": "Sexual stage."}, {"n": 39, "stem": "Toxoplasma oocysts become infective by sporulation in", "opts": ["The cat gut", "Man", "The warm environment outside the host", "Water only"], "key": 2, "exp": "Trigger: \"Oocysts sporulate in the warm environment and are infectious to a variety (man and farm animals)\".", "src": "Theory book PDF 411 (printed 403)", "cue": "sporulation", "ask": "Toxoplasma oocyst sporulation", "distinguish": "Crypto sporulates in host."}, {"n": 40, "stem": "In intermediate hosts, ingested Toxoplasma first multiplies rapidly inside", "opts": ["RBCs", "Macrophages (then cells rupture releasing tachyzoites)", "Neurons", "Adipocytes"], "key": 1, "exp": "Trigger: \"find their way into macrophages where they divide very rapidly (hence the name tachyzoites)... The infected cells rupture and release the tachyzoites\".", "src": "Theory book PDF 411 (printed 403)", "cue": "macrophage", "ask": "Toxoplasma rapid division site", "distinguish": "Then muscle/nerve."}, {"n": 41, "stem": "Bradyzoites in muscle and nerve cells are protected from", "opts": ["Drugs only", "The host immune system", "Antibodies only", "Complement only"], "key": 1, "exp": "Trigger: \"enter other cells, including muscle and nerve cells, where they are protected from the host immune system and multiply slowly (bradyzoites)\".", "src": "Theory book PDF 411 (printed 403)", "cue": "protected", "ask": "Bradyzoites protected from", "distinguish": "Chronic stage."}, {"n": 42, "stem": "Acute toxoplasmosis in immunocompetent adults is usually", "opts": ["Fatal", "Self-limited, symptoms resolve within months", "Always asymptomatic, never flu-like", "Chronic"], "key": 1, "exp": "Trigger: \"The disease is self-limited, and symptoms resolves within months\".", "src": "Theory book PDF 412 (printed 404)", "cue": "course", "ask": "Course in immunocompetent", "distinguish": "Flu-like possible."}, {"n": 43, "stem": "Most infants with congenital toxoplasmosis at birth", "opts": ["Always hydrocephalic", "Always die", "Appear normal; untreated develop manifestations later", "Always jaundiced"], "key": 2, "exp": "Trigger: \"Most infants with congenital toxoplasmosis appear normal at birth. If they are untreated they will develop manifestation... later on\".", "src": "Theory book PDF 413 (printed 405)", "cue": "newborn", "ask": "Congenital toxoplasmosis at birth", "distinguish": "Later manifestations."}, {"n": 44, "stem": "Direct microscopy of acute toxoplasmosis uses impression smears", "opts": ["Gram stain", "Fixed in methyl alcohol and stained with Giemsa", "Ziehl-Neelsen", "Iodine wet film"], "key": 1, "exp": "Trigger: \"impression smears... fixed in methyl alcohol and stained with the Giemsa stain\".", "src": "Theory book PDF 413 (printed egnant women", "opts": ["Vaccination", "Avoid contact with cats, soil and raw meat", "Prophylactic pyrimethamine", "Cat litter weekly"], "key": 1, "exp": "Trigger: \"Pregnant women: should avoid contact with cats, soil and raw meat\".", "src": "Theory book PDF 417 (printed 409)", "cue": "pregnancy prevention", "ask": "Prevention in pregnancy", "distinguish": "No vaccine."}, {"n": 54, "stem": "Pet cats to prevent toxoplasmosis should be fed", "opts": ["Raw meat", "Only dry, canned or cooked food; litter box emptied daily", "Mice", "Raw milk"], "key": 1, "exp": "Trigger: \"Should be fed only dry, canned, or cooked food. The cat litter box should be emptied every day\".", "src": "Theory book PDF 417 (printed 409)", "cue": "cat care", "ask": "Pet cats prevention", "distinguish": "Daily litter."}, {"n": 55, "stem": "Vaccine for human toxoplasmosis", "opts": ["Available live vaccine", "Available killed vaccine", "No vaccine till now", "BCG"], "key": 2, "exp": "Trigger: \"Till now, there is no vaccine to prevent toxoplasmosis in humans\".", "src": "Theory book PDF 417 (printed 409)", "cue": "vaccine", "ask": "Toxoplasmosis vaccine", "distinguish": "Prevention only."}, {"n": 56, "stem": "Intestinal coccidia include", "opts": ["Cryptosporidium, Isospora belli, Cyclospora cayetanensis", "Entamoeba, Giardia", "Toxoplasma only", "Plasmodium"], "key": 0, "exp": "Trigger: \"Members of this class (Cryptosporidium spp., Isospora belli, Cyclospora cayetanensis)\".", "src": "Theory book PDF 418 (printed 410)", "cue": "members", "ask": "Intestinal coccidia members", "distinguish": "Opportunistic."}, {"n": 57, "stem": "In Cryptosporidium life cycle, calves and man act as", "opts": ["Definitive only", "Intermediate only", "Both definitive and intermediate hosts", "Vectors"], "key": 2, "exp": "Trigger: \"Hosts: Both calves and man act as definitive and intermediate hosts\".", "src": "Theory book PDF 418 (printed 410)", "cue": "hosts", "ask": "Cryptosporidium hosts", "distinguish": "Calves reservoir."}, {"n": 58, "stem": "In immunocompromised hosts, Cryptosporidium may also be found in", "opts": ["Only small intestine", "Lung, liver, gall bladder and pancreas", "Brain", "Skin"], "key": 1, "exp": "Trigger: \"In immunocompromised hosts, it may be present in other sites like; lung, liver, gall bladder, and pancreas\".", "src": "Theory book PDF 419 (printed 411)", "cue": "extraintestinal", "ask": "Cryptosporidium extra sites", "distinguish": "AIDS."}, {"n": 59, "stem": "Modes of Cryptosporidium infection include", "opts": ["Mosquito bite", "Food/water with calves' feces, water-borne outbreaks, lab accidents, autoinfection", "Transplacental", "Sexual"], "key": 1, "exp": "Trigger: \"Swallowing the oocyst in food or water contaminated with calves' feces... autoinfection... Water-borne outbreaks. Accidental in laboratories\".", "src": "Theory book PDF 419 (printed 411)", "cue": "modes", "ask": "Cryptosporidium transmission", "distinguish": "Water-borne."}, {"n": 60, "stem": "Cryptosporidium merozoites type I and type II", "opts": ["Type I repeats asexual cycle; type II starts sexual cycle (micro and macrogametes)", "Both sexual", "Both asexual", "Type II forms cysts"], "key": 0, "exp": "Trigger: \"Type I reinvade epithelial cells and repeat the asexual cycle. Another type (type II merozoites) starts the sexual cycle comprising microgametes and macrogametes\".", "src": "Theory book PDF 419 (printed 411)", "cue": "merozoites", "ask": "Merozoite types", "distinguish": "Schizogony."}, {"n": 61, "stem": "Cryptosporidiosis in immunocompromised patients", "opts": ["Self-limited always", "Prolonged, life-threatening, with respiratory problems, pancreatitis, hepatitis, cholangitis", "Asymptomatic always", "Only skin rash"], "key": 1, "exp": "Trigger: \"In immunocompromised patients: the disease is often prolonged and life-threatening... respiratory problems, pancreatitis, hepatitis, and cholangitis\".", "src": "Theory book PDF 420 (printed 412)", "cue": "AIDS crypto", "ask": "Crypto in immunocompromised", "distinguish": "Extra-intestinal."}, {"n": 62, "stem": "For recent Cryptosporidium infection, the sensitive test is", "opts": ["Serum antibodies", "Immunoblot detecting sporozoite antigens", "Urine antigen", "Blood film"], "key": 1, "exp": "Trigger: \"Detection of antibodies in serum, shows only prior infections. However, immunoblots for detecting sporozoite antigens are sensitive and diagnose recent infections\".", "src": "Theory book PDF 420 (printed 412)", "cue": "immunoblot", "ask": "Recent crypto infection test", "distinguish": "Serum Ab = prior."}, {"n": 63, "stem": "Cryptosporidium treatment: complete eradication and paromomycin", "opts": ["Fully cured by nitazoxanide", "No drug eradicates completely; paromomycin has some effect", "Paromomycin is drug of choice", "Cured by albendazole"], "key": 1, "exp": "Trigger: \"There is no effective drug for the complete eradication of the parasite... Paromomycin has some effect\".", "src": "Theory book PDF 420 (printed 412)", "cue": "eradication", "ask": "Crypto eradication/paromomycin", "distinguish": "Nitazoxanide DOC."}];
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='practice',ans={};
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m||'practice';ans={};show();window.scrollTo(0,0)}
function home(){location.hash='#menu';app.innerHTML=`<div class="hdr"><h2>${BANK.title}</h2><div class="meta">${BANK.dateLabel}<br>Source: ${BANK.sourceLabel}</div><span class="badge">${Q.length} questions</span>${Object.keys(IMG).length?`<span class="badge">${Object.keys(IMG).length} figures</span>`:''}</div>
<div class="card">
<p>Tap an answer and know immediately if it is right, with the trigger words and the book page. Questions and options are shuffled every round.</p>
<button class="btn" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn o" onclick="start(shuffle(Q).slice(0,Math.min(40,Q.length)),'practice')">Practice: 40 random</button>
<button class="btn g" onclick="start(Q,'exam')">Exam mode (answers at the end)</button>
<button class="btn g" onclick="guide()">Review table (جدول المراجعة)</button>
${BANK.extraLinks||''}
<p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p>
</div>`}
function guide(){
 location.hash='#review';
 const rows=Q.map((q,k)=>`<tr><td data-l="Cue (from the book)">${q.cue||''}</td><td data-l="The question asks">${q.ask||q.stem}</td><td data-l="Answer" class="ans">${q.opts[q.key]}</td><td data-l="Distinguish from">${q.distinguish||''}</td></tr>`).join('');
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Review table - ${BANK.title}</h2>
 <div class="note"><b>How to use:</b> when you see the <b>cue</b> in a question, this table tells you what the question really asks, the answer, and what separates it from the close options. Cues come only from the book pages of this session. A cue is a strong hint, not a guarantee: read the whole stem.</div>
 <button class="btn" onclick="start(Q,'practice')">Start practice</button><button class="btn g" onclick="home()">Menu</button>
 <div style="overflow-x:auto;margin-top:10px"><table class="cues"><thead><tr><th>Cue (from the book)</th><th>The question asks</th><th>Answer</th><th>Distinguish from</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p style="margin-top:10px"><a class="lnk" href="${BANK.indexUrl}">${BANK.indexLabel}</a></p></div>`;
 window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}) ${q.opts[q.key]}</b><br>${q.exp||''}${q.cue?`<div class="cue"><b>Cue:</b> ${q.cue}${q.distinguish?`<br><b>Distinguish:</b> ${q.distinguish}`:''}</div>`:''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:10px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish & score':'Submit & see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${sc} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Menu</button><button class="btn g" onclick="guide()">Review table</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv();window.scrollTo(0,0)}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}) ${q.opts[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
