</style></head><body><div class="w" id="app"></div><script>const Q=[{"n": 704, "stem": "The yellow colonies of V. cholerae on TCBS agar medium is due to:", "opts": ["Endopigment production.", "Exopigment production.", "Sucrose fermentation.", "Lactose fermentation.", "Nitrate reduction."], "key": 2, "exp": "كتاب النظري: V. cholerae produces yellow colonies on TCBS due to sucrose fermentation", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 705, "stem": "Cholera toxin:", "opts": ["Acts by inhibition of protein synthesis.", "Acts by inhibition of acetyl choline release.", "Is secreted by lysogenic strains only.", "Is classified as an enterotoxin.", "Has 5 A and 1 B subunits."], "key": 3, "exp": "كتاب النظري: V. cholerae secretes the potent cholera enterotoxin (choleragen): 5 B subunits and one active A subunit", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 79 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 79}, {"n": 706, "stem": "An individual experiences diarrhea after eating raw shell fish. What is the most probable cause?", "opts": ["Campylobacter jejuni.", "Salmonella Choleraesuis.", "Shigella dysenteriae.", "Vibrio parahaemolyticus.", "Yersinia enterocolitica."], "key": 3, "exp": "كتاب النظري: Vibrio parahaemolyticus causes seafood-associated gastroenteritis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 707, "stem": "Which Vibrio species is known for causing epidemic cholera?", "opts": ["Vibrio cholerae O1.", "Vibrio parahaemolyticus.", "Vibrio cholera O126.", "Vibrio mimicus."], "key": 0, "exp": "كتاب النظري: V. cholerae serogroups O1 and O139 are the causative agents of epidemic cholera", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 78 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 78}, {"n": 708, "stem": "What type of motility do Vibrio species exhibit?", "opts": ["Darting motility.", "Swarming motility.", "Brownian motion.", "Tumbling motility."], "key": 0, "exp": "كتاب النظري: Highly motile bacilli with a single polar flagellum producing darting motility", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 709, "stem": "Vibrio cholerae grows best under which type of conditions?", "opts": ["Acidic conditions.", "Neutral conditions.", "Alkaline conditions.", "High temperature conditions."], "key": 2, "exp": "كتاب النظري: V. cholerae grows best under alkaline conditions", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 710, "stem": "What color do Vibrio cholerae colonies appear on TCBS agar?", "opts": ["Yellow.", "Blue.", "Red.", "White."], "key": 0, "exp": "كتاب النظري: Yellow (sucrose-fermenting) colonies on TCBS medium", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 711, "stem": "Vibrio cholerae is oxidase-positive and indole-positive. What does this indicate?", "opts": ["It is classified in Enterobacteriaceae.", "It is not classified in Enterobacteriaceae.", "It is Gram-positive.", "It is motile. 78"], "key": 1, "exp": "كتاب النظري: Oxidase-positive - therefore not classified as Enterobacteriaceae", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 712, "stem": "What is the route of transmission for cholera?", "opts": ["Direct person-to-person.", "Feco-oral route.", "Airborne droplets.", "Blood transfusion."], "key": 1, "exp": "كتاب النظري: Infection is transmitted primarily by the faeco-oral route through contaminated water or food", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 79 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 79}, {"n": 713, "stem": "Which biochemical reaction result is seen in Vibrio cholerae on TSI medium?", "opts": ["Acidic (yellow) butt and alkaline (red) slant.", "Acidic (yellow) butt and acidic (yellow) slant.", "Alkaline (red) butt and acidic (yellow) slant.", "Alkaline (red) butt and alkaline (red) slant."], "key": 1, "exp": "كتاب النظري: On TSI it gives acidic (yellow) butt and acidic (yellow) slant with no cracking of the agar", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 78 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 78}, {"n": 714, "stem": "Which serogroup of Vibrio cholerae is involved in epidemic cholera?", "opts": ["O2.", "O3.", "O1 and O139.", "O4."], "key": 2, "exp": "كتاب النظري: Serogroups O1 and O139 are the causative agents of epidemic cholera", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 78 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 78}, {"n": 715, "stem": "In which medium does Vibrio cholerae form a surface pellicle?", "opts": ["Nutrient agar.", "Alkaline peptone water.", "TCBS agar.", "MacConkey's agar."], "key": 1, "exp": "كتاب النظري: Alkaline peptone water: a surface pellicle containing the organism is formed after 6-8 h", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 716, "stem": "What is the primary treatment for cholera?", "opts": ["Antibiotics.", "Fluid and electrolyte replacement.", "Antiviral medication.", "Surgery."], "key": 1, "exp": "كتاب النظري: Treatment of cholera consists essentially of replacing fluid and electrolytes", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 81 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 81}, {"n": 717, "stem": "What is the primary medium for confirming Vibrio cholerae by subculture?", "opts": ["Alkaline peptone water.", "Nutrient agar.", "TCBS agar.", "MacConkey's agar."], "key": 2, "exp": "كتاب النظري: Subcultures from the surface pellicle are done on TCBS", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 80 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 80}, {"n": 718, "stem": "What is the effect of antacids on cholera infection?", "opts": ["Increase the infective dose.", "Decrease the infective dose.", "Have no effect on the infective dose.", "Cure the infection."], "key": 1, "exp": "كتاب النظري: Vibrios are tolerant to alkaline conditions and destroyed by low pH, so antacids lower the required infective dose", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 719, "stem": "What is the diagnostic method for confirming Vibrio cholerae during an epidemic?", "opts": ["Clinical judgment.", "PCR analysis.", "Serological testing.", "Microscopic examination of liquid stools."], "key": 3, "exp": "كتاب النظري: Secondary case: microscopic examination of a wet mount of liquid stool; motility stopped by specific antibody", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 81 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 81}, {"n": 720, "stem": "Which test is used to detect Vibrio cholerae's characteristic darting motility?", "opts": ["Gram staining.", "Wet mount examination.", "String test.", "Biochemical reactions."], "key": 1, "exp": "كتاب النظري: Microscopic examination of a wet mount shows Gram-negative curved rods with darting motility", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 80 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 80}, {"n": 721, "stem": "What is the primary role of the A subunit in the cholera toxin?", "opts": ["To bind to intestinal receptors.", "To activate adenylate cyclase.", "To cause cell lysis.", "To ferment sugars."], "key": 1, "exp": "كتاب النظري: The active A subunit enters the cells and activates adenylate cyclase, raising cAMP", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 79 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 79}, {"n": 722, "stem": "What is the reason for the high infective dose required for Vibrio cholera infection?", "opts": ["High resistance to antibiotics.", "Sensitivity to stomach acid.", "Lack of motility.", "Low ability to ferment sugars. 79"], "key": 1, "exp": "كتاب النظري: Vibrios are destroyed by low pH (gastric acid), so a high infective dose is needed", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 723, "stem": "How long does it typically take for Vibrio cholerae to form a surface pellicle in alkaline peptone water?", "opts": ["2-4 hours.", "6-8 hours.", "12-16 hours.", "24-48 hours."], "key": 1, "exp": "كتاب النظري: A surface pellicle is formed after incubation of 6 to 8 h at 37 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 724, "stem": "How does the cholera toxin cause diarrhea?", "opts": ["By increasing pH in the intestine.", "By causing electrolyte and water secretion into the intestinal lumen.", "By decreasing mucosal permeability.", "By inhibiting water absorption."], "key": 1, "exp": "كتاب النظري: Rise in cAMP causes massive secretion of electrolytes and water into the lumen of the small intestine", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 79 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 79}, {"n": 725, "stem": "V.cholera, the causative org. of cholera, is best described as:", "opts": ["'String test' positive isolates; three serotypes-Ogawa, Inaba, Hikojima.", "Human pathogen, halophilic, lactose positive; produce heat labile extracellular toxin.", "Human pathogen, halophilic, lactose negative, sucrose negative causes gastrointestinal diseases from ingestion of cooked seafood.", "Cause of gastroenteritis; reservoir in birds and mammals, optimal growth at 42°C.", "Urease positive, cause of fetal distress in cattle."], "key": 0, "exp": "كتاب النظري: String test positive; serogroup O1 has three serotypes: Ogawa, Inaba and Hikojima", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 726, "stem": "V. cholera, the causative agent of cholera, is best isolated using:", "opts": ["Sheep blood agar.", "Loffler's medium.", "Thayer-martin agar.", "TCBS."], "key": 3, "exp": "كتاب النظري: TCBS agar is the selective indicator medium for V. cholerae", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 727, "stem": "The single most important characteristic of diarrhea caused by V. cholera is:", "opts": ["Profound watery diarrhea.", "Severe abdominal pain.", "Massive bloody diarrhea.", "Renal insufficiency."], "key": 0, "exp": "كتاب النظري: Abrupt onset of vomiting and massive watery diarrhea (rice-water stools)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 80 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 80}, {"n": 728, "stem": "V. cholera is characterized by all of the following, EXCEPT:", "opts": ["Grows best at alkaline PH.", "Can grow on DCA medium.", "Aerobic organism.", "Late lactose fermenter.", "Indole-negative."], "key": 4, "exp": "كتاب النظري: V. cholerae is oxidase-positive and indole-positive", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 78 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 78}, {"n": 729, "stem": "Pathogenicity of V. cholera 01 is mainly due to:", "opts": ["Enterotoxin production.", "Capsular polysaccharides.", "Haemolysin production.", "Lipase enzyme."], "key": 0, "exp": "كتاب النظري: V. cholerae multiplies and secretes the potent cholera enterotoxin", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 79 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 79}, {"n": 730, "stem": "In Secondary case of cholera, the following test is sufficient for diagnosis", "opts": ["Cholera red reaction.", "Cholera immobilization test.", "Culture of stool in peptone water.", "Culture of stool on TCBS.", "Detection of antibodies in serum."], "key": 1, "exp": "كتاب النظري: Confirmation: characteristic motility in a wet mount stopped by specific antibody (immobilization test)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 81 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 81}, {"n": 731, "stem": "Which is NOT a characteristic of Vibrio cholerae?", "opts": ["Motile with single polar flagellum.", "Oxidase positive.", "It ferments glucose with acid and gas production.", "Indole positive. 80"], "key": 2, "exp": "كتاب النظري: V. cholerae ferments glucose, maltose, mannite and sucrose WITHOUT gas production", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 77 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 77}, {"n": 732, "stem": "Which statement does NOT describe Vibrio cholerae?", "opts": ["It is pathogenic for humans.", "It's shape like a comma.", "It is Gram-negative.", "It has peritrichate flagella."], "key": 3, "exp": "كتاب النظري: Vibrios have a single polar flagellum, not peritrichate flagella", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 734, "stem": "For prophylaxis from Vibrio cholerae diarrhea before travel to endemic areas; a man can be given:", "opts": ["Gentamycin.", "Penicillin.", "Cephalosporins.", "Tetracyclines."], "key": 3, "exp": "كتاب النظري: Chemoprophylaxis: tetracycline may be given to close contacts", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 81 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 81}, {"n": 735, "stem": "Which of the following statements is true of cholera enterotoxin?", "opts": ["Produce its effects by stimulating adenyl cyclase activity in mucosal cells.", "Causes destruction of the intestinal mucosa allowing for invasive infection.", "Acts by inhibiting protein synthesis.", "Polysaccharide in nature."], "key": 0, "exp": "كتاب النظري: The A subunit activates adenylate cyclase causing a rise in cAMP and massive secretion", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 79 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 79}, {"n": 737, "stem": "The most important therapy for cholera is:", "opts": ["Water & electrolyte replacement.", "Antitoxin.", "Chloramphenicol.", "Tetracycline.", "Both a & d."], "key": 0, "exp": "كتاب النظري: Treatment consists essentially of replacing fluid and electrolytes; antibiotics are only useful adjuncts", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 81 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 81}, {"n": 738, "stem": "Koll's vaccine is:", "opts": ["Heat killed V. cholerae strains.", "Live attenuated V. cholera strains.", "Mutant cholera strains that act by interfering with V. cholerae enterotoxin attachment.", "Recombinant DNA vaccine."], "key": 0, "exp": "كتاب النظري: Killed cholera vaccine is an extract of killed bacteria given intramuscularly", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 81 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 81}, {"n": 739, "stem": "All of the following statements refer to Vibrio parahaemolyticus, EXCEPT:", "opts": ["It is halophilic organism.", "Is a major cause of gastroenteritis associated with seafood?", "It is agglutinated by Vibrio cholera O 1 antiserum.", "Human isolates are hemolytic to horse red blood cells. 81"], "key": 2, "exp": "كتاب النظري: O antigens are specific and distinguish strains into serogroups; V. parahaemolyticus is not agglutinated by anti-O1", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 78 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 78}, {"n": 740, "stem": "Vibrios are different from enteric bacteria such as E.coli by the following:", "opts": ["Straight, Gram-negative rods.", "Pleomorphic, Gram-positive cocci.", "Non-motile.", "Gram-negative curved rods with single polar flagellum."], "key": 3, "exp": "كتاب النظري: Gram-negative, curved/comma-shaped bacilli with a single polar flagellum", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 76 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 76}, {"n": 742, "stem": "Epidemic of cholera caused mainly by:", "opts": ["Vibrio cholera 01.", "Vibrio cholera 0139.", "Vibrio cholera 011.", "BOTH a&b."], "key": 3, "exp": "كتاب النظري: Serogroups O1 and O139 are the causative agents of epidemic cholera", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 78 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 78}, {"n": 743, "stem": "Cholera is:", "opts": ["Rice watery diarrhea.", "Dysenteric diarrhea.", "Severe abdominal pain.", "Renal insufficiency."], "key": 0, "exp": "كتاب النظري: Massive watery diarrhea (rice-water stools)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 80 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 80}, {"n": 744, "stem": "The special laboratory conditions required to isolate C. jejuni are:", "opts": ["37°C, aerobic on TCBS agar plates.", "42°C, microaerophilic on Skirrow's medium.", "37°C, microaerophilic on macconkey's medium.", "37°C, anaerobic on blood agar plates.", "42°C, aerobic on Skirrow's medium."], "key": 1, "exp": "كتاب النظري: Cultures are incubated in a microaerophilic atmosphere at 42 C on Skirrow's medium", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 745, "stem": "What is the primary selective media used for growing Campylobacter jejuni?", "opts": ["Blood agar.", "MacConkey agar.", "Skirrow's medium.", "Sabouraud agar."], "key": 2, "exp": "كتاب النظري: C. jejuni can be grown on selective media e.g. Skirrow's medium", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 746, "stem": "At what temperature is Campylobacter jejuni cultured?", "opts": ["37°C.", "42°C.", "25°C.", "30°C."], "key": 1, "exp": "كتاب النظري: Cultures are incubated at 42 C (thermophilic) for 2 days", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 747, "stem": "What is the primary transmission route for Campylobacter jejuni?", "opts": ["Airborne.", "Feco-oral.", "Vector-borne.", "Person-to-person."], "key": 1, "exp": "كتاب النظري: Transmitted feco-orally through food and water contaminated with animal feces", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 748, "stem": "Which autoimmune disease is associated with Campylobacter jejuni infection?", "opts": ["Rheumatoid arthritis.", "Guillain-Barré syndrome.", "Lupus erythematosus.", "Multiple sclerosis. 82"], "key": 1, "exp": "كتاب النظري: C. jejuni enteritis may be complicated by Guillain-Barre syndrome", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 749, "stem": "What is a key feature of Campylobacters in laboratory diagnosis?", "opts": ["They are Gram-positive.", "They are oxidase negative.", "They exhibit rapid darting motility.", "They grow in aerobic conditions."], "key": 2, "exp": "كتاب النظري: Presumptive diagnosis: curved organisms with rapid darting motility in a wet mount of faeces", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 750, "stem": "Which test is used to presumptively diagnose Campylobacter jejuni from stools?", "opts": ["PCR.", "Wet mount microscopy.", "ELISA.", "Blood culture."], "key": 1, "exp": "كتاب النظري: Wet mount of faeces shows curved organisms with rapid darting motility", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 751, "stem": "What is a common complication of Campylobacter enteritis?", "opts": ["Reactive arthritis.", "Diabetes mellitus.", "Chronic fatigue syndrome.", "Asthma."], "key": 0, "exp": "كتاب النظري: Complications include reactive arthritis, Guillain-Barre syndrome and Reiter's disease", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 752, "stem": "Campylobacter jejuni is primarily grown in what type of atmosphere?", "opts": ["Aerobic.", "Anaerobic.", "Microaerophilic.", "Facultative anaerobic."], "key": 2, "exp": "كتاب النظري: Most Campylobacters are microaerophilic (5% O2 and 10% CO2)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 753, "stem": "Which autoimmune condition is characterized by arthritis, conjunctivitis, and urethritis?", "opts": ["Reactive arthritis.", "Guillain-Barré syndrome.", "Reiter's disease.", "Systemic lupus erythematosus."], "key": 2, "exp": "كتاب النظري: Reiter's disease: the triad of arthritis, conjunctivitis and urethritis", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 754, "stem": "What is the recommended antibiotic treatment for Campylobacter enteritis?", "opts": ["Amoxicillin.", "Erythromycin.", "Ciprofloxacin.", "Tetracycline."], "key": 1, "exp": "كتاب النظري: Erythromycin is the antibiotic of choice", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 755, "stem": "What is the role of antibiotics in Skirrow’s medium?", "opts": ["To enhance growth of Campylobacter.", "To render the medium selective.", "To inhibit the growth of Campylobacter.", "To increase oxygen levels."], "key": 1, "exp": "كتاب النظري: Skirrow's medium is blood agar rendered selective by addition of antibiotics", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 756, "stem": "Which preventive measure is essential for controlling Campylobacter infections?", "opts": ["Increased use of antibiotics in animals.", "Proper cooking of poultry.", "Avoiding contact with pets.", "Using air purifiers."], "key": 1, "exp": "كتاب النظري: Common food sources include poultry, raw milk and meat, so proper cooking of poultry prevents infection", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 757, "stem": "What complication of Campylobacter enteritis involves the peripheral nervous system?", "opts": ["Reiter's disease.", "Guillain-Barré syndrome.", "Reactive arthritis.", "Systemic lupus erythematosus."], "key": 1, "exp": "كتاب النظري: Guillain-Barre syndrome is an acute paralytic disease of the peripheral nervous system", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 758, "stem": "What is the function of the selective antibiotics in Skirrow’s medium?", "opts": ["To promote Campylobacter growth.", "To inhibit growth of other bacteria.", "To improve motility.", "To provide nutrients."], "key": 1, "exp": "كتاب النظري: The antibiotics in Skirrow's medium render it selective (inhibit other bacteria)", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 759, "stem": "Campylobacter jejuni is known to cause enteritis primarily in which age group?", "opts": ["Elderly.", "Adults.", "Children under 5 years & young adults.", "Teenagers. 83"], "key": 2, "exp": "كتاب النظري: C. jejuni enteritis affects mainly children under 5 years and young adults", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 760, "stem": "What is the appearance of Campylobacter jejuni on a wet mount?", "opts": ["Round and stationary.", "Curved with darting motility.", "Rod-shaped and non-motile.", "Spherical and slowly moving."], "key": 1, "exp": "كتاب النظري: Curved organisms with rapid darting motility on wet mount", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 761, "stem": "The following is characteristic feature of Campylobacter ieiuni:", "opts": ["Biochemically very active.", "Found only in human GIT.", "Cause infectious diarrhea in human from animal source.", "Cause peptic ulcer."], "key": 2, "exp": "كتاب النظري: Campylobacters are carried in the intestinal tract of birds and domestic animals and cause enteritis in humans", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 762, "stem": "Which of the following disease is the commonest presentation of campylobacter infection:", "opts": ["Diarrhea.", "Pneumonia.", "Sinusitis.", "Myocarditis.", "Peptic ulcer."], "key": 0, "exp": "كتاب النظري: The disease begins as watery diarrhea followed by bloody stools", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 83 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 83}, {"n": 763, "stem": "Which description is Correct for Campylobacter ieiuni?", "opts": ["Motile curved rod, halophilic, catalase negative.", "Nonmotile curved rod grows at 43°C, catalase negative.", "Motile curved rod best grows at 43°C, catalase positive.", "Motile curved rod cannot grow at 43°C, capnophilic."], "key": 2, "exp": "كتاب النظري: Motile (darting) curved/S-shaped Gram-negative rods, oxidase and catalase positive, growing best at 42-43 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 82 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 82}, {"n": 764, "stem": "Helicobacters are similar to campylobacters in the following, EXCEPT:", "opts": ["They are curved Gram-negative bacilli.", "They are microaerophilic.", "They can grow at 42°C.", "They are oxidase positive.", "They are able to grow on Skirrow’s medium."], "key": 2, "exp": "كتاب النظري: H. pylori is incubated at 37 C, unlike C. jejuni which grows at 42 C", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 84 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 84}, {"n": 765, "stem": "A patient with a peptic ulcer was admitted to the hospital and a gastric biopsy was performed. Cultures at 37°C grew urease-positive curved bacteria. The most likely causative agent is:", "opts": ["Campylobacter jejuni.", "Vibrio parahaemolyticus.", "Hemophilus influenza.", "Shigella dysenteriae.", "Helicobacter pylori."], "key": 4, "exp": "كتاب النظري: H. pylori: gastric biopsy, microaerophilic at 37 C, strong urease producer", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 84 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 84}, {"n": 766, "stem": "What temperature can Helicobacter pylori grow at?", "opts": ["37°C.", "42°C.", "25°C.", "55°C. 84"], "key": 0, "exp": "كتاب النظري: H. pylori requires incubation at 37 C for 3-6 days", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 84 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 84}, {"n": 767, "stem": "Which feature is unique to Helicobacter pylori compared to Campylobacter?", "opts": ["Ability to grow at 42°C.", "Multiple polar flagella.", "Oxidase-negative.", "Non-microaerophilic."], "key": 1, "exp": "كتاب النظري: H. pylori has multiple sheathed monopolar flagellae while campylobacter has a single unsheathed flagellum", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 84 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 84}, {"n": 768, "stem": "Which of the following is NOT a method for diagnosing H. pylori?", "opts": ["Urea breath test.", "ELISA for stool antigen.", "Blood culture.", "Serology for IgG antibodies."], "key": 2, "exp": "كتاب النظري: H. pylori diagnosis: urea breath test, stool antigen ELISA, serology, biopsy tests - not blood culture", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 85 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 85}, {"n": 769, "stem": "How is H. pylori transmitted?", "opts": ["Through contaminated water.", "Feco-oral or oral-oral routes.", "Through contaminated food.", "Via insect bites."], "key": 1, "exp": "كتاب النظري: Transmission is thought to be person to person (faeco-oral or oral-oral)", "src": "كتاب النظري Infection & in.", "Vacuolating cytotoxin (VacA).", "Endotoxin."], "key": 2, "exp": "كتاب النظري: Mucosal damage occurs due to ammonia, vacuolating cytotoxin (VacA) and inflammation", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 85 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 85}, {"n": 775, "stem": "What is a common feature of Helicobacter species in terms of their oxygen requirements?", "opts": ["They are aerobic.", "They are anaerobic.", "They are microaerophilic.", "They are facultatively anaerobic."], "key": 2, "exp": "كتاب النظري: H. pylori requires microaerophilic conditions", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 84 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 84}, {"n": 777, "stem": "What is the role of urease in the pathogenesis of H. pylori?", "opts": ["It helps in bacterial adhesion.", "It produces ammonia to survive in acidic conditions.", "It degrades mucin.", "It stimulates immune response."], "key": 1, "exp": "كتاب النظري: Urease cleaves urea producing an ammonium cloud that permits survival in acid", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 84 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 84}, {"n": 779, "stem": "Which of the following is an important distinguishing characteristic of H. pylori as compared to Campylobacter species?", "opts": ["Oxidase production.", "Catalase production.", "Urease production.", "Single polar flagellum."], "key": 2, "exp": "كتاب النظري: H. pylori is oxidase positive and a STRONG urease producer, distinguishing it from campylobacter", "src": "كتاب النظري Infection & Immunity Theoretical - صفحة 86 (الإجابة من عندنا مش من الملف)", "sk": 1, "pg": 86}, {"n": 780, "stem": "Organism is observed on the surface of gastric epithelium in patients with acute gastritis. It has a tuft of unipolar flagella. It is microaerophilic. It appears as gram negative curved rods in gram's stain. It is:", "opts": ["Campylobacter jejuni.", "Helicobacter pylori.", "Escherichia coli.", "Vibrio cho function home(){app.innerHTML=`<div class="card"><h2>${PAGE.title}</h2>
<p>${PAGE.intro}</p>
<p>${Q.length} questions${U.length?` + <b>${U.length} unverified</b> (listed at the bottom, not in the quiz)`:''}. Tap an answer in practice mode for instant feedback. Questions answered from the theory book are marked <span class="sk">الإجابة من عندنا مش من الملف</span> with the book page; the rest come from the file's printed key.</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,40),'practice')">Practice: 40 random</button>
<p><b>Exam mode:</b> answers only at the end, with score, review and "Retry missed only".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
${U.length?`<p style="margin-top:8px"><button class="btn g" onclick="unv()">Unverified questions (مش متأكدين منها): ${U.length}</button></p>`:''}
<p style="margin-top:8px"><button class="btn g" onclick="guide()">Topic & page table (جدول المراجعة)</button></p>
<p style="margin-top:6px"><a href="index-weeks.html">Back to the all-weeks index</a></p>
</div>`}
function unv(){app.innerHTML=`<div class="card"><h2>Unverified (مش متأكدين منها)</h2><p>These questions are NOT in the theory book, so we did not invent answers for them. Check them with your doctor or lecture notes.</p></div>`+U.map(q=>`<div class="card uv"><b>${q.stem}</b>${q.opts.map((o,k)=>`<div>${L[k]}) ${o}</div>`).join('')}<div class="src">Why unverified: ${q.reason}</div></div>`).join('')+`<div class="card"><button class="btn g" onclick="home()">Back</button></div>`}
function guide(){location.hash='#review';app.innerHTML=`<div class="card"><button class="btn g" onclick="home()">Back to menu</button><button class="btn" onclick="start(Q,'practice')">Start practice: all ${Q.length}</button></div>`+document.getElementById('cgSrc').innerHTML;window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function badge(q){return q.sk?`<div class="sk">الإجابة من عندنا مش من الملف (كتاب النظري ص ${q.pg})</div>`:''}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${badge(q)}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
