const Q=[{"n": 1, "img": null, "kind": "mcq", "stem": "Regarding Mycoplasma, all of the following are direct consequences of lacking a cell wall EXCEPT:", "opts": ["Pleomorphism (variable shape)", "Unstainable by the Gram stain", "Resistance to beta-lactam antibiotics", "Obligate intracellular growth inside host cells"], "key": 3, "exp": "Trigger: lack of cell wall renders them \"Resistant to antibiotics which inhibit cell wall synthesis... Unstainable by the Gram stain... Variable in shape (pleomorphic)\". Intracellular growth is Chlamydia/Rickettsia, not Mycoplasma.", "src": "printed 113"}, {"n": 2, "img": null, "kind": "mcq", "stem": "The only bacteria that contain sterol (cholesterol) in their cell membrane are:", "opts": ["Rickettsiae", "Mycoplasmas", "Spirochetes", "Chlamydiae"], "key": 1, "exp": "Trigger: \"They are the only bacteria that contain sterol (in the form of cholesterol) in the cell membrane.\"", "src": "printed 113"}, {"n": 3, "img": null, "kind": "mcq", "stem": "Mycoplasmas are described as the smallest bacteria that can be grown on:", "opts": ["Yolk sac of embryonated eggs", "Tissue culture only", "Cell-free media", "Cell-free media enriched with bile salts"], "key": 2, "exp": "Trigger: \"They are the smallest bacteria that can be grown on cell-free media.\"", "src": "printed 113"}, {"n": 4, "img": null, "kind": "mcq", "stem": "A laboratory inoculates sputum on serum-enriched medium containing cholesterol. After several days, minute colonies appear that can only be visualized microscopically. The expected colony morphology is:", "opts": ["Rose-pink lactose-fermenting colonies", "Fried-egg appearance", "Green diffusible pigment colonies", "Swarming concentric waves"], "key": 1, "exp": "Trigger: \"serum-enriched medium containing cholesterol. After several days... minute colonies which have a characteristic 'fried-egg' appearance that can only be visualized microscopically.\"", "src": "printed 113"}, {"n": 5, "img": "myco-friedegg-plate", "kind": "mcq", "stem": "Which organism gives the colony appearance shown in this figure?", "opts": ["Chlamydia trachomatis", "Rickettsia", "Mycoplasma", "Pseudomonas aeruginosa"], "key": 2, "exp": "Trigger: Fig 1.79 \"Fried-egg appearance\" of Mycoplasma colonies.", "src": "printed 113"}, {"n": 6, "img": "myco-friedegg-micro", "kind": "mcq", "stem": "This microscopic colony appearance is characteristic of an organism that is also:", "opts": ["Best stained by Gram stain", "An obligate intracellular energy parasite", "A spore-forming aerobe", "Resistant to beta-lactams because it has no cell wall"], "key": 3, "exp": "Trigger: \"fried-egg appearance\" + \"bacteria without cell wall... Resistant to antibiotics which inhibit cell wall synthesis (e.g., beta-lactam antibiotics).\"", "src": "printed 113"}, {"n": 7, "img": null, "kind": "mcq", "stem": "Mycoplasma pneumoniae is responsible for what share of pneumonia cases, and by which route is it transmitted?", "opts": ["20% of pneumonia cases; arthropod bite", "50% of pneumonia cases; faeco-oral route", "20% of pneumonia cases; inhalation of respiratory droplets", "5% of pneumonia cases; sexual contact"], "key": 2, "exp": "Trigger: \"Atypical pneumonia (20% of pneumonia cases)... Inhalation of respiratory droplets.\"", "src": "printed 114"}, {"n": 8, "img": null, "kind": "mcq", "stem": "All of the following are caused by Mycoplasma pneumoniae EXCEPT:", "opts": ["Otitis media", "Pharyngitis", "Nongonococcal urethritis", "Atypical pneumonia"], "key": 2, "exp": "Trigger: M. pneumoniae causes \"Atypical pneumonia... Pharyngitis, bronchitis & otitis media\"; NGU belongs to genital mycoplasmas (M. hominis, M. genitalium, Ureaplasma urealyticum).", "src": "printed 114"}, {"n": 9, "img": null, "kind": "mcq", "stem": "A sexually active patient has nongonococcal urethritis; his partner later develops pelvic inflammatory disease. The implicated group of organisms includes all of the following EXCEPT:", "opts": ["Mycoplasma genitalium", "Mycoplasma hominis", "Ureaplasma urealyticum", "Mycoplasma pneumoniae"], "key": 3, "exp": "Trigger: Table 1.14 genital mycoplasmas = \"1. M. hominis 2. M. genitalium 3. Ureaplasma urealyticum\" causing NGU, PID, post-abortal or postpartum fever.", "src": "printed 114"}, {"n": 10, "img": null, "kind": "mcq", "stem": "Post-abortal or postpartum fever is listed in the book as a disease of:", "opts": ["Mycoplasma pneumoniae", "Chlamydophila psittaci", "Genital mycoplasmas", "Coxiella burnetii"], "key": 2, "exp": "Trigger: Table 1.14, genital mycoplasmas: \"3. Post-abortal or postpartum fever\", transmission sexual.", "src": "printed 114"}, {"n": 11, "img": null, "kind": "mcq", "stem": "The best specimen for laboratory diagnosis of Mycoplasma atypical pneumonia is:", "opts": ["Skin biopsy from the rash", "Sputum or nasopharyngeal aspirate", "Stool", "Urethral swab"], "key": 1, "exp": "Trigger: \"Specimens: Sputum or nasopharyngeal aspirate in case of atypical pneumonia.\"", "src": "printed 114"}, {"n": 12, "img": null, "kind": "mcq", "stem": "Regarding laboratory diagnosis of Mycoplasma, all of the following are true EXCEPT:", "opts": ["Antigens can be detected by immunofluorescence using specific antisera", "Culture is difficult and requires prolonged incubation", "Direct microscopic detection on a smear is the most valuable step", "Nucleic acid can be detected by DNA probes or PCR"], "key": 2, "exp": "Trigger: \"Direct microscopical detection (smear): is of limited value. Culture: is difficult and requires prolonged incubation.\"", "src": "printed 114"}, {"n": 13, "img": null, "kind": "mcq", "stem": "Diagnosis of Mycoplasma infection is based on serology. Which finding is diagnostic by the specific test?", "opts": ["Detection of IgM or a fourfold rise in IgG antibody titer by ELISA", "A single high anti-H titer", "A positive Frei skin test", "Detection of cold agglutinins at 37C"], "key": 0, "exp": "Trigger: \"Specific tests: Detection of IgM or a fourfold rise in IgG antibody titer by ELISA is diagnostic.\"", "src": "printed 114"}, {"n": 14, "img": null, "kind": "mcq", "stem": "Cold agglutinins in Mycoplasma pneumoniae infection are best described as:", "opts": ["IgG antibodies that agglutinate red cells at 37C but not at 4C", "Complement-fixing antibodies diagnostic of chronic carriage", "IgM antibodies that agglutinate red cells at 4C but not at 37C", "IgM antibodies specific for Mycoplasma membrane sterol"], "key": 2, "exp": "Trigger: \"cold agglutinins, which are IgM antibodies that agglutinate red cells at 4C but not at 37C.\"", "src": "printed 114"}, {"n": 15, "img": null, "kind": "mcq", "stem": "A cold agglutinin titer considered indicative of recent Mycoplasma infection is:", "opts": ["1:32", "1:128", "1:8", "1:16"], "key": 1, "exp": "Trigger: \"A titer of 1:128 of cold agglutinins is indicative of recent infection.\"", "src": "printed 114"}, {"n": 16, "img": null, "kind": "mcq", "stem": "A student isolates a wall-less pleomorphic bacterium and finds it grows only on serum-enriched medium with cholesterol. The drugs of choice for all mycoplasmas are:", "opts": ["Ceftriaxone and gentamycin", "Erythromycin and tetracycline", "Metronidazole and tinidazole", "Penicillin and ampicillin"], "key": 1, "exp": "Trigger: \"Erythromycin and tetracycline are the drugs of choice for all mycoplasmas.\" Double clue: wall-less + cholesterol-requiring.", "src": "printed 114"}, {"n": 17, "img": null, "kind": "mcq", "stem": "A young adult has 3 weeks of dry cough, normal chest exam, and a chest X-ray worse than his symptoms. Cold agglutinins are positive at 1:256. The most likely organism is resistant to beta-lactams because it:", "opts": ["Lacks a typical peptidoglycan layer", "Produces a beta-lactamase", "Has an endospore-like form", "Lacks a cell wall"], "key": 3, "exp": "Trigger: atypical pneumonia + cold agglutinins = M. pneumoniae; \"bacteria without cell wall... Resistant to antibiotics which inhibit cell wall synthesis (e.g., beta-lactam antibiotics).\"", "src": "printed 113"}, {"n": 18, "img": null, "kind": "mcq", "stem": "Chlamydiae can grow only inside host cells because they:", "opts": ["Lack a cell membrane", "Are unable to replicate their own DNA", "Lack the ability to produce sufficient energy to grow independently", "Have no ribosomes"], "key": 2, "exp": "Trigger: \"They lack the ability to produce sufficient energy to grow independently and, therefore, can grow only inside host cells.\"", "src": "printed 115"}, {"n": 19, "img": null, "kind": "mcq", "stem": "In the diagnostic laboratory, Chlamydia is cultivated on:", "opts": ["Tissue culture", "Cell-free nutrient agar", "MacConkey agar", "Serum-enriched cholesterol medium"], "key": 0, "exp": "Trigger: \"In the laboratory, they can be grown on tissue culture.\"", "src": "printed 115"}, {"n": 20, "img": null, "kind": "mcq", "stem": "The Chlamydia cell wall resembles that of Gram-negative bacteria but:", "opts": ["Contains endospore-like structures", "Lacks the typical peptidoglycan layer", "Is surrounded by a thick capsule", "Contains cholesterol"], "key": 1, "exp": "Trigger: \"Their cell wall structure resembles that of Gram-negative bacteria but lacks typical peptidoglycan layer.\"", "src": "printed 115"}, {"n": 21, "img": null, "kind": "mcq", "stem": "Which stain is used to visualize Chlamydia, since Gram stain is not useful?", "opts": ["Giemsa stain", "Lactophenol cotton blue", "Albert stain", "Ziehl-Neelsen stain"], "key": 0, "exp": "Trigger: \"Gram stain is not useful, the organism can readily be stained by Giemsa stain.\"", "src": "printed 115"}, {"n": 22, "img": null, "kind": "mcq", "stem": "In the biphasic life cycle of Chlamydia, the infectious form is the:", "opts": ["Elementary body", "Inclusion body", "Reticulate body", "Promastigote"], "key": 0, "exp": "Trigger: \"Elementary bodies (EBs): small, extracellular, metabolically inert particles. They represent the infectious form.\"", "src": "printed 115"}, {"n": 23, "img": null, "kind": "mcq", "stem": "The replicating form of Chlamydia is best described as:", "opts": ["Extracellular fusiform form with free flagellum", "Endospore-like particle resisting drying", "Small, extracellular, metabolically inert elementary body", "Larger, intracellular, metabolically active reticulate body"], "key": 3, "exp": "Trigger: \"Reticulate bodies (RBs): larger, intracellular, metabolically active particles. They represent the replicating form.\"", "src": "printed 115"}, {"n": 24, "img": null, "kind": "mcq", "stem": "The site of Chlamydia replication inside the host cell appears microscopically as:", "opts": ["A spherule with endospores", "A Negri body", "A fried-egg colony", "An intra-cytoplasmic inclusion body"], "key": 3, "exp": "Trigger: \"The site of replication appears as an intra-cytoplasmic inclusion body, which can be stained and visualized microscopically.\"", "src": "printed 115"}, {"n": 25, "img": null, "kind": "mcq", "stem": "Although chlamydiae resemble viruses in being small obligate intracellular organisms, they are classified as:", "opts": ["Viruses", "Bacteria", "Protozoa", "Fungi"], "key": 1, "exp": "Trigger: \"Although chlamydia are similar to viruses in being small obligate intracellular organisms, they are considered bacteria.\"", "src": "printed 115"}, {"n": 26, "img": "chlamydia-cycle", "kind": "mcq", "stem": "In the figure of the Chlamydia life cycle, the small extracellular metabolically inert particle labeled EB is:", "opts": ["The infectious elementary body", "The diagnostic inclusion body", "The infective promastigote", "The replicating reticulate body"], "key": 0, "exp": "Trigger: Fig 1.80 life cycle; \"EBs... represent the infectious form.\"", "src": "printed 115"}, {"n": 27, "img": null, "kind": "mcq", "stem": "The three chlamydiae that infect humans are:", "opts": ["C. psittaci, Mycoplasma hominis, Ureaplasma", "C. trachomatis, C. muridarum, C. suis", "C. trachomatis, Chlamydophila pneumoniae, Chlamydophila psittaci", "C. trachomatis, C. pneumoniae, Coxiella burnetii"], "key": 2, "exp": "Trigger: \"Chlamydiae that infect humans are divided into three species: 1. Chlamydia trachomatis 2. Chlamydophila pneumoniae. 3. Chlamydophila psittaci.\"", "src": "printed 115"}, {"n": 28, "img": null, "kind": "mcq", "stem": "Nongonococcal urethritis due to Chlamydia trachomatis is caused by serotypes:", "opts": ["L1, L2, L3", "D-K", "A, B, C", "B, D, E"], "key": 1, "exp": "Trigger: \"Nongonococcal urethritis: It is caused by serotypes D-K.\"", "src": "printed 116"}, {"n": 29, "img": null, "kind": "mcq", "stem": "A male with untreated chlamydial urethritis may progress to all of the following EXCEPT:", "opts": ["Prostatitis", "Proctitis", "Endocarditis", "Epididymitis"], "key": 2, "exp": "Trigger: \"Males present with urethritis, which may progress to epididymitis, prostatitis or proctitis.\"", "src": "printed 116"}, {"n": 30, "img": null, "kind": "mcq", "stem": "In females, chlamydial cervicitis may be complicated by:", "opts": ["Trachoma and blindness", "Infertility or ectopic pregnancy", "Atherosclerosis", "Q fever endocarditis"], "key": 1, "exp": "Trigger: \"Females may present with urethritis and/or cervicitis, which may progress to salpingitis and pelvic inflammatory disease (PID). The condition may be complicated by infertility or ectopic pregnancy.\"", "src": "printed 116"}, {"n": 31, "img": null, "kind": "mcq", "stem": "A patient develops an initial genital papule followed by suppurative inguinal lymphadenopathy after a new sexual contact. The causative serotypes are:", "opts": ["B or C only", "D-K", "L1, L2 or L3", "A, B or C"], "key": 2, "exp": "Trigger: \"Lymphogranuloma venereum (LGV): caused by serotypes L1, L2 or L3... initial genital papule accompanied by suppurative inguinal lymphadenopathy.\"", "src": "printed 116"}, {"n": 32, "img": null, "kind": "mcq", "stem": "Trachoma is transmitted mainly by:", "opts": ["Inhalation of dried bird faeces", "Sexual contact only", "Contaminated swimming pools", "Eye-to-eye transfer by fingers, fomites and flies, mostly in hot dry climates"], "key": 3, "exp": "Trigger: \"Transmission occurs from eye to eye by fingers, fomites and flies mostly during hot and dry climates.\"", "src": "printed 116"}, {"n": 33, "img": null, "kind": "mcq", "stem": "Chronic keratoconjunctivitis with scarring that may lead to blindness is caused by C. trachomatis serotypes:", "opts": ["A, B or C", "D-K", "D only", "L1-L3"], "key": 0, "exp": "Trigger: \"Trachoma: caused by serotypes A, B or C... manifests as chronic keratoconjunctivitis with scarring which may lead to blindness.\"", "src": "printed 116"}, {"n": 34, "img": null, "kind": "mcq", "stem": "The most common cause of neonatal conjunctivitis is:", "opts": ["C. trachomatis serotypes D-K (inclusion conjunctivitis)", "Neisseria gonorrhoeae", "Chlamydophila psittaci", "C. trachomatis serotypes A-C (trachoma)"], "key": 0, "exp": "Trigger: \"Inclusion conjunctivitis: caused by serotypes D-K. It is the most common cause of neonatal conjunctivitis.\"", "src": "printed 116"}, {"n": 35, "img": null, "kind": "mcq", "stem": "A 10-day-old develops conjunctivitis; the mother had untreated genital infection. In adults, the same infection is acquired by:", "opts": ["Transfer of organisms from the genitals to the eye (autoinfection) or through vehicles such as swimming pools", "Inhalation of respiratory droplets", "Arthropod bite", "Drinking unpasteurized milk"], "key": 0, "exp": "Trigger: neonates \"during passage through an infected birth canal\"; adults \"transfer of organisms from the genitals to the eye (as an autoinfection) or through a vehicle (e.g., swimming pools).\"", "src": "printed 116"}, {"n": 36, "img": null, "kind": "mcq", "stem": "Neonatal pneumonia caused by C. trachomatis is acquired:", "opts": ["By inhalation of dried bird faeces", "By eye-to-eye transfer by flies", "By arthropod vectors", "During passage through an infected birth canal, by serotypes D-K"], "key": 3, "exp": "Trigger: \"Neonatal pneumonia: caused by serotypes D-K. Infection occurs during passage through an infected birth canal.\"", "src": "printed 117"}, {"n": 37, "img": null, "kind": "mcq", "stem": "Specimens for chlamydial laboratory diagnosis are taken from:", "opts": ["Bone marrow", "Blood in all cases", "Stool", "Urethra, cervix, or conjunctiva according to site of infection"], "key": 3, "exp": "Trigger: \"Specimens are taken from urethra, cervix, or conjunctiva according to site of infection.\"", "src": "printed 117"}, {"n": 38, "img": null, "kind": "mcq", "stem": "On a Giemsa-stained conjunctival smear, the diagnostic finding in chlamydial infection is:", "opts": ["Amastigotes inside macrophages", "Gram-negative intracellular diplococci", "Fried-egg microcolonies", "Intracytoplasmic basophilic inclusion bodies"], "key": 3, "exp": "Trigger: \"Microscopic examination of Giemsa-stained smears for detection of the intracytoplasmic basophilic inclusion bodies.\"", "src": "printed 117"}, {"n": 39, "img": null, "kind": "mcq", "stem": "Serological tests in chlamydial infections are helpful only in:", "opts": ["Neonatal pneumonia", "Trachoma", "Inclusion conjunctivitis", "Lymphogranuloma venereum (LGV)"], "key": 3, "exp": "Trigger: \"Serological tests are not helpful except in lymphogranuloma venereum (LGV) infection.\"", "src": "printed 117"}, {"n": 40, "img": null, "kind": "mcq", "stem": "The Frei skin test, which resembles the tuberculin test, is rarely used for diagnosis of:", "opts": ["LGV infection", "Psittacosis", "Q fever", "Trachoma"], "key": 0, "exp": "Trigger: \"Frei skin test: It is like tuberculin test. It is rarely used for diagnosis of LGV infection.\"", "src": "printed 117"}, {"n": 41, "img": null, "kind": "mcq", "stem": "Why is erythromycin preferred over tetracycline for neonates and pregnant women with chlamydial infection?", "opts": ["Because tetracycline cannot enter host cells", "Because erythromycin kills the spore form", "Because of the effect of tetracycline on teeth and bones", "Because tetracycline is inactive against all chlamydiae"], "key": 2, "exp": "Trigger: \"Erythromycin is recommended for neonates and pregnant women because of the effect of tetracycline on teeth and bones.\"", "src": "printed 117"}, {"n": 42, "img": null, "kind": "mcq", "stem": "Chlamydiae are not sensitive to beta-lactam antibiotics because they:", "opts": ["Lack a cell wall entirely", "Are strict anaerobes", "Contain sterol in their membrane", "Lack a typical peptidoglycan layer"], "key": 3, "exp": "Trigger: \"Chlamydiae are not sensitive to B-lactam antibiotics due to lack of typical peptidoglycan layer.\" Double clue: obligate intracellular + no typical peptidoglycan.", "src": "printed 117"}, {"n": 43, "img": null, "kind": "mcq", "stem": "Chlamydophila pneumoniae is transmitted from person to person by aerosols and causes:", "opts": ["Q fever", "Atypical pneumonia", "Bacillary dysentery", "Lymphogranuloma venereum"], "key": 1, "exp": "Trigger: \"Chlamydophila pneumoniae - transmitted from person to person by aerosols. It causes atypical pneumonia.\" (Table 1.15 also links it to atherosclerosis and asthma.)", "src": "printed 117"}, {"n": 44, "img": null, "kind": "mcq", "stem": "A pet-shop worker develops atypical pneumonia. The causative organism is acquired by inhalation of particles from dried bird faeces or respiratory secretions. The disease is:", "opts": ["Trichomoniasis", "Q fever caused by Coxiella burnetii", "Trachoma", "Psittacosis, a zoonotic atypical pneumonia caused by Chlamydophila psittaci"], "key": 3, "exp": "Trigger: \"C. psittaci is transmitted via inhalation of the organism in dried bird faeces or respiratory secretions; therefore, people handling birds regularly are particularly at risk. It causes psittacosis (zoonotic disease).\"", "src": "printed 118"}, {"n": 45, "img": null, "kind": "mcq", "stem": "Rickettsiae are described morphologically as:", "opts": ["Curved oxidase-positive bacilli", "Large spiral motile bacteria", "Small, pleomorphic, Gram-negative bacilli or coccobacilli", "Wall-less pleomorphic cocci"], "key": 2, "exp": "Trigger: \"Small, pleomorphic, Gram-negative bacilli or coccobacilli.\"", "src": "printed 119"}, {"n": 46, "img": null, "kind": "mcq", "stem": "Rickettsiae rely on the host cell for energy (ATP) and are therefore:", "opts": ["Obligate intracellular parasites", "Free-living saprophytes", "Facultative anaerobes", "Able to grow on cell-free media"], "key": 0, "exp": "Trigger: \"Obligate intracellular parasites; rely on the host cell for energy (ATP).\"", "src": "printed 119"}, {"n": 47, "img": null, "kind": "mcq", "stem": "Rickettsiae can be grown in the laboratory in all of the following EXCEPT:", "opts": ["Tissue culture", "Cell-free artificial nutrient media", "Experimental animals", "Yolk sac of embryonated eggs"], "key": 1, "exp": "Trigger: \"Cannot grow on cell-free artificial nutrient media but can grow in (yolk sac of embryonated eggs, tissue culture, or experimental animals).\"", "src": "printed 119"}, {"n": 48, "img": null, "kind": "mcq", "stem": "All of the following arthropods transmit Rickettsiae EXCEPT:", "opts": ["Fleas", "Lice and mites", "Ticks", "Sand flies"], "key": 3, "exp": "Trigger: \"Transmitted via arthropod vectors (ticks, fleas, lice, mites)\". Sand fly transmits Leishmania.", "src": "printed 119"}, {"n": 49, "img": null, "kind": "mcq", "stem": "Besides the bite itself, rickettsial infection can occur when the skin wound is contaminated by:", "opts": ["Sexual contact", "Drinking contaminated milk only", "Scratching the skin or crushing the arthropod at the bite site", "Inhaling respiratory droplets"], "key": 2, "exp": "Trigger: \"through bites or contamination of skin wound by organism during scratching the skin or crushing the arthropod at bite site.\"", "src": "printed 119"}, {"n": 50, "img": null, "kind": "mcq", "stem": "The target cells in which Rickettsiae proliferate are:", "opts": ["Alveolar macrophages only", "Intramural autonomic neurons", "Vascular endothelial cells of small blood vessels", "Reticuloendothelial cells of the skin"], "key": 2, "exp": "Trigger: \"Target Cells: Proliferates within vascular endothelial cells of small blood vessels.\"", "src": "printed 119"}, {"n": 51, "img": null, "kind": "mcq", "stem": "The petechial/purpuric skin rash, end-organ ischemia and DIC in rickettsial disease result from:", "opts": ["Endothelial cell necrosis causing widespread microvascular vasculitis and thrombosis", "Urease-induced ammonia toxicity", "Exotoxin A-mediated tissue necrosis", "Hypersensitivity to remnant antigens"], "key": 0, "exp": "Trigger: \"Intracellular multiplication -> endothelial cell necrosis -> widespread microvascular vasculitis and thrombosis -> petechial/purpuric skin rash, end-organ ischemia, and DIC.\"", "src": "printed 119"}, {"n": 52, "img": null, "kind": "mcq", "stem": "The classic clinical triad of rickettsial infection is:", "opts": ["Fever, dysentery, and tenesmus", "Fever, jaundice, and conjunctivitis", "High persistent fever, severe headache, and characteristic skin rash", "Fever, unilateral periorbital edema, and lymphadenitis"], "key": 2, "exp": "Trigger: \"Classic Clinical Triad: High persistent fever, severe headache, and characteristic skin rash.\"", "src": "printed 119"}, {"n": 53, "img": null, "kind": "mcq", "stem": "Severe rickettsial cases may show all of the following EXCEPT:", "opts": ["Non-cardiogenic pulmonary edema", "Multi-organ failure", "Rose spots on the abdomen", "Encephalitis and delirium"], "key": 2, "exp": "Trigger: \"Severe Cases: Encephalitis, delirium, non-cardiogenic pulmonary edema, and multi-organ failure.\" Rose spots belong to typhoid fever.", "src": "printed 119"}, {"n": 54, "img": null, "kind": "mcq", "stem": "Laboratory diagnosis of rickettsiosis is best confirmed by:", "opts": ["Stool culture on MacConkey", "Frei skin test", "PCR to detect rickettsial DNA in blood or skin-rash biopsy, plus serology for anti-rickettsial antibodies", "Cold agglutinin titer"], "key": 2, "exp": "Trigger: \"1. PCR: to detect rickettsial DNA in blood or biopsy specimens (e.g., from skin rash). 2. Serological test...\"", "src": "printed 119"}, {"n": 55, "img": null, "kind": "mcq", "stem": "The drug of choice for rickettsial infections is:", "opts": ["Pentamidine", "Erythromycin", "Melarsoprol", "Tetracycline, for all age groups"], "key": 3, "exp": "Trigger: \"Drug of Choice: Tetracycline for all age groups.\"", "src": "printed 120"}, {"n": 56, "img": null, "kind": "mcq", "stem": "Prevention of rickettsioses depends on:", "opts": ["Avoiding swimming pools", "Vector control, personal hygiene, insect repellents, and delousing campaigns", "Pasteurization of milk", "Chlorination of water"], "key": 1, "exp": "Trigger: \"Prevention: Vector control, personal hygiene, application of insect repellents, and delousing campaigns.\"", "src": "printed 120"}, {"n": 57, "img": null, "kind": "mcq", "stem": "Coxiella burnetii differs from other rickettsiae in that it:", "opts": ["Has an endospore-like form and is transmitted without an arthropod bite", "Causes dysentery", "Is a strict extracellular pathogen", "Has no reservoir in animals"], "key": 0, "exp": "Trigger: \"1-It has endospore-like structure form... 3- Non-arthropod transmission: The spores remain viable in dried tick faeces. These spores are aerosolized and when inhaled causes human disease.\"", "src": "printed 120"}, {"n": 58, "img": null, "kind": "mcq", "stem": "Because Coxiella spores may contaminate milk products, pasteurization temperature should be:", "opts": ["Exactly 45C for 30 minutes", "Unchanged, since the organism is heat-sensitive", "Raised to greater than 60C", "Kept below 40C"], "key": 2, "exp": "Trigger: \"Resistant to heat, disinfectant, UV and drying: spores may contaminate milk products so pasteurization temperature should be raised to greater than 60C.\"", "src": "printed 120"}, {"n": 59, "img": null, "kind": "mcq", "stem": "Q fever is acquired by all of the following routes EXCEPT:", "opts": ["Bite of an infected tick", "Handling of infected animals or their discharge", "Ingestion of milk from infected animals", "Inhalation of contaminated dust or aerosols during animal handling"], "key": 0, "exp": "Trigger: Q fever modes = inhalation, handling, milk ingestion; zoonotic (cattle, sheep, goats). Non-arthropod transmission is the key feature.", "src": "printed 120"}, {"n": 60, "img": null, "kind": "mcq", "stem": "A shepherd presents with influenza-like illness, atypical pneumonia with hepatitis, but NO skin rash. The most likely diagnosis is:", "opts": ["Typhoid fever", "Acute Q fever", "Psittacosis", "Rickettsial spotted fever"], "key": 1, "exp": "Trigger: \"Acute Q fever: influenza-like symptoms and/or atypical pneumonia with hepatitis and no rash.\" Double clue: animal exposure + no rash.", "src": "printed 120"}, {"n": 61, "img": null, "kind": "mcq", "stem": "Chronic Q fever presents as:", "opts": ["Chronic keratoconjunctivitis", "Megacolon", "Subacute infective endocarditis", "Sleeping sickness"], "key": 2, "exp": "Trigger: \"Chronic Q fever: presented by subacute infective endocarditis.\"", "src": "printed 120"}, {"n": 62, "img": null, "kind": "mcq", "stem": "The drug of choice for Q fever is:", "opts": ["Pentostam", "Doxycycline", "Metronidazole", "Ciprofloxacin"], "key": 1, "exp": "Trigger: \"Treatment: doxycycline is the drug of choice.\"", "src": "printed 120"}, {"n": 63, "img": null, "kind": "mcq", "stem": "The formalin-killed Coxiella vaccine is recommended for:", "opts": ["Food handlers", "All neonates", "Swimmers", "High-risk groups: veterinarians, shepherds, abattoir workers and laboratory personnel"], "key": 3, "exp": "Trigger: \"Formalin-killed Coxiella vaccine: to high risk groups (veterinarians, shepherds, abattoir workers and laboratory personnel).\"", "src": "printed 120"}, {"n": 64, "img": null, "kind": "mcq", "stem": "Which pair of organisms shares obligate intracellular parasitism AND poor/absent Gram staining, with Giemsa as the useful stain?", "opts": ["Mycoplasma and Pseudomonas", "Chlamydia and Rickettsia", "Coxiella and Shigella", "Rickettsia and Salmonella"], "key": 1, "exp": "Trigger: Chlamydia: \"Gram stain is not useful... stained by Giemsa\"; Rickettsia: \"Stains poorly with conventional Gram stain; best visualized using Giemsa stain.\" Both are obligate intracellular.", "src": "printed 115"}, {"n": 65, "img": null, "kind": "mcq", "stem": "A wall-less organism from a urethral swab is MOST likely, while an obligate intracellular organism from the same site with basophilic inclusions on Giemsa is MOST likely, respectively:", "opts": ["Chlamydia trachomatis D-K, then Mycoplasma hominis", "Mycoplasma hominis, then Chlamydia trachomatis D-K", "Rickettsia, then Coxiella", "Ureaplasma, then Rickettsia"], "key": 1, "exp": "Trigger: wall-less = Mycoplasma (genital mycoplasmas cause NGU); inclusions on Giemsa = Chlamydia (Table 1.14/1.15).", "src": "printed 114"}]
const app=document.getElementById('app');

let order=[],i=0,mode='exam',ans={},submitted=false;
const L='ABCD';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}

<button class="btn g" onclick="start(shuffle(Q).slice(0,50),'practice')">Practice: 50 random</button>

<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
<p><a href="4-cue-guide-mycoplasma-chlamydia-rickettsia.html">Open the cue-guide tables for this lecture</a></p>
</div>`}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${q.img?`<img class="fig" src="${IMG[q.img]}" alt="book figure" onerror="this.outerHTML='<p>(image did not load)</p>'">`:''}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">Book: ${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 window.__r=wrong;
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv">${q.img?`<img class="fig" style="max-height:200px" src="${IMG[q.img]}">`:''}<b>${k+1}. ${q.stem}</b>

 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">Book: ${q.src}</div></div></div>`}).join('')}
