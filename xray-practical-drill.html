function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let Q,i,score,missed,done;
function start(list){Q=(list||sh(K.concat(K))).map(t=>({t,opts:sh([t].concat(sh(K.filter(k=>k!==t)).slice(0,3)))}));i=0;score=0;missed=[];show()}
function show(){const q=Q[i],A=document.getElementById('app');done=false;
A.innerHTML='<div class="bar"><span>سؤال '+(i+1)+' / '+Q.length+'</span><span>النتيجة: '+score+'</span></div><div class="q">'+D[q.t].name+'</div><div class="g">'+q.opts.map(k=>'<button class="c" data-k="'+k+'"><img src="'+D[k].src+'"></button>').join('')+'</div><div class="n" id="n">دوس على الصورة اللي بتمثل التشخيص ده</div><div id="nx"></div>';
A.querySelectorAll('.c').forEach(b=>b.onclick=()=>pick(b))}
function pick(b){if(done)return;done=true;const q=Q[i],k=b.dataset.k,ok=k===q.t;if(ok)score++;else missed.push(q.t);
document.querySelectorAll('.c').forEach(c=>{const kk=c.dataset.k;c.classList.add(kk===q.t?'ok':(c===b?'no':'dim'));c.insertAdjacentHTML('beforeend','<div class="t">'+D[kk].name+'</div>')});
document.getElementById('n').innerHTML=(ok?'✅ صح. ':'❌ غلط. ')+'<b dir="ltr">'+D[q.t].name+'</b>: '+D[q.t].note;
document.getElementById('nx').innerHTML='<button class="b" onclick="nx()">'+(i+1<Q.length?'التالي':'النتيجة')+'</button>'}
function nx(){i++;if(i<Q.length)show();else end()}
function end(){const A=document.getElementById('app');A.innerHTML='<div class="big">'+score+' / '+Q.length+'</div><p>'+(missed.length?'غلطت في: '+[...new Set(missed)].map(k=>D[k].name).join('، '):'ممتاز، مفيش أي غلطة 🎯')+'</p><button class="b" onclick="start()">إعادة (ترتيب جديد)</button>'+(missed.length?'<button class="b" onclick="start(missed)">أعد الغلط بس</button>':'')}
start();</script></body></html>
