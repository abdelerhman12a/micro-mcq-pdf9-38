": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 568, "stem": "Salmonella cholersuis causes:", "opts": ["Typhoid fever.", "Salmonella food poisoning.", "Cholera.", "Bacteremia and focal lesion."], "key": 3, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 569, "stem": "For which one of the following enteric illnesses is a chronic carrier state MOST likely to develop:", "opts": ["Campylobacter enterocolitis.", "Shigella enterocolitis.", "Typhoid fever.", "Cholera."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 570, "stem": "For diagnosis of typhoid fever in 1st week of infection:", "opts": ["The organism must be isolated from blood.", "An antibody titre above 1/80 is diagnostic.", "Organism can be isolated from urine.", "Organism can be isolated from stool."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 571, "stem": "The following salmonella species cause food poisoning:", "opts": ["Salmonella typhi.", "Salmonella paratyphi.", "Salmonella typhimurium.", "Salmonella cholerasuis."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 572, "stem": "Diagnosis of enteric fever during first week of fever is done by:", "opts": ["Blood culture.", "Urine culture.", "Widal test.", "Stool culture."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 573, "stem": "What is the TSI reaction of Salmonella Typhi?", "opts": ["Acidic butt, alkaline slant, black color, no gas.", "Alkaline butt, acidic slant, gas production.", "Acidic butt and slant, no gas.", "No change."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 574, "stem": "Which antigen divides Salmonella into serogroups?", "opts": ["H antigen.", "Vi antigen.", "O antigen.", "K antigen."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 575, "stem": "Which antigen divides Salmonella serogroups into serotypes?", "opts": ["O antigen.", "H antigen.", "Vi antigen.", "F antigen."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 576, "stem": "Which antigen may be present in some strains of S. Typhi?", "opts": ["O antigen.", "H antigen.", "Vi antigen.", "K antigen. 65"], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 577, "stem": "What is the most clinically important species of Salmonella?", "opts": ["S. enterica.", "S. choleraesuis.", "S. typhimurium.", "S. paratyphi."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 578, "stem": "Which subspecies of Salmonella enterica is most relevant to humans?", "opts": ["Subsp. arizonae.", "Subsp. diarizonae.", "Subsp. enterica.", "Subsp. salamae."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 579, "stem": "Which Salmonella species causes typhoid fever?", "opts": ["S. enteritidis.", "S. choleraesuis.", "S. typhi.", "S. typhimurium."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 580, "stem": "What is the mode of transmission of enteric fever?", "opts": ["Airborne.", "Faeco-oral.", "Blood contact.", "Skin contact."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 581, "stem": "What is the primary site of infection in enteric fever?", "opts": ["Large intestine.", "Liver.", "Small intestine.", "Kidney."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 582, "stem": "Where do Salmonella organisms replicate intracellularly during enteric fever?", "opts": ["Red blood cells.", "Peyer's patches macrophages.", "Neurons.", "Platelets."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 583, "stem": "What organs are involved in secondary bacteraemia in enteric fever?", "opts": ["Heart and lungs.", "Spleen, liver, bone marrow.", "Skin and muscles.", "Eyes and ears."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 584, "stem": "What is the incubation period of enteric fever?", "opts": ["1–3 days.", "3–5 days.", "1–2 weeks.", "2–4 weeks."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 585, "stem": "Which symptom is characteristic of enteric fever?", "opts": ["Rash on arms.", "Rose spots on abdomen.", "Blisters on legs.", "Swelling of face."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 586, "stem": "Which complication is associated with enteric fever?", "opts": ["Lung collapse.", "Intestinal hemorrhage & perforation.", "Kidney failure.", "Brain abscess."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 587, "stem": "What is the most reliable culture during the first week of enteric fever?", "opts": ["Stool culture.", "Urine culture.", "Blood culture.", "Skin swab."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 588, "stem": "What test detects anti-Salmonella antibodies in serum?", "opts": ["ELISA.", "Widal test.", "PCR.", "Western blot. 66"], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 589, "stem": "What is considered a significant Widal titer in endemic areas like Egypt?", "opts": ["≥ 1/160.", "≥ 1/40.", "≥ 1/80.", "≥ 1/20."], "key": 0, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 590, "stem": "Which antibiotic is contraindicated in children under 18 for Salmonella?", "opts": ["Ampicillin.", "Ciprofloxacin.", "Ceftriaxone.", "Doxycycline."], "key": 1, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 591, "stem": "What type of vaccine is the oral typhoid vaccine?", "opts": ["Killed whole-cell.", "Recombinant protein.", "Live avirulent mutant.", "Subunit."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 592, "stem": "What is the incubation period of Salmonella food poisoning?", "opts": ["1–6 hours.", "6–12 hours.", "12–48 hours.", "48–72 hours."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}, {"n": 593, "stem": "Which Salmonella species causes septicaemia with metastatic abscesses?", "opts": ["S. enteritidis.", "S. typhi.", "S. choleraesuis.", "S. paratyphi."], "key": 2, "exp": "", "src": "المفتاح المطبوع بتاع الملف (All Micro Questions - Book A)"}];

<div id="cgSrc" style="display:none"><div class="cg"><h1>Topics and theory-book pages</h1><div class="tw"><table><tr><th>Topic</th><th>Questions</th><th>Theory printed pages used</th></tr><tr data-l='Topic'><td>Salmonella</td><td data-l='Questions'>38 (+0 unverified)</td><td data-l='Pages'>printed key only</td></tr></table></div><div class="n">Answers marked "الإجابة من عندنا مش من الملف" are keyed from the theory book page shown, not from a printed key.</div></div></div>
<script>
const PAGE=window.__PAGE__;
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],i=0,mode='exam',ans={},submitted=false;
const L='ABCDEFGH';
function start(list,m){order=shuffle(list);i=0;mode=m;ans={};submitted=false;show()}
function home(){app.innerHTML=`<div class="card"><h2>${PAGE.title}</h2>
<p>${PAGE.intro}</p>
<p>${Q.length} questions${U.length?` + <b>${U.length} unverified</b> (listed at the bottom, not in the quiz)`:''}. Tap an answer in practice mode for instant feedback. Questions answered from the theory book are marked <span class="sk">الإجابة من عندنا مش من الملف</span> with the book page; the rest come from the file's printed key.</p>
<button class="btn g" onclick="start(Q,'practice')">Practice: all ${Q.length}</button>
<button class="btn g" onclick="start(shuffle(Q).slice(0,40),'practice')">Practice: 40 random</button>
<p><b>Exam mode:</b> answers only at the end, with score, review and "Retry missed only".</p>
<button class="btn" onclick="start(Q,'exam')">Exam: all ${Q.length}</button>
${U.length?`<p style="margin-top:8px"><button class="btn g" onclick="unv()">Unverified questions (مش متأكدين منها): ${U.length}</button></p>`:''}
<p style="margin-top:8px"><button class="btn g" onclick="guide()">Topic & page table (جدول المراجعة)</button></p>
<p style="margin-top:6px"><a href="index-weeks.html">Back to the all-weeks index</a></p>
</div>`}
function unv(){app.innerHTML=`<div class="card"><h2>Unverified (مش متأكدين منها)</h2><p>These questions are NOT in the theory book, so we did not invent answers for them. Check them with your doctor or lecture notes.</p></div>`+U.map(q=>`<div class="card uv"><b>${q.stem}</b>${q.opts.map((o,k)=>`<div>${L[k]}) ${o}</div>`).join('')}<div class="src">Why unverified: ${q.reason}</div></div>`).join('')+`<div class="card"><button class="btn g" onclick="home()">Back</button></div>`}
function guide(){location.hash='#review';app.innerHTML=`<div class="card"><button class="btn g" onclick="home()">Back to menu</button><button class="btn" onclick="start(Q,'practice')">Start practice: all ${Q.length}</button></div>`+document.getElementById('cgSrc').innerHTML;window.scrollTo(0,0)}
function nav(){return `<div class="grid">${order.map((q,k)=>`<span class="gi ${k===i?'cur':''} ${ans[k]!==undefined?'done':''}" onclick="go(${k})">${k+1}</span>`).join('')}</div>`}
function go(k){i=k;show()}
function badge(q){return q.sk?`<div class="sk">الإجابة من عندنا مش من الملف (كتاب النظري ص ${q.pg})</div>`:''}
function show(){
 const q=order[i];const sel=ans[i];const locked=mode==='practice'&&sel!==undefined;
 const n=Object.keys(ans).length;
 app.innerHTML=`<div class="top"><span>${mode==='practice'?'PRACTICE':'EXAM'} | Question ${i+1} / ${order.length}</span><span>Answered ${n}${mode==='practice'?` | Correct ${order.reduce((c,q,k)=>c+(ans[k]===q.key?1:0),0)}`:''}</span></div><div class="bar"><i style="width:${n/order.length*100}%"></i></div>
 <div class="card" style="margin-top:10px">${badge(q)}
 <div class="stem">${q.stem}</div><div id="opts">${q.opts.map((o,k)=>{let c='o';if(sel===k)c+=' sel';if(locked){if(k===q.key)c+=' ok';else if(sel===k)c+=' no'}return `<button class="${c}" onclick="pick(${k})">${L[k]}) ${o}</button>`}).join('')}</div>
 ${locked?`<div class="ex"><b>${sel===q.key?'Correct':'Wrong'}. Answer: ${L[q.key]}</b><br>${q.exp||''}<div class="src">${q.src}</div></div>`:''}
 <div style="margin-top:8px"><button class="btn g" ${i==0?'disabled':''} onclick="go(${i}-1)">Previous</button><button class="btn g" ${i>=order.length-1?'disabled':''} onclick="go(${i}+1)">Next</button><button class="btn" onclick="submit()">${mode==='practice'?'Finish &amp; score':'Submit &amp; see answers'}</button><button class="btn g" onclick="home()">Menu</button></div></div>
 <div class="card">${nav()}</div>`}
function pick(k){ if(mode==='practice'&&ans[i]!==undefined)return; ans[i]=k; show(); if(mode==='practice'){const x=document.querySelector('.ex');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function submit(){
 const un=order.length-Object.keys(ans).length;
 if(un>0&&!confirm(un+' unanswered. Finish anyway? Unanswered count as missed.'))return;
 submitted=true;let sc=0;const wrong=[];
 order.forEach((q,k)=>{if(ans[k]===q.key)sc++;else wrong.push(k)});
 app.innerHTML=`<div class="card"><h2>Result: ${sc} / ${order.length}</h2><p>${order.length-wrong.length} correct, ${wrong.length} missed (wrong or unanswered).</p>
 ${wrong.length?`<button class="btn" onclick="start(wrong.map(k=>order[k]),mode)">Retry missed only (${wrong.length})</button>`:'<p><b>No missed questions.</b></p>'}<button class="btn g" onclick="start(Q,mode)">New round: all</button><button class="btn g" onclick="home()">Home</button></div>
 <div class="card"><label><input type="checkbox" id="wo" onchange="rv()"> show missed only</label></div><div id="rv"></div>`;
 window.wrong=wrong;window.__o=order.slice();window.__a=Object.assign({},ans);rv()}
function rv(){
 const wo=document.getElementById('wo').checked;
 document.getElementById('rv').innerHTML=window.__o.map((q,k)=>{const a=window.__a[k];const ok=a===q.key;if(wo&&ok)return '';
 return `<div class="card rv"><b>${k+1}. ${q.stem}</b> ${badge(q)}
 ${q.opts.map((o,j)=>`<div class="ro ${j===q.key?'ok':''} ${j===a&&!ok?'no':''}">${L[j]}) ${o}${j===a?' (your answer)':''}</div>`).join('')}
 <div class="ex">${ok?'Correct':(a===undefined?'Not answered':'Wrong')}. Answer: ${L[q.key]}<br>${q.exp||''}<div class="src">${q.src}</div></div></div>`}).join('')}
if(location.hash==='#menu')home();else if(location.hash==='#exam')start(Q,'exam');else if(location.hash==='#review')guide();else start(Q,'practice');
</script></body></html>
